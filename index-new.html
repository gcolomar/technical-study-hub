as virtuales. ¿Qué explicarías y qué documentación consultarías?"},"answer":{"en":"Explain the Nitro architecture, hardware offload and isolation controls using published documentation. Distinguish AWS infrastructure controls from the customer’s responsibility for identities, guest software and application data. Validate the customer’s specific threat model and compliance evidence rather than offering an absolute security guarantee.","es":"Explica arquitectura Nitro, descarga a hardware y aislamiento con documentación pública. Distingue controles AWS de la responsabilidad del cliente sobre identidades, software invitado y datos. Valida modelo de amenazas y evidencia de cumplimiento en vez de ofrecer seguridad absoluta."},"related":["systems","cloud-ec2"],"sources":[{"label":"The Security Design of the AWS Nitro System","url":"https://docs.aws.amazon.com/whitepapers/latest/security-design-of-aws-nitro-system/security-design-of-aws-nitro-system.html"}],"level":"deep"},{"id":"systems-storage","parent":"systems","title":{"en":"Storage Fundamentals","es":"Fundamentos de almacenamiento"},"summary":{"en":"Block, object and file storage models and the tradeoffs that map directly onto EBS, S3 and EFS.","es":"Modelos de almacenamiento por bloques, objetos y archivos, y las diferencias que se mapean directamente a EBS, S3 y EFS."},"details":{"en":["Block storage exposes raw addressable blocks to the OS (a filesystem is built on top); object storage exposes whole immutable objects via HTTP APIs with rich metadata but no in-place partial edits; file storage exposes a shared hierarchical namespace over a network protocol (NFS/SMB). Choosing wrong causes real pain: object storage is not a POSIX filesystem, so lift-and-shift apps expecting file locks and byte-range in-place writes belong on EFS or FSx, not S3."],"es":["El almacenamiento por bloques expone bloques direccionables crudos al SO (un sistema de archivos se construye encima); el almacenamiento de objetos expone objetos completos e inmutables vía APIs HTTP con metadatos ricos pero sin ediciones parciales in situ; el almacenamiento de archivos expone un espacio de nombres jerarquico compartido sobre un protocolo de red (NFS/SMB). Elegir mal causa dolor real: el almacenamiento de objetos no es un sistema de archivos POSIX, así que las apps migradas que esperan bloqueos de archivo y escrituras parciales in situ pertenecen a EFS o FSx, no a S3."]},"aws":{"en":"EBS = block for a single EC2 instance (or Multi-Attach); S3 = object, durable and regional; EFS/FSx = shared file systems across instances/AZs.","es":"EBS = bloques para una sola instancia EC2 (o Multi-Attach); S3 = objetos, durable y regional; EFS/FSx = sistemas de archivos compartidos entre instancias/AZs."},"question":{"en":"A team wants to migrate a legacy app that uses file locks and in-place edits to the cloud cheaply. Why not S3?","es":"Un equipo quiere migrar barato a la nube una app legacy que usa bloqueos de archivo y ediciones in situ. ¿Por qué no S3?"},"answer":{"en":"Step 1: identify the app's dependency on POSIX semantics (locks, in-place partial writes). Step 2: rule out S3, since objects are immutable and written whole with no locking API. Step 3: choose EFS for Linux POSIX workloads shared across AZs, or FSx for Windows File Server for SMB workloads, and only revisit S3 after refactoring the app to an object-write pattern.","es":"Paso 1: identifica la dependencia de la app en semántica POSIX (bloqueos, escrituras parciales in situ). Paso 2: descarta S3, ya que los objetos son inmutables y se escriben completos sin API de bloqueo. Paso 3: elige EFS para cargas Linux POSIX compartidas entre AZs, o FSx for Windows File Server para cargas SMB, y reconsidera S3 solo después de refactorizar la app a un patrón de escritura de objetos."},"related":["systems-storage-types","systems-raid-durability","systems-filesystems"],"sources":[{"label":"Amazon S3 - What is Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"}],"level":"foundation"},{"id":"systems-storage-types","parent":"systems-storage","title":{"en":"Storage Media and Performance","es":"Medios de almacenamiento y rendimiento"},"summary":{"en":"HDD vs SSD, IOPS vs throughput, and how EBS volume types (gp3, io2, st1) map to these tradeoffs.","es":"HDD vs SSD, IOPS vs throughput, y como los tipos de volumen EBS (gp3, io2, st1) se mapean a estas compensaciones."},"details":{"en":["IOPS measures operations per second (latency-sensitive, small random reads/writes, e.g. databases); throughput measures MB/s (large sequential transfers, e.g. big data, logs). SSD-backed volumes (gp3, io2) are tuned for IOPS-sensitive workloads with independently provisionable IOPS and throughput on gp3; HDD-backed volumes (st1/sc1) are cheap per GB but only good for sequential throughput, not random small I/O, and cannot serve as a boot volume."],"es":["IOPS mide operaciones por segundo (sensible a latencia, lecturas/escrituras pequeñas y aleatorias, ej. bases de datos); throughput mide MB/s (transferencias secuenciales grandes, ej. big data, logs). Los volumenes basados en SSD (gp3, io2) están ajustados para cargas sensibles a IOPS con IOPS y throughput aprovisionables por separado en gp3; los volumenes basados en HDD (st1/sc1) son baratos por GB pero solo buenos para throughput secuencial, no E/S pequeña y aleatoria, y no pueden ser volumen de arranque."]},"aws":{"en":"gp3 for general purpose with independently tunable IOPS/throughput; io2 Block Express for high-IOPS databases; st1 for big-data/log throughput; sc1 for cold, infrequent access.","es":"gp3 para uso general con IOPS/throughput ajustables por separado; io2 Block Express para bases de datos de alto IOPS; st1 para throughput de big data/logs; sc1 para acceso frío e infrecuente."},"question":{"en":"A database on gp2 shows latency spikes during nightly batch jobs. What EBS change helps and why?","es":"Una base de datos en gp2 muestra picos de latencia durante trabajos por lotes nocturnos. ¿Qué cambio de EBS ayuda y por qué?"},"answer":{"en":"Step 1: recognize gp2 ties IOPS to volume size via a burst-bucket model, so sustained batch load can exhaust burst credits. Step 2: migrate to gp3, which decouples IOPS and throughput from size and lets you provision both independently without resizing the volume. Step 3: for very high and consistent IOPS needs, consider io2 Block Express instead, and validate with CloudWatch VolumeQueueLength and burst balance metrics before and after.","es":"Paso 1: reconoce que gp2 liga los IOPS al tamaño del volumen mediante un modelo de credito de rafaga, así que la carga sostenida por lotes puede agotar esos creditos. Paso 2: migra a gp3, que desacopla IOPS y throughput del tamaño y permite aprovisionar ambos por separado sin redimensionar el volumen. Paso 3: para necesidades de IOPS muy altas y constantes, considera io2 Block Express, y valida con las métricas de CloudWatch VolumeQueueLength y burst balance antes y después."},"related":["systems-storage","systems-raid-durability"],"sources":[{"label":"Amazon EBS Volume Types","url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html"}],"level":"applied"},{"id":"systems-raid-durability","parent":"systems-storage","title":{"en":"RAID Concepts and Durability","es":"Conceptos RAID y durabilidad"},"summary":{"en":"Striping and mirroring concepts underlying EBS snapshots, S3 durability design, and multi-AZ replication.","es":"Conceptos de striping y mirroring que subyacen a los snapshots de EBS, el diseño de durabilidad de S3, y la replicación multi-AZ."},"details":{"en":["RAID 0 (striping) improves throughput by spreading data across disks but reduces durability, since losing one disk loses all data; RAID 1 (mirroring) improves durability by duplicating data at the cost of capacity. AWS does not expose RAID directly for most services, but the same tradeoff shows up: the S3 Standard storage class achieves 11 nines durability by redundantly storing objects across multiple devices in at least three Availability Zones (the cheaper One Zone-IA class deliberately drops that AZ redundancy for lower cost), while a single EBS volume without snapshots has no such redundancy and a lost volume is a lost volume."],"es":["RAID 0 (striping) mejora el throughput distribuyendo datos entre discos pero reduce la durabilidad, ya que perder un disco pierde todos los datos; RAID 1 (mirroring) mejora la durabilidad duplicando datos a costo de capacidad. AWS no expone RAID directamente para la mayoria de servicios, pero la misma compensación aparece: la clase de almacenamiento S3 Standard logra 11 nueves de durabilidad almacenando objetos de forma redundante en múltiples dispositivos y al menos tres Zonas de Disponibilidad (la clase más economica One Zone-IA renuncia deliberadamente a esa redundancia entre AZs para reducir costo), mientras que un único volumen EBS sin snapshots no tiene tal redundancia y un volumen perdido es un volumen perdido."]},"aws":{"en":"EBS volumes are already replicated within one AZ but need snapshots (copied to another region for cross-region durability) for AZ-level and region-level recovery; S3 Standard is durable by design across AZs.","es":"Los volumenes EBS ya están replicados dentro de una AZ pero necesitan snapshots (copiados a otra región para durabilidad entre regiones) para recuperación a nivel de AZ y de región; S3 Standard es durable por diseño entre AZs."},"question":{"en":"A customer assumes EBS alone protects them from an AZ failure. What do you correct?","es":"Un cliente asume que EBS por si solo lo protege de una falla de AZ. ¿Qué corriges?"},"answer":{"en":"Step 1: clarify that an EBS volume lives in a single AZ and replicates only within that AZ for hardware-failure protection, not across AZs. Step 2: recommend automated EBS snapshots stored in S3 (itself multi-AZ durable within a region) for AZ-level recovery, and explicitly copy those snapshots to a second region for region-level recovery, a snapshot alone does not leave its region. Step 3: for databases, pair this with RDS Multi-AZ or application-level replication so a full AZ outage causes reduced downtime rather than none, Multi-AZ failover still takes time and is not an instantaneous guarantee.","es":"Paso 1: aclara que un volumen EBS vive en una sola AZ y se réplica solo dentro de esa AZ para protección ante fallas de hardware, no entre AZs. Paso 2: recomienda snapshots automatizados de EBS almacenados en S3 (durable entre AZs dentro de una región) para recuperación a nivel de AZ, y copia explicitamente esos snapshots a una segunda región para recuperación a nivel de región, un snapshot por si solo no sale de su región. Paso 3: para bases de datos, combina esto con RDS Multi-AZ o replicación a nivel de aplicación para que una falla completa de AZ cause una caida reducida en vez de ninguna, la conmutación Multi-AZ toma tiempo y no es una garantia instantánea."},"related":["systems-storage","disaster-recovery"],"sources":[{"label":"Amazon S3 Durability and Availability","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/DataDurability.html"}],"level":"applied"},{"id":"cloud","parent":null,"title":{"en":"Cloud Compute and Distributed Systems","es":"Cómputo en la nube y sistemas distribuidos"},"summary":{"en":"Compute options (EC2, Lambda, containers), elastic scaling, and the messaging patterns that hold distributed apps together.","es":"Opciones de cómputo (EC2, Lambda, contenedores), escalado elástico, y los patrones de mensajería que sostienen las apps distribuidas."},"details":{"en":["This root covers how to run code in AWS and how to make many running instances of that code cooperate reliably: choosing the right compute primitive, scaling it automatically, and decoupling components with queues and events so failures in one part do not cascade."],"es":["Esta raíz cubre como ejecutar código en AWS y como hacer que muchas instancias de ese código cooperen de forma confiable: elegir el primitivo de cómputo correcto, escalarlo automáticamente, y desacoplar componentes con colas y eventos para que las fallas en una parte no se propaguen en cascada."]},"aws":{"en":"Core services: EC2, Lambda, ECS/EKS/Fargate, Auto Scaling, SQS, SNS, EventBridge, Step Functions.","es":"Servicios centrales: EC2, Lambda, ECS/EKS/Fargate, Auto Scaling, SQS, SNS, EventBridge, Step Functions."},"question":{"en":"How do you decide between EC2, Lambda and containers for a new workload?","es":"¿Cómo decides entre EC2, Lambda y contenedores para una carga nueva?"},"answer":{"en":"Step 1: check execution duration and statefulness, Lambda caps at 15 minutes and is stateless per invocation. Step 2: check traffic pattern, spiky/unpredictable favors Lambda or Fargate for fast elastic scale, steady high-utilization favors EC2 with Reserved/Savings Plans for cost. Step 3: check operational preference, containers (ECS/EKS/Fargate) suit teams standardizing on Docker across on-prem and cloud, EC2 suits workloads needing OS-level control or licensing constraints.","es":"Paso 1: revisa la duración de ejecución y la estatalidad, Lambda tiene un tope de 15 minutos y es sin estado por invocación. Paso 2: revisa el patrón de tráfico, si es puntiagudo/impredecible favorece Lambda o Fargate para escalado elástico rápido, si es alto y estable favorece EC2 con Reserved/Savings Plans por costo. Paso 3: revisa la preferencia operativa, los contenedores (ECS/EKS/Fargate) convienen a equipos que estandarizan en Docker entre on-prem y la nube, EC2 conviene a cargas que necesitan control a nivel de SO o restricciones de licencia."},"related":["cloud-compute","cloud-distributed-systems"],"sources":[{"label":"AWS Compute Services Overview","url":"https://aws.amazon.com/products/compute/"}],"level":"foundation"},{"id":"cloud-compute","parent":"cloud","title":{"en":"Compute Options","es":"Opciones de cómputo"},"summary":{"en":"The three main ways to run code on AWS: virtual machines, managed containers, and serverless functions.","es":"Las tres formas principales de ejecutar código en AWS: maquinas virtuales, contenedores gestionados, y funciones serverless."},"details":{"en":["Compute choice drives most other architecture decisions: state handling, deployment model, scaling latency and cost model all differ between EC2, container orchestration, and Lambda. A well-architected review almost always starts by validating this choice against actual traffic and duration patterns rather than defaulting to what a team already knows."],"es":["La eleccion de cómputo impulsa la mayoria de las demás decisiones de arquitectura: el manejo de estado, el modelo de despliegue, la latencia de escalado y el modelo de costo difieren entre EC2, orquestacion de contenedores, y Lambda. Una revisión Well-Architected casí siempre empieza validando esta eleccion contra los patrones reales de tráfico y duración en lugar de usar por defecto lo que un equipo ya conoce."]},"aws":{"en":"EC2 for full control, ECS/EKS/Fargate for containers, Lambda for event-driven short-lived functions.","es":"EC2 para control total, ECS/EKS/Fargate para contenedores, Lambda para funciones de corta duración orientadas a eventos."},"question":{"en":"When is Lambda a poor fit despite its operational simplicity?","es":"¿Cuándo es Lambda una mala opción a pesar de su simplicidad operativa?"},"answer":{"en":"Step 1: check for long-running or stateful work, Lambda's 15-minute limit and stateless execution rule out long batch jobs or in-memory session state. Step 2: check for steady very-high-throughput workloads, where per-invocation pricing and cold starts can cost more and add latency versus a right-sized EC2 fleet. Step 3: check for specialized runtime/OS needs (custom kernels, GPU driver versions) that containers or EC2 support more directly.","es":"Paso 1: revisa si el trabajo es de larga duración o con estado, el limite de 15 minutos de Lambda y su ejecución sin estado descartan trabajos por lotes largos o estado de sesión en memoria. Paso 2: revisa cargas de throughput muy alto y estable, donde el precio por invocación y los arranques en frío pueden costar más y añadir latencia frente a una flota EC2 bien dimensionada. Paso 3: revisa necesidades especializadas de runtime/SO (kernels personalizados, versiones de drivers GPU) que los contenedores o EC2 soportan más directamente."},"related":["cloud-ec2","cloud-lambda","cloud-containers"],"sources":[{"label":"AWS Lambda Quotas","url":"https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html"}],"level":"foundation"},{"id":"cloud-ec2","parent":"cloud-compute","title":{"en":"EC2 and Instance Selection","es":"EC2 y selección de instancias"},"summary":{"en":"Instance families, purchasing options, and placement strategies for virtual machines in AWS.","es":"Familias de instancias, opciones de compra, y estrategias de colocacion para maquinas virtuales en AWS."},"details":{"en":["EC2 instance families are tuned for different bottlenecks: general purpose (m-series) balance CPU/memory, compute-optimized (c-series) favor CPU, memory-optimized (r/x-series) favor RAM, storage-optimized (i/d-series) favor local disk I/O. Purchasing options trade commitment for discount: On-Demand for unpredictable/short-lived, Reserved Instances or Savings Plans for steady baseline (up to ~72 percent off), Spot for interruptible/fault-tolerant workloads at up to 90 percent off but subject to 2-minute reclaim notice.","Pitfall: putting a stateful, non-fault-tolerant workload on Spot without a fallback strategy causes unplanned outages when capacity is reclaimed."],"es":["Las familias de instancias EC2 están ajustadas para diferentes cuellos de botella: uso general (m-series) balancean CPU/memoria, optimizadas para cómputo (c-series) favorecen CPU, optimizadas para memoria (r/x-series) favorecen RAM, optimizadas para almacenamiento (i/d-series) favorecen E/S de disco local. Las opciones de compra intercambian compromiso por descuento: On-Demand para impredecible/corta duración, Reserved Instances o Savings Plans para linea base estable (hasta ~72 por ciento de descuento), Spot para cargas interrumpibles/tolerantes a fallas con hasta 90 por ciento de descuento pero sujetas a aviso de recuperación de 2 minutos.","Error común: poner una carga con estado y no tolerante a fallas en Spot sin una estrategia de respaldo causa caidas no planeadas cuando se recupera la capacidad."]},"aws":{"en":"Combine Auto Scaling groups with mixed instance policies (On-Demand baseline plus Spot burst) for cost-efficient resilience.","es":"Combina grupos de Auto Scaling con políticas de instancias mixtas (linea base On-Demand más rafaga Spot) para resiliencia eficiente en costo."},"question":{"en":"A customer wants to cut EC2 cost 60 percent for a fault-tolerant batch pipeline without redesigning it. What do you propose?","es":"Un cliente quiere reducir el costo de EC2 en 60 por ciento para un pipeline de lotes tolerante a fallas sin rediseñarlo. ¿Qué propones?"},"answer":{"en":"Step 1: confirm the workload is stateless and can checkpoint or retry, which is the precondition for Spot. Step 2: move the batch fleet to Spot Instances with a diversified instance-type pool across multiple AZs to reduce simultaneous reclaim risk. Step 3: keep a small On-Demand or Savings Plan baseline if any part of the pipeline cannot tolerate interruption, and use Spot interruption notices to checkpoint gracefully.","es":"Paso 1: confirma que la carga es sin estado y puede hacer checkpoint o reintentar, que es la condicion previa para Spot. Paso 2: mueve la flota de lotes a instancias Spot con un pool diversificado de tipos de instancia entre múltiples AZs para reducir el riesgo de recuperación simultanea. Paso 3: mantiene una pequeña linea base On-Demand o Savings Plan si alguna parte del pipeline no tolera interrupción, y usa los avisos de interrupción de Spot para hacer checkpoint de forma ordenada."},"related":["cloud-compute","cloud-scaling","cost-optimization"],"sources":[{"label":"Amazon EC2 Instance Purchasing Options","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html"}],"level":"applied"},{"id":"cloud-lambda","parent":"cloud-compute","title":{"en":"Lambda and Serverless Compute","es":"Lambda y cómputo serverless"},"summary":{"en":"Event-driven, stateless functions with automatic scaling and per-invocation billing; the tradeoffs versus servers.","es":"Funciones sin estado orientadas a eventos con escalado automático y facturacion por invocación; las compensaciones frente a servidores."},"details":{"en":["Lambda executes functions without customer-managed servers, but concurrency limits, scaling rates, downstream capacity and cost still require planning. An invocation has a maximum duration of 15 minutes; temporary storage and execution environments are not durable state. Reuse can help connection pooling, but persistence is not guaranteed. Initialization can affect latency. Provisioned Concurrency or supported SnapStart configurations may help selected workloads; benchmark and check compatibility. VPC access does not automatically provide Internet connectivity."],"es":["Lambda ejecuta funciones sin servidores gestionados por el cliente, pero límites de concurrencia, escalado, capacidad posterior y costes requieren planificación. Una invocación dura como máximo 15 minutos; almacenamiento temporal y entornos no son estado duradero. Reutilizar ayuda con conexiones, sin garantizar persistencia. La inicialización afecta latencia. Provisioned Concurrency o SnapStart compatible pueden ayudar; mide y verifica compatibilidad. Acceso VPC no implica Internet automático."]},"aws":{"en":"Use Provisioned Concurrency for latency-critical APIs, reserved concurrency to protect downstream systems, and Lambda destinations/DLQs for async failure handling.","es":"Usa Provisioned Concurrency para APIs críticas en latencia, concurrencia reservada para proteger sistemas aguas abajo, y destinos Lambda/DLQ para manejo de fallas asincronas."},"question":{"en":"A Lambda-backed API has occasional 2-second latency spikes on the first request after idle periods. Why, and what mitigates it?","es":"Una API Lambda tiene picos de latencia tras períodos inactivos. ¿Cómo comprobarías si se deben a la inicialización y qué opciones evaluarías?"},"answer":{"en":"Check initialization duration and traces to test the cold-start hypothesis; also investigate DNS, connection setup and downstream latency. Reduce unnecessary initialization and package weight. If the latency objective still requires it, evaluate Provisioned Concurrency or supported SnapStart with realistic traffic and cost measurements.","es":"Comprueba duración de inicialización y trazas para probar la hipótesis de arranque en frío; investiga también DNS, conexiones y latencia posterior. Reduce inicialización y paquete innecesarios. Si el objetivo lo requiere, evalúa Provisioned Concurrency o SnapStart compatible con tráfico y coste reales."},"related":["cloud-compute","systems-memory","cloud-scaling"],"sources":[{"label":"AWS Lambda Execution Environment","url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html"}],"level":"applied"},{"id":"cloud-containers","parent":"cloud-compute","title":{"en":"Containers: ECS, EKS and Fargate","es":"Contenedores: ECS, EKS y Fargate"},"summary":{"en":"Container orchestration choices on AWS and the serverless-vs-managed-node tradeoff within them.","es":"Opciones de orquestacion de contenedores en AWS y la compensación entre serverless y nodos gestionados dentro de ellas."},"details":{"en":["ECS is AWS's native orchestrator, simpler to operate and tightly integrated with IAM/CloudWatch; EKS is managed Kubernetes, chosen for portability, existing K8s tooling, or multi-cloud strategy, at the cost of more operational complexity. Both can run on EC2 (you manage node capacity/patching) or Fargate (AWS manages the underlying compute, you just specify vCPU/memory per task/pod). Fargate removes node management but costs more per vCPU-hour than a well-utilized EC2 fleet and has less control over instance type/placement."],"es":["ECS es el orquestador nativo de AWS, más simple de operar e integrado estrechamente con IAM/CloudWatch; EKS es Kubernetes gestionado, elegido por portabilidad, herramientas K8s existentes, o estrategia multi-nube, a costo de mayor complejidad operativa. Ambos pueden correr en EC2 (tu gestionas la capacidad/parches de los nodos) o Fargate (AWS gestiona el cómputo subyacente, tu solo especificas vCPU/memoria por tarea/pod). Fargate elimina la gestión de nodos pero cuesta más por vCPU-hora que una flota EC2 bien utilizada y tiene menos control sobre tipo de instancia/colocacion."]},"aws":{"en":"Choose ECS+Fargate for AWS-native simplicity with no node management; choose EKS when Kubernetes portability or existing K8s investment matters.","es":"Elige ECS+Fargate para simplicidad nativa de AWS sin gestión de nodos; elige EKS cuando importa la portabilidad de Kubernetes o la inversion existente en K8s."},"question":{"en":"A startup with no Kubernetes experience needs containers in production fast, with minimal ops overhead. What do you recommend and why?","es":"Una startup sin experiencia en Kubernetes necesita contenedores en producción rápido, con mínima carga operativa. ¿Qué recomiendas y por qué?"},"answer":{"en":"Step 1: rule out EKS unless there is a strong portability or existing-tooling reason, since it adds control-plane and node-group operational surface the team is not staffed for. Step 2: recommend ECS on Fargate, which removes node patching/capacity planning entirely and integrates natively with IAM task roles and CloudWatch. Step 3: revisit EKS later only if multi-cloud portability or specific K8s ecosystem tools become a hard requirement.","es":"Paso 1: descarta EKS a menos que haya una razon fuerte de portabilidad o herramientas existentes, ya que añade superficie operativa de plano de control y grupos de nodos para la que el equipo no está dotado. Paso 2: recomienda ECS sobre Fargate, que elimina por completo el parchado/planificación de capacidad de nodos y se integra nativamente con roles de tarea IAM y CloudWatch. Paso 3: reconsidera EKS más adelante solo si la portabilidad multi-nube o herramientas especificas del ecosistema K8s se vuelven un requisito duro."},"related":["cloud-compute","systems-processes","cloud-microservices"],"sources":[{"label":"Amazon ECS vs EKS Comparison","url":"https://aws.amazon.com/containers/"}],"level":"applied"},{"id":"cloud-scaling","parent":"cloud","title":{"en":"Elastic Scaling","es":"Escalado elástico"},"summary":{"en":"Auto Scaling groups, target tracking policies, and the difference between scaling EC2 fleets versus serverless concurrency.","es":"Grupos de Auto Scaling, políticas de seguimiento de objetivo, y la diferencia entre escalar flotas EC2 y concurrencia serverless."},"details":{"en":["EC2 Auto Scaling groups add/remove instances based on metrics (target tracking on CPU, custom CloudWatch metrics, or scheduled actions), with launch templates defining what a new instance looks like and health checks (EC2 or ELB) deciding when to replace one. Serverless services (Lambda, Fargate) scale differently: Lambda scales concurrency near-instantly up to account/region limits and burst quotas, Fargate scales tasks similarly to an ASG but without managing underlying hosts.","Pitfall: setting scale-out thresholds too high (e.g., 80 percent CPU) without accounting for the time a new instance takes to become healthy, causing a request pile-up during the scale-up lag."],"es":["Los grupos de Auto Scaling de EC2 anaden/quitan instancias segun métricas (seguimiento de objetivo en CPU, métricas personalizadas de CloudWatch, o acciones programadas), con plantillas de lanzamiento que definen como es una instancia nueva y chequeos de salud (EC2 o ELB) que decide cuando reemplazar una. Los servicios serverless (Lambda, Fargate) escalan de forma diferente: Lambda escala la concurrencia casí al instante hasta los límites de cuenta/región y cuotas de rafaga, Fargate escala tareas de forma similar a un ASG pero sin gestionar los hosts subyacentes.","Error común: fijar umbrales de escalado demasiado altos (ej. 80 por ciento de CPU) sin contar el tiempo que tarda una instancia nueva en volverse saludable, causando una acumulacion de solicitudes durante el retraso del escalado."]},"aws":{"en":"Use target tracking scaling policies with predictive scaling for known traffic patterns, and warm pools to cut launch latency for stateful bootstrapping.","es":"Usa políticas de escalado por seguimiento de objetivo con escalado predictivo para patrones de tráfico conocidos, y warm pools para reducir la latencia de lanzamiento en bootstrapping con estado."},"question":{"en":"An e-commerce site's ASG scales out correctly but users still see errors for the first 3 minutes of a traffic spike. What is the likely cause and fix?","es":"Un sitio de e-commerce escala correctamente su ASG pero los usuarios ven errores durante los primeros 3 minutos de un pico de tráfico. ¿Cuál es la causa probable y la solución?"},"answer":{"en":"Step 1: check the scale-out threshold and instance boot/warm-up time, since new instances take minutes to launch, pass health checks and warm caches/connections. Step 2: consider predictive scaling if the traffic spike is recurring and forecastable (e.g., daily sale time), letting the ASG pre-scale ahead of demand. Step 3: use warm pools or a slightly lower scale-out threshold combined with a request queue or graceful degradation to absorb the gap.","es":"Paso 1: revisa el umbral de escalado y el tiempo de arranque/calentamiento de la instancia, ya que las instancias nuevas tardan minutos en lanzarse, pasar chequeos de salud y calentar caches/conexiones. Paso 2: considera escalado predictivo si el pico de tráfico es recurrente y pronosticable (ej. hora diaria de oferta), permitiendo que el ASG escale antes de la demanda. Paso 3: usa warm pools o un umbral de escalado ligeramente más bajo combinado con una cola de solicitudes o degradación elegante para absorber la brecha."},"related":["cloud-ec2","cloud-lambda","reliability","improve-performance"],"sources":[{"label":"EC2 Auto Scaling - Target Tracking Policies","url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html"}],"level":"applied","quickLinks":["improve-performance"]},{"id":"cloud-distributed-systems","parent":"cloud","title":{"en":"Distributed Applications","es":"Aplicaciones distribuidas"},"summary":{"en":"Decoupling components across a network so failures are isolated and each part scales independently.","es":"Desacoplar componentes a través de la red para que las fallas queden aisladas y cada parte escale de forma independiente."},"details":{"en":["A distributed application splits work across independently deployable, independently scalable services communicating over a network rather than in-process. This buys resilience and independent scaling but introduces new failure modes: partial failures, network latency/partitions, and the need for idempotency since a message or call can be retried after an ambiguous failure (did it actually apply or not?)."],"es":["Una aplicación distribuida divide el trabajo entre servicios desplegables y escalables de forma independiente que se comunican por red en lugar de en proceso. Esto compra resiliencia y escalado independiente pero introduce nuevos modos de falla: fallas parciales, latencia/particiones de red, y la necesidad de idempotencia ya que un mensaje o llamada puede reintentarse tras una falla ambigua (se aplico realmente o no?)."]},"aws":{"en":"SQS, SNS, EventBridge and Step Functions are the primary AWS building blocks for decoupling and orchestrating distributed workflows.","es":"SQS, SNS, EventBridge y Step Functions son los bloques principales de AWS para desacoplar y orquestar flujos de trabajo distribuidos."},"question":{"en":"Why is idempotency a first-class design concern in distributed systems, not just a nice-to-have?","es":"¿Por qué la idempotencia es una preocupación de diseño de primera clase en sistemas distribuidos, no solo algo deseable?"},"answer":{"en":"Step 1: recognize that network calls can fail after the operation partially succeeded server-side but before the client gets a confirmation, an ambiguous outcome. Step 2: without idempotency, a naive retry (which is often the only sane recovery action) can double-apply the operation, e.g. double-charging a payment. Step 3: design operations with idempotency keys or natural idempotency (e.g., an upsert by ID) so retries are always safe, this is required for at-least-once delivery systems like SQS.","es":"Paso 1: reconoce que las llamadas de red pueden fallar después de que la operación tuvo éxito parcial en el servidor pero antes de que el cliente reciba confirmacion, un resultado ambiguo. Paso 2: sin idempotencia, un reintento simple (que a menudo es la única accion de recuperación sensata) puede aplicar la operación dos veces, ej. cobrar un pago dos veces. Paso 3: disena las operaciones con claves de idempotencia o idempotencia natural (ej. un upsert por ID) para que los reintentos siempre sean seguros, esto es necesario para sistemas de entrega al menos una vez como SQS."},"related":["cloud-queues-messaging","cloud-microservices","data-consistency"],"sources":[{"label":"Amazon SQS - At-Least-Once Delivery","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html"}],"level":"foundation"},{"id":"cloud-queues-messaging","parent":"cloud-distributed-systems","title":{"en":"Queues, Pub/Sub and Event-Driven Messaging","es":"Colas, pub/sub y mensajería orientada a eventos"},"summary":{"en":"SQS, SNS and EventBridge as decoupling primitives, and the exactly-once versus at-least-once nuance.","es":"SQS, SNS y EventBridge como primitivas de desacople, y la sutileza entre exactamente-una-vez y al-menos-una-vez."},"details":{"en":["SQS Standard provides at-least-once delivery and best-effort ordering. FIFO preserves order within a message group and deduplicates eligible producer retries within a five-minute deduplication interval; this does not prevent consumer redelivery after a visibility timeout or failure before deletion. End-to-end business effects need idempotency. SNS provides fan-out, while EventBridge routes matching events between supported sources and targets. Select using ordering, retention, replay, throughput and subscriber requirements."],"es":["SQS Standard ofrece entrega al menos una vez y orden de mejor esfuerzo. FIFO preserva orden por grupo y elimina reintentos duplicados elegibles del productor en un intervalo de cinco minutos; no impide reentrega al consumidor tras timeout de visibilidad o fallo antes de borrar. Los efectos de negocio necesitan idempotencia. SNS distribuye a suscriptores y EventBridge enruta eventos entre fuentes y destinos compatibles. Elige según orden, retención, reproducción, capacidad y suscriptores."]},"aws":{"en":"SQS for point-to-point work queues, SNS for fan-out notifications, EventBridge for cross-service event routing with filtering.","es":"SQS para colas de trabajo punto a punto, SNS para notificaciones de difusion, EventBridge para enrutamiento de eventos entre servicios con filtrado."},"question":{"en":"A team built a payment processor on SQS FIFO and assumes duplicate charges are impossible. Why is that assumption wrong?","es":"Un equipo construyó un procesador de pagos sobre SQS FIFO y asume que los cobros duplicados son imposibles. ¿Por qué esa suposición es incorrecta?"},"answer":{"en":"Step 1: clarify FIFO exactly-once applies to the queue's message deduplication, not to the consumer's execution. Step 2: identify the real risk window, if the consumer charges the card then crashes before deleting the message (or before the visibility timeout expires), SQS will redeliver it and the consumer may charge again. Step 3: fix by making the charge operation idempotent at the payment gateway (idempotency key per order), independent of queue-level guarantees.","es":"Paso 1: aclara que el exactamente-una-vez de FIFO aplica a la deduplicacion de mensajes de la cola, no a la ejecución del consumidor. Paso 2: identifica la ventana de riesgo real, si el consumidor cobra la tarjeta y luego falla antes de borrar el mensaje (o antes de que expire el tiempo de visibilidad), SQS lo reentregara y el consumidor puede cobrar de nuevo. Paso 3: corrige haciendo idempotente la operación de cobro en el gateway de pagos (clave de idempotencia por orden), independiente de las garantías a nivel de cola."},"related":["cloud-distributed-systems","data-consistency"],"sources":[{"label":"Amazon SQS FIFO Queues","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html"},{"label":"Amazon EventBridge - What Is Amazon EventBridge","url":"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html"}],"level":"applied"},{"id":"cloud-microservices","parent":"cloud-distributed-systems","title":{"en":"Microservices and Service Boundaries","es":"Microservicios y límites de servicio"},"summary":{"en":"Splitting an application along business capability lines, and the operational cost that split introduces.","es":"Dividir una aplicación segun capacidades de negocio, y el costo operativo que esa division introduce."},"details":{"en":["Microservices split a system into independently deployable services, usually bounded by business capability (orders, inventory, payments) rather than technical layer. This enables independent scaling, deployment and team ownership, but adds distributed-systems complexity: network calls replace in-process function calls, requiring service discovery, retries with backoff, circuit breakers, and distributed tracing to debug a request across services. A monolith is often the right starting point; splitting too early adds this cost before the team has enough scale or organizational reasons to need it."],"es":["Los microservicios dividen un sistema en servicios desplegables de forma independiente, usualmente delimitados por capacidad de negocio (ordenes, inventario, pagos) en lugar de capa técnica. Esto permite escalado, despliegue y propiedad de equipo independientes, pero añade complejidad de sistemas distribuidos: las llamadas de red reemplazan llamadas de función en proceso, requiriendo descubrimiento de servicios, reintentos con backoff, circuit breakers, y trazabilidad distribuida para depurar una solicitud entre servicios. Un monolito suele ser el punto de partida correcto; dividir muy pronto añade este costo antes de que el equipo tenga suficiente escala o razones organizacionales para necesitarlo."]},"aws":{"en":"API Gateway/App Mesh/ECS Service Connect for service-to-service communication; X-Ray for distributed tracing across microservices.","es":"API Gateway/App Mesh/ECS Service Connect para comunicación entre servicios; X-Ray para trazabilidad distribuida entre microservicios."},"question":{"en":"A 5-person startup asks whether they should start with microservices to be ready to scale. What do you advise?","es":"Una startup de 5 personas pregunta si debería empezar con microservicios para estar lista para escalar. ¿Qué aconsejas?"},"answer":{"en":"Step 1: point out that microservices solve organizational and independent-scaling problems that a 5-person team building one product does not yet have. Step 2: recommend starting with a well-structured monolith (clear internal module boundaries) that can be deployed as a unit, which is faster to build, test and debug end to end. Step 3: plan the internal module boundaries along the same business-capability lines you would eventually split on, so extraction into services later is a refactor, not a rewrite, when team size or scale actually demands it.","es":"Paso 1: señala que los microservicios resuelven problemas organizacionales y de escalado independiente que un equipo de 5 personas construyendo un producto aún no tiene. Paso 2: recomienda empezar con un monolito bien estructurado (límites internos de módulo claros) que se pueda desplegar como unidad, lo cual es más rápido de construir, probar y depurar de extremo a extremo. Paso 3: planifica los límites internos de módulo segun las mismas lineas de capacidad de negocio en las que eventualmente dividirias, para que extraerlos a servicios más adelante sea un refactor, no una reescritura, cuando el tamaño del equipo o la escala realmente lo exijan."},"related":["cloud-distributed-systems","cloud-containers","architecture-discovery"],"sources":[{"label":"AWS X-Ray Developer Guide","url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html"}],"level":"deep"},{"id":"data","parent":null,"title":{"en":"Data Storage and Processing","es":"Almacenamiento y procesamiento de datos"},"summary":{"en":"Relational and NoSQL databases, caching, streaming, and the consistency models that connect them.","es":"Bases de datos relacionales y NoSQL, caché, streaming, y los modelos de consistencia que las conectan."},"details":{"en":["This root covers how to choose and combine data stores: when a relational model with transactions fits, when a NoSQL model trades flexibility for scale, how caching reduces load at the cost of staleness, and how streaming handles continuous data instead of discrete queries."],"es":["Esta raíz cubre cómo elegir y combinar almacenes de datos: cuándo encaja un modelo relacional con transacciones, cuándo un modelo NoSQL cambia flexibilidad por escala, cómo el caché reduce la carga a costa de datos desactualizados, y cómo el streaming maneja datos continuos en vez de consultas discretas."]},"aws":{"en":"Core services: RDS/Aurora, DynamoDB, ElastiCache, Kinesis/MSK, Redshift.","es":"Servicios centrales: RDS/Aurora, DynamoDB, ElastiCache, Kinesis/MSK, Redshift."},"question":{"en":"How do you choose between a relational database and DynamoDB for a new service?","es":"¿Cómo eliges entre una base de datos relacional y DynamoDB para un servicio nuevo?"},"answer":{"en":"Step 1: identify whether data access is predictable by key (known reads/writes by ID ahead of time), which favors DynamoDB. Step 2: identify whether you need complex multi-table transactions, ad hoc joins, or flexible analytical queries, which favors a relational database like Aurora. Step 3: consider expected scale and latency; DynamoDB gives single-digit millisecond latency at any scale without managing servers, while a relational database requires planning instance size and read replicas as it grows.","es":"Paso 1: identifica si el acceso a datos es predecible por clave (lecturas/escrituras por ID conocidas de antemano), lo cual favorece a DynamoDB. Paso 2: identifica si necesitas transacciones multi-tabla complejas, joins ad hoc o consultas analíticas flexibles, lo cual favorece a una base relacional como Aurora. Paso 3: considera la escala esperada y la latencia; DynamoDB da latencia de un solo dígito de milisegundos a cualquier escala sin gestionar servidores, mientras que una base relacional requiere planificar el tamaño de instancia y réplicas de lectura al crecer."},"related":["data-sql","data-nosql"],"sources":[{"label":"Choosing an AWS Database Service","url":"https://aws.amazon.com/products/databases/"}],"level":"foundation"},{"id":"data-sql","parent":"data","title":{"en":"Relational Databases (SQL)","es":"Bases de datos relacionales (SQL)"},"summary":{"en":"RDS and Aurora: transactions, joins, and the Multi-AZ versus read-replica distinction that trips up most people.","es":"RDS y Aurora: transacciones, joins, y la distinción entre Multi-AZ y réplicas de lectura que confunde a la mayoría."},"details":{"en":["Relational databases enforce a schema and support ACID transactions and joins across tables, ideal when data integrity and complex queries matter more than raw horizontal scale. RDS runs standard engines (MySQL, PostgreSQL, etc.); Aurora is AWS's MySQL/PostgreSQL-compatible engine with a distributed storage layer that gives higher throughput and faster failover.","Common confusion: Multi-AZ deploys a synchronous standby in another AZ purely for failover (the standby is not readable and does not add read capacity); read replicas are asynchronous copies that DO serve read traffic and improve read scalability, but are not primarily a high-availability mechanism, promoting one to primary during a failure is a manual, slower, and potentially lossy operation compared to Multi-AZ automatic failover."],"es":["Las bases de datos relacionales imponen un esquema y soportan transacciones ACID y joins entre tablas, ideal cuando la integridad de datos y las consultas complejas importan más que la escala horizontal bruta. RDS ejecuta motores estándar (MySQL, PostgreSQL, etc.); Aurora es el motor compatible con MySQL/PostgreSQL de AWS con una capa de almacenamiento distribuido que da mayor throughput y conmutación por error más rápida.","Confusión común: Multi-AZ despliega un standby síncrono en otra AZ únicamente para conmutación por error (el standby no es legible y no añade capacidad de lectura); las réplicas de lectura son copias asíncronas que SÍ sirven tráfico de lectura y mejoran la escalabilidad de lectura, pero no son principalmente un mecanismo de alta disponibilidad, promover una a primaria durante una falla es una operación manual, más lenta y potencialmente con pérdida de datos comparada con la conmutación automática de Multi-AZ."]},"aws":{"en":"Use Multi-AZ for automatic failover/high availability, read replicas (including cross-region) for read scaling, and Aurora Global Database for cross-region DR with faster RPO/RTO than snapshots.","es":"Usa Multi-AZ para conmutación automática por error/alta disponibilidad, réplicas de lectura (incluso entre regiones) para escalado de lectura, y Aurora Global Database para DR entre regiones con RPO/RTO más rápido que los snapshots."},"question":{"en":"A team enables 3 read replicas and assumes their database is now highly available. What is wrong with that assumption?","es":"Un equipo habilita tres réplicas de lectura y asume que ya tiene alta disponibilidad. ¿Qué comprobarías sobre replicación y failover?"},"answer":{"en":"Step 1: clarify that read replicas do not automatically promote to primary if the primary instance fails, it is a manual process and replicas may lag (asynchronous replication), risking data loss. Step 2: recommend enabling Multi-AZ for automatic, synchronous failover in addition to the read replicas, they are complementary mechanisms, not substitutes. Step 3: for cross-region DR, evaluate Aurora Global Database, which offers RPO/RTO in seconds instead of minutes or hours with snapshots.","es":"Paso 1: aclara que las réplicas de lectura no promueven automáticamente a primaria si la instancia primaria falla, es un proceso manual y las réplicas pueden estar rezagadas (replicación asíncrona), causando pérdida de datos. Paso 2: recomienda habilitar Multi-AZ para conmutación automática y síncrona por error además de las réplicas de lectura, son mecanismos complementarios, no sustitutos. Paso 3: para DR entre regiones, evalúa Aurora Global Database, que ofrece RPO/RTO en segundos en vez de minutos u horas con snapshots."},"related":["data-consistency","disaster-recovery","reliability"],"sources":[{"label":"Amazon RDS Multi-AZ Deployments","url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html"},{"label":"Amazon Aurora Global Database","url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html"}],"level":"applied"},{"id":"data-nosql","parent":"data","title":{"en":"NoSQL Databases (DynamoDB)","es":"Bases de datos NoSQL (DynamoDB)"},"summary":{"en":"Key-value/document access patterns, partition key design, and the scale DynamoDB unlocks by giving up joins.","es":"Patrones de acceso clave-valor/documento, diseño de clave de partición, y la escala que DynamoDB desbloquea al renunciar a los joins."},"details":{"en":["DynamoDB is a managed key-value/document store that partitions data by hash of the partition key, scaling near-linearly by spreading load across partitions. The design discipline is inverted from relational modeling: instead of normalizing and querying flexibly later, you model tables around the specific access patterns you will query (single-table design is common), because DynamoDB has no server-side joins and query flexibility is limited to the primary key and secondary indexes defined up front.","Pitfall: choosing a low-cardinality partition key (e.g., a status field with 3 values) creates hot partitions, since DynamoDB throughput is distributed per-partition, a skewed key concentrates traffic and throttles requests even when overall table capacity looks fine. Note this also applies to any Global Secondary Index that reuses the same low-cardinality attribute as its own partition key, the GSI will have its own hot-partition problem independent of the base table."],"es":["DynamoDB es un almacén administrado clave-valor/documento que particiona los datos por el hash de la clave de partición, escalando casí linealmente al distribuir la carga entre particiones. La disciplina de diseño está invertida respecto al modelado relacional: en vez de normalizar y consultar con flexibilidad después, modelas las tablas alrededor de los patrones de acceso específicos que consultarás (el diseño de tabla única es común), porque DynamoDB no tiene joins del lado del servidor y la flexibilidad de consulta se limita a la clave primaria y los índices secundarios definidos de antemano.","Error común: elegir una clave de partición de baja cardinalidad (ej. un campo de estado con 3 valores) crea particiones calientes, ya que el throughput de DynamoDB se distribuye por partición, una clave sesgada concentra el tráfico y limita las solicitudes aunque la capacidad total de la tabla se vea bien. Esto también aplica a cualquier índice secundario global que reutilice el mismo atributo de baja cardinalidad como su propia clave de partición, ese GSI tendrá su propio problema de partición caliente independiente de la tabla base."]},"aws":{"en":"DynamoDB Streams for change data capture, Global Tables for multi-region active-active, on-demand capacity for unpredictable traffic.","es":"DynamoDB Streams para captura de cambios, Global Tables para multi-región activo-activo, capacidad on-demand para tráfico impredecible."},"question":{"en":"A table using order status (pending/shipped/delivered) as the partition key is throttling under load. What is the root cause and fix?","es":"Una tabla usa el estado del pedido como clave de partición y sufre limitación de solicitudes. ¿Cómo diagnosticarías y corregirías el problema?"},"answer":{"en":"Step 1: identify that only 3 possible values mean only a handful of physical partitions receive all traffic, a hot-partition pattern; confirm using DynamoDB Contributor Insights, which surfaces the most-accessed keys and correlate with throttling metrics. Step 2: check whether a Global Secondary Index also uses status as its partition key, since that GSI would carry the same hot-partition problem independently of the base table. Step 3: redesign both the base table and any such GSI to use a high-cardinality key (e.g., order ID), and use write sharding (adding a random or calculated suffix to the low-cardinality attribute) if the access pattern still needs to query by status at scale.","es":"Paso 1: identifica que solo 3 valores posibles significan que solo un puñado de particiones físicas reciben todo el tráfico, un patrón de partición caliente; confirmalo usando DynamoDB Contributor Insights, que muestra las claves más accedidas y correlaciónalo con las métricas de limitación. Paso 2: revisa si algun índice secundario global también usa el estado como su clave de partición, ya que ese GSI tendría el mismo problema de partición caliente de forma independiente a la tabla base. Paso 3: rediseña tanto la tabla base como cualquier GSI de ese tipo para usar una clave de alta cardinalidad (ej. ID de pedido), y usa sharding de escritura (añadiendo un sufijo aleatorio o calculado al atributo de baja cardinalidad) si el patrón de acceso aún necesita consultar por estado a escala."},"related":["data-consistency","data-caching"],"sources":[{"label":"DynamoDB Partitions and Data Distribution","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.Partitions.html"}],"level":"applied"},{"id":"data-caching","parent":"data","title":{"en":"Caching Strategies","es":"Estrategias de caché"},"summary":{"en":"ElastiCache patterns (cache-aside, write-through) and the staleness/invalidation tradeoffs they introduce.","es":"Patrones de ElastiCache (caché-aside, write-through) y las compensaciones de datos desactualizados/invalidación que introducen."},"details":{"en":["Cache-aside (lazy loading) reads from cache first, falls back to the database on a miss, and populates the cache for next time; simple and resilient to cache failures but the first request after eviction always pays full database latency. Write-through updates the cache synchronously with every database write, keeping data fresh but adding write latency and caching data that may never be read. Redis (via ElastiCache) also supports pub/sub, sorted sets and other structures beyond simple key-value, useful for leaderboards, rate limiting and session stores.","Pitfall: caching without a TTL or invalidation strategy on data that changes causes stale reads that are hard to reproduce, since the bug only appears for keys that happen to still be cached. Also note the cache write and the database write are two separate systems, ElastiCache and RDS/DynamoDB do not share a transaction, so invalidate or update the cache only AFTER the database commit succeeds, and use a versioned value or an outbox pattern if you need reliable delivery of the invalidation even across failures, rather than assuming both writes happen together."],"es":["Caché-aside (carga perezosa) lee primero de la caché, recurre a la base de datos en caso de fallo (miss), y llena la caché para la próxima vez; simple y resiliente a fallas de caché pero la primera solicitud tras un desalojo siempre paga la latencia completa de la base de datos. Write-through actualiza la caché de forma síncrona con cada escritura a la base de datos, manteniendo los datos frescos pero añadiendo latencia de escritura y cacheando datos que quizás nunca se lean. Redis (vía ElastiCache) también soporta pub/sub, sorted sets y otras estructuras más allá de clave-valor simple, útil para tablas de clasificación, limitación de tasa y almacenes de sesión.","Error común: cachear sin una estrategia de TTL o invalidacion en datos que cambian causa lecturas desactualizadas dificiles de reproducir, ya que el error solo aparece para claves que resultan seguir en caché. Además, la escritura de caché y la escritura de base de datos son dos sistemas separados, ElastiCache y RDS/DynamoDB no comparten una transacción, así que invalida o actualiza la caché solo Después de que la escritura a la base de datos se confirme con éxito, y usa un valor versionado o un patrón outbox si necesitas entrega confiable de la invalidacion incluso ante fallas, en vez de asumir que ambas escrituras ocurren juntas."]},"aws":{"en":"ElastiCache for Redis/Memcached in front of RDS/DynamoDB; DAX as a DynamoDB-native in-memory cache for microsecond reads.","es":"ElastiCache para Redis/Memcached frente a RDS/DynamoDB; DAX como caché en memoria nativa de DynamoDB para lecturas en microsegundos."},"question":{"en":"Users occasionally see outdated prices on a product page even after an admin updates them. What is the likely cause and fix?","es":"Los usuarios ven datos antiguos después de una actualización. ¿Cómo comprobarías la caché y mejorarías la invalidación?"},"answer":{"en":"Step 1: identify the site is likely using cache-aside without active invalidation, so the stale cache entry stays alive until its TTL expires. Step 2: confirm by checking the configured TTL against how long the problem persists after an update. Step 3: fix by invalidating or updating the cache key immediately after the database write commits successfully, not as part of the same transaction since ElastiCache and the database are separate systems; for stronger reliability against a crash between the two steps, add a version number to the cached value or write the invalidation through an outbox pattern.","es":"Paso 1: identifica que el sitio probablemente usa caché-aside sin invalidacion activa, así que la entrada antigua de caché sigue viva hasta que expira su TTL. Paso 2: confirma revisando el TTL configurado contra cuanto tiempo persiste el problema tras una actualizacion. Paso 3: corrige invalidando o actualizando la clave de caché inmediatamente después de que la escritura a la base de datos se confirme con éxito, no como parte de la misma transacción ya que ElastiCache y la base de datos son sistemas separados; para mayor confiabilidad ante una falla entre ambos pasos, añade un numero de versión al valor cacheado o escribe la invalidacion mediante un patrón outbox."},"related":["data-consistency","data-nosql"],"sources":[{"label":"Amazon ElastiCache Caching Strategies","url":"https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/Strategies.html"}],"level":"applied"},{"id":"data-streaming","parent":"data","title":{"en":"Streaming Data","es":"Datos en streaming"},"summary":{"en":"Kinesis and MSK: processing continuous, unbounded data instead of querying data at rest.","es":"Kinesis y MSK: procesar datos continuos e ilimitados en vez de consultar datos en reposo."},"details":{"en":["Streaming platforms (Kinesis Data Streams, Amazon MSK for Kafka) ingest continuous events into ordered, partitioned, replayable logs, letting multiple independent consumers process the same stream at their own pace without coordinating with the producer. Kinesis Data Streams shards define both throughput and the ordering unit (records with the same partition key land in the same shard, preserving order within it); MSK gives full Kafka semantics for teams standardizing on that ecosystem. Kinesis Data Firehose, by contrast, is a simpler delivery pipe (stream to S3/Redshift/OpenSearch) with no custom consumer logic, not a general streaming platform."],"es":["Las plataformas de streaming (Kinesis Data Streams, Amazon MSK para Kafka) ingieren eventos continuos en registros ordenados, particionados y reproducibles, permitiendo que múltiples consumidores independientes procesen el mismo stream a su propio ritmo sin coordinarse con el productor. Los shards de Kinesis Data Streams definen tanto el throughput como la unidad de orden (los registros con la misma clave de partición van al mismo shard, preservando el orden dentro de él); MSK da semántica completa de Kafka para equipos que estandarizan en ese ecosistema. Kinesis Data Firehose, en cambio, es una tubería de entrega más simple (stream a S3/Redshift/OpenSearch) sin lógica de consumidor personalizada, no una plataforma de streaming general."]},"aws":{"en":"Kinesis Data Streams for custom real-time processing with multiple consumers; Firehose for simple delivery to storage/analytics sinks; MSK when Kafka compatibility is required.","es":"Kinesis Data Streams para procesamiento en tiempo real personalizado con múltiples consumidores; Firehose para entrega simple a almacenes/análisis; MSK cuando se requiere compatibilidad con Kafka."},"question":{"en":"A clickstream pipeline needs both a real-time fraud-detection consumer and a separate batch-loading consumer to S3. Why is Kinesis Data Streams a better fit than Firehose here?","es":"Un pipeline de clickstream necesita tanto un consumidor de detección de fraude en tiempo real como un consumidor separado de carga por lotes a S3. ¿Por qué Kinesis Data Streams es mejor opción que Firehose aquí?"},"answer":{"en":"Step 1: recognize Firehose delivers to a single configured destination without exposing the stream to custom consumer logic. Step 2: identify that two independent consumers reading the same data for different purposes and speeds are needed, which requires a replayable event log. Step 3: use Kinesis Data Streams, where each consumer maintains its own checkpoint (offset) and can read the stream at its own pace, and optionally add Firehose as a third consumer just for the simple S3 load if that managed path is still wanted.","es":"Paso 1: reconoce que Firehose entrega a un único destino configurado sin exponer el stream a lógica de consumidor personalizada. Paso 2: identifica que se necesitan dos consumidores independientes leyendo el mismo dato con diferentes propósitos y velocidades, lo cual requiere un log de eventos reproducible. Paso 3: usa Kinesis Data Streams, donde cada consumidor mantiene su propio checkpoint (offset) y puede leer el stream a su ritmo, y opcionalmente añade Firehose como un tercer consumidor solo para la carga simple a S3 si aún se desea esa ruta administrada."},"related":["data-consistency","cloud-distributed-systems"],"sources":[{"label":"Amazon Kinesis Data Streams - Key Concepts","url":"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html"}],"level":"applied"},{"id":"data-consistency","parent":"data","title":{"en":"Consistency Models","es":"Modelos de consistencia"},"summary":{"en":"Strong vs eventual consistency, and the precise, narrow meaning of CAP in a partitioned system.","es":"Consistencia fuerte vs eventual, y el significado preciso y acotado de CAP en un sistema particionado."},"details":{"en":["Strong consistency has a precise operation-order meaning; eventual consistency allows temporarily stale replicas and convergence under its stated assumptions. DynamoDB supports strongly consistent reads for tables and local secondary indexes, not global secondary indexes. Global Tables offer different consistency modes with distinct regional and feature constraints, so check the selected mode. CAP concerns behavior during a network partition: linearizable consistency and availability for every request cannot both be guaranteed across the separated system. Outside partitions, latency and coordination trade-offs still exist."],"es":["La consistencia fuerte tiene un significado preciso sobre orden de operaciones; la eventual permite réplicas desactualizadas y convergencia bajo sus supuestos. DynamoDB admite lecturas fuertes en tablas e índices secundarios locales, no en globales. Global Tables ofrece modos distintos con restricciones de región y funciones: revisa el elegido. CAP se refiere a particiones de red: no se puede garantizar simultáneamente consistencia linealizable y disponibilidad para toda solicitud en el sistema separado. Fuera de particiones siguen existiendo costes de coordinación y latencia."]},"aws":{"en":"DynamoDB strongly consistent reads, RDS/Aurora synchronous replication within Multi-AZ, S3 strong read-after-write consistency for all operations since December 2020.","es":"Lecturas fuertemente consistentes de DynamoDB, replicación síncrona de RDS/Aurora dentro de Multi-AZ, consistencia fuerte de lectura tras escritura en S3 para todas las operaciones desde diciembre de 2020."},"question":{"en":"A candidate says CAP theorem means you must always sacrifice either consistency or availability in a distributed database. What is the correction?","es":"Un candidato afirma que CAP exige sacrificar siempre consistencia o disponibilidad. ¿Cómo matizarías esa afirmación?"},"answer":{"en":"Step 1: clarify CAP only applies DURING an actual network partition, not as a permanent tradeoff during normal operation. Step 2: give a counterexample: S3 offers strong read-after-write consistency and high availability simultaneously in the normal case. Step 3: explain the real design decision is choosing what to do specifically during a partition (reject writes to preserve consistency, or accept them and reconcile later to preserve availability), not a permanent global choice between C and A.","es":"Paso 1: precisa que CAP solo aplica DURANTE una partición de red real, no como una compensación permanente en operación normal. Paso 2: da un contraejemplo: S3 ofrece consistencia fuerte de lectura tras escritura y alta disponibilidad simultáneamente en el caso normal. Paso 3: explica que el diseño real consiste en elegir qué hacer específicamente durante una partición (rechazar escrituras para mantener consistencia, o aceptarlas y reconciliar después para mantener disponibilidad), no una elección global permanente entre C y A."},"related":["data-nosql","data-sql","cloud-distributed-systems"],"sources":[{"label":"Amazon S3 Strong Consistency","url":"https://aws.amazon.com/s3/consistency/"},{"label":"DynamoDB Read Consistency","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html"}],"level":"deep"},{"id":"data-warehousing","parent":"data","title":{"en":"Data Warehousing and Analytics","es":"Almacenamiento de datos analíticos"},"summary":{"en":"Redshift and the OLTP-vs-OLAP split: why analytical queries need a different storage layout than transactional ones.","es":"Redshift y la división OLTP-vs-OLAP: por qué las consultas analíticas necesitan un diseño de almacenamiento distinto al transaccional."},"details":{"en":["Transactional databases (OLTP) store rows together to make single-record reads/writes fast; analytical workloads (OLAP) typically scan and aggregate a few columns across millions of rows, which is what columnar storage optimizes for, reading only the needed columns instead of whole rows. Redshift uses columnar storage and massively parallel processing across nodes, and Redshift Spectrum can query data directly in S3 without loading it, useful for querying infrequently-accessed historical data without paying to store it twice.","Pitfall: running heavy ad hoc analytical queries directly against a production OLTP database (RDS) competes for the same I/O and locks as live transactions, degrading customer-facing latency; the fix is separating analytical workloads onto a warehouse or read replica dedicated to that traffic."],"es":["Las bases de datos transaccionales (OLTP) almacenan filas juntas para hacer rápidas las lecturas/escrituras de un solo registro; las cargas analíticas (OLAP) típicamente escanean y agregan pocas columnas a través de millones de filas, que es justo lo que optimiza el almacenamiento columnar, leyendo solo las columnas necesarias en vez de filas completas. Redshift usa almacenamiento columnar y procesamiento masivamente paralelo entre nodos, y Redshift Spectrum puede consultar datos directamente en S3 sin cargarlos, útil para consultar datos históricos poco accedidos sin pagar por almacenarlos dos veces.","Error común: ejecutar consultas analíticas ad hoc pesadas directamente contra una base de datos OLTP de producción (RDS) compite por la misma E/S y bloqueos que las transacciones en vivo, degradando la latencia de cara al cliente; la solución es separar las cargas analíticas a un almacén de datos o una réplica de lectura dedicada a ese tráfico."]},"aws":{"en":"Redshift for petabyte-scale columnar analytics; Athena for serverless ad hoc SQL on S3 data; Redshift Spectrum to bridge S3 and Redshift without duplicating data.","es":"Redshift para análisis columnar a escala de petabytes; Athena para SQL ad hoc sin servidor sobre datos en S3; Redshift Spectrum para conectar S3 y Redshift sin duplicar datos."},"question":{"en":"A finance team's monthly reporting queries against the production RDS instance are slowing down checkout for customers. What is the fix?","es":"Los informes mensuales sobre RDS ralentizan el checkout. ¿Qué alternativas evaluarías para separar ambas cargas?"},"answer":{"en":"Step 1: identify the root cause, heavy aggregate analytical queries compete for I/O and locks with checkout transactions on the same instance. Step 2: separate the workloads by creating a read replica dedicated to reporting, or better, exporting the data to an analytical warehouse like Redshift optimized for that query pattern. Step 3: validate checkout latency returns to baseline after moving reporting traffic off the primary instance.","es":"Paso 1: identifica la causa raíz, las consultas analíticas de agregación pesada compiten por I/O y bloqueos con las transacciones de checkout en la misma instancia. Paso 2: separa las cargas creando una réplica de lectura dedicada a reportes, o mejor, exportando los datos a un almacén analítico como Redshift optimizado para ese patrón de consulta. Paso 3: valida que la latencia de checkout vuelva a la línea base tras mover el tráfico de reportes fuera de la instancia principal."},"related":["data-sql","cost-optimization"],"sources":[{"label":"Amazon Redshift Columnar Storage","url":"https://docs.aws.amazon.com/redshift/latest/dg/c_columnar_storage_disk_mem_mgmnt.html"}],"level":"applied"},{"id":"security","parent":null,"title":{"en":"Security and Governance","es":"Seguridad y gobernanza"},"summary":{"en":"Identity, data protection and governance, designed around the shared responsibility model.","es":"Identidad, protección de datos y gobernanza, según el modelo de responsabilidad compartida."},"details":{"en":["Security in AWS follows the shared responsibility model: AWS secures the infrastructure, the customer secures what they configure on top (IAM policies, encryption settings, network exposure, patching guest OS). This root covers the identity and data-protection controls most commonly misconfigured in real environments."],"es":["La seguridad en AWS sigue el modelo de responsabilidad compartida: AWS protege la infraestructura, el cliente protege lo que configura encima (políticas IAM, ajustes de cifrado, exposición de red, parches del SO invitado). Esta raíz cubre los controles de identidad y protección de datos más comúnmente mal configurados en entornos reales."]},"aws":{"en":"Core services: IAM, KMS, Secrets Manager, Organizations/SCPs, GuardDuty, CloudTrail, Config.","es":"Servicios centrales: IAM, KMS, Secrets Manager, Organizations/SCPs, GuardDuty, CloudTrail, Config."},"question":{"en":"What security foundations would you check in a new AWS environment?","es":"¿Qué fundamentos de seguridad revisarías en un entorno AWS nuevo?"},"answer":{"en":"Start with the workload and data classification. Review workforce access, root-account protection and least-privilege roles, then public exposure and data protection. Verify centralized audit logging and an incident-response owner. Which party patches or operates a component depends on the service and deployment model.","es":"Empieza por la carga y clasificación de datos. Revisa acceso del personal, protección de root y roles de mínimo privilegio; después exposición pública y protección de datos. Verifica auditoría centralizada y responsable de incidentes. Quién parchea u opera cada componente depende del servicio y modelo de despliegue."},"related":["iam","encryption","security-governance","improve-security"],"sources":[{"label":"AWS Shared Responsibility Model","url":"https://aws.amazon.com/compliance/shared-responsibility-model/"}],"level":"foundation","quickLinks":["improve-security"]},{"id":"iam","parent":"security","title":{"en":"IAM: Identity and Access Management","es":"IAM: gestión de identidad y acceso"},"summary":{"en":"Understand explicit denies, permission grants and the policies that limit those grants.","es":"Comprende las denegaciones explícitas, los permisos y las políticas que los limitan."},"details":{"en":["An applicable explicit deny overrides an allow. Beyond that, evaluation depends on account relationships, policy types and the principal named in a resource policy. Same-account identity and resource policies can contribute a union of permissions, while boundaries, session policies and organization controls impose limits in applicable cases. Cross-account access generally needs authorization on both sides. Resource grants to a user, role or role session have important differences; do not summarize the entire model as either a universal union or intersection. SCPs and boundaries do not grant permissions. Prefer roles and temporary credentials over long-lived access keys."],"es":["Una denegación explícita aplicable prevalece sobre un permiso. Después, la evaluación depende de cuentas, tipos de política y principal nombrado en la política del recurso. Dentro de una cuenta, políticas de identidad y recurso pueden unir permisos, mientras límites, políticas de sesión y controles organizativos restringen en los casos aplicables. El acceso entre cuentas generalmente requiere autorización en ambos lados. Conceder a usuario, rol o sesión tiene diferencias importantes; no reduzcas todo a unión o intersección universal. SCP y límites no conceden permisos. Prefiere roles y credenciales temporales."]},"aws":{"en":"Prefer IAM roles (temporary credentials via STS) over long-lived IAM user access keys; use permission boundaries and SCPs as guardrails, not as the primary grant mechanism.","es":"Prefiere roles IAM (credenciales temporales vía STS) sobre llaves de acceso de usuario IAM de larga duración; usa límites de permisos y SCPs como barandillas, no como el mecanismo principal de otorgamiento."},"question":{"en":"An identity policy allows s3:GetObject, but the request returns AccessDenied. How do you investigate?","es":"¿Cómo investigas AccessDenied si la política de identidad permite s3:GetObject?"},"answer":{"en":"Identify the actual principal, account, action, resource ARN and request context. Look for applicable explicit denies and limiting SCPs, RCPs, boundaries or session policies. Check bucket and endpoint policies and cross-account grants. For SSE-KMS, also verify the relevant KMS authorization. Use logs and policy tools as evidence, not as a substitute for the real request context.","es":"Identifica principal real, cuenta, acción, ARN y contexto. Busca denegaciones aplicables y restricciones SCP, RCP, límites o políticas de sesión. Revisa políticas del bucket y endpoint y permisos entre cuentas. Con SSE-KMS verifica también autorización KMS. Usa logs y herramientas de políticas como evidencia sin sustituir el contexto real."},"related":["encryption","secrets-management","security-governance"],"sources":[{"label":"IAM JSON Policy Evaluation Logic","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html"},{"label":"IAM Policy Types","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html#access_policy-types"}],"level":"deep"},{"id":"encryption","parent":"security","title":{"en":"Encryption: At Rest and In Transit","es":"Cifrado: en reposo y en tránsito"},"summary":{"en":"KMS key hierarchy, envelope encryption, and the customer-managed vs AWS-managed key tradeoff.","es":"Jerarquía de llaves de KMS, cifrado de sobre (envelope), y la compensación entre llaves gestionadas por el cliente y por AWS."},"details":{"en":["Envelope encryption uses a data key to encrypt bulk data and a KMS key to protect that data key. Keep plaintext data keys only as long as needed. Customer-managed KMS keys provide control over policies, grants and lifecycle; AWS-managed and AWS-owned keys have different visibility and control. CloudTrail can record supported KMS API activity, but an application using a cached data key does not call KMS for each data read. TLS protects data between its termination points; encryption at rest protects stored representations. Neither replaces access control."],"es":["El cifrado de sobre usa una clave de datos para el contenido y una clave KMS para protegerla. Conserva claves de datos en claro solo lo necesario. Las claves KMS administradas por el cliente permiten controlar políticas, concesiones y ciclo de vida; las administradas o propiedad de AWS tienen otra visibilidad y control. CloudTrail registra actividad API KMS compatible, pero usar una clave cacheada no llama a KMS por cada lectura. TLS protege entre puntos de terminación; el cifrado en reposo protege datos almacenados. Ninguno sustituye el control de acceso."]},"aws":{"en":"S3 SSE-KMS, encrypted EBS and RDS, and ACM-backed TLS illustrate different encryption boundaries. Verify each service’s key use and logging behavior.","es":"S3 SSE-KMS, EBS y RDS cifrados y TLS con ACM ilustran distintos límites de cifrado. Verifica uso de claves y registros de cada servicio."},"question":{"en":"Can disabling a KMS key instantly revoke access to every copy of decrypted data?","es":"¿Deshabilitar una clave KMS revoca instantáneamente todo acceso a copias descifradas?"},"answer":{"en":"No. It blocks applicable future KMS operations after the change takes effect, but cannot erase plaintext already retrieved or cached data keys. Use a customer-managed key when policy control is required, combine it with identity and application controls, and design cache lifetime, grants and incident response explicitly. Audit KMS operations and data-access events separately where needed.","es":"No. Bloquea operaciones KMS futuras aplicables cuando el cambio surte efecto, pero no borra datos ya descifrados ni claves cacheadas. Usa claves administradas por el cliente si necesitas control de políticas y combínalas con controles de identidad y aplicación. Diseña caducidad de cachés, concesiones y respuesta a incidentes. Audita operaciones KMS y eventos de acceso por separado cuando proceda."},"related":["iam","secrets-management"],"sources":[{"label":"AWS KMS Concepts - Envelope Encryption","url":"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#enveloping"}],"level":"applied"},{"id":"secrets-management","parent":"security","title":{"en":"Secrets Management","es":"Gestión de secretos"},"summary":{"en":"Store and rotate credentials with controlled runtime access; never rely on deleting an exposed secret.","es":"Almacena y rota credenciales con acceso controlado; borrar un secreto expuesto no basta."},"details":{"en":["Secrets Manager stores secrets and supports rotation through supported managed integrations or rotation functions. Parameter Store supports SecureString values encrypted with KMS; SecureString is a parameter type, not a pricing tier. Pricing and rotation capabilities differ, so check current requirements. Applications need least-privilege access, safe caching and a strategy for reconnecting after rotation. Do not commit credentials to repositories or place them in logs or plaintext user data. Removing a leaked secret from the latest commit does not invalidate it or erase history."],"es":["Secrets Manager almacena secretos y admite rotación mediante integraciones administradas compatibles o funciones de rotación. Parameter Store admite valores SecureString cifrados con KMS; SecureString es un tipo, no un nivel de precios. Precios y rotación difieren; revisa los requisitos actuales. Las aplicaciones necesitan mínimo privilegio, caché segura y reconexión tras rotar. No guardes credenciales en repositorios, logs o user data en claro. Quitarlas del último commit no las invalida ni borra el historial."]},"aws":{"en":"Secrets Manager for credentials needing automatic rotation; Parameter Store SecureString for lower-cost config secrets; never store secrets in code, env files committed to git, or plaintext user-data.","es":"Secrets Manager para credenciales que necesitan rotación automática; Parameter Store SecureString para secretos de configuración de menor costo; nunca almacenes secretos en código, archivos de entorno en git, o user-data en texto claro."},"question":{"en":"A security review finds a database password hardcoded in an application's source code repository. What is the remediation sequence?","es":"Una revisión de seguridad encuentra una contraseña de base de datos incrustada en el repositorio de códig
