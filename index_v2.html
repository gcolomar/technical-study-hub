líticas de identidad. Cómo se combinan depende del principal nombrado y de los tipos de política, porque conceder a un usuario, a un rol o a una sesión no es igual, y una denegación explícita aplicable siempre gana.","Los productos se derivan. AWS Security Token Service emite las credenciales temporales de un rol, IAM Identity Center centraliza el acceso, y IAM Access Analyzer valida políticas de mínimo privilegio. AWS aconseja federar a las personas y dar roles a las cargas.","Ejemplo resuelto. Una función Lambda recibe AccessDenied en s3:GetObject aunque su política lo permite. El bucket está en otra cuenta y su política nombra otro rol. El acceso entre cuentas necesita permiso en ambos lados. El siguiente fallo es la clave KMS, que necesita autorización en su política de clave, y una concesión donde el servicio la use."]},"pitfalls":{"en":["Believing a service control policy or permissions boundary can grant access. They only lower a maximum, so deleting the grant itself leaves the caller with nothing.","Reading a cross account failure as one missing policy. Both sides must allow it, and an encrypted resource adds a key authorization."],"es":["Creer que una política de control de servicio o un límite de permisos conceden acceso. Solo bajan un máximo, así que borrar la concesión deja al solicitante sin nada.","Leer un fallo entre cuentas como una sola política ausente. Ambos lados deben permitirlo, y un recurso cifrado añade una autorización de clave."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html","label":"docs.aws.amazon.com: reference policies evaluation logic"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html","label":"docs.aws.amazon.com: access policies"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"}]}},{"id":"encryption","parent":"security","title":{"en":"Encryption: At Rest and In Transit","es":"Cifrado: en reposo y en tránsito"},"summary":{"en":"Protect data with cryptographic keys, distinguishing encryption from access authorization.","es":"Protege datos con claves criptográficas y distingue el cifrado de la autorización de acceso."},"details":{"en":["Envelope encryption uses a data key to encrypt bulk data and a KMS key to protect that data key. Keep plaintext data keys only as long as needed. Customer-managed KMS keys provide control over policies, grants and lifecycle; AWS-managed and AWS-owned keys have different visibility and control. CloudTrail can record supported KMS API activity, but an application using a cached data key does not call KMS for each data read. TLS protects data between its termination points; encryption at rest protects stored representations. Neither replaces access control."],"es":["El cifrado de sobre usa una clave de datos para el contenido y una clave KMS para protegerla. Conserva claves de datos en claro solo lo necesario. Las claves KMS administradas por el cliente permiten controlar políticas, concesiones y ciclo de vida; las administradas o propiedad de AWS tienen otra visibilidad y control. CloudTrail registra actividad API KMS compatible, pero usar una clave cacheada no llama a KMS por cada lectura. TLS protege entre puntos de terminación; el cifrado en reposo protege datos almacenados. Ninguno sustituye el control de acceso."]},"aws":{"en":"S3 SSE-KMS, encrypted EBS and RDS, and ACM-backed TLS illustrate different encryption boundaries. Verify each service’s key use and logging behavior.","es":"S3 SSE-KMS, EBS y RDS cifrados y TLS con ACM ilustran distintos límites de cifrado. Verifica uso de claves y registros de cada servicio."},"question":{"en":"Can disabling a KMS key instantly revoke access to every copy of decrypted data?","es":"¿Deshabilitar una clave KMS revoca instantáneamente todo acceso a copias descifradas?"},"answer":{"en":"No. It blocks applicable future KMS operations after the change takes effect, but cannot erase plaintext already retrieved or cached data keys. Use a customer-managed key when policy control is required, combine it with identity and application controls, and design cache lifetime, grants and incident response explicitly. Audit KMS operations and data-access events separately where needed.","es":"No. Bloquea operaciones KMS futuras aplicables cuando el cambio surte efecto, pero no borra datos ya descifrados ni claves cacheadas. Usa claves administradas por el cliente si necesitas control de políticas y combínalas con controles de identidad y aplicación. Diseña caducidad de cachés, concesiones y respuesta a incidentes. Audita operaciones KMS y eventos de acceso por separado cuando proceda."},"related":["iam","secrets-management"],"sources":[{"label":"AWS KMS Concepts - Envelope Encryption","url":"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#enveloping"},{"url":"https://docs.aws.amazon.com/kms/latest/developerguide/data-keys.html","label":"docs.aws.amazon.com: data keys"}],"level":"applied","learning":{"definition":{"en":"Encryption converts readable data into ciphertext that only a holder of the right key can reverse, applied to data at rest in storage or to data in transit between two endpoints.","es":"El cifrado convierte datos legibles en texto cifrado que solo quien tiene la clave puede revertir, aplicado a datos en reposo o en tránsito entre dos extremos."},"simple":{"en":"The data is scrambled, and only the key holder can unscramble it.","es":"Los datos se vuelven ilegibles y solo quien tiene la clave los recupera."},"analogy":{"en":"A locked shipping container: anyone can move it, nobody reads it without the key. The limit is that encryption at rest is usually transparent to authorized callers, so the storage service decrypts for anyone your policies allow. It protects the stored copy, not the decision about who may ask.","es":"Un contenedor cerrado: cualquiera puede moverlo, nadie lo lee sin la llave. El límite es que el cifrado en reposo suele ser transparente para los solicitantes autorizados, así que el servicio descifra para quien tus políticas permitan. Protege la copia guardada, no quién puede pedirla."},"walkthrough":{"en":["Concepts first. A key is the secret input to the algorithm. Envelope encryption means encrypting the bulk data with a short lived data key, then encrypting that data key with a higher level key, and storing the ciphertext together with the encrypted copy of the data key. The plaintext data key is dropped from memory as soon as you no longer need it.","Then the types. Data at rest is what sits on disk. Data in transit is protected by TLS, Transport Layer Security, and only between its termination points. Key types differ too: customer managed keys give you the policy, rotation and deletion, AWS managed keys you cannot re-policy, and AWS owned keys you cannot audit.","Products implement this. AWS KMS generates a data key and returns a plaintext copy plus an encrypted copy, and never stores your data keys. S3 with SSE-KMS, encrypted EBS and RDS, and certificates from AWS Certificate Manager cover common cases. Outside AWS the same ideas appear in OpenSSL or LUKS.","Worked example. A reporting bucket should be readable by one analytics role. You create a customer managed key, allow that role in the key policy, and enable SSE-KMS. A second team holding s3:GetObject still fails because it lacks kms:Decrypt, which shows the two checks are separate."],"es":["Primero los conceptos. Una clave es la entrada secreta del algoritmo. El cifrado de sobre significa cifrar el contenido con una clave de datos de vida corta, cifrar esa clave con una clave superior, y guardar el texto cifrado junto con la copia cifrada de la clave de datos. La copia en claro de la clave de datos se descarta de memoria en cuanto ya no se necesita.","Luego los tipos. Los datos en reposo están en disco. Los datos en tránsito los protege TLS, Transport Layer Security, solo entre sus puntos de terminación. Las claves también difieren: las gestionadas por el cliente te dan política, rotación y borrado, las gestionadas por AWS no permiten cambiar la política, y las propiedad de AWS no puedes auditarlas.","Los productos lo implementan. AWS KMS genera una clave de datos y devuelve una copia en claro y otra cifrada, y no guarda tus claves de datos. S3 con SSE-KMS, EBS y RDS cifrados, y certificados de AWS Certificate Manager cubren los casos comunes. Fuera de AWS están OpenSSL o LUKS.","Ejemplo resuelto. Un bucket de informes debe leerlo un rol de analítica. Creas una clave gestionada por el cliente, permites ese rol en la política de clave y activas SSE-KMS. Otro equipo con s3:GetObject sigue fallando porque le falta kms:Decrypt, lo que muestra que son dos comprobaciones separadas."]},"pitfalls":{"en":["Assuming encryption answers the authorization question. Keys protect the stored copy, while IAM and key policies decide who may ask for plaintext.","Expecting every read to appear as a KMS call. An application holding a cached data key decrypts locally, so no new key use is logged."],"es":["Suponer que el cifrado responde a la autorización. Las claves protegen la copia guardada, e IAM y la política de clave deciden quién pide texto claro.","Esperar que cada lectura sea una llamada a KMS. Una aplicación con una clave de datos cacheada descifra localmente y no se registra uso nuevo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html","label":"docs.aws.amazon.com: concepts"},{"url":"https://docs.aws.amazon.com/kms/latest/developerguide/data-keys.html","label":"docs.aws.amazon.com: data keys"}]}},{"id":"secrets-management","parent":"security","title":{"en":"Secrets Management","es":"Gestión de secretos"},"summary":{"en":"Store, retrieve and rotate credentials safely, including recovery after exposure.","es":"Almacena, recupera y rota credenciales de forma segura, incluida la respuesta tras una exposición."},"details":{"en":["Secrets Manager stores secrets and supports rotation through supported managed integrations or rotation functions. Parameter Store supports SecureString values encrypted with KMS; SecureString is a parameter type, not a pricing tier. Pricing and rotation capabilities differ, so check current requirements. Applications need least-privilege access, safe caching and a strategy for reconnecting after rotation. Do not commit credentials to repositories or place them in logs or plaintext user data. Removing a leaked secret from the latest commit does not invalidate it or erase history."],"es":["Secrets Manager almacena secretos y admite rotación mediante integraciones administradas compatibles o funciones de rotación. Parameter Store admite valores SecureString cifrados con KMS; SecureString es un tipo, no un nivel de precios. Precios y rotación difieren; revisa los requisitos actuales. Las aplicaciones necesitan mínimo privilegio, caché segura y reconexión tras rotar. No guardes credenciales en repositorios, logs o user data en claro. Quitarlas del último commit no las invalida ni borra el historial."]},"aws":{"en":"Secrets Manager for credentials needing automatic rotation; Parameter Store SecureString for lower-cost config secrets; never store secrets in code, env files committed to git, or plaintext user-data.","es":"Secrets Manager para credenciales que necesitan rotación automática; Parameter Store SecureString para secretos de configuración de menor costo; nunca almacenes secretos en código, archivos de entorno en git, o user-data en texto claro."},"question":{"en":"A security review finds a database password hardcoded in an application's source code repository. What is the remediation sequence?","es":"Una revisión de seguridad encuentra una contraseña de base de datos incrustada en el repositorio de código fuente de una aplicación. ¿Cuál es la secuencia de remediación?"},"answer":{"en":"Step 1: rotate the compromised credential immediately at the database, since git history retains the secret even after it is removed from the latest commit. Step 2: move the new credential to Secrets Manager and update the application to fetch it at runtime via the SDK or a native integration, instead of in code. Step 3: enable automatic rotation if the database engine supports it, and add a secrets-scanning step to the CI pipeline to prevent a recurrence.","es":"Paso 1: rota la credencial comprometida de inmediato en la base de datos, ya que el historial de git conserva el secreto aunque se borre del commit más reciente. Paso 2: mueve la nueva credencial a Secrets Manager y actualiza la aplicación para obtenerla en tiempo de ejecución vía el SDK o una integracion nativa, en vez de en el código. Paso 3: habilita rotación automática si el motor de base de datos lo soporta, y añade un escaneo de secretos en el pipeline de CI para prevenir una recurrencia."},"related":["encryption","security-detection"],"sources":[{"label":"AWS Secrets Manager - What Is Secrets Manager","url":"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"},{"url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html","label":"docs.aws.amazon.com: systems manager parameter store"}],"level":"applied","learning":{"definition":{"en":"Secrets management means keeping credentials such as database passwords, API keys and tokens out of application code, handing them to the workload at runtime under least privilege, and replacing them on a schedule.","es":"La gestión de secretos es mantener credenciales como contraseñas, claves de API y tokens fuera del código, entregarlas a la carga en ejecución con mínimo privilegio y reemplazarlas periódicamente."},"simple":{"en":"Passwords live in a controlled store, and the application fetches them when it runs.","es":"Las contraseñas viven en un almacén controlado y la aplicación las pide al ejecutarse."},"analogy":{"en":"Like a hotel key card desk: nobody carries a master key and each card expires. The limit is that a hotel only voids cards it printed, while a leaked credential may already sit in a build log or a git history you do not control. Rotation is the real remedy, deletion is not.","es":"Como el mostrador de tarjetas de un hotel: nadie lleva llave maestra y cada tarjeta caduca. El límite es que el hotel solo anula tarjetas que imprimió, mientras una credencial filtrada ya puede estar en un log o un historial de git ajeno. La rotación es el remedio real, borrar no."},"walkthrough":{"en":["Concepts first. A secret is any value that grants access if someone else learns it. Rotation replaces that value on a schedule so a leaked copy expires. A hardcoded credential is the failure case, because anyone who reads the code or the image reads the credential.","Then the types. Static long lived secrets are weakest and need rotation. Short lived credentials issued by a role largely remove the problem because they expire on their own. Some values belong elsewhere entirely, since encryption keys belong in KMS and certificates in a certificate manager.","Products cover these. AWS Secrets Manager stores secrets, serves them at runtime and can rotate them, usually through a billed Lambda rotation function, and logs its API calls to CloudTrail. Systems Manager Parameter Store keeps SecureString values encrypted with KMS, a common choice for configuration values. HashiCorp Vault solves this outside AWS.","Worked example. A container reads a database password from an environment variable committed to the repository. You move the value into Secrets Manager, grant the task role read access to that one secret, and cache the fetch. Because git history keeps the old password forever, you rotate it and confirm the app reconnects."],"es":["Primero los conceptos. Un secreto es cualquier valor que concede acceso si otro lo descubre. La rotación lo reemplaza periódicamente para que una copia filtrada caduque. Una credencial escrita en el código es el caso de fallo, porque quien lee el código o la imagen la lee.","Luego los tipos. Los secretos estáticos de larga duración son los más débiles y necesitan rotación. Las credenciales de vida corta que emite un rol casi eliminan el problema porque caducan solas. Algunos valores van en otro sitio: las claves de cifrado en KMS y los certificados en un gestor de certificados.","Los productos lo cubren. AWS Secrets Manager guarda secretos, los sirve en ejecución y puede rotarlos, normalmente con una función Lambda facturada, y registra sus llamadas en CloudTrail. Systems Manager Parameter Store guarda valores SecureString cifrados con KMS, opción habitual para valores de configuración. HashiCorp Vault resuelve esto fuera de AWS.","Ejemplo resuelto. Un contenedor lee la contraseña de base de datos de una variable confirmada en el repositorio. Mueves el valor a Secrets Manager, das al rol de la tarea lectura de ese único secreto, y cacheas la consulta. Como el historial de git conserva la contraseña antigua, la rotas y confirmas que la app reconecta."]},"pitfalls":{"en":["Believing that deleting a secret from the latest commit fixes the leak. The old commit still holds it, so the credential stays valid until rotated.","Caching a fetched secret forever. After rotation the cached value fails, so the client needs a refresh and reconnect path."],"es":["Creer que borrar un secreto del último commit arregla la fuga. El commit antiguo lo conserva y la credencial sigue valida hasta rotarla.","Cachear un secreto para siempre. Tras la rotación el valor cacheado falla, así que el cliente necesita refrescarlo y reconectar."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"},{"url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html","label":"docs.aws.amazon.com: systems manager parameter store"}]}},{"id":"security-governance","parent":"security","title":{"en":"Account and Organization Governance","es":"Gobernanza de cuentas y organización"},"summary":{"en":"Apply consistent security boundaries across accounts without granting unnecessary access.","es":"Aplica límites de seguridad coherentes entre cuentas sin conceder acceso innecesario."},"details":{"en":["AWS Organizations groups accounts and applies controls through an organization hierarchy. SCPs restrict permissions for principals in member accounts, including their root users; they do not grant access. They do not affect the management account or service-linked roles. An SCP is not a universal resource firewall against outside principals. Use resource policies and applicable resource control policies for resource-side requirements. Control Tower helps establish a governed landing zone. Test changes in a limited OU, preserve an authorized recovery path and understand delegated administration."],"es":["AWS Organizations agrupa cuentas y aplica controles en una jerarquía. Las SCP restringen permisos de principales de cuentas miembro, incluido root; no conceden acceso. No afectan a la cuenta de administración ni a roles vinculados a servicios. Una SCP no es un firewall universal del recurso frente a principales externos. Usa políticas de recurso y RCP aplicables para controles del lado del recurso. Control Tower ayuda a establecer una landing zone gobernada. Prueba cambios en una OU limitada y conserva una vía de recuperación autorizada."]},"aws":{"en":"Organizations + SCPs for guardrails; Control Tower for landing zone setup; IAM Identity Center for centralized workforce access across accounts.","es":"Organizations + SCPs para barandillas; Control Tower para configuración de zona de aterrizaje; IAM Identity Center para acceso centralizado de la fuerza laboral entre cuentas."},"question":{"en":"A newly applied SCP accidentally denies iam:* across an OU, and now no one, including admins, can fix IAM in affected accounts. How is this resolved?","es":"Una SCP recién aplicada niega accidentalmente iam:* en toda una OU, y ahora nadie, ni siquiera los administradores, puede corregir IAM en las cuentas afectadas. ¿Cómo se resuelve esto?"},"answer":{"en":"Step 1: recognize the fix cannot happen from inside the affected account, since the SCP overrides any identity policy, including admin ones. Step 2: access the organization's management account, where SCPs are managed. Step 3: modify or remove the problematic SCP from the management account, and consider adding a policy test (IAM Policy Simulator or review) before applying broad SCPs to production going forward.","es":"Paso 1: reconoce que la correccion no puede hacerse desde dentro de la cuenta afectada, ya que la SCP tiene prioridad sobre cualquier política de identidad, incluida la de administradores. Paso 2: accede a la cuenta de gestión (management account) de la organización, donde se gestionan las SCPs. Paso 3: modifica o elimina la SCP problematica desde la cuenta de gestión, y considera añadir una prueba de política (IAM Policy Simulator o revisión) antes de aplicar SCPs amplias en producción en el futuro."},"related":["iam","security-detection"],"sources":[{"label":"AWS Organizations - Service Control Policies","url":"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"},{"url":"https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html","label":"docs.aws.amazon.com: what is control tower"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html","label":"docs.aws.amazon.com: access policies"}],"level":"deep","learning":{"definition":{"en":"Governance applies one set of rules across many accounts at once, using an account hierarchy and organization level policies that cap what the principals they apply to can do.","es":"La gobernanza aplica un mismo conjunto de reglas a muchas cuentas a la vez, con una jerarquía de cuentas y políticas de organización que limitan lo que pueden hacer los principales a los que se aplican."},"simple":{"en":"House rules that apply to the accounts and identities in scope, including their administrators.","es":"Reglas de la casa que aplican a las cuentas e identidades en alcance, incluidos sus administradores."},"analogy":{"en":"Like building regulations above a tenant contract: a landlord cannot permit what the code forbids. The limit is that a service control policy never affects the management account, never grants anything, and does not restrict principals from outside the organization, so resource policies still matter.","es":"Como una normativa de edificación sobre el contrato del inquilino: el propietario no puede permitir lo que la norma prohíbe. El límite es que una política de control de servicio no afecta a la cuenta de gestión, no concede nada, y no restringe a principales externos, así que las políticas de recurso siguen importando."},"walkthrough":{"en":["Concepts first. An organization is a group of accounts under one management account. An organizational unit, or OU, is a folder of accounts you can target with a policy. A guardrail sets a maximum instead of granting access.","Then the types. Service control policies, or SCPs, cap what IAM users and roles in member accounts may do, including their root users. Resource control policies cap what may be done to resources in those accounts. Neither grants anything, and effective permissions are the intersection of guardrails and account policies. SCPs do not apply to the management account or to service-linked roles.","Products operate this. AWS Organizations holds the hierarchy and policies. AWS Control Tower builds a governed landing zone and applies preventive, detective and proactive controls. IAM Identity Center centralizes workforce access.","Worked example. You must guarantee no team disables activity logging. You write an SCP denying cloudtrail:StopLogging and attach it first to a test OU with one account, because AWS advises against attaching untested policies at the root. After confirming deployments still pass, you widen it, keeping FullAWSAccess in place. Denying that one API is not immutable logging on its own, so you also cover trail deletion and the log bucket permissions."],"es":["Primero los conceptos. Una organización es un grupo de cuentas bajo una cuenta de gestión. Una unidad organizativa, u OU, es una carpeta de cuentas a la que dirigir una política. Una barandilla fija un máximo en vez de conceder acceso.","Luego los tipos. Las políticas de control de servicio, o SCP, limitan lo que pueden hacer usuarios y roles IAM de las cuentas miembro, incluidos sus root. Las de control de recursos limitan lo que se hace sobre los recursos. Ninguna concede nada, y los permisos efectivos son la intersección de barandillas y políticas de cuenta. Las SCP no afectan a la cuenta de gestión ni a los roles vinculados a servicios.","Los productos lo operan. AWS Organizations guarda la jerarquía y las políticas. AWS Control Tower crea una landing zone gobernada con controles preventivos, detectivos y proactivos. IAM Identity Center centraliza el acceso del personal.","Ejemplo resuelto. Debes garantizar que nadie desactive el registro de actividad. Escribes una SCP que deniega cloudtrail:StopLogging y la adjuntas primero a una OU de prueba, porque AWS aconseja no adjuntar políticas sin probar en la raíz. Tras confirmar que los despliegues pasan, amplías el alcance conservando FullAWSAccess. Denegar esa API no equivale a registro inmutable, así que cubres también el borrado del trail y los permisos del bucket de logs."]},"pitfalls":{"en":["Attaching a new SCP at the organization root before testing it, which can lock users out of services across every member account at once.","Expecting an SCP to protect a resource from outside principals. It limits principals in member accounts, so a bucket policy still governs external access."],"es":["Adjuntar una SCP nueva en la raíz sin probarla, lo que puede bloquear servicios en todas las cuentas miembro a la vez.","Esperar que una SCP proteja un recurso de principales externos. Limita a los principales de las cuentas miembro, así que la política del bucket rige el acceso externo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html","label":"docs.aws.amazon.com: orgs manage policies scps"},{"url":"https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html","label":"docs.aws.amazon.com: what is control tower"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html","label":"docs.aws.amazon.com: access policies"}]}},{"id":"security-detection","parent":"security","title":{"en":"Detection and Audit","es":"Detección y auditoría"},"summary":{"en":"Record activity, detect suspicious behavior and turn findings into an incident response.","es":"Registra actividad, detecta comportamientos sospechosos y convierte hallazgos en una respuesta a incidentes."},"details":{"en":["CloudTrail records supported AWS activity, with different management, data and other event categories. Event history provides the last 90 days of management events in each Region even without a trail; it does not include data events. A trail or event data store supports configured retention and broader logging. Data events such as S3 object access need explicit configuration where required and can incur charges. Config records supported resource configuration; GuardDuty analyzes supported data sources and optional protection plans. Some runtime monitoring capabilities use agents, so agentless is not a universal description."],"es":["CloudTrail registra actividad AWS compatible en categorías de gestión, datos y otras. El historial ofrece 90 días de eventos de gestión por región incluso sin trail; no incluye eventos de datos. Un trail o almacén de eventos permite retención configurada y más registros. Eventos de datos como acceso a objetos S3 requieren configuración explícita y pueden tener coste. Config registra configuración compatible; GuardDuty analiza fuentes y planes de protección. Algunas funciones de monitorización runtime usan agentes: no todo es sin agente."]},"aws":{"en":"Enable CloudTrail organization-wide with log file validation, Config rules for continuous compliance, GuardDuty for anomaly-based threat detection, and Security Hub to aggregate findings.","es":"Habilita CloudTrail en toda la organización con validación de archivos de log, reglas de Config para cumplimiento continuo, GuardDuty para detección de amenazas por anomalias, y Security Hub para agregar hallazgos."},"question":{"en":"No trail was configured in the affected Region. Is all forensic evidence necessarily unavailable?","es":"¿Falta necesariamente toda evidencia forense si no había trail en la región afectada?"},"answer":{"en":"No. Check regional CloudTrail event history for recent management events, then existing trails, event data stores, service logs and application records. Data events may be unavailable if not configured before the incident. Preserve evidence and set up suitable multi-Region retention, relevant data-event selectors and detection coverage; do not promise detection of every incident within a fixed time.","es":"No. Comprueba el historial regional de eventos de gestión recientes y después trails, almacenes de eventos, logs de servicio y aplicación existentes. Los eventos de datos pueden faltar si no se configuraron antes. Conserva evidencia y configura retención multirregión, selectores de datos y detección adecuados; no prometas detectar todo incidente en un tiempo fijo."},"related":["security-governance","observability"],"sources":[{"label":"AWS CloudTrail - Logging Data and Management Events","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html"},{"label":"Amazon GuardDuty - How It Works","url":"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html"},{"label":"CloudTrail event history and limitations","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html"}],"level":"applied","learning":{"definition":{"en":"Detection and audit is the layer that records who called which API, tracks how resource configuration changed over time, and raises findings when observed activity looks malicious or non compliant.","es":"La detección y auditoría es la capa que registra quién llamó a qué API, sigue cómo cambió la configuración de los recursos y genera hallazgos cuando la actividad parece maliciosa o no conforme."},"simple":{"en":"Cameras and a logbook for your account, plus an alarm that reads them.","es":"Cámaras y un libro de registro de tu cuenta, más una alarma que los lee."},"analogy":{"en":"Like CCTV in a warehouse: it tells you what happened and when, but it never stops a theft in progress. The limit is that this footage is selective, since object level access is only recorded if you configured it, so absence of an event can simply mean the camera was not pointed there.","es":"Como las cámaras de un almacén: te dicen qué pasó y cuándo, pero no detienen un robo en curso. El límite es que la grabación es selectiva, porque el acceso a nivel de objeto solo se registra si lo configuraste, así que la ausencia de un evento puede significar que la cámara no apuntaba ahí."},"walkthrough":{"en":["Concepts first. An audit log answers who did what, when and from where. A configuration record answers what a resource looked like at a point in time. A finding is a judgment produced by analysis, not a raw log line. Detection is evidence, not prevention.","Then the event types, which matter for cost and coverage. Management events are control plane calls such as creating an instance. Data events are object level calls, they must be configured explicitly and can incur charges. CloudTrail event history gives ninety days of management events per Region without a trail, and excludes data events.","Products fill the layer. AWS CloudTrail records API activity into trails or event data stores. AWS Config records supported resource configuration and evaluates rules against it. Amazon GuardDuty analyzes foundational sources including CloudTrail management events, VPC flow logs and DNS logs.","Worked example. Someone deleted a production DynamoDB table last week. Event history still holds the management event, so you find the role session and the source address. To answer which rows were read beforehand you need data events, which were never enabled, so you enable them now."],"es":["Primero los conceptos. Un log de auditoría responde quién hizo qué y cuándo. Un registro de configuración responde cómo estaba un recurso en un momento dado. Un hallazgo es un juicio producido por análisis, no una línea de log. La detección es evidencia, no prevención.","Luego los tipos de evento, que importan para coste y cobertura. Los eventos de gestión son llamadas de plano de control, como crear una instancia. Los de datos son llamadas a nivel de objeto, requieren configuración explícita y pueden generar cargos. El historial de eventos de CloudTrail ofrece noventa días de eventos de gestión por región sin un trail, y excluye los de datos.","Los productos llenan la capa. AWS CloudTrail registra la actividad de API en trails o event data stores. AWS Config registra la configuración soportada y evalúa reglas. Amazon GuardDuty analiza fuentes fundacionales como los eventos de gestión de CloudTrail, los flow logs de VPC y los logs de DNS.","Ejemplo resuelto. Alguien borró una tabla DynamoDB de producción la semana pasada. El historial de eventos conserva el evento de gestión, así que encuentras la sesión de rol y la dirección de origen. Para saber qué filas se leyeron antes necesitas eventos de datos, que nunca se activaron, así que los activas ahora."]},"pitfalls":{"en":["Reading detection as protection. A trail or a finding tells you afterwards, so only a preventive control such as a policy stops the action.","Assuming object level reads are logged by default. Data events need explicit configuration, and event history never contains them."],"es":["Leer la detección como protección. Un trail o un hallazgo te avisan después, así que solo un control preventivo como una política detiene la acción.","Suponer que las lecturas a nivel de objeto se registran por defecto. Los eventos de datos requieren configuración explícita y el historial nunca los contiene."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html","label":"docs.aws.amazon.com: cloudtrail concepts"},{"url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html","label":"docs.aws.amazon.com: view cloudtrail events"},{"url":"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html","label":"docs.aws.amazon.com: what is guardduty"}]}},{"id":"ai","parent":null,"title":{"en":"Applied AI and Generative AI","es":"IA aplicada e IA generativa"},"summary":{"en":"Understand AI building blocks before choosing models, retrieval tools and safeguards.","es":"Entiende los componentes de IA antes de elegir modelos, herramientas de recuperación y controles."},"details":{"en":["This root covers how generative AI systems are actually built on AWS (Bedrock, SageMaker), the retrieval-augmented generation pattern used to ground models in private data, how to evaluate whether a system is good enough to ship, and the new security and cost surfaces these systems introduce."],"es":["Esta raíz cubre como se construyen realmente los sistemas de IA generativa en AWS (Bedrock, SageMaker), el patrón de generación aumentada por recuperación (RAG) usado para fundamentar modelos en datos privados, como evaluar si un sistema es lo bastante bueno para lanzarse, y las nuevas superficies de seguridad y costo que estos sistemas introducen."]},"aws":{"en":"Core services: Amazon Bedrock, SageMaker, Kendra/OpenSearch for retrieval, Bedrock Guardrails.","es":"Servicios centrales: Amazon Bedrock, SageMaker, Kendra/OpenSearch para recuperación, Bedrock Guardrails."},"question":{"en":"A customer wants to add a chatbot that answers questions using their internal documents. What AWS pattern do you propose first?","es":"Un cliente quiere añadir un chatbot que responda preguntas usando sus documentos internos. ¿Qué patrón de AWS propones primero?"},"answer":{"en":"Step 1: propose retrieval-augmented generation (RAG) over fine-tuning as the starting point, since it lets the model ground answers in current internal documents without retraining, and updates are just re-indexing documents. Step 2: recommend Amazon Bedrock Knowledge Bases with an embeddings model and a vector store (OpenSearch Serverless or similar) to index the documents. Step 3: set expectations that RAG reduces but does not eliminate hallucination, so plan for citations, an evaluation step, and guardrails before shipping to real users.","es":"Paso 1: propone la generación aumentada por recuperación (RAG) sobre el ajuste fino (fine-tuning) como punto de partida, ya que permite que el modelo fundamente respuestas en documentos internos actuales sin reentrenar, y las actualizaciones son solo reindexar documentos. Paso 2: recomienda Amazon Bedrock Knowledge Bases con un modelo de embeddings y un almacén vectorial (OpenSearch Serverless o similar) para indexar los documentos. Paso 3: establece la expectativa de que RAG reduce pero no elimina la alucinación, así que planifica citas, un paso de evaluación, y guardrails antes de lanzarlo a usuarios reales."},"related":["ai-rag","ai-embeddings","ai-evaluation"],"sources":[{"label":"Amazon Bedrock - What Is Amazon Bedrock","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}],"level":"foundation","learning":{"definition":{"en":"Applied generative AI is the practice of building features on top of pretrained foundation models, large models exposed through an API, and designing the retrieval, evaluation, security and cost controls around them.","es":"La IA generativa aplicada es construir funciones sobre modelos fundacionales preentrenados, modelos grandes expuestos por una API, y diseñar alrededor la recuperación, la evaluación, la seguridad y el control de coste."},"simple":{"en":"You rent a general purpose model and build the surrounding system yourself.","es":"Alquilas un modelo de propósito general y construyes el sistema alrededor."},"analogy":{"en":"Like hiring a widely read graduate: fast, articulate, and confident even when wrong. The limit is that a graduate knows when a question is outside their training and can say so, while a model produces fluent text either way, so the surrounding system, not the model, is what makes the answer trustworthy.","es":"Como contratar a un recién graduado muy leído: rápido, elocuente y seguro incluso cuando se equivoca. El límite es que un graduado sabe cuándo una pregunta está fuera de su formación y puede decirlo, mientras un modelo produce texto fluido igual, así que lo que hace fiable la respuesta es el sistema alrededor, no el modelo."},"walkthrough":{"en":["Vocabulary first. A foundation model, or FM, is a large model pretrained on broad data and reused for many tasks. A token is the unit of text a model reads and bills for. A prompt is the instruction plus the context you send.","Then the approaches, ordered by how much of the system you change rather than by price. Prompting alone changes only the instruction. Retrieval augmented generation, or RAG, adds your own documents at query time. Fine tuning changes model weights for a style or a task. Agents let a model call tools and take actions, which adds real permissions and therefore real risk.","Products differ by control. Amazon Bedrock gives managed API access to many foundation models, Bedrock Knowledge Bases packages RAG, Bedrock Guardrails filters content, and SageMaker suits custom training. Outside AWS the same layers are supplied by model providers directly or by frameworks such as LangChain, and NIST publishes a vendor neutral AI risk framework.","Worked example. A team wants answers from a thousand public support manuals. Fine tuning is rejected because the manuals change weekly. You choose RAG on Bedrock, build an evaluation set of real questions with known answers, add guardrails, and estimate cost per query from the tokens the retrieved chunks add."],"es":["Primero el vocabulario. Un modelo fundacional, o FM, es un modelo grande preentrenado con datos amplios y reutilizado para muchas tareas. Un token es la unidad de texto que el modelo lee y factura. Un prompt es la instrucción más el contexto que envías.","Luego los enfoques, ordenados por cuánto cambias del sistema y no por precio. Solo prompting cambia la instrucción. La generación aumentada por recuperación, o RAG, añade tus documentos en el momento de la consulta. El ajuste fino cambia los pesos del modelo. Los agentes dejan que el modelo llame herramientas y actúe, lo que añade permisos reales y por tanto riesgo real.","Los productos difieren en control. Amazon Bedrock da acceso administrado por API a muchos modelos fundacionales, Bedrock Knowledge Bases empaqueta RAG, Bedrock Guardrails filtra contenido, y SageMaker sirve para entrenamiento propio. Fuera de AWS las mismas capas las dan los proveedores de modelos o marcos como LangChain, y NIST publica un marco de riesgo de IA neutral.","Ejemplo resuelto. Un equipo quiere respuestas sobre mil manuales de soporte públicos. Se descarta el ajuste fino porque los manuales cambian cada semana. Eliges RAG en Bedrock, creas un conjunto de evaluación con preguntas reales y respuestas conocidas, añades guardrails, y estimas el coste por consulta según los tokens que añaden los fragmentos."]},"pitfalls":{"en":["Choosing fine tuning when the real problem is freshness. Fine tuning bakes in what the model knew at training time, while retrieval can be re-indexed daily.","Treating a working demo as a validated system. Without an evaluation set, a prompt or model change can silently degrade quality in production."],"es":["Elegir ajuste fino cuando el problema real es la actualidad. El ajuste fino fija lo que el modelo sabía al entrenar, mientras la recuperación se reindexa a diario.","Tomar una demo que funciona por un sistema validado. Sin conjunto de evaluación, un cambio de prompt o de modelo degrada la calidad en silencio."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html","label":"docs.aws.amazon.com: what is bedrock"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}]}},{"id":"ai-embeddings","parent":"ai","title":{"en":"Embeddings and Vector Search","es":"Embeddings y búsqueda vectorial"},"summary":{"en":"Represent content as numerical vectors so a system can compare similarity.","es":"Representa contenido como vectores numéricos para que un sistema pueda comparar similitud."},"details":{"en":["An embedding model maps a piece of content into a fixed-length numeric vector such that semantically similar content ends up close together in that vector space (by cosine similarity or Euclidean distance). A vector database (OpenSearch, Amazon Aurora with pgvector, Bedrock Knowledge Bases-managed stores) indexes these vectors for fast approximate nearest-neighbor search at scale, this is what lets a RAG system find the handful of relevant document chunks out of millions in milliseconds.","Pitfall: using a different embedding model to index documents than the one used to embed the user's query produces vectors in incompatible spaces, retrieval quality silently degrades because distances no longer mean the same thing, this is easy to introduce accidentally when swapping model versions."],"es":["Un modelo de embeddings mapea un fragmento de contenido a un vector numérico de longitud fija tal que el contenido semanticamente similar termina cerca en ese espacio vectorial (por similitud de coseno o distancia euclidiana). Una base de datos vectorial (OpenSearch, Amazon Aurora con pgvector, almacenes gestionados de Bedrock Knowledge Bases) indexa estos vectores para búsqueda rápida de vecinos más cercanos aproximados a escala, esto es lo que permite que un sistema RAG encuentre el puñado de fragmentos de documento relevantes entre millones en milisegundos.","Error común: usar un modelo de embeddings distinto para indexar documentos que el usado para el embedding de la consulta del usuario produce vectores en espacios incompatibles, la calidad de recuperación se degrada silenciosamente porque las distancias ya no significan lo mismo, esto es fácil de introducir por accidente al cambiar versiones de modelo."]},"aws":{"en":"Bedrock Titan Embeddings or Cohere Embed via Bedrock; OpenSearch Service/Serverless with k-NN plugin, or pgvector on Aurora PostgreSQL, as the vector store.","es":"Bedrock Titan Embeddings o Cohere Embed vía Bedrock; OpenSearch Service/Serverless con el plugin k-NN, o pgvector en Aurora PostgreSQL, como almacén vectorial."},"question":{"en":"After upgrading an embedding model version, a RAG system's retrieval quality drops sharply with no code changes otherwise. What is the likely cause?","es":"Tras actualizar la versión de un modelo de embeddings, la calidad de recuperación de un sistema RAG cae drásticamente sin otros cambios de código. ¿Cuál es la causa probable?"},"answer":{"en":"Step 1: check whether the vector index was re-generated with the new embedding model, or whether it still holds vectors produced by the old model version while new queries are embedded with the new one. Step 2: confirm this by comparing a known query's nearest neighbors before and after, mismatched vector spaces produce nonsensical distances. Step 3: fix by re-embedding and re-indexing the full document set with the new model, and treat embedding model version as a pinned dependency requiring a full re-index on any change, not a drop-in replacement.","es":"Paso 1: revisa si el índice vectorial se regenero con el nuevo modelo de embeddings, o si aún contiene vectores producidos por la versión antigua del modelo mientras las consultas nuevas se embeben con la nueva. Paso 2: confirma esto comparando los vecinos más cercanos de una consulta conocida antes y después, espacios vectoriales no coincidentes producen distancias sin sentido. Paso 3: corrige reembebiendo y reindexando todo el conjunto de documentos con el nuevo modelo, y trata la versión del modelo de embeddings como una dependencia fijada que requiere una reindexación completa ante cualquier cambio, no un reemplazo directo."},"related":["ai-rag","data-nosql"],"sources":[{"label":"Amazon OpenSearch Service k-NN","url":"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html","label":"docs.aws.amazon.com: titan embedding models"}],"level":"applied","learning":{"definition":{"en":"An embedding is a fixed length list of numbers, a vector, produced from a piece of text or an image so that items with similar meaning end up close together and similarity becomes a distance calculation.","es":"Un embedding es una lista de números de longitud fija, un vector, producida a partir de un texto o una imagen para que los elementos con significado parecido queden cerca y la similitud sea un cálculo de distancia."},"simple":{"en":"Text becomes coordinates, and related ideas land near each other.","es":"El texto se convierte en coordenadas y las ideas afines quedan cerca."},"analogy":{"en":"Like placing books on a map where similar topics sit on neighboring shelves. The limit is that the map encodes statistical co-occurrence, not comprehension, so opposites like refund approved and refund denied can land very close, and a nearest neighbor result is a similarity guess rather than an answer.","es":"Como colocar libros en un mapa donde los temas parecidos quedan en estantes vecinos. El límite es que el mapa codifica coocurrencia estadística, no comprensión, así que opuestos como reembolso aprobado y reembolso denegado pueden quedar muy cerca, y un vecino más cercano es una conjetura de similitud, no una respuesta."},"walkthrough":{"en":["Concepts first. An embedding model turns content into a vector with a fixed number of dimensions. Similarity is measured by cosine similarity or Euclidean distance. Nearest neighbor search returns the k closest vectors to your query vector. Chunking is how you split a long document before embedding it.","Then the types. Exact search compares every vector, which is accurate and can be the better choice on a small collection. Approximate nearest neighbor search trades a little recall for large speed gains, and it is common at scale rather than universal.","Products provide both halves. Amazon Titan Text Embeddings v2 accepts up to 8,192 tokens and returns 1,024 dimensions by default, and AWS documents that the similarity computation happens in your vector database, not in the embedding model. OpenSearch k-NN, pgvector on Aurora PostgreSQL and standalone stores such as Pinecone or FAISS hold the index.","Worked example. Retrieval quality collapses after a model version upgrade with no other change. Old document vectors were produced by the previous model while queries now use the new one, so the distances no longer mean the same thing. The fix is re-embedding and re-indexing every document, which makes the model version a pinned dependency."],"es":["Primero los conceptos. Un modelo de embeddings convierte contenido en un vector con un número fijo de dimensiones. La similitud se mide con similitud cosenoidal o distancia euclídea. La búsqueda de vecinos más cercanos devuelve los k vectores más próximos a tu consulta. El chunking es cómo partes un documento largo antes de embeberlo.","Luego los tipos. La búsqueda exacta compara todos los vectores, es precisa y puede ser la mejor opción en colecciones pequeñas. La búsqueda aproximada cede algo de exhaustividad por mucha velocidad, y es habitual a gran escala, no universal.","Los productos aportan ambas mitades. Amazon Titan Text Embeddings v2 acepta hasta 8.192 tokens y devuelve 1.024 dimensiones por defecto, y AWS documenta que el cálculo de similitud ocurre en tu base de datos vectorial, no en el modelo. OpenSearch k-NN, pgvector en Aurora PostgreSQL y almacenes como Pinecone o FAISS guardan el índice.","Ejemplo resuelto. La calidad de recuperación se hunde tras actualizar la versión del modelo sin otro cambio. Los vectores de los documentos venían del modelo anterior y las consultas usan el nuevo, así que las distancias ya no significan lo mismo. La solución es reembeber y reindexar todos los documentos, lo que convierte la versión del modelo en una dependencia fijada."]},"pitfalls":{"en":["Indexing documents with one embedding model and querying with another. The two vector spaces are incompatible and retrieval degrades silently, with no error raised.","Reading vector closeness as understanding. Negations and opposites often sit close together, so retrieved chunks still need to be checked for relevance."],"es":["Indexar documentos con un modelo de embeddings y consultar con otro. Los dos espacios vectoriales son incompatibles y la recuperación se degrada en silencio, sin error.","Leer la cercanía vectorial como comprensión. Negaciones y opuestos suelen quedar cerca, así que hay que comprobar la relevancia de los fragmentos recuperados."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html","label":"docs.aws.amazon.com: titan embedding models"},{"url":"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html","label":"docs.aws.amazon.com: knn"}]},"diagrams":[{"id":"rag-sequence","kind":"sequence","nodes":["ai-rag","ai-embeddings"],"title":{"en":"Retrieval before generation, in a single pass","es":"Recuperación antes de la generación, en una sola pasada"},"caption":{"en":"In this simple one-pass design your code retrieves first and the model only writes over the passages it was given. Agentic variants let the model call a search tool itself and loop. Either way, evaluate retrieval and generation separately.","es":"En este diseño simple de una sola pasada, tu código recupera primero y el modelo solo redacta sobre los pasajes que recibió. Las variantes con agentes permiten que el modelo llame por sí mismo a una herramienta de búsqueda y repita el ciclo. En cualquier caso, evalúa la recuperación y la generación por separado."},"alt":{"en":"Six steps. The user asks a question. The application turns it into an embedding vector. A vector store returns the nearest passages, filtered by what the user may read. The application builds a prompt with the question, the passages and an instruction to answer only from them. The model writes the answer. The application returns it with citations. Notes explain that an ingestion job embedded the documents beforehand with the same model, that access control belongs in the filter rather than the prompt, and that if the needed passage is missing the answer may read fluently while being unsupported.","es":"Seis pasos. El usuario hace una pregunta. La aplicación la convierte en un vector de embedding. Un almacén vectorial devuelve los pasajes más cercanos, filtrados por lo que el usuario puede leer. La aplicación construye un prompt con la pregunta, los pasajes y la instrucción de responder solo a partir de ellos. El modelo redacta la respuesta. La aplicación la devuelve con citas. Las notas explican que una tarea de ingesta convirtió antes los documentos con el mismo modelo, que el control de acceso corresponde al filtro y no al prompt, y que si falta el pasaje necesario la respuesta puede sonar fluida sin tener respaldo."},"actors":[{"id":"user","label":{"en":"User","es":"Usuario"}},{"id":"app","label":{"en":"Application","es":"Aplicación"}},{"id":"embed","label":{"en":"Embedding model","es":"Modelo de embeddings"}},{"id":"store","label":{"en":"Vector store","es":"Almacén vectorial"}},{"id":"llm","label":{"en":"Language model","es":"Modelo de lenguaje"}}],"steps":[{"from":"user","to":"app","label":{"en":"A question in plain language","es":"Una pregunta en lenguaje natural"}},{"from":"app","to":"embed","label":{"en":"Turn the question into a vector","es":"Convierte la pregunta en un vector"},"note":{"en":"The documents were embedded earlier by an ingestion job with the same model. Changing that model means reindexing them.","es":"Los documentos se convirtieron antes en una tarea de ingesta con el mismo modelo. Cambiar ese modelo obliga a reindexarlos."}},{"from":"app","to":"store","label":{"en":"Find the nearest passages, filtered by what this user may read","es":"Busca los pasajes más cercanos, filtrados por lo que este usuario puede leer"},"note":{"en":"Access control belongs here, in the filter. An instruction in the prompt is not a permission boundary.","es":"El control de acceso va aquí, en el filtro. Una instrucción en el prompt no es un límite de permisos."}},{"from":"app","to":"llm","label":{"en":"Prompt: the question, the retrieved passages, and answer only from them","es":"Prompt: la pregunta, los pasajes recuperados y responde solo a partir de ellos"},"note":{"en":"Every passage costs input tokens, so how many you retrieve is a cost and latency decision as well as a quality one.","es":"Cada pasaje cuesta tokens de entrada, así que cuántos recuperas es también una decisión de coste y latencia, no solo de calidad."}},{"from":"llm","to":"app","label":{"en":"An answer written over those passages","es":"Una respuesta redactada sobre esos pasajes"}},{"from":"app","to":"user","label":{"en":"The answer, with citations to the passages used","es":"La respuesta, con citas a los pasajes usados"},"note":{"en":"If retrieval returned nothing useful, the answer may still read fluently while being unsupported. Measure retrieval quality on its own, and let the system say it does not know.","es":"Si la recuperación no devolvió nada útil, la respuesta puede sonar fluida y no tener respaldo. Mide la calidad de la recuperación por separado y permite que el sistema diga que no lo sabe."}}]}]},{"id":"ai-rag","parent":"ai","title":{"en":"Retrieval-Augmented Generation","es":"Generación aumentada por recuperación"},"summary":{"en":"Retrieve relevant information before generation to help ground an answer in evidence.","es":"Recupera información relevante antes de generar una respuesta para ayudar a fundamentarla con evidencia."},"details":{"en":["Retrieval-Augmented Generation (RAG) combines information retrieval with text generation. The application retrieves relevant content and supplies it as context to a language model. The model can then use information outside its training data without retraining for every document change. Retrieval may use keyword search, vector similarity, or both. Citations help a reader inspect supporting passages, but must be checked for relevance and accuracy.","RAG does not guarantee a correct answer. Missing, outdated, unauthorized or misleading retrieved material can produce a poor result, and the model can misread even a good source. Evaluate retrieval and answer quality separately; include unanswerable questions, enforce access before context reaches the model, and allow an explicit no-answer outcome. Compare RAG, fine-tuning and other approaches against the actual task rather than treating one as a universal default."],"es":["La generación aumentada por recuperación (RAG) combina búsqueda de información y generación de texto. La aplicación recupera contenido relevante y lo entrega como contexto a un modelo de lenguaje. Así puede usar información que no estaba en su entrenamiento sin volver a entrenarlo por cada cambio documental. La recuperación puede usar palabras clave, similitud vectorial o ambas. Las citas ayudan a inspeccionar los pasajes de apoyo, pero hay que comprobar que sean pertinentes y correctos.","RAG no garantiza una respuesta correcta. El contenido ausente, anticuado, no autorizado o engañoso puede perjudicar el resultado, y el modelo puede interpretar mal incluso una buena fuente. Evalúa por separado la recuperación y la respuesta; incluye preguntas sin solución, aplica permisos antes de entregar contexto al modelo y permite indicar que no hay información suficiente. Compara RAG, ajuste fino y otras opciones según la tarea, sin tratar una como solución universal."]},"aws":{"en":"Amazon Bedrock Knowledge Bases supports managed retrieval and generation workflows. Choose ingestion, chunking, embeddings, search, filtering and reranking from the data and query requirements; test generated answers rather than assuming retrieval configuration alone determines quality.","es":"Amazon Bedrock Knowledge Bases admite flujos gestionados de recuperación y generación. Elige ingesta, división de documentos, embeddings, búsqueda, filtros y reordenación según los datos y las consultas; prueba las respuestas, sin asumir que la recuperación determina por sí sola toda su calidad."},"question":{"en":"A customer says their RAG chatbot will never hallucinate since it only answers from their documents. How do you correct this expectation?","es":"Un cliente dice que su chatbot RAG nunca alucinará ya que solo responde con sus documentos. ¿Cómo corriges esta expectativa?"},"answer":{"en":"Step 1: explain RAG reduces hallucination by grounding the model in retrieved text, but the model still generates the final answer through its own language modeling process, which can still misinterpret or blend retrieved chunks incorrectly. Step 2: give a concrete failure mode, if the top-k retrieved chunks are only tangentially relevant, the model may still produce a confident but wrong answer instead of admitting the documents do not cover the question. Step 3: recommend mitigations, explicit 'answer only from context, say you do not know otherwise' prompting, citation display so users can verify, and an evaluation set that specifically tests unanswerable questions.","es":"Paso 1: explica que RAG reduce la alucinación al fundamentar al modelo en texto recuperado, pero el modelo aún genera la respuesta final mediante su propio proceso de modelado de lenguaje, que puede seguir interpretando mal o mezclando incorrectamente los fragmentos recuperados. Paso 2: da un modo de fallo concreto, si los fragmentos recuperados en el top-k son solo tangencialmente relevantes, el modelo puede aún producir una respuesta segura pero incorrecta en vez de admitir que los documentos no cubren la pregunta. Paso 3: recomienda mitigaciones, un prompt explícito de 'responde solo desde el contexto, di que no lo sabes si no', mostrar citas para que los usuarios verifiquen, y un conjunto de evaluación que pruebe especificamente preguntas sin respuesta."},"related":["ai-embeddings","ai-evaluation","ai-security"],"sources":[{"label":"Amazon Bedrock Knowledge Bases","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html"},{"url":"https://aws.amazon.com/what-is/retrieval-augmented-generation/","label":"aws.amazon.com: retrieval augmented generation"}],"level":"applied","learning":{"definition":{"en":"RAG, retrieval augmented generation, is a pattern that searches your own data for passages relevant to a question and puts them into the prompt, so the model answers from that text, public or private, rather than from training memory alone. The retrieved text is only as fresh as the index behind it.","es":"RAG, generación aumentada por recuperación, es un patrón que busca en tus datos los pasajes relevantes para una pregunta y los inserta en el prompt, para que el modelo responda con ese texto, público o privado, y no solo con su memoria de entrenamiento. Ese texto está tan actualizado como el índice que lo sirve."},"simple":{"en":"Look up the relevant pages first, then let the model answer using them.","es":"Primero se buscan las páginas relevantes y luego el modelo responde con ellas."},"analogy":{"en":"Like an open book exam: the candidate still writes the answer, but with the right pages in front of them. The limit is that a student can be handed the wrong chapter and still write confidently, and RAG has no way to know the passage was wrong, and grounding does not guarantee a lower error rate, only a chance to answer from the right text.","es":"Como un examen con libro abierto: el candidato sigue escribiendo la respuesta, pero con las páginas correctas delante. El límite es que a un estudiante se le puede dar el capítulo equivocado y aún escribir con seguridad, y RAG no sabe que el pasaje era erróneo, y fundamentar no garantiza menos errores, solo la oportunidad de responder con el texto correcto."},"walkthrough":{"en":["Concepts first. Indexing splits documents into chunks, embeds them and stores the vectors. Retrieval embeds the question and fetches the top k closest chunks. Augmentation inserts those chunks into the prompt as context. Generation is the model writing the final answer, which is still a prediction.","Then the levers, because they decide quality. In vector based RAG, chunk size and overlap control whether a passage keeps enough context to be usable, and keyword or hybrid retrieval is equally valid and sometimes better. Top k controls how much is handed to the model. Metadata filtering restricts retrieval to the documents a given user or tenant is allowed to see.","Products package this. Amazon Bedrock Knowledge Bases manages ingestion, embedding, indexing and retrieval, and can filter by document level permissions at retrieval time where that is configured and the data source supports it. A self built pipeline over OpenSearch or Aurora gives more control, and frameworks such as LlamaIndex do the same outside AWS.","Worked example. A support assistant must answer only from published policy pages. You index those pages, retrieve the top three chunks, instruct the model to answer only from that context or say it does not know, and display citations. In testing an unanswerable question, the assistant correctly declines rather than inventing a policy."],"es":["Primero los conceptos. La indexación parte los documentos en fragmentos, los embebe y guarda los vectores. La recuperación embebe la pregunta y trae los k fragmentos más cercanos. La aumentación inserta esos fragmentos en el prompt como contexto. La generación es el modelo escribiendo la respuesta final, que sigue siendo una predicción.","Luego las palancas, porque deciden la calidad. En RAG basado en vectores, el tamaño y el solape de los fragmentos determinan si un pasaje conserva contexto útil, y la recuperación por palabras clave o híbrida es igual de válida y a veces mejor. El top k decide cuánto se entrega al modelo. El filtrado por metadatos limita la recuperación a los documentos que ese usuario o inquilino puede ver.","Los productos lo empaquetan. Amazon Bedrock Knowledge Bases gestiona ingesta, embeddings, indexación y recuperación, y puede filtrar por permisos de documento en la recuperación cuando eso se configura y la fuente de datos lo admite. Una tubería propia sobre OpenSearch o Aurora da más control, y marcos como LlamaIndex hacen lo mismo fuera de AWS.","Ejemplo resuelto. Un asistente de soporte solo debe responder con páginas de política publicadas. Indexas esas páginas, recuperas los tres mejores fragmentos, instruyes al modelo a responder solo desde ese contexto o decir que no lo sabe, y muestras citas. Al probar una pregunta sin respuesta, el asistente declina en vez de inventar una política."]},"pitfalls":{"en":["Promising that RAG cannot hallucinate. The model still generates the wording, so irrelevant or contradictory chunks can produce a confident wrong answer.","Relying on the interface to hide results from a shared index. A shared index is fine when retrieval applies enforced access filters, so the mistake is filtering after retrieval rather than during it."],"es":["Prometer que RAG no puede alucinar. El modelo sigue redactando, así que fragmentos irrelevantes o contradictorios producen respuestas seguras y erróneas.","Confiar en la interfaz para ocultar resultados de un índice compartido. Un índice compartido es válido si la recuperación aplica filtros de acceso, así que el error es filtrar después de recuperar."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/retrieval-augmented-generation/","label":"aws.amazon.com: retrieval augmented generation"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html","label":"docs.aws.amazon.com: knowledge base"}]},"diagrams":[{"id":"rag-sequence","kind":"sequence","nodes":["ai-rag","ai-embeddings"],"title":{"en":"Retrieval before generation, in a single pass","es":"Recuperación antes de la generación, en una sola pasada"},"caption":{"en":"In this simple one-pass design your code retrieves first and the model only writes over the passages it was given. Agentic variants let the model call a search tool itself and loop. Either way, evaluate retrieval and generation separately.","es":"En este diseño simple de una sola pasada, tu código recupera primero y el modelo solo redacta sobre los pasajes que recibió. Las variantes con agentes permiten que el modelo llame por sí mismo a una herramienta de búsqueda y repita el ciclo. En cualquier caso, evalúa la recuperación y la generación por separado."},"alt":{"en":"Six steps. The user asks a question. The application turns it into an embedding vector. A vector store returns the nearest passages, filtered by what the user may read. The application builds a prompt with the question, the passages and an instruction to answer only from them. The model writes the answer. The application returns it with citations. Notes explain that an ingestion job embedded the documents beforehand with the same model, that access control belongs in the filter rather than the prompt, and that if the needed passage is missing the answer may read fluently while being unsupported.","es":"Seis pasos. El usuario hace una pregunta. La aplicación la convierte en un vector de embedding. Un almacén vectorial devuelve los pasajes más cercanos, filtrados por lo que el usuario puede leer. La aplicación construye un prompt con la pregunta, los pasajes y la instrucción de responder solo a partir de ellos. El modelo redacta la respuesta. La aplicación la devuelve con citas. Las notas explican que una tarea de ingesta convirtió antes los documentos con el mismo modelo, que el control de acceso corresponde al filtro y no al prompt, y que si falta el pasaje necesario la respuesta puede sonar fluida sin tener respaldo."},"actors":[{"id":"user","label":{"en":"User","es":"Usuario"}},{"id":"app","label":{"en":"Application","es":"Aplicación"}},{"id":"embed","label":{"en":"Embedding model","es":"Modelo de embeddings"}},{"id":"store","label":{"en":"Vector store","es":"Almacén vectorial"}},{"id":"llm","label":{"en":"Language model","es":"Modelo de lenguaje"}}],"steps":[{"from":"user","to":"app","label":{"en":"A question in plain language","es":"Una pregunta en lenguaje natural"}},{"from":"app","to":"embed","label":{"en":"Turn the question into a vector","es":"Convierte la pregunta en un vector"},"note":{"en":"The documents were embedded earlier by an ingestion job with the same model. Changing that model means reindexing them.","es":"Los documentos se convirtieron antes en una tarea de ingesta con el mismo modelo. Cambiar ese modelo obliga a reindexarlos."}},{"from":"app","to":"store","label":{"en":"Find the nearest passages, filtered by what this user may read","es":"Busca los pasajes más cercanos, filtrados por lo que este usuario puede leer"},"note":{"en":"Access control belongs here, in the filter. An instruction in the prompt is not a permission boundary.","es":"El control de acceso va aquí, en el filtro. Una instrucción en el prompt no es un límite de permisos."}},{"from":"app","to":"llm","label":{"en":"Prompt: the question, the retrieved passages, and answer only from them","es":"Prompt: la pregunta, los pasajes recuperados y responde solo a partir de ellos"},"note":{"en":"Every passage costs input tokens, so how many you retrieve is a cost and latency decision as well as a quality one.","es":"Cada pasaje cuesta tokens de entrada, así que cuántos recuperas es también una decisión de coste y latencia, no solo de calidad."}},{"from":"llm","to":"app","label":{"en":"An answer written over those passages","es":"Una respuesta redactada sobre esos pasajes"}},{"from":"app","to":"user","label":{"en":"The answer, with citations to the passages used","es":"La respuesta, con citas a los pasajes usados"},"note":{"en":"If retrieval returned nothing useful, the answer may still read fluently while being unsupported. Measure retrieval quality on its own, and let the system say it does not know.","es":"Si la recuperación no devolvió nada útil, la respuesta puede sonar fluida y no tener respaldo. Mide la calidad de la recuperación por separado y permite que el sistema diga que no lo sabe."}}]}]},{"id":"ai-evaluation","parent":"ai","title":{"en":"Evaluating AI Systems","es":"Evaluación de sistemas de IA"},"summary":{"en":"Measure whether an AI system is useful, correct and safe on representative cases.","es":"Mide si un sistema de IA es útil, correcto y seguro en casos representativos."},"details":{"en":["A generative AI feature that looks great on a handful of manually tried prompts can fail broadly in production because those prompts were not representative. Proper evaluation builds a labeled test set covering realistic and edge-case inputs, then measures both retrieval quality (did we fetch the right context) and generation quality (did the model use it correctly), using a mix of automated metrics (e.g., an LLM-as-judge scoring against a rubric) and human review for the cases that matter most (safety, compliance-sensitive answers).","Pitfall: only testing the happy path and never testing adversarial or out-of-scope questions, which is exactly where hallucination and unsafe outputs tend to surface first in real usage."],"es":["Una función de IA generativa que se ve muy bien en un puñado de prompts probados manualmente puede fallar ampliamente en producción porque esos prompts no eran representativos. Una evaluación adecuada construye un conjunto de prueba etiquetado que cubre entradas realistas y casos extremos, luego mide tanto la calidad de recuperación (recuperamos el contexto correcto) como la calidad de generación (el modelo lo uso correctamente), usando una mezcla de métricas automatizadas (ej. un LLM como juez calificando contra una rúbrica) y revisión humana para los casos que más importan (seguridad, respuestas sensibles al cumplimiento).","Error común: probar solo el camino feliz y nunca probar preguntas adversarias o fuera de alcance, que es exactamente donde la alucinación y las salidas inseguras tienden a surgir primero en uso real."]},"aws":{"en":"Amazon Bedrock Evaluations for automated and human evaluation jobs against a test dataset; SageMaker Clarify for bias/quality metrics on custom models.","es":"Amazon Bedrock Evaluations para trabajos de evaluación automatizada y humana contra un conjunto de datos de prueba; SageMaker Clarify para métricas de sesgo/calidad en modelos personalizados."},"question":{"en":"A team wants to ship a customer-facing AI assistant after testing it manually with 10 friendly prompts. What do you push back on before launch?","es":"Un equipo quiere lanzar un asistente de IA de cara al cliente tras probarlo manualmente con 10 prompts amigables. ¿Qué cuestionas antes del lanzamiento?"},"answer":{"en":"Step 1: point out 10 manually chosen prompts are not statistically representative of real user input, especially adversarial or out-of-scope questions. Step 2: require building a labeled evaluation set covering realistic variety, edge cases, and explicitly unanswerable questions, then scoring both retrieval and generation quality against it. Step 3: set a minimum bar (e.g., pass rate on the eval set, plus mandatory human review of safety-sensitive categories) that must be met before launch, and re-run the same eval set after any model or prompt change to catch regressions.","es":"Paso 1: señala que 10 prompts elegidos manualmente no son estadísticamente representativos de la entrada real de usuarios, especialmente preguntas adversarias o fuera de alcance. Paso 2: exige construir un conjunto de evaluación etiquetado que cubra variedad realista, casos extremos, y preguntas explicitamente sin respuesta, y luego calificar tanto la calidad de recuperación como la de generación contra el. Paso 3: fija un umbral mínimo (ej. tasa de aprobacion en el conjunto de evaluación, más revisión humana obligatoria de categorias sensibles a seguridad) que debe cumplirse antes del lanzamiento, y vuelve a correr el mismo conjunto de evaluación tras cualquier cambio de modelo o prompt para detectar regresiones."},"related":["ai-rag","ai-security"],"sources":[{"label":"Amazon Bedrock Model Evaluation","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}],"level":"applied","learning":{"definition":{"en":"Evaluating an AI system means scoring it against a prepared dataset of inputs with known expected results, so quality is measured repeatably instead of judged from a few impressive demonstrations.","es":"Evaluar un sistema de IA es puntuarlo frente a un conjunto de entradas con resultados esperados conocidos, para medir la calidad de forma repetible en vez de juzgarla por unas pocas demostraciones."},"simple":{"en":"Build a test set with known answers and score every change against it.","es":"Creas un conjunto de pruebas con respuestas conocidas y puntúas cada cambio con el."},"analogy":{"en":"Like an exam with a marking scheme rather than a friendly chat with the candidate. The limit is that an exam measures only what it tests, so a set built from easy questions will award a high score to a system that fails on adversarial or out of scope input, which is where real users go first.","es":"Como un examen con criterios de corrección en vez de una charla amable con el candidato. El límite es que un examen solo mide lo que pregunta, así que un conjunto de preguntas fáciles dará buena nota a un sistema que falla con entradas adversarias o fuera de alcance, que es donde van los usuarios reales."},"walkthrough":{"en":["Concepts first. A test set, often called an evaluation dataset, pairs realistic inputs with ground truth, meaning the expected retrieved text or the expected answer. A metric turns a comparison into a number. A regression is a quality drop introduced by a change you made deliberately somewhere else.","Then the types, because a RAG system has two failure points. Retrieval evaluation asks whether the right context was fetched. Generation evaluation asks whether the model used that context correctly. Scoring can be automatic, can use a second model as a judge, or can use human reviewers, which stays necessary for safety sensitive categories.","Products support each type. Amazon Bedrock evaluations run programmatic model evaluation jobs, judge model evaluations and knowledge base evaluations that measure retrieval and response quality against ground truth, and they also support human worker jobs. SageMaker Clarify covers bias and quality on custom models, and open frameworks such as Ragas do similar scoring.","Worked example. A team wants to launch after ten friendly prompts. You require a set of two hundred real questions including twenty that the documents cannot answer, then score retrieval and generation separately. Retrieval is strong, but the model answers the unanswerable twenty instead of declining, so the prompt is fixed and the set is re-run."],"es":["Primero los conceptos. Un conjunto de pruebas, o conjunto de evaluación, empareja entradas realistas con la verdad de referencia, es decir el texto o la respuesta esperados. Una métrica convierte una comparación en un número. Una regresión es una caída de calidad introducida por un cambio que hiciste en otro sitio.","Luego los tipos, porque un sistema RAG tiene dos puntos de fallo. La evaluación de recuperación pregunta si se trajo el contexto correcto. La de generación pregunta si el modelo lo usó bien. La puntuación puede ser automática, usar otro modelo como juez, o usar revisores humanos, necesarios en categorías sensibles.","Los productos cubren cada tipo. Las evaluaciones de Amazon Bedrock ejecutan trabajos programáticos de modelo, evaluaciones con modelo juez y evaluaciones de knowledge base que miden recuperación y respuesta frente a la verdad de referencia, y admiten trabajos con revisores humanos. SageMaker Clarify cubre sesgo y calidad en modelos propios, y marcos abiertos como Ragas puntúan igual.","Ejemplo resuelto. Un equipo quiere lanzar tras diez prompts amables. Exiges un conjunto de doscientas preguntas reales, veinte de ellas sin respuesta en los documentos, y puntúas recuperación y generación por separado. La recuperación va bien, pero el modelo responde esas veinte en vez de declinar, así que se corrige el prompt y se repite el conjunto."]},"pitfalls":{"en":["Testing only questions the system can answer. Unanswerable and adversarial cases are where hallucination appears first, so they belong in the set.","Changing the model or prompt without re-running the same set. Without a fixed baseline you cannot tell an improvement from a reg
