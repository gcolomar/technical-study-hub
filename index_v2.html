ón no explica cómo gestionar cambios simultáneos y fallos, que requieren reglas explícitas."},"walkthrough":{"en":["A bike hire app must reopen rental R84 when a rider reconnects. The screen needs the bike identifier, pickup station and start time together, so these become one rental record.","The service stores that record as a document identified by R84. On reconnection, the engine locates the document using R84, and the application reads its fields to rebuild the active-rental screen.","Operations then needs all active rentals from station S2. The team adds an index, a separate lookup structure, on station and rental status; otherwise the engine may inspect many unrelated records."],"es":["Una aplicación de alquiler de bicicletas debe volver a mostrar el alquiler R84 cuando el ciclista se reconecta. La pantalla necesita el identificador de la bicicleta, la estación de recogida y la hora de inicio, así que se reúnen en un registro.","El servicio guarda ese registro como un documento identificado por R84. Al reconectarse el usuario, el motor localiza el documento mediante R84 y la aplicación lee sus campos para reconstruir la pantalla del alquiler activo.","Operaciones necesita después todos los alquileres activos de la estación S2. El equipo añade un índice, una estructura auxiliar de búsqueda, sobre estación y estado del alquiler; sin él, el motor podría examinar muchos registros ajenos a la petición."]},"pitfalls":{"en":["Flexible records still need rules. Some engines can validate their shape and commit several changes as one all-or-nothing transaction; check the specific engine and version before designing around those features.","Moving to NoSQL does not automatically remove a performance bottleneck. First establish whether the existing database is missing an index or receiving an unnecessarily expensive request."],"es":["Los registros flexibles también necesitan reglas. Algunos motores validan su estructura y agrupan cambios en una transacción que se confirma entera o se descarta; comprueba el motor y la versión antes de depender de esas funciones.","Pasar a NoSQL no elimina automáticamente un cuello de botella. Averigua primero si a la base de datos actual le falta un índice o si recibe una petición innecesariamente costosa."]},"sourceUrls":[{"url":"https://aws.amazon.com/nosql/","label":"aws.amazon.com: nosql"},{"url":"https://www.mongodb.com/docs/manual/core/schema-validation/","label":"mongodb.com: schema validation"},{"url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html","label":"docs.aws.amazon.com: Introduction"}]},"diagrams":[{"id":"nosql-types","kind":"stack","interactive":false,"nodes":["data-nosql"],"title":{"en":"Choose the data model from the questions you must answer","es":"Elige el modelo de datos según las consultas que necesites"},"caption":{"en":"These four families organise data differently. Compare how each would retrieve the information your application needs, then choose a product. NoSQL products may support more than one model and do not all share the same transaction or consistency guarantees.","es":"Estas cuatro familias organizan los datos de forma distinta. Compara cómo recuperaría cada una la información que necesita tu aplicación y después elige un producto. Un producto NoSQL puede admitir varios modelos; no todos ofrecen las mismas garantías de transacciones o consistencia."},"alt":{"en":"Four models: key-value retrieves a value by known key; document stores nested fields and uses indexes for queries; Cassandra-style wide-column groups rows by partition and sorts within it; graph traverses relationships between entities. DynamoDB supports key-value and document models. Product capabilities overlap, and wide-column operational storage differs from columnar analytics. Choose from required queries and guarantees.","es":"Cuatro modelos: clave-valor recupera un valor por una clave conocida; documento guarda campos anidados y usa índices para consultar; columna ancha de tipo Cassandra agrupa filas por partición y las ordena dentro; grafo recorre relaciones entre entidades. DynamoDB admite clave-valor y documento. Los productos pueden combinar capacidades y columna ancha operativa difiere de columna analítica. Elige según consultas y garantías necesarias."},"items":[{"number":"1","sample":"user#42  →  { name, tier }","label":{"en":"Key-value","es":"Clave-valor"},"detail":{"en":"Use a known key, such as user42, to retrieve its value. This is a direct lookup, not a search across every profile. DynamoDB supports this model.","es":"Usa una clave conocida, como usuario42, para recuperar su valor. Es una búsqueda directa por identificador, no un recorrido de todos los perfiles. DynamoDB admite este modelo."}},{"number":"2","sample":"{ id, name, address: { city } }","label":{"en":"Document","es":"Documento"},"detail":{"en":"Store a product with its nested attributes in one document. Queries on fields need suitable indexes to avoid scanning every document. Examples include MongoDB and Amazon DocumentDB.","es":"Guarda un producto con sus atributos anidados en un documento. Las consultas por campos necesitan índices adecuados para evitar recorrer todos los documentos. Ejemplos: MongoDB y Amazon DocumentDB."}},{"number":"3","sample":"sensor#7 | 09:00 | 09:01 | 09:02","label":{"en":"Wide-column","es":"Columna ancha"},"detail":{"en":"In Cassandra-style systems, group records by a partition key and order them within that partition. Device readings can be grouped by device and day, then read by time range.","es":"En sistemas de tipo Cassandra, agrupa registros por una clave de partición y ordénalos dentro de ella. Puedes agrupar lecturas por dispositivo y día y consultarlas por intervalo de tiempo."}},{"number":"4","sample":"user#42  →[ordered]→  order#88","label":{"en":"Graph","es":"Grafo"},"detail":{"en":"Represent entities as nodes and their relationships as edges. Traverse those relationships to find connections, such as accounts sharing a device. Neptune supports graph models.","es":"Representa entidades como nodos y relaciones como aristas. Recorre esas relaciones para encontrar conexiones, como cuentas que comparten dispositivo. Neptune admite modelos de grafo."}}],"note":{"en":"DynamoDB supports key-value and document data. A wide-column operational model is different from columnar analytical storage. Judge the design by its real queries, required guarantees and operating cost.","es":"DynamoDB admite datos clave-valor y documento. El modelo operativo de columna ancha es distinto del almacenamiento columnar analítico. Evalúa el diseño según las consultas reales, las garantías necesarias y el coste operativo."}}]},{"id":"data-nosql-key-value","parent":"data-nosql","title":{"en":"Key-Value Stores","es":"Almacenes clave-valor"},"summary":{"en":"Knowing the key gives the application a direct route to one piece of stored state.","es":"Conocer la clave da a la aplicación una vía directa para acceder a unos datos concretos."},"details":{"en":["If the engine supports expiry, a cart key may have a time to live. Resetting it on updates differs from measuring it from creation. When expired data stops being returned and when storage is physically reclaimed depend on the engine, so enforce business expiry in the application where needed. Eviction under memory pressure can remove cached data earlier. Check both behaviours before storing the only copy of a cart."],"es":["Si el motor admite caducidad, una clave de cesta puede tener un tiempo de vida. Reiniciarlo con cada actualización difiere de contarlo desde la creación. Cuándo deja de devolverse el dato caducado y cuándo se libera físicamente su espacio depende del motor; aplica en la aplicación la caducidad de negocio que necesites. La expulsión por falta de memoria puede retirar datos de caché antes. Comprueba ambos comportamientos antes de guardar la única copia de una cesta."]},"aws":{"en":"Amazon MemoryDB can store cart:U17 as a hash, a collection of named fields, with product IDs mapped to quantities. Its hash-increment command updates a quantity without replacing the entire basket.","es":"Amazon MemoryDB puede guardar cart:U17 como un hash, una colección de campos con nombre, que relaciona identificadores de producto con cantidades. Su comando de incremento sobre un campo actualiza una cantidad sin sustituir toda la cesta."},"question":{"en":"Support wants a list of all baskets containing notebook P9, but the store only exposes lookups by user ID. How would you add that feature?","es":"Soporte quiere listar todas las cestas que contienen el cuaderno P9, pero el almacén solo permite consultar por identificador de usuario. ¿Cómo añadirías esa función?"},"answer":{"en":"I would add a lookup from product ID to basket IDs, using a native index if the engine supports the required relationship. Each basket change would also need to remove or add membership in that lookup, including expiry. Because those updates may not succeed together, I would decide how much delay support can accept and provide a reconciliation job. A scan might help with a one-off investigation, but it should not quietly become the normal support workflow.","es":"Crearía una estructura de consulta que relacione cada producto con las cestas que lo contienen, usando un índice nativo si el motor lo permite. Cada cambio de cesta tendría que actualizar esa relación, incluida su caducidad. Como ambas actualizaciones podrían no completarse juntas, acordaría qué retraso acepta soporte y prepararía un proceso que detecte y corrija discrepancias. Recorrer todas las cestas puede servir para una investigación puntual, pero no debería convertirse sin más en el funcionamiento habitual de soporte."},"related":["data-caching","data-nosql-document"],"sources":[{"label":"Redis data types overview","url":"https://redis.io/docs/latest/develop/data-types/"},{"label":"AWS: What is NoSQL?","url":"https://aws.amazon.com/nosql/"}],"level":"foundation","learning":{"definition":{"en":"A key-value store keeps a value under a unique lookup key so an application can retrieve or change it by name. It suits requests where the caller already knows the identifier of the piece of state it needs.","es":"Un almacén clave-valor guarda un valor bajo una clave única para que la aplicación pueda recuperarlo o modificarlo mediante esa referencia. Resulta útil cuando quien hace la petición ya conoce el identificador de los datos que necesita."},"simple":{"en":"The application constructs a key, such as cart:U17, and submits it for a read or write. The engine uses it to locate the associated value, here the shopper's basket. Many engines distribute keys between machines using a hash, a calculation that assigns each key a destination. Retrieval then follows a known address without searching every basket. Values can have structure and specialised update commands; however, a single frequently requested key can still concentrate too much work.","es":"La aplicación construye una clave, como cart:U17, y la envía para leer o escribir. El motor la utiliza para localizar el valor asociado, en este caso la cesta del cliente. Muchos motores reparten claves entre máquinas mediante una función hash, un cálculo que asigna un destino a cada clave. Así, la lectura sigue una dirección conocida sin buscar en todas las cestas. Algunos valores admiten estructuras y operaciones propias; una clave muy solicitada aún puede concentrar demasiado trabajo."},"analogy":{"en":"A cloakroom ticket locates a coat without describing its colour. The comparison has a limit: some key-value engines also inspect and modify parts of a value instead of always handing back the whole thing.","es":"El número de un guardarropa permite localizar un abrigo sin describir su color. La comparación tiene un límite: algunos motores clave-valor también consultan y modifican partes del contenido, en lugar de devolverlo siempre entero."},"walkthrough":{"en":["Shopper U17 adds two notebooks. The basket service writes their product identifier and quantity under cart:U17, keeping the shopper's current basket behind a reproducible lookup key.","U17 opens the basket on another device. The service derives the same key from the authenticated user ID and retrieves that basket, without searching other shoppers' entries.","Both devices then add another notebook almost together. The service uses a supported atomic increment, an indivisible quantity update, rather than sending two stale replacement values that could overwrite one another's changes."],"es":["El cliente U17 añade dos cuadernos. El servicio de cestas guarda su identificador de producto y la cantidad bajo cart:U17, de modo que pueda volver a construir la clave para consultar la cesta.","U17 abre la cesta en otro dispositivo. El servicio obtiene la misma clave a partir del identificador del usuario autenticado y recupera su cesta, sin buscar entre las de otros clientes.","Los dos dispositivos añaden otro cuaderno casi a la vez. El servicio utiliza un incremento atómico compatible con el motor, una actualización indivisible de la cantidad, en vez de enviar dos valores desactualizados que podrían sobrescribir los cambios del otro."]},"pitfalls":{"en":["Knowing the basket key does not help you find every shopper who has a particular product. That request needs its own lookup structure, a supported index or a potentially expensive scan.","A key-value engine may hold the authoritative data, not merely a cache. With Redis, persistence and recovery settings determine what survives failures; choose those settings deliberately before treating a basket as durable."],"es":["Conocer la clave de una cesta no permite encontrar a todos los clientes que tienen cierto producto. Esa petición necesita otra estructura de búsqueda, un índice compatible o un recorrido completo que puede resultar costoso.","Un motor clave-valor puede guardar los datos de referencia, además de servir como caché. En Redis, la configuración de persistencia y recuperación determina qué sobrevive a los fallos; revísala antes de considerar duradera una cesta."]},"sourceUrls":[{"url":"https://redis.io/docs/latest/develop/data-types/","label":"redis.io: data types"},{"url":"https://aws.amazon.com/nosql/","label":"aws.amazon.com: nosql"}]}},{"id":"data-nosql-document","parent":"data-nosql","title":{"en":"Document Stores","es":"Almacenes de documentos"},"summary":{"en":"A document keeps related fields together while allowing searches within the record.","es":"Un documento reúne campos relacionados y permite buscar por datos del interior del registro."},"details":{"en":["Embedding the customer's address in a booking can deliberately capture where that repair was scheduled, rather than point at an address that later changes. If the customer moves, old bookings can retain their original location. Conversely, an emergency contact number may need the current value, so the application must decide whether to refresh a copy or read a separately maintained customer record."],"es":["Incluir la dirección del cliente en una cita puede servir para conservar dónde estaba prevista esa reparación, en vez de apuntar a una dirección que cambie después. Si el cliente se muda, las citas antiguas pueden mantener su ubicación original. En cambio, un teléfono de contacto urgente puede necesitar el valor actual, por lo que la aplicación debe decidir si actualiza una copia o consulta un registro de cliente mantenido por separado."]},"aws":{"en":"Amazon DocumentDB can hold the repair bookings and support an index on the nested postcode field. Before moving an existing MongoDB application, test its actual queries and driver behaviour against the selected DocumentDB version because compatibility has documented differences.","es":"Amazon DocumentDB puede guardar las citas de reparación y admitir un índice sobre el campo anidado de código postal. Antes de trasladar una aplicación de MongoDB, prueba sus consultas reales y el comportamiento del controlador con la versión elegida de DocumentDB, porque existen diferencias de compatibilidad documentadas."},"question":{"en":"A repair platform embeds every sensor reading in the machine's booking document. It works in a pilot, but each booking keeps growing. What would you change?","es":"Una plataforma de reparaciones incluye cada lectura de los sensores en el documento de cita de la máquina. Funciona en el piloto, pero cada cita sigue creciendo. ¿Qué cambiarías?"},"answer":{"en":"I would separate the sensor readings from the booking and keep a machine or booking identifier on each reading. The booking would retain the information the technician normally needs, perhaps including a recent summary, rather than the whole stream. This bounds the size of the working record and reduces contention between telemetry writes and booking edits. The trade-off is an extra query when someone needs the history. I would test that query and define retention before moving existing readings.","es":"Separaría las lecturas de la cita y guardaría en cada una el identificador de la máquina o de la cita. La cita conservaría lo que el técnico suele necesitar, quizá con un resumen reciente, en vez del flujo completo. Así se acota el tamaño del registro habitual y se reduce la competencia entre escrituras de mediciones y cambios de la cita. A cambio, consultar el historial exige otra petición. Probaría esa consulta y definiría cuánto tiempo conservar las lecturas antes de trasladar las existentes."},"related":["data-nosql-key-value","data-dynamodb"],"sources":[{"label":"MongoDB Manual: Documents","url":"https://www.mongodb.com/docs/manual/core/document/"},{"label":"MongoDB Manual: Schema validation","url":"https://www.mongodb.com/docs/manual/core/schema-validation/"},{"label":"Functional differences: Amazon DocumentDB and MongoDB","url":"https://docs.aws.amazon.com/documentdb/latest/developerguide/functional-differences.html"}],"level":"foundation","learning":{"definition":{"en":"A document store keeps a business record as named fields that can contain further fields or lists. It is useful when an application needs those related pieces together but different records do not all require the same attributes.","es":"Un almacén de documentos guarda cada registro de negocio mediante campos con nombre que pueden contener otros campos o listas. Es útil cuando la aplicación necesita consultar juntos esos datos relacionados, aunque no todos los registros requieran los mismos atributos."},"simple":{"en":"The application submits a document, usually expressed as JSON, a format for named values and nested structures. The database can interpret its fields rather than treating the record as an unreadable blob. A repair booking can include an address object and a list of reported faults. An index on a chosen field lets the engine locate matching bookings without reading every document, while validation rules can reject records that break an agreed shape.","es":"La aplicación envía un documento, normalmente expresado en JSON, un formato de valores con nombre y estructuras anidadas. El motor interpreta sus campos en lugar de tratarlo como un bloque ilegible. Una cita de reparación puede incluir una dirección y una lista de averías comunicadas. Un índice sobre un campo concreto permite localizar citas coincidentes sin leer todos los documentos; las reglas de validación pueden rechazar registros que incumplan la estructura acordada."},"analogy":{"en":"A document resembles a job folder holding a cover sheet and related notes. Unlike paper folders, the database can search selected entries inside each folder, but endlessly adding pages still makes the folder unwieldy.","es":"Un documento se parece a una carpeta de trabajo con una ficha y sus notas. El motor puede buscar datos dentro de las carpetas, algo distinto del papel; añadir hojas sin límite también acaba dificultando su manejo."},"walkthrough":{"en":["A repair shop creates booking B62 for a washing machine. Its document contains the appointment time, a nested customer address and two reported faults, so the technician's screen can load them together.","The dispatcher requests bookings in postcode 28020. An index on the postcode field inside the address supports that search; nesting does not require the application to open every booking first.","After the visit, the shop adds the diagnosis to B62 but stores ongoing machine telemetry separately. Sensor readings can grow indefinitely, whereas the booking should remain a manageable record for one repair."],"es":["Un taller crea la cita B62 para reparar una lavadora. Su documento contiene la hora, la dirección del cliente como estructura anidada y dos averías comunicadas, de modo que la pantalla del técnico pueda cargarlas juntas.","La persona que asigna las visitas solicita las citas del código postal 28020. Un índice sobre el campo de código postal dentro de la dirección permite esa búsqueda; anidar datos no obliga a abrir antes todas las citas.","Tras la visita, el taller añade el diagnóstico a B62, pero guarda aparte las mediciones continuas de la máquina. Las lecturas de los sensores pueden crecer indefinidamente, mientras que la cita debe seguir siendo un registro manejable de una reparación."]},"pitfalls":{"en":["Do not equate optional fields with unchecked input. MongoDB can enforce validation for a collection, a group of documents; define required identifiers and clarify whether an absent diagnosis means pending or unknown.","An embedded list must have a realistic growth limit. MongoDB permits at most 16 MiB per BSON document, its binary record format; other engines and versions can impose different constraints."],"es":["Tener campos opcionales no justifica aceptar datos sin comprobarlos. MongoDB puede aplicar validación a una colección, un grupo de documentos; define los identificadores obligatorios y aclara si un diagnóstico ausente significa pendiente o desconocido.","Una lista incluida en el documento necesita un límite de crecimiento realista. MongoDB admite hasta 16 MiB por documento BSON, su formato binario de registro; otros motores y versiones pueden imponer restricciones distintas."]},"sourceUrls":[{"url":"https://www.mongodb.com/docs/manual/core/document/","label":"mongodb.com: document"},{"url":"https://www.mongodb.com/docs/manual/core/schema-validation/","label":"mongodb.com: schema validation"},{"url":"https://docs.aws.amazon.com/documentdb/latest/developerguide/functional-differences.html","label":"docs.aws.amazon.com: functional differences"}]}},{"id":"data-nosql-wide-column","parent":"data-nosql","title":{"en":"Wide-Column Stores","es":"Almacenes de columna ancha"},"summary":{"en":"A partition key selects a row group; clustering columns organise the ranges available inside that group.","es":"La clave de partición selecciona un grupo de filas; las columnas de agrupamiento ordenan sus datos para consultar intervalos."},"details":{"en":["A timestamp alone may not distinguish readings: two measurements can share the same clock value. In Cassandra, rows with the same complete primary key address the same logical record, so add a reading identifier when both observations must remain separate. The partition key chooses their group; the full primary key must also express what makes each observation distinct."],"es":["Una marca temporal puede no bastar para distinguir lecturas: dos mediciones pueden compartir el mismo valor de reloj. En Cassandra, las filas con la misma clave primaria completa corresponden al mismo registro lógico, así que añade un identificador de lectura si ambas observaciones deben mantenerse separadas. La clave de partición elige el grupo; la clave primaria completa debe expresar también qué distingue cada observación."]},"aws":{"en":"Amazon Keyspaces can store freezer readings in a Cassandra-compatible table partitioned by sensor ID and day, with reading time and reading ID as clustering columns. The monitoring API requests the partitions that overlap the alert window.","es":"Amazon Keyspaces puede guardar las lecturas del congelador en una tabla compatible con Cassandra, particionada por sensor y día, con la hora y el identificador de lectura como columnas de agrupamiento. La API de supervisión consulta las particiones que coinciden con el intervalo de la alerta."},"question":{"en":"An alert at 00:10 needs the last 30 minutes of readings, but rows are partitioned by sensor and calendar day. Does that require changing the table design?","es":"Una alerta a las 00:10 necesita los últimos 30 minutos de lecturas, pero las filas se particionan por sensor y día natural. ¿Hay que cambiar el diseño de la tabla?"},"answer":{"en":"I would keep daily partitions unless measurements show a problem. The alert spans two dates: request the last twenty minutes of the previous day and the first ten of the current day, then combine the readings in timestamp order. I would also define the time zone for the day boundary and how to handle an incomplete response. That extra read is the predictable cost of limiting how long each partition accumulates data.","es":"Mantendría las particiones diarias salvo que las mediciones indiquen problemas. La alerta abarca dos fechas: pediría los últimos veinte minutos del día anterior y los primeros diez del actual, y uniría las lecturas por orden temporal. Definiría también la zona horaria que fija el cambio de día y cómo tratar una respuesta incompleta. Esa lectura adicional es el coste previsible de limitar durante cuánto tiempo acumula datos cada partición."},"related":["data-nosql-key-value","data-warehousing"],"sources":[{"label":"Apache Cassandra architecture overview","url":"https://cassandra.apache.org/doc/latest/cassandra/architecture/overview.html"},{"label":"Apache Cassandra CQL: Data definition","url":"https://cassandra.apache.org/doc/latest/cassandra/developing/cql/ddl.html"},{"url":"https://aws.amazon.com/nosql/","label":"aws.amazon.com: nosql"}],"level":"applied","learning":{"definition":{"en":"A wide-column store organises related records into keyed groups so an application can retrieve a slice of one group's data. This model suits operational histories, such as readings for a particular sensor, when the query already identifies the group.","es":"Un almacén de columna ancha organiza registros relacionados en grupos identificados por claves para que la aplicación pueda recuperar una parte de sus datos. Este modelo encaja con historiales operativos, como las lecturas de un sensor concreto, cuando la consulta ya identifica el grupo."},"simple":{"en":"In Cassandra, the application writes rows into a table declared using CQL, its query language. A partition key groups rows and guides their placement across machines; clustering columns arrange rows within that group. With sensor ID and date as the partition key, reading time can order the measurements. Supplying those identifiers and a time range targets a slice of one group. Each operation's consistency setting controls required responses from replicas, copies of the data on different machines.","es":"En Cassandra, la aplicación escribe filas en una tabla declarada con CQL, su lenguaje de consultas. La clave de partición agrupa filas y orienta su reparto entre máquinas; las columnas de agrupamiento las ordenan dentro del grupo. Si el sensor y la fecha identifican la partición, la hora puede ordenar las mediciones. Con esos identificadores y un intervalo temporal, la petición acota la búsqueda. El nivel de consistencia de cada operación determina cuántas réplicas, copias de los datos en otras máquinas, deben responder."},"analogy":{"en":"Imagine drawers labelled by sensor and day, with readings filed by time inside each drawer. Finding one interval means opening specific drawers; the analogy does not cover replication or what happens when a drawer becomes overloaded.","es":"Imagina cajones identificados por sensor y día, con lecturas ordenadas por hora dentro. Buscar un intervalo requiere abrir cajones concretos; la comparación no explica la replicación ni qué ocurre cuando un cajón recibe demasiada carga."},"walkthrough":{"en":["Freezer sensor F12 sends a temperature reading every minute. The service writes each reading into the partition identified by F12 and 21 September, ordering entries by measurement time.","At 10:20, an alert service asks for F12's readings since 10:00 that day. It supplies the complete partition key and a time range, narrowing the work to part of one partition.","A later investigation crosses midnight. The service requests the relevant time range from each of two daily partitions and combines the results, accepting an extra read to limit how long each group grows."],"es":["El sensor F12 de un congelador envía una temperatura cada minuto. El servicio escribe cada lectura en la partición identificada por F12 y el 21 de septiembre, ordenando las entradas por la hora de medición.","A las 10:20, un servicio de alertas pide las lecturas de F12 desde las 10:00 de ese día. Envía la clave de partición completa y un intervalo horario, reduciendo el trabajo a una parte de esa partición.","Una investigación posterior abarca ambos lados de la medianoche. El servicio pide el tramo correspondiente de cada una de las dos particiones diarias y combina los resultados; acepta una lectura adicional para limitar durante cuánto tiempo crece cada grupo."]},"pitfalls":{"en":["Wide-column is distinct from analytical columnar storage, which scans a field across many records. A fleet-wide average can require reading many partitions; a separate analytical system may suit that workload better.","Grouping all sensors under one site ID creates few large groups and can concentrate load. A time bucket limits accumulated history, but an unusually busy sensor may still need further partitioning."],"es":["Columna ancha se distingue del almacenamiento columnar analítico, que recorre un campo de muchos registros. Una media de todos los sensores puede exigir leer muchas particiones; un sistema analítico separado puede encajar mejor con esa carga.","Agrupar todos los sensores bajo el identificador de una instalación genera pocos grupos grandes y puede concentrar carga. Dividir por intervalos temporales limita el historial acumulado, pero un sensor especialmente activo podría necesitar más subdivisiones."]},"sourceUrls":[{"url":"https://cassandra.apache.org/doc/latest/cassandra/developing/cql/ddl.html","label":"cassandra.apache.org: ddl"},{"url":"https://cassandra.apache.org/doc/latest/cassandra/architecture/overview.html","label":"cassandra.apache.org: overview"},{"url":"https://aws.amazon.com/nosql/","label":"aws.amazon.com: nosql"}]}},{"id":"data-nosql-graph","parent":"data-nosql","title":{"en":"Graph Databases","es":"Bases de datos de grafos"},"summary":{"en":"Follow stored connections to answer questions about chains of relationships between entities.","es":"Sigue conexiones almacenadas para responder a preguntas sobre cadenas de relaciones entre entidades."},"details":{"en":["Entity identity determines whether a path is meaningful. Two accounts with the same display name should not become one node, and a reused device identifier can create a misleading connection. Keep stable identifiers and record where and when a relationship was observed. This lets the application distinguish an observed link from an inference and decide whether a path is relevant to the investigation."],"es":["La identidad de cada entidad determina si un camino tiene sentido. Dos cuentas con el mismo nombre visible no deberían convertirse en un único nodo, y reutilizar un identificador de dispositivo puede crear una conexión engañosa. Mantén identificadores estables y registra dónde y cuándo se observó cada relación. Así, la aplicación puede distinguir un vínculo observado de una inferencia y valorar si el camino es relevante para la investigación."]},"aws":{"en":"For a payment-risk service, Amazon Neptune can hold the account, device and card graph. An openCypher query can retrieve paths within four relationships of A42, returning the intermediate entities so an analyst can inspect why each account appeared.","es":"En un servicio de análisis de riesgo de pagos, Amazon Neptune puede almacenar el grafo de cuentas, dispositivos y tarjetas. Una consulta openCypher puede recuperar caminos de hasta cuatro relaciones desde A42 e incluir las entidades intermedias para que una analista compruebe por qué aparece cada cuenta."},"question":{"en":"A risk team wants to find accounts connected to a flagged account through devices and payment cards. Some devices are public kiosks. How would you decide whether a graph database helps and keep the search useful?","es":"Un equipo de riesgos quiere encontrar cuentas conectadas con una cuenta sospechosa a través de dispositivos y tarjetas de pago. Algunos dispositivos son terminales públicos. ¿Cómo valorarías si conviene una base de datos de grafos y cómo mantendrías útil la búsqueda?"},"answer":{"en":"I would first clarify whether the team explores changing chains of connections or only performs a fixed account-to-device lookup. A graph supports the first need; an indexed relational query may cover the second. For the graph search, I would start from the flagged account, limit path length and filter by observation time. Public kiosks deserve separate handling because many unrelated people use them. I would return the connecting paths for review rather than treat every connected account as fraudulent.","es":"Primero aclararía si el equipo explora cadenas de conexiones variables o solo consulta qué dispositivo utilizó una cuenta. Un grafo permite lo primero; una consulta relacional con índices puede cubrir lo segundo. En la búsqueda sobre el grafo, partiría de la cuenta sospechosa, limitaría la longitud de los caminos y filtraría por fecha de observación. Trataría aparte los terminales públicos porque los usan muchas personas sin relación entre sí. Devolvería los caminos para su revisión, sin considerar fraudulenta a cualquier cuenta conectada."},"related":["data-sql","data-nosql-document"],"sources":[{"label":"Neo4j graph database concepts","url":"https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/"},{"label":"Neo4j Cypher: Variable-length patterns","url":"https://neo4j.com/docs/cypher-manual/current/patterns/variable-length-patterns/"},{"label":"Amazon Neptune overview","url":"https://docs.aws.amazon.com/neptune/latest/userguide/intro.html"}],"level":"applied","learning":{"definition":{"en":"A graph database stores entities and the connections between them so an application can ask how things are related. It is useful when answering a question requires following a chain of connections, rather than just retrieving records with matching values.","es":"Una base de datos de grafos almacena entidades y sus conexiones para que una aplicación pueda consultar cómo se relacionan. Resulta útil cuando responder a una pregunta exige seguir una cadena de conexiones, en lugar de recuperar únicamente registros con valores coincidentes."},"simple":{"en":"In a property graph, an entity is a node, such as an account or a device. A relationship connects two nodes and has a type and direction, such as an account using a device. Properties are descriptive values stored on either, such as the time of use. A traversal follows these stored relationships from a starting node. Repeating that operation lets an investigator discover indirectly connected accounts without writing a separate table join for every step.","es":"En un grafo de propiedades, cada entidad es un nodo, por ejemplo, una cuenta o un dispositivo. Una relación enlaza dos nodos e indica un tipo y una dirección, como una cuenta que utiliza un dispositivo. Las propiedades son datos del nodo o de la relación, como la hora de uso. Un recorrido sigue estos enlaces desde un nodo inicial. Al encadenarlos, el analista descubre cuentas conectadas indirectamente sin tener que escribir una unión entre tablas para cada paso."},"analogy":{"en":"Think of a map of connecting flights: each airport is a node, and each flight is a relationship you can follow. The map shows possible connections, but it cannot explain a passenger's intentions.","es":"Piensa en un mapa de conexiones aéreas: cada aeropuerto es un nodo y cada vuelo es una relación que puedes seguir. El mapa muestra conexiones posibles, pero no permite saber qué pretende un pasajero."},"walkthrough":{"en":["A fraud analyst starts with flagged account A42. The graph records that A42 used device D8 yesterday; a use relationship connects those nodes and carries the observation time.","Following the same device's incoming use relationships reveals account A17. Continuing from A17 to payment card C9 finds a connection the analyst would miss by looking only at A42's own attributes.","The analyst limits the search to four relationships per path and filters out old device-use records during traversal. Returned paths identify connections to investigate; they do not establish that A17 committed fraud."],"es":["Una analista de fraude parte de la cuenta A42, marcada como sospechosa. El grafo recoge que A42 utilizó ayer el dispositivo D8; una relación de uso conecta ambos nodos y guarda el momento de la observación.","Al seguir las relaciones de uso que llegan a ese mismo dispositivo, aparece la cuenta A17. Continuar desde A17 hasta la tarjeta de pago C9 revela una conexión que pasaría desapercibida al consultar solo los atributos de A42.","La analista limita cada camino a cuatro relaciones y descarta los registros de uso antiguos durante el recorrido. Los caminos obtenidos señalan conexiones que investigar; no demuestran que A17 haya cometido fraude."]},"pitfalls":{"en":["Leaving path length unrestricted can multiply the work dramatically. Even a short search can become expensive around a node connected to millions of others.","Choosing a graph just because records have relationships adds complexity. If the application only needs a fixed join between two tables, an indexed relational design may be sufficient."],"es":["No limitar la longitud de los caminos puede multiplicar enormemente el trabajo. Incluso una búsqueda corta puede resultar costosa alrededor de un nodo conectado con millones de otros nodos.","Elegir un grafo solo porque los registros están relacionados añade complejidad. Si la aplicación únicamente necesita una unión fija entre dos tablas, puede bastar un diseño relacional con índices."]},"sourceUrls":[{"url":"https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/","label":"neo4j.com: graphdb concepts"},{"url":"https://neo4j.com/docs/cypher-manual/current/patterns/variable-length-patterns/","label":"neo4j.com: variable length patterns"},{"url":"https://docs.aws.amazon.com/neptune/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}]}},{"id":"data-dynamodb","parent":"data-nosql","title":{"en":"Amazon DynamoDB","es":"Amazon DynamoDB"},"summary":{"en":"Design primary keys around the reads and updates the application needs to perform.","es":"Diseña las claves primarias según las lecturas y actualizaciones que necesita realizar la aplicación."},"details":{"en":["Read consistency and update safety solve different problems. A strongly consistent read reflects completed writes, but it does not reserve that item while the application thinks. If two workers both see an order as pending, both may attempt to mark it paid. Attach a condition to the write that requires the current status to remain pending; if another worker has changed it, the write is rejected and the application can reconsider."],"es":["La consistencia de lectura y la protección frente a actualizaciones simultáneas resuelven problemas distintos. Una lectura con consistencia fuerte refleja las escrituras completadas, pero no reserva el elemento mientras la aplicación decide qué hacer. Si dos procesos ven un pedido pendiente, ambos pueden intentar marcarlo como pagado. Añade a la escritura una condición que exija que el estado siga siendo pendiente; si otro proceso ya lo ha cambiado, la escritura se rechaza y la aplicación puede reevaluar la operación."]},"aws":{"en":"A checkout API running in AWS Lambda can write the C42 order items to DynamoDB and query the customer's order history by key. On-demand billing suits variable request volume, but concentrated traffic can still be throttled. Stored data remains billable even when there are no requests.","es":"Una API de compra ejecutada en AWS Lambda puede guardar los pedidos de C42 en DynamoDB y consultar su historial por clave. La facturación bajo demanda encaja con un volumen variable de peticiones, pero el tráfico concentrado aún puede sufrir limitaciones. El almacenamiento sigue facturándose aunque no haya peticiones."},"question":{"en":"A checkout API updates O730 to paid, then finds it by order ID through a global secondary index and displays pending. What would you change, and what would that change not solve?","es":"Una API de compra actualiza O730 a pagado, después lo busca por identificador de pedido mediante un índice secundario global y muestra pendiente. ¿Qué cambiarías y qué problema no resolvería ese cambio?"},"answer":{"en":"The index may not yet reflect the successful write. Global secondary indexes do not support strongly consistent reads, so I would keep the table's full primary key from the update and use it for a strongly consistent confirmation read. I would leave the index for lookups that can tolerate a short delay. This changes freshness, not concurrency: another worker could still overwrite the item afterwards. If the payment-state transition must only happen from pending, I would also make that write conditional on the current status.","es":"Puede que el índice aún no refleje la escritura completada. Los índices secundarios globales no admiten lecturas con consistencia fuerte, así que conservaría la clave primaria completa de la tabla y la usaría para confirmar el estado con esa consistencia. Reservaría el índice para consultas que toleren cierto retraso. Esto evita leer datos atrasados, pero no impide que otro proceso sobrescriba después el elemento. Si el cambio a pagado solo debe hacerse desde pendiente, condicionaría también la escritura a que el estado actual siga siendo pendiente."},"related":["data-consistency","data-nosql-document","data-caching"],"sources":[{"label":"What is Amazon DynamoDB?","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html"},{"label":"DynamoDB read consistency","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html"},{"label":"DynamoDB service quotas","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html"}],"level":"applied","learning":{"definition":{"en":"A key-value database retrieves a stored record using a unique identifier, while a document model allows that record to contain structured fields. Amazon DynamoDB supports both models as a managed service for applications with predictable lookup and update patterns.","es":"Una base de datos clave-valor recupera un registro mediante un identificador único, mientras que el modelo documental permite incluir campos estructurados en ese registro. Amazon DynamoDB admite ambos modelos como servicio gestionado para aplicaciones cuyas consultas y actualizaciones se conocen de antemano."},"simple":{"en":"An application writes records, called items, into a table. Each item has a primary key: either a partition key alone or a partition key combined with a sort key. The partition key determines placement; the sort key distinguishes items sharing that partition key and orders them for range queries. Designing these keys around the screens your application must load makes targeted reads possible. AWS runs the underlying servers, but your key choices still affect how traffic is distributed.","es":"Una aplicación guarda registros, llamados elementos, en una tabla. Cada elemento tiene una clave primaria: una clave de partición sola o combinada con una clave de ordenación. La primera determina dónde se almacena; la segunda distingue y ordena los elementos que comparten clave de partición, permitiendo consultas por rango. Diseñar las claves según las pantallas que debe cargar la aplicación permite lecturas dirigidas. AWS gestiona los servidores, pero las claves que elijas siguen influyendo en cómo se reparte el tráfico."},"analogy":{"en":"Imagine customer folders containing orders filed by date: the customer label selects a folder, and the date narrows the search inside. The analogy describes retrieval, not a promise that each customer's data occupies one server.","es":"Imagina carpetas de clientes con pedidos ordenados por fecha: el cliente identifica la carpeta y la fecha acota la búsqueda. La comparación explica el acceso, pero no implica que cada cliente ocupe un servidor."},"walkthrough":{"en":["A shop saves order O730 under partition key C42 and sort key 2026-09-21#O730. Another order for C42 has a different dated sort key, so both items remain separately addressable.","C42 opens their September order history. The application queries the C42 partition-key value and sort keys beginning with 2026-09. That selects the relevant orders without scanning the whole table.","After O730 is marked paid successfully, the confirmation page reads the item from the table using its complete primary key and strong consistency. This read reflects completed writes, avoiding an older pending status when confirming the payment."],"es":["Una tienda guarda el pedido O730 con la clave de partición C42 y la clave de ordenación 2026-09-21#O730. Otro pedido de C42 lleva una clave con otra fecha o identificador, por lo que ambos elementos se pueden consultar individualmente.","C42 abre su historial de pedidos de septiembre. La aplicación consulta la clave de partición C42 y las claves de ordenación que empiezan por 2026-09. Así selecciona los pedidos correspondientes sin recorrer toda la tabla.","Tras actualizar correctamente O730 a pagado, la página de confirmación lee el elemento de la tabla con su clave primaria completa y consistencia fuerte. Esta lectura refleja las escrituras completadas y evita mostrar el estado pendiente anterior al confirmar el pago."]},"pitfalls":{"en":["Repeatedly reading the whole table to answer new questions wastes read capacity. Plan alternate keys and duplicate selected fields deliberately because DynamoDB does not join tables for you.","A global secondary index provides another keyed lookup, but its reads can lag behind table updates. Do not use it when the result must reflect a just-completed write."],"es":["Leer repetidamente toda la tabla para responder a nuevas preguntas desperdicia capacidad de lectura. Prevé claves alternativas y duplica ciertos campos de forma deliberada, porque DynamoDB no realiza uniones entre tablas.","Un índice secundario global ofrece otra vía de consulta por clave, pero sus lecturas pueden ir por detrás de las actualizaciones de la tabla. No lo uses si necesitas reflejar una escritura recién completada."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html","label":"docs.aws.amazon.com: Introduction"},{"url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html","label":"docs.aws.amazon.com: HowItWorks.ReadConsistency"},{"url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html","label":"docs.aws.amazon.com: ServiceQuotas"}]}},{"id":"data-caching","parent":"data","title":{"en":"Caching Strategies","es":"Estrategias de caché"},"summary":{"en":"Reuse frequent reads, and make the path from a committed change to its cached copy explicit.","es":"Reutiliza lecturas frecuentes y define cómo llega cada cambio confirmado a su copia en caché."},"details":{"en":["An absent result can also be cached, such as a search for a museum that has not yet been listed. This reduces repeated unsuccessful database lookups, but it can hide a newly created record until that negative entry expires or is removed. Give these entries an explicit lifetime, and distinguish a genuine absence from a database error before caching the response."],"es":["También se puede guardar en caché un resultado ausente, por ejemplo al buscar un museo que todavía no figura en el catálogo. Así se evitan consultas repetidas sin resultado, pero una entrada negativa puede ocultar un registro recién creado hasta que caduque o se elimine. Asigna una duración explícita a estas entradas y distingue una ausencia real de un error de la base de datos antes de guardar la respuesta."]},"aws":{"en":"A museum website can keep its official timetable in Amazon RDS and use Amazon ElastiCache for Valkey to cache each day's hours; the application fills missing entries and invalidates them after committed changes.","es":"La web de un museo puede guardar el horario oficial en Amazon RDS y utilizar Amazon ElastiCache para Valkey como caché del horario de cada día; la aplicación incorpora las entradas ausentes y las invalida tras confirmar los cambios."},"question":{"en":"The museum extended Saturday's opening hours, but deleting the cached timetable failed. Visitors still see the old closing time. How would you handle this?","es":"El museo amplió el horario del sábado, pero falló la eliminación del horario en caché. Los visitantes siguen viendo la hora de cierre antigua. ¿Cómo lo resolverías?"},"answer":{"en":"The database change succeeded, but the cached copy did not learn about it. Treat those as separate outcomes rather than reporting an atomic update. Retry invalidation from a durable change record saved in the same database transaction as the update, often called an outbox. Expiry provides a fallback; version checks can reject delayed refreshes carrying older values. If visitors must see the change immediately, temporarily read this timetable from the database, while checking that it can handle the traffic.","es":"El cambio se confirmó en la base, pero la copia no se actualizó. Son resultados distintos, no una actualización atómica. Reintenta la invalidación mediante un registro duradero del cambio, guardado en la misma transacción que la actualización, patrón denominado outbox. La caducidad sirve de respaldo; comprobar versiones permite rechazar recargas antiguas. Si los visitantes deben ver el cambio inmediatamente, consulta temporalmente ese horario en la base de datos, comprobando que pueda soportar las peticiones."},"related":["data-consistency","data-nosql"],"sources":[{"label":"ElastiCache best practices and caching strategies","url":"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/BestPractices.html"},{"url":"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html","label":"docs.aws.amazon.com: Strategies"},{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}],"level":"applied","learning":{"definition":{"en":"A cache keeps a reusable copy of data near the code that reads it, so repeated requests need less time and work from the original store. A caching strategy decides how that copy is filled, refreshed and removed as the underlying information changes.","es":"Una caché conserva una copia reutilizable de los datos cerca del código que los consulta, para reducir el tiempo y el trabajo que las peticiones repetidas exigen al almacén original. Una estrategia de caché define cómo se incorpora, actualiza y elimina esa copia cuando cambia la información de origen."},"simple":{"en":"The application owns the read path, the database holds the authoritative record, and the cache holds temporary copies. With cache-aside, the application checks the cache, fetches missing data from the database and saves a copy. With write-through, it also refreshes the cache on the write path, after the database accepts the change. A time to live (TTL) makes an entry expire after a chosen interval. Fewer database reads improve capacity, but copies can fall behind when updates or refreshes fail.","es":"La aplicación lee los datos, la base de datos conserva el original y la caché guarda copias temporales. Con cache-aside, la aplicación consulta la caché; si falta el dato, lo obtiene de la base y guarda una copia. Con write-through, también actualiza la caché al escribir, tras confirmar el cambio en la base. El tiempo de vida (TTL) establece cuándo caduca una entrada. Reducir las lecturas alivia la base de datos, pero un fallo de actualización puede dejar copias antiguas."},"analogy":{"en":"A receptionist keeps the museum timetable on a desk rather than phoning the office for every visitor. The note saves calls, but it cannot reveal a change nobody has copied onto it.","es":"Un recepcionista consulta una nota con el horario del museo en vez de llamar a la oficina por cada visitante. Ahorra llamadas, pero la nota no refleja los cambios que nadie haya trasladado a ella."},"walkthrough":{"en":["A visitor asks the museum website for Saturday's closing time. The application finds no cached entry, a cache miss. It reads 18:00 from the database, caches it for 60 seconds and answers the visitor.","The next 200 visitors reuse that copy. A manager extends closing time to 20:00. Once the database confirms the change, the application removes the cached entry; the next request loads and caches 20:00.","After a cache restart, many visitors arrive together. The application combines simultaneous requests for the timetable into one database lookup, rather than allowing every visitor to trigger a separate lookup."],"es":["Un visitante consulta en la web a qué hora cierra el museo el sábado. La aplicación no encuentra una entrada en caché, un miss. Lee las 18:00 en la base de datos, guarda una copia durante 60 segundos y responde.","Los siguientes 200 visitantes reutilizan esa copia. Un responsable amplía el horario hasta las 20:00. Cuando la base confirma el cambio, la aplicación elimina la entrada de caché; la siguiente petición obtiene y guarda las 20:00.","Tras reiniciar la caché, llegan muchos visitantes a la vez. La aplicación agrupa las peticiones simultáneas del horario en una sola consulta a la base de datos, en lugar de lanzar una consulta por visitante."]},"pitfalls":{"en":["Expiry limits how long a particular entry stays stored, not every possible freshness error. A slow reader can refill the cache with an older value after an update; version checks help detect that race.","Do not treat fallback as free capacity. If the cache disappears, database demand can jump sharply; measure that load and spread expiry times so popular entries do not all expire together."],"es":["La caducidad limita cuánto permanece almacenada una entrada, pero no evita cualquier lectura desactualizada. Un lector lento puede reintroducir un valor antiguo después de un cambio; comprobar versiones ayuda a detectar esa carrera.","Recurrir a la base de datos no aporta capacidad gratuita. Si desaparece la caché, las consultas pueden dispararse; mide esa carga y escalona las caducidades para que las entradas populares no venzan todas a la vez."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html","label":"docs.aws.amazon.com: Strategies"},{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}]}},{"id":"data-streaming","parent":"data","title":{"en":"Streaming Data","es":"Datos en streaming"},"summary":{"en":"Keep events long enough for independent readers to recover and replay without stopping their peers.","es":"Conserva los eventos para que cada lector pueda recuperarse y reprocesarlos sin detener a los demás."},"details":{"en":["Partition keys also shape capacity. Routing every scan from a busy hub to one key can overload its partition while others have spare room. A parcel ID spreads work more finely when parcels are numerous. Splitting one parcel's events across keys can spread its load further, but its journey would then need application logic to combine events from separate sequences."],"es":["Las claves de partición también condicionan la capacidad. Enviar todos los escaneos de un centro muy activo a una sola clave puede saturar su partición mientras otras tienen margen. El identificador de paquete reparte el trabajo con más detalle cuando hay muchos paquetes. Distribuir los eventos de un mismo paquete entre varias claves puede repartir aún más la carga, pero la aplicación tendría que combinar secuencias separadas para reconstruir su recorrido."]},"aws":{"en":"For parcel tracking, put scan events into Amazon Kinesis Data Streams using the parcel ID as the partition key, then run separate tracking and delay consumers. Amazon Data Firehose can buffer and deliver an archival copy to S3, but it does not replace those independently replayable consumers.","es":"Para seguir paquetes, envía los escaneos a Amazon Kinesis Data Streams con el identificador de paquete como clave de partición y ejecuta consumidores separados de seguimiento y retrasos. Amazon Data Firehose puede agrupar y entregar una copia de archivo en S3, pero no sustituye a esos consumidores con relectura independiente."},"question":{"en":"The delay detector was down for two hours while parcel tracking kept working. What would you check before restarting it?","es":"El detector de retrasos estuvo caído dos horas mientras el seguimiento de paquetes siguió funcionando. ¿Qué comprobarías antes de reiniciarlo?"},"answer":{"en":"The tracking service can continue because the detector has its own reading position. Check that the missing interval is still retained, then resume from the last checkpoint corresponding to completed processing. Some events may run again if the detector failed between applying an update and saving its checkpoint, so suppress repeated side effects using event identifiers. Also compare its processing rate with the arrival rate: if it cannot process faster than new scans arrive, its backlog will not shrink.","es":"El seguimiento puede continuar, porque el detector mantiene su propia posición de lectura. Comprueba que el intervalo perdido siga conservado y reanuda desde el último punto de control correspondiente a trabajo completado. Algunos eventos pueden repetirse si el detector falló después de aplicar un cambio y antes de guardar ese punto, así que utiliza sus identificadores para evitar efectos duplicados. Compara también la velocidad de procesamiento con la llegada de eventos: si no procesa más rápido de lo que entran nuevos escaneos, no reducirá el trabajo pendiente."},"related":["data-consistency","cloud-distributed-systems"],"sources":[{"label":"Amazon Kinesis Data Streams - Key Concepts","url":"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"}],"level":"applied","learning":{"definition":{"en":"Streaming data is a flow of events produced as activity happens rather than collected only for a later batch. A streaming platform retains those events in a log so applications can respond continuously and, within the retention period, read earlier events again.","es":"Los datos en streaming forman un flujo de eventos que se generan a medida que ocurre la actividad, en vez de recopilarse solo para un lote posterior. Una plataforma de streaming los conserva en un registro para que las aplicaciones reaccionen continuamente y puedan releerlos dentro del plazo de retención."},"simple":{"en":"A producer, such as a parcel scanner, appends events to a log. The platform divides that log into partitions, smaller sequences used to spread storage and processing load. A partition key routes related events to the same sequence. Each consumer, an application reading the events, tracks its own position, so a tracking page and a delay detector can process the same scans independently. Ordering belongs to a partition, not the whole stream; retries and parallel producers still need careful handling.","es":"Un productor, como un escáner de paquetería, añade eventos a un registro. La plataforma lo divide en particiones, secuencias que reparten la carga de almacenamiento y procesamiento. Una clave de partición dirige los eventos relacionados a la misma secuencia. Cada consumidor, la aplicación que lee eventos, mantiene su propia posición: el seguimiento y la detección de retrasos avanzan de forma independiente. El orden se define dentro de cada partición, no para todo el flujo; los reintentos y productores simultáneos también requieren cuidado."},"analogy":{"en":"A stream resembles a recorded radio broadcast: each listener can pause and revisit retained sections independently. Unlike radio, a partitioned stream has several separate timelines, not one universal sequence for every listener.","es":"Un flujo recuerda a una emisión de radio grabada: cada oyente puede detenerse y volver a fragmentos conservados. A diferencia de la radio, un flujo particionado contiene varias secuencias, no una cronología única."},"walkthrough":{"en":["Parcel P42 is scanned at collection and again at a sorting hub. Both events carry P42 as the partition key, plus a unique event identifier and the scanner's event time.","The tracking consumer updates P42's journey, then saves a checkpoint, its recorded reading position. A separate delay detector reads the same scans without taking them away from the tracking consumer.","A bug makes the delay detector misclassify P42. After fixing it, the team restarts that consumer from an earlier position within retention. The tracking consumer continues from its own position."],"es":["El paquete P42 se escanea al recogerlo y después en un centro de clasificación. Ambos eventos llevan P42 como clave de partición, un identificador único de evento y la hora registrada por el escáner.","El consumidor de seguimiento actualiza el recorrido de P42 y guarda un punto de control, su posición de lectura registrada. Otro consumidor detecta retrasos leyendo los mismos escaneos, sin retirárselos al primero.","Un error hace que el detector de retrasos clasifique mal P42. Tras corregirlo, el equipo reinicia ese consumidor desde una posición anterior que aún se conserva. El consumidor de seguimiento continúa desde su propia posición."]},"pitfalls":{"en":["A timestamp describes when a scanner reports an event happened; log position describes where it was accepted. Delayed uploads can reverse that order, so use event time or per-parcel sequence numbers when reconstructing a journey.","Replaying an event can repeat a notification or charge. Record processed event identifiers with the resulting state change, or make the operation idempotent, meaning repetition has the same effect as one execution."],"es":["La marca temporal indica cuándo dice el escáner que ocurrió el evento; la posición indica dónde se incorporó al registro. Un envío tardío puede alterar ese orden: reconstruye el recorrido con la hora del evento o números de secuencia por paquete.","Reprocesar un evento puede repetir una notificación o un cobro. Guarda los identificadores procesados junto con el cambio de estado, o haz la operación idempotente: repetirla debe tener el mismo efecto que ejecutarla una vez."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html","label":"docs.aws.amazon.com: key concepts"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"}]}},{"id":"data-consistency","parent":"data","title":{"en":"Consistency Models","es":"Modelos de consistencia"},"summary":{"en":"Decide whether a workflow may act on an older value after an update has already succeeded.","es":"Decide si un proceso puede actuar sobre un valor antiguo después de que una actualización se haya confirmado."},"details":{"en":["Read-your-writes is a narrower property than linearizability: a user sees their own completed changes, but other users may still see older values. A service might provide this by keeping that user's reads on an up-to-date path while replicas catch up. A test using only the person who made the change therefore says little about what a separate service or another user observes."],"es":["Leer las propias escrituras es una propiedad más limitada que la linealizabilidad: un usuario ve sus cambios completados, pero los demás aún pueden ver valores antiguos. Un servicio podría ofrecerla dirigiendo las lecturas de ese usuario a una copia actualizada mientras las réplicas se ponen al día. Por tanto, probar solo con quien realizó el cambio revela poco sobre lo que observa otro servicio u otro usuario."]},"aws":{"en":"For the address confirmation page, request a strongly consistent DynamoDB table read. Local secondary indexes also support this option; global secondary indexes do not. With Global Tables across Regions, check the selected consistency mode, supported Regions and feature restrictions before assuming the same cross-Region behaviour.","es":"Para confirmar la dirección, solicita una lectura fuerte de la tabla de DynamoDB. Los índices secundarios locales también admiten esta opción; los globales no. Si utilizas Global Tables entre regiones, comprueba el modo de consistencia elegido, las regiones admitidas y las restricciones de funciones antes de asumir el mismo comportamiento entre regiones."},"question":{"en":"The profile page confirms an address change, but the label service prints the old address. Would enabling strong reads everywhere solve this?","es":"La página del perfil confirma un cambio de dirección, pero el servicio de etiquetas imprime la antigua. ¿Bastaría con activar lecturas fuertes en todas partes?"},"answer":{"en":"First trace where the label service obtained the address. A replica read made after the update may need stronger consistency, but a queued job could already contain an older address, which changing the read setting will not repair. If labels must use the confirmed address version, include that version in the job and check it when authorising the label. Strong reads govern individual observations; they do not automatically coordinate the profile update, a background queue and the external printing step.","es":"Primero averigua de dónde obtuvo la dirección el servicio de etiquetas. Una lectura de réplica posterior al cambio podría necesitar mayor consistencia, pero un trabajo encolado puede contener ya la dirección antigua, y cambiar la lectura no lo corrige. Si la etiqueta debe usar la versión confirmada, incluye esa versión en el trabajo y compruébala al autorizar la impresión. Las lecturas fuertes regulan observaciones individuales; no coordinan por sí solas la actualización del perfil con la cola de trabajos y la impresión externa."},"related":["data-nosql","data-sql","cloud-distributed-systems"],"sources":[{"label":"Amazon S3 data consistency model","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"label":"DynamoDB read consistency","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html","label":"docs.aws.amazon.com: Aurora.Replication"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"}],"level":"deep","learning":{"definition":{"en":"A consistency model specifies which stored value a read is allowed to return when writes and reads overlap or data is copied. It helps you decide whether a workflow can tolerate an older answer or needs a result that respects completed updates.","es":"Un modelo de consistencia especifica qué valor almacenado puede devolver una lectura cuando se solapan lecturas y escrituras o existen copias de los datos. Sirve para decidir si un proceso admite una respuesta antigua o necesita un resultado que respete las actualizaciones ya completadas."},"simple":{"en":"A writer changes a record, while readers may reach different replicas, which are copies held on different servers. For one record, a linearizable read, often called strongly consistent, must respect writes completed before that read began. If operations overlap, either valid ordering may apply. Eventual consistency permits older replies while replicas catch up; once writes stop and updates can propagate, the copies converge. Choosing a model changes which observations the application must handle, not just response speed.","es":"Un escritor modifica un registro y los lectores pueden consultar réplicas, copias alojadas en servidores distintos. Para un registro, una lectura linealizable, habitualmente llamada fuertemente consistente, debe respetar las escrituras completadas antes de iniciarse. Si las operaciones se solapan, puede admitirse cualquiera de sus ordenaciones válidas. La consistencia eventual permite respuestas antiguas mientras las réplicas se actualizan; si cesan las escrituras y los cambios se propagan, las copias convergen. El modelo determina qué resultados debe gestionar la aplicación, no solo cuánto tarda en responder."},"analogy":{"en":"Two courier depots keep copies of a customer's delivery address. A delayed update leaves one using the old address. The comparison illustrates stale copies, but real consistency models define allowed operation orders precisely.","es":"Dos delegaciones de mensajería conservan copias de la dirección de un cliente. Si una actualización se retrasa, una utiliza la antigua. La comparación ilustra copias desactualizadas, pero los modelos reales precisan qué secuencias de operaciones permiten."},"walkthrough":{"en":["Maya changes her delivery address from 12 Pine Street to 8 Lake Street. The service confirms the write. She then opens the address page, so this read starts after the change completed.","An eventually consistent read may still show 12 Pine Street from a lagging replica. For a linearizable read of this record, 8 Lake Street is the required result, assuming nobody has changed it again.","A network partition, a communication break between servers, isolates a depot with the old copy. Preserving linearizable behaviour may require waiting or rejecting its read. Answering with the old address instead would sacrifice that consistency."],"es":["Maya cambia su dirección de entrega de la calle Pino, 12 a la calle Lago, 8. El servicio confirma la escritura. Después abre la página de direcciones, por lo que esta lectura comienza cuando el cambio ya ha terminado.","Una lectura eventual aún puede mostrar la calle Pino, 12 desde una réplica atrasada. Una lectura linealizable de este registro debe devolver la calle Lago, 8, suponiendo que nadie haya vuelto a cambiarlo.","Una partición de red, un corte de comunicación entre servidores, aísla una delegación con la copia antigua. Mantener la linealizabilidad puede exigir esperar o rechazar su lectura. Responder con la dirección antigua sacrificaría esa consistencia."]},"pitfalls":{"en":["Strong reads do not combine separate actions into a transaction. Reading the new address and later booking a label still leaves time for another change; coordinate those actions if they must use one version.","Do not interpret eventual as a fixed delay. Convergence depends on updates propagating and the system's conflict rules; a disconnected replica can remain behind, even when most readers see the new value."],"es":["Las lecturas fuertes no convierten acciones separadas en una transacción. Entre leer la dirección nueva y encargar una etiqueta puede producirse otro cambio; coordina ambas acciones si deben utilizar una misma versión.","Eventual no significa un retraso fijo. La convergencia depende de que se propaguen las actualizaciones y de las reglas para resolver conflictos; una réplica desconectada puede seguir atrasada aunque la mayoría ya lea el valor nuevo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html","label":"docs.aws.amazon.com: Aurora.Replication"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"}]}},{"id":"data-warehousing","parent":"data","title":{"en":"Data Warehousing and Analytics","es":"Almacenamiento de datos analíticos"},"summary":{"en":"Separate transaction capture from large analytical scans, then make row meaning and data freshness visible.","es":"Separa el registro de operaciones del análisis masivo y deja claros el significado de cada fila y hasta cuándo están actualizados los datos."},"details":{"en":["When a product changes category, decide whether past sales should retain the category at purchase time or be restated under today's category. Keeping dated category versions allows historical joins, but the date ranges must not overlap for the same product. Otherwise, a sales table with no duplicate lines can still produce doubled totals after the join."],"es":["Cuando un producto cambia de categoría, decide si las ventas pasadas deben conservar la categoría de la compra o recalcularse con la actual. Guardar versiones de categoría con fechas permite hacer uniones históricas, pero los intervalos no deben solaparse para un mismo producto. De lo contrario, una tabla de ventas sin líneas duplicadas puede producir totales duplicados después de la unión."]},"aws":{"en":"Load recent order lines into Amazon Redshift for columnar, parallel reporting, and query older Parquet files in S3 through Redshift Spectrum when needed. Those external queries still consume query resources and can incur scan charges.","es":"Carga las líneas de pedido recientes en Amazon Redshift para elaborar informes con almacenamiento columnar y procesamiento paralelo, y consulta los archivos Parquet antiguos de S3 mediante Redshift Spectrum cuando los necesites. Esas consultas externas siguen consumiendo recursos y pueden generar cargos por datos examinados."},"question":{"en":"Yesterday's category report is 8% above the order system, even though both queries finish successfully. How would you investigate?","es":"El informe de ayer por categoría supera en un 8% al sistema de pedidos, aunque ambas consultas terminan correctamente. ¿Cómo lo investigarías?"},"answer":{"en":"Start by aligning the business date and data cutoff, because two correct queries can cover different orders. Then compare source order lines with the warehouse before any category join, checking that each order and line identifier appears once. If the base totals match but the grouped report grows, inspect the category join for multiple matches. If the discrepancy exists earlier, trace late loads or repeated batches. Faster queries cannot resolve a mismatch in scope or row meaning.","es":"Primero igualaría la fecha de negocio y la hora de corte: dos consultas correctas pueden incluir pedidos diferentes. Después compararía las líneas de origen con las del almacén antes de unir categorías, comprobando que cada pareja de pedido y línea aparezca una sola vez. Si los totales iniciales coinciden, pero aumentan al agrupar, buscaría varias coincidencias en la unión de categorías. Si la diferencia ya existía, revisaría cargas tardías o lotes repetidos. Ejecutar más rápido no corrige un alcance distinto ni filas mal definidas."},"related":["data-sql","cost-optimization"],"sources":[{"label":"Amazon Redshift Columnar Storage","url":"https://docs.aws.amazon.com/redshift/latest/dg/c_columnar_storage_disk_mem_mgmnt.html"},{"url":"https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html","label":"docs.aws.amazon.com: c high level system architecture"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"}],"level":"applied","learning":{"definition":{"en":"A data warehouse is a store organised for analysing business activity across many records and sources. It gives reporting work a separate place to calculate totals, trends and comparisons without making each report share the application's transaction-processing resources.","es":"Un almacén de datos analíticos organiza información de numerosos registros y fuentes para estudiar la actividad del negocio. Ofrece un entorno separado para calcular totales, tendencias y comparaciones, sin obligar a que cada informe comparta los recursos que la aplicación utiliza para procesar operaciones."},"simple":{"en":"The order system records each purchase as it happens. A data pipeline copies those changes into analytical tables, where one row might represent one order line. In columnar storage, values from the same column are stored together, so a report about units and revenue need not read addresses or delivery notes. Parallel workers process different portions of the data and combine their results. This layout suits large scans and aggregations, while the operational database remains responsible for accepting orders.","es":"El sistema de pedidos registra cada compra cuando ocurre. Un proceso de carga copia los cambios a tablas analíticas, donde una fila puede representar una línea de pedido. El almacenamiento columnar agrupa los valores de cada columna: un informe de unidades e ingresos evita leer direcciones o instrucciones de entrega. Varios procesos trabajan sobre porciones distintas y combinan sus resultados. Este diseño facilita recorrer muchos registros y calcular agregados, mientras la base operativa sigue encargándose de aceptar pedidos."},"analogy":{"en":"Think of checkout receipts being copied into an accountant's ledger prepared for analysis. The shop can keep serving customers, but the ledger's totals are only as current and accurate as the copying process.","es":"Es como copiar los recibos de caja en un libro contable para analizarlos. La tienda puede seguir atendiendo, pero la actualidad y exactitud de los totales dependen de cómo se realice esa copia."},"walkthrough":{"en":["A retailer needs yesterday's units sold by category. Its pipeline copies order lines into the warehouse, storing one row per line with the order ID, line ID, product ID, quantity and sale date.","The report joins each line to exactly one applicable product category, reads quantities and dates, and sums units by category. Workers calculate partial totals that the query engine combines into the final result.","A late order arrives after the first load. The pipeline adds it using the order and line identifiers to avoid inserting an existing line twice, then refreshes the report and displays the new data cutoff."],"es":["Un comercio necesita las unidades vendidas ayer por categoría. Su proceso de carga copia las líneas de pedido al almacén: una fila por línea, con identificadores de pedido, línea y producto, cantidad y fecha de venta.","El informe une cada línea con una única categoría de producto aplicable, lee cantidades y fechas, y suma unidades por categoría. Los procesos calculan totales parciales que el motor de consultas combina en el resultado final.","Un pedido llega tarde, después de la primera carga. El proceso lo incorpora usando los identificadores de pedido y línea para no duplicar una línea existente; después actualiza el informe y muestra la nueva hora de corte de los datos."]},"pitfalls":{"en":["Define the grain, what one row represents, before adding tables. If a product joins to several category records, each sold unit can appear several times and inflate totals even when the query runs successfully.","Moving reports does not eliminate extraction cost or missing data. Limit the load placed on the source, track how far ingestion has progressed, and reconcile warehouse totals against the same source time window."],"es":["Defi
