.dg-facts{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:12px;margin:14px 0 0}
.dg-facts dt{color:var(--muted)}
.dg-facts dd{margin:0;font-weight:bold;text-align:right}
.dg-actors{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.dg-actor{font-size:10.5px;letter-spacing:.6px;border:1px solid var(--line);padding:4px 8px;color:var(--muted);background:var(--panel)}
.dg-steps{counter-reset:dgstep;list-style:none;margin:0;padding:0}
.dg-steps li{counter-increment:dgstep;position:relative;padding:0 0 16px 30px;border-left:1px solid #c5cebf;margin-left:9px}
.dg-steps li:last-child{border-left-color:transparent;padding-bottom:0}
.dg-steps li:before{content:counter(dgstep);position:absolute;left:-10px;top:0;width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:10px;display:flex;align-items:center;justify-content:center}
.dg-hop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin:0 0 5px}
.dg-arrow{color:var(--muted)}
.dg-msg{font-size:13.5px;line-height:1.7;margin:0}
.dg-flow+.dg-flow{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.dg-flow-label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:bold;margin:0 0 12px}
.dg-lanes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dg-lane{position:relative;padding-bottom:8px}
.dg-zone{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.dg-box{border:1px solid #b7c5ae;background:var(--panel);padding:10px 12px;margin-bottom:7px}
.dg-box strong{font-size:13px;font-weight:normal;display:block}
.dg-box:last-child{margin-bottom:0}
.dg-hop-arrow{display:block;text-align:center;color:var(--accent);transform:rotate(90deg);margin:4px 0}
.dg-band{border:1px dashed #a6b999;background:var(--wash);padding:11px 13px;margin-bottom:10px}
.dg-band:last-child{margin:10px 0 0}
.dg-band strong{font-size:13px;font-weight:normal;display:block}
.dg-zone-grid{display:grid;gap:10px}
.dg-zone-col{border:1px solid var(--line);padding:11px}
@media(min-width:760px){.dg-lanes{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:start}
.dg-hop-arrow{position:absolute;right:-9px;top:26px;transform:none;margin:0}
.dg-zone-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.diagram-body{padding:20px}}
@media(max-width:560px){.learn-simple{padding:0}
.learn-definition{font-size:17px}
.diagram figcaption strong{font-size:19px}
.diagram-body{padding:13px}
.dg-row{padding:10px 4px;gap:9px}
.dg-bit{width:17px;height:25px;font-size:11px}
.dg-steps li{padding-left:22px}}
@media(max-width:380px){.dg-bit{width:14px;height:22px;font-size:10px}
.dg-octets{gap:4px}
.dg-facts{grid-template-columns:1fr;gap:2px}
.dg-facts dd{text-align:left;margin-bottom:8px}
.dg-num{font-size:17px;min-width:18px}}
@media print{.learn-more,.technical-notes{break-inside:avoid}
.learn-more summary::after,.technical-notes>summary::after{display:none}
.learn-detail,.technical-notes .explanation{display:block}
.diagram{break-inside:avoid}
.diagram-body{border-color:#ccc;background:transparent}
.dg-bit.net{background:#ddd}
.dg-box,.dg-band,.learn-simple{background:transparent;border-color:#ccc}}
</style>

<script id="curriculum" type="application/json">[{"id":"networking","parent":null,"title":{"en":"Networking","es":"Redes"},"summary":{"en":"Follow the request and its reply: both need delivery, an available service and compatible communication rules.","es":"Sigue la petición y su respuesta: ambas necesitan entrega, un servicio disponible y reglas de comunicación compatibles."},"details":{"en":["One page can depend on several network conversations: retrieving the document, calling an inventory API, the interface used to request stock data, and downloading images. A successful document request therefore does not prove every dependency is reachable. Grouping failures by destination and operation separates one broken service from a problem affecting the user's whole connection."],"es":["Una página puede depender de varias comunicaciones: obtener el documento, consultar una API de inventario, la interfaz que permite pedir datos de existencias, y descargar imágenes. Por tanto, recibir el documento no demuestra que todas sus dependencias sean accesibles. Agrupar los fallos por destino y operación ayuda a distinguir un servicio averiado de un problema que afecta a toda la conexión del usuario."]},"aws":{"en":"For an inventory application in Amazon VPC, a private IP lets the web server address the database, while a security group can admit connections on the database's port only from the web servers' security group. The database must also be listening.","es":"En una aplicación de inventario dentro de Amazon VPC, una IP privada permite al servidor web dirigirse a la base de datos. Un grupo de seguridad puede admitir conexiones a su puerto solo desde el grupo de los servidores web. La base de datos también debe estar escuchando."},"question":{"en":"The warehouse stock page opens, but its stock lookup keeps timing out. Does that rule out a networking fault, and what would you check next?","es":"La página de existencias del almacén abre, pero su consulta de stock agota el tiempo de espera. ¿Eso descarta un fallo de red y qué comprobarías a continuación?"},"answer":{"en":"It shows that one request reached the component serving the page, not that every connection the page needs works. I would inspect the failed stock request to identify its destination and port, then check whether that service is listening and whether traffic can reach it and return. I would also compare a timeout with an explicit permission error, since they suggest different failure points. A separate stock service can be unreachable while the page itself loads normally.","es":"Solo demuestra que una petición llegó al componente que sirve la página, no que funcionen todas sus conexiones. Revisaría la petición de existencias fallida para conocer su destino y puerto; después comprobaría si el servicio escucha y si el tráfico puede llegar y volver. También distinguiría un tiempo de espera agotado de una denegación explícita de permisos, porque apuntan a fallos diferentes. La página puede cargar con normalidad mientras el servicio de existencias, alojado aparte, sigue inaccesible."},"related":["architecture","security"],"sources":[{"label":"Amazon VPC fundamentals","url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"},{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview","label":"developer.mozilla.org: Overview"}],"level":"foundation","learning":{"definition":{"en":"Networking lets separate devices exchange data so that an application on one device can use a service on another. It combines a way to carry signals with rules for identifying destinations, forwarding traffic and interpreting messages.","es":"Las redes permiten que distintos dispositivos intercambien datos para que una aplicación de un equipo utilice un servicio de otro. Combinan un medio para transportar señales con reglas para identificar destinos, encaminar el tráfico e interpretar mensajes."},"simple":{"en":"Imagine a warehouse laptop asking an inventory server for a stock count. Each device has a network interface, its attachment to the network, and an IP address used for delivery across networks. Data travels in packets, small units with delivery information. If the server is outside the laptop's local network, a router forwards those packets towards it. A transport protocol manages communication between programs; a port number helps identify the intended service on the receiving device.","es":"Imagina que un portátil del almacén consulta las existencias de un servidor. Cada equipo tiene una interfaz de red, su punto de conexión, y una dirección IP que permite dirigir datos entre redes. Los datos viajan en paquetes, unidades pequeñas con información de entrega. Si el servidor está en otra red, un router encamina esos paquetes. Un protocolo de transporte gestiona la comunicación entre programas; un número de puerto ayuda a identificar el servicio destinatario."},"analogy":{"en":"A network resembles depots moving labelled boxes between businesses. Addresses guide the journey. Unlike boxes, packets may travel along different routes and need software to reconstruct the data for the receiving application.","es":"Una red se parece a almacenes que transportan cajas etiquetadas entre empresas. Las direcciones orientan el recorrido. A diferencia de las cajas, los paquetes pueden seguir rutas distintas y necesitan software que reconstruya los datos para la aplicación."},"walkthrough":{"en":["An employee opens the warehouse's stock page. DNS, the name lookup service, returns the inventory server's IP address. The laptop selects its router because the server is on another network.","This connection uses TCP, which provides an ordered byte stream and retransmits missing data. HTTPS uses TLS, a cryptographic protocol, to protect the web request in transit and let the browser check the server's identity.","The employee requests the stock count. Routers forward the encrypted request, and the server sends its response back. A firewall rule, which allows or blocks traffic, must permit the exchange or the page cannot load."],"es":["Una empleada abre la página de existencias del almacén. DNS, el servicio que resuelve nombres, devuelve la dirección IP del servidor de inventario. El portátil elige su router porque el servidor está en otra red.","Esta conexión utiliza TCP, que ofrece un flujo ordenado de bytes y retransmite los datos perdidos. HTTPS emplea TLS, un protocolo criptográfico, para proteger la petición durante el tránsito y permitir que el navegador compruebe la identidad del servidor.","La empleada solicita las existencias. Los routers encaminan la petición cifrada y el servidor devuelve la respuesta. Una regla de cortafuegos, que permite o bloquea tráfico, debe admitir ese intercambio; de lo contrario, la página no puede cargar."]},"pitfalls":{"en":["Reaching an IP address does not prove that the right program is responding. The service may be stopped, listening on another port or rejecting the user's request.","Delivery needs a usable return path as well as an outbound route. Also, encryption protects data in transit; it does not decide which stock records a signed-in user may read."],"es":["Poder llegar a una dirección IP no demuestra que responda el programa adecuado. El servicio puede estar detenido, escuchar en otro puerto o rechazar la petición del usuario.","La entrega necesita un camino de vuelta utilizable, además de una ruta de ida. Por otra parte, el cifrado protege los datos en tránsito; no decide qué registros puede consultar un usuario que ha iniciado sesión."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html","label":"docs.aws.amazon.com: what is amazon vpc"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview","label":"developer.mozilla.org: Overview"}]}},{"id":"osi","parent":"networking","title":{"en":"OSI model: seven layers","es":"Modelo OSI: siete capas"},"summary":{"en":"Use the seven layers to name communication responsibilities and narrow a fault, not to count software components.","es":"Utiliza las siete capas para identificar funciones de comunicación y acotar un fallo, no para contar componentes de software."},"details":{"en":["A packet capture, a recording of observed network traffic, shows one observation point rather than every layer. A capture near the client may reveal IP addresses and TCP behaviour while TLS hides the web request. Application logs provide a different view, so matching timestamps can connect transport symptoms with server processing."],"es":["Una captura de paquetes, un registro del tráfico observado, muestra un punto de observación, no todas las capas. Cerca del cliente puede revelar direcciones IP y el comportamiento de TCP, mientras TLS oculta la petición web. Los registros de aplicación ofrecen otra perspectiva; comparar las marcas de tiempo ayuda a relacionar síntomas de transporte con el procesamiento del servidor."]},"aws":{"en":"With an HTTPS listener, an Application Load Balancer can decrypt a request and use its HTTP path to select the order service. That selection uses application-layer information; the client still needs a working lower-layer connection to reach the balancer.","es":"Con un listener HTTPS, un Application Load Balancer puede descifrar una petición y utilizar su ruta HTTP para elegir el servicio de pedidos. Esa elección usa información de la capa de aplicación; el cliente sigue necesitando conectividad en las capas inferiores para llegar al balanceador."},"question":{"en":"A website returns HTTP 503, and a teammate wants to replace the client's Ethernet cable because 'the network is down'. How would you use OSI to guide the investigation?","es":"Una web devuelve HTTP 503 y un compañero quiere sustituir el cable Ethernet del cliente porque dice que la red está caída. ¿Cómo utilizarías OSI para orientar la investigación?"},"answer":{"en":"Receiving an HTTP response means this exchange reached a component that could process the web request. That makes an immediate cable replacement poorly supported by the evidence. I would identify which component produced the 503 and inspect its logs and backend connectivity. OSI helps separate the working client-to-responder path from a possible responder-to-service problem. Lower-layer faults can still affect the backend or appear intermittently, so the response narrows the investigation rather than proving all connectivity healthy.","es":"Recibir una respuesta HTTP indica que ese intercambio alcanzó un componente capaz de procesar la petición web. Con esa evidencia, cambiar el cable de inmediato tiene poco fundamento. Identificaría qué componente generó el 503 y revisaría sus registros y la conectividad con los servicios internos. OSI permite separar el trayecto que funcionó hasta quien respondió de un posible problema entre este y otro servicio. Puede haber fallos en capas inferiores detrás de ese componente o de forma intermitente; la respuesta acota la investigación, pero no demuestra que toda la conectividad funcione."},"related":["troubleshooting"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"}],"level":"foundation","learning":{"definition":{"en":"The OSI model is a reference framework that divides network communication into seven layers of responsibility. Its purpose is to give people a shared way to explain how communication works and locate the function involved when something fails.","es":"El modelo OSI es un marco de referencia que divide la comunicación en red en siete capas de responsabilidad. Sirve para explicar su funcionamiento con un vocabulario común y localizar qué función interviene cuando aparece un fallo."},"simple":{"en":"When a laptop sends a message, several functions cooperate. From the transmission medium upwards, OSI distinguishes physical for signals, data link for local delivery, network for delivery between networks, transport for communication between programs, session for managing dialogues, presentation for representing data and application for services. These are responsibilities, not seven mandatory software components. The Internet's TCP/IP stack groups them differently, with some session and presentation functions handled within applications or libraries.","es":"Cuando un portátil envía un mensaje, colaboran varias funciones. Desde el medio de transmisión hacia arriba, OSI distingue: física para las señales, enlace de datos para la entrega local, red para el envío entre redes, transporte para comunicar programas, sesión para gestionar diálogos, presentación para representar datos y aplicación para ofrecer servicios. Son responsabilidades, no siete componentes obligatorios. Internet utiliza TCP/IP, que las agrupa de otra forma; algunas funciones de sesión y presentación quedan en aplicaciones o bibliotecas."},"analogy":{"en":"A theatre production separates responsibilities such as lighting and dialogue even when one person performs several jobs. OSI similarly separates functions; unlike a theatre schedule, it does not prescribe seven successive execution stages.","es":"En una producción teatral se distinguen tareas como la iluminación y los diálogos, aunque una persona asuma varias. OSI también separa funciones; a diferencia de un programa teatral, no impone siete etapas de ejecución consecutivas."},"walkthrough":{"en":["A laptop submits a contact form to a website using HTTPS over TCP. The browser prepares the request, and a TLS library encrypts it. OSI lets us discuss message meaning separately from its protected representation.","TCP orders the encrypted bytes and retransmits missing data. IP supplies addressing for the journey. Ethernet adds a frame, a local delivery wrapper, which the adapter transmits as electrical signals. Adding delivery wrappers is called encapsulation.","At the website, receiving software removes the delivery wrappers, called decapsulation, and TLS decrypts the bytes so the server can read the form. The layers describe which function did what, not seven separate server processes."],"es":["Un portátil envía un formulario de contacto a una web mediante HTTPS sobre TCP. El navegador prepara la petición y una biblioteca TLS la cifra. OSI permite hablar del significado del mensaje por separado de su representación protegida.","TCP ordena los bytes cifrados y retransmite los datos perdidos. IP aporta el direccionamiento del recorrido. Ethernet añade una trama, una envoltura de entrega local, que el adaptador transmite como señales eléctricas. Añadir envolturas de entrega se llama encapsulación.","En la web, el software receptor retira las envolturas de entrega, lo que se denomina desencapsulación, y TLS descifra los bytes para que el servidor lea el formulario. Las capas describen qué función hizo cada cosa, no siete procesos independientes."]},"pitfalls":{"en":["TLS does not occupy a mandatory, standalone OSI presentation component. Its encryption resembles a presentation function, but actual software combines responsibilities differently, so a rigid layer assignment can mislead.","An HTTP error returned by a server shows that this exchange reached application processing. It does not certify that every route or connection is healthy, especially when failures are intermittent."],"es":["TLS no ocupa un componente de presentación OSI obligatorio e independiente. Su cifrado se parece a una función de presentación, pero el software real combina responsabilidades de otra manera; asignarle una capa rígida puede confundir.","Un error HTTP devuelto por un servidor indica que ese intercambio llegó al procesamiento de aplicación. No certifica que todas las rutas o conexiones funcionen bien, especialmente si los fallos son intermitentes."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"Seven jobs involved in communication","es":"Siete funciones de una comunicación"},"caption":{"en":"Read from application meaning at the top to physical signals at the bottom. Select a layer to study it. OSI separates responsibilities for learning and troubleshooting; real Internet protocols do not form seven separate layers.","es":"Lee desde el significado del mensaje, arriba, hasta las señales físicas, abajo. Pulsa una capa para estudiarla. OSI separa funciones para entender y diagnosticar redes; los protocolos de Internet no forman siete capas independientes."},"alt":{"en":"Seven linked rows ordered from layer 7 at the top to layer 1 at the bottom: application messages, presentation formats, session dialogue, transport ports and delivery, network addressing and routing, data-link frames, and physical signals. Select a row to open its lesson. OSI is a conceptual model, not seven literal Internet headers.","es":"Siete filas con enlaces, desde la capa 7 arriba hasta la 1 abajo: mensajes de aplicación, formatos de presentación, diálogo de sesión, puertos y entrega de transporte, direcciones y rutas de red, tramas de enlace y señales físicas. Selecciona una fila para abrir su lección. OSI es un modelo conceptual, no siete cabeceras literales de Internet."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"Defines messages that applications exchange, such as an HTTP request for a web page.","es":"Define los mensajes que intercambian las aplicaciones, como una petición HTTP para abrir una página."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"Represents data in a format the receiver can interpret. Encoding and encryption illustrate this responsibility; placing TLS here is only a teaching comparison.","es":"Representa los datos de forma que el receptor pueda interpretarlos. La codificación y el cifrado ilustran esta función; situar TLS aquí es solo una comparación didáctica."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinates a dialogue and its checkpoints. A website login usually stores application state instead of using a distinct OSI session protocol.","es":"Coordina el diálogo y sus puntos de recuperación. Un inicio de sesión web suele guardar estado en la aplicación, sin usar un protocolo OSI de sesión separado."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Uses ports to direct data to an application. TCP delivers an ordered byte stream; UDP sends datagrams without that guarantee.","es":"Usa puertos para dirigir los datos a una aplicación. TCP entrega una secuencia ordenada de bytes; UDP envía datagramas sin esa garantía."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Uses IP addresses and routes to forward packets between networks. Each router selects the next hop.","es":"Usa direcciones IP y rutas para reenviar paquetes entre redes. Cada router selecciona el siguiente salto."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Carries frames across a local link. Ethernet uses MAC addresses; ARP finds the MAC associated with a local IPv4 next hop.","es":"Transporta tramas por un enlace local. Ethernet usa direcciones MAC; ARP busca la MAC del siguiente salto IPv4 en la red local."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Transmits bits as light, electrical signals or radio waves through the physical medium.","es":"Transmite bits mediante luz, señales eléctricas u ondas de radio por el medio físico."}}]}]},{"id":"osi-1","parent":"osi","title":{"en":"Layer 1: Physical","es":"Capa 1: Física"},"summary":{"en":"A usable physical link needs compatible signals and a medium that carries them within the receiver's limits.","es":"Un enlace físico utilizable necesita señales compatibles y un medio que las transporte dentro de los límites del receptor."},"details":{"en":["A link indicator usually confirms only that neighbouring interfaces have established physical connectivity. It cannot establish end-to-end reachability or show whether error rates become unacceptable under load. Comparing error-counter changes over a test interval is more informative than reading a large cumulative count without knowing when it accrued."],"es":["Un indicador de enlace suele confirmar únicamente que las interfaces vecinas han establecido conectividad física. No demuestra que exista comunicación de extremo a extremo ni si la tasa de errores resulta inaceptable bajo carga. Comparar cuánto cambian los contadores de errores durante una prueba aporta más información que leer un acumulado elevado sin saber cuándo se generó."]},"aws":{"en":"For a dedicated AWS Direct Connect connection, check the fibre handoff for compatible optics and acceptable received light levels before diagnosing BGP, the protocol that exchanges routes. A BGP failure can persist even when the physical link is healthy.","es":"En una conexión dedicada de AWS Direct Connect, comprueba que la entrega de fibra utiliza ópticas compatibles y niveles de luz recibida aceptables antes de diagnosticar BGP, el protocolo que intercambia rutas. BGP puede seguir fallando aunque el enlace físico funcione correctamente."},"question":{"en":"Your warehouse has two leased connections to the office, but both stopped during nearby roadworks. Why might the backup have failed too, and what evidence would you request?","es":"Tu almacén tiene dos conexiones contratadas con la oficina, pero ambas dejaron de funcionar durante unas obras cercanas. ¿Por qué pudo fallar también el respaldo y qué información pedirías?"},"answer":{"en":"Different circuit names do not establish separate physical paths. The connections may share a duct or building entrance, so the same excavation could cut both. I would ask the providers for route-diversity evidence, including ducts, building entry points and any shared equipment or power. Then I would compare those shared dependencies with the required outage tolerance. Adding another logical circuit over the same damaged infrastructure would not address that particular failure mode.","es":"Tener nombres de circuito distintos no demuestra que los recorridos físicos estén separados. Las conexiones pueden compartir una canalización o entrada al edificio, y una excavación podría cortar ambas. Pediría a los proveedores pruebas de diversidad de recorrido, incluidas las canalizaciones, entradas y posibles equipos o alimentación compartidos. Después contrastaría esas dependencias con la tolerancia a interrupciones que necesita el negocio. Añadir otro circuito lógico sobre la misma infraestructura dañada no resolvería ese modo de fallo concreto."},"related":["physical-links"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}],"level":"foundation","learning":{"definition":{"en":"The physical layer turns bits into signals that can cross a cable, fibre or radio channel, then recovers bits at the other end. Its purpose is to provide a usable transmission medium for the networking functions above it.","es":"La capa física convierte bits en señales que pueden atravesar un cable, una fibra o un canal de radio, y recupera los bits en el otro extremo. Su función es proporcionar un medio de transmisión utilizable a las funciones de red superiores."},"simple":{"en":"A transmitter maps bits, binary values of zero or one, onto changes in a signal. The medium carries those changes, and a receiver interprets them using compatible timing and signal rules. On fibre, the signal is light; on copper, it is electrical. Too much loss or interference can make bits unreadable, so higher layers may lose data even when their addresses and routes are correct. Layer 1 does not inspect an IP destination.","es":"Un transmisor representa los bits, valores binarios de cero o uno, mediante cambios en una señal. El medio transporta esos cambios y un receptor los interpreta con reglas compatibles de señalización y temporización. En fibra se utiliza luz; en cobre, señales eléctricas. Un exceso de pérdidas o interferencias puede impedir reconocer los bits, por lo que las capas superiores pueden perder datos aunque sus direcciones y rutas sean correctas. La capa 1 no examina el destino IP."},"analogy":{"en":"Consider two people exchanging a coded message with torches. They need visible flashes and agreed timing before interpreting words. The comparison explains signal detection, but actual links use defined electrical, optical or radio signalling systems.","es":"Piensa en dos personas que intercambian un mensaje con linternas. Necesitan destellos visibles y tiempos acordados antes de interpretar palabras. La comparación explica la detección de señales; los enlaces reales utilizan sistemas definidos de señalización eléctrica, óptica o radioeléctrica."},"walkthrough":{"en":["A company connects its warehouse switch to its office switch with fibre. Compatible optical transceivers, the modules that send and receive light, establish a link so inventory traffic can cross between the buildings.","After work on the rack, a sharply bent fibre reduces the light reaching the receiver. Received optical power falls, and the receiver records errors. Some transmissions become unusable, causing inventory requests to pause while data is retransmitted.","A technician checks optical readings against the transceiver's limits and corrects the bend. In this scenario, receive power returns to the expected range and errors stop increasing. The team then tests stock lookups, rather than assuming a lit indicator proves the application works."],"es":["Una empresa conecta el switch del almacén con el de sus oficinas mediante fibra. Unos transceptores ópticos compatibles, los módulos que emiten y reciben luz, establecen el enlace para que el tráfico de inventario circule entre los edificios.","Tras un trabajo en el bastidor, una curvatura demasiado cerrada de la fibra reduce la luz que llega al receptor. Baja la potencia óptica recibida y aparecen errores. Algunas transmisiones quedan inutilizables, y las consultas de inventario se detienen mientras se retransmiten datos.","Una técnica contrasta las mediciones ópticas con los límites del transceptor y corrige la curvatura. En este caso, la potencia recibida vuelve al intervalo esperado y los errores dejan de aumentar. Después, el equipo prueba las consultas: un indicador encendido no demuestra que funcione la aplicación."]},"pitfalls":{"en":["Bandwidth describes carrying capacity; latency describes delay. Increasing capacity does not eliminate the time signals take to travel. A distant warehouse may still experience slow operations when each request needs several round trips.","Two services are not physically independent merely because their circuit identifiers differ. If both fibres run through the same trench, one excavation can interrupt both; resilience needs verified separation of relevant failure points."],"es":["El ancho de banda describe la capacidad de transmisión; la latencia, el retardo. Aumentar la capacidad no elimina el tiempo que tardan las señales en viajar. Un almacén lejano puede seguir sufriendo operaciones lentas si cada petición requiere varias idas y vueltas.","Dos servicios no son físicamente independientes solo porque sus circuitos tengan identificadores distintos. Si ambas fibras recorren la misma zanja, una excavación puede cortar las dos; la resiliencia exige comprobar la separación de los puntos de fallo relevantes."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"Seven jobs involved in communication","es":"Siete funciones de una comunicación"},"caption":{"en":"Read from application meaning at the top to physical signals at the bottom. Select a layer to study it. OSI separates responsibilities for learning and troubleshooting; real Internet protocols do not form seven separate layers.","es":"Lee desde el significado del mensaje, arriba, hasta las señales físicas, abajo. Pulsa una capa para estudiarla. OSI separa funciones para entender y diagnosticar redes; los protocolos de Internet no forman siete capas independientes."},"alt":{"en":"Seven linked rows ordered from layer 7 at the top to layer 1 at the bottom: application messages, presentation formats, session dialogue, transport ports and delivery, network addressing and routing, data-link frames, and physical signals. Select a row to open its lesson. OSI is a conceptual model, not seven literal Internet headers.","es":"Siete filas con enlaces, desde la capa 7 arriba hasta la 1 abajo: mensajes de aplicación, formatos de presentación, diálogo de sesión, puertos y entrega de transporte, direcciones y rutas de red, tramas de enlace y señales físicas. Selecciona una fila para abrir su lección. OSI es un modelo conceptual, no siete cabeceras literales de Internet."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"Defines messages that applications exchange, such as an HTTP request for a web page.","es":"Define los mensajes que intercambian las aplicaciones, como una petición HTTP para abrir una página."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"Represents data in a format the receiver can interpret. Encoding and encryption illustrate this responsibility; placing TLS here is only a teaching comparison.","es":"Representa los datos de forma que el receptor pueda interpretarlos. La codificación y el cifrado ilustran esta función; situar TLS aquí es solo una comparación didáctica."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinates a dialogue and its checkpoints. A website login usually stores application state instead of using a distinct OSI session protocol.","es":"Coordina el diálogo y sus puntos de recuperación. Un inicio de sesión web suele guardar estado en la aplicación, sin usar un protocolo OSI de sesión separado."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Uses ports to direct data to an application. TCP delivers an ordered byte stream; UDP sends datagrams without that guarantee.","es":"Usa puertos para dirigir los datos a una aplicación. TCP entrega una secuencia ordenada de bytes; UDP envía datagramas sin esa garantía."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Uses IP addresses and routes to forward packets between networks. Each router selects the next hop.","es":"Usa direcciones IP y rutas para reenviar paquetes entre redes. Cada router selecciona el siguiente salto."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Carries frames across a local link. Ethernet uses MAC addresses; ARP finds the MAC associated with a local IPv4 next hop.","es":"Transporta tramas por un enlace local. Ethernet usa direcciones MAC; ARP busca la MAC del siguiente salto IPv4 en la red local."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Transmits bits as light, electrical signals or radio waves through the physical medium.","es":"Transmite bits mediante luz, señales eléctricas u ondas de radio por el medio físico."}}]}]},{"id":"osi-2","parent":"osi","title":{"en":"Layer 2: Data link","es":"Capa 2: Enlace de datos"},"summary":{"en":"For a remote destination, the local Ethernet frame reaches the next-hop router while the IP packet names the final recipient.","es":"Para un destino remoto, la trama Ethernet local llega al router del siguiente salto y el paquete IP identifica al destinatario final."},"details":{"en":["MAC addresses are not proof of device identity: software can change or imitate them. An access rule based only on an allowed MAC therefore does not establish who the user is or whether the device is trusted. Stronger access decisions require authentication beyond the frame's addressing fields."],"es":["Las direcciones MAC no prueban la identidad de un dispositivo: el software puede cambiarlas o imitarlas. Por tanto, una regla de acceso basada solo en una MAC permitida no establece quién es el usuario ni si el equipo es de confianza. Para tomar decisiones de acceso con más fundamento hace falta autenticación más allá de los campos de direccionamiento de la trama."]},"aws":{"en":"When moving a legacy peer-discovery application to EC2, configure peer lookup through DNS instead of its Ethernet broadcasts. A VPC subnet supports private IP communication but does not behave like a conventional Ethernet broadcast LAN.","es":"Al migrar a EC2 una aplicación antigua que descubre otros equipos mediante difusión Ethernet, configura esa búsqueda mediante DNS. Una subred de VPC permite comunicación por IP privada, pero no se comporta como una LAN Ethernet convencional de difusión."},"question":{"en":"A capture beside an office laptop shows frames addressed to the router's MAC, even though the user is contacting a remote payroll server. Is that an addressing mistake?","es":"Una captura junto a un portátil de oficina muestra tramas dirigidas a la MAC del router, aunque el usuario está accediendo a un servidor remoto de nóminas. ¿Es un error de direccionamiento?"},"answer":{"en":"That is expected when the selected route goes through the router. The laptop must reach a local next hop before the packet can travel to another network. Ethernet therefore identifies the router's interface as the frame's recipient, while IP identifies the payroll server as the packet's destination. The router discards that local framing and forwards using framing appropriate to its outgoing link. I would investigate only if the selected gateway or its resolved MAC were inconsistent with the network configuration.","es":"Es lo esperado cuando la ruta elegida pasa por el router. El portátil debe alcanzar un siguiente salto local antes de que el paquete llegue a otra red. Por eso, Ethernet identifica la interfaz del router como destinataria de la trama, mientras IP señala al servidor de nóminas como destino del paquete. El router retira esa envoltura local y reenvía el paquete con la trama adecuada para el enlace de salida. Investigaría si la puerta de enlace elegida o la MAC resuelta no coincidieran con la configuración de red."},"related":["ethernet","arp"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc826","label":"rfc-editor.org: rfc826"}],"level":"foundation","learning":{"definition":{"en":"The data link layer delivers framed data across a local link or a switched local network. It gives neighbouring interfaces a way to identify the intended local recipient and detect certain transmission errors before higher layers use the data.","es":"La capa de enlace de datos entrega datos organizados en tramas a través de un enlace o una red local conmutada. Permite que las interfaces vecinas identifiquen al destinatario local y detecten determinados errores de transmisión antes de que las capas superiores utilicen los datos."},"simple":{"en":"On an Ethernet network, a device places an IP packet inside a frame, a container with local delivery information and an error check. A MAC address identifies an interface for delivery on that network. A switch learns which source MAC addresses arrive on each port and uses its table to forward frames towards known destinations. For a destination outside the local IP network, the sender addresses the frame to its router, which handles the next stage of the journey.","es":"En Ethernet, un equipo introduce un paquete IP en una trama, una unidad con información de entrega local y comprobación de errores. Una dirección MAC identifica una interfaz dentro de esa red. El switch aprende por qué puerto llegan las MAC de origen y usa esa tabla para dirigir tramas a destinos conocidos. Si el destino está fuera de la red IP local, el emisor dirige la trama al router, que se encarga del siguiente tramo."},"analogy":{"en":"Think of a hotel shuttle taking a guest to the railway station rather than to a distant city. The frame names the immediate local recipient; unlike the guest, the IP packet receives new framing along its route.","es":"Un autobús de hotel lleva al viajero a la estación, no hasta una ciudad lejana. La trama identifica al destinatario local inmediato; a diferencia del viajero, el paquete IP recibe nuevas tramas durante el recorrido."},"walkthrough":{"en":["An office laptop opens a payroll page hosted on another IP network. Its configured route selects the office router. With no saved mapping, the laptop broadcasts an ARP request, a local query for the MAC address associated with that router's IPv4 address.","The router replies with its MAC address. The laptop puts the payroll server's IP address in the packet but the router's MAC address in the surrounding Ethernet frame. The switch forwards that frame towards the router.","The router removes the incoming frame and chooses an outgoing route. On another Ethernet link it builds a new frame for that link's recipient. Without address translation, the payroll server's destination IP remains unchanged while the local delivery addresses change."],"es":["Un portátil de oficina abre una página de nóminas alojada en otra red IP. Su ruta configurada elige el router de la oficina. Al no tener una asociación guardada, el portátil difunde una petición ARP, una consulta local de la MAC asociada a la dirección IPv4 de ese router.","El router responde con su dirección MAC. El portátil pone la IP del servidor de nóminas en el paquete, pero la MAC del router en la trama Ethernet que lo envuelve. El switch dirige esa trama hacia el router.","El router retira la trama recibida y elige una ruta de salida. En otro enlace Ethernet crea una trama nueva para el destinatario de ese enlace. Si no hay traducción de direcciones, la IP de destino del servidor de nóminas se mantiene mientras cambian las direcciones de entrega local."]},"pitfalls":{"en":["A switch that has not learned a destination MAC may flood the frame to other eligible ports within that VLAN, a logically separated local network. Flooding does not mean routing the packet across the Internet.","ARP serves IPv4 on the local link; IPv6 uses Neighbor Discovery instead. Also, an Ethernet error check can detect corrupted frames, but it neither encrypts the contents nor verifies who sent them."],"es":["Si un switch no ha aprendido una MAC de destino, puede replicar la trama por los demás puertos habilitados de esa VLAN, una red local separada lógicamente. Esa difusión no equivale a encaminar el paquete por Internet.","ARP se utiliza con IPv4 en el enlace local; IPv6 emplea Neighbor Discovery. Además, la comprobación de errores de Ethernet permite detectar tramas dañadas, pero no cifra su contenido ni verifica quién las ha enviado."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://www.rfc-editor.org/rfc/rfc826","label":"rfc-editor.org: rfc826"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"Seven jobs involved in communication","es":"Siete funciones de una comunicación"},"caption":{"en":"Read from application meaning at the top to physical signals at the bottom. Select a layer to study it. OSI separates responsibilities for learning and troubleshooting; real Internet protocols do not form seven separate layers.","es":"Lee desde el significado del mensaje, arriba, hasta las señales físicas, abajo. Pulsa una capa para estudiarla. OSI separa funciones para entender y diagnosticar redes; los protocolos de Internet no forman siete capas independientes."},"alt":{"en":"Seven linked rows ordered from layer 7 at the top to layer 1 at the bottom: application messages, presentation formats, session dialogue, transport ports and delivery, network addressing and routing, data-link frames, and physical signals. Select a row to open its lesson. OSI is a conceptual model, not seven literal Internet headers.","es":"Siete filas con enlaces, desde la capa 7 arriba hasta la 1 abajo: mensajes de aplicación, formatos de presentación, diálogo de sesión, puertos y entrega de transporte, direcciones y rutas de red, tramas de enlace y señales físicas. Selecciona una fila para abrir su lección. OSI es un modelo conceptual, no siete cabeceras literales de Internet."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"Defines messages that applications exchange, such as an HTTP request for a web page.","es":"Define los mensajes que intercambian las aplicaciones, como una petición HTTP para abrir una página."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"Represents data in a format the receiver can interpret. Encoding and encryption illustrate this responsibility; placing TLS here is only a teaching comparison.","es":"Representa los datos de forma que el receptor pueda interpretarlos. La codificación y el cifrado ilustran esta función; situar TLS aquí es solo una comparación didáctica."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinates a dialogue and its checkpoints. A website login usually stores application state instead of using a distinct OSI session protocol.","es":"Coordina el diálogo y sus puntos de recuperación. Un inicio de sesión web suele guardar estado en la aplicación, sin usar un protocolo OSI de sesión separado."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Uses ports to direct data to an application. TCP delivers an ordered byte stream; UDP sends datagrams without that guarantee.","es":"Usa puertos para dirigir los datos a una aplicación. TCP entrega una secuencia ordenada de bytes; UDP envía datagramas sin esa garantía."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Uses IP addresses and routes to forward packets between networks. Each router selects the next hop.","es":"Usa direcciones IP y rutas para reenviar paquetes entre redes. Cada router selecciona el siguiente salto."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Carries frames across a local link. Ethernet uses MAC addresses; ARP finds the MAC associated with a local IPv4 next hop.","es":"Transporta tramas por un enlace local. Ethernet usa direcciones MAC; ARP busca la MAC del siguiente salto IPv4 en la red local."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Transmits bits as light, electrical signals or radio waves through the physical medium.","es":"Transmite bits mediante luz, señales eléctricas u ondas de radio por el medio físico."}}]}]},{"id":"osi-3","parent":"osi","title":{"en":"Layer 3: Network","es":"Capa 3: Red"},"summary":{"en":"For destination-based IP forwarding, the longest matching prefix selects the next hop without guaranteeing delivery.","es":"En el reenvío IP por destino, el prefijo coincidente más largo elige el siguiente salto sin garantizar la entrega."},"details":{"en":["Forwarding is the per-packet table lookup; routing also includes how those table entries are learned or configured. Routers reduce IPv4 TTL, a hop limit, and discard a packet when it expires, preventing endless loops. A router can also maintain flow state for NAT or a firewall; that extra function does not make IP delivery guaranteed."],"es":["El reenvío consulta la tabla para cada paquete; el enrutamiento también abarca cómo se aprenden o configuran sus entradas. Los routers reducen el TTL de IPv4, un límite de saltos, y descartan el paquete cuando se agota para evitar bucles indefinidos. Un router también puede mantener estado de los flujos para NAT o un cortafuegos; esa función adicional no convierte la entrega IP en una entrega garantizada."]},"aws":{"en":"For an EC2 instance in VPC 10.1.0.0/16, configure 10.2.0.0/16 to an active peering connection. Traffic to 10.2.3.8 uses that route rather than 0.0.0.0/0 to a NAT gateway; configure the peer's return route separately.","es":"Para una instancia EC2 de la VPC 10.1.0.0/16, configura la ruta 10.2.0.0/16 hacia una conexión de peering activa. El tráfico a 10.2.3.8 usa esa ruta en lugar de 0.0.0.0/0 hacia una puerta de enlace NAT; configura también la ruta de vuelta en la otra VPC."},"question":{"en":"R1 has 10.2.0.0/16 via R2 and 10.2.3.0/24 via R3. A stock update for 10.2.3.8 stalls beyond R3. Why doesn't R1 automatically try R2?","es":"R1 tiene 10.2.0.0/16 por R2 y 10.2.3.0/24 por R3. Una actualización de existencias para 10.2.3.8 se atasca después de R3. ¿Por qué R1 no prueba R2 automáticamente?"},"answer":{"en":"The /24 is the longest matching prefix, so R1 sends this packet to R3. A timeout at the sender does not, by itself, remove that forwarding entry or make R1 try the /16. If a routing protocol or operator withdraws the /24, the remaining /16 can become the selected route. Check the selected route's next hop and the return path. Even a correctly selected route cannot guarantee delivery, because IP does not provide end-to-end recovery.","es":"La ruta /24 es la coincidencia más específica, así que R1 envía el paquete a R3. Que el emisor agote su tiempo de espera no elimina esa entrada ni hace que R1 pruebe la /16. Si un protocolo de enrutamiento o un administrador retira la /24, la /16 puede pasar a ser la ruta elegida. Comprueba el siguiente salto y el camino de vuelta. Incluso una ruta bien seleccionada puede acabar en una pérdida: IP no incorpora recuperación de extremo a extremo."},"related":["vpc"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc791","label":"rfc-editor.org: rfc791"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html","label":"docs.aws.amazon.com: VPC Route Tables"}],"level":"foundation","learning":{"definition":{"en":"Layer 3 provides addressing and a way to forward packets beyond the sender's local network. IP is the main Internet protocol for this job; it carries source and destination addresses in each packet.","es":"La capa 3 permite identificar los destinos y reenviar paquetes fuera de la red local del emisor. IP es el principal protocolo de Internet para esta tarea; cada paquete lleva las direcciones de origen y destino."},"simple":{"en":"A router compares the packet's destination with address ranges in its forwarding table. Each range has a prefix length: /24 matches the first 24 address bits. Of the matching entries, the longest prefix wins because it describes the narrowest range. The chosen entry supplies the next hop or outgoing interface. IP delivery is best effort: packets can be lost or arrive out of order, and IP itself does not retransmit them.","es":"El router compara la IP de destino del paquete con los rangos de su tabla de reenvío. Cada rango tiene una longitud de prefijo: /24 indica que coinciden los primeros 24 bits. Entre las entradas que coinciden, gana el prefijo más largo porque delimita el rango más específico. Esa entrada indica el siguiente salto o la interfaz de salida. IP ofrece entrega de mejor esfuerzo: puede haber pérdidas o desorden, y el propio IP no retransmite los paquetes."},"analogy":{"en":"Road signs can point towards a region or a particular street, like broad and specific IP prefixes. The limit: routers follow forwarding tables, which need not describe the shortest or fastest journey.","es":"Las señales de carretera pueden indicar una región o una calle concreta, como los prefijos amplios y específicos. El límite: el router sigue su tabla, que no siempre describe el trayecto más corto ni más rápido."},"walkthrough":{"en":["A warehouse computer at 10.1.0.10/24 sends a packet containing stock=12 to server 10.2.3.8. Because the server is outside its local subnet, the computer sends the packet to its gateway, router R1.","R1 has 10.2.0.0/16 via R2 and 10.2.3.0/24 via R3. Both match 10.2.3.8, but /24 is longer, so R1 forwards the stock=12 packet to R3 rather than R2.","R3 has a directly connected route to 10.2.3.0/24 and forwards the same packet to 10.2.3.8. Any reply to the warehouse computer at 10.1.0.10 requires its own return route."],"es":["Un ordenador del almacén con dirección 10.1.0.10/24 envía un paquete con stock=12 al servidor 10.2.3.8. Como el servidor está fuera de su subred local, entrega el paquete a su puerta de enlace, el router R1.","R1 tiene las rutas 10.2.0.0/16 por R2 y 10.2.3.0/24 por R3. Ambas incluyen 10.2.3.8, pero /24 es más largo, así que R1 reenvía el paquete stock=12 a R3, no a R2.","R3 tiene una ruta directamente conectada a 10.2.3.0/24 y entrega ese mismo paquete a 10.2.3.8. Cualquier respuesta al ordenador del almacén, 10.1.0.10, necesita su propia ruta de vuelta."]},"pitfalls":{"en":["A /24 only wins if the destination falls inside it. A longer prefix elsewhere in the table is irrelevant to that packet.","Forwarding success at one router does not prove end-to-end reachability; a later hop can drop the packet or lack a route."],"es":["Una ruta /24 solo gana si incluye el destino. Que haya un prefijo más largo en otra entrada de la tabla no influye en ese paquete.","Que un router reenvíe correctamente no demuestra que el destino sea accesible; otro salto puede descartar el paquete o no tener una ruta."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc791","label":"rfc-editor.org: rfc791"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html","label":"docs.aws.amazon.com: VPC Route Tables"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"Seven jobs involved in communication","es":"Siete funciones de una comunicación"},"caption":{"en":"Read from application meaning at the top to physical signals at the bottom. Select a layer to study it. OSI separates responsibilities for learning and troubleshooting; real Internet protocols do not form seven separate layers.","es":"Lee desde el significado del mensaje, arriba, hasta las señales físicas, abajo. Pulsa una capa para estudiarla. OSI separa funciones para entender y diagnosticar redes; los protocolos de Internet no forman siete capas independientes."},"alt":{"en":"Seven linked rows ordered from layer 7 at the top to layer 1 at the bottom: application messages, presentation formats, session dialogue, transport ports and delivery, network addressing and routing, data-link frames, and physical signals. Select a row to open its lesson. OSI is a conceptual model, not seven literal Internet headers.","es":"Siete filas con enlaces, desde la capa 7 arriba hasta la 1 abajo: mensajes de aplicación, formatos de presentación, diálogo de sesión, puertos y entrega de transporte, direcciones y rutas de red, tramas de enlace y señales físicas. Selecciona una fila para abrir su lección. OSI es un modelo conceptual, no siete cabeceras literales de Internet."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"Defines messages that applications exchange, such as an HTTP request for a web page.","es":"Define los mensajes que intercambian las aplicaciones, como una petición HTTP para abrir una página."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"Represents data in a format the receiver can interpret. Encoding and encryption illustrate this responsibility; placing TLS here is only a teaching comparison.","es":"Representa los datos de forma que el receptor pueda interpretarlos. La codificación y el cifrado ilustran esta función; situar TLS aquí es solo una comparación didáctica."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinates a dialogue and its checkpoints. A website login usually stores application state instead of using a distinct OSI session protocol.","es":"Coordina el diálogo y sus puntos de recuperación. Un inicio de sesión web suele guardar estado en la aplicación, sin usar un protocolo OSI de sesión separado."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Uses ports to direct data to an application. TCP delivers an ordered byte stream; UDP sends datagrams without that guarantee.","es":"Usa puertos para dirigir los datos a una aplicación. TCP entrega una secuencia ordenada de bytes; UDP envía datagramas sin esa garantía."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Uses IP addresses and routes to forward packets between networks. Each router selects the next hop.","es":"Usa direcciones IP y rutas para reenviar paquetes entre redes. Cada router selecciona el siguiente salto."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Carries frames across a local link. Ethernet uses MAC addresses; ARP finds the MAC associated with a local IPv4 next hop.","es":"Transporta tramas por un enlace local. Ethernet usa direcciones MAC; ARP busca la MAC del siguiente salto IPv4 en la red local."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Transmits bits as light, electrical signals or radio waves through the physical medium.","es":"Transmite bits mediante luz, señales eléctricas u ondas de radio por el medio físico."}}]}]},{"id":"osi-4","parent":"osi","title":{"en":"Layer 4: Transport","es":"Capa 4: Transporte"},"summary":{"en":"Ports select application endpoints; TCP orders bytes, while UDP leaves ordering and loss recovery to higher protocols.","es":"Los puertos identifican extremos de aplicación; TCP ordena los bytes y UDP deja el orden y la recuperación a protocolos superiores."},"details":{"en":["TCP and UDP have separate port spaces: a process listening on TCP 9000 will not receive UDP 9000 traffic. A TCP server can handle many clients on one listening port because each connection also includes the client's address and port. Neither protocol assigns business meaning to the data, so choosing a port cannot turn arbitrary bytes into a valid command."],"es":["TCP y UDP tienen espacios de puertos separados: un proceso que escucha en TCP 9000 no recibe por ahí tráfico UDP 9000. Un servidor TCP puede atender a muchos clientes en un único puerto de escucha porque cada conexión también incluye la dirección y el puerto del cliente. Ninguno de los dos protocolos interpreta el significado de negocio de los datos; elegir un puerto no convierte unos bytes cualesquiera en un comando válido."]},"aws":{"en":"In a private VPC, run the stock service on an EC2 instance listening on TCP 9000 and allow inbound TCP 9000 from the client instances' security group. A rule for UDP 9000 would not permit this TCP connection.","es":"En una VPC privada, ejecuta el servicio de existencias en una instancia EC2 que escuche en TCP 9000 y permite la entrada TCP 9000 desde el grupo de seguridad de las instancias cliente. Una regla para UDP 9000 no permitiría esa conexión TCP."},"question":{"en":"A client writes STOCK= and then 12 plus a newline over TCP. The server reads STO, then CK=12 plus the newline. Is TCP broken, and how should the server parse the command?","es":"Un cliente escribe STOCK= y después 12 con un salto de línea por TCP. El servidor lee STO y luego CK=12 con el salto de línea. ¿Está fallando TCP y cómo debe interpretar el comando?"},"answer":{"en":"No. TCP preserves the order of the bytes, not the boundaries of the client's write calls. The server should accumulate received bytes until it sees the newline, then parse STOCK=12 as one command. It must also handle several complete commands arriving in a single read and keep any incomplete suffix for the next read. If the connection fails before the delimiter arrives, treat the command as incomplete rather than assuming the remaining bytes were delivered.","es":"No. TCP conserva el orden de los bytes, pero no los límites entre las escrituras del cliente. El servidor debe acumular bytes hasta encontrar el salto de línea y entonces interpretar STOCK=12 como un comando completo. También debe aceptar varios comandos en una sola lectura y guardar cualquier fragmento incompleto para la siguiente. Si la conexión falla antes de recibir el delimitador, debe tratar el comando como incompleto, sin dar por entregados los bytes que faltan."},"related":["load-balancing"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"},{"url":"https://www.rfc-editor.org/rfc/rfc768","label":"rfc-editor.org: rfc768"}],"level":"foundation","learning":{"definition":{"en":"The transport layer lets programs on different hosts exchange data using numbered ports. TCP provides an ordered stream of bytes, while UDP sends separate datagrams without guaranteeing their arrival or order. Those behaviours come from each protocol's mechanisms, not merely from whether it has a connection.","es":"La capa de transporte permite que programas de distintos equipos intercambien datos mediante puertos numerados. TCP ofrece un flujo ordenado de bytes; UDP envía datagramas independientes sin garantizar su llegada ni su orden. Ese comportamiento depende de los mecanismos de cada protocolo, no solo de que exista una conexión."},"simple":{"en":"The operating system uses the protocol, IP addresses and port numbers to deliver incoming data to the right socket, an application's communication endpoint. TCP numbers bytes, acknowledges received data and retransmits missing segments; the receiver holds later bytes until gaps are filled. UDP keeps message boundaries but adds no retransmission or reordering. An application using UDP must supply any recovery or sequencing it needs.","es":"El sistema operativo utiliza el protocolo, las direcciones IP y los puertos para entregar los datos al socket adecuado, el punto de comunicación de una aplicación. TCP numera los bytes, confirma lo recibido y retransmite los segmentos perdidos; el receptor retiene los bytes posteriores hasta completar los huecos. UDP conserva los límites de cada mensaje, pero no retransmite ni reordena. La aplicación que utilice UDP debe incorporar la recuperación o la secuenciación que necesite."},"analogy":{"en":"TCP resembles an editor assembling numbered pages before handing over a manuscript; UDP resembles receiving separate postcards as they arrive. The limit: TCP preserves byte order, not page boundaries or the reader's actions.","es":"TCP se parece a un editor que ordena páginas numeradas; UDP, a recibir postales según llegan. El límite: TCP conserva el orden de los bytes, pero no separa páginas ni confirma que alguien las haya leído."},"walkthrough":{"en":["Lucía's laptop at 10.1.0.10 opens TCP from port 51000 to a stock server at 10.2.3.8:9000. Their handshake establishes the connection before her program writes STOCK=12 followed by a newline.","In this exchange, TCP splits the bytes between two segments. The first, carrying STOCK=, is lost; the second, carrying 12 and the newline, arrives. The server's TCP buffers those later bytes.","The laptop retransmits the missing bytes. The server's TCP can now deliver STOCK=12 followed by the newline in order; the stock program uses that newline to recognise a complete command."],"es":["El portátil de Lucía, 10.1.0.10, abre una conexión TCP desde el puerto 51000 al servidor de existencias 10.2.3.8:9000. El intercambio inicial establece la conexión y después el programa escribe STOCK=12 seguido de un salto de línea.","En este intercambio, TCP reparte los bytes entre dos segmentos. Se pierde el primero, que contiene STOCK=; llega el segundo, con 12 y el salto de línea. El TCP del servidor retiene esos bytes posteriores.","El portátil retransmite los bytes que faltan. El TCP del servidor ya puede entregar STOCK=12 y el salto de línea en orden; el programa de existencias utiliza ese salto para reconocer un comando completo."]},"pitfalls":{"en":["Two TCP writes need not produce two application reads. Define message boundaries with a length field or delimiter such as a newline.","An established TCP connection can still fail. Its acknowledgements confirm receipt by TCP, not that the application saved a stock change."],"es":["Dos escrituras en TCP no tienen por qué generar dos lecturas en la aplicación. Delimita los mensajes mediante su longitud o un separador, como el salto de línea.","Una conexión TCP ya establecida puede fallar. Sus confirmaciones acreditan la recepción por TCP, pero no que la aplicación haya guardado el cambio de existencias."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"},{"url":"https://www.rfc-editor.org/rfc/rfc768","label":"rfc-editor.org: rfc768"},{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"Seven jobs involved in communication","es":"Siete funciones de una comunicación"},"caption":{"en":"Read from application meaning at the top to physical signals at the bottom. Select a layer to study it. OSI separates responsibilities for learning and troubleshooting; real Internet protocols do not form seven separate layers.","es":"Lee desde el significado del mensaje, arriba, hasta las señales físicas, abajo. Pulsa una capa para estudiarla. OSI separa funciones para entender y diagnosticar redes; los protocolos de Internet no forman siete capas independientes."},"alt":{"en":"Seven linked rows ordered from layer 7 at the top to layer 1 at the bottom: application messages, presentation formats, session dialogue, transport ports and delivery, network addressing and routing, data-link frames, and physical signals. Select a row to open its lesson. OSI is a conceptual model, not seven literal Internet headers.","es":"Siete filas con enlaces, desde la capa 7 arriba hasta la 1 abajo: mensajes de aplicación, formatos de presentación, diálogo de sesión, puertos y entrega de transporte, direcciones y rutas de red, tramas de enlace y señales físicas. Selecciona una fila para abrir su lección. OSI es un modelo conceptual, no siete cabeceras literales de Internet."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"Defines messages that applications exchange, such as an HTTP request for a web page.","es":"Define los mensajes que intercambian las aplicaciones, como una petición HTTP para abrir una página."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"Represents data in a format the receiver can interpret. Encoding and encryption illustrate this responsibility; placing TLS here is only a teaching comparison.","es":"Representa los datos de forma que el receptor pueda interpretarlos. La codificación y el cifrado ilustran esta función; situar TLS aquí es solo una comparación didáctica."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinates a dialogue and its checkpoints. A website login usually stores application state instead of using a distinct OSI session protocol.","es":"Coordina el diálogo y sus puntos de recuperación. Un inicio de sesión web suele guardar estado en la aplicación, sin usar un protocolo OSI de sesión separado."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Uses ports to direct data to an application. TCP delivers an ordered byte stream; UDP sends datagrams without that guarantee.","es":"Usa puertos para dirigir los datos a una aplicación. TCP entrega una secuencia ordenada de bytes; UDP envía datagramas sin esa garantía."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Uses IP addresses and routes to forward packets between networks. Each router selects the next hop.","es":"Usa direcciones IP y rutas para reenviar paquetes entre redes. Cada router selecciona el siguiente salto."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Carries frames across a local link. Ethernet uses MAC addresses; ARP finds the MAC associated with a local IPv4 next hop.","es":"Transporta tramas por un enlace local. Ethernet usa direcciones MAC; ARP busca la MAC del siguiente salto IPv4 en la red local."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Transmits bits as light, electrical signals or radio waves through the physical medium.","es":"Transmite bits mediante luz, señales eléctricas u ondas de radio por el medio físico."}}]}]},{"id":"osi-5","parent":"osi","title":{"en":"Layer 5: Session","es":"Capa 5: Sesión"},"summary":{"en":"Session functions coordinate a dialogue's turns and agreed progress, beyond simply keeping a connection open.","es":"Las funciones de sesión coordinan los turnos y el progreso acordado del diálogo, más allá de mantener abierta una conexión."},"details":{"en":["Dialogue control can impose turns even when TCP allows both peers to send simultaneously. For example, an archive receiver may authorise a data phase, then reserve a confirmation phase before accepting more blocks. Synchronisation points identify agreed progress within that dialogue; support for them depends on the chosen protocol. A TCP reconnection restores a transport path but does not automatically reconstruct those phases or their progress."],"es":["El control del diálogo puede imponer turnos aunque TCP permita enviar a ambas partes a la vez. Por ejemplo, un servidor de archivo puede autorizar una fase de datos y reservar después una fase de confirmación antes de aceptar más bloques. Los puntos de sincronización señalan avances acordados dentro del diálogo; su disponibilidad depende del protocolo elegido. Reconectar TCP recupera el transporte, pero no reconstruye automáticamente esas fases ni el progreso alcanzado."]},"aws":{"en":"An inventory importer on EC2 can store transfer F7's confirmed checkpoint in DynamoDB after retaining each block durably. A replacement worker reads that checkpoint and negotiates the next block with the sender. This is application-level recovery illustrating session coordination, not an AWS implementation of OSI layer 5.","es":"Un importador de inventario en EC2 puede registrar en DynamoDB el punto de control confirmado de F7 tras guardar cada bloque de forma duradera. Un proceso sustituto consulta ese punto y acuerda con el emisor el siguiente bloque. Es recuperación de aplicación que ilustra la coordinación de sesión, no una implementación AWS de la capa 5 OSI."},"question":{"en":"During transfer F7, the archive server confirms block 2 and the connection breaks while block 3 is being sent. The client reconnects. What must the programs agree before continuing?","es":"Durante la transferencia F7, el servidor de archivo confirma el bloque 2 y la conexión se corta mientras se envía el 3. El cliente vuelve a conectarse. ¿Qué deben acordar los programas antes de continuar?"},"answer":{"en":"They must identify F7 and compare retained progress, not infer it from the new TCP connection. If the server durably saved blocks 1 and 2 and both sides accept that checkpoint, they can resume with block 3. If block 3 might already have been saved, the receiver needs to recognise a repeated block rather than append it twice. The transfer protocol must define this exchange and completion acknowledgement; neither TCP reconnection nor an HTTP login cookie supplies it.","es":"Deben identificar F7 y comparar el progreso conservado, sin deducirlo de la nueva conexión TCP. Si el servidor guardó de forma duradera los bloques 1 y 2 y ambos aceptan ese punto, pueden continuar con el 3. Si el bloque 3 pudo haberse guardado, el receptor debe reconocer una repetición para no añadirlo dos veces. El protocolo de transferencia tiene que definir este intercambio y la confirmación final; ni reconectar TCP ni una cookie de inicio de sesión resuelven esa coordinación."},"related":["sessions"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x","label":"developer.mozilla.org: Connection management in HTTP 1.x"}],"level":"foundation","learning":{"definition":{"en":"In the OSI model, the session layer organises a continuing dialogue between programs: when it starts, whose turn it is, and how it ends. It can also coordinate agreed recovery points so an interrupted exchange resumes consistently.","es":"En el modelo OSI, la capa de sesión organiza un diálogo entre programas: cuándo empieza, quién tiene el turno y cómo termina. También puede coordinar puntos de recuperación acordados para reanudar un intercambio interrumpido sin que las dos partes pierdan la sincronización."},"simple":{"en":"Two programs exchange control messages as well as useful data. They agree which conversation a message belongs to, whether one side must wait before speaking, and which progress points both have confirmed. If communication breaks, recovery uses a mutually accepted checkpoint rather than guessing from the last bytes sent. These are conceptual session responsibilities; modern Internet software commonly places them in an application protocol or library instead of a separate layer.","es":"Dos programas intercambian mensajes de control además de los datos útiles. Acuerdan a qué conversación pertenece cada mensaje, cuándo debe esperar una parte y qué avances han confirmado ambas. Si se interrumpe la comunicación, la recuperación parte de un punto de control aceptado por las dos, sin adivinar por los últimos bytes enviados. Son responsabilidades conceptuales de sesión; en Internet suelen implementarse dentro del protocolo de aplicación o de una biblioteca, sin una capa independiente."},"analogy":{"en":"A meeting chair gives people turns and records an agenda point for restarting an interrupted discussion. The limit: resuming a computer exchange requires both programs to verify retained data, not simply trust a note.","es":"Un moderador da la palabra y anota en qué punto retomar una reunión interrumpida. El límite: para reanudar un intercambio informático, ambos programas deben comprobar qué datos conservaron; no basta con una anotación."},"walkthrough":{"en":["Ana's laptop and an archive server use an illustrative transfer protocol for inventory.csv. They agree on transfer identifier F7 and three numbered blocks; the server then gives the laptop permission to start sending.","The laptop sends blocks 1 and 2. The archive server stores both durably and confirms checkpoint 2 for F7. The connection breaks while the laptop is sending block 3.","The laptop reconnects and asks to resume F7. Both sides confirm checkpoint 2, so the laptop sends block 3. The archive server stores it and acknowledges completion; they then close the F7 dialogue."],"es":["El portátil de Ana y un servidor de archivo usan un protocolo ilustrativo para transferir inventory.csv. Acuerdan el identificador F7 y tres bloques numerados; después, el servidor autoriza al portátil a empezar el envío.","El portátil envía los bloques 1 y 2. El servidor de archivo guarda ambos de forma duradera y confirma el punto de control 2 de F7. La conexión se corta durante el envío del bloque 3.","El portátil vuelve a conectarse y solicita reanudar F7. Ambos confirman el punto de control 2, así que el portátil envía el bloque 3. El servidor lo guarda y confirma la finalización; entonces cierran el diálogo F7."]},"pitfalls":{"en":["A login cookie tracks application identity; it does not by itself implement OSI dialogue coordination, turn control or checkpoint recovery.","A checkpoint recorded only by the sender cannot prove the receiver retained those blocks. Resume from progress both sides can validate."],"es":["Una cookie de inicio de sesión identifica al usuario para la aplicación; por sí sola no implementa la coordinación del diálogo OSI, los turnos ni la recuperación.","Un punto de control anotado solo por el emisor no demuestra que el receptor conserve esos bloques. Reanuda desde un avance que ambos puedan validar."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x","label":"developer.mozilla.org: Connection management in HTTP 1.x"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"Seven jobs involved in communication","es":"Siete funciones de una comunicación"},"caption":{"en":"Read from application meaning at the top to physical signals at the bottom. Select a layer to study it. OSI separates responsibilities for learning and troubleshooting; real Internet protocols do not form seven separate layers.","es":"Lee desde el significado del mensaje, arriba, hasta las señales físicas, abajo. Pulsa una capa para estudiarla. OSI separa funciones para entender y diagnosticar redes; los protocolos de Internet no forman siete capas independientes."},"alt":{"en":"Seven linked rows ordered from layer 7 at the top to layer 1 at the bottom: application messages, presentation formats, session dialogue, transport ports and delivery, network addressing and routing, data-link frames, and physical signals. Select a row to open its lesson. OSI is a conceptual model, not seven literal Internet headers.","es":"Siete filas con enlaces, desde la capa 7 arriba hasta la 1 abajo: mensajes de aplicación, formatos de presentación, diálogo de sesión, puertos y entrega de transporte, direcciones y rutas de red, tramas de enlace y señales físicas. Selecciona una fila para abrir su lección. OSI es un modelo conceptual, no siete cabeceras literales de Internet."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"Defines messages that applications exchange, such as an HTTP request for a web page.","es":"Define los mensajes que intercambian las aplicaciones, como una petición HTTP para abrir una página."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"Represents data in a format the receiver can interpret. Encoding and encryption illustrate this responsibility; placing TLS here is only a teaching comparison.","es":"Representa los datos de forma que el receptor pueda interpretarlos. La codificación y el cifrado ilustran esta función; situar TLS aquí es solo una comparación didáctica."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinates a dialogue and its che
