delo de lenguaje. Pedir al modelo que guarde secretos no es un control de acceso."}},{"from":"app","to":"llm","label":{"en":"Prompt: the question, the retrieved passages, and answer only from them","es":"Prompt: la pregunta, los pasajes recuperados y responde solo a partir de ellos"},"note":{"en":"Include only useful passages and identify their sources. More context increases input size and may add distractions, cost and latency.","es":"Incluye solo fragmentos útiles e identifica sus fuentes. Más contexto aumenta la entrada y puede añadir distracciones, coste y latencia."}},{"from":"llm","to":"app","label":{"en":"The model generates an answer using the supplied context","es":"El modelo genera una respuesta usando el contexto recibido"}},{"from":"app","to":"user","label":{"en":"The answer, with citations to the passages used","es":"La respuesta, con citas a los pasajes usados"},"note":{"en":"Check that each citation supports the associated claim. If evidence is missing, the system should say so rather than turn a fluent guess into an apparent fact.","es":"Comprueba que cada cita respalde su afirmación. Si falta información, el sistema debe indicarlo en lugar de presentar una suposición bien redactada como un hecho."}}]}]},{"id":"ai-evaluation","parent":"ai","title":{"en":"Evaluating AI Systems","es":"Evaluación de sistemas de IA"},"summary":{"en":"Evaluate the decisions users depend on, with separate visibility into consequential failures.","es":"Evalúa las decisiones de las que dependen los usuarios y examina por separado los fallos con consecuencias importantes."},"details":{"en":["One run is a sample of behaviour when generation varies between calls. Repeat consequential cases and record the model version, instructions and retrieval configuration, so a correct retry does not conceal an intermittent failure."],"es":["Una ejecución es una muestra del comportamiento cuando la generación varía entre llamadas. Repite los casos importantes y registra la versión del modelo, las instrucciones y la configuración de búsqueda, para que un reintento correcto no oculte un fallo intermitente."]},"aws":{"en":"Create an Amazon Bedrock model evaluation job using return-policy questions, then have human reviewers assess borderline refund advice against the same written acceptance criteria.","es":"Crea un trabajo de evaluación de modelos en Amazon Bedrock con preguntas sobre devoluciones y pide a revisores humanos que valoren los casos dudosos con los mismos criterios de aceptación."},"question":{"en":"The assistant handles routine returns well but occasionally invents exceptions for late returns. Is it ready for release?","es":"El asistente resuelve bien las devoluciones habituales, pero a veces inventa excepciones fuera de plazo. ¿Está listo para lanzarse?"},"answer":{"en":"I would hold the release until those unsupported promises have been measured against an agreed acceptance limit. Good routine answers can hide failures that create financial commitments or mislead customers. Review late-return cases with policy owners, repeat them to expose variability, and check whether user pressure triggers the mistake. After a fix, rerun those cases and the untouched evaluation set. Include response time and cost in the decision, without letting efficiency excuse unacceptable policy errors.","es":"Yo frenaría el lanzamiento hasta medir esas promesas infundadas frente a un límite de aceptación acordado. Las respuestas habituales correctas pueden ocultar fallos que generen compromisos económicos o confundan a clientes. Revisa los casos fuera de plazo con los responsables de la política, repítelos para detectar variaciones y comprueba si la presión del usuario provoca el error. Tras corregirlo, repite esos casos y el conjunto reservado. Incluye tiempo de respuesta y coste en la decisión, sin que la eficiencia justifique errores de política inaceptables."},"related":["ai-rag","ai-security"],"sources":[{"label":"Amazon Bedrock Model Evaluation","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}],"level":"applied","learning":{"definition":{"en":"AI evaluation measures whether an application performs a defined task well enough for its intended use. It turns expectations into testable criteria, so release decisions rest on observed behaviour and acceptable risk rather than an impressive demonstration.","es":"La evaluación de IA mide si una aplicación realiza una tarea con la calidad necesaria para el uso previsto. Convierte las expectativas en criterios comprobables, para decidir su lanzamiento a partir del comportamiento observado y del riesgo aceptable, en lugar de una demostración llamativa."},"simple":{"en":"An evaluation team collects realistic requests and records what acceptable responses must do. A rubric is the written set of scoring criteria, such as applying a return deadline correctly and avoiding unsupported promises. Automated checks can cover many cases; another model can also score responses, although its judgements need calibration against human reviewers. For an assistant that searches documents, test the retrieved evidence separately from the final response so that a failure points to the component needing work.","es":"El equipo reúne consultas realistas y documenta qué debe cumplir una respuesta aceptable. Una rúbrica recoge los criterios de puntuación, como aplicar correctamente un plazo de devolución sin inventar compromisos. Las comprobaciones automáticas permiten revisar muchos casos; otro modelo también puede puntuar respuestas, aunque sus valoraciones deben contrastarse con revisores humanos. Si el asistente busca documentos, conviene evaluar por separado la información recuperada y la respuesta final: así, un fallo ayuda a localizar el componente que necesita cambios."},"analogy":{"en":"Evaluating an assistant resembles road-testing a car on the routes it will actually travel. A smooth lap says little about wet braking; the comparison ends because software errors depend on wording as well as conditions.","es":"Evaluar un asistente se parece a probar un coche en sus recorridos habituales. Una vuelta sin problemas dice poco sobre frenar en mojado; la comparación es limitada porque también importa cómo se formule cada consulta."},"walkthrough":{"en":["A fictional shop allows standard returns within 30 days. The team tests a customer asking to return an unused kettle bought 45 days ago; the expected response explains that the normal window has expired without inventing an exception.","The candidate assistant retrieves the correct 30-day policy but approves the return because the kettle is unused. Reviewers record successful retrieval and a failed policy interpretation, preserving the passages and response so the fault can be reproduced.","After revising the instructions, the team repeats the kettle case and checks an untouched test set, including attempts to pressure the assistant into exceptions. It reviews unsupported refund promises separately before deciding whether the revision meets its release criteria."],"es":["Una tienda ficticia admite devoluciones ordinarias durante 30 días. El equipo prueba la consulta de un cliente que quiere devolver un hervidor sin usar comprado hace 45 días; la respuesta esperada explica que el plazo ordinario ha vencido, sin inventar una excepción.","El asistente candidato recupera la política correcta de 30 días, pero acepta la devolución porque el hervidor está sin usar. Los revisores registran una búsqueda correcta y una interpretación fallida, y conservan los pasajes y la respuesta para reproducir el problema.","Tras modificar las instrucciones, el equipo repite el caso del hervidor y comprueba un conjunto de pruebas reservado, con intentos de presionar al asistente para que haga excepciones. Revisa por separado las promesas de reembolso infundadas antes de decidir si cumple los criterios de lanzamiento."]},"pitfalls":{"en":["An overall score can hide serious failures on uncommon requests. Include out-of-scope questions and harmful requests, with human review for safety or compliance-sensitive decisions.","Repeatedly tuning against the same questions contaminates the test. Keep a separate evaluation set out of development, and define acceptable failure rates before examining the results."],"es":["Una puntuación global puede ocultar fallos graves en consultas poco frecuentes. Incluye preguntas fuera del alcance y peticiones dañinas, con revisión humana cuando estén en juego la seguridad o el cumplimiento normativo.","Ajustar repetidamente el sistema con las mismas preguntas contamina la prueba. Reserva un conjunto de evaluación que no se utilice durante el desarrollo y fija tasas de fallo aceptables antes de mirar los resultados."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html","label":"docs.aws.amazon.com: evaluation"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}]}},{"id":"ai-security","parent":"ai","title":{"en":"AI Security and Safety","es":"Seguridad y protección en IA"},"summary":{"en":"Keep authority in application controls when a model reads hostile instructions inside a document.","es":"La autoridad debe permanecer en los controles de la aplicación cuando el modelo lee instrucciones hostiles en un documento."},"details":{"en":["Approving a tool name is insufficient: an email tool can be misused through recipient or attachment arguments. Validate those arguments on the server against the authorised task, and show the exact content when requesting approval."],"es":["Aprobar una herramienta no basta: una función de correo puede usarse indebidamente mediante el destinatario o los adjuntos. Valida esos argumentos en el servidor frente a la tarea autorizada y muestra el contenido exacto al solicitar aprobación."]},"aws":{"en":"For a Bedrock invoice-summary service, use Amazon Bedrock Guardrails to screen content, restrict the backend role to required invoice objects, and enforce employee-specific access in application code.","es":"En un servicio de resumen de facturas con Bedrock, usa Amazon Bedrock Guardrails para filtrar contenido, limita el rol del backend a las facturas necesarias y aplica los permisos de cada empleado en código."},"question":{"en":"A supplier PDF orders our assistant to email a customer list. Is telling the model to ignore document instructions sufficient?","es":"Un PDF de proveedor ordena al asistente que envíe una lista de clientes por correo. ¿Basta con decirle que ignore las instrucciones del documento?"},"answer":{"en":"That instruction helps, but I would not rely on it as the control. The supplier document has no authority to expand the task. A summarisation workflow should not expose customer exports or email sending, and record access must be checked against the authenticated employee before retrieval. Enforce those limits outside the model at the tool boundary. Content screening offers another chance to catch the attack, but test variants that evade it and confirm forbidden actions remain blocked.","es":"Esa instrucción ayuda, pero no la usaría como control suficiente. El documento del proveedor no tiene autoridad para ampliar la tarea. Un flujo de resumen no debería ofrecer exportaciones de clientes ni envío de correos; el acceso a registros debe comprobarse con la identidad del empleado antes de recuperarlos. Aplica esos límites fuera del modelo, al ejecutar las herramientas. El filtrado añade otra oportunidad para detectar el ataque, pero prueba variantes que lo esquiven y confirma que las acciones prohibidas siguen bloqueadas."},"related":["ai-rag","iam","encryption"],"sources":[{"label":"Amazon Bedrock Guardrails","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html"},{"url":"https://genai.owasp.org/llm-top-10/","label":"genai.owasp.org: llm top 10"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}],"level":"deep","learning":{"definition":{"en":"AI security protects the information and actions an AI application can reach from misuse. AI safety addresses harmful behaviour, including accidental mistakes; both require boundaries around the model rather than relying on its wording alone.","es":"La seguridad de IA protege frente al uso indebido de la información y las acciones accesibles desde una aplicación. La protección frente a daños también abarca los errores accidentales; ambas requieren límites alrededor del modelo, sin confiar únicamente en las instrucciones que recibe."},"simple":{"en":"An assistant may read external material while serving an authorised user. That material can contain prompt injection: text that tries to redirect the model through instructions disguised as content. Because a model may confuse content with authority, the application checks identity and permissions before retrieving records or executing tools. Filters can flag suspicious material, while independent access controls restrict what a mistaken model decision can do. Safety checks also address harmful responses when nobody is deliberately attacking the system.","es":"Un asistente puede leer material externo al atender a un usuario autorizado. Ese material puede contener una inyección de instrucciones: órdenes que intentan desviar al modelo disfrazadas de contenido. Como puede confundir contenido y autoridad, la aplicación comprueba identidad y permisos antes de recuperar registros o ejecutar herramientas. Los filtros pueden señalar material sospechoso; los controles de acceso limitan las consecuencias de una decisión errónea. Las comprobaciones de seguridad también buscan respuestas dañinas cuando nadie está atacando el sistema."},"analogy":{"en":"Think of a museum guide reading an exhibit label that orders them to unlock the storeroom. The label has no authority over the keys. Unlike a person, a model may struggle to recognise that distinction.","es":"Imagina que un guía lee una cartela que le ordena abrir el almacén. La cartela no concede permiso para usar las llaves. La comparación es limitada: al modelo puede costarle distinguir contenido y autoridad."},"walkthrough":{"en":["Lena asks a procurement assistant to summarise an uploaded supplier invoice. Hidden text in the PDF tells the assistant to fetch a customer list and email it to the supplier, although Lena requested no such action.","The application identifies Lena before searching and exposes only invoice records she may read. Its tool gateway, the component controlling tool execution, refuses customer-directory access; this summarisation workflow has no email-sending capability.","During a test, the model nevertheless proposes the forbidden export. The gateway rejects it, so no message is sent. The team examines the logged attempt and checks the invoice summary for sensitive content before enabling the workflow."],"es":["Lena pide a un asistente de compras que resuma una factura de proveedor que ha subido. Un texto oculto en el PDF le ordena obtener una lista de clientes y enviársela al proveedor, aunque Lena no ha solicitado esa acción.","La aplicación identifica a Lena antes de buscar y solo ofrece facturas que puede consultar. El componente que controla la ejecución de herramientas rechaza el acceso al directorio de clientes; este flujo de resumen tampoco dispone de una función para enviar correos.","Durante una prueba, el modelo propone de todos modos la exportación prohibida. El control de ejecución la rechaza, por lo que no se envía ningún mensaje. El equipo examina el intento registrado y comprueba si el resumen contiene datos sensibles antes de habilitar el flujo."]},"pitfalls":{"en":["An instruction to ignore malicious text and a content filter can both fail. Keep tool permissions narrow and require explicit approval for sensitive actions that remain available.","Redacting the final answer is too late to enforce document access. Exclude records the requester cannot read before they enter the model context, including records belonging to another customer."],"es":["Tanto una instrucción para ignorar texto malicioso como un filtro pueden fallar. Limita los permisos de las herramientas y exige aprobación explícita para las acciones sensibles que sigan disponibles.","Ocultar datos en la respuesta final llega tarde para controlar el acceso documental. Excluye los registros que el solicitante no puede consultar antes de incorporarlos al contexto del modelo, incluidos los de otros clientes."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html","label":"docs.aws.amazon.com: guardrails"},{"url":"https://genai.owasp.org/llm-top-10/","label":"genai.owasp.org: llm top 10"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}]}},{"id":"ai-cost","parent":"ai","title":{"en":"Cost of AI Systems","es":"Coste de los sistemas de IA"},"summary":{"en":"Budget the complete request path and check savings against the quality of resolved requests.","es":"Presupuesta la petición completa y contrasta el ahorro con la calidad de las consultas resueltas."},"details":{"en":["Provisioned throughput reserves model capacity billed over time, including quiet periods. Measure recurring demand and check the selected model, Region and commitment terms before comparing a reservation with on-demand service."],"es":["El rendimiento aprovisionado reserva capacidad del modelo facturada por tiempo, incluidos los periodos de poca actividad. Mide la demanda recurrente y comprueba el modelo, la región y las condiciones de compromiso antes de compararlo con el servicio bajo demanda."]},"aws":{"en":"For a Bedrock handbook assistant, measure input and output separately, apply current on-demand rates for the selected model and Region, and add search infrastructure costs.","es":"Para un asistente de manuales con Bedrock, mide entrada y salida por separado, aplica las tarifas bajo demanda vigentes del modelo y la región, y añade la infraestructura de búsqueda."},"question":{"en":"We halved input tokens per question, but the total bill barely moved. What could explain that?","es":"Hemos reducido a la mitad los tokens de entrada por pregunta, pero la factura apenas baja. ¿Cómo se explica?"},"answer":{"en":"The reduction affects usage-based input charges, not every bill component. Check whether output generation, search infrastructure or reserved capacity dominates spending. Compare request volume and retries over the same period: more calls can offset fewer tokens per call. Confirm the actual model and pricing mode before applying rates. I would break the invoice into those components and compare cost per successfully resolved question, so a smaller prompt is not mistaken for a proportionate total saving.","es":"La reducción afecta a la entrada facturada por uso, no a todas las partidas. Comprueba si la salida, la búsqueda o la capacidad reservada concentran el gasto. Compara las consultas y los reintentos del mismo periodo: más llamadas pueden compensar menos tokens por llamada. Confirma el modelo y la modalidad de precio antes de aplicar tarifas. Yo desglosaría la factura y compararía el coste por pregunta resuelta satisfactoriamente, para no confundir una entrada más corta con una reducción proporcional del gasto total."},"related":["ai-rag","cost-optimization"],"sources":[{"label":"Amazon Bedrock Pricing","url":"https://aws.amazon.com/bedrock/pricing/"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html","label":"docs.aws.amazon.com: prov throughput"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html","label":"docs.aws.amazon.com: titan embedding models"}],"level":"applied","learning":{"definition":{"en":"AI cost is the money required to run the complete request path of an application, including model calls and supporting services. Understanding it lets you choose a design and capacity plan that fit the workload while preserving the quality users need.","es":"El coste de IA es el dinero necesario para atender una petición de principio a fin, incluidas las llamadas al modelo y los servicios de apoyo. Entenderlo permite elegir un diseño y una capacidad adecuados para la carga de trabajo, manteniendo la calidad que necesitan los usuarios."},"simple":{"en":"A text model processes tokens, small pieces of text rather than whole documents. With usage-based text pricing, reading input and producing output can have different rates. The application may resend conversation history and retrieved passages on every call, so one short user question can still create a large input. Search infrastructure and preparing documents for retrieval add other charges. Measure that whole path, because the model response is only part of what you pay for.","es":"Un modelo de texto procesa tokens, pequeñas unidades de texto. En una tarifa por uso, leer la entrada y generar la salida pueden tener precios distintos. La aplicación puede reenviar el historial y los pasajes recuperados en cada llamada, así que una pregunta breve puede generar una entrada extensa. La infraestructura de búsqueda y la preparación de documentos añaden otros costes. Conviene medir todo el recorrido de la petición, porque la respuesta del modelo solo representa una parte del gasto."},"analogy":{"en":"Think of a taxi service billed for distance travelled, including detours and repeat trips. Shorter routes can lower the bill, but the comparison misses the separate software charges for stored data and reserved computing capacity.","es":"Piensa en un taxi que cobra por el recorrido, incluidos desvíos y viajes repetidos. Acortar el trayecto puede reducir la factura, aunque la comparación no recoge los cargos por almacenar datos o reservar capacidad informática."},"walkthrough":{"en":["A handbook assistant serves 10,000 questions daily. Each request sends 4,000 input tokens, including policy excerpts, and returns 400 output tokens: 40 million input and 4 million output tokens per day.","The team removes repeated policy excerpts and tests shorter conversation summaries. With answers still meeting its evaluation criteria, input falls to 2,000 tokens per request, or 20 million daily; output remains 4 million.","Its estimate applies the selected model rates for input and output, then adds search, storage and document-indexing costs. The input charge falls in this pay-per-token example, while output and other unchanged charges remain."],"es":["Un asistente de consulta de manuales atiende 10.000 preguntas diarias. Cada petición envía 4.000 tokens de entrada, incluidos extractos de las normas, y genera 400 de salida: 40 millones de entrada y 4 millones de salida al día.","El equipo elimina extractos repetidos y prueba resúmenes más breves del historial. Las respuestas siguen cumpliendo sus criterios de evaluación y la entrada baja a 2.000 tokens por petición, o 20 millones diarios; la salida se mantiene en 4 millones.","La estimación aplica las tarifas de entrada y salida del modelo elegido, y añade búsqueda, almacenamiento e indexación documental. En este ejemplo de pago por token, baja el cargo de entrada; los de salida y los demás conceptos que no han cambiado se mantienen."]},"pitfalls":{"en":["A cheaper call can become a costlier workflow if it needs retries or escalation. Compare spend per satisfactorily resolved request, including failures, rather than token price alone.","Caching answers requires user-aware access checks and a way to expire outdated content. Reusing a response across accounts can save tokens while exposing information."],"es":["Una llamada más barata puede encarecer el proceso si exige reintentos o intervención adicional. Compara el gasto por petición resuelta satisfactoriamente, incluidos los fallos, en lugar de mirar solo el precio por token.","Guardar respuestas en caché exige comprobar los permisos del usuario y caducar el contenido desactualizado. Reutilizar una respuesta entre cuentas puede ahorrar tokens y, a la vez, exponer información."]},"sourceUrls":[{"url":"https://aws.amazon.com/bedrock/pricing/","label":"aws.amazon.com: pricing"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html","label":"docs.aws.amazon.com: prov throughput"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html","label":"docs.aws.amazon.com: titan embedding models"}]}},{"id":"architecture","parent":null,"title":{"en":"Solution Architecture Practice","es":"Práctica de arquitectura de soluciones"},"summary":{"en":"Define how parts cooperate, including what each part does when another fails.","es":"Define cómo colaboran las partes y qué hace cada una cuando falla otra."},"details":{"en":["A decision record should capture the assumption behind a choice and the observation that would trigger a review. For the print shop, record the acceptable confirmation delay and revisit worker capacity when measured delays exceed it. Future engineers can then revise the design without guessing the original intent."],"es":["Un registro de decisiones debe recoger el supuesto que justifica una elección y la señal que llevaría a revisarla. En la imprenta, anota el retraso aceptable de las confirmaciones y revisa la capacidad del proceso de envío cuando las mediciones lo superen. Así, otros ingenieros podrán modificar el diseño sin adivinar su intención original."]},"aws":{"en":"Use an Amazon RDS transaction to save the print shop's order and its pending-email status together; a separate worker sends pending confirmations without holding checkout open.","es":"Utiliza una transacción de Amazon RDS para guardar juntos el pedido de la imprenta y su estado de correo pendiente; un proceso independiente envía las confirmaciones sin mantener abierta la compra."},"question":{"en":"The print shop wants checkout restored quickly but has only two engineers. Would you split the whole application into services?","es":"La imprenta quiere recuperar pronto las compras, pero solo tiene dos ingenieros. ¿Separarías toda la aplicación en servicios?"},"answer":{"en":"I would start with the dependency causing the interruption. Checkout needs a saved order; it does not need the email provider to respond immediately. I would separate confirmation delivery, retain pending work durably and leave the rest of the application together unless another requirement justifies a split. Two engineers would then have a smaller change to operate. I would check order records against customer receipts during an email outage and test that retries do not create extra orders.","es":"Empezaría por la dependencia que provoca la interrupción. La compra necesita un pedido guardado; no necesita que el proveedor de correo responda al instante. Separaría el envío de confirmaciones, guardaría de forma persistente los envíos pendientes y mantendría unido el resto, salvo que otro requisito justificara dividirlo. Así, los dos ingenieros tendrían un cambio más acotado que operar. Durante una caída del correo, contrastaría los pedidos guardados con los justificantes mostrados al cliente y comprobaría que los reintentos no generan pedidos adicionales."},"related":["architecture-discovery","well-architected"],"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}],"level":"foundation","quickLinks":["interview-playbooks","well-architected"],"learning":{"definition":{"en":"Solution architecture sets out how a system's parts will work together to deliver a business outcome within practical limits. Its purpose is to make decisions about behaviour, responsibility and operation explicit enough for a team to build and evaluate.","es":"La arquitectura de soluciones establece cómo colaborarán las partes de un sistema para lograr un resultado de negocio dentro de unos límites prácticos. Su propósito es concretar las decisiones sobre comportamiento, responsabilidades y operación para que el equipo pueda construir la solución y evaluarla."},"simple":{"en":"The shop owner decides what must remain possible when something breaks. The architect assigns responsibilities to components, the separate parts of the system, and defines their interfaces, the rules for exchanging requests and data. Engineers check those rules under realistic conditions. If saving an order and sending its email must succeed together, an email outage can stop checkout. Separating those responsibilities lets checkout depend on the saved order, while email can be attempted later.","es":"El dueño de la tienda decide qué debe seguir funcionando cuando algo falla. El arquitecto reparte responsabilidades entre componentes, las partes del sistema, y define sus interfaces, las reglas para intercambiar solicitudes y datos. Los ingenieros comprueban esas reglas en condiciones realistas. Si guardar un pedido y enviar su correo deben completarse juntos, una caída del correo puede impedir la compra. Al separar esas responsabilidades, la compra depende del pedido guardado y el correo puede enviarse después."},"analogy":{"en":"Planning a restaurant kitchen means deciding how orders reach the cooks and how finished dishes reach diners. This captures coordination between parts; software also needs explicit rules for partial failures.","es":"Organizar la cocina de un restaurante exige decidir cómo llegan las comandas a los cocineros y los platos a los comensales. La comparación explica la coordinación; el software también necesita reglas ante fallos parciales."},"walkthrough":{"en":["At a print shop, checkouts fail whenever the email provider stalls. The owner agrees that success means an order is stored and its reference appears on screen; email may follow later.","The architect keeps order storage in the checkout path and assigns unsent confirmations to a separate worker, a process that runs without the customer waiting. The order record retains enough information to retry delivery.","The team interrupts email delivery during a trial and checks each displayed reference against stored orders. After restoring delivery, they measure delayed emails and support effort before expanding the change to all traffic."],"es":["En una imprenta, las compras fallan cuando el proveedor de correo se bloquea. El dueño acuerda que una compra se completa cuando el pedido queda guardado y aparece su referencia en pantalla; el correo puede llegar después.","El arquitecto mantiene el guardado del pedido dentro del proceso de compra y asigna las confirmaciones pendientes a un proceso independiente, que trabaja sin hacer esperar al cliente. El registro del pedido conserva la información necesaria para reintentar el envío.","Durante una prueba, el equipo interrumpe el correo y contrasta cada referencia mostrada con los pedidos guardados. Tras restablecer el envío, mide los correos retrasados y el esfuerzo de soporte antes de aplicar el cambio a todo el tráfico."]},"pitfalls":{"en":["Adding components without naming who will monitor and repair them can increase support work beyond what the team can sustain.","An architecture diagram leaves behaviour unanswered: document what callers see after a timeout and how retries avoid creating duplicate orders."],"es":["Añadir componentes sin asignar quién los supervisará y reparará puede generar más trabajo de soporte del que el equipo puede asumir.","Un diagrama deja comportamientos sin concretar: documenta qué recibe quien hace una solicitud cuando vence el tiempo de espera y cómo se evitan pedidos duplicados al reintentar."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}]}},{"id":"interview-playbooks","parent":"architecture","title":{"en":"If they ask: improve this architecture","es":"Si te preguntan: mejora esta arquitectura"},"summary":{"en":"Build the recommendation from the diagram and the customer's tolerance for failure.","es":"Construye la recomendación a partir del diagrama y de los fallos que el cliente pueda tolerar."},"details":{"en":["Distinguish a label from evidence: 'private subnet' does not establish that database access is correctly limited, and 'multiple zones' does not establish that the application can continue processing. When the diagram omits a dependency, state what you would check before extending the design."],"es":["Distingue una etiqueta de una prueba: «subred privada» no demuestra que el acceso a la base de datos esté bien limitado, y «varias zonas» no demuestra que la aplicación pueda seguir procesando. Si el diagrama omite una dependencia, explica qué comprobarías antes de ampliar el diseño."]},"aws":{"en":"For the booking site, put application instances behind an Application Load Balancer across two Availability Zones, physically separate locations within an AWS Region. Use Amazon RDS Multi-AZ for database failover, and check sessions and database reconnections during the switch.","es":"Para la web de reservas, coloca las instancias detrás de un Application Load Balancer en dos zonas de disponibilidad, ubicaciones físicamente separadas dentro de una región de AWS. Usa Amazon RDS Multi-AZ para conmutar la base de datos y comprueba las sesiones y las reconexiones durante el cambio."},"question":{"en":"An interviewer says, 'Make this public web server and single-location database resilient.' What would you say before choosing AWS services?","es":"Un entrevistador te pide dar resiliencia a un servidor web público y una base de datos en una sola ubicación. ¿Qué dirías antes de elegir servicios de AWS?"},"answer":{"en":"I would ask which disruption the site must tolerate and how long customers can wait. Assuming a location outage must be covered, both the web tier and database currently share that exposure. I would propose application capacity in separate locations and a database deployment with a tested failover path. That adds infrastructure cost and connection-handling work. I would validate it with a controlled outage, checking completed bookings and recovery time. Replication would still need backups for accidental deletion.","es":"Preguntaría qué interrupción debe soportar la web y cuánto pueden esperar los clientes. Si debe cubrir la caída de una ubicación, la capa web y la base de datos comparten actualmente esa exposición. Propondría capacidad de aplicación en ubicaciones separadas y una base de datos con conmutación probada. Eso añade coste de infraestructura y trabajo para gestionar conexiones. Lo comprobaría con una caída controlada, observando las reservas completadas y el tiempo de recuperación. La replicación seguiría necesitando copias de seguridad frente a borrados accidentales."},"related":["well-architected","improve-operations","improve-security","improve-reliability","improve-performance","improve-cost","improve-sustainability"],"quickLinks":["improve-reliability","improve-security","improve-performance","improve-cost","improve-operations","improve-sustainability"],"keywords":{"en":["interview","cheat sheet","talking points","improve architecture"],"es":["entrevista","chuleta","puntos","mejorar arquitectura"]},"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}],"level":"applied","learning":{"definition":{"en":"An architecture-improvement answer is a short argument connecting an observed weakness to a change and a way to test it. Its purpose is to show how you reason with incomplete information while making assumptions visible.","es":"Una respuesta sobre cómo mejorar una arquitectura enlaza una debilidad observada con un cambio y una forma de comprobarlo. Sirve para mostrar cómo razonas con información incompleta y qué estás dando por supuesto."},"simple":{"en":"The interviewer provides a sketch, but the candidate must establish what failure would mean for users. A failure domain is a set of resources that one incident can affect together. Two servers in the same location can share that domain, so adding a server may leave the booking site exposed to a location outage. A useful answer connects that observation to a business requirement, proposes a relevant change and explains what evidence would show that it helped.","es":"El entrevistador aporta un esquema; el candidato debe aclarar qué supondría un fallo para los usuarios. Un dominio de fallo agrupa recursos que un mismo incidente puede afectar a la vez. Dos servidores en una ubicación pueden compartir ese dominio, por lo que añadir otro quizá deje la web de reservas expuesta a una caída de esa ubicación. Una respuesta útil relaciona esa observación con una necesidad del negocio, propone un cambio pertinente y explica cómo comprobaría su efecto."},"analogy":{"en":"Reviewing a diagram resembles inspecting a bicycle before a long ride: the planned journey determines which faults matter. The comparison stops at diagnosis; a distributed system also has failures hidden between components.","es":"Revisar un diagrama se parece a inspeccionar una bicicleta antes de un viaje largo: el recorrido determina qué averías importan. La comparación llega hasta el diagnóstico; un sistema distribuido también esconde fallos entre componentes."},"walkthrough":{"en":["The sketch shows a public booking server and a database in one location. You ask whether customers may lose access for twenty minutes during ticket sales; the interviewer says sales must continue through a location failure.","You propose application capacity and database failover across separate locations. Failover means switching to a surviving instance after a fault; copies alone are insufficient if traffic routing or stored sessions still depend on the failed location.","You explain the extra running cost and recovery work, then describe a controlled location-loss exercise. Observe successful bookings, reconnection time and duplicate attempts before judging whether the revised design meets the agreed behaviour."],"es":["El esquema muestra un servidor público de reservas y una base de datos en una ubicación. Preguntas si los clientes pueden quedarse veinte minutos sin acceso durante la venta de entradas; el entrevistador responde que la venta debe continuar aunque falle esa ubicación.","Propones repartir la capacidad de la aplicación y la conmutación de la base de datos entre ubicaciones separadas. Conmutar significa pasar a una instancia que siga operativa tras un fallo; las copias no bastan si el tráfico o las sesiones siguen dependiendo de la ubicación caída.","Explicas el coste adicional y el trabajo de recuperación, y planteas una prueba controlada de pérdida de una ubicación. Observas las reservas completadas, el tiempo de reconexión y los intentos duplicados antes de valorar si el diseño cumple el comportamiento acordado."]},"pitfalls":{"en":["A memorised list can miss the dependency actually shown in the sketch. Tie each proposed change to a visible fact or a stated assumption.","Study-card groupings are informal prompts. They do not define AWS interview scoring or replace the six perspectives of a Well-Architected review."],"es":["Una lista memorizada puede pasar por alto la dependencia que muestra el esquema. Relaciona cada cambio con un hecho visible o con un supuesto que hayas explicado.","Las agrupaciones de las fichas orientan el estudio. No establecen cómo puntúa AWS una entrevista ni sustituyen los seis enfoques de una revisión Well-Architected."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"}]}},{"id":"architecture-discovery","parent":"architecture","title":{"en":"Customer Discovery","es":"Descubrimiento del cliente"},"summary":{"en":"Turn a customer's request into a measurable outcome with agreed operating conditions.","es":"Convierte la petición del cliente en un resultado medible con condiciones de funcionamiento acordadas."},"details":{"en":["Record each requirement with an owner, its evidence and an unresolved question. If dispatch says cached sheets are enough but compliance forbids local copies, keep both statements visible until the responsible owners resolve them. Silently selecting one produces a design based on a false agreement."],"es":["Registra cada requisito con un responsable, las pruebas que lo respaldan y una pregunta pendiente. Si expediciones acepta las hojas guardadas, pero cumplimiento prohíbe las copias locales, mantén ambas afirmaciones visibles hasta que los responsables las concilien. Escoger una sin explicarlo deja el diseño apoyado en un acuerdo que no existe."]},"aws":{"en":"For the courier, store generated route sheets in an Amazon S3 bucket in an agreed AWS Region. Test an authorised download path that does not depend on the portal before treating those files as a dispatch fallback.","es":"Para la empresa de mensajería, guarda las hojas generadas en un bucket de Amazon S3 situado en una región de AWS acordada. Prueba una vía de descarga autorizada que no dependa del portal antes de utilizar esos archivos como alternativa para expediciones."},"question":{"en":"The courier's IT lead insists on 99.99% availability, while dispatch asks only for route sheets before 06:00. How do you turn that disagreement into a design requirement?","es":"El responsable de TI exige un 99,99 % de disponibilidad, pero expediciones solo pide las hojas antes de las 06:00. ¿Cómo conviertes ese desacuerdo en un requisito de diseño?"},"answer":{"en":"I would ask what the percentage protects and how it would be measured. Then I would test dispatch's proposal: can drivers use recent route sheets without the portal, and are downloaded copies permitted? If that fallback works, we can discuss a requirement focused on the departure deadline. If it fails, the evidence may support a stronger availability target. I would ask the business owner to approve the requirement, including its operating conditions, before using it to choose infrastructure.","es":"Preguntaría qué protege ese porcentaje y cómo se mediría. Después comprobaría la propuesta de expediciones: ¿pueden los conductores usar hojas de ruta recientes sin el portal y está permitido descargar copias? Si la alternativa funciona, podemos acordar un requisito centrado en la hora de salida. Si falla, los datos podrían justificar una disponibilidad mayor. Pediría al responsable de negocio que aprobara el requisito y sus condiciones de uso antes de utilizarlo para elegir la infraestructura."},"related":["architecture","communication-tradeoffs"],"sources":[{"label":"AWS Well-Architected Review Process","url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html","label":"docs.aws.amazon.com: availability"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"}],"level":"foundation","learning":{"definition":{"en":"Customer discovery establishes what a system must achieve and which limits a design must respect. It turns people's requests into testable requirements by investigating the work they do, the consequences of failure and the evidence behind their expectations.","es":"El descubrimiento del cliente aclara qué debe conseguir un sistema y qué límites debe respetar su diseño. Convierte las peticiones en requisitos comprobables al investigar el trabajo de las personas, las consecuencias de los fallos y las pruebas que respaldan sus expectativas."},"simple":{"en":"A customer may ask for 'always available' because one missed deadline caused a penalty. The architect traces that request to a business activity, while an operations lead explains how it happens. Together they define a requirement, a result the system must demonstrate, and distinguish it from a constraint, a boundary such as a permitted data location. Meeting a deadline may need a fallback process rather than the same availability target all day.","es":"Un cliente puede pedir disponibilidad permanente porque incumplir un plazo le supuso una penalización. El arquitecto relaciona esa petición con una actividad del negocio y el responsable de operaciones explica cómo se realiza. Juntos definen un requisito, un resultado que el sistema debe demostrar, y lo distinguen de una restricción, un límite como la ubicación permitida para los datos. Cumplir un plazo puede exigir un procedimiento alternativo en vez de la misma disponibilidad durante todo el día."},"analogy":{"en":"A tailor asks how a jacket will be worn before choosing its cut. Discovery similarly translates intended use into requirements; unlike a fitting, system needs also require evidence about unusual events.","es":"Un sastre pregunta para qué se usará una chaqueta antes de elegir el corte. El descubrimiento también traduce el uso previsto en requisitos; un sistema exige además pruebas sobre situaciones poco habituales."},"walkthrough":{"en":["A courier requests 99.99% availability for its dispatch portal. You ask what happens during an outage and learn that drivers need route sheets by 06:00; a missed departure creates overtime and late deliveries.","The dispatcher says a cached route sheet is usable if it is less than fifteen minutes old. You record this as a proposal to validate, then check data-location obligations, overnight support cover and the approved spending limit.","You agree an acceptance exercise: make the portal unavailable at 05:50 and see whether dispatch can still use sufficiently recent sheets. The customer confirms who can approve that fallback and which changes would invalidate the requirement."],"es":["Una empresa de mensajería pide un 99,99 % de disponibilidad para su portal de expediciones. Preguntas qué ocurre durante una caída y descubres que los conductores necesitan las hojas de ruta a las 06:00; salir tarde provoca horas extra y retrasos en las entregas.","El coordinador explica que una copia guardada de la hoja sirve si tiene menos de quince minutos. Lo registras como propuesta pendiente de validar y compruebas las obligaciones sobre ubicación de datos, la cobertura de soporte nocturno y el límite de gasto aprobado.","Acordáis una prueba de aceptación: dejar el portal inaccesible a las 05:50 y comprobar si expediciones puede utilizar hojas suficientemente recientes. El cliente confirma quién puede aprobar esa alternativa y qué cambios obligarían a replantear el requisito."]},"pitfalls":{"en":["An availability percentage needs a measurement window and a definition of successful service; the figure alone says little about a missed dispatch deadline.","Treating an untested workaround as an agreed requirement can hide risk. Confirm its usability with the people who must rely on it."],"es":["Un porcentaje de disponibilidad necesita un periodo de medición y una definición de servicio satisfactorio; la cifra por sí sola explica poco sobre una salida que se retrasa.","Dar por acordada una alternativa que nadie ha probado puede ocultar riesgos. Comprueba que funciona con las personas que tendrán que utilizarla."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html","label":"docs.aws.amazon.com: availability"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"}]}},{"id":"well-architected","parent":"architecture","title":{"en":"Well-Architected: the six pillars","es":"Well-Architected: los seis pilares"},"summary":{"en":"Use all six pillars to explain a change's consequences and turn findings into owned actions.","es":"Utiliza los seis pilares para explicar las consecuencias de un cambio y asignar acciones a los hallazgos."},"details":{"en":["A review finding is easier to act on when it names the evidence gap. 'Backups enabled' records configuration; 'a restore completed within the agreed recovery window' records observed behaviour. Attach the workload scope and test date so later reviewers can judge whether that evidence still applies."],"es":["Es más fácil actuar sobre un hallazgo si indica qué pruebas faltan. «Copias activadas» describe una configuración; «restauración completada dentro del plazo acordado» describe un comportamiento observado. Añade el alcance de la carga de trabajo y la fecha de la prueba para que futuras revisiones puedan valorar si esa evidencia sigue siendo válida."]},"aws":{"en":"For the invoice workload, AWS Batch can add compute capacity for queued jobs and reduce it afterwards. Configure its EC2 compute environment with zero minimum vCPUs, then measure deadline performance alongside the resulting resource use.","es":"Para generar las facturas, AWS Batch puede añadir capacidad de cómputo cuando hay trabajos en cola y reducirla después. Configura su entorno de cómputo EC2 con un mínimo de cero vCPU y mide el cumplimiento del plazo junto con el uso de recursos resultante."},"question":{"en":"The invoice trial lowers the bill and finishes on time. Can the team close the Well-Architected review?","es":"La prueba de facturación reduce el gasto y termina a tiempo. ¿Puede el equipo dar por cerrada la revisión Well-Architected?"},"answer":{"en":"Those results support the performance and cost decisions, but they leave other questions open. I would check whether invoice access is limited appropriately, whether an interrupted run resumes without missing or duplicating invoices, and whether operators can detect failures. Fewer resource-hours per invoice would provide useful sustainability evidence, although it would not measure emissions directly. I would record what was tested and assign owners to remaining findings. The review can guide an improvement plan without claiming the workload is free of risk.","es":"Esos resultados respaldan las decisiones de rendimiento y coste, pero dejan preguntas abiertas. Comprobaría si el acceso a las facturas está bien limitado, si una ejecución interrumpida se reanuda sin omitir ni duplicar facturas y si operaciones detecta los fallos. Reducir las horas de uso de recursos por factura aportaría indicios útiles sobre sostenibilidad, aunque no mediría directamente las emisiones. Registraría lo probado y asignaría responsables a los hallazgos pendientes. La revisión puede orientar las mejoras sin afirmar que la carga de trabajo carece de riesgos."},"related":["reliability","disaster-recovery","cost-optimization","interview-playbooks"],"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}],"level":"foundation","keywords":{"en":["well architected","six pillars","framework"],"es":["well architected","seis pilares","marco"]},"learning":{"definition":{"en":"Well-Architected is a structured way to examine the decisions behind a workload and plan justified improvements. Its six pillars help a team connect technical evidence to how the system serves users and how people operate it.","es":"Well-Architected permite examinar de forma ordenada las decisiones de una carga de trabajo y planificar mejoras justificadas. Sus seis pilares ayudan a relacionar las pruebas técnicas con el servicio que reciben los usuarios y el trabajo de quienes lo operan."},"simple":{"en":"The team examines a workload, the application and supporting resources that deliver an outcome, through six named perspectives. Operational Excellence covers running and changing it; Security covers access and protection; Reliability covers correct operation and recovery. Performance Efficiency examines whether resource choices suit demand. Cost Optimization connects spending to useful results, while Sustainability considers environmental impact per result. Comparing these perspectives exposes consequences a single metric can hide: more capacity may reduce delays while raising spend and leaving extra resources idle.","es":"El equipo examina una carga de trabajo, la aplicación y los recursos que permiten obtener un resultado, mediante seis enfoques. Excelencia operativa aborda su operación y sus cambios; Seguridad, acceso y protección; Fiabilidad, funcionamiento correcto y recuperación. Eficiencia del rendimiento estudia la adecuación de los recursos a la demanda. Optimización de costes relaciona gasto y resultados útiles; Sostenibilidad considera el impacto ambiental por resultado. Compararlos revela consecuencias que una métrica puede ocultar: añadir capacidad puede reducir retrasos, aumentar el gasto y dejar recursos ociosos."},"analogy":{"en":"A building inspection looks beyond the façade to how the property supports its occupants. Similarly, a workload review considers several needs together, but its findings do not constitute formal approval or certification.","es":"Una inspección de un edificio mira más allá de la fachada y considera a sus ocupantes. Revisar una carga también reúne varias necesidades, aunque las conclusiones no suponen una aprobación formal ni una certificación."},"walkthrough":{"en":["An accounts team runs invoice generation on eight machines all day, although work arrives each evening. During the review, engineers collect utilisation and completion times, identify who can read invoices and explain how failed batches are handled.","They propose running workers only when invoices await processing. That can reduce idle resource use and spend, but startup time could delay the deadline; permissions, retry behaviour and operational visibility still need separate examination.","In a trial, the team compares invoice completion time, total cost and resource-hours per completed invoice. They also inspect access records and inject a failed job, then assign owners to unresolved findings rather than treating the review as approval."],"es":["Contabilidad mantiene ocho máquinas encendidas todo el día para generar facturas, aunque el trabajo llega cada tarde. En la revisión, los ingenieros recopilan datos de utilización y tiempos de finalización, identifican quién puede leer facturas y explican cómo se gestionan los lotes fallidos.","Proponen ejecutar los procesos de generación solo cuando haya facturas pendientes. Eso puede reducir recursos ociosos y gasto, pero el arranque podría comprometer el plazo; los permisos, los reintentos y la visibilidad operativa siguen necesitando un análisis específico.","En una prueba, comparan el tiempo de generación, el coste total y las horas de uso de recursos por factura completada. También examinan los registros de acceso y provocan un fallo de procesamiento; después asignan responsables a los hallazgos pendientes sin interpretar la revisión como una aprobación."]},"pitfalls":{"en":["A lower bill caused by a pricing discount leaves physical resource demand unchanged; resource-use measurements are useful indicators, but they are not direct emissions measurements.","A favourable review captures what the team knows at that time. Undocumented dependencies and later changes can introduce risks outside that picture."],"es":["Si la factura baja por un descuento, la demanda de recursos físicos sigue igual; medir el uso de recursos aporta indicios útiles, pero no mide directamente las emisiones.","Una revisión favorable refleja lo que el equipo sabe en ese momento. Las dependencias sin documentar y los cambios posteriores pueden introducir riesgos que esa revisión no recoge."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}]}},{"id":"reliability","parent":"architecture","title":{"en":"Reliability and resilience","es":"Fiabilidad y resiliencia"},"summary":{"en":"Keep essential user journeys working through component failures, and measure the outcome users actually receive.","es":"Mantén las operaciones esenciales del usuario ante fallos de componentes y mide el resultado que realmente obtiene."},"details":{"en":["A replacement can be healthy yet unready for traffic because it is still loading configuration or warming its cache. Readiness checks and a measured warm-up period prevent recovery automation from sending users to instances that have only just started."],"es":["Una instancia de sustitución puede estar sana, pero no preparada para atender tráfico porque sigue cargando la configuración o llenando su caché. Comprobar que esté lista y ajustar el periodo de arranque mediante mediciones evita que la recuperación automática envíe usuarios a instancias recién iniciadas."]},"aws":{"en":"For the cinema, place EC2 capacity across two Availability Zones behind an Application Load Balancer. Enable load-balancer health checks in its Auto Scaling group so unhealthy instances can be replaced.","es":"Para el cine, distribuye capacidad de EC2 entre dos zonas de disponibilidad detrás de un Application Load Balancer. Activa en su grupo de Auto Scaling las comprobaciones de estado del balanceador para poder sustituir las instancias averiadas."},"question":{"en":"A cinema has twice its usual server capacity, but bookings fail whenever recommendations time out. Why has adding servers not improved resilience?","es":"Un cine tiene el doble de capacidad de servidores, pero las reservas fallan cuando las recomendaciones agotan su tiempo de espera. ¿Por qué no ha mejorado la resiliencia?"},"answer":{"en":"The extra servers repeat the same dependency on recommendations, so they reproduce the failure rather than contain it. Make recommendations optional during booking and limit how long requests wait for them. A circuit breaker, which temporarily stops calls to a failing dependency, can prevent repeated delays. Test with recommendations deliberately unavailable and measure completed bookings. Check database capacity too, because redirected traffic may concentrate on resources that were not duplicated.","es":"Los servidores adicionales dependen de las mismas recomendaciones, así que reproducen el fallo en vez de contenerlo. Haz que las recomendaciones sean opcionales al reservar y limita la espera de su respuesta. Un circuit breaker, mecanismo que suspende temporalmente las llamadas a una dependencia averiada, puede evitar retrasos repetidos. Prueba las reservas con las recomendaciones desconectadas y mide cuántas se completan. Revisa también la capacidad de la base de datos: el tráfico desviado puede concentrarse en recursos que no se han duplicado."},"related":["well-architected","disaster-recovery","cloud-scaling","improve-reliability"],"sources":[{"label":"AWS Well-Architected Reliability Pillar","url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html","label":"docs.aws.amazon.com: availability"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html","label":"docs.aws.amazon.com: design principles"}],"level":"applied","quickLinks":["improve-reliability"],"learning":{"definition":{"en":"Reliability is the ability to deliver the intended service correctly and consistently over time. Resilience is the ability to withstand disruption and recover, so a broken component does not have to mean a broken service.","es":"La fiabilidad consiste en prestar el servicio previsto de forma correcta y constante a lo largo del tiempo. La resiliencia es la capacidad de soportar una alteración y recuperarse, para que el fallo de una parte no inutilice el conjunto."},"simple":{"en":"A booking service depends on application servers and a database. A second server helps only if it still operates when the first fails. A failure domain groups components that can fail together, such as machines sharing a power supply. Placing usable capacity in separate domains limits shared disruption. A health check tests whether a server can serve requests; routing then avoids failed servers. Resilience also means preserving essential operations when optional dependencies break.","es":"Un servicio de reservas depende de servidores y de una base de datos. Otro servidor ayuda solo si funciona cuando falla el primero. Un dominio de fallo agrupa componentes que pueden averiarse juntos, como máquinas con una alimentación eléctrica común. Repartir la capacidad entre dominios distintos limita ese impacto compartido. Una comprobación de estado verifica si un servidor puede atender solicitudes, y el enrutamiento evita los averiados. La resiliencia también permite mantener las operaciones esenciales cuando falla una función opcional."},"analogy":{"en":"A restaurant keeps serving when one oven breaks by shifting dishes to another. If both ovens share the failed gas supply, duplication achieves little. This comparison omits the problem of keeping software data consistent.","es":"Un restaurante sigue sirviendo al trasladar platos de un horno averiado a otro. Si ambos comparten el suministro de gas y este falla, duplicarlos aporta poco. La comparación omite los problemas de consistencia de datos."},"walkthrough":{"en":["A cinema runs booking servers in two separate zones. Its service-level objective, or SLO, is that 99.9% of booking attempts succeed within two seconds each month. Its booking database also has a tested failover arrangement.","One zone loses power. Checks identify unavailable servers, and the load balancer sends new bookings to the other zone. That zone must have enough capacity; owning spare servers alone does not establish this.","The recommendation service then slows down. The booking application stops waiting for it and hides recommendations. Buyers can still purchase tickets while engineers measure booking success and restore failed capacity."],"es":["Un cine ejecuta servidores de reservas en dos zonas separadas. Su objetivo de nivel de servicio, o SLO, es completar correctamente el 99,9 % de los intentos en menos de dos segundos cada mes. La base de datos también tiene una conmutación por error probada.","Una zona pierde el suministro eléctrico. Las comprobaciones detectan los servidores no disponibles y el balanceador de carga envía las nuevas reservas a la otra zona. Esta debe tener capacidad suficiente; disponer de servidores de reserva no demuestra que baste.","El servicio de recomendaciones se ralentiza. La aplicación de reservas deja de esperarlo y oculta las recomendaciones. Los clientes pueden seguir comprando entradas mientras los ingenieros miden las reservas completadas y restablecen la capacidad afectada."]},"pitfalls":{"en":["Checking only whether a process is running can miss broken bookings. Test useful service without letting every minor dependency trigger failover.","Automatic retries can amplify overload. Limit and space out attempts; repeated purchase requests also need protection against charging the same buyer twice."],"es":["Comprobar solo que un proceso sigue en marcha puede ocultar reservas fallidas. Verifica un servicio útil sin provocar una conmutación por cada dependencia secundaria.","Los reintentos automáticos pueden agravar la sobrecarga. Limita su número y espácialos; además, repetir una solicitud de compra no debe generar un segundo cargo al cliente."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html","label":"docs.aws.amazon.com: availability"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html","label":"docs.aws.amazon.com: design principles"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}]},"diagrams":[{"id":"multi-az","kind":"zones","nodes":["reliability","disaster-recovery"],"title":{"en":"Keep serving when one Availability Zone fails","es":"Seguir atendiendo cuando falla una zona de disponibilidad"},"caption":{"en":"Application servers run in both zones. The load balancer directs requests to healthy servers; the database can switch to its standby. This example uses an RDS Multi-AZ DB instance deployment, whose standby does not serve reads. Capacity and reconnection must also be tested.","es":"Los servidores de aplicación funcionan en ambas zonas. El balanceador dirige peticiones a servidores sanos y la base puede pasar a su copia en espera. Este ejemplo usa una instancia RDS Multi-AZ, cuya copia en espera no sirve lecturas. También hay que probar capacidad y reconexión."},"alt":{"en":"A load balancer serves application instances in zones A and B. The RDS Multi-AZ DB instance primary is in A and its synchronous standby is in B. In this deployment type, the standby does not serve reads. Application Auto Scaling spans both zones. RDS failover promotes the standby and updates its endpoint; applications must reconnect. Surviving capacity must meet demand. Backups remain necessary for accidental deletion.","es":"Un balanceador atiende instancias de aplicación en las zonas A y B. La instancia primaria RDS Multi-AZ está en A y su copia en espera síncrona en B. En este tipo de despliegue, la copia no sirve lecturas. Auto Scaling abarca ambas zonas para la aplicación. RDS promueve la copia y actualiza el endpoint durante el failover; las aplicaciones deben reconectar. La capacidad restante debe atender la demanda. Siguen haciendo falta backups para borrados accidentales."},"spanTop":{"label":{"en":"Application Load Balancer, enabled in both zones","es":"Application Load Balancer, habilitado en las dos zonas"},"note":{"en":"Health checks identify usable application targets. Configure them to reflect whether a server can actually handle a request, not merely whether its process is running.","es":"Las comprobaciones de salud identifican destinos disponibles. Configúralas para comprobar si el servidor puede atender una petición, no solo si su proceso está arrancado."}},"zones":[{"label":{"en":"Availability Zone A","es":"Zona de disponibilidad A"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Plan enough remaining capacity to handle the failure. Scaling takes time and cannot substitute for capacity that must be available immediately.","es":"Prevé capacidad suficiente para atender tras el fallo. Escalar lleva tiempo y no sustituye a la capacidad que deba estar disponible de inmediato."}},{"label":{"en":"RDS DB instance, primary","es":"Instancia de base de datos RDS, primaria"},"note":{"en":"Takes the reads and writes in this deployment option.","es":"Recibe las lecturas y escrituras en esta opción de despliegue."}}]},{"label":{"en":"Availability Zone B","es":"Zona de disponibilidad B"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Use the same application configuration. Store shared session data outside any single server so another server can continue the work.","es":"Usa la misma configuración de aplicación. Guarda las sesiones compartidas fuera de un servidor concreto para que otro pueda continuar el trabajo."}},{"label":{"en":"RDS standby, synchronous","es":"Copia en espera RDS, sincrónica"},"note":{"en":"In a Multi-AZ DB instance deployment the standby serves no traffic. It is not a read replica and not a backup.","es":"En un despliegue de instancia Multi-AZ, la copia en espera no atiende tráfico. No es una réplica de lectura ni una copia de seguridad."}}]}],"spanBottom":{"label":{"en":"Auto Scaling group across both zones","es":"Grupo de auto escalado en las dos zonas"},"note":{"en":"The Auto Scaling group manages application capacity across both zones. Separately, RDS promotes the standby during failover and updates its endpoint. Applications must reconnect. Backups are still needed to recover an accidentally deleted table.","es":"El grupo de Auto Scaling gestiona la capacidad de aplicación en ambas zonas. Por separado, RDS promueve la copia en espera durante el failover y actualiza su endpoint. Las aplicaciones deben reconectar. Siguen haciendo falta backups para recuperar una tabla borrada por error."}}}]},{"id":"disaster-recovery","parent":"architecture","title":{"en":"Disaster Recovery","es":"Recuperación ante desastres"},"summary":{"en":"Prepare and test recovery against explicit limits for lost data and service interruption.","es":"Prepara y ensaya la recuperación con límites explícitos de pérdida de datos e interrupción del servicio."},"details":{"en":["Returning to the original location needs a data transition plan. Orders accepted elsewhere must be carried back before the original database becomes authoritative again. If both databases accept independent changes during that move, stock records can diverge even while both applications appear available."],"es":["Volver a la ubicación original requiere un plan para trasladar los datos. Los pedidos aceptados en otra ubicación deben incorporarse antes de que la base de datos original vuelva a ser la referencia. Si ambas bases aceptan cambios independientes durante el traslado, las existencias pueden divergir aunque las dos aplicaciones parezcan disponibles."]},"aws":{"en":"For the wholesaler, evaluate an Amazon RDS cross-Region read replica on a supported engine, then rehearse promotion and application reconnection. Measure replication lag and total recovery time against its targets.","es":"Para el mayorista, evalúa una réplica de lectura de Amazon RDS entre regiones con un motor compatible y ensaya su promoción y la reconexión de la aplicación. Mide el retraso de replicación y la recuperación completa frente a los objetivos."},"question":{"en":"We already use Multi-AZ. Should we jump to active-active in another region to meet a two-hour recovery target?","es":"Ya usamos Multi-AZ. ¿Deberíamos pasar directamente a activo-activo en otra región para cumplir un objetivo de recuperación de dos horas?"},"answer":{"en":"First establish which failure the two-hour target must cover and how much order loss is acceptable. Multi-AZ can help with a zone outage, but does not itself prepare another region. Active-active means both sites serve live traffic; it adds coordination challenges and can still share vulnerable dependencies. A smaller recovery setup may meet the target if a drill proves it. Include detection, operator decisions, data restoration and warehouse reconnection in the measured time, rather than timing only database startup.","es":"Primero aclara qué fallos debe cubrir ese plazo y cuánta pérdida de pedidos es aceptable. Multi-AZ puede ayudar ante un fallo de zona, pero no prepara otra región. Activo-activo significa que ambos centros atienden tráfico real; añade coordinación y puede conservar dependencias vulnerables compartidas. Una alternativa con menos recursos podría cumplir el objetivo si lo demuestra un ensayo. Incluye el tiempo de detección, las decisiones operativas, la restauración de datos y la reconexión del almacén, no solo el arranque de la base de datos."},"related":["reliability","data-sql","well-architected","improve-reliability"],"sources":[{"label":"AWS Disaster Recovery Strategies","url":"https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html","label":"docs.aws.amazon.com: disaster recovery dr objectives"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html","label":"docs.aws.amazon.com: plan for disaster recovery dr"}],"level":"applied","quickLinks":["improve-reliability"],"learning":{"definition":{"en":"Disaster recovery prepares the restoration of a service after disruption exceeds its normal ability to keep running. It provides recoverable data, a place to run the workload and a tested sequence for making required business functions usable again.","es":"La recuperación ante desastres prepara la restauración de un servicio cuando una interrupción supera su capacidad habitual para seguir funcionando. Incluye datos recuperables, un entorno donde ejecutar la aplicación y una secuencia probada para volver a utilizar las funciones necesarias del negocio."},"simple":{"en":"The business decides how much recent work it can lose and how long it can operate without the service. The recovery point objective, or RPO, sets acceptable data loss measured in time; the recovery time objective, or RTO, sets the maximum acceptable outage duration. Engineers prepare copies and a replacement environment accordingly. Frequent copies reduce potential data loss, while prebuilt capacity can shorten rebuilding. Recovery can still stall without working credentials or network access.","es":"El negocio decide cuánta actividad reciente puede perder y cuánto tiempo puede funcionar sin el servicio. El objetivo de punto de recuperación, o RPO, fija la pérdida de datos aceptable, expresada en tiempo; el objetivo de tiempo de recuperación, o RTO, fija la interrupción máxima aceptable. Los ingenieros preparan copias y un entorno alternativo. Copiar con frecuencia reduce la pérdida potencial; tener capacidad preparada puede acortar la reconstrucción. Sin credenciales o acceso de red operativos, la recuperación puede quedar bloqueada."},"analogy":{"en":"A theatre keeps duplicate scripts and rehearses moving a performance to another venue. The copies preserve the content; the rehearsal exposes delays. Unlike scripts, live databases keep changing between copies.","es":"Un teatro guarda copias de los guiones y ensaya cómo trasladar una función a otra sala. Las copias conservan el contenido; el ensayo descubre retrasos. A diferencia del papel, las bases de datos cambian continuamente."},"walkthrough":{"en":["A wholesaler can re-enter at most 15 minutes of orders and tolerate two hours without dispatching. These become its RPO and RTO. It prepares another location with order-data copies and a recovery procedure.","In a drill, its primary region becomes unavailable. The team checks the latest usable copy, restores the database elsewhere and recreates the application, including network access, credentials and warehouse connections.","Dispatch resumes after 95 minutes, but the restored data is 22 minutes behind the outage. This drill meets the RTO but misses the RPO. The team fixes delayed copying and repeats the full exercise."],"es":["Un mayorista puede volver a introducir como máximo 15 minutos de pedidos y tolerar dos horas sin preparar envíos. Esos límites son su RPO y su RTO. Prepara otra ubicación con copias de los pedidos y un procedimiento de recuperación.","En un simulacro, la región principal deja de estar disponible. El equipo comprueba la última copia utilizable, restaura la base de datos en otra ubicación y reconstruye la aplicación, incluidos los accesos de red, las credenciales y las conexiones con el almacén.","Los envíos se reanudan a los 95 minutos, pero los datos restaurados llevan 22 minutos de retraso respecto al inicio de la interrupción. El ensayo cumple el RTO, pero no el RPO. El equipo corrige el retraso de las copias y repite el ejercicio completo."]},"pitfalls":{"en":["A pattern name does not establish recovery time: backup/restore rebuilds from copies, pilot light maintains core components, and warm standby runs a reduced service.","Replication can repeat accidental deletions, so retain older recovery points. Copies across zones do not prepare regional recovery; another region needs explicit data copies and tested infrastructure."],"es":["El nombre del patrón no determina la duración de la recuperación: backup/restore reconstruye desde copias, pilot light mantiene los componentes básicos y warm standby conserva un servicio reducido en marcha.","La replicación puede propagar borrados accidentales, así que conserva puntos de recuperación anteriores. Las copias entre zonas no preparan la recuperación regional: otra región necesita copias explícitas e infraestructura probada."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html","label":"docs.aws.amazon.com: disaster recovery dr objectives"},{"url":"https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html","label":"docs.aws.amazon.com: disaster recovery options in the cloud"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html","label":"docs.aws.amazon.com: plan for disaster recovery dr"}]},"diagrams":[{"id":"multi-az","kind":"zones","nodes":["reliability","disaster-recovery"],"title":{"en":"Keep serving when one Availability Zone fails","es":"Seguir atendiendo cuando falla una zona de disponibilidad"},"caption":{"en":"Application servers run in both zones. The load balancer directs requests to healthy servers; the database can switch to its standby. This example uses an RDS Multi-AZ DB instance deployment, whose standby does not serve reads. Capacity and reconnection must also be tested.","es":"Los servidores de aplicación funcionan en ambas zonas. El balanceador dirige peticiones a servidores sanos y la base puede pasar a su copia en espera. Este ejemplo usa una instancia RDS Multi-AZ, cuya copia en espera no sirve lecturas. También hay que probar capacidad y reconexión."},"alt":{"en":"A load balancer serves application instances in zones A and B. The RDS Multi-AZ DB instance primary is in A and its synchronous standby is in B. In this deployment type, the standby does not serve reads. Application Auto Scaling spans both zones. RDS failover promotes the standby and updates its endpoint; applications must reconnect. Surviving capacity must meet demand. Backups remain necessary for accidental deletion.","es":"Un balanceador atiende instancias de aplicación en las zonas A y B. La instancia primaria RDS Multi-AZ está en A y su copia en espera síncrona en B. En este tipo de despliegue, la copia no sirve lecturas. Auto Scaling abarca ambas zonas para la aplicación. RDS promueve la copia y actualiza el endpoint durante el failover; las aplicaciones deben reconectar. La capacidad restante debe atender la demanda. Siguen haciendo falta backups para borrados a
