la de contadores con clave por país y mes si la propia aplicación necesita la cifra."},"related":["data-nosql-key-value","data-warehousing"],"sources":[{"label":"Apache Cassandra architecture overview","url":"https://cassandra.apache.org/doc/latest/cassandra/architecture/overview.html"},{"label":"Apache Cassandra CQL: Data definition","url":"https://cassandra.apache.org/doc/latest/cassandra/developing/cql/ddl.html"},{"url":"https://aws.amazon.com/nosql/","label":"aws.amazon.com: nosql"}],"level":"applied","learning":{"definition":{"en":"Wide-column covers several designs. In Cassandra-style engines, rows are partitioned by a partition key and ordered within a partition by clustering columns; the table schema is declared in CQL, so columns are defined, not invented per row.","es":"Columna ancha abarca varios diseños. En motores estilo Cassandra, las filas se particionan por una clave de partición y se ordenan dentro de la partición por columnas de agrupamiento; el esquema se declara en CQL, así que las columnas están definidas, no se inventan por fila."},"simple":{"en":"Rows are grouped by a key you choose and kept in a defined order inside the group, so reading a range for one key is efficient.","es":"Las filas se agrupan por una clave que eliges y quedan en un orden definido dentro del grupo, así que leer un rango de una clave es eficiente."},"analogy":{"en":"One filing drawer per device, papers filed newest first. The limit: the drawer suggests you may add any field freely, but CQL requires the column to exist in the table definition, and a range read still touches several storage files.","es":"Un cajón por dispositivo, con los papeles del más nuevo al más viejo. El límite: sugiere que puedes agregar cualquier campo, pero CQL exige que la columna exista en la tabla, y una lectura por rango toca varios archivos de almacenamiento."},"walkthrough":{"en":["Concept. You choose the partition key to group related rows and the clustering columns to order them, and the query decides both. Reads targeting one partition and a contiguous range of clustering values are the efficient case; reads spanning partitions are not, since they reach many nodes.","Schema. Cassandra declares tables with CREATE TABLE in CQL, listing columns, partition key and clustering columns. Flexibility comes from sparse storage, altering the schema, and collection types, not from arbitrary new columns per row. Consistency is tunable per query.","Products. Apache Cassandra is the reference engine, with peer-to-peer replication where every node accepts writes. Amazon Keyspaces is a managed Cassandra-compatible service, ScyllaDB a compatible reimplementation, and HBase and Bigtable related designs.","Keep the distinction straight: wide-column is not the columnar storage of Redshift, Parquet or ClickHouse, which store each column separately to scan and aggregate across many rows. Modelling steps: one table per access pattern, duplicate data deliberately, and watch partition size, since too few distinct partition key values let partitions grow until reads degrade."],"es":["Concepto. Eliges la clave de partición para agrupar filas relacionadas y las columnas de agrupamiento para ordenarlas, y la consulta decide ambas. Las lecturas que apuntan a una partición y a un rango contiguo son el caso eficiente; las que abarcan particiones no, porque alcanzan muchos nodos.","Esquema. Cassandra declara tablas con CREATE TABLE en CQL, listando columnas, clave de partición y columnas de agrupamiento. La flexibilidad viene del almacenamiento disperso, de alterar el esquema y de los tipos de colección, no de columnas nuevas arbitrarias por fila. La consistencia se ajusta por consulta.","Productos. Apache Cassandra es el motor de referencia, con replicación entre pares donde todos los nodos aceptan escrituras. Amazon Keyspaces es un servicio administrado compatible, ScyllaDB una reimplementación compatible, y HBase y Bigtable diseños relacionados.","Mantén clara la distinción: columna ancha no es el almacenamiento columnar de Redshift, Parquet o ClickHouse, que guardan cada columna aparte para escanear y agregar entre muchas filas. Pasos de modelado: una tabla por patrón de acceso, duplicar datos a propósito, y vigilar el tamaño de partición, ya que pocos valores distintos de clave la hacen crecer hasta degradar las lecturas."]},"pitfalls":{"en":["Running a cross-partition aggregate, often with ALLOW FILTERING, on the cluster that serves live traffic. It fans out across nodes and competes with the latency you care about.","Picking a low-cardinality partition key. Partitions grow without bound, which hurts compaction and reads even though the CQL schema looks correct."],"es":["Ejecutar un agregado entre particiones, a menudo con ALLOW FILTERING, en el cluster que atiende tráfico en vivo. Compite con la latencia que te importa.","Elegir una clave de partición de baja cardinalidad. Las particiones crecen sin cota, lo que daña la compactación y las lecturas aunque el esquema CQL parezca correcto."]},"sourceUrls":[{"url":"https://cassandra.apache.org/doc/latest/cassandra/developing/cql/ddl.html","label":"cassandra.apache.org: ddl"},{"url":"https://cassandra.apache.org/doc/latest/cassandra/architecture/overview.html","label":"cassandra.apache.org: overview"},{"url":"https://aws.amazon.com/nosql/","label":"aws.amazon.com: nosql"}]}},{"id":"data-nosql-graph","parent":"data-nosql","title":{"en":"Graph Databases","es":"Bases de datos de grafos"},"summary":{"en":"Relationships stored as records so traversals are expressed directly, with bounds and predicates to keep them affordable.","es":"Relaciones guardadas como registros para expresar recorridos directamente, con cotas y predicados para que sigan siendo asequibles."},"details":{"en":["A property graph holds nodes, typed and directed relationships between them, and properties on either. Because a relationship is a stored record, a traversal is expressed directly and steps to a neighbour without matching keys, which suits fraud rings, identity resolution and dependency topology. Query languages differ: Cypher and openCypher, Gremlin, and SPARQL for RDF, and Neptune supports property graphs plus RDF.","Performance is not automatic. Neo4j documents that variable-length and quantified path patterns can match very large numbers of paths, with execution time growing exponentially as the graph grows, so bound the depth and add inline predicates. Supernodes with very high degree are the other cost. Pitfall: choosing graph because the diagram has arrows; for one or two hops, indexed relational joins are usually simpler to operate."],"es":["Un grafo de propiedades contiene nodos, relaciones tipadas y dirigidas entre ellos, y propiedades en cualquiera de los dos. Como una relación es un registro almacenado, un recorrido se expresa directamente y pasa a un vecino sin emparejar claves, lo que sirve para redes de fraude, resolución de identidad y topología de dependencias. Los lenguajes de consulta difieren: Cypher y openCypher, Gremlin, y SPARQL para RDF, y Neptune admite grafos de propiedades más RDF.","El rendimiento no es automático. Neo4j documenta que los patrones de camino de longitud variable y cuantificados pueden coincidir con cantidades enormes de caminos, con un tiempo de ejecución que crece exponencialmente al crecer el grafo, así que acota la profundidad y agrega predicados en línea. Los supernodos de grado muy alto son el otro coste. Error común: elegir grafo porque el diagrama tiene flechas; para uno o dos saltos, los joins relacionales indexados suelen ser más simples de operar."]},"aws":{"en":"Amazon Neptune is the managed graph service, with property graphs via Gremlin and openCypher and RDF via SPARQL; Neptune Analytics runs graph algorithms over a loaded snapshot.","es":"Amazon Neptune es el servicio administrado de grafos, con grafos de propiedades vía Gremlin y openCypher y RDF vía SPARQL; Neptune Analytics ejecuta algoritmos de grafo sobre una instantánea cargada."},"question":{"en":"A fraud team needs accounts linked through shared devices, addresses and payment methods at varying depth. What do you propose, and what do you watch?","es":"Un equipo de fraude necesita cuentas vinculadas por dispositivos, direcciones y métodos de pago compartidos a profundidad variable. ¿Qué propones y qué vigilas?"},"answer":{"en":"Step 1: check the shape of the work first. If almost every question is one or two hops, fix the indexes and stay relational, since a new engine is real operational cost. Step 2: if depth genuinely varies, model accounts, devices, addresses and instruments as nodes with typed relationships and query with openCypher in Neptune or Neo4j, loading the graph from the change stream of the transactional system of record. Step 3: bound the traversal. Set an upper depth, add inline predicates, and handle supernodes explicitly, because path enumeration can grow exponentially with graph size. Return the matched path as evidence so analysts can audit it.","es":"Paso 1: revisa primero la forma del trabajo. Si casi toda pregunta es de uno o dos saltos, corrige los índices y quédate en relacional, ya que un motor nuevo es coste operativo real. Paso 2: si la profundidad varía de verdad, modela cuentas, dispositivos, direcciones e instrumentos como nodos con relaciones tipadas y consulta con openCypher en Neptune o Neo4j, cargando el grafo desde el flujo de cambios del sistema transaccional de registro. Paso 3: acota el recorrido. Fija una profundidad máxima, agrega predicados en línea y trata los supernodos de forma explícita, porque la enumeración de caminos puede crecer exponencialmente con el tamaño del grafo. Devuelve el camino encontrado como evidencia para que los analistas puedan auditarlo."},"related":["data-sql","data-nosql-document"],"sources":[{"label":"Neo4j graph database concepts","url":"https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/"},{"label":"Neo4j Cypher: Variable-length patterns","url":"https://neo4j.com/docs/cypher-manual/current/patterns/variable-length-patterns/"},{"label":"Amazon Neptune overview","url":"https://docs.aws.amazon.com/neptune/latest/userguide/intro.html"}],"level":"applied","learning":{"definition":{"en":"Graph databases store connections as data. The property graph model uses nodes, typed and directed relationships, and properties; RDF instead stores subject-predicate-object triples. Either way a traversal is expressed directly rather than reconstructed by matching keys.","es":"Las bases de grafos guardan las conexiones como datos. El modelo de grafo de propiedades usa nodos, relaciones tipadas y dirigidas, y propiedades; RDF en cambio guarda tripletas sujeto-predicado-objeto. En ambos casos un recorrido se expresa directamente en vez de reconstruirse emparejando claves."},"simple":{"en":"The connections are data, not something inferred at query time, so questions about how things are linked read the way you would describe them.","es":"Las conexiones son datos, no algo deducido al consultar, así que las preguntas sobre vínculos se leen como las describirías."},"analogy":{"en":"A city map where roads are drawn, so you follow them rather than deducing them from addresses. The limit: on a map any route is free to trace, while in a graph matching paths can explode as depth and node degree grow.","es":"Un mapa donde las calles están dibujadas, así que las sigues en vez de deducirlas. El límite: en un mapa cualquier ruta es gratis de trazar, mientras en un grafo los caminos coincidentes pueden explotar al crecer la profundidad y el grado."},"walkthrough":{"en":["Concept. The property graph model is nodes, relationships and properties. A relationship connects a source and a target node, has one type and a direction, and may carry properties. Engines that store adjacency natively, Neo4j among them, step to a neighbour without an index lookup per hop; other implementations differ.","Cost. Expressive is not cheap. Neo4j documents that variable-length and quantified path patterns can match very large numbers of paths, with execution time growing exponentially as the graph grows, and recommends an upper bound plus inline predicates to prune. Supernodes of high degree are the other cost driver. The relational comparison is not simply one join per hop: recursive CTEs exist and performance depends on implementation.","Products and languages. Neo4j uses Cypher and openCypher, Apache TinkerPop uses Gremlin, RDF graphs use SPARQL. Amazon Neptune supports property graphs via Gremlin and openCypher and RDF via SPARQL, so model and language affect portability. Neptune Analytics runs graph algorithms over a snapshot.","Practical steps: check whether traversals really vary in depth, since one or two hops are served well by indexed relational joins; model entities as nodes and links as typed relationships; bound depth and add predicates."],"es":["Concepto. El modelo de grafo de propiedades son nodos, relaciones y propiedades. Una relación conecta un nodo origen y uno destino, tiene un tipo y una dirección, y puede llevar propiedades. Los motores que almacenan la adyacencia de forma nativa, Neo4j entre ellos, pasan a un vecino sin búsqueda en índice por salto; otras implementaciones difieren.","Coste. Expresivo no es barato. Neo4j documenta que los patrones de camino de longitud variable y cuantificados pueden coincidir con cantidades enormes de caminos, con tiempo de ejecución que crece exponencialmente al crecer el grafo, y recomienda una cota superior y predicados en línea para podar. Los supernodos de grado alto son el otro factor. La comparación con relacional no es un join por salto: existen las CTE recursivas y el rendimiento depende de la implementación.","Productos y lenguajes. Neo4j usa Cypher y openCypher, Apache TinkerPop usa Gremlin, los grafos RDF usan SPARQL. Amazon Neptune admite grafos de propiedades vía Gremlin y openCypher y RDF vía SPARQL, así que modelo y lenguaje afectan la portabilidad. Neptune Analytics ejecuta algoritmos sobre una instantánea.","Pasos prácticos: comprueba si los recorridos varían de verdad en profundidad, ya que uno o dos saltos se atienden bien con joins relacionales indexados; modela entidades como nodos y vínculos como relaciones tipadas; acota la profundidad y agrega predicados."]},"pitfalls":{"en":["Writing an unbounded variable-length pattern. Path enumeration can grow exponentially with graph size; set an upper bound and add predicates.","Adopting a graph engine because the domain diagram has arrows. Foreign keys already serve one-hop questions, and a second engine is real operational cost."],"es":["Escribir un patrón de longitud variable sin cota. La enumeración de caminos puede crecer exponencialmente con el tamaño del grafo; fija una cota y agrega predicados.","Adoptar un motor de grafos porque el diagrama tiene flechas. Las claves ajenas ya atienden las preguntas de un salto, y un segundo motor cuesta operarlo."]},"sourceUrls":[{"url":"https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/","label":"neo4j.com: graphdb concepts"},{"url":"https://neo4j.com/docs/cypher-manual/current/patterns/variable-length-patterns/","label":"neo4j.com: variable length patterns"},{"url":"https://docs.aws.amazon.com/neptune/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}]}},{"id":"data-dynamodb","parent":"data-nosql","title":{"en":"Amazon DynamoDB","es":"Amazon DynamoDB"},"summary":{"en":"A managed serverless key-value and document database: why it suits operational workloads, and the key, index and consistency rules you design around.","es":"Base administrada sin servidores, clave-valor y documento: por qué encaja en cargas operativas, y las reglas de clave, índice y consistencia con las que diseñas."},"details":{"en":["DynamoDB is a serverless, fully managed NoSQL database supporting key-value and document models, designed for low-latency operational access when key distribution, capacity and item sizes suit the workload. The appeal is operational: no instances to size or patch, no maintenance windows, and on-demand capacity that scales with traffic and charges no request cost while idle, though storage is still billed. It suits operational workloads with known access patterns such as carts, sessions, profiles and order lookups, and it is a poor fit for ad hoc analytics.","The design surface is the primary key: a partition key alone, or a partition key plus a sort key that stores related items together in sort-key order, making range queries the main tool. Secondary indexes add access patterns, but reads from a global secondary index are eventually consistent, while table reads can request strong consistency. There is no JOIN, so you denormalise deliberately."],"es":["DynamoDB es una base NoSQL sin servidores y totalmente administrada que admite modelos clave-valor y de documento, diseñada para acceso operativo de baja latencia cuando la distribución de claves, la capacidad y el tamaño de los elementos encajan con la carga. El atractivo es operativo: sin instancias que dimensionar o parchear, sin ventanas de mantenimiento, y capacidad on-demand que escala con el tráfico y no cobra coste por petición mientras está inactiva, aunque el almacenamiento sí se factura. Encaja en cargas operativas con patrones de acceso conocidos como carritos, sesiones, perfiles y búsquedas de pedidos, y encaja mal para analítica ad hoc.","La superficie de diseño es la clave primaria: una clave de partición sola, o una clave de partición más una clave de ordenamiento que guarda juntos los elementos relacionados en orden de esa clave, lo que convierte las consultas por rango en la herramienta principal. Los índices secundarios agregan patrones de acceso, pero las lecturas de un índice secundario global son eventualmente consistentes, mientras que las lecturas de la tabla pueden pedir consistencia fuerte. No hay JOIN, así que desnormalizas de forma deliberada."]},"aws":{"en":"DynamoDB Streams for change data capture into Lambda, Global Tables for multi-region replication, DAX for cached reads, point-in-time recovery and S3 export for backup and analytics. Quotas such as 400 KB per item, 5 local and a default 20 global secondary indexes per table, and 1 MB per Query page are worth checking when modelling.","es":"DynamoDB Streams para captura de cambios hacia Lambda, Global Tables para replicación multirregión, DAX para lecturas en caché, recuperación a un punto en el tiempo y exportación a S3 para respaldo y analítica. Conviene revisar cuotas como 400 KB por elemento, 5 índices secundarios locales y 20 globales por defecto por tabla, y 1 MB por página de Query al modelar."},"question":{"en":"A service writes an item then immediately reads it back through a global secondary index and sometimes gets the old value. What is happening and how do you fix it?","es":"Un servicio escribe un elemento y de inmediato lo lee por un índice secundario global, y a veces obtiene el valor anterior. ¿Qué ocurre y cómo lo corriges?"},"answer":{"en":"Step 1: read it as documented behaviour, not a race in the code: a global secondary index is maintained asynchronously after the base table write, all reads from a GSI are eventually consistent, and a GSI offers no strongly consistent read option. Step 2: confirm by reading the same item from the base table with ConsistentRead set to true; if the base table shows the new value and the index does not, propagation lag is the explanation. Step 3: fix the read path instead of retrying blindly. Read back from the base table by primary key when the caller needs read-after-write, keep the index for reads that tolerate lag, and drive follow-up work from DynamoDB Streams rather than polling.","es":"Paso 1: léelo como comportamiento documentado y no como una carrera en el código: un índice secundario global se mantiene de forma asíncrona después de la escritura en la tabla base, todas las lecturas de un GSI son eventualmente consistentes, y un GSI no ofrece opción de lectura fuertemente consistente. Paso 2: confirma leyendo el mismo elemento desde la tabla base con ConsistentRead en true; si la tabla base muestra el valor nuevo y el índice no, el retraso de propagación es la explicación. Paso 3: corrige la ruta de lectura en vez de reintentar a ciegas. Lee de vuelta desde la tabla base por clave primaria cuando quien llama necesita lectura tras escritura, reserva el índice para lecturas que toleran retraso, y dispara el trabajo posterior desde DynamoDB Streams en lugar de sondear."},"related":["data-consistency","data-nosql-document","data-caching"],"sources":[{"label":"What is Amazon DynamoDB?","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html"},{"label":"DynamoDB read consistency","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html"},{"label":"DynamoDB service quotas","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html"}],"level":"applied","learning":{"definition":{"en":"Amazon DynamoDB is a serverless, fully managed NoSQL database supporting key-value and document models. It is designed for low-latency operational access, with performance depending on key distribution, capacity, item size and the operations used.","es":"Amazon DynamoDB es una base NoSQL sin servidores y totalmente gestionada que admite modelos clave-valor y documento. Está diseñada para acceso operativo de baja latencia, cuyo rendimiento depende de la distribución de claves, la capacidad, el tamaño de los elementos y las operaciones usadas."},"simple":{"en":"You create a table, define the key, and read and write items. There are no servers to provision or patch, though you still choose a capacity mode and design the keys around the reads you need.","es":"Creas una tabla, defines la clave, y lees y escribes elementos. No hay servidores que aprovisionar ni parchear, aunque sigues eligiendo un modo de capacidad y diseñando las claves según las lecturas que necesitas."},"analogy":{"en":"A left-luggage counter that grows or shrinks its shelves with demand; you collect by ticket. The limit: with on-demand capacity you pay no request cost while idle, but stored items are still billed.","es":"Una consigna que aumenta o reduce sus estantes según la demanda; recoges por ticket. El límite: con on-demand no pagas por petición mientras está inactiva, pero los elementos guardados sí se facturan."},"walkthrough":{"en":["Why it is useful. The value is operational: no instances to size, patch or fail over, no maintenance windows, and on-demand capacity that scales with traffic. That suits operational workloads with known access patterns: carts, sessions, profiles, device state, order lookups. It is a poor fit for ad hoc analytics.","Keys. The primary key is a partition key alone, or a partition key plus a sort key. With both, items sharing a partition key are stored together in sort-key order, making range queries the main tool. Pick a high-cardinality partition key so traffic spreads, and encode the read you need into the sort key.","Indexes and consistency. A global secondary index gives an alternative partition and sort key; a local one an alternative sort key under the same partition key. GSI reads are eventually consistent, since the index updates asynchronously after the base table write, while table reads can request strong consistency with ConsistentRead. There is no JOIN.","Then check quotas against the model: 400 KB per item, 5 local and by default 20 global secondary indexes per table, 1 MB per Query page, which makes pagination part of correct code. Streams trigger follow-up work from committed changes; Global Tables cover multi-region."],"es":["Por qué es útil. El valor es operativo: sin instancias que dimensionar, parchear o conmutar, sin ventanas de mantenimiento, y capacidad on-demand que escala con el tráfico. Encaja en cargas operativas con patrones conocidos: carritos, sesiones, perfiles, estado de dispositivos, búsquedas de pedidos. Encaja mal para analítica ad hoc.","Claves. La clave primaria es una clave de partición sola, o una de partición más una de ordenamiento. Con ambas, los elementos que comparten clave de partición se guardan juntos en orden de la clave de ordenamiento, lo que hace de las consultas por rango la herramienta principal. Elige una clave de partición de alta cardinalidad y codifica en la de ordenamiento la lectura que necesitas.","Índices y consistencia. Un índice secundario global da clave de partición y de ordenamiento alternativas; uno local, una de ordenamiento alternativa bajo la misma clave de partición. Las lecturas de un GSI son eventualmente consistentes, ya que el índice se actualiza de forma asíncrona tras la escritura en la tabla base, mientras que las de la tabla pueden pedir consistencia fuerte con ConsistentRead.","Luego compara las cuotas con el modelo: 400 KB por elemento, 5 índices secundarios locales y 20 globales por defecto por tabla, 1 MB por página de Query, lo que hace de la paginación parte del código correcto. Streams dispara trabajo posterior desde cambios confirmados; Global Tables cubre multirregión."]},"pitfalls":{"en":["Reading back through a global secondary index right after a write and expecting the new value. GSI reads are eventually consistent; read the base table when you need read-after-write.","Choosing a low-cardinality partition key such as order status. Traffic concentrates on few partitions and throttles, and a GSI reusing that attribute has the same problem."],"es":["Leer por un índice secundario global justo después de escribir y esperar el valor nuevo. Las lecturas de un GSI son eventualmente consistentes; lee la tabla base si necesitas lectura tras escritura.","Elegir una clave de partición de baja cardinalidad como el estado del pedido. El tráfico se concentra en pocas particiones y se limita, y un GSI que reutilice ese atributo tiene el mismo problema."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html","label":"docs.aws.amazon.com: Introduction"},{"url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html","label":"docs.aws.amazon.com: HowItWorks.ReadConsistency"},{"url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html","label":"docs.aws.amazon.com: ServiceQuotas"}]}},{"id":"data-caching","parent":"data","title":{"en":"Caching Strategies","es":"Estrategias de caché"},"summary":{"en":"Reuse a faster copy of data while controlling freshness, invalidation and failure behavior.","es":"Reutiliza una copia más rápida de los datos controlando su vigencia, invalidación y comportamiento ante fallos."},"details":{"en":["Cache-aside (lazy loading) reads from cache first, falls back to the database on a miss, and populates the cache for next time, so only requested data is cached. It survives a cache outage only if the database can absorb the full read load: when the cache is unavailable, or after a mass eviction or restart, every read goes to the database at once, so size for that miss storm and add request coalescing or jitter on TTLs. Write-through updates the cache as part of every database write, which keeps entries close to the last write but is not a freshness guarantee: the cache and the database are separate systems, so concurrent writers can apply in different orders in each, and a failed cache write leaves a stale entry behind. It also caches data that may never be read. ElastiCache engines (Valkey or Redis OSS) also support pub/sub, sorted sets and other structures beyond simple key-value, useful for leaderboards, rate limiting and session stores.","Pitfall: caching without a TTL or invalidation strategy on data that changes causes stale reads that are hard to reproduce, since the bug only appears for keys that happen to still be cached. Also note the cache write and the database write are two separate systems, ElastiCache and RDS/DynamoDB do not share a transaction, so invalidate or update the cache only AFTER the database commit succeeds, and use a versioned value or an outbox pattern if you need reliable delivery of the invalidation even across failures, rather than assuming both writes happen together."],"es":["Caché-aside (carga perezosa) lee primero de la caché, recurre a la base de datos en caso de fallo (miss) y llena la caché para la próxima vez, así que solo se cachea lo que se pide. Sobrevive a una caída de la caché únicamente si la base de datos puede absorber toda la carga de lectura: cuando la caché no está disponible, o tras un desalojo masivo o un reinicio, todas las lecturas van a la base de datos a la vez, así que dimensiona para esa tormenta de misses y añade coalescencia de peticiones o jitter en los TTL. Write-through actualiza la caché como parte de cada escritura en la base de datos, lo que mantiene las entradas cerca de la última escritura pero no es una garantía de frescura: la caché y la base de datos son sistemas separados, escritores concurrentes pueden aplicarse en distinto orden en cada uno y una escritura fallida en la caché deja una entrada desactualizada. Además cachea datos que quizá nunca se lean. Los motores de ElastiCache (Valkey o Redis OSS) también soportan pub/sub, sorted sets y otras estructuras más allá de clave-valor simple, útiles para tablas de clasificación, limitación de tasa y almacenes de sesión.","Error común: cachear sin una estrategia de TTL o invalidacion en datos que cambian causa lecturas desactualizadas difíciles de reproducir, ya que el error solo aparece para claves que resultan seguir en caché. Además, la escritura de caché y la escritura de base de datos son dos sistemas separados, ElastiCache y RDS/DynamoDB no comparten una transacción, así que invalida o actualiza la caché solo Después de que la escritura a la base de datos se confirme con éxito, y usa un valor versionado o un patrón outbox si necesitas entrega confiable de la invalidacion incluso ante fallas, en vez de asumir que ambas escrituras ocurren juntas."]},"aws":{"en":"ElastiCache (Valkey, Redis OSS or Memcached) in front of RDS/DynamoDB; DAX as a DynamoDB-native in-memory cache for microsecond cached reads.","es":"ElastiCache (Valkey, Redis OSS o Memcached) delante de RDS/DynamoDB; DAX como caché en memoria nativa de DynamoDB para lecturas cacheadas en microsegundos."},"question":{"en":"Users occasionally see outdated prices on a product page even after an admin updates them. What is the likely cause and fix?","es":"Los usuarios ven datos antiguos después de una actualización. ¿Cómo comprobarías la caché y mejorarías la invalidación?"},"answer":{"en":"Step 1: identify the site is likely using cache-aside without active invalidation, so the stale cache entry stays alive until its TTL expires. Step 2: confirm by checking the configured TTL against how long the problem persists after an update. Step 3: fix by invalidating or updating the cache key immediately after the database write commits successfully, not as part of the same transaction since ElastiCache and the database are separate systems; for stronger reliability against a crash between the two steps, add a version number to the cached value or write the invalidation through an outbox pattern.","es":"Paso 1: identifica que el sitio probablemente usa caché-aside sin invalidacion activa, así que la entrada antigua de caché sigue viva hasta que expira su TTL. Paso 2: confirma revisando el TTL configurado contra cuanto tiempo persiste el problema tras una actualizacion. Paso 3: corrige invalidando o actualizando la clave de caché inmediatamente después de que la escritura a la base de datos se confirme con éxito, no como parte de la misma transacción ya que ElastiCache y la base de datos son sistemas separados; para mayor confiabilidad ante una falla entre ambos pasos, añade un número de versión al valor cacheado o escribe la invalidacion mediante un patrón outbox."},"related":["data-consistency","data-nosql"],"sources":[{"label":"ElastiCache best practices and caching strategies","url":"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/BestPractices.html"},{"url":"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html","label":"docs.aws.amazon.com: Strategies"},{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}],"level":"applied","learning":{"definition":{"en":"A cache keeps a copy of data close to the reader so repeated reads are cheap. It works when access is skewed, meaning a small set of items is read far more often than the rest. A cache is a copy, so it can be stale; a time to live bounds how long an entry lives, which is not the same as bounding staleness if the entry was populated from a lagging replica.","es":"Una caché guarda una copia de los datos cerca de quien lee para que las lecturas repetidas sean baratas. Funciona cuando el acceso es desigual, es decir, cuando un conjunto pequeño de elementos se lee mucho más que el resto. Una caché es una copia, así que puede estar desactualizada; un tiempo de vida acota cuánto vive una entrada, que no es lo mismo que acotar el desfase si la entrada se llenó desde una réplica atrasada."},"simple":{"en":"Keep the answers people ask for most in a fast place. It saves work when the same items are read repeatedly, and the price is that a copy may be out of date.","es":"Guarda en un lugar rápido las respuestas que más se piden. Ahorra trabajo cuando los mismos elementos se leen muchas veces, y el precio es que una copia puede estar desactualizada."},"analogy":{"en":"A shop keeps bestsellers on the counter instead of walking to the stockroom. Limit: a shopkeeper who changes a price relabels the counter item in the same trip, while a cache and a database are updated by two separate operations that are not atomic together, so a failure between them leaves a wrong price on display.","es":"Una tienda deja los más vendidos en el mostrador en vez de ir al almacén. Límite: quien cambia un precio reetiqueta el artículo del mostrador en el mismo viaje, mientras la caché y la base de datos se actualizan con dos operaciones separadas que no son atómicas entre sí, así que un fallo entre ambas deja un precio equivocado a la vista."},"walkthrough":{"en":["Check that the access pattern is skewed before adding a cache. If every request asks for a different item, the cache mostly misses and you have added a hop and a component to operate. Measure the hit ratio real traffic would give, and the load you expect to save.","Pick a population strategy. Lazy loading, which ElastiCache describes as loading data into the cache only when needed, keeps the cache small but makes the first read slow and lets a miss storm hit the database when many keys expire together. Write through updates the cache on every write, which reduces staleness at the cost of storing data that may never be read.","Then design invalidation, which is where caches actually fail. Writing to the database and to the cache are two separate operations with no shared transaction, so a crash between them leaves a stale entry. A short time to live bounds the damage, and deleting the key rather than rewriting it helps, though a concurrent stale read can repopulate it, so versioned values or careful miss handling may still be needed."],"es":["Comprueba que el acceso sea desigual antes de añadir una caché. Si cada petición pide un elemento distinto, la caché falla casi siempre y solo has añadido un salto y un componente que operar. Mide la tasa de acierto con tráfico real y la carga que esperas ahorrar.","Elige una estrategia de llenado. La carga diferida, que ElastiCache describe como cargar datos en la caché solo cuando se necesitan, mantiene la caché pequeña pero hace lenta la primera lectura y deja que una tormenta de fallos golpee la base de datos cuando muchas claves expiran juntas. La escritura directa actualiza la caché en cada escritura, lo que reduce el desfase a costa de guardar datos que quizá nunca se lean.","Después diseña la invalidación, que es donde las cachés fallan de verdad. Escribir en la base de datos y en la caché son dos operaciones separadas sin transacción común, así que una caída entre ambas deja una entrada obsoleta. Un tiempo de vida corto acota el daño, y borrar la clave en vez de reescribirla ayuda, aunque una lectura obsoleta concurrente puede volver a llenarla, así que pueden hacer falta valores con versión o un manejo cuidadoso de los fallos de caché."]},"pitfalls":{"en":["Assuming the cache and the database stay in step. The two writes are not atomic together, so plan for a stale entry: use short expiry, delete on write, and treat the database as authoritative.","Caching without an expiry or eviction plan. Unbounded entries fill memory and eviction then removes items unpredictably, so set a time to live per item class and watch the hit ratio and evictions."],"es":["Suponer que la caché y la base de datos van sincronizadas. Las dos escrituras no son atómicas entre sí, así que cuenta con una entrada obsoleta: usa expiración corta, borra al escribir y trata la base de datos como la autoridad.","Cachear sin plan de expiración ni de desalojo. Las entradas sin límite llenan la memoria y el desalojo quita elementos de forma imprevisible, así que fija un tiempo de vida por clase de elemento y vigila la tasa de acierto y los desalojos."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html","label":"docs.aws.amazon.com: Strategies"},{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}]}},{"id":"data-streaming","parent":"data","title":{"en":"Streaming Data","es":"Datos en streaming"},"summary":{"en":"Process records as they arrive, tracking ordering, consumer position and replay.","es":"Procesa registros conforme llegan, gestionando su orden, la posición del consumidor y la repetición."},"details":{"en":["Streaming platforms (Kinesis Data Streams, Amazon MSK for Kafka) ingest continuous events into ordered, partitioned, replayable logs, letting multiple independent consumers process the same stream at their own pace without coordinating with the producer. Kinesis Data Streams shards define both throughput and the ordering unit (records with the same partition key land in the same shard, preserving order within it); MSK gives full Kafka semantics for teams standardizing on that ecosystem. Kinesis Data Firehose, by contrast, is a simpler delivery pipe (stream to S3/Redshift/OpenSearch) with no custom consumer logic, not a general streaming platform."],"es":["Las plataformas de streaming (Kinesis Data Streams, Amazon MSK para Kafka) ingieren eventos continuos en registros ordenados, particionados y reproducibles, permitiendo que múltiples consumidores independientes procesen el mismo stream a su propio ritmo sin coordinarse con el productor. Los shards de Kinesis Data Streams definen tanto el throughput como la unidad de orden (los registros con la misma clave de partición van al mismo shard, preservando el orden dentro de él); MSK da semántica completa de Kafka para equipos que estandarizan en ese ecosistema. Kinesis Data Firehose, en cambio, es una tubería de entrega más simple (stream a S3/Redshift/OpenSearch) sin lógica de consumidor personalizada, no una plataforma de streaming general."]},"aws":{"en":"Kinesis Data Streams for custom real-time processing with multiple consumers; Firehose for simple delivery to storage/analytics sinks; MSK when Kafka compatibility is required.","es":"Kinesis Data Streams para procesamiento en tiempo real personalizado con múltiples consumidores; Firehose para entrega simple a almacenes/análisis; MSK cuando se requiere compatibilidad con Kafka."},"question":{"en":"A clickstream pipeline needs both a real-time fraud-detection consumer and a separate batch-loading consumer to S3. Why is Kinesis Data Streams a better fit than Firehose here?","es":"Un pipeline de clickstream necesita tanto un consumidor de detección de fraude en tiempo real como un consumidor separado de carga por lotes a S3. ¿Por qué Kinesis Data Streams es mejor opción que Firehose aquí?"},"answer":{"en":"Step 1: recognize Firehose delivers to a single configured destination without exposing the stream to custom consumer logic. Step 2: identify that two independent consumers reading the same data for different purposes and speeds are needed, which requires a replayable event log. Step 3: use Kinesis Data Streams, where each consumer maintains its own checkpoint (offset) and can read the stream at its own pace, and optionally add Firehose as a third consumer just for the simple S3 load if that managed path is still wanted.","es":"Paso 1: reconoce que Firehose entrega a un único destino configurado sin exponer el stream a lógica de consumidor personalizada. Paso 2: identifica que se necesitan dos consumidores independientes leyendo el mismo dato con diferentes propósitos y velocidades, lo cual requiere un log de eventos reproducible. Paso 3: usa Kinesis Data Streams, donde cada consumidor mantiene su propio checkpoint (offset) y puede leer el stream a su ritmo, y opcionalmente añade Firehose como un tercer consumidor solo para la carga simple a S3 si aún se desea esa ruta administrada."},"related":["data-consistency","cloud-distributed-systems"],"sources":[{"label":"Amazon Kinesis Data Streams - Key Concepts","url":"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"}],"level":"applied","learning":{"definition":{"en":"A stream is an append only log of records that consumers read by position. The log is split into partitions, called shards in Kinesis Data Streams, which are the unit of parallelism and of ordering: records are ordered within a partition, not across the stream. Records are retained for a period, so consumers can re read.","es":"Un flujo es un registro de solo adición donde los consumidores leen por posición. El registro se divide en particiones, llamadas shards en Kinesis Data Streams, que son la unidad de paralelismo y de orden: los registros están ordenados dentro de una partición, no en todo el flujo. Los registros se retienen un periodo, así que los consumidores pueden releer."},"simple":{"en":"A stream is a running list of events. Consumers keep a bookmark and read forward, and because events are kept for a while, a consumer can go back and read again.","es":"Un flujo es una lista continua de eventos. Los consumidores guardan un marcador y leen hacia adelante, y como los eventos se conservan un tiempo, un consumidor puede volver atrás y leerlos de nuevo."},"analogy":{"en":"A newspaper archive: each reader keeps their own bookmark and nobody's reading removes an issue. Limit: an archive has one shelf in date order, while a stream orders records only within a partition, so events for different keys can be processed out of real world order unless they share a partition key.","es":"Un archivo de periódicos: cada lector guarda su propio marcador y la lectura de nadie retira un ejemplar. Límite: un archivo tiene un estante en orden de fecha, mientras un flujo ordena registros solo dentro de una partición, así que eventos de claves distintas pueden procesarse fuera del orden real salvo que compartan clave de partición."},"walkthrough":{"en":["Choose the partition key first, because it determines both ordering and load balance. All records with the same key land in one partition and keep their order, which is what you want for one account's events, but a key with a few very busy values creates a hot partition that limits the whole stream.","Then decide how a consumer tracks progress. A consumer records its position, so if it fails it restarts from the last recorded one and may reprocess records it already handled. That means at least once processing, and idempotent handling or a conditional write is what prevents a duplicate from changing the result.","Then contrast with batch, and pick per use. Streaming gives low latency at the cost of handling late arriving events and windowing decisions; batch reprocessing of the same retained data gives accurate history. Many systems run both, serving live dashboards from the stream and recomputing corrected figures in batch."],"es":["Elige primero la clave de partición, porque determina el orden y el reparto de carga. Todos los registros con la misma clave caen en una partición y conservan su orden, que es lo que quieres para los eventos de una cuenta, pero una clave con unos pocos valores muy activos crea una partición caliente que limita todo el flujo.","Después decide cómo un consumidor sigue su avance. Un consumidor registra su posición, así que si falla reinicia desde la última registrada y puede reprocesar registros que ya atendió. Eso significa procesamiento al menos una vez, y un manejo idempotente o una escritura condicional es lo que evita que un duplicado cambie el resultado.","Luego contrasta con el procesamiento por lotes y elige según el caso. El flujo da baja latencia a cambio de manejar eventos que llegan tarde y decisiones de ventana; reprocesar por lotes los mismos datos retenidos da un histórico exacto. Muchos sistemas hacen ambos, sirviendo paneles en vivo desde el flujo y recalculando cifras corregidas por lotes."]},"pitfalls":{"en":["Expecting total ordering across a stream. Ordering holds within a partition only, so events that must be ordered relative to each other need the same partition key, which also concentrates their load.","Claiming exactly once processing from the stream itself. Consumers can restart and reprocess after a failure, so end results are made correct by idempotent writes or deduplication in the consumer."],"es":["Esperar un orden total en todo el flujo. El orden se mantiene solo dentro de una partición, así que los eventos que deben ordenarse entre sí necesitan la misma clave de partición, lo que también concentra su carga.","Atribuir al flujo un procesamiento exactamente una vez. Los consumidores pueden reiniciar y reprocesar tras un fallo, así que el resultado final se corrige con escrituras idempotentes o deduplicación en el consumidor."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html","label":"docs.aws.amazon.com: key concepts"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"}]}},{"id":"data-consistency","parent":"data","title":{"en":"Consistency Models","es":"Modelos de consistencia"},"summary":{"en":"Understand what a read may return after a write and what changes during a network partition.","es":"Entiende qué puede devolver una lectura tras una escritura y qué cambia durante una partición de red."},"details":{"en":["Strong consistency has a precise operation-order meaning; eventual consistency allows temporarily stale replicas and convergence under its stated assumptions. DynamoDB supports strongly consistent reads for tables and local secondary indexes, not global secondary indexes. Global Tables offer different consistency modes with distinct regional and feature constraints, so check the selected mode. CAP concerns behavior during a network partition: linearizable consistency and availability for every request cannot both be guaranteed across the separated system. Outside partitions, latency and coordination trade-offs still exist."],"es":["La consistencia fuerte tiene un significado preciso sobre orden de operaciones; la eventual permite réplicas desactualizadas y convergencia bajo sus supuestos. DynamoDB admite lecturas fuertes en tablas e índices secundarios locales, no en globales. Global Tables ofrece modos distintos con restricciones de región y funciones: revisa el elegido. CAP se refiere a particiones de red: no se puede garantizar simultáneamente consistencia linealizable y disponibilidad para toda solicitud en el sistema separado. Fuera de particiones siguen existiendo costes de coordinación y latencia."]},"aws":{"en":"DynamoDB can provide strongly consistent reads on a table or local secondary index, but not on a global secondary index. S3 provides strong consistency for object reads and listing after successful object writes or deletes; do not extend that statement to every bucket configuration change. For relational replicas, check the selected deployment and reader lag: durable replication is not automatically a promise of fresh reads from every replica.","es":"DynamoDB admite lecturas fuertemente consistentes en tablas e índices secundarios locales, pero no en índices secundarios globales. S3 ofrece consistencia fuerte en lecturas y listados tras escrituras o borrados de objetos confirmados; no extiendas esa afirmación a cada cambio de configuración del bucket. En réplicas relacionales, revisa el despliegue y el retraso de lectura: la replicación duradera no implica automáticamente lecturas recientes en todas las réplicas."},"question":{"en":"A candidate says CAP theorem means you must always sacrifice either consistency or availability in a distributed database. What is the correction?","es":"Un candidato afirma que CAP exige sacrificar siempre consistencia o disponibilidad. ¿Cómo matizarías esa afirmación?"},"answer":{"en":"Step 1: clarify CAP only applies DURING an actual network partition, not as a permanent tradeoff during normal operation. Step 2: give a counterexample: S3 offers strong read-after-write consistency and high availability simultaneously in the normal case. Step 3: explain the real design decision is choosing what to do specifically during a partition (reject writes to preserve consistency, or accept them and reconcile later to preserve availability), not a permanent global choice between C and A.","es":"Paso 1: precisa que CAP solo aplica DURANTE una partición de red real, no como una compensación permanente en operación normal. Paso 2: da un contraejemplo: S3 ofrece consistencia fuerte de lectura tras escritura y alta disponibilidad simultáneamente en el caso normal. Paso 3: explica que el diseño real consiste en elegir qué hacer específicamente durante una partición (rechazar escrituras para mantener consistencia, o aceptarlas y reconciliar después para mantener disponibilidad), no una elección global permanente entre C y A."},"related":["data-nosql","data-sql","cloud-distributed-systems"],"sources":[{"label":"Amazon S3 data consistency model","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"label":"DynamoDB read consistency","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html","label":"docs.aws.amazon.com: Aurora.Replication"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"}],"level":"deep","learning":{"definition":{"en":"Consistency describes what a reader is guaranteed to see after a write. Strong consistency means a successful write is visible to the next read. Eventual consistency means replicas converge after some delay, so a read may return an earlier value. Replication lag is the size of that window.","es":"La consistencia describe qué se garantiza que verá quien lee después de una escritura. La consistencia fuerte significa que una escritura exitosa es visible en la siguiente lectura. La consistencia eventual significa que las réplicas convergen tras algún retraso, así que una lectura puede devolver un valor anterior. El retraso de replicación es el tamaño de esa ventana."},"simple":{"en":"After you save something, can you be sure the next read shows it? With strong consistency yes. With eventual consistency, usually yes but sometimes you see the old value for a moment.","es":"Después de guardar algo, ¿puedes estar seguro de que la siguiente lectura lo muestra? Con consistencia fuerte sí. Con consistencia eventual normalmente sí, pero a veces ves el valor anterior por un momento."},"analogy":{"en":"Updating a noticeboard at head office and waiting for branch offices to receive the new copy. Limit: a branch can telephone head office to check, while a client reading a replica usually cannot tell whether it is behind, so applications either route critical reads to the primary or carry a version they can compare.","es":"Actualizar un tablón en la oficina central y esperar que las sucursales reciban la copia nueva. Límite: una sucursal puede llamar a la central para comprobar, mientras un cliente que lee una réplica no suele poder saber si está atrasada, así que las aplicaciones o dirigen las lecturas críticas al primario o llevan una versión que puedan comparar."},"walkthrough":{"en":["Start from the user visible requirement. A customer who updates a profile and immediately reloads it expects to see the change, so that read should go to the primary or be served from the write. An analytics panel refreshed hourly can read a lagging replica without anyone noticing.","Then find where lag enters your design. Asynchronous replicas, caches, search indexes and warehouse loads all lag by different amounts, and each hop adds its own. Aurora documents replica lag that is usually well under a hundred milliseconds but that grows with write rate, so lag must be monitored, not assumed.","Read each service's own statement rather than a general rule. Amazon S3 provides strong read after write consistency for object writes and deletes in all Regions, while some bucket level configuration changes are eventually consistent. A service can therefore be strongly consistent for data and eventually consistent for its own settings."],"es":["Parte del requisito visible para el usuario. Un cliente que actualiza su perfil y lo recarga de inmediato espera ver el cambio, así que esa lectura debe ir al primario o servirse de la propia escritura. Un panel analítico que se refresca cada hora puede leer una réplica atrasada sin que nadie lo note.","Después localiza dónde entra el retraso en tu diseño. Las réplicas asíncronas, las cachés, los índices de búsqueda y las cargas analíticas van con retrasos distintos, y cada salto añade el suyo. Aurora documenta un retraso de réplica que suele estar bien por debajo de cien milisegundos pero crece con la tasa de escritura, así que el retraso se vigila, no se supone.","Lee la declaración de cada servicio en vez de aplicar una regla general. Amazon S3 ofrece consistencia fuerte de lectura tras escritura para escrituras y borrados de objetos en todas las Regiones, mientras algunos cambios de configuración a nivel de bucket son eventualmente consistentes. Un servicio puede ser entonces fuertemente consistente para los datos y eventualmente consistente para sus propios ajustes."]},"pitfalls":{"en":["Reading from a replica right after writing. The write may not have arrived, so the user sees their own change missing; route read after write paths to the primary or return the value you just wrote.","Describing a whole platform as eventually consistent. Guarantees are per operation and per service, so check the specific documented behaviour for the operation you depend on."],"es":["Leer de una réplica justo después de escribir. La escritura puede no haber llegado, así que el usuario ve que falta su propio cambio; dirige esas rutas al primario o devuelve el valor que acabas de escribir.","Describir una plataforma entera como eventualmente consistente. Las garantías son por operación y por servicio, así que revisa el comportamiento documentado concreto de la operación de la que dependes."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html","label":"docs.aws.amazon.com: Aurora.Replication"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"}]}},{"id":"data-warehousing","parent":"data","title":{"en":"Data Warehousing and Analytics","es":"Almacenamiento de datos analíticos"},"summary":{"en":"Organize data for analytical queries across many records, rather than individual transactions.","es":"Organiza datos para consultas analíticas sobre muchos registros, en lugar de transacciones individuales."},"details":{"en":["Transactional databases (OLTP) store rows together to make single-record reads/writes fast; analytical workloads (OLAP) typically scan and aggregate a few columns across millions of rows, which is what columnar storage optimizes for, reading only the needed columns instead of whole rows. Redshift uses columnar storage and massively parallel processing across nodes, and Redshift Spectrum can query data directly in S3 without loading it, useful for querying infrequently-accessed historical data without paying to store it twice.","Pitfall: running heavy ad hoc analytical queries directly against a production OLTP database (RDS) competes for the same I/O and locks as live transactions, degrading customer-facing latency; the fix is separating analytical workloads onto a warehouse or read replica dedicated to that traffic."],"es":["Las bases de datos transaccionales (OLTP) almacenan filas juntas para hacer rápidas las lecturas/escrituras de un solo registro; las cargas analíticas (OLAP) típicamente escanean y agregan pocas columnas a través de millones de filas, que es justo lo que optimiza el almacenamiento columnar, leyendo solo las columnas necesarias en vez de filas completas. Redshift usa almacenamiento columnar y procesamiento masivamente paralelo entre nodos, y Redshift Spectrum puede consultar datos directamente en S3 sin cargarlos, útil para consultar datos históricos poco accedidos sin pagar por almacenarlos dos veces.","Error común: ejecutar consultas analíticas ad hoc pesadas directamente contra una base de datos OLTP de producción (RDS) compite por la misma E/S y bloqueos que las transacciones en vivo, degradando la latencia de cara al cliente; la solución es separar las cargas analíticas a un almacén de datos o una réplica de lectura dedicada a ese tráfico."]},"aws":{"en":"Redshift for petabyte-scale columnar analytics; Athena for serverless ad hoc SQL on S3 data; Redshift Spectrum to bridge S3 and Redshift without duplicating data.","es":"Redshift para análisis columnar a escala de petabytes; Athena para SQL ad hoc sin servidor sobre datos en S3; Redshift Spectrum para conectar S3 y Redshift sin duplicar datos."},"question":{"en":"A finance team's monthly reporting queries against the production RDS instance are slowing down checkout for customers. What is the fix?","es":"Los informes mensuales sobre RDS ralentizan el checkout. ¿Qué alternativas evaluarías para separar ambas cargas?"},"answer":{"en":"Step 1: identify the root cause, heavy aggregate analytical queries compete for I/O and locks with checkout transactions on the same instance. Step 2: separate the workloads by creating a read replica dedicated to reporting, or better, exporting the data to an analytical warehouse like Redshift optimized for that query pattern. Step 3: validate checkout latency returns to baseline after moving reporting traffic off the primary instance.","es":"Paso 1: identifica la causa raíz, las consultas analíticas de agregación pesada compiten por I/O y bloqueos con las transacciones de checkout en la misma instancia. Paso 2: separa las cargas creando una réplica de lectura dedicada a reportes, o mejor, exportando los datos a un almacén analítico como Redshift optimizado para ese patrón de consulta. Paso 3: valida que la latencia de checkout vuelva a la línea base tras mover el tráfico de reportes fuera de la instancia principal."},"related":["data-sql","cost-optimization"],"sources":[{"label":"Amazon Redshift Columnar Storage","url":"https://docs.aws.amazon.com/redshift/latest/dg/c_columnar_storage_disk_mem_mgmnt.html"},{"url":"https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html","label":"docs.aws.amazon.com: c high level system architecture"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"}],"level":"applied","learning":{"definition":{"en":"A data warehouse is built for analytical queries that scan many rows and few columns. Modern warehouses commonly store data by column rather than by row, so a query can read only the columns it needs, and they spread work across compute nodes. A dimensional model separates measured facts from the attributes used to group them.","es":"Un almacén analítico está construido para consultas que recorren muchas filas y pocas columnas. Los almacenes modernos suelen guardar los datos por columna en vez de por fila, así que una consulta puede leer solo las columnas que necesita, y reparten el trabajo entre nodos de cómputo. Un modelo dimensional separa los hechos medidos de los atributos usados para agruparlos."},"simple":{"en":"A warehouse is a database tuned for big questions over history, such as sales by month and country. Reading column by column means a query on a few columns of a wide table need not read the rest.","es":"Un almacén analítico es una base de datos ajustada para preguntas grandes sobre el histórico, como ventas por mes y país. Leer columna por columna permite que una consulta sobre unas pocas columnas de una tabla ancha no lea el resto."},"analogy":{"en":"A filing system arranged by field, so counting all the postcodes means pulling one drawer instead of opening every folder. Limit: a clerk can still edit one folder quickly, while a columnar warehouse pays a high price for single row updates, so loads are batched and corrections are reloads rather than edits.","es":"Un archivo ordenado por campo, así que contar todos los códigos postales significa abrir un solo cajón en vez de cada carpeta. Límite: un archivista aún puede editar rápido una carpeta, mientras un almacén columnar paga un precio alto por actualizar una fila, así que las cargas se agrupan y las correcciones son recargas más que ediciones."},"walkthrough":{"en":["Separate the two workloads before designing. A transactional database protects individual writes with indexes and locks, while a warehouse answers aggregate questions over history. Running heavy reporting against the transactional database can contend with production traffic, which is one reason to separate the two.","Model for the questions. A fact table holds measurements such as quantity and amount with keys to dimension tables holding descriptive attributes such as product, date and region. That shape keeps grouping cheap and makes definitions explicit, which matters more than storage cleverness once several teams read the same numbers.","Then understand the execution shape. Amazon Redshift uses a cluster where a leader node parses the query, builds a plan and distributes compiled steps to compute nodes, and it is based on open standard PostgreSQL so most SQL clients work. How rows are distributed and sorted across nodes decides whether a join stays local or moves data between them."],"es":["Separa las dos cargas antes de diseñar. Una base de datos transaccional protege escrituras individuales con índices y cerrojos, mientras un almacén analítico responde preguntas agregadas sobre el histórico. Ejecutar informes pesados contra la base transaccional puede competir con el tráfico de producción, y esa es una razón para separar ambas.","Modela para las preguntas. Una tabla de hechos guarda medidas como cantidad e importe con claves a tablas de dimensión con atributos descriptivos como producto, fecha y región. Esa forma mantiene barata la agrupación y hace explícitas las definiciones, lo que importa más que la astucia de almacenamiento cuando varios equipos leen las mismas cifras.","Después entiende la forma de ejecución. Amazon Redshift usa un clúster donde un nodo líder analiza la consulta, construye un plan y distribuye pasos compilados a los nodos de cómputo, y está basado en el estándar abierto PostgreSQL, así que la mayoría de los clientes SQL funcionan. Cómo se distribuyen y ordenan las filas entre nodos decide si un join queda local o mueve datos entre ellos."]},"pitfalls":{"en":["Loading a columnar warehouse one row at a time. Columnar storage is optimised for bulk loads, so per row inserts are slow and fragment storage; batch the loads and reload a partition to correct data.","Assuming a warehouse table matches the source system. It reflects the last successful load, so a report needs a stated cut off time and a row count reconciliation against the source before anyone acts on it."],"es":["Cargar fila por fila un almacén columnar. El almacenamiento columnar está optimizado para cargas masivas, así que las inserciones por fila son lentas y fragmentan el almacenamiento; agrupa las cargas y recarga una partición para corregir datos.","Suponer que una tabla analítica coincide con el sistema de origen. Refleja la última carga exitosa, así que un informe necesita una hora de corte declarada y una reconciliación de conteo de filas contra el origen antes de que alguien actúe con él."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html","label":"docs.aws.amazon.com: c high level system architecture"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"}]}},{"id":"security","parent":null,"title":{"en":"Security and Governance","es":"Seguridad y gobernanza"},"summary":{"en":"Protect identities, data and workloads with controls matched to risks and responsibilities.","es":"Protege identidades, datos y cargas con controles adecuados a sus riesgos y responsabilidades."},"details":{"en":["Security in AWS follows the shared responsibility model: AWS secures the infrastructure, the customer secures what they configure on top (IAM policies, encryption settings, network exposure, patching guest OS). This root covers the identity and data-protection controls most commonly misconfigured in real environments."],"es":["La seguridad en AWS sigue el modelo de responsabilidad compartida: AWS protege la infraestructura, el cliente protege lo que configura encima (políticas IAM, ajustes de cifrado, exposición de red, parches del SO invitado). Esta raíz cubre los controles de identidad y protección de datos más comúnmente mal configurados en entornos reales."]},"aws":{"en":"Core services: IAM, KMS, Secrets Manager, Organizations/SCPs, GuardDuty, CloudTrail, Config.","es":"Servicios centrales: IAM, KMS, Secrets Manager, Organizations/SCPs, GuardDuty, CloudTrail, Config."},"question":{"en":"What security foundations would you check in a new AWS environment?","es":"¿Qué fundamentos de seguridad revisarías en un entorno AWS nuevo?"},"answer":{"en":"Start with the workload and data classification. Review workforce access, root-account protection and least-privilege roles, then public exposure and data protection. Verify centralized audit logging and an incident-response owner. Which party patches or operates a component depends on the service and deployment model.","es":"Empieza por la carga y clasificación de datos. Revisa acceso del personal, protección de root y roles de mínimo privilegio; después exposición pública y protección de datos. Verifica auditoría centralizada y responsable de incidentes. Quién parchea u opera cada componente depende del servicio y modelo de despliegue."},"related":["iam","encryption","security-governance","improve-security"],"sources":[{"label":"AWS Shared Responsibility Model","url":"https://aws.amazon.com/compliance/shared-responsibility-model/"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"},{"url":"https://www.nist.gov/cyberframework","label":"nist.gov: cyberframework"}],"level":"foundation","quickLinks":["improve-security"],"learning":{"definition":{"en":"Cloud security and governance is deciding which identities may perform which actions, protecting data at rest and in transit, and keeping trustworthy records of what happened in every account.","es":"La seguridad y gobernanza en la nube es decidir qué identidades pueden hacer qué acciones, proteger los datos en reposo y en tránsito, y guardar registros fiables de lo que ocurrió en cada cuenta."},"simple":{"en":"You decide who gets in, you protect the data itself, and you keep reliable receipts of what was done.","es":"Decides quién entra, proteges los datos, y guardas recibos fiables de lo que se hizo."},"analogy":{"en":"Like a bank branch: the bank builds the vault, you decide which staff get which keys. The limit is that a bank key is one physical object, while a cloud permission is a document re-evaluated on every request, so one edit changes access for thousands of identities at once.","es":"Como una sucursal bancaria: el banco construye la caja fuerte, tú decides qué empleados reciben qué llaves. El límite es que una llave es un objeto físico único, mientras un permiso en la nube es un documento reevaluado en cada solicitud, así que una edición cambia el acceso de miles de identidades."},"walkthrough":{"en":["Start with vocabulary. IAM means Identity and Access Management, which decides whether a request is allowed. KMS means Key Management Service, which protects encryption keys. The shared responsibility model says AWS protects the infrastructure running its services, and your share depends on the services you picked.","Controls fall into categories, and the category tells you what a control cannot do. Preventive controls stop an action, such as a policy. Detective controls only report afterwards, such as activity logging. Responsive controls are the people and the automation that act on a finding. A detective control blocks nothing.","Products fill those categories. On AWS that means IAM, KMS, Secrets Manager, Organizations, CloudTrail, Config and GuardDuty. Outside AWS there are identity providers such as Okta or Microsoft Entra ID, secret stores such as HashiCorp Vault, and vendor neutral frameworks such as the NIST Cybersecurity Framework.","Worked example. A new account will host an analytics app. You federate human sign in, give the app a role instead of an access key, encrypt the reporting bucket with a customer managed KMS key, and turn on CloudTrail with data events on that bucket, since object reads are not in CloudTrail otherwise, although S3 server access logs are a separate option. Then you assume an unrelated role, try one read, and confirm the denial and its log entry."],"es":["Empieza por el vocabulario. IAM significa Identity and Access Management, y decide si una solicitud se permite. KMS significa Key Management Service, y protege las claves de cifrado. El modelo de responsabilidad compartida dice que AWS protege la infraestructura de sus servicios, y tu parte depende de los servicios elegidos.","Los controles tienen categorías, y la categoría dice qué no puede hacer un control. Los preventivos detienen una acción, como una política. Los detectivos solo informan después, como el registro de actividad. Los responsivos son las personas y la automatización que actúan. Un control detectivo no bloquea nada.","Los productos llenan esas categorías. En AWS son IAM, KMS, Secrets Manager, Organizations, CloudTrail, Config y GuardDuty. Fuera de AWS están proveedores de identidad como Okta o Microsoft Entra ID, almacenes como HashiCorp Vault, y marcos neutrales como el NIST Cybersecurity Framework.","Ejemplo resuelto. Una cuenta nueva alojará una app de analítica. Federas el acceso humano, das a la app un rol en vez de una clave, cifras el bucket de informes con una clave KMS gestionada por el cliente, y activas CloudTrail con eventos de datos en ese bucket, porque de otro modo las lecturas de objeto no aparecen en CloudTrail, aunque los logs de acceso de S3 son una opción aparte. Luego asumes un rol ajeno, intentas una lectura, y confirmas la denegación y su registro."]},"pitfalls":{"en":["Assuming AWS secures everything because the workload is in the cloud. With EC2 you still own the guest operating system, its patches and your security group rules.","Treating encryption as access control. Encrypting a bucket does not decide who may read it, and an authorized caller still receives plaintext."],"es":["Suponer que AWS protege todo porque la carga está en la nube. Con EC2 sigues siendo responsable del sistema operativo invitado, sus parches y tus grupos de seguridad.","Tratar el cifrado como control de acceso. Cifrar un bucket no decide quién puede leerlo, y un solicitante autorizado recibe texto claro."]},"sourceUrls":[{"url":"https://aws.amazon.com/compliance/shared-responsibility-model/","label":"aws.amazon.com: shared responsibility model"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"},{"url":"https://www.nist.gov/cyberframework","label":"nist.gov: cyberframework"}]}},{"id":"iam","parent":"security","title":{"en":"IAM: Identity and Access Management","es":"IAM: gestión de identidad y acceso"},"summary":{"en":"Decide who may perform which action on which resource, and how permissions are evaluated.","es":"Decide quién puede realizar qué acción sobre qué recurso y cómo se evalúan los permisos."},"details":{"en":["An applicable explicit deny overrides an allow. Beyond that, evaluation depends on account relationships, policy types and the principal named in a resource policy. Same-account identity and resource policies can contribute a union of permissions, while boundaries, session policies and organization controls impose limits in applicable cases. Cross-account access generally needs authorization on both sides. Resource grants to a user, role or role session have important differences; do not summarize the entire model as either a universal union or intersection. SCPs and boundaries do not grant permissions. Prefer roles and temporary credentials over long-lived access keys."],"es":["Una denegación explícita aplicable prevalece sobre un permiso. Después, la evaluación depende de cuentas, tipos de política y principal nombrado en la política del recurso. Dentro de una cuenta, políticas de identidad y recurso pueden unir permisos, mientras límites, políticas de sesión y controles organizativos restringen en los casos aplicables. El acceso entre cuentas generalmente requiere autorización en ambos lados. Conceder a usuario, rol o sesión tiene diferencias importantes; no reduzcas todo a unión o intersección universal. SCP y límites no conceden permisos. Prefiere roles y credenciales temporales."]},"aws":{"en":"Prefer IAM roles (temporary credentials via STS) over long-lived IAM user access keys; use permission boundaries and SCPs as guardrails, not as the primary grant mechanism.","es":"Prefiere roles IAM (credenciales temporales vía STS) sobre llaves de acceso de usuario IAM de larga duración; usa límites de permisos y SCPs como barandillas, no como el mecanismo principal de otorgamiento."},"question":{"en":"An identity policy allows s3:GetObject, but the request returns AccessDenied. How do you investigate?","es":"¿Cómo investigas AccessDenied si la política de identidad permite s3:GetObject?"},"answer":{"en":"Identify the actual principal, account, action, resource ARN and request context. Look for applicable explicit denies and limiting SCPs, RCPs, boundaries or session policies. Check bucket and endpoint policies and cross-account grants. For SSE-KMS, also verify the relevant KMS authorization. Use logs and policy tools as evidence, not as a substitute for the real request context.","es":"Identifica principal real, cuenta, acción, ARN y contexto. Busca denegaciones aplicables y restricciones SCP, RCP, límites o políticas de sesión. Revisa políticas del bucket y endpoint y permisos entre cuentas. Con SSE-KMS verifica también autorización KMS. Usa logs y herramientas de políticas como evidencia sin sustituir el contexto real."},"related":["encryption","secrets-management","security-governance"],"sources":[{"label":"IAM JSON Policy Evaluation Logic","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html"},{"label":"IAM Policy Types","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html#access_policy-types"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"}],"level":"deep","learning":{"definition":{"en":"IAM, short for Identity and Access Management, evaluates each request against every policy that applies and returns one decision, allow or deny, for that exact caller, action, resource and context.","es":"IAM, abreviatura de Identity and Access Management, evalúa cada solicitud frente a todas las políticas aplicables y devuelve una decisión, permitir o denegar, para ese solicitante, acción, recurso y contexto exactos."},"simple":{"en":"Every request is judged on the spot, and anything not clearly allowed is refused.","es":"Cada solicitud se juzga en el momento, y lo que no está claramente permitido se rechaza."},"analogy":{"en":"Like a guard who reads a fresh instruction for every door, person and hour instead of trusting a badge checked once at reception. The limit is that a real guard uses judgment and remembers you, while IAM has neither memory nor common sense. A permission you forgot to write does not exist.","es":"Como un vigilante que lee una instrucción nueva para cada puerta y cada hora, en vez de fiarse de una credencial revisada en recepción. El límite es que un vigilante real usa criterio y te recuerda, mientras IAM no tiene memoria ni sentido común. Un permiso que olvidaste escribir no existe."},"walkthrough":{"en":["Concepts first. A principal is whoever makes the request, usually a role session rather than a person. An action is the API operation asked for, such as s3:GetObject. A resource is what its ARN, the Amazon Resource Name, points to.","Then the policy types. Identity based policies grant permissions to a user or role. Resource based policies grant them to the principal they name. Boundaries and organization policies only set a maximum, and a boundary caps what identity policies grant. How identity and resource policies combine depends on the principal named and the policy types, since a grant to a user, a role or a role session differs, and an applicable explicit deny always wins.","Products follow. AWS Security Token Service issues the temporary credentials behind a role, IAM Identity Center centralizes workforce sign in, and IAM Access Analyzer validates least privilege policies. AWS advises federating human users and giving workloads roles.","Worked example. A Lambda function gets AccessDenied on s3:GetObject although its identity policy allows it. The bucket sits in another account and its policy names a different role. Cross account access needs an allow on both sides, so you add the caller. The next failure is the KMS key, which needs authorization in its key policy, and a grant where the service uses one."],"es":["Primero los conceptos. Un principal es quien hace la solicitud, normalmente una sesión de rol y no una persona. Una acción es la operación de API pedida, por ejemplo s3:GetObject. Un recurso es lo que nombra su ARN, Amazon Resource Name.","Luego los tipos de política. Las basadas en identidad conceden permisos a un usuario o rol. Las de recurso los conceden al principal que nombran. Los límites y las políticas de la organización solo fijan un máximo, y un límite acota lo que conceden las po
