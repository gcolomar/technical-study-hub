fore the move.","Applications may retain addresses themselves, and DNS can cache missing-record answers too. Check these caches before concluding that an authoritative change failed."],"es":["Reducir el TTL al cambiar una dirección no acorta la vigencia de las respuestas guardadas con el TTL anterior. Prepara ese valor menor antes de la migración.","Las aplicaciones pueden guardar direcciones por su cuenta, y DNS también almacena respuestas que indican que falta un registro. Revisa esas cachés antes de concluir que el cambio autoritativo ha fallado."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc1034","label":"rfc-editor.org: rfc1034"},{"url":"https://www.rfc-editor.org/rfc/rfc1035","label":"rfc-editor.org: rfc1035"},{"url":"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/welcome-dns-service.html","label":"docs.aws.amazon.com: welcome dns service"}]},"diagrams":[{"id":"dns-flow","kind":"sequence","nodes":["dns"],"title":{"en":"Finding an IP address from a name","es":"Encontrar una dirección IP a partir de un nombre"},"caption":{"en":"The application asks a recursive resolver to find the answer. With no useful cached information, that resolver follows referrals from the root to .com and then example.com. Cached answers or referrals let it skip steps.","es":"La aplicación pide a un resolutor recursivo que encuentre la respuesta. Si no dispone de información útil en caché, este sigue las indicaciones desde la raíz hasta .com y después example.com. Las respuestas o delegaciones guardadas permiten saltarse pasos."},"alt":{"en":"The application asks its operating-system resolver, which asks the configured recursive DNS resolver. With no useful cache, the recursive resolver asks a root server for .com servers, then .com for the example.com servers, then an authoritative example.com server for api.example.com. The answer returns to the client with a cache lifetime, TTL. Cached answers or referrals can skip steps. The return through the local resolver is omitted from the drawing.","es":"La aplicación consulta al resolutor del sistema operativo, que consulta al resolutor DNS recursivo configurado. Sin caché útil, este pregunta a la raíz por los servidores de .com, a .com por los de example.com y a un servidor autoritativo de example.com por api.example.com. La respuesta vuelve al cliente con una vigencia de caché, TTL. La caché puede evitar pasos. El dibujo omite el retorno por el resolutor local."},"actors":[{"id":"app","label":{"en":"Application","es":"Aplicación"}},{"id":"stub","label":{"en":"Operating system resolver","es":"Resolutor del sistema operativo"}},{"id":"recursive","label":{"en":"Recursive resolver","es":"Resolutor recursivo"}},{"id":"root","label":{"en":"Root server","es":"Servidor raíz"}},{"id":"tld","label":{"en":"Top level domain server","es":"Servidor del dominio de primer nivel"}},{"id":"auth","label":{"en":"Authoritative name server","es":"Servidor autoritativo"}}],"steps":[{"from":"app","to":"stub","label":{"en":"Where is api.example.com","es":"Dónde está api.example.com"},"note":{"en":"A local cache may already contain the answer. Otherwise the operating system sends the query to its configured DNS resolver.","es":"Una caché local puede tener ya la respuesta. Si no, el sistema operativo envía la consulta al resolutor DNS configurado."}},{"from":"stub","to":"recursive","label":{"en":"The same question, sent to the configured resolver","es":"La misma pregunta, enviada al resolutor configurado"},"note":{"en":"Inside a VPC this is commonly Route 53 Resolver, the AWS service that resolves public and private DNS names for the VPC.","es":"Dentro de una VPC suele ser Route 53 Resolver, el servicio de AWS que resuelve nombres DNS públicos y privados para esa VPC."}},{"from":"recursive","to":"root","label":{"en":"Which servers handle .com","es":"Qué servidores gestionan .com"},"note":{"en":"The root returns the nameservers responsible for .com, not the IP of the application. A cached referral avoids this request.","es":"La raíz devuelve los servidores responsables de .com, no la IP de la aplicación. Una delegación en caché evita esta consulta."}},{"from":"recursive","to":"tld","label":{"en":"Which servers are authoritative for example.com","es":"Qué servidores son autoritativos para example.com"},"note":{"en":"The .com server points to the servers responsible for example.com. This referral can also be cached.","es":"El servidor de .com indica qué servidores son responsables de example.com. Esta delegación también se puede guardar en caché."}},{"from":"recursive","to":"auth","label":{"en":"Give me the A record for api.example.com","es":"Dame el registro A de api.example.com"},"note":{"en":"The authoritative server supplies the configured record. Existing caches may still contain an older answer until its lifetime expires.","es":"El servidor autoritativo proporciona el registro configurado. Las cachés existentes pueden seguir conteniendo una respuesta anterior hasta que expire su vigencia."}},{"from":"recursive","to":"app","label":{"en":"Address plus TTL, and caches along the way may keep it","es":"Dirección más TTL, y las cachés del camino pueden guardarla"},"note":{"en":"TTL is the cache lifetime in seconds. Lower it in advance of a planned change, then allow earlier cached answers to expire. Client behaviour can still vary.","es":"El TTL es la vigencia de la caché, en segundos. Redúcelo antes de un cambio planificado y deja que caduquen las respuestas ya guardadas. El comportamiento concreto del cliente puede variar."}}]}]},{"id":"http","parent":"osi-7","title":{"en":"HTTP methods, status and retries","es":"HTTP: métodos, estados y reintentos"},"summary":{"en":"HTTP gives requests and responses a shared structure; application semantics determine which operations can be retried safely.","es":"HTTP da una estructura común a peticiones y respuestas; el significado de la operación determina si se puede repetir con seguridad."},"details":{"en":["A safe method does not request a state change, although incidental effects such as logging may occur. Idempotent means repeating a request has the same intended effect as making it once; responses can still differ. GET, PUT and DELETE are idempotent by their defined semantics. The 3xx class includes redirects and cache validation, not just resources that moved."],"es":["Un método seguro no solicita cambiar el estado, aunque puede producir efectos secundarios como registros de acceso. Idempotente significa que repetir la petición tiene el mismo efecto previsto que ejecutarla una vez; las respuestas sí pueden diferir. GET, PUT y DELETE son idempotentes según su definición. La clase 3xx incluye redirecciones y validación de caché, no solo recursos que se han movido."]},"aws":{"en":"For an API behind an Application Load Balancer, compare the balancer status with the target status in its access logs. A 502 generated by the balancer may indicate an invalid target response, so investigate that connection rather than assuming the application returned 502.","es":"En una API detrás de un Application Load Balancer, compara el estado del balanceador con el del destino en sus registros de acceso. Un 502 generado por el balanceador puede indicar una respuesta inválida del destino; investiga esa conexión en vez de asumir que la aplicación devolvió 502."},"question":{"en":"A customer retries a checkout after a timeout and gets charged twice. How would you change the API contract?","es":"Un cliente reintenta una compra tras agotar el tiempo de espera y recibe dos cargos. ¿Cómo cambiarías el contrato de la API?"},"answer":{"en":"I would give each purchase attempt a stable idempotency key and require the client to reuse it on retries. The server must coordinate that key with the actual payment effect, including concurrent requests and crashes; recording it only after charging leaves a duplicate-charge window. Reusing the key with different input should be rejected. I would return the recorded result for duplicates, define a retention period, and bound retries with increasing delays. The timeout is uncertainty about the result, not permission to charge again.","es":"Daría a cada intento de compra una clave de idempotencia estable y exigiría reutilizarla en los reintentos. El servidor debe coordinar esa clave con el cobro real, incluidas peticiones concurrentes y caídas; registrarla solo después de cobrar deja una ventana para duplicados. Reutilizarla con datos distintos debe rechazarse. Devolvería el resultado guardado para duplicados, definiría cuánto conservarlo y limitaría los reintentos con esperas crecientes. El timeout deja el resultado incierto; no autoriza a cobrar de nuevo."},"related":["tls","dns","cloud","quic"],"sources":[{"label":"HTTP semantics: RFC 9110","url":"https://www.rfc-editor.org/rfc/rfc9110.html"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Idempotent","label":"developer.mozilla.org: Idempotent"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status","label":"developer.mozilla.org: Status"}],"level":"applied","learning":{"definition":{"en":"HTTP defines how a client requests an operation on a resource and how a server responds. A request includes a method, such as GET or POST, a resource address and headers; it may also contain a body. The response includes a status code, headers and optionally a body.","es":"HTTP define cómo un cliente solicita una operación sobre un recurso y cómo responde un servidor. La petición incluye un método, como GET o POST, la dirección del recurso y cabeceras; también puede llevar un cuerpo. La respuesta incluye un código de estado, cabeceras y, opcionalmente, un cuerpo."},"simple":{"en":"The method describes the intended operation: GET retrieves information, PUT replaces a resource and POST submits data for resource-specific processing. HTTP does not automatically remember an earlier request, so applications add session identifiers or credentials when needed. A status code reports the outcome: 200 means a successful request, while 404 means the requested resource was not found or is not disclosed. If no response arrives, the client cannot tell from the timeout alone whether the server performed the operation.","es":"El método describe la operación prevista: GET obtiene información, PUT sustituye un recurso y POST envía datos para que ese recurso los procese. HTTP no recuerda automáticamente una petición anterior, por lo que las aplicaciones añaden identificadores de sesión o credenciales cuando los necesitan. El código de estado informa del resultado: 200 indica éxito y 404 que no se ha encontrado el recurso o no se revela su existencia. Si no llega respuesta, el tiempo de espera agotado no permite saber por sí solo si el servidor ejecutó la operación."},"analogy":{"en":"A request is like a form naming an action and a case number; the response is its receipt. Unlike a reliable receipt service, a network can lose the response after the action has already happened.","es":"La petición se parece a un formulario que indica una acción y un expediente; la respuesta es su justificante. La diferencia importante es que la red puede perder el justificante después de que la acción ya se haya realizado."},"walkthrough":{"en":["A checkout client sends POST /orders with a cart and a unique request key. The application uses that key to identify this purchase attempt, rather than treating every network delivery as a new purchase.","The server creates order 42 and records the request key with the result in a design that prevents concurrent duplicate creation. It sends 201 Created, but the connection fails before the client receives the response.","The client retries with the same key. The server finds the recorded result and returns order 42 instead of creating another order. Retries have a limit and increasing delays so they do not overload a struggling server."],"es":["Un cliente de compra envía POST /orders con el carrito y una clave de petición única. La aplicación usa esa clave para identificar el intento de compra, en lugar de tratar cada entrega por la red como una compra nueva.","El servidor crea el pedido 42 y registra la clave con el resultado mediante un diseño que impide creaciones duplicadas concurrentes. Envía 201 Created, pero la conexión falla antes de que el cliente reciba la respuesta.","El cliente reintenta con la misma clave. El servidor encuentra el resultado y devuelve el pedido 42 sin crear otro. Los reintentos tienen un límite y esperas crecientes para no sobrecargar un servidor con problemas."]},"pitfalls":{"en":["POST is not guaranteed to be idempotent, but it does not always create a resource. Its actual operation is defined by the application contract.","A timeout does not prove failure before execution. Retry a state-changing operation only when you know repeating it will not duplicate its intended effect."],"es":["POST no garantiza idempotencia, pero tampoco crea siempre un recurso. La operación concreta depende del contrato de la aplicación.","Un tiempo de espera agotado no demuestra que la operación no se ejecutara. Reintenta una operación que cambia estado solo cuando repetirla no duplique su efecto previsto."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9110.html","label":"rfc-editor.org: rfc9110"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Idempotent","label":"developer.mozilla.org: Idempotent"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status","label":"developer.mozilla.org: Status"}]}},{"id":"vpc","parent":"networking","title":{"en":"VPC design","es":"Diseño de VPC"},"summary":{"en":"Distribute working resources across failure locations, then give each required connection a path and suitable permissions.","es":"Distribuye recursos operativos entre ubicaciones de fallo y dota cada conexión necesaria de un recorrido y permisos adecuados."},"details":{"en":["In a standard IPv4 VPC subnet, AWS reserves five addresses. A /28 block contains 16 addresses, leaving 11 assignable; a /24 contains 256, leaving 251. The slash notation states how many address bits identify the network, so a larger number means a smaller block. Leave capacity for growth and for extra network interfaces during resource replacement."],"es":["En una subred IPv4 estándar de una VPC, AWS reserva cinco direcciones. Un bloque /28 contiene 16 y deja 11 disponibles; un /24 contiene 256 y deja 251. El número tras la barra indica cuántos bits identifican la red: cuanto mayor es, menor resulta el bloque. Deja capacidad para crecer y para las interfaces de red adicionales necesarias al sustituir recursos."]},"aws":{"en":"For an EC2 booking service, place an Application Load Balancer across two public subnets and application instances in private subnets in both Zones; use a database deployment with cross-Zone failover.","es":"Para un servicio de reservas en EC2, sitúa un Application Load Balancer en dos subredes públicas e instancias de aplicación en subredes privadas de ambas zonas; utiliza una base de datos con conmutación por error entre zonas."},"question":{"en":"Our booking service has subnets in two Zones, but all servers and its single database run in one. What resilience have we actually gained?","es":"Nuestro servicio de reservas tiene subredes en dos zonas, pero todos los servidores y su única base de datos funcionan en una. ¿Qué resistencia a fallos hemos ganado realmente?"},"answer":{"en":"You have prepared network locations, but the service still depends on its active Zone. Deploy application capacity in the second Zone and configure the load balancer to use healthy instances there. The database needs its own replication and failover design, matched to the business's recovery requirements. Check that the surviving Zone also has the necessary network paths and capacity. Subnet placement enables this design; it does not supply the missing resources.","es":"Has preparado ubicaciones de red, pero el servicio sigue dependiendo de su zona activa. Despliega capacidad de aplicación en la segunda zona y configura el balanceador para usar sus instancias sanas. La base de datos necesita replicación y conmutación por error acordes con la recuperación que exige el negocio. Comprueba que la zona superviviente dispone de las rutas y la capacidad necesarias. Las subredes permiten construir este diseño, pero no aportan los recursos que faltan."},"related":["cidr","well-architected"],"sources":[{"label":"Amazon VPC fundamentals","url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html","label":"docs.aws.amazon.com: subnet sizing"}],"level":"foundation","learning":{"definition":{"en":"Network design establishes which components can communicate and how those connections survive a failure. An Amazon Virtual Private Cloud (VPC) provides a logically isolated network within one AWS Region, with address space and connectivity you configure for your workloads.","es":"El diseño de red establece qué componentes pueden comunicarse y cómo mantener esas conexiones ante un fallo. Amazon Virtual Private Cloud (VPC) proporciona una red lógicamente aislada dentro de una región de AWS, cuyo espacio de direcciones y conexiones configuras para tus cargas de trabajo."},"simple":{"en":"Applications send packets, small units of network data, between addresses. You divide a VPC into subnets, portions of its address space placed in individual Availability Zones, distinct deployment locations within a Region. A route table selects a packet's path; traffic filters decide whether to admit it. Keeping these functions separate lets you provide a necessary connection without allowing every resource to use it. Multiple Zones provide places to deploy resources that should not fail together.","es":"Las aplicaciones envían paquetes, pequeñas unidades de datos de red, entre direcciones. Divides una VPC en subredes, partes de su espacio de direcciones situadas en zonas de disponibilidad, ubicaciones de despliegue diferenciadas dentro de una región. Una tabla de rutas elige el recorrido del paquete; los filtros deciden si lo admiten. Separar ambas funciones permite ofrecer una conexión sin autorizar a todos los recursos a utilizarla. Disponer de varias zonas permite distribuir recursos que no deberían fallar a la vez."},"analogy":{"en":"Think of a VPC as a business campus with roads between buildings. Doors still control entry: the campus comparison explains connectivity, but gives no reason to trust everyone who is already inside.","es":"Imagina una VPC como un campus empresarial con carreteras entre edificios. Las puertas siguen controlando el acceso: la comparación explica las conexiones, pero no justifica confiar en cualquiera que ya esté dentro."},"walkthrough":{"en":["A booking service needs application servers and a database. You allocate separate application and database subnets in two Zones, making room to deploy both tiers beyond a single failure location.","Customers reach a public load balancer, which distributes requests to application servers. The servers query the database through private addresses. You configure the required paths and limit traffic permissions to these connections.","If one Zone fails, the load balancer can use healthy servers in the other. The database needs working replication and failover too: extra subnets alone neither copy data nor restore service."],"es":["Un servicio de reservas necesita servidores de aplicación y una base de datos. Reservas subredes separadas para ambos componentes en dos zonas, dejando espacio para desplegarlos más allá de una única ubicación de fallo.","Los clientes acceden a un balanceador público, que reparte las solicitudes entre servidores de aplicación. Estos consultan la base de datos mediante direcciones privadas. Configuras los recorridos necesarios y limitas los permisos de tráfico a esas conexiones.","Si falla una zona, el balanceador puede utilizar servidores sanos de la otra. La base de datos también necesita replicación y conmutación por error operativas: añadir subredes no copia los datos ni restablece el servicio."]},"pitfalls":{"en":["An empty subnet in another Zone adds no running capacity. Deploy resources there and test whether they can carry the workload after a failure.","A VPC does not authenticate application users. Even private connections need appropriate application permissions, because network access alone should not grant access to business data."],"es":["Una subred vacía en otra zona no añade capacidad operativa. Despliega recursos y comprueba si pueden asumir la carga de trabajo tras un fallo.","Una VPC no autentica a los usuarios de la aplicación. Incluso las conexiones privadas necesitan permisos adecuados de aplicación: poder llegar por red no debería conceder acceso a los datos del negocio."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html","label":"docs.aws.amazon.com: what is amazon vpc"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html","label":"docs.aws.amazon.com: subnet sizing"}]},"diagrams":[{"id":"vpc-path","kind":"flow","nodes":["public-private","nat-egress","vpc"],"title":{"en":"Separate incoming traffic from outbound access","es":"Separa el tráfico entrante del acceso de salida"},"caption":{"en":"The upper flow lets users reach a load balancer, which forwards to private application servers. The lower flow lets those servers initiate Internet connections through a public zonal NAT gateway. This is one deployment pattern, not a complete multi-zone architecture.","es":"El flujo superior permite llegar al balanceador, que reenvía a servidores privados. El inferior permite a esos servidores iniciar conexiones a Internet mediante un NAT gateway público zonal. Es un patrón de despliegue, no una arquitectura completa con varias zonas."},"alt":{"en":"Inbound flow: Internet user, Internet gateway, public load balancer, private application servers, database. Rules allow HTTPS at the balancer, application traffic from the balancer and database traffic from the application. Outbound flow: private instance, public zonal NAT gateway, Internet gateway, Internet service. NAT allows replies to initiated connections, not unsolicited incoming connections. The drawing is one path, not a complete resilient multi-zone deployment.","es":"Entrada: usuario de Internet, Internet gateway, balanceador público, servidores privados, base de datos. Las reglas permiten HTTPS en el balanceador, tráfico hacia la aplicación desde él y tráfico hacia la base desde la aplicación. Salida: instancia privada, NAT gateway público zonal, Internet gateway, servicio de Internet. NAT permite respuestas a conexiones iniciadas, no conexiones nuevas desde fuera. El dibujo muestra un recorrido, no un despliegue resiliente completo en varias zonas."},"flows":[{"label":{"en":"Inbound request","es":"Petición entrante"},"stages":[{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"User","es":"Usuario"},"note":{"en":"Resolves a public name to the load balancer address.","es":"Resuelve un nombre público a la dirección del balanceador."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"Connects the VPC to the Internet. A subnet with a direct route to this gateway is public; resource addressing and security rules must also allow the desired traffic.","es":"Conecta la VPC con Internet. Una subred con ruta directa a este gateway es pública; las direcciones de los recursos y las reglas de seguridad también deben permitir el tráfico deseado."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Load balancer","es":"Balanceador de carga"},"note":{"en":"Accepts HTTPS on port 443. Its Security Group must allow that inbound traffic and outbound connections to the application port.","es":"Acepta HTTPS en el puerto 443. Su Security Group debe permitir esa entrada y las conexiones de salida al puerto de la aplicación."}}]},{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"The application Security Group permits its listening port from the load balancer Security Group. The application needs no public IP.","es":"El Security Group de la aplicación permite su puerto de escucha desde el Security Group del balanceador. La aplicación no necesita una IP pública."}},{"label":{"en":"Database","es":"Base de datos"},"note":{"en":"Database rules permit the database port from the application Security Group. Credentials and database permissions still control access to the data.","es":"Las reglas permiten el puerto de base de datos desde el Security Group de la aplicación. Las credenciales y los permisos de la base siguen controlando el acceso a los datos."}}]}]},{"label":{"en":"Outbound update from a private instance","es":"Salida de una instancia privada"},"stages":[{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instance","es":"Instancia de aplicación"},"note":{"en":"Its default route points to the NAT gateway, not directly to the Internet gateway. It initiates the outbound connection.","es":"Su ruta por defecto apunta al NAT gateway, no directamente al Internet gateway. La instancia inicia la conexión de salida."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Public NAT gateway","es":"NAT gateway público"},"note":{"en":"This zonal gateway translates the source address and allows replies, not new inbound connections. Other zones need an egress design that does not depend on this zone surviving.","es":"Este gateway zonal traduce la dirección de origen y permite respuestas, no conexiones nuevas desde fuera. Las otras zonas necesitan una salida que no dependa de que esta zona siga funcionando."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"The same gateway, reached through the public subnet route.","es":"El mismo gateway, alcanzado por la ruta de la subred pública."}}]},{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"Package repository or public API","es":"Repositorio de paquetes o API pública"},"note":{"en":"For supported AWS services, a VPC endpoint can keep this traffic off the internet path entirely.","es":"Para los servicios AWS compatibles, un VPC endpoint puede mantener este tráfico totalmente fuera del camino por internet."}}]}]}]}]},{"id":"public-private","parent":"vpc","title":{"en":"Public and private subnets","es":"Subredes públicas y privadas"},"summary":{"en":"A public subnet provides a direct internet route, not automatic permission to reach its instances.","es":"Una subred pública ofrece una ruta directa a internet, no permiso automático para acceder a sus instancias."},"details":{"en":["IPv4 routing selects the most specific matching destination range. A subnet can send general internet traffic through NAT while a more specific route carries traffic to a connected private network elsewhere. When investigating a failed request, inspect its actual destination and matching route; finding a default route does not establish which path that particular request uses."],"es":["Las rutas IPv4 se seleccionan por el rango de destino coincidente más específico. Una subred puede enviar el tráfico general de internet por NAT y utilizar otra ruta más concreta para una red privada conectada. Al investigar una solicitud fallida, comprueba el destino real y su ruta correspondiente; encontrar una ruta por defecto no demuestra por dónde viaja esa solicitud."]},"aws":{"en":"Run an EC2 invoice worker without a public IPv4 address, route its subnet's 0.0.0.0/0 traffic to a public NAT gateway, and limit traffic controls to the connections and replies the job requires.","es":"Ejecuta un proceso de facturación en EC2 sin IPv4 pública, dirige el tráfico 0.0.0.0/0 de su subred a una pasarela NAT pública y limita los controles a las conexiones y respuestas necesarias."},"question":{"en":"An EC2 worker has an Internet Gateway route but no public IPv4 address. Its HTTPS downloads fail. Is opening its security group enough?","es":"Un proceso EC2 tiene una ruta a un Internet Gateway, pero no una IPv4 pública. Sus descargas HTTPS fallan. ¿Basta con ampliar los permisos de su grupo de seguridad?"},"answer":{"en":"No. Ordinary direct IPv4 access through an Internet Gateway also requires a public IPv4 address; a traffic rule cannot supply that translation. If the worker needs no inbound internet connections, keep it in a private subnet and provide outbound access through a public NAT gateway. Verify the worker's route, the NAT subnet's Internet Gateway route and the controls for requests and replies. Adding an inbound rule does not solve this outbound connectivity problem.","es":"No. El acceso IPv4 directo mediante un Internet Gateway también requiere una IPv4 pública; una regla de tráfico no aporta esa traducción. Si el proceso no necesita recibir conexiones de internet, mantenlo en una subred privada y dale salida mediante una pasarela NAT pública. Revisa la ruta del proceso, la salida al Internet Gateway desde la subred de NAT y los controles para solicitudes y respuestas. Añadir una regla de entrada no resuelve este problema de salida."},"related":["routing","nat-egress","security-groups","load-balancing"],"sources":[{"label":"Internet gateways","url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html","label":"docs.aws.amazon.com: vpc nat gateway"}],"level":"foundation","learning":{"definition":{"en":"Public and private subnet design separates resources according to whether they need a direct internet path. AWS calls a subnet public when it has a direct route to an Internet Gateway, the component connecting a VPC to the internet; a private subnet lacks that route.","es":"El diseño de subredes públicas y privadas separa los recursos según necesiten o no un recorrido directo hacia internet. En AWS, una subred pública tiene una ruta directa a un Internet Gateway, el componente que conecta la VPC con internet; una privada carece de esa ruta."},"simple":{"en":"A route tells a network where to forward traffic for a destination range. Ordinary direct IPv4 internet access through an Internet Gateway requires an EC2 instance to have a public IPv4 address and controls permitting the connection. A private instance can use network address translation (NAT): a public NAT gateway forwards requests using an internet-facing address and maps replies back. This supports connections initiated from inside, not unsolicited inbound connections through that gateway.","es":"Una ruta indica por dónde enviar tráfico destinado a un rango de direcciones. Para acceder directamente a internet por IPv4 mediante un Internet Gateway, una instancia EC2 necesita una IPv4 pública y controles que lo permitan. Una instancia privada puede usar traducción de direcciones de red (NAT): una pasarela NAT pública reenvía solicitudes con una dirección hacia internet y dirige las respuestas al origen. Admite conexiones iniciadas desde dentro, no conexiones entrantes no solicitadas a través de esa pasarela."},"analogy":{"en":"A public subnet resembles a building with a road to the street; a private subnet uses a dispatch desk for outside deliveries. Roads do not unlock doors, and the desk is not a visitor entrance.","es":"Una subred pública se parece a un edificio con acceso a la calle; una privada recurre a un mostrador de envíos. La carretera no abre puertas y el mostrador no sirve de entrada para visitantes."},"walkthrough":{"en":["An invoice worker must download exchange rates over HTTPS, an encrypted web connection, without receiving internet requests. You give it a private IPv4 address and no direct Internet Gateway route.","Its subnet sends internet-bound traffic to a public NAT gateway in a public subnet. That subnet routes onward to the Internet Gateway, and the NAT gateway has an Elastic IP, a reserved public IPv4 address.","The worker opens a connection to the rate provider on port 443. With routes and traffic controls correctly configured, the request leaves through NAT and the reply returns to the worker; the provider cannot initiate an unrelated connection through NAT."],"es":["Un proceso de facturación debe descargar tipos de cambio mediante HTTPS, una conexión web cifrada, sin recibir solicitudes de internet. Le asignas una IPv4 privada y ninguna ruta directa a un Internet Gateway.","Su subred envía el tráfico destinado a internet a una pasarela NAT pública en una subred pública. Esta última tiene una ruta al Internet Gateway, y la pasarela dispone de una Elastic IP, una IPv4 pública reservada.","El proceso abre una conexión con el proveedor de tipos de cambio en el puerto 443. Si las rutas y los controles permiten el tráfico, la solicitud sale por NAT y la respuesta vuelve al proceso; el proveedor no puede iniciar una conexión independiente a través de NAT."]},"pitfalls":{"en":["A public IPv4 address does not make its subnet public. Check the associated route table; the address alone does not establish an internet path or permit incoming traffic.","Private does not mean disconnected: NAT and private connectivity can provide other paths. IPv6 needs its own routing and exposure decisions rather than assumptions carried over from IPv4."],"es":["Una IPv4 pública no convierte su subred en pública. Revisa la tabla de rutas asociada; la dirección por sí sola no establece un recorrido a internet ni permite tráfico entrante.","Privada no significa desconectada: NAT y las conexiones privadas pueden ofrecer otros recorridos. IPv6 necesita sus propias decisiones sobre rutas y exposición, sin trasladar automáticamente las suposiciones de IPv4."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html","label":"docs.aws.amazon.com: VPC Internet Gateway"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html","label":"docs.aws.amazon.com: vpc nat gateway"}]},"diagrams":[{"id":"vpc-path","kind":"flow","nodes":["public-private","nat-egress","vpc"],"title":{"en":"Separate incoming traffic from outbound access","es":"Separa el tráfico entrante del acceso de salida"},"caption":{"en":"The upper flow lets users reach a load balancer, which forwards to private application servers. The lower flow lets those servers initiate Internet connections through a public zonal NAT gateway. This is one deployment pattern, not a complete multi-zone architecture.","es":"El flujo superior permite llegar al balanceador, que reenvía a servidores privados. El inferior permite a esos servidores iniciar conexiones a Internet mediante un NAT gateway público zonal. Es un patrón de despliegue, no una arquitectura completa con varias zonas."},"alt":{"en":"Inbound flow: Internet user, Internet gateway, public load balancer, private application servers, database. Rules allow HTTPS at the balancer, application traffic from the balancer and database traffic from the application. Outbound flow: private instance, public zonal NAT gateway, Internet gateway, Internet service. NAT allows replies to initiated connections, not unsolicited incoming connections. The drawing is one path, not a complete resilient multi-zone deployment.","es":"Entrada: usuario de Internet, Internet gateway, balanceador público, servidores privados, base de datos. Las reglas permiten HTTPS en el balanceador, tráfico hacia la aplicación desde él y tráfico hacia la base desde la aplicación. Salida: instancia privada, NAT gateway público zonal, Internet gateway, servicio de Internet. NAT permite respuestas a conexiones iniciadas, no conexiones nuevas desde fuera. El dibujo muestra un recorrido, no un despliegue resiliente completo en varias zonas."},"flows":[{"label":{"en":"Inbound request","es":"Petición entrante"},"stages":[{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"User","es":"Usuario"},"note":{"en":"Resolves a public name to the load balancer address.","es":"Resuelve un nombre público a la dirección del balanceador."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"Connects the VPC to the Internet. A subnet with a direct route to this gateway is public; resource addressing and security rules must also allow the desired traffic.","es":"Conecta la VPC con Internet. Una subred con ruta directa a este gateway es pública; las direcciones de los recursos y las reglas de seguridad también deben permitir el tráfico deseado."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Load balancer","es":"Balanceador de carga"},"note":{"en":"Accepts HTTPS on port 443. Its Security Group must allow that inbound traffic and outbound connections to the application port.","es":"Acepta HTTPS en el puerto 443. Su Security Group debe permitir esa entrada y las conexiones de salida al puerto de la aplicación."}}]},{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"The application Security Group permits its listening port from the load balancer Security Group. The application needs no public IP.","es":"El Security Group de la aplicación permite su puerto de escucha desde el Security Group del balanceador. La aplicación no necesita una IP pública."}},{"label":{"en":"Database","es":"Base de datos"},"note":{"en":"Database rules permit the database port from the application Security Group. Credentials and database permissions still control access to the data.","es":"Las reglas permiten el puerto de base de datos desde el Security Group de la aplicación. Las credenciales y los permisos de la base siguen controlando el acceso a los datos."}}]}]},{"label":{"en":"Outbound update from a private instance","es":"Salida de una instancia privada"},"stages":[{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instance","es":"Instancia de aplicación"},"note":{"en":"Its default route points to the NAT gateway, not directly to the Internet gateway. It initiates the outbound connection.","es":"Su ruta por defecto apunta al NAT gateway, no directamente al Internet gateway. La instancia inicia la conexión de salida."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Public NAT gateway","es":"NAT gateway público"},"note":{"en":"This zonal gateway translates the source address and allows replies, not new inbound connections. Other zones need an egress design that does not depend on this zone surviving.","es":"Este gateway zonal traduce la dirección de origen y permite respuestas, no conexiones nuevas desde fuera. Las otras zonas necesitan una salida que no dependa de que esta zona siga funcionando."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"The same gateway, reached through the public subnet route.","es":"El mismo gateway, alcanzado por la ruta de la subred pública."}}]},{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"Package repository or public API","es":"Repositorio de paquetes o API pública"},"note":{"en":"For supported AWS services, a VPC endpoint can keep this traffic off the internet path entirely.","es":"Para los servicios AWS compatibles, un VPC endpoint puede mantener este tráfico totalmente fuera del camino por internet."}}]}]}]}]},{"id":"security-groups","parent":"vpc","title":{"en":"Security groups","es":"Security groups"},"summary":{"en":"Security groups combine permitted connections and track their replies; another attached group cannot veto an allow.","es":"Los grupos suman conexiones permitidas y mantienen su seguimiento para admitir respuestas; otro grupo asociado no puede vetar un permiso."},"details":{"en":["An allowed TCP connection does not prove an application is ready to answer. A process must listen on the specified port, the operating-system firewall must accept traffic, and the application may require encryption or credentials. Distinguish a timeout from a refused connection or an authentication error before changing rules: they arise at different stages of the request."],"es":["Que TCP esté permitido no demuestra que la aplicación esté lista para responder. Debe haber un proceso escuchando en ese puerto, el cortafuegos del sistema operativo debe admitir el tráfico y la aplicación puede exigir cifrado o credenciales. Antes de cambiar reglas, distingue entre agotar el tiempo de espera, recibir un rechazo de conexión y obtener un error de autenticación: corresponden a fases diferentes."]},"aws":{"en":"Give an EC2 reporting fleet one security group and an RDS for PostgreSQL database another; allow TCP 5432 between those groups instead of exposing the database port to every address in the VPC.","es":"Asigna un grupo a las instancias EC2 de informes y otro a una base de datos RDS for PostgreSQL; permite TCP 5432 entre ambos en lugar de abrir ese puerto a todas las direcciones de la VPC."},"question":{"en":"A database interface has one group allowing port 5432 only from the app group and another allowing it from the whole VPC. Are other VPC instances blocked?","es":"La interfaz de una base de datos tiene un grupo que permite el puerto 5432 solo desde el grupo de la aplicación y otro que lo permite desde toda la VPC. ¿Quedan bloqueadas las demás instancias?"},"answer":{"en":"No. The broader rule still permits matching traffic because attached security groups combine their allow rules. Remove or narrow that permission if only the application should connect, and check every group on the database interface. Keep the application-to-database rule and necessary sender egress permissions. A usable route and compatible subnet filters are still needed for packets to arrive. Database authentication then determines whether the arriving client may access the data.","es":"No. La regla más amplia sigue permitiendo el tráfico que encaja, porque los grupos asociados suman sus permisos. Elimina o limita ese permiso si solo debe conectarse la aplicación y revisa todos los grupos de la interfaz. Mantén la regla entre ambos componentes y los permisos de salida necesarios. También hacen falta una ruta utilizable y filtros de subred compatibles para que lleguen los paquetes. Después, la autenticación de la base de datos determina si el cliente puede acceder a los datos."},"related":["nacl","tcp","security"],"sources":[{"label":"Security groups","url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html","label":"docs.aws.amazon.com: vpc network acls"}],"level":"applied","learning":{"definition":{"en":"A security group defines which network connections a resource may send or receive. AWS applies it to associated network interfaces, the connection points through which resources exchange traffic, so permissions can follow an application component rather than an entire subnet.","es":"Un grupo de seguridad define qué conexiones de red puede iniciar o recibir un recurso. AWS lo aplica a las interfaces de red asociadas, los puntos por los que los recursos intercambian tráfico, para vincular los permisos a un componente de aplicación en lugar de a toda una subred."},"simple":{"en":"When a client starts a connection, the destination's inbound rules must allow it; outbound restrictions on the sender must also permit it. Rules specify protocols, ports and peers, meaning the other network endpoints. Security groups are stateful: for normally tracked connections, AWS remembers an allowed flow and permits replies without a separate reverse rule. Several groups on one interface combine their permissions. An allow in one group cannot be cancelled by another attached group.","es":"Cuando un cliente inicia una conexión, las reglas de entrada del destino y las restricciones de salida del emisor deben permitirla. Las reglas especifican protocolos, puertos y extremos autorizados, es decir, quién participa al otro lado. Los grupos mantienen el estado de las conexiones: cuando AWS rastrea un flujo permitido, acepta sus respuestas sin otra regla inversa. Varios grupos en una interfaz suman sus permisos. Un grupo asociado no puede anular lo que permite otro."},"analogy":{"en":"Imagine a receptionist who admits approved callers and recognises their replies. Several approval lists add permissions together. The comparison stops at identity: a security group recognises network attributes, not whether a customer has logged in.","es":"Piensa en una recepción que admite llamadas autorizadas y reconoce sus respuestas. Varias listas suman permisos. La comparación termina en la identidad: el grupo reconoce atributos de red, no si el cliente ha iniciado sesión."},"walkthrough":{"en":["A reporting application and a PostgreSQL database occupy different subnets in the same VPC. Each has its own security group, and their private addresses have a working network path between them.","You allow the application group to send TCP traffic to the database group on port 5432. The database group accepts that port from the application group, avoiding separate permissions for each application instance's address.","An application instance connects. Once permitted and tracked, its database replies need no mirrored security-group rule, although subnet filters must still admit them. This rule grants nothing to servers outside the specified application group."],"es":["Una aplicación de informes y una base de datos PostgreSQL ocupan subredes distintas de una misma VPC. Cada una tiene su grupo de seguridad y existe un recorrido de red operativo entre sus direcciones privadas.","Permites que el grupo de la aplicación envíe tráfico TCP al de la base de datos por el puerto 5432. El grupo de la base de datos acepta ese puerto desde el grupo de la aplicación, sin permisos individuales para cada dirección de instancia.","Una instancia de aplicación se conecta. Una vez permitido y rastreado el flujo, las respuestas no necesitan una regla inversa en los grupos, aunque los filtros de subred deben admitirlas. Esta regla no concede acceso a servidores ajenos al grupo de la aplicación."]},"pitfalls":{"en":["Security groups offer allow rules, not explicit denies. Removing an overly broad permission is ineffective if another attached group still provides equivalent access.","Referencing a group identifies eligible network peers where supported; it does not import that group's rules, create a route or provide database credentials."],"es":["Los grupos ofrecen permisos, no denegaciones explícitas. Eliminar un permiso demasiado amplio no sirve si otro grupo asociado sigue concediendo el mismo acceso.","Referenciar un grupo identifica los extremos admitidos cuando esa configuración lo permite; no importa las reglas del otro grupo, crea rutas ni proporciona credenciales de base de datos."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html","label":"docs.aws.amazon.com: vpc security groups"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html","label":"docs.aws.amazon.com: vpc network acls"}]},"diagrams":[{"id":"stateful-vs-stateless","kind":"flow","nodes":["nacl","security-groups"],"title":{"en":"Why allowing a request may not allow its reply","es":"Por qué permitir una petición puede no permitir su respuesta"},"caption":{"en":"The client uses temporary port 53000 to contact server port 443. The Security Group tracks the connection and permits its reply. The NACL checks inbound and outbound packets separately, so its outbound rules must permit destination port 53000 for this example.","es":"El cliente usa el puerto temporal 53000 para contactar con el puerto 443 del servidor. El Security Group registra la conexión y permite su respuesta. La NACL comprueba entrada y salida por separado, así que sus reglas de salida deben permitir el puerto de destino 53000 en este ejemplo."},"alt":{"en":"Request from client 198.51.100.10 port 53000 to server port 443: the subnet NACL checks inbound rules in numbered order, then the resource Security Group allows the expected source and port. Reply to client port 53000: the Security Group permits tracked return traffic, but the NACL checks outbound rules independently. A missing outbound allow can drop the reply and cause a timeout. Production client temporary-port ranges vary.","es":"Petición del cliente 198.51.100.10 puerto 53000 al servidor puerto 443: la NACL comprueba las reglas de entrada por número y el Security Group del recurso permite origen y puerto previstos. Respuesta al puerto 53000 del cliente: el Security Group permite el retorno registrado, pero la NACL comprueba la salida de forma independiente. Si falta un permiso de salida, puede descartar la respuesta y causar un timeout. Los rangos de puertos temporales varían según los clientes."},"flows":[{"label":{"en":"Request: 198.51.100.10:53000 to the server on 443","es":"Petición: 198.51.100.10:53000 al servidor en 443"},"stages":[{"zone":{"en":"Subnet boundary","es":"Límite de la subred"},"items":[{"label":{"en":"Network ACL, inbound rules","es":"Network ACL, reglas de entrada"},"note":{"en":"Rules are evaluated from the lowest number. The first match allows or denies this packet, whose destination port is 443.","es":"Se evalúan las reglas desde el número más bajo. La primera coincidencia permite o deniega este paquete, cuyo puerto de destino es 443."}}]},{"zone":{"en":"Resource network interface","es":"Interfaz de red del recurso"},"items":[{"label":{"en":"Security group, inbound rules","es":"Security group, reglas de entrada"},"note":{"en":"The combined rules must allow port 443 from the client. Security Groups have allow rules, not explicit deny rules.","es":"El conjunto de reglas debe permitir el puerto 443 desde el cliente. Los Security Groups tienen reglas de permiso, no reglas de denegación explícita."}}]},{"zone":{"en":"Workload","es":"Carga de trabajo"},"items":[{"label":{"en":"The server accepts on 443","es":"El servidor acepta en 443"},"note":{"en":"The security group now tracks this connection.","es":"El Security Group registra esta conexión."}}]}]},{"label":{"en":"Reply: the server answers 198.51.100.10:53000","es":"Respuesta: el servidor contesta a 198.51.100.10:53000"},"stages":[{"zone":{"en":"Resource network interface","es":"Interfaz de red del recurso"},"items":[{"label":{"en":"Security group, allowed by state","es":"Security group, permitida por el estado"},"note":{"en":"No outbound rule for port 53000 is needed. The reply belongs to a tracked connection.","es":"No hace falta una regla de salida para el puerto 53000. La respuesta pertenece a una conexión ya registrada."}}]},{"zone":{"en":"Subnet boundary","es":"Límite de la subred"},"items":[{"label":{"en":"Network ACL, outbound rules","es":"Network ACL, reglas de salida"},"note":{"en":"This is a separate rule check with destination port 53000. In production, allow the temporary-port range required by the actual clients rather than copying this single port.","es":"Esta comprobación es independiente y usa el puerto de destino 53000. En producción, permite el rango de puertos temporales que necesiten los clientes reales, no solo este puerto de ejemplo."}}]},{"zone":{"en":"Client","es":"Cliente"},"items":[{"label":{"en":"Client receives the reply if every check allows it","es":"El cliente recibe la respuesta si todos los controles la permiten"},"note":{"en":"If the outbound NACL blocks the reply, the client waits until timeout. Allowing inbound 443 alone is therefore insufficient.","es":"Si la NACL de salida bloquea la respuesta, el cliente espera hasta agotar el tiempo. Por eso no basta con permitir la entrada al 443."}}]}]}]}]},{"id":"nacl","parent":"vpc","title":{"en":"Network ACLs: subnet traffic rules","es":"NACL: reglas de tráfico de una subred"},"summary":{"en":"For a subnet filter without connection memory, plan the reply as carefully as the outgoing request.","es":"En un filtro de subred que no recuerda conexiones, diseña el paso de la respuesta con tanto cuidado como el de la solicitud."},"details":{"en":["The operating system or an intermediary chooses temporary client ports, so the required return-port range can vary. A NAT device may change the source port before traffic reaches the remote service. Write rules for packets as they appear at the subnet being protected, and use flow logs to check observed addresses and ports instead of assuming every client behaves alike."],"es":["El sistema operativo o un intermediario elige los puertos temporales del cliente, por lo que el rango necesario puede variar. Un dispositivo NAT puede cambiar el puerto de origen antes de llegar al servicio remoto. Define reglas según los paquetes que atraviesan la subred protegida y consulta los registros de flujo para comprobar sus direcciones y puertos, sin suponer que todos los clientes se comportan igual."]},"aws":{"en":"For an EC2 HTTPS server subnet, allow incoming TCP destination port 443 from the expected client range and outgoing traffic to the required client temporary-port range. The server security group also needs the inbound HTTPS allowance, but tracked return traffic needs no mirrored security-group rule.","es":"En la subred de un servidor EC2 HTTPS, permite la entrada TCP al puerto de destino 443 desde los clientes previstos y la salida hacia su rango de puertos temporales. El grupo de seguridad del servidor también necesita permitir HTTPS entrante, pero las respuestas rastreadas no requieren una regla inversa en ese grupo."},"question":{"en":"The server subnet NACL allows incoming HTTPS on 443, but clients time out. What should you inspect on the return path?","es":"La NACL de la subred permite HTTPS entrante al 443, pero los clientes agotan el tiempo de espera. ¿Qué revisarías en el retorno?"},"answer":{"en":"I would inspect the outbound NACL rules using the reply packet, not copy the inbound port. The server replies from 443 to the client temporary port, such as 53000. Because the NACL does not track connections, it needs a matching outbound allow and no earlier matching deny. I would confirm the actual client port range and destination addresses, then verify the route back. The security group normally permits tracked replies automatically, but that does not override a separate NACL rejection.","es":"Revisaría las reglas de salida de la NACL con los datos del paquete de respuesta, sin copiar el puerto de entrada. El servidor responde desde 443 al puerto temporal del cliente, como 53000. Como la NACL no registra conexiones, necesita un permiso de salida coincidente y ninguna denegación anterior que prevalezca. Confirmaría el rango real de puertos y direcciones de los clientes y la ruta de vuelta. El grupo de seguridad normalmente permite las respuestas rastreadas, pero eso no anula un rechazo independiente de la NACL."},"related":["security-groups","tcp","troubleshooting"],"sources":[{"label":"AWS VPC: network ACL behavior and scope","url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html"},{"label":"AWS VPC: custom NACL examples and ephemeral ports","url":"https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html"}],"level":"applied","learning":{"definition":{"en":"A network access control list (NACL) applies a common traffic filter at a subnet's boundary. It lets you allow or deny matching packets entering or leaving that subnet without choosing a separate rule set for each resource.","es":"Una lista de control de acceso de red (NACL) aplica un filtro de tráfico común en el límite de una subred. Permite aceptar o rechazar paquetes que entran o salen sin definir reglas distintas para cada recurso."},"simple":{"en":"Packets carry IP addresses and a protocol; TCP and UDP also use ports to identify communication endpoints. A NACL checks the protocol and source IP range on entry or destination IP range on exit; for TCP or UDP it also checks the destination port. Rules run from the lowest number upwards until one matches. NACLs are stateless, so they remember no accepted connections: replies need their own matching permission in the opposite direction.","es":"Los paquetes llevan direcciones IP y un protocolo; TCP y UDP también utilizan puertos para identificar extremos de comunicación. Una NACL comprueba el protocolo y el rango IP de origen al entrar o de destino al salir; para TCP y UDP, además, el puerto de destino. Las reglas se evalúan por número ascendente hasta una coincidencia. Como no conserva estado, no recuerda conexiones aceptadas: las respuestas necesitan su propio permiso en el sentido contrario."},"analogy":{"en":"Picture two checkpoint officers, one for arrivals and one for departures, each reading a numbered checklist. Neither remembers an earlier crossing. The comparison ends inside the grounds, where this checkpoint does not inspect movement.","es":"Imagina dos vigilantes, uno para entradas y otro para salidas, siguiendo listas numeradas. Ninguno recuerda un paso anterior. La comparación acaba dentro del recinto, donde este control no revisa los movimientos."},"walkthrough":{"en":["A browser opens HTTPS from client port 53000 to server port 443. This example protects the server subnet, matching the diagram below. Assume routes and security groups already permit the connection.","The server subnet NACL checks inbound rules. An allow rule matches the client IP range, TCP and destination port 443. If an earlier deny rule matched, it would win instead, so rule order matters.","The server replies to client port 53000. The NACL checks outbound rules separately; they must allow that destination IP range and temporary client port. In production, configure the required client port range, not just this example port."],"es":["Un navegador abre HTTPS desde el puerto 53000 del cliente al 443 del servidor. Este ejemplo protege la subred del servidor, igual que el esquema inferior. Suponemos que las rutas y los grupos de seguridad ya permiten la conexión.","La NACL de la subred del servidor comprueba las reglas de entrada. Una regla permite el rango IP del cliente, TCP y el puerto de destino 443. Si coincidiera antes una regla de denegación, prevalecería esa: el orden importa.","El servidor responde al puerto 53000 del cliente. La NACL comprueba la salida por separado; debe permitir ese rango IP de destino y el puerto temporal del cliente. En producción, configura el rango necesario, no solo el puerto de este ejemplo."]},"pitfalls":{"en":["An unmatched packet is denied. The default NACL includes initial allow rules; a new custom NACL starts closed, so prepare both directions before associating it with a live subnet.","Each subnet uses one NACL at a time, and several subnets can share it. It cannot filter communication that stays between resources within the same subnet."],"es":["Los paquetes sin coincidencia se rechazan. La NACL predeterminada incluye permisos iniciales; una personalizada nueva empieza cerrada. Prepara ambos sentidos antes de asociarla a una subred en uso.","Cada subred utiliza una NACL a la vez y varias subredes pueden compartirla. No puede filtrar la comunicación que permanece entre recursos de una misma subred."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html","label":"docs.aws.amazon.com: vpc network acls"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html","label":"docs.aws.amazon.com: custom network acl"}]},"diagrams":[{"id":"stateful-vs-stateless","kind":"flow","nodes":["nacl","security-groups"],"title":{"en":"Why allowing a request may not allow its reply","es":"Por qué permitir una petición puede no permitir su respuesta"},"caption":{"en":"The client uses temporary port 53000 to contact server port 443. The Security Group tracks the connection and permits its reply. The NACL checks inbound and outbound packets separately, so its outbound rules must permit destination port 53000 for this example.","es":"El cliente usa el puerto temporal 53000 para contactar con el puerto 443 del servidor. El Security Group registra la conexión y permite su respuesta. La NACL comprueba entrada y salida por separado, así que sus reglas de salida deben permitir el puerto de destino 53000 en este ejemplo."},"alt":{"en":"Request from client 198.51.100.10 port 53000 to server port 443: the subnet NACL checks inbound rules in numbered order, then the resource Security Group allows the expected source and port. Reply to client port 53000: the Security Group permits tracked return traffic, but the NACL checks outbound rules independently. A missing outbound allow can drop the reply and cause a timeout. Production client temporary-port ranges vary.","es":"Petición del cliente 198.51.100.10 puerto 53000 al servidor puerto 443: la NACL comprueba las reglas de entrada por número y el Security Group del recurso permite origen y puerto previstos. Respuesta al puerto 53000 del cliente: el Security Group permite el retorno registrado, pero la NACL comprueba la salida de forma independiente. Si falta un permiso de salida, puede descartar la respuesta y causar un timeout. Los rangos de puertos temporales varían según los clientes."},"flows":[{"label":{"en":"Request: 198.51.100.10:53000 to the server on 443","es":"Petición: 198.51.100.10:53000 al servidor en 443"},"stages":[{"zone":{"en":"Subnet boundary","es":"Límite de la subred"},"items":[{"label":{"en":"Network ACL, inbound rules","es":"Network ACL, reglas de entrada"},"note":{"en":"Rules are evaluated from the lowest number. The first match allows or denies this packet, whose destination port is 443.","es":"Se evalúan las reglas desde el número más bajo. La primera coincidencia permite o deniega este paquete, cuyo puerto de destino es 443."}}]},{"zone":{"en":"Resource network interface","es":"Interfaz de red del recurso"},"items":[{"label":{"en":"Security group, inbound rules","es":"Security group, reglas de entrada"},"note":{"en":"The combined rules must allow port 443 from the client. Security Groups have allow rules, not explicit deny rules.","es":"El conjunto de reglas debe permitir el puerto 443 desde el cliente. Los Security Groups tienen reglas de permiso, no reglas de denegación explícita."}}]},{"zone":{"en":"Workload","es":"Carga de trabajo"},"items":[{"label":{"en":"The server accepts on 443","es":"El servidor acepta en 443"},"note":{"en":"The security group now tracks this connection.","es":"El Security Group registra esta conexión."}}]}]},{"label":{"en":"Reply: the server answers 198.51.100.10:53000","es":"Respuesta: el servidor contesta a 198.51.100.10:53000"},"stages":[{"zone":{"en":"Resource network interface","es":"Interfaz de red del recurso"},"items":[{"label":{"en":"Security group, allowed by state","es":"Security group, permitida por el estado"},"note":{"en":"No outbound rule for port 53000 is needed. The reply belongs to a tracked connection.","es":"No hace falta una regla de salida para el puerto 53000. La respuesta pertenece a una conexión ya registrada."}}]},{"zone":{"en":"Subnet boundary","es":"Límite de la subred"},"items":[{"label":{"en":"Network ACL, outbound rules","es":"Network ACL, reglas de salida"},"note":{"en":"This is a separate rule check with destination port 53000. In production, allow the temporary-port range required by the actual clients rather than copying this single port.","es":"Esta comprobación es independiente y usa el puerto de destino 53000. En producción, permite el rango de puertos temporales que necesiten los clientes reales, no solo este puerto de ejemplo."}}]},{"zone":{"en":"Client","es":"Cliente"},"items":[{"label":{"en":"Client receives the reply if every check allows it","es":"El cliente recibe la respuesta si todos los controles la permiten"},"note":{"en":"If the outbound NACL blocks the reply, the client waits until timeout. Allowing inbound 443 alone is therefore insufficient.","es":"Si la NACL de salida bloquea la respuesta, el cliente espera hasta agotar el tiempo. Por eso no basta con permitir la entrada al 443."}}]}]}]}]},{"id":"nat-egress","parent":"vpc","title":{"en":"How private clients reach the internet","es":"Cómo salen a internet los clientes privados"},"summary":{"en":"A NAT gateway remembers address and port translations so an outbound connection can receive replies without giving its client a public address.","es":"Una NAT gateway recuerda las traducciones de dirección y puerto para que una conexión saliente reciba respuestas sin dar una dirección pública al cliente."},"details":{"en":["Port capacity can become the bottleneck even when bandwidth is available. Each regional NAT IP supports 55,000 concurrent connections to a particular destination IP, destination port and protocol combination. Thousands of workers calling one repository can therefore exhaust mappings before saturating the link; reusing connections or adding NAT addresses reduces that pressure, whereas increasing instance bandwidth does not."],"es":["La capacidad de puertos puede limitar la salida aunque sobre ancho de banda. Cada IP de NAT regional admite 55.000 conexiones simultáneas hacia una combinación concreta de IP de destino, puerto de destino y protocolo. Miles de procesos contra un mismo repositorio pueden agotar las traducciones antes de saturar el enlace; reutilizar conexiones o añadir direcciones a NAT reduce esa presión, mientras que aumentar el ancho de banda de las instancias no la resuelve."]},"aws":{"en":"For build workers in two Availability Zones, point both private-subnet default routes to one regional public NAT ID in automatic mode; monitor new-zone expansion, which can take up to 60 minutes and temporarily sends traffic across zones.","es":"Para procesos de compilación en dos zonas de disponibilidad, apunta las rutas predeterminadas de ambas subredes privadas al mismo ID de NAT pública regional en modo automático; supervisa la expansión a zonas nuevas, que puede tardar hasta 60 minutos y enviar temporalmente tráfico entre zonas."},"question":{"en":"A build fleet must keep downloading during a move from two zonal public NAT gateways to one regional gateway. Can the team switch routes without planning for interrupted downloads?","es":"Una flota de compilación debe seguir descargando durante el cambio de dos NAT públicas zonales a una regional. ¿Puede el equipo cambiar las rutas sin prever descargas interrumpidas?"},"answer":{"en":"Plan for interrupted connections and retryable downloads. Existing sessions depend on translation state in the old gateways; changing the route does not transfer that state to the replacement. AWS documents connection resets during this conversion. Prepare the regional public gateway, confirm destination allowlists cover its public addresses, and move traffic in a controlled window with retries. Automatic regional expansion simplifies future zone coverage, but does not make migration seamless. Private NAT is a different connectivity type and still requires zonal mode.","es":"Prevé conexiones interrumpidas y descargas que puedan reintentarse. Las sesiones existentes dependen del estado de traducción de las pasarelas antiguas; cambiar la ruta no transfiere ese estado a la nueva. AWS documenta reinicios de conexiones durante la conversión. Prepara la NAT pública regional, comprueba que sus direcciones públicas estén autorizadas en los destinos y mueve el tráfico en una ventana controlada con reintentos. La expansión regional automática simplifica la cobertura futura, pero no evita las interrupciones de la migración. NAT privada es otro tipo de conectividad y sigue requiriendo modo zonal."},"related":["public-private","ipv6","private-connectivity"],"sources":[{"label":"Regional NAT gateways","url":"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html","label":"docs.aws.amazon.com: vpc nat gateway"}],"level":"applied","learning":{"definition":{"en":"Network address translation (NAT) lets several private clients share an outward-facing address by keeping a translation record for each connection. AWS NAT Gateway uses this state to carry client-initiated traffic and its replies without publishing each client as an internet destination.","es":"La traducción de direcciones de red (NAT) permite que varios clientes privados compartan una dirección de salida mediante un registro de traducción por conexión. AWS NAT Gateway utiliza ese estado para transportar el tráfico iniciado por los clientes y sus respuestas sin publicar cada cliente como destino de internet."},"simple":{"en":"A client sends a packet containing its source address and port. The subnet router sends it to NAT, which substitutes its own private address and a mapped source port, retaining the association with the client and destination. For public internet access, an internet gateway then substitutes the NAT gateway's Elastic IP. Replies traverse these translations in reverse, recovering the original client address and port so the correct application receives them.","es":"Un cliente envía un paquete con su dirección y puerto de origen. El router lo entrega a NAT, que sustituye ese origen por su dirección privada y un puerto asignado, conservando la correspondencia con cliente y destino. Para salir a internet, una pasarela de internet sustituye después esa dirección por la Elastic IP de NAT. Las respuestas recorren ambas traducciones en sentido inverso y recuperan la dirección y el puerto del cliente, de modo que llegan a la aplicación correcta."},"walkthrough":{"en":["An EC2 build host at 10.20.1.8:51000 requests an HTTPS package from 203.0.113.40:443 (illustrative addresses). Its subnet's default route points to a zonal public NAT gateway in the same Availability Zone.","The gateway records 10.20.1.8:51000 as 10.20.0.5:62000 for this flow. Its public subnet routes to an internet gateway, which exposes Elastic IP 198.51.100.20; the repository sees 198.51.100.20:62000.","The repository replies to that public address and port. The internet gateway restores 10.20.0.5, then NAT restores destination 10.20.1.8:51000, so the waiting download receives its bytes."],"es":["Un servidor de compilación EC2 en 10.20.1.8:51000 solicita un paquete HTTPS a 203.0.113.40:443 (direcciones ilustrativas). La ruta predeterminada de su subred apunta a una NAT pública zonal situada en la misma zona de disponibilidad.","La pasarela registra la correspondencia entre 10.20.1.8:51000 y 10.20.0.5:62000 para ese flujo. Su subred pública tiene una ruta hacia la pasarela de internet, que presenta la Elastic IP 198.51.100.20; el repositorio ve 198.51.100.20:62000.","El repositorio responde a esa dirección pública y ese puerto. La pasarela de internet recupera 10.20.0.5 y NAT restablece el destino 10.20.1.8:51000, por lo que los bytes llegan a la descarga que los esperaba."]},"analogy":{"en":"A parcel desk replaces employees' return labels with its address and individual tracking numbers, then redistributes replies. Unlike parcels, NAT records are temporary connection state, not permanent forwarding addresses.","es":"Una oficina de paquetería sustituye los remitentes por su dirección y códigos individuales para repartir las respuestas. La comparación tiene un límite: NAT conserva registros temporales de conexiones, no direcciones de reenvío permanentes."},"pitfalls":{"en":["\"Private subnet\" requires private NAT: no. Public NAT provides internet egress for private clients; private NAT serves private network destinations without an Elastic IP.","\"Regional\" includes private NAT: no. Regional public NAT needs no hosting public subnet; automatic mode expands across zones, while manual mode requires operator changes. Private NAT remains zonal."],"es":["«Subred privada» exige NAT privada: no. NAT pública permite salir a internet a clientes privados; NAT privada conecta con destinos de redes privadas sin una Elastic IP.","«Regional» incluye NAT privada: no. NAT pública regional no necesita una subred pública que la aloje; el modo automático se amplía entre zonas y el manual exige intervención. NAT privada sigue siendo zonal."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html","label":"docs.aws.amazon.com: vpc nat gateway"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html","label":"docs.aws.amazon.com: nat gateways regional"}]},"diagrams":[{"id":"vpc-path","kind":"flow","nodes":["public-private","nat-egress","vpc"],"title":{"en":"Separate incoming traffic from outbound access","es":"Separa el tráfico entrante del acceso de salida"},"caption":{"en":"The upper flow lets users reach a load balancer, which forwards to private application servers. The lower flow lets those servers initiate Internet connections through a public zonal NAT gateway. This is one deployment pattern, not a complete multi-zone architecture.","es":"El flujo superior permite llegar al balanceador, que reenvía a servidores privados. El inferior permite a esos servidores iniciar conexiones a Internet mediante un NAT gateway público zonal. Es un patrón de despliegue, no una arquitectura completa con varias zonas."},"alt":{"en":"Inbound flow: Internet user, Internet gateway, public load balancer, private application servers, database. Rules allow HTTPS at the balancer, application traffic from the balancer and database traffic from the application. Outbound flow: private instance, public zonal NAT gateway, Internet gateway, Internet service. NAT allows replies to initiated connections, not unsolicited incoming connections. The drawing is one path, not a complete resilient multi-zone deployment.","es":"Entrada: usuario de Internet, Internet gateway, balanceador público, servidores privados, base de datos. Las reglas permiten HTTPS en el balanceador, tráfico hacia la aplicación desde él y tráfico hacia la base desde la aplicación. Salida: instancia privada, NAT gateway público zonal, Internet gateway, servicio de Internet. NAT permite respuestas a conexiones iniciadas, no conexiones nuevas desde fuera. El dibujo muestra un recorrido, no un despliegue resiliente completo en varias zonas."},"flows":[{"label":{"en":"Inbound request","es":"Petición entrante"},"stages":[{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"User","es":"Usuario"},"note":{"en":"Resolves a public name to the load balancer address.","es":"Resuelve un nombre público a la dirección del balanceador."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"Connects the VPC to the Internet. A subnet with a direct route to this gateway is public; resource addressing and security rules must also allow the desired traffic.","es":"Conecta la VPC con Internet. Una subred con ruta directa a este gateway es pública; las direcciones de los recursos y las reglas de seguridad también deben permitir el tráfico deseado."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Load balancer","es":"Balanceador de carga"},"note":{"en":"Accepts HTTPS on port 443. Its Security Group must allow that inbound traffic and outbound connections to the application port.","es":"Acepta HTTPS en el puerto 443. Su Security Group debe permitir esa entrada y las conexiones de salida al puerto de la aplicación."}}]},{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"The application Security Group permits its listening port from the load balancer Security Group. The application needs no public IP.","es":"El Security Group de la aplicación permite su puerto de escucha desde el Security Group del balanceador. La aplicación no necesita una IP pública."}},{"label":{"en":"Database","es":"Base de datos"},"note":{"en":"Database rules permit the database port from the application Security Group. Credentials and database permissions still control access to the data.","es":"Las reglas permiten el puerto de base de datos desde el Security Group de la aplicación. Las credenciales y los permisos de la base siguen controlando el acceso a los datos."}}]}]},{"label":{"en":"Outbound update from a private instance","es":"Salida de una instancia privada"},"stages":[{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instance","es":"Instancia de aplicación"},"note":{"en":"Its default route points to the NAT gateway, not directly to the Internet gateway. It initiates the outbound connection.","es":"Su ruta por defecto apunta al NAT gateway, no directamente al Internet gateway. La instancia inicia la conexión de salida."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Public NAT gateway","es":"NAT gateway público"},"note":{"en":"This zonal gateway translates the source address and allows replies, not new inbound connections. Other zones need an egress design that does not depend on this zone surviving.","es":"Este gateway zonal traduce la dirección de origen y permite respuestas, no conexiones nuevas desde fuera. Las otras zonas necesitan una salida que no dependa de que esta zona siga funcionando."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"The same gateway, reached through the public subnet route.","es":"El mismo gateway, alcanzado por la ruta de la subred pública."}}]},{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"Package repository or public API","es":"Repositorio de paquetes o API pública"},"note":{"en":"For supported AWS services, a VPC endpoint can keep this traffic off the internet path entirely.","es":"Para los servicios AWS compatibles, un VPC endpoint puede mantener este tráfico totalmente fuera del camino por internet."}}]}]}]}]},{"id":"load-balancing","parent":"vpc","title":{"en":"Routing requests and transport flows","es":"Enrutamiento de peticiones y flujos de transporte"},"summary":{"en":"Choose ALB when an HTTP request determines the backend, and NLB when transport-flow handling meets the requirement, checking TLS termination separately.","es":"Elige ALB cuando la petición HTTP determine el servidor de destino, y NLB cuando baste gestionar flujos de transporte, comprobando por separado dónde termina TLS."},"details":{"en":["Adding NLB targets does not redistribute existing TCP connections: each remains assigned to its original target for its lifetime. A service with a few long-lived connections can therefore remain unevenly loaded after scaling out. Judge capacity using connection lifetimes and per-target load, rather than assuming new servers immediately inherit established traffic."],"es":["Añadir destinos a un NLB no redistribuye las conexiones TCP existentes: cada una permanece asignada a su destino original mientras dure. Un servicio con pocas conexiones muy largas puede mantener una carga desigual después de añadir servidores. Evalúa la capacidad según la duración de las conexiones y la carga por destino, sin asumir que los servidores nuevos reciben tráfico ya establecido de inmediato."]},"aws":{"en":"For a payment service whose servers must verify client certificates themselves, use an NLB TCP listener on port 443 with TCP targets that terminate TLS and perform mutual authentication; an NLB TLS listener would terminate the client
