.dg-facts dd{margin:0;font-weight:bold;text-align:right}
.dg-actors{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.dg-actor{font-size:10.5px;letter-spacing:.6px;border:1px solid var(--line);padding:4px 8px;color:var(--muted);background:var(--panel)}
.dg-steps{counter-reset:dgstep;list-style:none;margin:0;padding:0}
.dg-steps li{counter-increment:dgstep;position:relative;padding:0 0 16px 30px;border-left:1px solid #c5cebf;margin-left:9px}
.dg-steps li:last-child{border-left-color:transparent;padding-bottom:0}
.dg-steps li:before{content:counter(dgstep);position:absolute;left:-10px;top:0;width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:10px;display:flex;align-items:center;justify-content:center}
.dg-hop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin:0 0 5px}
.dg-arrow{color:var(--muted)}
.dg-msg{font-size:13.5px;line-height:1.7;margin:0}
.dg-flow+.dg-flow{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.dg-flow-label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:bold;margin:0 0 12px}
.dg-lanes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dg-lane{position:relative;padding-bottom:8px}
.dg-zone{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.dg-box{border:1px solid #b7c5ae;background:var(--panel);padding:10px 12px;margin-bottom:7px}
.dg-box strong{font-size:13px;font-weight:normal;display:block}
.dg-box:last-child{margin-bottom:0}
.dg-hop-arrow{display:block;text-align:center;color:var(--accent);transform:rotate(90deg);margin:4px 0}
.dg-band{border:1px dashed #a6b999;background:var(--wash);padding:11px 13px;margin-bottom:10px}
.dg-band:last-child{margin:10px 0 0}
.dg-band strong{font-size:13px;font-weight:normal;display:block}
.dg-zone-grid{display:grid;gap:10px}
.dg-zone-col{border:1px solid var(--line);padding:11px}
@media(min-width:760px){.dg-lanes{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:start}
.dg-hop-arrow{position:absolute;right:-9px;top:26px;transform:none;margin:0}
.dg-zone-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.diagram-body{padding:20px}}
@media(max-width:560px){.learn-simple{padding:15px 16px}
.learn-definition{font-size:17px}
.diagram figcaption strong{font-size:19px}
.diagram-body{padding:13px}
.dg-row{padding:10px 4px;gap:9px}
.dg-bit{width:17px;height:25px;font-size:11px}
.dg-steps li{padding-left:22px}}
@media(max-width:380px){.dg-bit{width:14px;height:22px;font-size:10px}
.dg-octets{gap:4px}
.dg-facts{grid-template-columns:1fr;gap:2px}
.dg-facts dd{text-align:left;margin-bottom:8px}
.dg-num{font-size:17px;min-width:18px}}
@media print{.learn-more,.technical-notes{break-inside:avoid}
.learn-more summary::after,.technical-notes>summary::after{display:none}
.learn-detail,.technical-notes .explanation{display:block}
.diagram{break-inside:avoid}
.diagram-body{border-color:#ccc;background:transparent}
.dg-bit.net{background:#ddd}
.dg-box,.dg-band,.learn-simple{background:transparent;border-color:#ccc}}

<script id="curriculum" type="application/json">[{"id":"networking","parent":null,"title":{"en":"Networking","es":"Redes"},"summary":{"en":"How devices address, send and receive data across connected networks.","es":"Cómo los dispositivos identifican destinos y envían y reciben datos entre redes."},"details":{"en":["Start with addressing and packet delivery. Add transport, application protocols and security controls, then combine them into a resilient design. Each concept has one home in the tree; related links connect ideas across layers."],"es":["Empieza por direccionamiento y entrega de paquetes. Añade transporte, protocolos y seguridad; después combínalos en un diseño resiliente. Cada concepto tiene una ubicación en el árbol y enlaces que conectan ideas entre capas."]},"aws":{"en":"VPC, Route 53 and load balancers illustrate protocol concepts; knowing a service name does not replace understanding the request path.","es":"VPC, Route 53 y los balanceadores ilustran protocolos; conocer un nombre de servicio no sustituye entender el recorrido."},"question":{"en":"Where do you start when an application is unreachable?","es":"¿Por dónde empiezas si una aplicación es inaccesible?"},"answer":{"en":"Clarify affected clients, endpoints and times. Separate DNS, connection establishment, TLS and application responses. Compare with a working path and test one hypothesis at a time.","es":"Aclara clientes, destinos y tiempos afectados. Separa DNS, conexión, TLS y respuesta de aplicación. Compara con una ruta que funcione y prueba una hipótesis cada vez."},"related":["architecture","security"],"sources":[{"label":"Amazon VPC fundamentals","url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"},{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview","label":"developer.mozilla.org: Overview"}],"level":"foundation","learning":{"definition":{"en":"Networking is the set of rules and mechanisms that let one program on one machine exchange data with a program on another machine. It covers four questions: how bits travel over a physical medium, how a machine is addressed and found, how data arrives in usable condition, and how two programs agree on the meaning of the bytes they exchange. A single web request touches all four. Cloud platforms do not remove these questions, they only move who operates each part.","es":"Redes es el conjunto de reglas y mecanismos que permiten a un programa de una máquina intercambiar datos con un programa de otra máquina. Cubre cuatro preguntas: cómo viajan los bits por un medio físico, cómo se direcciona y localiza una máquina, cómo llegan los datos en condiciones útiles, y cómo acuerdan dos programas el significado de los bytes que intercambian. Una sola petición web toca las cuatro. La nube no elimina estas preguntas, solo cambia quién opera cada parte."},"simple":{"en":"Networking is everything that has to work between clicking a link and seeing a page. Learn it as one ordered path instead of a pile of acronyms, because troubleshooting means walking that path in order.","es":"Redes es todo lo que debe funcionar entre pulsar un enlace y ver una página. Apréndelo como un camino ordenado y no como un montón de siglas, porque diagnosticar consiste en recorrer ese camino en orden."},"analogy":{"en":"Think of sending a parcel: the road network is the physical path, the address is the identifier, the courier receipt is the delivery guarantee, and the language of the letter inside is the application protocol. The limit of the analogy is that a parcel is one object moving once, while a network request is split into many packets that can travel different routes, arrive out of order and be sent again without anyone noticing.","es":"Piensa en enviar un paquete: la red de carreteras es el camino físico, la dirección es el identificador, el acuse del mensajero es la garantía de entrega y el idioma de la carta es el protocolo de aplicación. El límite es que un paquete viaja una vez, mientras una petición de red se divide en muchos paquetes que pueden ir por rutas distintas, llegar desordenados y reenviarse sin que nadie lo note."},"walkthrough":{"en":["Start with the name. The client has a hostname, not an address, so it asks a resolver for the address records of that name. This step can fail or return a stale answer on its own, which is why a name that resolves nowhere looks exactly like an application outage from the user side.","With an address in hand, the client needs a path. The operating system checks its routing table, picks a next hop, and asks the link layer for the hardware address of that next hop. Each router along the way repeats the same decision with its own table, so the path is chosen hop by hop rather than end to end.","The transport layer then sets up the conversation. If the protocol is TCP, both sides exchange a handshake and agree on sequence numbers, so lost segments can be detected and sent again. If the protocol is UDP or QUIC, the details differ, but the goal is the same: identify which program on the destination host should receive the data, using port numbers.","Finally the application protocol runs. The client sends an HTTP request with a method, a path and headers, and the server answers with a status code and a body. Only this exchange reports what the application decided, and even a success code is not proof that the business outcome is correct, so record how far the path got before it stopped."],"es":["Empieza por el nombre. El cliente tiene un nombre de host, no una dirección, así que pide a un resolutor los registros de dirección de ese nombre. Este paso puede fallar por sí solo, y por eso un nombre que no resuelve parece una caída de la aplicación desde el lado del usuario.","Con una dirección, el cliente necesita un camino. El sistema operativo consulta su tabla de rutas, elige un siguiente salto y pide a la capa de enlace la dirección física de ese salto. Cada router del camino repite la misma decisión con su propia tabla, así que la ruta se elige salto a salto y no de extremo a extremo.","Después la capa de transporte establece la conversación. Si el protocolo es TCP, ambos lados intercambian un saludo inicial y acuerdan números de secuencia, de modo que los segmentos perdidos se detectan y se reenvían. Si es UDP o QUIC los detalles cambian, pero el objetivo es el mismo: identificar con números de puerto qué programa del host destino debe recibir los datos.","Por último se ejecuta el protocolo de aplicación. El cliente envía una petición HTTP con método, ruta y cabeceras, y el servidor responde con un código de estado y un cuerpo. Solo este intercambio informa de lo que decidió la aplicación, y ni un código de éxito prueba que el resultado de negocio sea correcto, así que registra hasta dónde llegó el camino antes de detenerse."]},"pitfalls":{"en":["Reaching a port does not mean the application works. Connectivity, encryption and authorization are three separate tests and each can fail while the previous one passes.","Knowing the name of a managed service is not the same as knowing the request path. The service hides the operation, not the protocol behaviour you will have to reason about during an incident."],"es":["Alcanzar un puerto no significa que la aplicación funcione. Conectividad, cifrado y autorización son tres pruebas distintas y cada una puede fallar mientras la anterior pasa.","Conocer el nombre de un servicio gestionado no equivale a conocer el recorrido de la petición. El servicio oculta la operación, no el comportamiento del protocolo que tendrás que razonar durante un incidente."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html","label":"docs.aws.amazon.com: what is amazon vpc"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview","label":"developer.mozilla.org: Overview"}]}},{"id":"osi","parent":"networking","title":{"en":"OSI model: seven layers","es":"Modelo OSI: siete capas"},"summary":{"en":"Seven layers for understanding network responsibilities and locating a failure.","es":"Siete capas para entender las funciones de una red y localizar un fallo."},"details":{"en":["From bottom to top: physical, data link, network, transport, session, presentation and application. Senders encapsulate data; receivers decapsulate it. The Internet uses TCP/IP rather than seven independent OSI implementations. Session and presentation functions often live inside libraries or applications."],"es":["De abajo arriba: física, enlace de datos, red, transporte, sesión, presentación y aplicación. El emisor encapsula y el receptor desencapsula. Internet usa TCP/IP, no siete implementaciones OSI independientes. Las funciones de sesión y presentación suelen estar en bibliotecas o aplicaciones."]},"aws":{"en":"VPC routing is mainly L3, NLB exposes transport balancing, and ALB understands HTTP. These are useful abstractions, not exclusive service boundaries.","es":"El enrutamiento VPC es principalmente L3, NLB balancea transporte y ALB interpreta HTTP. Son abstracciones útiles, no límites exclusivos."},"question":{"en":"Why can TCP connect while HTTPS fails?","es":"¿Por qué puede conectarse TCP y fallar HTTPS?"},"answer":{"en":"Transport reachability does not validate certificates, hostname, HTTP routing or permissions. Inspect the first failing exchange higher in the stack.","es":"La conectividad de transporte no valida certificados, nombre, rutas HTTP ni permisos. Inspecciona el primer intercambio que falle más arriba."},"related":["troubleshooting"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"}],"level":"foundation","learning":{"definition":{"en":"The Open Systems Interconnection model, published by the International Organization for Standardization, describes communication as seven layers of responsibility: physical, data link, network, transport, session, presentation and application. A sender wraps data with the information each layer needs, an operation called encapsulation, and a receiver unwraps it in reverse order. The model is a vocabulary for dividing responsibilities and locating failures, not a description of the code actually running on the Internet.","es":"El modelo de Interconexión de Sistemas Abiertos, publicado por la Organización Internacional de Normalización, describe la comunicación como siete capas de responsabilidad: física, enlace de datos, red, transporte, sesión, presentación y aplicación. El emisor envuelve los datos con la información que necesita cada capa, operación llamada encapsulación, y el receptor los desenvuelve en orden inverso. El modelo es un vocabulario para dividir responsabilidades y localizar fallos, no una descripción del código que realmente corre en Internet."},"simple":{"en":"Seven named jobs, from cables at the bottom to your HTTP request at the top. In the model each job adds a wrapper on the way down and removes one on the way up, which is a teaching device rather than a count of real headers. Its value is telling you which question to ask next.","es":"Siete tareas con nombre, desde los cables abajo hasta tu petición HTTP arriba. En el modelo cada tarea añade una envoltura al bajar y retira una al subir, lo cual es un recurso didáctico y no un recuento de cabeceras reales. Su valor es indicarte qué pregunta hacer a continuación."},"analogy":{"en":"It is like a company where each department only knows its own task: one loads the truck, one writes the address, one keeps the delivery log, one translates the document. The limitation is that real departments overlap. The Internet runs the TCP/IP family, so several OSI jobs are merged into one protocol or handled inside an application library, and there is no requirement for seven separate headers on the wire.","es":"Es como una empresa donde cada departamento solo conoce su tarea: uno carga el camión, otro escribe la dirección, otro traduce el documento. La limitación es que los departamentos reales se solapan. Internet usa la familia TCP/IP, así que varias tareas OSI se fusionan en un solo protocolo o se resuelven dentro de una biblioteca, y no existe requisito de siete cabeceras separadas en el cable."},"walkthrough":{"en":["Read the layers as a stack of questions rather than a list of names. Layer one asks how a signal crosses a medium. Layer two asks how to reach a neighbour on the same local network. Layer three asks how to reach a machine on a different network. Layer four asks how to reach the right program and with what delivery guarantees.","The top three layers are about the conversation and its content. Layer five coordinates the beginning, synchronisation and end of a dialogue. Layer six deals with how data is represented so both sides interpret the same bytes the same way. Layer seven defines the protocol the two programs actually speak, such as HTTP or DNS.","Now map the model onto what really exists. TCP/IP has fewer layers than OSI, so OSI session and presentation work usually lives in application libraries: a TLS library encrypts, a JSON library serialises, a web framework manages login sessions. Treat the mapping as a teaching aid rather than a claim about implementations.","Use the model in incidents by finding the lowest layer that is clearly healthy, then testing only the next one up. If frames flow and addresses resolve but the handshake never completes, you have narrowed the problem to transport and below, which is a much smaller search space than the whole request."],"es":["Lee las capas como una pila de preguntas y no como una lista de nombres. La capa uno pregunta cómo cruza una señal un medio. La capa dos pregunta cómo alcanzar a un vecino de la misma red local. La capa tres pregunta cómo alcanzar una máquina de otra red. La capa cuatro pregunta cómo alcanzar el programa correcto y con qué garantías de entrega.","Las tres capas superiores tratan de la conversación y su contenido. La capa cinco coordina el inicio y el fin de un diálogo. La capa seis se ocupa de cómo se representan los datos para que ambos lados interpreten igual los mismos bytes. La capa siete define el protocolo que hablan los dos programas, como HTTP o DNS.","Ahora proyecta el modelo sobre lo que existe de verdad. TCP/IP tiene menos capas que OSI, así que el trabajo de sesión y presentación suele vivir en bibliotecas de la aplicación: una biblioteca TLS cifra, una biblioteca JSON serializa, un framework web gestiona sesiones de usuario. Trata la correspondencia como material didáctico y no como una afirmación sobre implementaciones.","Usa el modelo buscando la capa más baja claramente sana y probando solo la siguiente. Si circulan tramas y resuelven direcciones pero el saludo nunca se completa, has acotado el problema a transporte y por debajo, un espacio de búsqueda mucho menor que la petición entera."]},"pitfalls":{"en":["There are not seven OSI protocols in use. The Internet runs TCP/IP, and not every system implements every layer, so asking which layer a product belongs to often has no single correct answer.","A layer number is a label for a responsibility, not a boundary you can test directly. Products routinely cross layers, for example a load balancer that terminates encryption and also reads HTTP paths."],"es":["No hay siete protocolos OSI en uso. Internet usa TCP/IP y no todos los sistemas implementan todas las capas, así que preguntar a qué capa pertenece un producto a menudo no tiene una sola respuesta correcta.","Un número de capa es una etiqueta de responsabilidad, no una frontera que puedas probar directamente. Los productos cruzan capas con normalidad, por ejemplo un balanceador que termina el cifrado y además lee rutas HTTP."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"The seven layers, top to bottom","es":"Las siete capas, de arriba abajo"},"caption":{"en":"Every layer links to its own lesson, and on a layer page that layer is marked. OSI is a teaching model: the examples show where a technology is usually discussed, not a literal mapping of the Internet stack.","es":"Cada capa enlaza con su propia lección, y en la página de una capa esa capa aparece marcada. OSI es un modelo didáctico: los ejemplos indican dónde se suele situar cada tecnología, no una correspondencia literal de la pila de Internet."},"alt":{"en":"A stack of the seven OSI layers, from layer 7 application at the top down to layer 1 physical at the bottom. Each row names the layer, what it is responsible for and where a familiar technology is usually discussed.","es":"Una pila con las siete capas OSI, desde la capa 7 de aplicación arriba hasta la capa 1 física abajo. Cada fila indica la capa, de qué se ocupa y dónde se suele situar una tecnología conocida."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"What the request means: HTTP, DNS queries, SMTP.","es":"Qué significa la petición: HTTP, consultas DNS, SMTP."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"How data is represented: JSON or Protobuf encoding. TLS sits near this layer for teaching purposes, though it does not map to it literally.","es":"Cómo se representa el dato: codificación JSON o Protobuf. TLS se sitúa cerca de esta capa por motivos didácticos, aunque no le corresponde de forma literal."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinating a dialogue: whose turn it is, checkpoints, resuming after an interruption. A web login session is usually application state, not this layer.","es":"Coordinar un diálogo: a quién le toca hablar, puntos de control, reanudar tras una interrupción. La sesión de un login web suele ser estado de la aplicación, no de esta capa."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Ports and delivery guarantees: TCP segments with acknowledgements, UDP datagrams.","es":"Puertos y garantías de entrega: segmentos TCP con confirmaciones, datagramas UDP."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Addressing and routing between networks: IPv4 addresses, CIDR, route tables.","es":"Direccionamiento y enrutado entre redes: direcciones IPv4, CIDR, tablas de rutas."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Delivery across one link: Ethernet frames, MAC addresses, ARP.","es":"Entrega en un solo enlace: tramas Ethernet, direcciones MAC, ARP."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Signals on the medium: fibre, copper, radio, and the latency they impose.","es":"Señales en el medio: fibra, cobre, radio, y la latencia que imponen."}}]}]},{"id":"osi-1","parent":"osi","title":{"en":"Layer 1: Physical","es":"Capa 1: Física"},"summary":{"en":"How bits travel as electrical, optical or radio signals.","es":"Cómo viajan los bits mediante señales eléctricas, ópticas o de radio."},"details":{"en":["Signals, connectors and physical redundancy matter before packets move. Bandwidth measures capacity; latency measures delay. Two logical circuits can share a cable and fail together."],"es":["Las señales, conectores y redundancia física importan antes de mover paquetes. El ancho de banda mide capacidad; la latencia mide demora. Dos circuitos lógicos pueden compartir cable y fallar juntos."]},"aws":{"en":"Direct Connect depends on physical connectivity outside AWS as well as inside it.","es":"Direct Connect depende de conectividad física dentro y fuera de AWS."},"question":{"en":"Does more bandwidth always reduce latency?","es":"¿Más ancho de banda siempre reduce la latencia?"},"answer":{"en":"No. It helps congestion and transfer time, not the propagation distance or server processing time.","es":"No. Ayuda con congestión y transferencia, no con distancia de propagación o procesamiento del servidor."},"related":["physical-links"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}],"level":"foundation","learning":{"definition":{"en":"The physical layer covers the medium that carries signals and the technologies that put signals onto it: optical fibre, copper cabling, and radio through the air. It defines connectors, voltage or light levels, timing and transmission rates. Its only product is a stream of bits with no meaning attached. Two properties matter to everyone above it: capacity, which is how many bits per second the medium can carry, and delay, which is how long a bit takes to arrive.","es":"La capa física cubre el medio que transporta señales y las tecnologías que ponen señales en el: fibra óptica, cableado de cobre y radio por el aire. Define conectores, niveles de tensión o luz, temporización y velocidades de transmisión. Su único producto es un flujo de bits sin significado. Dos propiedades importan a todo lo que está encima: la capacidad, que es cuántos bits por segundo puede llevar el medio, y la demora, que es cuánto tarda en llegar un bit."},"simple":{"en":"This is the cables, the light, the radio and the connectors. It moves bits and knows nothing about addresses, packets or applications.","es":"Son los cables, la luz, la radio y los conectores. Mueve bits y no sabe nada de direcciones, paquetes ni aplicaciones."},"analogy":{"en":"It is the road surface under a delivery route: it sets how many trucks fit and how long the drive takes, but it never reads an address. The limitation is that roads are visibly separate, while two links you bought as independent circuits may share the same duct or the same fibre pair, so the redundancy you paid for exists on the diagram and not in the ground.","es":"Es el asfalto bajo una ruta de reparto: determina cuántos camiones caben y cuánto dura el viaje, pero nunca lee una dirección. La limitación es que las carreteras se ven separadas, mientras dos enlaces que compraste como circuitos independientes pueden compartir la misma canalización o el mismo par de fibra, así que la redundancia que pagaste existe en el diagrama y no en el terreno."},"walkthrough":{"en":["Separate the two numbers people confuse. Bandwidth is capacity per second and is set by the technology and the encoding on the medium. Latency is the time for a bit to get from one end to the other, and a large part of it is propagation, which is distance divided by the speed of the signal in the medium.","Recognise the technology families. Optical fibre carries light over long distances with low loss and is used for backbone and interconnection links. Copper serves shorter runs inside buildings and racks. Radio, including wireless and mobile access, trades reliability and shared capacity for the absence of a cable.","Then look at the product level. A dedicated interconnect such as Direct Connect terminates a fibre Ethernet cable from your router into a provider router at a physical location, with specific optics required for each speed. That requirement is a physical layer fact, which is why the lead time is weeks rather than minutes.","Finally draw the real dependencies. For each supposedly redundant path, write down the building, the duct, the provider and the power feed. Redundancy only holds when those lists differ, and the physical layer is where a shared element turns two logical paths into one failure."],"es":["Separa los dos números que se confunden. El ancho de banda es capacidad por segundo y lo fija la tecnología y la codificación del medio. La latencia es el tiempo que tarda un bit en cruzar de un extremo al otro, y una gran parte es la propagación, que es distancia dividida por la velocidad de la señal en el medio.","Reconoce las familias tecnológicas. La fibra óptica lleva luz a larga distancia con poca pérdida y se usa en enlaces troncales y de interconexión. El cobre sirve tramos cortos dentro de edificios y racks. La radio, incluyendo acceso inalámbrico y móvil, cambia fiabilidad y capacidad compartida por la ausencia de cable.","Después mira el nivel de producto. Una interconexión dedicada como Direct Connect termina un cable Ethernet de fibra desde tu router en un router del proveedor en una ubicación física, con ópticas concretas exigidas para cada velocidad. Ese requisito es un hecho de capa física, y por eso el plazo se mide en semanas y no en minutos.","Por último dibuja las dependencias reales. Para cada camino supuestamente redundante, anota el edificio, la canalización, el proveedor y la alimentación eléctrica. La redundancia solo se sostiene cuando esas listas difieren, y la capa física es donde un elemento compartido convierte dos caminos lógicos en un solo fallo."]},"pitfalls":{"en":["More bandwidth does not reduce propagation delay or server processing time. If a report is slow because of round trips, a bigger link changes almost nothing.","A healthy link light only proves that a signal is present. Errors, intermittent optics and a partner circuit that shares your duct all remain possible."],"es":["Más ancho de banda no reduce la demora de propagación ni el tiempo de proceso del servidor. Si un informe es lento por idas y vueltas, un enlace mayor cambia casi nada.","Una luz de enlace correcta solo prueba que hay señal. Siguen siendo posibles los errores, las ópticas intermitentes y un circuito socio que comparte tu canalización."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"The seven layers, top to bottom","es":"Las siete capas, de arriba abajo"},"caption":{"en":"Every layer links to its own lesson, and on a layer page that layer is marked. OSI is a teaching model: the examples show where a technology is usually discussed, not a literal mapping of the Internet stack.","es":"Cada capa enlaza con su propia lección, y en la página de una capa esa capa aparece marcada. OSI es un modelo didáctico: los ejemplos indican dónde se suele situar cada tecnología, no una correspondencia literal de la pila de Internet."},"alt":{"en":"A stack of the seven OSI layers, from layer 7 application at the top down to layer 1 physical at the bottom. Each row names the layer, what it is responsible for and where a familiar technology is usually discussed.","es":"Una pila con las siete capas OSI, desde la capa 7 de aplicación arriba hasta la capa 1 física abajo. Cada fila indica la capa, de qué se ocupa y dónde se suele situar una tecnología conocida."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"What the request means: HTTP, DNS queries, SMTP.","es":"Qué significa la petición: HTTP, consultas DNS, SMTP."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"How data is represented: JSON or Protobuf encoding. TLS sits near this layer for teaching purposes, though it does not map to it literally.","es":"Cómo se representa el dato: codificación JSON o Protobuf. TLS se sitúa cerca de esta capa por motivos didácticos, aunque no le corresponde de forma literal."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinating a dialogue: whose turn it is, checkpoints, resuming after an interruption. A web login session is usually application state, not this layer.","es":"Coordinar un diálogo: a quién le toca hablar, puntos de control, reanudar tras una interrupción. La sesión de un login web suele ser estado de la aplicación, no de esta capa."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Ports and delivery guarantees: TCP segments with acknowledgements, UDP datagrams.","es":"Puertos y garantías de entrega: segmentos TCP con confirmaciones, datagramas UDP."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Addressing and routing between networks: IPv4 addresses, CIDR, route tables.","es":"Direccionamiento y enrutado entre redes: direcciones IPv4, CIDR, tablas de rutas."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Delivery across one link: Ethernet frames, MAC addresses, ARP.","es":"Entrega en un solo enlace: tramas Ethernet, direcciones MAC, ARP."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Signals on the medium: fibre, copper, radio, and the latency they impose.","es":"Señales en el medio: fibra, cobre, radio, y la latencia que imponen."}}]}]},{"id":"osi-2","parent":"osi","title":{"en":"Layer 2: Data link","es":"Capa 2: Enlace de datos"},"summary":{"en":"How frames reach a device on the local network segment.","es":"Cómo llegan las tramas a un dispositivo del segmento de red local."},"details":{"en":["Ethernet uses MAC addresses for local delivery. Routers connect IP networks and create new link-layer frames at each hop. The next-hop MAC can change while the destination IP remains the same."],"es":["Ethernet usa MAC para entrega local. Los routers conectan redes IP y crean nuevas tramas en cada salto. La MAC siguiente puede cambiar mientras la IP destino permanece."]},"aws":{"en":"An ENI has a MAC address, but a VPC does not behave like a customer-managed Ethernet switch with ordinary broadcast.","es":"Una ENI tiene MAC, pero una VPC no se comporta como un switch Ethernet del cliente con broadcast convencional."},"question":{"en":"Does the destination MAC remain the same through every router?","es":"¿La MAC destino permanece igual al atravesar cada router?"},"answer":{"en":"No. Link-layer addresses identify the next local hop; IP addresses identify the routed destination unless NAT changes them.","es":"No. Las direcciones de enlace identifican el salto local; las IP identifican el destino enrutado salvo NAT."},"related":["ethernet","arp"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc826","label":"rfc-editor.org: rfc826"}],"level":"foundation","learning":{"definition":{"en":"The data link layer moves data between machines connected by the same link, once the physical layer exists. It groups bits into frames, adds hardware addresses so a neighbour recognises its own traffic, and checks for corruption. On Ethernet the layer is usually split into Media Access Control, which handles addressing and access to the link, and Logical Link Control. Its scope is one hop, not a path across the Internet.","es":"La capa de enlace de datos mueve datos entre máquinas conectadas por el mismo enlace, una vez existe la capa física. Agrupa bits en tramas, añade direcciones físicas para que un vecino reconozca su propio tráfico y comprueba la corrupción. En Ethernet la capa suele dividirse en Control de Acceso al Medio, que gestiona direccionamiento y acceso al enlace, y Control de Enlace Lógico. Su alcance es un salto, no un camino por Internet."},"simple":{"en":"This layer delivers a frame to the machine next door. It uses hardware addresses, it checks for damage, and it does not know or care where the traffic finally ends up.","es":"Esta capa entrega una trama a la máquina de al lado. Usa direcciones físicas, comprueba daños y no sabe ni le importa dónde acaba el tráfico."},"analogy":{"en":"It is the internal mail run of one building: the envelope is handed to a room number on this floor, and if it is torn on arrival it is thrown away rather than repaired. The limitation is that a building mail run has one route, while the link layer only ever handles the current hop. At every router the outer envelope is thrown away and rewritten with new hardware addresses.","es":"Es el reparto interno de un edificio: el sobre se entrega a un número de sala de esta planta y, si llega roto, se tira en vez de repararse. La limitación es que ese reparto tiene una sola ruta, mientras la capa de enlace solo maneja el salto actual. En cada router el sobre exterior se descarta y se reescribe con nuevas direcciones físicas."},"walkthrough":{"en":["Look at what a frame contains. There is a destination hardware address, a source hardware address, a field naming the protocol carried inside, the payload itself, and a checksum. Those hardware addresses are Media Access Control addresses, six bytes long, assigned to an interface rather than to a network position.","Now trace a packet leaving the local network. The sending host compares the destination address with its own network prefix, sees it is elsewhere, and builds a frame whose destination hardware address is the default router, not the remote server. The network layer destination inside is unchanged.","Repeat that at each hop. The router removes the incoming frame, decides where to forward, and builds a new frame with the hardware address of the next device. So the hardware addresses change continuously along the path while the network addresses inside typically stay the same, unless address translation rewrites them.","Then consider the cloud version. A virtual interface in a provider network has a hardware address and behaves like an Ethernet interface for most purposes, but the underlying network is software, so ordinary switch behaviour such as broadcast flooding and unrestricted address changes is not available to you."],"es":["Mira qué contiene una trama. Hay una dirección física de destino, una de origen, un campo que nombra el protocolo transportado dentro, la carga útil y una suma de verificación. Esas direcciones físicas son direcciones de Control de Acceso al Medio, de seis bytes, asignadas a una interfaz y no a una posición en la red.","Ahora sigue un paquete que sale de la red local. El host emisor compara la dirección destino con su propio prefijo de red, ve que está fuera y construye una trama cuya dirección física destino es el router por defecto, no el servidor remoto. El destino de capa de red que va dentro no cambia.","Repite eso en cada salto. El router retira la trama entrante, decide hacia dónde reenviar y construye una trama nueva con la dirección física del siguiente equipo. Así las direcciones físicas cambian continuamente por el camino mientras las direcciones de red interiores suelen mantenerse, salvo que una traducción de direcciones las reescriba.","Considera después la versión en nube. Una interfaz virtual de un proveedor tiene dirección física y se comporta como una interfaz Ethernet a casi todos los efectos, pero la red subyacente es software, así que comportamientos habituales de switch como la inundación por difusion o el cambio libre de direcciones no están a tu disposición."]},"pitfalls":{"en":["The destination hardware address does not survive a router. Reading a capture and expecting the remote server address in the frame leads to wrong conclusions.","Ethernet frame checking discards damaged frames rather than repairing them, so recovery falls to a higher layer. Other link layers differ: wireless links do retransmit locally."],"es":["La dirección física de destino no sobrevive a un router. Leer una captura esperando la dirección del servidor remoto en la trama lleva a conclusiones erróneas.","La comprobación de tramas de Ethernet descarta las dañadas en vez de repararlas, así que la recuperación recae en una capa superior. Otras capas de enlace difieren: los enlaces inalámbricos sí retransmiten localmente."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://www.rfc-editor.org/rfc/rfc826","label":"rfc-editor.org: rfc826"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"The seven layers, top to bottom","es":"Las siete capas, de arriba abajo"},"caption":{"en":"Every layer links to its own lesson, and on a layer page that layer is marked. OSI is a teaching model: the examples show where a technology is usually discussed, not a literal mapping of the Internet stack.","es":"Cada capa enlaza con su propia lección, y en la página de una capa esa capa aparece marcada. OSI es un modelo didáctico: los ejemplos indican dónde se suele situar cada tecnología, no una correspondencia literal de la pila de Internet."},"alt":{"en":"A stack of the seven OSI layers, from layer 7 application at the top down to layer 1 physical at the bottom. Each row names the layer, what it is responsible for and where a familiar technology is usually discussed.","es":"Una pila con las siete capas OSI, desde la capa 7 de aplicación arriba hasta la capa 1 física abajo. Cada fila indica la capa, de qué se ocupa y dónde se suele situar una tecnología conocida."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"What the request means: HTTP, DNS queries, SMTP.","es":"Qué significa la petición: HTTP, consultas DNS, SMTP."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"How data is represented: JSON or Protobuf encoding. TLS sits near this layer for teaching purposes, though it does not map to it literally.","es":"Cómo se representa el dato: codificación JSON o Protobuf. TLS se sitúa cerca de esta capa por motivos didácticos, aunque no le corresponde de forma literal."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinating a dialogue: whose turn it is, checkpoints, resuming after an interruption. A web login session is usually application state, not this layer.","es":"Coordinar un diálogo: a quién le toca hablar, puntos de control, reanudar tras una interrupción. La sesión de un login web suele ser estado de la aplicación, no de esta capa."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Ports and delivery guarantees: TCP segments with acknowledgements, UDP datagrams.","es":"Puertos y garantías de entrega: segmentos TCP con confirmaciones, datagramas UDP."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Addressing and routing between networks: IPv4 addresses, CIDR, route tables.","es":"Direccionamiento y enrutado entre redes: direcciones IPv4, CIDR, tablas de rutas."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Delivery across one link: Ethernet frames, MAC addresses, ARP.","es":"Entrega en un solo enlace: tramas Ethernet, direcciones MAC, ARP."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Signals on the medium: fibre, copper, radio, and the latency they impose.","es":"Señales en el medio: fibra, cobre, radio, y la latencia que imponen."}}]}]},{"id":"osi-3","parent":"osi","title":{"en":"Layer 3: Network","es":"Capa 3: Red"},"summary":{"en":"How IP addresses and routes move packets between networks.","es":"Cómo las direcciones IP y las rutas llevan paquetes entre redes."},"details":{"en":["IP provides best-effort packet delivery. Routing chooses a next hop; CIDR identifies address ranges; ICMP communicates errors and control information. IP alone does not guarantee ordering or delivery."],"es":["IP ofrece entrega de mejor esfuerzo. El enrutamiento elige el siguiente salto; CIDR identifica rangos e ICMP comunica errores y control. IP no garantiza entrega ni orden."]},"aws":{"en":"Plan VPC and subnet CIDRs before connecting accounts and on-premises networks. A route does not grant firewall access.","es":"Planifica CIDR de VPC y subredes antes de conectar cuentas y redes locales. Una ruta no concede acceso de firewall."},"question":{"en":"What else matters when a route exists but packets fail?","es":"¿Qué más importa si existe una ruta pero fallan paquetes?"},"answer":{"en":"Check the return path, overlap, filtering and destination health. Routing and permission are distinct.","es":"Comprueba retorno, solapamientos, filtros y salud del destino. Enrutamiento y permiso son distintos."},"related":["vpc"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc791","label":"rfc-editor.org: rfc791"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html","label":"docs.aws.amazon.com: VPC Route Tables"}],"level":"foundation","learning":{"definition":{"en":"The network layer gets a packet from one network to another. It gives every interface an address, and routers use those addresses to decide the next step toward the destination. Delivery is best effort: a packet may be dropped, delayed or delivered out of order, and nothing at this layer promises otherwise. On the Internet the protocols that do this work are IPv4 and IPv6.","es":"La capa de red lleva un paquete de una red a otra. Da una dirección a cada interfaz, y los routers usan esas direcciones para decidir el siguiente paso hacia el destino. La entrega es de mejor esfuerzo: un paquete puede descartarse, retrasarse o llegar desordenado, y nada en esta capa promete lo contrario. En Internet los protocolos que hacen ese trabajo son IPv4 e IPv6."},"simple":{"en":"This layer answers one question: which way out do I send this packet. It tries hard and guarantees nothing.","es":"Esta capa responde a una pregunta: por dónde envío este paquete. Lo intenta con ganas y no garantiza nada."},"analogy":{"en":"It is like a postal sorting centre reading a city on an envelope and sending the bag to the next centre, without ever tracking the item. The limitation is that a postal service accepts responsibility for the parcel, while this layer does not. If a packet is lost there is no retry here, and any guarantee has to be added by transport or by the application.","es":"Es como un centro postal que lee una ciudad en el sobre y envia la saca al siguiente centro, sin seguir nunca el envio. La limitación es que el correo asume responsabilidad del paquete y esta capa no. Si un paquete se pierde aqui no hay reintento, y cualquier garantía debe añadirla el transporte o la aplicación."},"walkthrough":{"en":["Split the address into two ideas. The address identifies an interface, and the prefix that accompanies it says which part of the address names the network. A host uses that split to decide whether a destination is a neighbour it can reach directly or somewhere it must send through a router.","Watch a router make its decision. It compares the destination address against the prefixes in its table and chooses the most specific match, then forwards out the interface associated with that entry. It rewrites the link layer framing, decreases the hop counter to prevent loops, and moves on without storing anything about the flow.","Remember that the reply is a separate decision. The destination host and every router on the way back run the same lookup with their own tables. A common cause of a half working path is a route that exists in one direction only.","Now bring in the platform. In a virtual private cloud you choose the address ranges and edit route tables whose entries pair a destination range with a target such as an internet gateway or a peering connection. The concept is unchanged, but a route existing there still does not mean a firewall will permit the traffic."],"es":["Divide la dirección en dos ideas. La dirección identifica una interfaz, y el prefijo que la acompaña dice qué parte de la dirección nombra la red. Un host usa esa división para decidir si un destino es un vecino al que llega directamente o algo a lo que debe enviar a través de un router.","Observa cómo decide un router. Compara la dirección destino con los prefijos de su tabla y elige la coincidencia más específica, y luego reenvía por la interfaz asociada a esa entrada. Reescribe el encuadre de enlace, reduce el contador de saltos para evitar bucles y sigue sin guardar nada sobre el flujo.","Recuerda que la respuesta es una decisión aparte. El host destino y cada router del camino de vuelta ejecutan la misma búsqueda con sus propias tablas. Una causa habitual de camino a medias es una ruta que existe solo en un sentido.","Trae ahora la plataforma. En una nube privada virtual eliges los rangos de direcciones y editas tablas de rutas cuyas entradas emparejan un rango destino con un objetivo como una pasarela de internet o una conexión de emparejamiento. El concepto no cambia, pero que exista una ruta ahí sigue sin significar que un firewall permita el tráfico."]},"pitfalls":{"en":["A route is a direction, not a permission. Filtering rules are evaluated separately, so a correct route table can still produce dropped traffic.","Overlapping address ranges cannot simply be connected later. Planning ranges before networks grow is much cheaper than renumbering them afterwards."],"es":["Una ruta es una dirección, no un permiso. Las reglas de filtrado se evaluan aparte, así que una tabla de rutas correcta puede aún descartar tráfico.","Los rangos de direcciones solapados no se pueden conectar sin más más adelante. Planificar los rangos antes de que crezcan las redes es mucho más barato que renumerarlos después."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc791","label":"rfc-editor.org: rfc791"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html","label":"docs.aws.amazon.com: VPC Route Tables"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"The seven layers, top to bottom","es":"Las siete capas, de arriba abajo"},"caption":{"en":"Every layer links to its own lesson, and on a layer page that layer is marked. OSI is a teaching model: the examples show where a technology is usually discussed, not a literal mapping of the Internet stack.","es":"Cada capa enlaza con su propia lección, y en la página de una capa esa capa aparece marcada. OSI es un modelo didáctico: los ejemplos indican dónde se suele situar cada tecnología, no una correspondencia literal de la pila de Internet."},"alt":{"en":"A stack of the seven OSI layers, from layer 7 application at the top down to layer 1 physical at the bottom. Each row names the layer, what it is responsible for and where a familiar technology is usually discussed.","es":"Una pila con las siete capas OSI, desde la capa 7 de aplicación arriba hasta la capa 1 física abajo. Cada fila indica la capa, de qué se ocupa y dónde se suele situar una tecnología conocida."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"What the request means: HTTP, DNS queries, SMTP.","es":"Qué significa la petición: HTTP, consultas DNS, SMTP."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"How data is represented: JSON or Protobuf encoding. TLS sits near this layer for teaching purposes, though it does not map to it literally.","es":"Cómo se representa el dato: codificación JSON o Protobuf. TLS se sitúa cerca de esta capa por motivos didácticos, aunque no le corresponde de forma literal."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinating a dialogue: whose turn it is, checkpoints, resuming after an interruption. A web login session is usually application state, not this layer.","es":"Coordinar un diálogo: a quién le toca hablar, puntos de control, reanudar tras una interrupción. La sesión de un login web suele ser estado de la aplicación, no de esta capa."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Ports and delivery guarantees: TCP segments with acknowledgements, UDP datagrams.","es":"Puertos y garantías de entrega: segmentos TCP con confirmaciones, datagramas UDP."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Addressing and routing between networks: IPv4 addresses, CIDR, route tables.","es":"Direccionamiento y enrutado entre redes: direcciones IPv4, CIDR, tablas de rutas."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Delivery across one link: Ethernet frames, MAC addresses, ARP.","es":"Entrega en un solo enlace: tramas Ethernet, direcciones MAC, ARP."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Signals on the medium: fibre, copper, radio, and the latency they impose.","es":"Señales en el medio: fibra, cobre, radio, y la latencia que imponen."}}]}]},{"id":"osi-4","parent":"osi","title":{"en":"Layer 4: Transport","es":"Capa 4: Transporte"},"summary":{"en":"How applications use ports and exchange data through TCP or UDP.","es":"Cómo las aplicaciones usan puertos e intercambian datos mediante TCP o UDP."},"details":{"en":["Transport protocols identify application endpoints with ports. TCP supplies an ordered byte stream and congestion control; UDP does not supply those guarantees. Applications can add reliability above UDP."],"es":["Los protocolos de transporte identifican extremos con puertos. TCP aporta bytes ordenados y control de congestión; UDP no ofrece esas garantías. Las aplicaciones pueden añadir fiabilidad sobre UDP."]},"aws":{"en":"NLB listeners and many security-group rules concern transport protocols. TLS listeners demonstrate why service-to-layer mappings are not absolute.","es":"Listeners NLB y muchas reglas SG afectan a transporte. Los listeners TLS muestran que las correspondencias no son absolutas."},"question":{"en":"Does TCP guarantee a payment is processed exactly once?","es":"¿TCP garantiza que un pago se procese exactamente una vez?"},"answer":{"en":"No. After a lost response an application retry can repeat a business action. Use business-level idempotency.","es":"No. Tras perder una respuesta, un reintento puede repetir una acción. Usa idempotencia de negocio."},"related":["load-balancing"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"},{"url":"https://www.rfc-editor.org/rfc/rfc768","label":"rfc-editor.org: rfc768"}],"level":"foundation","learning":{"definition":{"en":"The transport layer connects programs rather than machines. It uses port numbers so a host can tell which application a packet belongs to, and it decides what quality of delivery the application gets. The two common choices differ on purpose: the Transmission Control Protocol works to deliver data in order and without loss, while the User Datagram Protocol sends independent messages with no such promise.","es":"La capa de transporte conecta programas, no máquinas. Usa números de puerto para que un host sepa a qué aplicación pertenece un paquete, y decide qué calidad de entrega recibe la aplicación. Las dos opciones habituales difieren a propósito: el Protocolo de Control de Transmisión trabaja para entregar los datos en orden y sin pérdidas, mientras el Protocolo de Datagramas de Usuario envia mensajes independientes sin esa promesa."},"simple":{"en":"This layer picks the right program on the destination host and decides how hard the network should try to deliver your data.","es":"Esta capa elige el programa correcto en el host destino y decide con cuánto empeño debe la red entregar tus datos."},"analogy":{"en":"A port is like a department extension at a company switchboard, and the protocol choice is like paying for tracked delivery or ordinary post. The limitation is that tracked delivery only confirms that bytes arrived. It says nothing about whether the recipient acted on them, so a confirmed delivery and a completed business action are different facts.","es":"Un puerto es como una extensión de departamento en una centralita, y la elección de protocolo es como pagar envio con seguimiento o correo ordinario. La limitación es que el seguimiento solo confirma que llegaron bytes. No dice si el destinatario actuo sobre ellos, así que una entrega confirmada y una acción de negocio completada son hechos distintos."},"walkthrough":{"en":["Identify a conversation the way the stack does. A connection is identified by four values: source address, source port, destination address and destination port. The server listens on a well known port while the client takes a temporary one, which is why one server port can serve thousands of simultaneous clients.","Choose the protocol by requirement, not by reputation. Pick the reliable stream when every byte matters and order matters, such as a database query or a file transfer. Pick datagrams when a late message is worthless and the application can tolerate or repair loss, such as live audio or simple lookups.","Be precise about what reliability means. The reliable protocol will retransmit lost segments and deliver bytes to the application in order. It cannot tell you whether the server processed a request, because a response can be lost after the work was done. Business level safety needs an idempotency key or a deduplication check.","See how this appears in products. Security group rules and load balancer listeners are written in terms of protocol and port, so transport is the layer you configure most often. A listener that terminates encryption shows that products do not map cleanly onto a single layer."],"es":["Identifica una conversación como lo hace la pila. Una conexión se identifica con cuatro valores: dirección y puerto de origen, dirección y puerto de destino. El servidor escucha en un puerto conocido y el cliente toma uno temporal, y por eso un solo puerto de servidor puede atender a miles de clientes simultáneos.","Elige el protocolo por requisito, no por fama. Usa el flujo fiable cuando importa cada byte y el orden, como en una consulta a base de datos o una transferencia de ficheros. Usa datagramas cuando un mensaje tardío no vale nada y la aplicación tolera o repara la pérdida, como en audio en directo o consultas sencillas.","Se preciso con lo que significa fiabilidad. El protocolo fiable retransmitirá segmentos perdidos y entregara los bytes en orden a la aplicación. No puede decirte si el servidor proceso una petición, porque una respuesta puede perderse después de hacerse el trabajo. La seguridad a nivel de negocio necesita una clave de idempotencia o una comprobación de duplicados.","Observa cómo aparece esto en los productos. Las reglas de los grupos de seguridad y los listeners de un balanceador se escriben con protocolo y puerto, así que transporte es la capa que más configuras. Un listener que termina cifrado muestra que los productos no encajan limpiamente en una sola capa."]},"pitfalls":{"en":["A successful connection proves only that two programs can exchange bytes. Authentication, authorization and correct application behaviour are still untested.","Datagrams are not automatically faster in practice. Without loss recovery an application may end up waiting longer, or delivering wrong results, than it would with a reliable stream."],"es":["Una conexión correcta solo prueba que dos programas pueden intercambiar bytes. La autenticación, la autorización y el comportamiento correcto de la aplicación siguen sin probarse.","Los datagramas no son automáticamente más rápidos en la práctica. Sin recuperación de pérdidas una aplicación puede acabar esperando más, o entregando resultados erróneos, que con un flujo fiable."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"},{"url":"https://www.rfc-editor.org/rfc/rfc768","label":"rfc-editor.org: rfc768"},{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"The seven layers, top to bottom","es":"Las siete capas, de arriba abajo"},"caption":{"en":"Every layer links to its own lesson, and on a layer page that layer is marked. OSI is a teaching model: the examples show where a technology is usually discussed, not a literal mapping of the Internet stack.","es":"Cada capa enlaza con su propia lección, y en la página de una capa esa capa aparece marcada. OSI es un modelo didáctico: los ejemplos indican dónde se suele situar cada tecnología, no una correspondencia literal de la pila de Internet."},"alt":{"en":"A stack of the seven OSI layers, from layer 7 application at the top down to layer 1 physical at the bottom. Each row names the layer, what it is responsible for and where a familiar technology is usually discussed.","es":"Una pila con las siete capas OSI, desde la capa 7 de aplicación arriba hasta la capa 1 física abajo. Cada fila indica la capa, de qué se ocupa y dónde se suele situar una tecnología conocida."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"What the request means: HTTP, DNS queries, SMTP.","es":"Qué significa la petición: HTTP, consultas DNS, SMTP."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"How data is represented: JSON or Protobuf encoding. TLS sits near this layer for teaching purposes, though it does not map to it literally.","es":"Cómo se representa el dato: codificación JSON o Protobuf. TLS se sitúa cerca de esta capa por motivos didácticos, aunque no le corresponde de forma literal."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinating a dialogue: whose turn it is, checkpoints, resuming after an interruption. A web login session is usually application state, not this layer.","es":"Coordinar un diálogo: a quién le toca hablar, puntos de control, reanudar tras una interrupción. La sesión de un login web suele ser estado de la aplicación, no de esta capa."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Ports and delivery guarantees: TCP segments with acknowledgements, UDP datagrams.","es":"Puertos y garantías de entrega: segmentos TCP con confirmaciones, datagramas UDP."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Addressing and routing between networks: IPv4 addresses, CIDR, route tables.","es":"Direccionamiento y enrutado entre redes: direcciones IPv4, CIDR, tablas de rutas."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Delivery across one link: Ethernet frames, MAC addresses, ARP.","es":"Entrega en un solo enlace: tramas Ethernet, direcciones MAC, ARP."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Signals on the medium: fibre, copper, radio, and the latency they impose.","es":"Señales en el medio: fibra, cobre, radio, y la latencia que imponen."}}]}]},{"id":"osi-5","parent":"osi","title":{"en":"Layer 5: Session","es":"Capa 5: Sesión"},"summary":{"en":"How a dialogue is established, coordinated and resumed in the OSI model.","es":"Cómo se establece, coordina y reanuda un diálogo en el modelo OSI."},"details":{"en":["OSI session functions establish, coordinate and recover conversations. Modern applications often implement these themselves. An HTTP login session, TCP connection and TLS session are different objects."],"es":["Las funciones OSI de sesión establecen, coordinan y recuperan conversaciones. Las aplicaciones modernas suelen implementarlas. Una sesión de usuario HTTP, conexión TCP y sesión TLS son objetos distintos."]},"aws":{"en":"External session state can make application instances replaceable, but requires expiry and resilience decisions.","es":"El estado externo permite sustituir instancias, pero necesita decisiones de caducidad y resiliencia."},"question":{"en":"What happens to sessions when an instance is replaced?","es":"¿Qué ocurre con las sesiones al sustituir una instancia?"},"answer":{"en":"Local-memory state can be lost. Externalize required state or use validated tokens with explicit expiry and revocation behavior.","es":"Puede perderse el estado local. Externaliza lo necesario o usa tokens validados con caducidad y revocación explícitas."},"related":["sessions"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x","label":"developer.mozilla.org: Connection management in HTTP 1.x"}],"level":"foundation","learning":{"definition":{"en":"The session layer coordinates a conversation between two applications over time. It is responsible for starting a dialogue, keeping the two sides synchronised while it lasts, and ending or resuming it cleanly. In the OSI description, protocols for shared files and shared resources are typical examples. On the Internet there is no separate session protocol under most traffic, so this coordination is usually written into the application or a library it uses.","es":"La capa de sesión coordina una conversación entre dos aplicaciones a lo largo del tiempo. Se encarga de iniciar un diálogo, mantener sincronizados los dos lados mientras dura y terminarlo o reanudarlo limpiamente. En la descripción OSI, los protocolos de ficheros y recursos compartidos son ejemplos típicos. En Internet no hay un protocolo de sesión aparte bajo la mayoría del tráfico, así que esa coordinación se escribe en la aplicación o en una biblioteca que usa."},"simple":{"en":"This layer is about the conversation as a whole rather than one message: who is talking, since when, and where it should continue from.","es":"Esta capa trata la conversación completa y no un mensaje: quién habla, desde cuando y desde dónde debe continuar."},"analogy":{"en":"It is like the record a bank clerk keeps of an appointment: your identity is confirmed once and each new question continues the same visit. The limitation is that a clerk is one person with one memory, while your requests can land on any server behind a load balancer. If that memory lives only in the server that first answered, the conversation breaks when that server is replaced.","es":"Es como el registro que lleva un empleado de banco de una cita: tu identidad se confirma una vez y cada nueva pregunta continua la misma visita. La limitación es que el empleado es una persona con una memoria, mientras tus peticiones pueden caer en cualquier servidor detras de un balanceador. Si esa memoria vive solo en el servidor que respondió primero, la conversación se rompe cuando se sustituye ese servidor."},"walkthrough":{"en":["Separate three things that all get called a session. A transport connection is a byte pipe between two sockets. A security session is the negotiated encryption state that can be resumed. A user session is the application record that you are logged in. They have different lifetimes and different owners.","Decide where the state lives, because it always lives somewhere. Keeping it in the memory of one instance is fast and fragile. Keeping it in a shared store or a database survives instance replacement at the cost of a network call. Putting it in a signed token the client carries removes the lookup, but you then need expiry and a revocation plan.","Design the end of the session as deliberately as the start. Decide the idle timeout, the absolute maximum lifetime, what happens on a password change, and how a compromised token is invalidated. Sessions that only ever expire by inactivity are a common security finding.","Then read stickiness correctly. A load balancer can send a client back to the same target, which improves cache locality and hides local state for a while. It is a performance feature, and it does not remove the need for state that survives a failed instance."],"es":["Separa tres cosas que se llaman sesión. Una conexión de transporte es una tuberia de bytes entre dos sockets. Una sesión de seguridad es el estado de cifrado negociado que se puede reanudar. Una sesión de usuario es el registro de la aplicación de que has iniciado sesión. Tienen duraciones y dueños distintos.","Decide dónde vive el estado, porque siempre vive en algun sitio. Guardarlo en la memoria de una instancia es rápido y frágil. Guardarlo en un almacén compartido o una base de datos sobrevive a la sustitucion de instancias a costa de una llamada de red. Ponerlo en un token firmado que lleva el cliente elimina la consulta, pero entonces necesitas caducidad y un plan de revocación.","Diseña el final de la sesión con el mismo cuidado que el inicio. Decide el tiempo de inactividad, la duración máxima absoluta, qué ocurre al cambiar la contraseña y cómo se invalida un token comprometido. Las sesiones que solo caducan por inactividad son un hallazgo de seguridad frecuente.","Interpreta después bien la afinidad. Un balanceador puede devolver a un cliente al mismo destino, lo que mejora la localidad de caché y esconde el estado local un tiempo. Es una función de rendimiento y no elimina la necesidad de un estado que sobreviva a una instancia caída."]},"pitfalls":{"en":["A session is not a synonym for a transport connection. Treating them as the same thing produces logins that vanish on redeployment and tokens that outlive their owner.","Keep alive on a connection does not refresh authentication. Only the application decides whether credentials are still valid."],"es":["Sesión no es sinónimo de conexión de transporte. Tratarlas como lo mismo produce inicios de sesión que desaparecen al redespliegue y tokens que sobreviven a su dueño.","El mantenimiento de una conexión no renueva la autenticación. Solo la aplicación decide si las credenciales siguen siendo validas."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/osi-model/","label":"aws.amazon.com: osi model"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x","label":"developer.mozilla.org: Connection management in HTTP 1.x"}]},"diagrams":[{"id":"osi-stack","kind":"stack","interactive":true,"nodes":["osi","osi-1","osi-2","osi-3","osi-4","osi-5","osi-6","osi-7"],"title":{"en":"The seven layers, top to bottom","es":"Las siete capas, de arriba abajo"},"caption":{"en":"Every layer links to its own lesson, and on a layer page that layer is marked. OSI is a teaching model: the examples show where a technology is usually discussed, not a literal mapping of the Internet stack.","es":"Cada capa enlaza con su propia lección, y en la página de una capa esa capa aparece marcada. OSI es un modelo didáctico: los ejemplos indican dónde se suele situar cada tecnología, no una correspondencia literal de la pila de Internet."},"alt":{"en":"A stack of the seven OSI layers, from layer 7 application at the top down to layer 1 physical at the bottom. Each row names the layer, what it is responsible for and where a familiar technology is usually discussed.","es":"Una pila con las siete capas OSI, desde la capa 7 de aplicación arriba hasta la capa 1 física abajo. Cada fila indica la capa, de qué se ocupa y dónde se suele situar una tecnología conocida."},"items":[{"number":"7","node":"osi-7","label":{"en":"Application","es":"Aplicación"},"detail":{"en":"What the request means: HTTP, DNS queries, SMTP.","es":"Qué significa la petición: HTTP, consultas DNS, SMTP."}},{"number":"6","node":"osi-6","label":{"en":"Presentation","es":"Presentación"},"detail":{"en":"How data is represented: JSON or Protobuf encoding. TLS sits near this layer for teaching purposes, though it does not map to it literally.","es":"Cómo se representa el dato: codificación JSON o Protobuf. TLS se sitúa cerca de esta capa por motivos didácticos, aunque no le corresponde de forma literal."}},{"number":"5","node":"osi-5","label":{"en":"Session","es":"Sesión"},"detail":{"en":"Coordinating a dialogue: whose turn it is, checkpoints, resuming after an interruption. A web login session is usually application state, not this layer.","es":"Coordinar un diálogo: a quién le toca hablar, puntos de control, reanudar tras una interrupción. La sesión de un login web suele ser estado de la aplicación, no de esta capa."}},{"number":"4","node":"osi-4","label":{"en":"Transport","es":"Transporte"},"detail":{"en":"Ports and delivery guarantees: TCP segments with acknowledgements, UDP datagrams.","es":"Puertos y garantías de entrega: segmentos TCP con confirmaciones, datagramas UDP."}},{"number":"3","node":"osi-3","label":{"en":"Network","es":"Red"},"detail":{"en":"Addressing and routing between networks: IPv4 addresses, CIDR, route tables.","es":"Direccionamiento y enrutado entre redes: direcciones IPv4, CIDR, tablas de rutas."}},{"number":"2","node":"osi-2","label":{"en":"Data link","es":"Enlace de datos"},"detail":{"en":"Delivery across one link: Ethernet frames, MAC addresses, ARP.","es":"Entrega en un solo enlace: tramas Ethernet, direcciones MAC, ARP."}},{"number":"1","node":"osi-1","label":{"en":"Physical","es":"Física"},"detail":{"en":"Signals on the medium: fibre, copper, radio, and the latency they impose.","es":"Señales en el medio: fibra, cobre, radio, y la latencia que imponen."}}]}]},{"id":"osi-6","parent":"osi","title":{"en":"Layer 6: Presentation","es":"Capa 6: Presentación"},"summary":{"en":"How systems agree on the representation of exchanged data.","es":"Cómo acuerdan los sistemas la representación de los datos que intercambian."},"details":{"en":["Presentation functions make data interpretable. TLS is often taught here because it protects data in transit, but real TLS runs above transport and is not literally a separate OSI layer-six implementation."],"es":["La presentación hace interpretables los datos. TLS suele enseñarse aquí por proteger datos en tránsito, pero opera sobre transporte y no implementa literalmente una capa OSI seis separada."]},"aws":{"en":"ACM certificates and TLS termination are deployment choices; JSON and UTF-8 are compatibility choices.","es":"Certificados ACM y terminación TLS son decisiones de despliegue; JSON y UTF-8 son decisiones de compatibilidad."},"question":{"en":"Is Base64 a security control?","es":"¿Base64 es un control de seguridad?"},"answer":{"en":"No. It can be decoded without a key. Encoding changes representation; encryption protects confidentiality.","es":"No. Se decodifica sin clave. Codificar cambia la representación; cifrar protege confidencialidad."},"related":["serialization","tls"],"sources":[{"label":"OSI model","url":"https://aws.amazon.com/what-is/osi-model/"},{"url":"https://www.rfc-editor.org/rfc/rfc3629","label":"rfc-editor.org: rfc3629"},{"url":"https://www.rfc-editor.org/rfc/rfc8259","label":"rfc-editor.org: rfc8259"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Base64","label":"developer.mozilla.org: Base64"}],"level":"foundation","learning":{"definition":{"en":"The presentation layer is about the form of the data rather than its delivery. It covers how characters, numbers and structures are represented as bytes so that a receiver written by someone else can interpret them correctly. Character encodings such as UTF-8, and data formats such as JSON or comma separated values, belong to this idea. Compression and encryption are also commonly taught here because they transform the representation before it is sent.","es":"La capa de presentación trata la forma de los datos y no su entrega. Cubre cómo se representan como bytes los caracteres, los números y las estructuras para que un receptor escrito por otra persona los interprete correctamente. Las codificaciones de caracteres como UTF-8 y los formatos como JSON o valores separados por comas pertenecen a esta idea. La compresión y el cifrado también se enseñan aqui porque transforman la representación antes del envio."},"simple":{"en":"This layer makes sure both sides read the same bytes the same way: the alphabet, the structure and any transformation applied before sending.","es":"Esta capa asegura que ambos lados leen igual los mismos bytes: el alfabeto, la estructura y cualquier transformación aplicada antes de enviar."},"analogy":{"en":"It is like agreeing on a language and a document template before writing a contract, so nothing is misread. The limitation is that agreeing on a language does not keep the contract private. Encoding and encryption are different operations: anyone can read a document in a shared language, and only a key holder can read an encrypted one.","es":"Es como acordar un idioma y una plantilla de documento antes de escribir un contrato, para que nada se malinterprete. La limitación es que acordar un idioma no mantiene privado el contrato. Codificar y cifrar son operaciones distintas: cualquiera puede leer un documento en un idioma compartido y solo quien tiene la clave puede leer uno cifrado."},"walkthrough":{"en":["Start with characters. UTF-8 represents the whole universal character set while keeping plain English text byte identical to older ASCII, which is why it became the safe default. Declare it explicitly, because a mismatch shows up as damaged names and symbols rather than as an error.","Separate three transformations that people mix. Encoding changes representation, for example writing binary as text with Base64 so it can travel inside a text field. Compression reduces size and costs processor time. Encryption protects confidentiality and needs a key. Only the third is a security control.","Then guard the meaning, not just the syntax. A payload can parse perfectly and still be wrong if a timestamp changes from seconds to milliseconds, a currency amount switches units, or an optional field becomes required. Agree on types and units, version your schema, and make consumers tolerant of unknown fields.","Finally place the platform pieces. A certificate manager and a load balancer listener decide where encryption is applied and where it ends. Choosing UTF-8 and JSON is a compatibility decision inside your interface. Both are implementation choices layered on top of the concepts above."],"es":["Empieza por los caracteres. UTF-8 representa todo el conjunto universal de caracteres manteniendo el texto inglés simple idéntico byte a byte al antiguo ASCII, y por eso se volvió el valor por defecto seguro. Decláralo de forma explícita, porque una discrepancia aparece como nombres y símbolos dañados y no como un error.","Separa tres transformaciones que se confunden. Codificar cambia la representación, por ejemplo escribir binario como texto con Base64 para que viaje dentro de un campo de texto. Comprimir reduce el tamaño y cuesta procesador. Cifrar protege la confidencialidad y necesita una clave. Solo la tercera es un control de seguridad.","Protege después el significado y no solo la sintaxis. Una carga puede analizarse perfectamente y ser incorrecta si una marca de tiempo pasa de segundos a milisegundos, un importe cambia de unidad o un campo opcional se vuelve obligatorio. Acuerda tipos y unidades, versiona el esquema y haz tolerantes a los consumidores ante campos desconocidos.","Por último coloca las piezas de plataforma. Un gestor de certificados y un listener de balanceador deciden donde se aplica el cifrado y donde termina. Elegir UTF-8 y JSON es una decisión de compatibilidad dentro de tu interfaz. Ambas son elecciones de implementación apoyadas en los conceptos anteriores."]
