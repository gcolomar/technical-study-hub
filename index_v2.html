dth and shorter lead times.","Then choose the virtual interface type. A private one reaches a VPC or a Direct Connect gateway. A public one reaches public AWS endpoints. A transit one reaches a transit gateway through a Direct Connect gateway.","Treat encryption explicitly, because Direct Connect does not encrypt your traffic by default. MAC Security, abbreviated MACsec, adds layer 2 encryption over the cross connect, and AWS notes it is point to point only."],"es":["En internet público tu tráfico cruza redes que no posees ni observas, así que la latencia varía con la congestión ajena. Un circuito dedicado da un camino y una capacidad conocidos, lo que compra previsibilidad.","Elige primero la forma de conexión. Una conexión dedicada es un puerto físico asignado a ti en una ubicación de Direct Connect. Una alojada llega por un partner de AWS y encaja con menos ancho de banda.","Después elige el tipo de interfaz virtual. Una privada alcanza una VPC o una pasarela de Direct Connect. Una pública alcanza puntos de enlace públicos. Una de tránsito alcanza una pasarela de tránsito mediante una pasarela de Direct Connect.","Trata el cifrado de forma explícita, porque Direct Connect no cifra tu tráfico por defecto. MAC Security, abreviado MACsec, añade cifrado de capa 2 sobre la interconexión, y AWS señala que solo es punto a punto."]},"pitfalls":{"en":["A private circuit is not encrypted traffic. State where encryption starts, where it ends and which mechanism protects each segment before signing a compliance claim.","Two virtual interfaces on one physical connection are not resilience. They share the cable, the port and often the building."],"es":["Un circuito privado no es tráfico cifrado. Indica dónde empieza y acaba el cifrado y qué mecanismo protege cada segmento antes de firmar un cumplimiento.","Dos interfaces virtuales sobre una conexión física no son resiliencia. Comparten cable, puerto y a menudo edificio."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html","label":"docs.aws.amazon.com: MACsec"}]}},{"id":"vpn","parent":"hybrid","title":{"en":"Site-to-Site VPN","es":"VPN Site-to-Site"},"summary":{"en":"Connect networks through encrypted IPsec tunnels, with routes and failover configured explicitly.","es":"Conecta redes mediante túneles IPsec cifrados, configurando rutas y recuperación ante fallos."},"details":{"en":["Site-to-Site VPN connects a customer gateway to AWS using IPsec. A connection has two tunnels, but the customer router and upstream path may remain single points of failure. Dynamic routing can use BGP; static routes have different operations. Encryption overhead and tunnel limits affect capacity."],"es":["Site-to-Site VPN conecta un customer gateway con AWS por IPsec. Tiene dos túneles, pero el router y acceso del cliente pueden seguir siendo puntos únicos de fallo. El enrutamiento dinámico puede usar BGP; el estático opera distinto. Cifrado y límites afectan capacidad."]},"aws":{"en":"VPN can provide quick initial connectivity or Direct Connect backup. Test convergence and capacity under failure.","es":"VPN permite conexión inicial rápida o respaldo de Direct Connect. Prueba convergencia y capacidad ante fallo."},"question":{"en":"Do two healthy tunnels guarantee resilience?","es":"¿Dos túneles sanos garantizan resiliencia?"},"answer":{"en":"No. Verify router diversity, route selection and failover. Two tunnels through one router cannot survive that router failing.","es":"No. Verifica diversidad de routers, rutas y conmutación. Dos túneles por un router no sobreviven a su caída."},"related":["direct-connect","bgp","mtu"],"sources":[{"label":"AWS Site-to-Site VPN","url":"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}],"level":"applied","learning":{"definition":{"en":"AWS Site to Site VPN connects your own on premises network to your VPCs using Internet Protocol security, abbreviated IPsec, which provides the authentication and encryption. It runs between a customer gateway representing your device and a target gateway on the AWS side, either a virtual private gateway or a transit gateway.","es":"AWS Site to Site VPN conecta tu red local con tus VPC usando Internet Protocol security, abreviado IPsec, que aporta la autenticación y el cifrado. Funciona entre una customer gateway que representa tu dispositivo y una pasarela de destino en el lado de AWS, ya sea privada virtual o de tránsito."},"simple":{"en":"In its common form, an IPsec tunnel from your network to AWS over the internet. You still design the routing and failure modes.","es":"En su forma habitual, un túnel IPsec de tu red hacia AWS por internet. Sigues diseñando el enrutamiento y los modos de fallo."},"analogy":{"en":"An armoured courier on public roads: the contents are protected and the route is whatever the public network offers today. The limitation: armour solves confidentiality only, and does nothing for congestion or for one router failing at your end.","es":"Un mensajero blindado por carreteras públicas: el contenido está protegido y la ruta es la que ofrezca hoy la red pública. La limitación: el blindaje solo resuelve la confidencialidad, y no hace nada por la congestión ni por un enrutador que falla en tu lado."},"walkthrough":{"en":["A tunnel wraps each original packet inside a new one addressed between two endpoints. Tunnelling by itself does not make the payload unreadable; IPsec adds that. The larger header also reduces usable payload size.","Routing is either static, where you declare the remote prefixes, or dynamic with BGP, which is preferable because it adapts automatically as prefixes and path availability change.","Each VPN connection has two tunnels, which AWS provides for availability. Whether both carry traffic at once depends on the gateway and your routing: a transit gateway supports equal cost multipath, and a virtual private gateway does not.","A VPN gives a working private path while Direct Connect is provisioned, and serves as a backup once you confirm it absorbs production load. Verify throughput and convergence, not tunnel status."],"es":["Un túnel envuelve cada paquete original en otro dirigido entre dos extremos. El túnel por sí solo no hace ilegible la carga; eso lo añade IPsec. La cabecera mayor también reduce el tamaño útil de carga.","El enrutamiento es estático, donde declaras los prefijos remotos, o dinámico con BGP, que es preferible porque se adapta solo cuando cambian los prefijos y la disponibilidad de los caminos.","Cada conexión VPN tiene dos túneles, que AWS ofrece para disponibilidad. Que los dos lleven tráfico a la vez depende de la pasarela: una de tránsito admite caminos de igual coste, y una privada virtual no.","Una VPN da un camino privado mientras se aprovisiona Direct Connect, y sirve de respaldo si confirmas que absorbe la carga de producción. Verifica rendimiento y convergencia, no el estado del túnel."]},"pitfalls":{"en":["Two healthy tunnels do not guarantee resilience. If both terminate on one customer router, that component still takes the connection down.","A VPN inherits internet performance, and encryption overhead reduces usable throughput, so do not promise Direct Connect style predictability on it."],"es":["Dos túneles sanos no garantizan resiliencia. Si los dos terminan en un enrutador de cliente, ese componente sigue tirando la conexión.","Una VPN hereda el rendimiento de internet, y el cifrado reduce el rendimiento útil, así que no prometas sobre ella previsibilidad de estilo Direct Connect."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html","label":"docs.aws.amazon.com: VPC VPN"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}]}},{"id":"bgp","parent":"hybrid","title":{"en":"BGP and route preference","es":"BGP y preferencia de rutas"},"summary":{"en":"Exchange network reachability between routers and select paths using routing policies.","es":"Intercambia información de redes alcanzables entre routers y selecciona caminos según políticas."},"details":{"en":["BGP is a path-vector protocol on TCP 179. It advertises prefixes and attributes. Policy can outweigh shortest AS path. Local preference typically controls outbound selection; AS-path prepending can influence inbound paths but may be overridden by another network’s policies. Exact selection rules depend on platform."],"es":["BGP es un protocolo vector-ruta en TCP 179. Anuncia prefijos y atributos. La política puede pesar más que AS-path corto. La preferencia local suele controlar salida; repetir AS-path puede influir en entrada, pero otras políticas pueden prevalecer. Las reglas exactas dependen de plataforma."]},"aws":{"en":"Direct Connect and dynamic VPN use BGP. Inspect advertised, received and installed routes, not just session state.","es":"Direct Connect y VPN dinámica usan BGP. Inspecciona rutas anunciadas, recibidas e instaladas, no solo la sesión."},"question":{"en":"Why can an established BGP session carry no application traffic?","es":"¿Por qué BGP establecida puede no transportar tráfico de aplicación?"},"answer":{"en":"Peer communication is working, but prefixes, route choice, return path or filtering may be wrong. Check each separately.","es":"Los pares se comunican, pero prefijos, elección, retorno o filtros pueden estar mal. Comprueba cada elemento."},"related":["routing","direct-connect","vpn"],"sources":[{"label":"BGP: RFC 4271","url":"https://www.rfc-editor.org/rfc/rfc4271"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/routing-and-bgp.html","label":"docs.aws.amazon.com: routing and bgp"}],"level":"deep","learning":{"definition":{"en":"The Border Gateway Protocol, abbreviated BGP, is how networks tell each other which address ranges they can reach. It runs over TCP port 179 between configured neighbours and is a path vector protocol, meaning each advertisement carries the list of autonomous systems it crossed. An autonomous system is a network under one routing policy.","es":"El Border Gateway Protocol, abreviado BGP, es cómo las redes se dicen qué rangos de direcciones pueden alcanzar. Funciona sobre TCP puerto 179 entre vecinos configurados y es un protocolo de vector de camino, es decir, cada anuncio lleva la lista de sistemas autónomos que cruzó. Un sistema autónomo es una red bajo una política de enrutamiento."},"simple":{"en":"How two networks tell each other what they can reach, and how each side applies its own policy to pick a path.","es":"Cómo dos redes se dicen qué pueden alcanzar, y cómo cada lado aplica su propia política para elegir un camino."},"analogy":{"en":"Neighbouring postal services exchanging lists of regions they deliver to, and how many services each letter would cross. The limitation: BGP carries nothing about speed or congestion, so the path it prefers can easily be the slower one.","es":"Servicios postales vecinos que intercambian listas de regiones a las que reparten, y por cuántos servicios pasaría cada carta. La limitación: BGP no lleva nada sobre velocidad ni congestión, así que el camino que prefiere puede ser el más lento."},"walkthrough":{"en":["Two routers open a TCP session and then send updates. Each update announces a prefix with path attributes, and routes are withdrawn explicitly, which is what makes hybrid failover work.","The levers act in opposite directions. Local preference is set inside your network and controls which path your traffic leaves by. AS path prepending discourages inbound traffic, but the far side may override it.","In AWS each virtual interface is a BGP session. For a public virtual interface AWS documents that AS path and longest prefix match determine the path, and that transitive routing between connections is not supported.","Verify in three stages: confirm the session is established, read what you advertise against what the peer receives, then read the forwarding table. Check the return path separately."],"es":["Dos enrutadores abren una sesión TCP y después envían actualizaciones. Cada actualización anuncia un prefijo con atributos de camino, y las rutas se retiran de forma explícita, lo que hace funcionar la conmutación híbrida.","Las palancas actúan en direcciones opuestas. La preferencia local se fija en tu red y controla por qué camino sale tu tráfico. El prepending de AS path desalienta el tráfico entrante, pero el otro lado puede ignorarlo.","En AWS cada interfaz virtual es una sesión BGP. Para una interfaz virtual pública AWS documenta que el AS path y el prefijo más largo determinan el camino, y que no se admite enrutamiento transitivo entre conexiones.","Verifica en tres etapas: confirma que la sesión está establecida, lee qué anuncias frente a qué recibe el par, y después lee la tabla de reenvío. Revisa el camino de vuelta aparte."]},"pitfalls":{"en":["An established session proves only that the routers are talking. Prefixes may be unadvertised, filtered, losing route selection, or lacking a return path.","BGP is a policy tool, not a performance tool. It has no view of latency, and prepending is a request the other network may ignore."],"es":["Una sesión establecida solo prueba que los enrutadores se hablan. Los prefijos pueden no anunciarse, estar filtrados o carecer de camino de vuelta.","BGP es una herramienta de política, no de rendimiento. No ve la latencia, y el prepending es una petición que la otra red puede ignorar."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/routing-and-bgp.html","label":"docs.aws.amazon.com: routing and bgp"},{"url":"https://www.rfc-editor.org/rfc/rfc4271","label":"rfc-editor.org: rfc4271"}]}},{"id":"private-connectivity","parent":"hybrid","title":{"en":"PrivateLink and VPC endpoints","es":"PrivateLink y endpoints VPC"},"summary":{"en":"Access a specific service privately without opening full connectivity between networks.","es":"Accede a un servicio concreto de forma privada sin abrir conectividad completa entre redes."},"details":{"en":["Interface endpoints use private addresses on ENIs and PrivateLink. Gateway endpoints for S3 and DynamoDB use route-table entries and differ in connectivity properties. Endpoints do not grant IAM permission. DNS, SGs, endpoint policies and resource policies still matter."],"es":["Los endpoints de interfaz usan IP privadas en ENI y PrivateLink. Los gateway de S3 y DynamoDB usan tablas de rutas y tienen otras propiedades. Los endpoints no conceden permisos IAM. DNS, SG, políticas de endpoint y recurso siguen importando."]},"aws":{"en":"Use suitable service endpoints to avoid unnecessary NAT traffic. Compare hourly and data costs against real usage.","es":"Usa endpoints adecuados para evitar NAT innecesario. Compara costes por hora y datos con uso real."},"question":{"en":"An S3 endpoint exists but reads return AccessDenied. Would NAT fix it?","es":"¿NAT arregla AccessDenied si ya existe un endpoint S3?"},"answer":{"en":"Not as an authorization fix. Inspect IAM, bucket, endpoint and applicable KMS policies; check DNS and routing separately.","es":"No como arreglo de autorización. Revisa IAM, bucket, endpoint y KMS aplicable; comprueba DNS y rutas aparte."},"related":["iam","cidr-overlap","nat-egress","dns"],"sources":[{"label":"AWS PrivateLink concepts","url":"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html","label":"docs.aws.amazon.com: gateway endpoints"}],"level":"applied","learning":{"definition":{"en":"AWS PrivateLink lets clients in your VPC reach services and resources in other VPCs using private IP addresses, as if they were hosted in your own VPC. A VPC endpoint is the object the consumer creates for that connection. This is private access to a service, which is narrower than routed connectivity between networks.","es":"AWS PrivateLink permite que los clientes de tu VPC alcancen servicios y recursos de otras VPC usando direcciones IP privadas, como si estuvieran alojados en tu propia VPC. Un punto de enlace de VPC es el objeto que crea el consumidor para esa conexión. Es acceso privado a un servicio, algo más estrecho que conectividad enrutada entre redes."},"simple":{"en":"A private door to one service instead of a road between two networks. You reach the service, and not its network.","es":"Una puerta privada a un servicio en lugar de una carretera entre dos redes. Alcanzas el servicio, y no su red."},"analogy":{"en":"A service hatch in a wall, so one shop hands goods to its neighbour without opening a corridor between the buildings. The limitation: a physical hatch is also the permission, while an endpoint is only the path and grants no rights.","es":"Una ventanilla de servicio en una pared, para que una tienda pase mercancía a su vecina sin abrir un pasillo. La limitación: una ventanilla física es también el permiso, mientras que un punto de enlace solo es el camino."},"walkthrough":{"en":["Two networks can be joined by routing, which exposes every reachable address, or one service can be published into the consumer network. Publishing avoids address planning problems, and gives the consumer no route into the provider network.","The endpoint types differ. An interface endpoint creates network interfaces with private addresses in subnets you pick, uses AWS PrivateLink, and has security groups. A gateway endpoint serves Amazon S3 and DynamoDB through route table entries.","A service provider creates an endpoint service and must specify a load balancer that receives consumer requests. By default it is available to nobody, so the provider grants permissions to specific AWS principals.","Two worked cases. To stop private subnet traffic to Amazon S3 being billed through NAT, add a gateway endpoint and confirm the route exists. To let a partner call one internal API, publish an endpoint service."],"es":["Dos redes se pueden unir por enrutamiento, lo que expone toda dirección alcanzable, o se puede publicar un servicio en la red del consumidor. Publicar no da al consumidor ninguna ruta hacia la red del proveedor.","Los tipos difieren. Uno de interfaz crea interfaces de red con direcciones privadas en las subredes que elijas y usa AWS PrivateLink. Uno de tipo gateway sirve a Amazon S3 y DynamoDB mediante entradas de tabla de rutas.","Un proveedor crea un endpoint service y debe especificar un balanceador que reciba las solicitudes. Por defecto no está disponible para nadie, así que el proveedor concede permisos a principales de AWS concretos.","Dos casos trabajados. Para que el tráfico a Amazon S3 deje de facturarse por NAT, añade un punto de enlace de tipo gateway y confirma la ruta. Para que un socio llame a una API interna, publica un endpoint service."]},"pitfalls":{"en":["An endpoint is not a permission. It changes the network path only, so an access denied error is rarely fixed by adding another endpoint.","Interface and gateway endpoints are not interchangeable. Gateway endpoints exist only for Amazon S3 and DynamoDB and behave differently for on premises access and cost."],"es":["Un punto de enlace no es un permiso. Solo cambia el camino de red; un acceso denegado no se arregla añadiendo otro punto de enlace.","Los puntos de enlace de interfaz y de tipo gateway no son intercambiables. Los de tipo gateway existen solo para Amazon S3 y DynamoDB."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html","label":"docs.aws.amazon.com: concepts"},{"url":"https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html","label":"docs.aws.amazon.com: gateway endpoints"}]}},{"id":"troubleshooting","parent":"networking","title":{"en":"Troubleshooting a request","es":"Diagnosticar una solicitud"},"summary":{"en":"Follow a request and test where it first fails, instead of changing settings blindly.","es":"Sigue una petición y comprueba dónde falla primero, en lugar de cambiar ajustes a ciegas."},"details":{"en":["Scope by client, endpoint and time. Resolve DNS, test transport, inspect TLS, then check HTTP and application logs. Compare a working path. Useful tools include dig, curl -v, openssl s_client, ip route and authorized packet captures. Change one variable at a time and state what observation would disprove the hypothesis."],"es":["Acota por cliente, destino y tiempo. Resuelve DNS, prueba transporte, inspecciona TLS y revisa HTTP y logs. Compara una ruta funcional. Usa dig, curl -v, openssl s_client, ip route y capturas autorizadas. Cambia una variable cada vez y define qué observación refutaría la hipótesis."]},"aws":{"en":"Flow Logs contain flow metadata, not payloads. Reachability Analyzer evaluates supported configuration paths; it does not send application traffic or verify application health.","es":"Flow Logs contiene metadatos, no payloads. Reachability Analyzer evalúa rutas de configuración compatibles; no envía tráfico ni valida salud de aplicación."},"question":{"en":"Does ACCEPT in Flow Logs prove the request succeeded?","es":"¿ACCEPT en Flow Logs prueba que la solicitud funcionó?"},"answer":{"en":"No. It records acceptance at that network point. TLS, authorization, timeouts and application errors may still fail. Correlate higher-layer logs and request IDs.","es":"No. Registra aceptación en ese punto de red. Pueden fallar TLS, autorización, tiempos o aplicación. Correlaciona logs superiores e identificadores."},"related":["osi","icmp","dns","tls","observability"],"sources":[{"label":"VPC Flow Logs","url":"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"},{"label":"VPC Reachability Analyzer","url":"https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html"}],"level":"applied","learning":{"definition":{"en":"Troubleshooting a request means locating the first boundary where it fails, with evidence rather than guesses. You scope the problem, then test each layer in order, name resolution, transport connection, the TLS handshake, then the HTTP exchange and the application, comparing against a path that works.","es":"Diagnosticar una solicitud consiste en localizar el primer límite donde falla, con pruebas y no con suposiciones. Delimitas el problema y después pruebas cada capa en orden, resolución de nombres, conexión de transporte, negociación TLS, y después el intercambio HTTP y la aplicación, comparando con un camino que funciona."},"simple":{"en":"Find the first place the request stops. Test one layer at a time, and compare against a path that works.","es":"Encuentra el primer punto donde se detiene la solicitud. Prueba una capa a la vez y compara con algo que funciona."},"analogy":{"en":"Like tracing a lost parcel by checking each depot in order rather than reasoning about the whole journey. The limitation: a depot scan proves the parcel passed, and not that it arrived intact or was accepted at the door.","es":"Como rastrear un paquete perdido revisando cada centro en orden en lugar de razonar sobre todo el viaje. La limitación: un escaneo en un centro prueba que el paquete pasó, no que llegó intacto ni que lo aceptaron en la puerta."},"walkthrough":{"en":["Scope first. Write down which clients, which endpoint and which times are affected, and whether anything changed. A fault that affects one client and not another is a different investigation from one that affects everybody.","Then walk the layers with one tool each. Resolve the name with dig, test the transport connection, inspect the certificate with openssl s_client, then send a real request with curl in verbose mode and read the status and headers.","In AWS, Flow Logs record flow metadata and not payloads, so an ACCEPT entry means the packet was accepted at that point, not that the request succeeded. Reachability Analyzer analyses configuration and reports the blocking component, without sending application traffic.","Change one variable at a time and state in advance what observation would disprove your hypothesis. Correlate load balancer access logs and request identifiers with application logs, since an authorization or timeout failure looks identical from the network."],"es":["Delimita primero. Anota qué clientes, qué punto de destino y qué momentos están afectados, y si algo cambió. Un fallo que afecta a un cliente y no a otro es una investigación distinta de uno que afecta a todos.","Después recorre las capas con una herramienta para cada una. Resuelve el nombre con dig, prueba la conexión, inspecciona el certificado con openssl s_client, y envía una solicitud real con curl en modo verboso.","En AWS, los Flow Logs registran metadatos y no contenido, así que una entrada ACCEPT significa que el paquete se aceptó en ese punto, no que la solicitud tuvo éxito. Reachability Analyzer analiza la configuración, sin enviar tráfico.","Cambia una variable a la vez y di por adelantado qué observación refutaría tu hipótesis. Correlaciona los registros del balanceador y los identificadores de solicitud con los de la aplicación."]},"pitfalls":{"en":["An ACCEPT in Flow Logs does not prove success. TLS, authorization, timeouts and application errors all fail after the packet was accepted.","Reachability Analyzer evaluates configuration, so a reachable verdict says nothing about whether the application is healthy or the service is listening."],"es":["Un ACCEPT en Flow Logs no prueba el éxito. TLS, autorización, tiempos de espera y errores de aplicación fallan después de aceptar el paquete.","Reachability Analyzer evalúa la configuración, así que un veredicto de alcanzable no dice nada sobre si la aplicación está sana o el servicio escucha."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html","label":"docs.aws.amazon.com: flow logs"},{"url":"https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html","label":"docs.aws.amazon.com: what is reachability analyzer"}]}},{"id":"systems","parent":null,"title":{"en":"Systems Fundamentals","es":"Fundamentos de sistemas"},"summary":{"en":"How operating systems manage processes, memory, isolation and storage.","es":"Cómo los sistemas operativos gestionan procesos, memoria, aislamiento y almacenamiento."},"details":{"en":["Understanding how a Linux kernel schedules processes, allocates memory and abstracts storage explains why cloud instances behave the way they do (noisy neighbors, cold starts, IOPS limits). This root groups the OS-level knowledge an SA needs to reason about instance sizing, container density and storage choice."],"es":["Entender como un kernel Linux planifica procesos, asigna memoria y abstrae el almacenamiento explica por qué las instancias en la nube se comportan así (vecinos ruidosos, arranques en frío, límites de IOPS). Esta raíz agrupa el conocimiento de sistema operativo que un SA necesita para dimensionar instancias, contenedores y almacenamiento."]},"aws":{"en":"Maps to EC2 instance families, EBS/instance store, and container runtimes on ECS/EKS/Fargate.","es":"Se relaciona con las familias de instancias EC2, EBS/instance store, y los runtimes de contenedores en ECS/EKS/Fargate."},"question":{"en":"Why does an SA need OS internals if AWS manages the infrastructure?","es":"¿Por qué necesita un SA comprender el funcionamiento interno del sistema operativo si AWS gestiona la infraestructura?"},"answer":{"en":"OS fundamentals help distinguish CPU, memory, storage and networking bottlenecks from service-level limits. Use measurements and workload context to choose instance size, storage and runtime settings. Managed services reduce operating responsibilities but do not remove the need to understand application behavior.","es":"Los fundamentos de SO ayudan a distinguir cuellos de CPU, memoria, almacenamiento y red de límites de servicio. Usa medidas y contexto para elegir instancia, almacenamiento y runtime. Los servicios administrados reducen tareas operativas sin eliminar la necesidad de entender la aplicación."},"related":["cloud-ec2","systems-virtualization"],"sources":[{"label":"AWS EC2 Instance Types","url":"https://aws.amazon.com/ec2/instance-types/"},{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}],"level":"foundation","learning":{"definition":{"en":"Systems fundamentals is how an operating system shares one machine among many programs: which thread gets the processor, how memory is allocated and reclaimed, how files are laid out on a device, and how data reaches storage and the network.","es":"Los fundamentos de sistemas tratan de cómo un sistema operativo reparte una máquina entre muchos programas: qué hilo recibe el procesador, cómo se asigna y recupera la memoria, cómo se organizan los archivos en un dispositivo y cómo llegan los datos al almacenamiento y a la red."},"simple":{"en":"One machine has a fixed set of real parts and many programs that want them. The operating system decides who gets what, and for how long.","es":"Una máquina tiene un conjunto fijo de piezas reales y muchos programas que las quieren. El sistema operativo decide quién recibe qué, y por cuánto tiempo."},"analogy":{"en":"A shared kitchen with one stove: the head cook decides who cooks when and who gets counter space. Limit of the analogy: cooks can negotiate and wait their turn, while programs are switched by the kernel on a timescale they cannot perceive and get only the resources the kernel grants them.","es":"Una cocina compartida con una sola hornilla: el jefe de cocina decide quién cocina y cuándo, y quién usa la mesa. Límite de la analogía: los cocineros negocian y esperan su turno, mientras el kernel alterna los programas en una escala de tiempo que ellos no perciben y solo reciben los recursos que el kernel les concede."},"walkthrough":{"en":["Take a web request that suddenly takes two seconds instead of fifty milliseconds. Before touching any service, decide which of four resources is short: processor, memory, storage or network. If the application threads are runnable but queueing, the processor is short; if they are waiting on a query, the slow part is downstream.","Next check whether the number you are reading is even real. Memory that looks nearly full on Linux is usually file cache, and a process reporting a huge address space may be using very little physical memory. Reading the kernel's own counters, rather than a single summary figure, is what separates a diagnosis from a guess.","Then translate the finding into a cloud decision. Instance families, volume types, container limits and function cold starts are all ways of buying or bounding those same four resources, so once you can name the constrained resource the shortlist of services is usually short. Correlating a deploy timestamp with a latency rise suggests a lead, but it is not proof of cause."],"es":["Toma una petición web que de repente tarda dos segundos en vez de cincuenta milisegundos. Antes de tocar cualquier servicio, decide cuál de los cuatro recursos escasea: procesador, memoria, almacenamiento o red. Si los hilos de la aplicación están ejecutables pero encolados, falta procesador; si están esperando una consulta, lo lento está más abajo.","Después comprueba si el número que lees es real. En Linux, una memoria que parece casi llena suele ser caché de archivos, y un proceso que reporta un espacio de direcciones enorme puede usar muy poca memoria física. Leer los contadores del propio kernel, en vez de una sola cifra resumida, es lo que distingue un diagnóstico de una suposición.","Luego traduce el hallazgo a una decisión de nube. Las familias de instancias, los tipos de volumen, los límites de contenedor y los arranques en frío son formas de comprar o acotar esos mismos cuatro recursos, así que cuando puedes nombrar el recurso limitado la lista de servicios candidatos se acorta. Correlacionar la hora de un despliegue con una subida de latencia da una pista, no una prueba de causa."]},"pitfalls":{"en":["Assuming a managed service makes this knowledge unnecessary. It removes work such as patching, but your workload still meets processor, memory and input output limits, and the error surfaced is often a symptom of one of them.","Reading high utilisation as a problem by itself. A batch job at ninety percent processor use is efficient, while a latency sensitive service at the same level may already be queueing. Define the target for that workload before reacting."],"es":["Suponer que un servicio administrado hace innecesarios estos fundamentos. Quita trabajo como parchear, pero tu carga sigue topando límites de procesador, memoria y entrada salida, y el error que ves suele ser síntoma de uno de ellos.","Leer el uso alto como un problema en sí mismo. Un proceso por lotes al noventa por ciento de procesador es eficiente, mientras un servicio sensible a la latencia al mismo nivel puede estar ya encolando. Define el objetivo de esa carga antes de reaccionar."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}]}},{"id":"systems-linux","parent":"systems","title":{"en":"Linux Fundamentals","es":"Fundamentos de Linux"},"summary":{"en":"The kernel, command shell and permissions that shape how Linux runs programs.","es":"El núcleo, la consola de comandos y los permisos que determinan cómo Linux ejecuta programas."},"details":{"en":["Almost every AWS compute service (EC2, Lambda, Fargate, EKS nodes) runs Linux underneath. Knowing the shell, file permissions, and the process/memory model helps diagnose instance-level issues surfaced through CloudWatch or SSM Session Manager, and explains AMI, cgroup and namespace behavior used by containers."],"es":["Casí todos los servicios de cómputo de AWS (EC2, Lambda, Fargate, nodos EKS) corren Linux por debajo. Conocer el shell, los permisos de archivos y el modelo de procesos/memoria ayuda a diagnosticar problemas a nivel de instancia vistos vía CloudWatch o SSM Session Manager, y explica el comportamiento de AMI, cgroups y namespaces usados por contenedores."]},"aws":{"en":"AMIs are Linux (or Windows) images; SSM Session Manager gives shell access without SSH keys.","es":"Las AMI son imagenes Linux (o Windows); SSM Session Manager da acceso al shell sin llaves SSH."},"question":{"en":"Why prefer SSM Session Manager over SSH for EC2 access?","es":"¿Por qué preferir SSM Session Manager sobre SSH para acceder a EC2?"},"answer":{"en":"Step 1: no inbound port 22 needs to stay open, shrinking the attack surface. Step 2: access is governed by IAM policy instead of distributed SSH key management. Step 3: every session is logged to CloudWatch Logs or S3, giving an audit trail that bare SSH does not provide. This is why it is the AWS-recommended pattern for operational access.","es":"Paso 1: no es necesario mantener abierto el puerto 22 entrante, reduciendo la superficie de ataque. Paso 2: el acceso se gobierna por política IAM en lugar de gestión distribuida de llaves SSH. Paso 3: cada sesión se registra en CloudWatch Logs o S3, dando un rastro de auditoría que SSH puro no ofrece. Por eso es el patrón recomendado por AWS para acceso operativo."},"related":["systems-processes","systems-memory","systems-filesystems"],"sources":[{"label":"AWS Systems Manager Session Manager","url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html"},{"url":"https://man7.org/linux/man-pages/man5/proc_meminfo.5.html","label":"man7.org: proc meminfo.5"},{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"}],"level":"foundation","learning":{"definition":{"en":"Linux is strictly the kernel: the privileged component that manages processors, memory, devices and filesystems. A distribution combines that kernel with userland software: shell, libraries, package manager and an init system. Programs request kernel services through system calls.","es":"Linux es estrictamente el kernel: el componente privilegiado que gestiona procesadores, memoria, dispositivos y sistemas de archivos. Una distribución combina ese kernel con software de espacio de usuario: shell, bibliotecas, gestor de paquetes y un sistema de arranque. Los programas piden servicios al kernel mediante llamadas al sistema."},"simple":{"en":"The kernel is the privileged part that talks to hardware; your program is not. When a program needs a file, a socket or more memory, it asks the kernel through a system call.","es":"El kernel es la parte privilegiada que habla con el hardware; tu programa no lo es. Cuando un programa necesita un archivo, un socket o más memoria, se lo pide al kernel con una llamada al sistema."},"analogy":{"en":"A pharmacy counter: you submit a request and staff behind the counter fetch what is controlled. Limit: a pharmacist serves one person at a time and can explain a refusal, while the kernel returns a numeric error code and nothing more, and each crossing of that boundary has a real cost that shapes performance.","es":"El mostrador de una farmacia: tú entregas una solicitud y el personal de atrás trae lo que está controlado. Límite: un farmacéutico atiende de uno en uno y puede explicar una negativa, mientras el kernel devuelve un código numérico de error y nada más, y cada cruce de esa frontera tiene un costo real que afecta al rendimiento."},"walkthrough":{"en":["Trace one operation. Your code calls a library function to read a file, the library issues a read system call, the processor switches to kernel mode, the kernel checks permissions and either serves the data from page cache or waits on the device. Because each crossing costs time, code that makes many tiny reads is slower than code that reads in larger blocks.","Then read state from the kernel itself. The process information pseudo filesystem exposes live counters as text, and standard tools are mostly formatted views of those files. When a dashboard and a command disagree, going to the counter settles it, because the two may sample at different intervals.","Finally separate the layers you can change. Application and service configuration is one layer; kernel tunables and resource control settings such as control group limits are another, and those do change scheduling and memory behaviour. Knowing which layer you touched is what makes a change reviewable."],"es":["Traza una operación. Tu código llama a una función de biblioteca para leer un archivo, la biblioteca emite la llamada al sistema de lectura, el procesador cambia a modo kernel, el kernel revisa permisos y sirve el dato desde la caché de páginas o espera al dispositivo. Como cada cruce cuesta tiempo, el código que hace muchas lecturas diminutas es más lento que el que lee en bloques grandes.","Después lee el estado desde el propio kernel. El pseudo sistema de archivos de información de procesos expone contadores vivos en texto, y las herramientas estándar son en buena medida vistas formateadas de esos archivos. Cuando un panel y un comando discrepan, ir al contador lo resuelve, porque ambos pueden muestrear en intervalos distintos.","Por último separa las capas que puedes cambiar. La configuración de la aplicación y de los servicios es una capa; los parámetros del kernel y los ajustes de control de recursos, como los límites de un grupo de control, son otra, y esos sí cambian la planificación y el comportamiento de memoria. Saber qué capa tocaste es lo que hace revisable un cambio."]},"pitfalls":{"en":["Not distinguishing an application setting from a kernel or resource control setting. Editing a service's own options will not change scheduling, but a control group limit or a kernel tunable will, so name the layer before and after the change.","Treating one tool's output as the truth. Tools sample the same counters over different windows, so two figures can differ without either being wrong; compare over time and check the underlying counter when the decision matters."],"es":["No distinguir un ajuste de aplicación de un ajuste del kernel o de control de recursos. Editar las opciones de un servicio no cambia la planificación, pero un límite de grupo de control o un parámetro del kernel sí, así que nombra la capa antes y después del cambio.","Tomar la salida de una sola herramienta como la verdad. Las herramientas muestrean los mismos contadores en ventanas distintas, así que dos cifras pueden diferir sin que ninguna esté mal; compara en el tiempo y revisa el contador de origen cuando la decisión importa."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man5/proc_meminfo.5.html","label":"man7.org: proc meminfo.5"},{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"}]}},{"id":"systems-processes","parent":"systems-linux","title":{"en":"Processes and Scheduling","es":"Procesos y planificación"},"summary":{"en":"How programs become processes and share processor time.","es":"Cómo los programas se convierten en procesos y comparten el tiempo del procesador."},"details":{"en":["A process is a running program with an execution context and a virtual address space; threads within it share that address space. The Linux scheduler decides which runnable tasks receive processor time. Control groups, or cgroups, can account for and limit resource use. Scheduling algorithms and the meaning of container requests, weights and limits depend on the kernel and runtime, so distinguish a guaranteed allocation from a maximum cap.","Pitfall: assuming a container CPU limit guarantees stable latency. A throttled cgroup causes tail-latency spikes even when average CPU usage looks fine; this shows up as intermittent Lambda or ECS task slowness that CPU-utilization dashboards do not explain."],"es":["Un proceso es un programa en ejecución con su contexto y espacio de direcciones virtual; sus hilos comparten ese espacio. El planificador de Linux decide qué tareas reciben tiempo de procesador. Los grupos de control, o cgroups, permiten medir y limitar recursos. El algoritmo y el significado de solicitudes, pesos y límites de contenedores dependen del núcleo y del entorno; distingue una asignación garantizada de un máximo permitido.","Error común: asumir que un limite de CPU en un contenedor garantiza latencia estable. Un cgroup limitado (throttled) causa picos de latencia de cola incluso cuando el uso promedio de CPU parece bien; esto aparece como lentitud intermitente en Lambda o tareas ECS que los paneles de utilización de CPU no explican."]},"aws":{"en":"ECS task definitions and Fargate set vCPU/memory that map to cgroup limits; Lambda allocates CPU proportionally to configured memory.","es":"Las definiciones de tareas ECS y Fargate configuran vCPU/memoria que se mapean a límites de cgroups; Lambda asigna CPU proporcionalmente a la memoria configurada."},"question":{"en":"A containerized service shows low average CPU but random latency spikes. What do you check?","es":"Un servicio en contenedor muestra CPU promedio bajo pero picos de latencia aleatorios. ¿Qué revisas?"},"answer":{"en":"Check processor throttling and task limits where those metrics are available, alongside request timing and downstream latency. Correlated timestamps support a hypothesis but do not prove the cause. In a controlled test, change the CPU allocation or request concurrency and compare latency and throttling under the same workload. Use service-provided metrics when host-level counters are not exposed.","es":"Comprueba la limitación de CPU y los límites de las tareas cuando esas métricas estén disponibles, junto con tiempos de petición y latencia de dependencias. La coincidencia temporal apoya una hipótesis, pero no demuestra la causa. En una prueba controlada, cambia la asignación de CPU o la concurrencia y compara latencia y limitación con la misma carga. Usa métricas del servicio cuando no exponga contadores del host."},"related":["systems-memory","cloud-containers","observability"],"sources":[{"label":"Amazon ECS Task CPU and Memory","url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-cpu-memory-error.html"},{"label":"Linux kernel: EEVDF scheduling and CFS context","url":"https://docs.kernel.org/scheduler/sched-eevdf.html"},{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"}],"level":"applied","learning":{"definition":{"en":"A process is a running program with its own address space and open file descriptors. A thread is a schedulable line of execution inside it, and threads of one process share memory. The kernel scheduler chooses which runnable thread occupies a core and for how long.","es":"Un proceso es un programa en ejecución con su propio espacio de direcciones y sus descriptores de archivo abiertos. Un hilo es una línea de ejecución planificable dentro de él, y los hilos de un proceso comparten memoria. El planificador del kernel elige qué hilo ejecutable ocupa un núcleo y por cuánto tiempo."},"simple":{"en":"A process is a program in motion. Threads are the workers inside it that can run at the same time. The scheduler hands each worker a core for a short slice.","es":"Un proceso es un programa en movimiento. Los hilos son los trabajadores dentro de él que pueden ejecutarse a la vez. El planificador entrega a cada trabajador un núcleo por un lapso corto."},"analogy":{"en":"A bank with four tellers and numbered tickets: customers are threads, tellers are cores. Limit: a customer served leaves for good, while a thread often pauses mid task waiting for a disk, a lock or a reply and hands its turn back, and each switch costs the processor a cache reload that a bank never pays.","es":"Un banco con cuatro cajeros y turnos numerados: los clientes son hilos y los cajeros núcleos. Límite: un cliente atendido se va del todo, mientras un hilo se pausa a medio trabajo esperando un disco, un cerrojo o una respuesta y devuelve su turno, y cada cambio le cuesta al procesador una recarga de cachés que un banco nunca paga."},"walkthrough":{"en":["Separate runnable from blocked, because the fix differs. A thread that is runnable but not on a core is waiting for processor time, so more cores or fewer competing threads help. A thread blocked on a disk read, a lock or a remote call will not go faster on a bigger instance, and the fix is downstream or in the locking.","Then look at how time is shared. Linux has long used a fair share scheduler, CFS in older kernels and EEVDF in recent ones, which aims to give each runnable thread a proportional slice, adjusted by its nice value. That is why a busy low priority batch job can still add latency to an interactive service on the same small instance.","Finally read the numbers carefully. Load average counts threads that are runnable and also those in uninterruptible sleep, typically waiting on input output, so a load of four on four cores does not by itself mean the processors are saturated. Pair it with per core utilisation, run queue length and time spent waiting on input output."],"es":["Separa ejecutable de bloqueado, porque la solución cambia. Un hilo ejecutable que no está en un núcleo espera tiempo de procesador, así que ayudan más núcleos o menos hilos compitiendo. Un hilo bloqueado en una lectura de disco, un cerrojo o una llamada remota no irá más rápido en una instancia mayor, y el arreglo está más abajo o en el bloqueo.","Después mira cómo se reparte el tiempo. Linux usa desde hace años un planificador de reparto justo, CFS en kernels antiguos y EEVDF en los recientes, que busca dar a cada hilo ejecutable una porción proporcional, ajustada por su valor nice. Por eso un proceso por lotes de baja prioridad puede añadir latencia a un servicio interactivo en la misma instancia pequeña.","Por último lee los números con cuidado. La carga promedio cuenta hilos ejecutables y también los que están en espera ininterrumpible, normalmente por entrada salida, así que una carga de cuatro en cuatro núcleos no significa por sí sola que los procesadores estén saturados. Acompáñala del uso por núcleo, la longitud de la cola de ejecución y el tiempo esperando entrada salida."]},"pitfalls":{"en":["Reading load average as a processor percentage. It includes threads in uninterruptible sleep, so a high load can mean a slow disk rather than a busy processor; confirm with per core utilisation before resizing.","Raising thread count as a default fix. Extra concurrency can hide independent waits, but when threads are blocked on one contended lock or one saturated dependency it adds memory use and context switching without improving throughput."],"es":["Leer la carga promedio como un porcentaje de procesador. Incluye hilos en espera ininterrumpible, así que una carga alta puede significar un disco lento y no un procesador ocupado; confírmalo con el uso por núcleo antes de redimensionar.","Subir el número de hilos como arreglo por defecto. Más concurrencia puede ocultar esperas independientes, pero si los hilos se bloquean en un mismo cerrojo disputado o en una dependencia saturada solo añade memoria y cambios de contexto sin mejorar el rendimiento."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"}]}},{"id":"systems-memory","parent":"systems-linux","title":{"en":"Memory Management","es":"Gestión de memoria"},"summary":{"en":"Virtual memory, physical RAM and what happens when a workload runs out of memory.","es":"Memoria virtual, RAM física y qué ocurre cuando una carga se queda sin memoria."},"details":{"en":["Virtual memory gives processes address spaces mapped to physical memory and backing storage. Memory pressure can trigger reclaim, swapping where configured, or OOM termination. A container can hit its own cgroup limit even when the host has spare RAM. Diagnose peak usage, limits, page faults and allocation patterns. Lambda allocates CPU in proportion to configured memory; raising memory can help CPU-bound work even if it does not need more RAM, but benchmark duration and total cost."],"es":["La memoria virtual asigna espacios de direcciones a memoria física y almacenamiento. La presión puede provocar recuperación, swap si existe o terminación OOM. Un contenedor puede alcanzar su límite cgroup aunque al host le sobre RAM. Diagnostica picos, límites, fallos de página y asignaciones. Lambda asigna CPU proporcional a memoria configurada; aumentarla puede ayudar a trabajo limitado por CPU aunque no necesite más RAM, pero mide duración y coste total."]},"aws":{"en":"Lambda CPU scales with configured memory; EC2 and container memory limits must be sized and measured separately.","es":"La CPU de Lambda escala con la memoria configurada; los límites EC2 y de contenedores deben dimensionarse y medirse por separado."},"question":{"en":"A Lambda function times out intermittently under load, memory usage looks under 50 percent. What is a likely fix?","es":"Una función Lambda expira intermitentemente bajo carga, el uso de memoria parece bajo el 50 por ciento. ¿Cuál es una posible solución?"},"answer":{"en":"Low observed memory use does not by itself rule out a transient peak or a limit. Compare CPU, duration and memory measurements, then test several Lambda memory settings on representative requests. If more CPU improves duration, quantify the price/performance effect; do not infer a single root cause from one faster invocation.","es":"Una lectura baja de memoria no descarta picos o límites. Compara CPU, duración y memoria y prueba varias configuraciones Lambda con solicitudes representativas. Si más CPU mejora duración, cuantifica precio/rendimiento; no deduzcas una causa única por una ejecución más rápida."},"related":["systems-processes","cloud-lambda"],"sources":[{"label":"AWS Lambda Function Configuration - Memory","url":"https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html"},{"url":"https://man7.org/linux/man-pages/man5/proc_meminfo.5.html","label":"man7.org: proc meminfo.5"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"}],"level":"applied","learning":{"definition":{"en":"Virtual memory gives each process its own address space, which the kernel maps in fixed size pages onto physical memory. Resident set size is the part currently in physical memory, and the page cache holds recently read file contents so repeat reads are served without touching the device.","es":"La memoria virtual da a cada proceso su propio espacio de direcciones, que el kernel mapea en páginas de tamaño fijo sobre la memoria física. El conjunto residente es la parte que está ahora en memoria física, y la caché de páginas guarda el contenido de archivos leído hace poco para servir las lecturas repetidas sin tocar el dispositivo."},"simple":{"en":"Each program sees a large private memory. The kernel keeps a mapping and only holds the pages actually in use in real memory. Memory that looks used is often cached file data.","es":"Cada programa ve una memoria privada grande. El kernel mantiene un mapeo y solo conserva en memoria real las páginas realmente en uso. La memoria que parece ocupada suele ser caché de archivos."},"analogy":{"en":"A library where each reader gets a private catalogue numbered from one, and the librarian maps those numbers to real shelves. Limit: a reader waits politely for a book, while a process touching a valid but non resident page is paused by the hardware and resumed once the page is loaded, and an access to an address that was never mapped is not resumed at all but reported as a fault to the process.","es":"Una biblioteca donde cada lector recibe un catálogo privado numerado desde el uno, y el bibliotecario traduce esos números a estantes reales. Límite: un lector espera con paciencia por un libro, mientras un proceso que toca una página válida pero no residente es pausado por el hardware y reanudado cuando la página se carga, y un acceso a una dirección que nunca se mapeó no se reanuda, se informa al proceso como una falla."},"walkthrough":{"en":["Distinguish the three figures that get confused. Virtual size is everything mapped, including memory never touched; resident set size is what is in physical memory now; shared pages such as libraries can be counted in several processes, so adding resident sizes across processes overstates the machine total.","Then interpret a machine that looks full. After files are read the kernel keeps their pages, so almost no memory appears free on a healthy server. The kernel publishes an estimate of how much a new program could obtain without swapping, and that estimate is the useful signal.","Finally know the failure path. Swap moves cold pages to disk and trades latency for survival; when nothing can be reclaimed the kernel terminates a process to protect the system. In containers, memory limits apply per control group, so a process can be killed for exceeding its own limit while the host still has free memory, which is a frequent production surprise."],"es":["Distingue las tres cifras que se confunden. El tamaño virtual es todo lo mapeado, incluida memoria nunca tocada; el conjunto residente es lo que está ahora en memoria física; las páginas compartidas, como las bibliotecas, pueden contarse en varios procesos, así que sumar residentes entre procesos exagera el total de la máquina.","Después interpreta una máquina que parece llena. Tras leer archivos el kernel conserva sus páginas, así que en un servidor sano casi nada aparece como libre. El kernel publica una estimación de cuánta memoria obtendría un programa nuevo sin recurrir al swap, y esa estimación es la señal útil.","Por último conoce la ruta de fallo. El swap mueve páginas frías al disco y cambia latencia por supervivencia; cuando no se puede recuperar nada, el kernel termina un proceso para proteger el sistema. En contenedores los límites de memoria se aplican por grupo de control, así que un proceso puede morir por exceder su propio límite mientras el servidor tiene memoria libre, una sorpresa frecuente en producción."]},"pitfalls":{"en":["Alerting on low free memory. On Linux a low free figure is expected, because the kernel caches file data and reclaims it on demand; alert on the available estimate, swap activity and reclaim pressure instead.","Sizing from virtual size. Virtual size includes mappings never faulted in and can be many times the real need, so size from peak resident set size measured under load, plus headroom for cache."],"es":["Alertar por poca memoria libre. En Linux una cifra baja de memoria libre es lo esperado, porque el kernel cachea datos de archivos y los recupera cuando hace falta; alerta mejor sobre la estimación de memoria disponible, la actividad de swap y la presión de recuperación.","Dimensionar con el tamaño virtual. El tamaño virtual incluye mapeos que nunca se tocaron y puede ser muchas veces la necesidad real, así que dimensiona con el conjunto residente máximo medido bajo carga, más margen para caché."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man5/proc_meminfo.5.html","label":"man7.org: proc meminfo.5"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"}]}},{"id":"systems-filesystems","parent":"systems-linux","title":{"en":"Filesystems and Permissions","es":"Sistemas de archivos y permisos"},"summary":{"en":"How files are organized, mounted and protected by permissions.","es":"Cómo se organizan y montan los archivos y cómo se protegen mediante permisos."},"details":{"en":["Linux filesystems (ext4, xfs) provide POSIX semantics: file locks, byte-range writes, hierarchical permissions (owner/group/other, plus ACLs). Network file systems like NFS (used by EFS) extend this over the network with some consistency caveats under concurrent writers. Object storage (S3) does not implement POSIX at all, so any tool relying on rename-in-place, file locks or partial writes will behave incorrectly if pointed at an S3 mount without a translation layer."],"es":["Los sistemas de archivos Linux (ext4, xfs) ofrecen semántica POSIX: bloqueos de archivo, escrituras por rango de bytes, permisos jerarquicos (propietario/grupo/otros, más ACLs). Los sistemas de archivos en red como NFS (usado por EFS) extienden esto por la red con algunas salvedades de consistencia bajo escritores concurrentes. El almacenamiento de objetos (S3) no implementa POSIX en absoluto, así que cualquier herramienta que dependa de renombrar in situ, bloqueos de archivo o escrituras parciales se comportara mal si se apunta a un montaje S3 sin una capa de traduccion."]},"aws":{"en":"EFS provides POSIX-compliant NFS shared across AZs; FSx offers native Windows (SMB) or Lustre semantics; S3 needs an SDK/API mindset, not a filesystem mindset.","es":"EFS ofrece NFS compatible con POSIX compartido entre AZs; FSx ofrece semántica nativa de Windows (SMB) o Lustre; S3 requiere una mentalidad de SDK/API, no de sistema de archivos."},"question":{"en":"An app team mounts S3 as a filesystem via a FUSE tool and reports random write corruption under concurrency. Why?","es":"Un equipo monta S3 mediante FUSE y detecta problemas de escritura concurrente. ¿Qué supuestos sobre sistemas de archivos revisarías?"},"answer":{"en":"Step 1: recognize S3 objects are immutable and written whole, there is no true partial write or file lock at the API level. Step 2: a FUSE layer only simulates POSIX semantics on top, so concurrent writers can race and overwrite each other's whole object. Step 3: recommend EFS or FSx for POSIX-dependent concurrent write workloads, and reserve S3 for write-once/read-many object patterns.","es":"Paso 1: reconoce que los objetos S3 son inmutables y se escriben completos, no existe una escritura parcial real ni bloqueo de archivo a nivel de API. Paso 2: una capa FUSE solo simula semántica POSIX encima, así que escritores concurrentes pueden competir y sobrescribirse el objeto completo entre si. Paso 3: recomienda EFS o FSx para cargas de escritura concurrente dependientes de POSIX, y reserva S3 para patrones de objeto de escribir una vez y leer muchas veces."},"related":["systems-storage","data-consistency"],"sources":[{"label":"Amazon EFS - How it Works","url":"https://docs.aws.amazon.com/efs/latest/ug/how-it-works.html"},{"url":"https://man7.org/linux/man-pages/man7/inode.7.html","label":"man7.org: inode.7"},{"url":"https://docs.kernel.org/admin-guide/ext4.html","label":"docs.kernel.org: ext4"}],"level":"applied","learning":{"definition":{"en":"A filesystem turns numbered blocks on a device into named files and directories. Each file has an inode holding metadata such as size, owner, permissions, timestamps and a link count, while the name is a directory entry pointing at that inode.","es":"Un sistema de archivos convierte los bloques numerados de un dispositivo en archivos y directorios con nombre. Cada archivo tiene un inodo con metadatos como tamaño, dueño, permisos, fechas y un contador de enlaces, mientras el nombre es una entrada de directorio que apunta a ese inodo."},"simple":{"en":"A disk stores numbered blocks only. The filesystem is the index that records which blocks form which file, and a file name is a label pointing at an entry in that index.","es":"Un disco solo guarda bloques numerados. El sistema de archivos es el índice que registra qué bloques forman cada archivo, y el nombre es una etiqueta que apunta a una entrada de ese índice."},"analogy":{"en":"A warehouse with numbered bins and a card index; two cards pointing at one item is a hard link. Limit: a clerk notices a damaged card at once, while a filesystem detects damage only when it reads that region, which is why journaling and periodic checks exist rather than instant awareness.","es":"Un almacén con cajones numerados y un fichero de tarjetas; dos tarjetas que apuntan al mismo artículo son un enlace duro. Límite: un encargado nota una tarjeta dañada al momento, mientras un sistema de archivos detecta el daño solo cuando lee esa zona, y por eso existen el journal y las revisiones periódicas."},"walkthrough":{"en":["A common incident makes the name and data split concrete: a log file is deleted, yet free space does not return. The blocks stay allocated while any process still holds the file open, because only the last link and the last descriptor together release them. Restarting the writer, or truncating instead of deleting, recovers the space.","Crash safety comes next. A journaling filesystem such as ext4 records its intent before changing metadata, so recovery replays or discards incomplete operations instead of scanning the whole volume. Application data is durable only once it asks the kernel to flush, which is why databases issue that flush explicitly at commit.","In cloud volumes the same rules apply with one addition. A volume is attached, formatted once and mounted at a path, and it can later be grown, but the filesystem must be resized too. Workloads with millions of small files can run out of inodes or hit metadata cost long before the reported free bytes run out."],"es":["Un incidente común hace concreta la separación entre nombre y datos: se borra un archivo de registro y el espacio libre no vuelve. Los bloques siguen asignados mientras algún proceso mantiene el archivo abierto, porque solo el último enlace y el último descriptor juntos los liberan. Reiniciar el proceso que escribe, o truncar en vez de borrar, recupera el espacio.","Después viene la seguridad ante caídas. Un sistema de archivos con journal como ext4 registra su intención antes de cambiar metadatos, así que la recuperación repite o descarta operaciones incompletas en lugar de revisar todo el volumen. Los datos de la aplicación son durables solo cuando pide al kernel vaciarlos, y por eso las bases de datos lo piden de forma explícita al confirmar.","En los volúmenes de nube rigen las mismas reglas con un añadido. Un volumen se conecta, se formatea una vez y se monta en una ruta, y luego puede ampliarse, pero también hay que redimensionar el sistema de archivos. Las cargas con millones de archivos pequeños pueden agotar inodos o pagar un costo de metadatos mucho antes de llenar los bytes libres."]},"pitfalls":{"en":["Expecting a delete to free space immediately. While a process holds the file open the blocks remain allocated, so check open descriptors before adding capacity.","Monitoring free bytes only. A filesystem can refuse new files because inodes are exhausted while gigabytes remain free, so track inode usage on workloads with many small files."],"es":["Esperar que un borrado libere espacio de inmediato. Mientras un proceso mantiene el archivo abierto los bloques siguen asignados, así que revisa los descriptores abiertos antes de añadir capacidad.","Vigilar solo los bytes libres. Un sistema de archivos puede rechazar archivos nuevos por agotar inodos con gigabytes libres, así que sigue el uso de inodos en cargas con muchos archivos pequeños."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man7/inode.7.html","label":"man7.org: inode.7"},{"url":"https://docs.kernel.org/admin-guide/ext4.html","label":"docs.kernel.org: ext4"}]}},{"id":"systems-virtualization","parent":"systems","title":{"en":"Virtualization and Isolation","es":"Virtualización y aislamiento"},"summary":{"en":"How virtual machines share physical hardware while remaining isolated.","es":"Cómo comparten hardware físico las máquinas virtuales manteniendo su aislamiento."},"details":{"en":["A hypervisor provides isolation and virtual resources to guest operating systems. The AWS Nitro System offloads important networking and storage functions to dedicated hardware and uses a lightweight hypervisor on virtualized instances. Nitro security is a system-wide design, not a guarantee attributable to one chip alone. Containers share a host kernel and are a different isolation mechanism from VMs. Choose instance generations from workload benchmarks and security requirements rather than assuming equal vCPU counts imply equal performance."],"es":["Un hipervisor proporciona aislamiento y recursos virtuales al sistema invitado. AWS Nitro descarga funciones importantes de red y almacenamiento a hardware dedicado y usa un hipervisor ligero en instancias virtualizadas. Su seguridad es un diseño completo, no una garantía atribuible a un chip. Los contenedores comparten kernel y aíslan de forma distinta a máquinas virtuales. Elige generaciones mediante pruebas y requisitos, sin asumir que igual número de vCPU significa igual rendimiento."]},"aws":{"en":"Nitro System underlies all current-generation EC2 instances; Nitro Enclaves provide isolated compute for sensitive data processing.","es":"El sistema Nitro subyace a todas las instancias EC2 de generación actual; Nitro Enclaves ofrecen cómputo aislado para procesar datos sensibles."},"question":{"en":"A customer asks how AWS guarantees another tenant's VM cannot read their EC2 memory. What do you answer?","es":"Un cliente pregunta cómo aísla AWS la memoria entre máquinas virtuales. ¿Qué explicarías y qué documentación consultarías?"},"answer":{"en":"Explain the Nitro architecture, hardware offload and isolation controls using published documentation. Distinguish AWS infrastructure controls from the customer’s responsibility for identities, guest software and application data. Validate the customer’s specific threat model and compliance evidence rather than offering an absolute security guarantee.","es":"Explica arquitectura Nitro, descarga a hardware y aislamiento con documentación pública. Distingue controles AWS de la responsabilidad del cliente sobre identidades, software invitado y datos. Valida modelo de amenazas y evidencia de cumplimiento en vez de ofrecer seguridad absoluta."},"related":["systems","cloud-ec2"],"sources":[{"label":"The Security Design of the AWS Nitro System","url":"https://docs.aws.amazon.com/whitepapers/latest/security-design-of-aws-nitro-system/security-design-of-aws-nitro-system.html"},{"url":"https://man7.org/linux/man-pages/man7/namespaces.7.html","label":"man7.org: namespaces.7"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"},{"url":"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html","label":"docs.aws.amazon.com: ec2 nitro instances"}],"level":"deep","learning":{"definition":{"en":"Virtualization runs isolated environments on one host. A hypervisor presents each virtual machine with virtual hardware, usually with processor and memory support built into the hardware itself, and each machine runs its own kernel. Containers share the host kernel, isolated by namespaces for visibility and control groups for resource limits.","es":"La virtualización ejecuta entornos aislados en un mismo servidor. Un hipervisor presenta a cada máquina virtual un hardware virtual, normalmente con apoyo de procesador y memoria integrado en el propio hardware, y cada máquina ejecuta su propio kernel. Los contenedores comparten el kernel del anfitrión, aislados por namespaces para la visibilidad y grupos de control para los límites de recursos."},"simple":{"en":"A virtual machine behaves like a separate computer with its own kernel. A container is a process on the host kernel that has been given a restricted view and a resource budget.","es":"Una máquina virtual se comporta como una computadora aparte con su propio kernel. Un contenedor es un proceso sobre el kernel del anfitrión al que se le dio una vista restringida y un presupuesto de recursos."},"analogy":{"en":"A virtual machine is a self contained apartment; a container is a private office in a shared building with metered power. Limit: offices and apartments are both walls, but the building has one foundation, so a kernel fault or kernel upgrade touches every container on that host at once, and in practice containers often run inside virtual machines anyway.","es":"Una máquina virtual es un apartamento independiente; un contenedor es una oficina privada en un edificio compartido con consumo medido. Límite: oficinas y apartamentos son ambos paredes, pero el edificio tiene un solo cimiento, así que una falla o una actualización del kernel afecta a la vez a todos los contenedores de ese anfitrión, y en la práctica los contenedores suelen correr dentro de máquinas virtuales."},"walkthrough":{"en":["Notice what stays shared. The hypervisor allocates real processors, memory and devices among guests, so a guest sees stable virtual hardware but still competes for physical bandwidth. That competition is where variable disk latency and noisy neighbour effects come from, and it is why some instance sizes get a smaller share.","Compare the two isolation models on specifics rather than slogans. A separate kernel per virtual machine gives a wider boundary and lets you run a different operating system, at the cost of a full boot and more memory per instance. A shared kernel starts faster and packs more workloads per host, but a kernel vulnerability or kernel setting is common to all of them.","Then place the AWS pieces. EC2 instances are built on the Nitro System, which moves network and storage processing onto dedicated hardware, and bare metal instance types remove the virtualization layer entirely. With AWS Fargate you run containers on isolation that AWS manages, so you choose the service model, not the kernel."],"es":["Fíjate en lo que sigue compartido. El hipervisor reparte procesadores, memoria y dispositivos reales entre los huéspedes, así que un huésped ve hardware virtual estable pero aún compite por el ancho de banda físico. De esa competencia vienen la latencia de disco variable y los vecinos ruidosos, y por eso algunos tamaños de instancia reciben una porción menor.","Compara los dos modelos de aislamiento con detalles, no con eslóganes. Un kernel por máquina virtual da una frontera más amplia y permite otro sistema operativo, a costa de un arranque completo y más memoria por instancia. Un kernel compartido arranca más rápido y permite más cargas por anfitrión, pero una vulnerabilidad o un ajuste del kernel es común a todas.","Luego ubica las piezas de AWS. Las instancias EC2 se construyen sobre el sistema Nitro, que mueve el procesamiento de red y almacenamiento a hardware dedicado, y los tipos bare metal quitan del todo la capa de virtualización. Con AWS Fargate ejecutas contenedores sobre un aislamiento que AWS administra, así que eliges el modelo de servicio, no el kernel."]},"pitfalls":{"en":["Calling a container a lightweight virtual machine. It shares the host kernel, so it cannot run a different kernel, and the boundary it provides is different in kind, which matters when hosting untrusted code.","Running containers without limits. With no memory or processor limit per control group, one container can consume a host's capacity and the symptom appears in its neighbours rather than in the cause."],"es":["Llamar a un contenedor máquina virtual ligera. Comparte el kernel del anfitrión, así que no puede correr otro kernel, y la frontera que ofrece es de otra naturaleza, lo que importa al alojar código no confiable.","Ejecutar contenedores sin límites. Sin límite de memoria o procesador por grupo de control, un contenedor puede consumir la capacidad del anfitrión y el síntoma aparece en sus vecinos, no en la causa."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man7/namespaces.7.html","label":"man7.org: namespaces.7"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"},{"url":"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html","label":"docs.aws.amazon.com: ec2 nitro instances"}]}},{"id":"systems-storage","parent":"systems","title":{"en":"Storage Fundamentals","es":"Fundamentos de almacenamiento"},"summary":{"en":"Compare block, file and object storage before choosing a storage service.","es":"Compara almacenamiento por bloques, archivos y objetos antes de elegir un servicio."},"details":{"en":["Block storage exposes raw addressable blocks to the OS (a filesystem is built on top); object storage exposes whole immutable objects via HTTP APIs with rich metadata but no in-place partial edits; file storage exposes a shared hierarchical namespace over a network protocol (NFS/SMB). Choosing wrong causes real pain: object storage is not a POSIX filesystem, so lift-and-shift apps expecting file locks and byte-range in-place writes belong on EFS or FSx, not S3."],"es":["El almacenamiento por bloques expone bloques direccionables crudos al SO (un sistema de archivos se construye encima); el almacenamiento de objetos expone objetos completos e inmutables vía APIs HTTP con metadatos ricos pero sin ediciones parciales in situ; el almacenamiento de archivos expone un espacio de nombres jerarquico compartido sobre un protocolo de red (NFS/SMB). Elegir mal causa dolor real: el almacenamiento de objetos no es un sistema de archivos POSIX, así que las apps migradas que esperan bloqueos de archivo y escrituras parciales in situ pertenecen a EFS o FSx, no a S3."]},"aws":{"en":"EBS = block for a single EC2 instance (or Multi-Attach); S3 = object, durable and regional; EFS/FSx = shared file systems across instances/AZs.","es":"EBS = bloques para una sola instancia EC2 (o Multi-Attach); S3 = objetos, durable y regional; EFS/FSx = sistemas de archivos compartidos entre instancias/AZs."},"question":{"en":"A team wants to migrate a legacy app that uses file locks and in-place edits to the cloud cheaply. Why not S3?","es":"Un equipo quiere migrar barato a la nube una app legacy que usa bloqueos de archivo y ediciones in situ. ¿Por qué no S3?"},"answer":{"en":"Step 1: identify the app's dependency on POSIX semantics (locks, in-place partial writes). Step 2: rule out S3, since objects are immutable and written whole with no locking API. Step 3: choose EFS for Linux POSIX workloads shared across AZs, or FSx for Windows File Server for SMB workloads, and only revisit S3 after refactoring the app to an object-write pattern.","es":"Paso 1: identifica la dependencia de la app en semántica POSIX (bloqueos, escrituras parciales in situ). Paso 2: descarta S3, ya que los objetos son inmutables y se escriben completos sin API de bloqueo. Paso 3: elige EFS para cargas Linux POSIX compartidas entre AZs, o FSx for Windows File Server para cargas SMB, y reconsidera S3 solo después de refactorizar la app a un patrón de escritura de objetos."},"related":["systems-storage-types","systems-raid-durability","systems-filesystems"],"sources":[{"label":"Amazon S3 - What is Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"url":"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html","label":"docs.aws.amazon.com: whatisefs"},{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html","label":"docs.aws.amazon.com: ebs volume types"}],"level":"foundation","learning":{"definition":{"en":"Storage comes in three models. Block storage exposes raw addressable blocks that a filesystem or database organises. File storage exposes a shared hierarchical namespace over a network protocol. Object storage exposes whole objects addressed by key, with metadata, over a web interface.","es":"El almacenamiento tiene tres modelos. El de bloques expone bloques crudos direccionables que organiza un sistema de archivos o una base de datos. El de archivos expone un espacio de nombres jerárquico compartido por un protocolo de red. El de objetos expone objetos completos direccionados por clave, con metadatos, por una interfaz web."},"simple":{"en":"Block storage is a bare disk you format yourself. File storage is a shared folder several machines can mount. Object storage is a keyed store for whole files, reached over the network.","es":"El de bloques es un disco crudo que formateas tú. El de archivos es una carpeta compartida que varias máquinas pueden montar. El de objetos es un almacén por clave para archivos completos, alcanzado por red."},"analogy":{"en":"Block is an empty filing cabinet you organise, file storage is a shared cabinet with agreed folders and a lock, object storage is a cloakroom where you hand over a bag and get a ticket. Limit: in a cloakroom you can open the bag and change one item, while a general purpose object write replaces the object, so the cloakroom hides the cost of small updates.","es":"Bloques es un archivador vacío que organizas tú, archivos es un archivador compartido con carpetas acordadas y un cerrojo, objetos es un guardarropa donde entregas una bolsa y recibes un ticket. Límite: en un guardarropa puedes abrir la bolsa y cambiar un artículo, mientras una escritura de objetos de propósito general reemplaza el objeto, así que el guardarropa oculta el costo de las actualizaciones pequeñas."},"walkthrough":{"en":["Decide from access semantics. Software that updates bytes in place and maintains its own on disk format, such as a database engine, needs block storage. Several machines that must see one directory tree with file locking need file storage. Whole items written and read by key are simpler and cheaper in object storage.","Then weigh sharing and lifetime. A block volume is normally attached to one instance at a time, so it does not spread state across a fleet, while file storage is designed for concurrent mounts. Object storage is reached by many clients at once because each request is i
