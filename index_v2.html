goes next on its journey. Longest-prefix matching selects the matching destination range with the greatest number of fixed leading bits, so more specific routes take precedence.","es":"El enrutamiento decide hacia dónde se envía un paquete IP en el siguiente tramo de su recorrido. La coincidencia de prefijo más largo selecciona el rango coincidente con más bits iniciales fijos, dando prioridad a las rutas más específicas."},"simple":{"en":"A router reads a packet's destination address and compares it with entries in a routing table. Each entry pairs an address range, called a prefix, with a forwarding target or next hop. Several ranges can contain the same destination. The router uses the matching entry with the longest prefix because it describes the narrowest range. A default route covers the whole address family and applies when no more specific entry matches.","es":"Un router lee la dirección de destino del paquete y la compara con las entradas de una tabla de rutas. Cada entrada vincula un rango, llamado prefijo, con un destino de reenvío o siguiente salto. Varios rangos pueden contener la misma dirección. El router utiliza el prefijo coincidente más largo porque delimita el rango más pequeño. La ruta por defecto abarca toda la familia de direcciones y se aplica cuando no hay una coincidencia más específica."},"analogy":{"en":"A delivery desk uses a street-specific forwarding note before a city-wide one. Routing makes a similar choice by destination range, but it does not judge distance, road quality or delivery success.","es":"Una oficina de reparto sigue una indicación para una calle antes que otra para toda la ciudad. Las rutas se eligen de forma parecida, pero sin valorar distancia, estado del camino ni éxito de entrega."},"walkthrough":{"en":["An office router has three entries: 0.0.0.0/0 towards its internet provider, 10.0.0.0/16 towards the corporate network, and 10.0.1.0/24 towards an inspection gateway. A laptop sends a packet to an internal server at 10.0.1.9.","All three ranges contain 10.0.1.9, but /24 fixes more leading bits than /16 or /0. The router therefore sends this packet to the inspection gateway, even if someone added the default route more recently.","The gateway forwards the packet to the server. For the reply, the server's network performs its own route lookup towards the laptop's address. The team confirms that this return path exists and meets the inspection design."],"es":["El router de una oficina tiene tres entradas: 0.0.0.0/0 hacia su proveedor de internet, 10.0.0.0/16 hacia la red corporativa y 10.0.1.0/24 hacia una pasarela de inspección. Un portátil envía un paquete a un servidor interno, 10.0.1.9.","Los tres rangos contienen 10.0.1.9, pero /24 fija más bits iniciales que /16 o /0. Por eso, el router envía el paquete a la pasarela de inspección, aunque alguien haya añadido la ruta por defecto más recientemente.","La pasarela reenvía el paquete al servidor. Para responder, la red del servidor realiza su propia consulta de rutas hacia la dirección del portátil. El equipo confirma que existe ese camino de vuelta y que encaja con el diseño de inspección."]},"pitfalls":{"en":["A selected route does not grant access. A firewall can reject the packet later, and a next hop can be unavailable even while its route remains selected.","Equal-length matches need platform-specific rules, which may depend on how routes were learned. Longest-prefix matching alone cannot decide between otherwise competing routes for the same range."],"es":["Seleccionar una ruta no concede acceso. Un cortafuegos puede rechazar el paquete después, y el siguiente salto puede no estar disponible aunque su ruta siga seleccionada.","Las coincidencias de igual longitud necesitan reglas propias de la plataforma, que pueden depender de cómo se obtuvieron las rutas. El prefijo más largo no resuelve por sí solo una competencia por el mismo rango."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html","label":"docs.aws.amazon.com: VPC Route Tables"},{"url":"https://www.rfc-editor.org/rfc/rfc791","label":"rfc-editor.org: rfc791"}]}},{"id":"icmp","parent":"osi-3","title":{"en":"ICMP and diagnostics","es":"ICMP y diagnóstico"},"summary":{"en":"Use ICMP as evidence about packet delivery, not as a complete application health check.","es":"ICMP aporta pistas sobre la entrega de paquetes, pero no sustituye una prueba de la aplicación."},"details":{"en":["In IPv6, an intermediate router does not split an oversized packet into fragments; the source must react to the path's size limit. IPv4 routers may fragment packets when fragmentation is allowed. Some transports can also discover usable packet sizes by probing, so filtering ICMP does not produce identical symptoms for every application."],"es":["En IPv6, un router intermedio no divide en fragmentos un paquete demasiado grande: el origen debe adaptarse al límite del trayecto. Los routers IPv4 sí pueden fragmentar si el paquete lo permite. Algunos transportes también descubren tamaños viables mediante sondas, así que filtrar ICMP no causa los mismos síntomas en todas las aplicaciones."]},"aws":{"en":"For an EC2 IPv6 workload, allow inbound ICMPv6 Packet Too Big messages, type 2, in the relevant security group and network ACL rules so the instance can learn a smaller path MTU.","es":"En una instancia EC2 con IPv6, permite la entrada de mensajes ICMPv6 Packet Too Big, tipo 2, en las reglas pertinentes del grupo de seguridad y de la ACL de red, para que la instancia conozca una MTU menor."},"question":{"en":"An EC2 instance can establish an IPv6 HTTPS connection, but large uploads stall across a tunnel. Ping also times out. Would you treat the instance as down?","es":"Una instancia EC2 establece una conexión HTTPS por IPv6, pero las subidas grandes se bloquean al atravesar un túnel. Ping tampoco responde. ¿Darías la instancia por caída?"},"answer":{"en":"No. Establishing HTTPS shows that some traffic reaches the service, while a ping timeout only tells me that no echo reply arrived. Small exchanges succeeding and large ones stalling suggest a packet-size problem, although they do not prove it. I would check the tunnel's effective MTU and whether ICMPv6 Packet Too Big messages reach the sender. Then I would retry the upload while observing packet sizes and retransmissions, rather than treating a successful ping as the target outcome.","es":"No. Establecer HTTPS indica que parte del tráfico llega al servicio; un ping sin respuesta solo indica que no ha llegado el eco. Que funcionen intercambios pequeños y fallen los grandes apunta a un problema de tamaño de paquete, aunque no lo demuestra. Revisaría la MTU efectiva del túnel y si los mensajes ICMPv6 Packet Too Big llegan al emisor. Después repetiría la subida observando tamaños y retransmisiones, en vez de considerar que conseguir respuesta al ping es el objetivo."},"related":["mtu","troubleshooting"],"sources":[{"label":"ICMP: RFC 792","url":"https://www.rfc-editor.org/rfc/rfc792"},{"label":"IPv6 Path MTU Discovery: RFC 8201","url":"https://www.rfc-editor.org/rfc/rfc8201"}],"level":"applied","learning":{"definition":{"en":"ICMP carries control messages about IP packet delivery, helping devices report problems and test reachability. IPv4 uses ICMP, while IPv6 uses the related protocol ICMPv6. These messages provide network feedback rather than an application's data.","es":"ICMP transporta mensajes de control sobre la entrega de paquetes IP para comunicar problemas y comprobar si un destino responde. IPv4 utiliza ICMP e IPv6 emplea el protocolo relacionado ICMPv6. Estos mensajes informan sobre la red en lugar de transportar los datos de una aplicación."},"simple":{"en":"Routers and destination devices send ICMP messages back to a packet's source to report delivery problems or answer diagnostic requests. Ping asks for an echo reply. Traceroute commonly sends probes whose TTL in IPv4, a counter reduced at each router, expires at successive hops; the resulting time-exceeded messages identify responding routers. A destination-unreachable message reports that delivery failed for a stated reason. These reports help locate faults, but missing replies may reflect filtering rather than a failed application.","es":"Los routers y los equipos de destino envían mensajes ICMP al origen de un paquete para comunicar problemas de entrega o responder a consultas de diagnóstico. Ping solicita una respuesta de eco. Traceroute suele enviar sondas cuyo TTL en IPv4, un contador que disminuye en cada router, se agota en saltos sucesivos; los avisos de tiempo excedido identifican los routers que responden. Un mensaje de destino inalcanzable indica por qué ha fallado la entrega. No recibir respuestas puede indicar filtrado, no necesariamente un fallo de la aplicación."},"analogy":{"en":"ICMP resembles a courier's delivery notice: it reports a problem or answers a status enquiry rather than carrying the parcel. The comparison ends there; network devices may suppress notices without stopping every delivery.","es":"ICMP se parece al aviso de una empresa de mensajería: informa de problemas o responde a una consulta, sin transportar el paquete. La comparación tiene un límite: la red puede omitir avisos y seguir entregando datos."},"walkthrough":{"en":["A remote employee can open an IPv6 document portal through a VPN, but uploading a large file stalls. The laptop sends 1,500-byte packets, while a router along the path can forward only 1,280-byte packets.","That router drops an oversized packet and sends an ICMPv6 Packet Too Big message towards the laptop. The message advertises the smaller limit, but a firewall blocks it, leaving the sender without that size feedback.","The network team permits the relevant error messages and repeats the upload. The sender learns the path MTU, the largest IP packet size that the route supports, and sends smaller packets; this time the transfer completes."],"es":["Una empleada en remoto abre un portal de documentos por IPv6 a través de una VPN, pero la subida de un archivo grande se queda bloqueada. Su portátil envía paquetes de 1.500 bytes y un router del trayecto solo admite 1.280.","Ese router descarta un paquete demasiado grande y envía al portátil un mensaje ICMPv6 Packet Too Big, que indica que el paquete supera el tamaño permitido. El aviso incluye el límite menor, pero un cortafuegos lo bloquea y el emisor no recibe esa información.","El equipo de red permite esos mensajes de error y repite la subida. El emisor aprende la MTU del trayecto, el tamaño máximo de paquete IP que admite la ruta, y envía paquetes menores; esta vez la transferencia termina."]},"pitfalls":{"en":["No echo reply does not establish that a host is offline; echo may be filtered or rate-limited. An echo reply also says nothing about whether HTTPS authentication works.","Blocking every ICMP type removes useful error feedback, including Path MTU Discovery signals. Permit the messages the design needs rather than assuming all diagnostics are harmless or all are unnecessary."],"es":["No recibir respuesta de eco no demuestra que el equipo esté apagado: esas respuestas pueden filtrarse o limitarse. Recibirla tampoco confirma que funcione la autenticación HTTPS.","Bloquear todos los tipos de ICMP elimina información útil, incluidos avisos para descubrir la MTU del trayecto. Permite los mensajes necesarios para el diseño, sin suponer que todo diagnóstico es inocuo ni que siempre sobra."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc792","label":"rfc-editor.org: rfc792"},{"url":"https://www.rfc-editor.org/rfc/rfc8201","label":"rfc-editor.org: rfc8201"}]}},{"id":"tcp","parent":"osi-4","title":{"en":"TCP: reliability and connections","es":"TCP: fiabilidad y conexiones"},"summary":{"en":"TCP rebuilds an ordered byte stream; your application must define complete messages and successful operations.","es":"TCP reconstruye un flujo ordenado de bytes; tu aplicación debe definir qué es un mensaje completo y cuándo termina bien una operación."},"details":{"en":["A TCP connection can close one direction while leaving the other open. With a half-close, one application signals that it will send no more bytes, yet can still receive a reply. This is useful when an application treats the end of incoming data as the end of a request; a reset is different and can interrupt the exchange abruptly."],"es":["Una conexión TCP puede cerrar un sentido y mantener abierto el otro. Con un cierre parcial, una aplicación indica que no enviará más bytes, pero todavía puede recibir una respuesta. Esto resulta útil si una aplicación interpreta el fin de los datos entrantes como el final de una petición; un reinicio de la conexión es distinto y puede interrumpir el intercambio de golpe."]},"aws":{"en":"For a photo-upload service on Amazon EC2, store an upload ID with the result so a client can check an uncertain attempt before sending the same photo again.","es":"En un servicio de subida de fotos alojado en Amazon EC2, guarda un identificador de subida junto al resultado para que el cliente pueda consultar un intento incierto antes de enviar otra vez la misma foto."},"question":{"en":"Our upload request timed out, but the server log shows the photo was saved. Should we reconnect and upload it again immediately?","es":"Nuestra petición de subida agotó el tiempo de espera, pero el registro del servidor indica que la foto se guardó. ¿Debemos reconectar y subirla de nuevo inmediatamente?"},"answer":{"en":"First check the outcome using the upload ID rather than treating the timeout as a failed save. TCP can recover missing bytes, but a broken connection or a client deadline can hide the server's final response. The server may already have completed the operation. If the service supports safe retries, repeat the request with the same ID and have it return the recorded result instead of creating another upload. Otherwise, reconcile the stored photo before retrying an operation that could duplicate work.","es":"Consulta primero el resultado con el identificador de la subida, en vez de interpretar el tiempo de espera agotado como un fallo al guardar. TCP recupera bytes perdidos, pero una conexión interrumpida o el plazo del cliente pueden ocultar la respuesta final. El servidor podría haber terminado ya. Si el servicio admite reintentos seguros, repite la petición con el mismo identificador para recuperar el resultado registrado, sin crear otra subida. Si no, comprueba qué foto quedó almacenada antes de repetir una operación que podría duplicar trabajo."},"related":["udp","tls","load-balancing","sessions"],"sources":[{"label":"TCP: RFC 9293","url":"https://www.rfc-editor.org/rfc/rfc9293"}],"level":"foundation","learning":{"definition":{"en":"Transmission Control Protocol (TCP) lets two applications communicate through a connection carrying a continuous sequence of bytes. Its purpose is to reconstruct those bytes in the order sent, recovering missing data while the connection remains viable, rather than interpreting what the data means.","es":"TCP, o protocolo de control de transmisión, permite comunicar dos aplicaciones mediante una conexión que transporta una secuencia continua de bytes. Su finalidad es reconstruir esos bytes en el orden enviado, recuperando los que falten mientras la conexión siga siendo viable, sin interpretar qué significan los datos."},"simple":{"en":"A client asks to connect with SYN; the server replies with SYN-ACK, and the client completes setup with ACK. Data travels in segments with sequence numbers locating their bytes. The receiver acknowledges progress, helping the sender detect gaps and resend missing bytes. The receiver advertises a window, the amount of data it can accept: this is flow control. Congestion control separately adjusts sending to signs of network pressure. The application still decides where each message ends.","es":"El cliente pide conectar con SYN; el servidor responde con SYN-ACK y el cliente termina el establecimiento con ACK. Los datos viajan en segmentos numerados para situar sus bytes. El receptor confirma el avance, lo que ayuda al emisor a detectar huecos y reenviar lo perdido. Anuncia una ventana, la cantidad de datos que puede aceptar: es el control de flujo. Por separado, el control de congestión ajusta el envío según la presión en la red. La aplicación decide dónde termina cada mensaje."},"analogy":{"en":"Imagine numbered pages sent to an editor who requests missing pages and stacks them in order. TCP does similar bookkeeping for bytes, but cannot tell whether the editor approved the story or merely received it.","es":"Imagina páginas numeradas enviadas a un editor que reclama las que faltan y las ordena. TCP lleva una cuenta parecida de bytes, pero no sabe si el editor aprobó el relato o solo lo recibió."},"walkthrough":{"en":["Maya uploads a photo to a storage service. After connection setup, her laptop sends its bytes in several segments; a field in the application request tells the service the expected photo length.","A segment disappears while later segments arrive. The receiver can hold those later bytes, but the application cannot read past the gap until TCP recovers the missing bytes through retransmission.","The server saves the complete photo, but its success response never reaches Maya before her app times out. She faces an uncertain outcome: safely repeating the upload now depends on the service's retry design."],"es":["Maya sube una foto a un servicio de almacenamiento. Tras establecer la conexión, su portátil envía los bytes en varios segmentos; un campo de la petición indica al servicio la longitud prevista de la foto.","Un segmento se pierde mientras llegan otros posteriores. El receptor puede conservar esos bytes, pero la aplicación no puede leer más allá del hueco hasta que TCP recupere los bytes que faltan mediante una retransmisión.","El servidor guarda la foto completa, pero la respuesta de éxito no llega a Maya antes de que venza el tiempo de espera. El resultado queda incierto: repetir la subida de forma segura depende del diseño de reintentos del servicio."]},"pitfalls":{"en":["A successful send call may mean only that the local system accepted bytes into a buffer. It does not establish that the remote application processed or stored them.","Two application writes may appear as one read, or one write as several reads. Define message lengths or separators instead of treating read calls as message boundaries."],"es":["Que una llamada de envío termine correctamente puede significar solo que el sistema local aceptó bytes en un búfer. No demuestra que la aplicación remota los haya procesado o guardado.","Dos escrituras de la aplicación pueden llegar en una sola lectura, o una escritura en varias lecturas. Define longitudes de mensaje o separadores, en lugar de usar las llamadas de lectura para delimitar mensajes."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"}]},"diagrams":[{"id":"tcp-handshake","kind":"sequence","nodes":["tcp"],"title":{"en":"How a TCP connection starts","es":"Cómo empieza una conexión TCP"},"caption":{"en":"Before exchanging application data, a normal TCP connection synchronises both endpoints with SYN, SYN-ACK and ACK. The client can send data with the third message, after one round trip. TLS, when used, has its own negotiation on top of TCP.","es":"Antes de intercambiar datos de aplicación, una conexión TCP normal sincroniza los extremos con SYN, SYN-ACK y ACK. El cliente puede enviar datos con el tercer mensaje, tras una ida y vuelta. TLS, cuando se usa, tiene su propia negociación sobre TCP."},"alt":{"en":"Client to server: SYN proposes the client sequence number. Server to client: SYN-ACK acknowledges it and proposes the server sequence number. Client to server: ACK confirms; application data may begin. Server to client: response data. This normal setup costs a round trip; TLS negotiation is separate. A silently dropped packet produces retries and a possible timeout, while a reachable closed port normally returns RST.","es":"Cliente a servidor: SYN propone el número de secuencia del cliente. Servidor a cliente: SYN-ACK lo confirma y propone el suyo. Cliente a servidor: ACK confirma y pueden empezar los datos. Servidor a cliente: datos de respuesta. Este establecimiento normal requiere una ida y vuelta; la negociación TLS es aparte. Un descarte sin aviso provoca reintentos y posible timeout; un puerto cerrado alcanzable suele devolver RST."},"actors":[{"id":"client","label":{"en":"Client","es":"Cliente"}},{"id":"server","label":{"en":"Server","es":"Servidor"}}],"steps":[{"from":"client","to":"server","label":{"en":"SYN: the client proposes its initial sequence number","es":"SYN: el cliente propone su número de secuencia inicial"},"note":{"en":"If the packet or its reply is silently dropped, the client retries and eventually times out. Check routes and traffic filters before assuming the application is slow.","es":"Si el paquete o su respuesta se descarta sin aviso, el cliente reintenta y acaba agotando el tiempo de espera. Comprueba rutas y filtros antes de atribuirlo a una aplicación lenta."}},{"from":"server","to":"client","label":{"en":"SYN-ACK: the server acknowledges and supplies its own number","es":"SYN-ACK: el servidor confirma y aporta su propio número"},"note":{"en":"A reachable host with no application listening on this port normally returns RST instead. That produces a connection-refused error rather than a silent timeout.","es":"Un equipo alcanzable sin una aplicación escuchando en ese puerto suele devolver RST. Eso produce un error de conexión rechazada, en lugar de una espera sin respuesta."}},{"from":"client","to":"server","label":{"en":"ACK: the client acknowledges the server; data can begin","es":"ACK: el cliente confirma al servidor y pueden empezar los datos"},"note":{"en":"TCP is now established. HTTPS still needs TLS negotiation before normal HTTP data is exchanged. Reusing an existing connection avoids repeating connection setup.","es":"TCP ya está establecido. HTTPS todavía necesita negociar TLS antes del intercambio normal de datos HTTP. Reutilizar una conexión existente evita repetir su establecimiento."}},{"from":"server","to":"client","label":{"en":"Response data, acknowledged as it arrives","es":"Datos de respuesta, confirmados a medida que llegan"},"note":{"en":"TCP acknowledges bytes, not business results. An application still needs to confirm whether an order was accepted. Either endpoint can close normally with FIN or abort with RST.","es":"TCP confirma bytes, no resultados de negocio. La aplicación todavía debe confirmar si aceptó un pedido. Cualquier extremo puede cerrar normalmente con FIN o interrumpir la conexión con RST."}}]}]},{"id":"udp","parent":"osi-4","title":{"en":"UDP and datagrams","es":"UDP y datagramas"},"summary":{"en":"UDP keeps messages separate and leaves the application to decide whether a missing or stale message still matters.","es":"UDP mantiene separados los mensajes y deja a la aplicación decidir si un mensaje perdido o antiguo sigue siendo relevante."},"details":{"en":["DNS often sends queries using UDP. If a reply has its truncation flag set, a resolver can repeat the query over TCP to receive the full answer. That flag means the UDP reply was shortened, not that UDP detected packet loss. A firewall that admits only UDP on port 53 can therefore break otherwise ordinary DNS lookups."],"es":["DNS suele enviar consultas mediante UDP. Si una respuesta lleva activado el indicador de truncamiento, el resolvedor puede repetir la consulta por TCP para recibir la respuesta completa. Ese indicador señala que se recortó la respuesta UDP, no que UDP detectara una pérdida de paquetes. Por eso, un cortafuegos que solo admita UDP en el puerto 53 puede impedir que funcionen consultas DNS normales."]},"aws":{"en":"When configuring a security group for a DNS resolver on Amazon EC2, permit both UDP and TCP on port 53 from the intended clients so larger replies have a TCP route.","es":"Al configurar el grupo de seguridad de un resolvedor DNS en Amazon EC2, permite UDP y TCP en el puerto 53 desde los clientes previstos para que las respuestas mayores puedan recurrir a TCP."},"question":{"en":"A game looks smooth despite some missing position updates. Can we send purchase confirmations the same way and simply keep the newest one?","es":"Un juego se ve fluido aunque se pierdan algunas actualizaciones de posición. ¿Podemos enviar igual las confirmaciones de compra y quedarnos solo con la más reciente?"},"answer":{"en":"No. A position update describes current state, so a later complete update can make a missing one irrelevant. A purchase confirmation refers to a particular transaction; a newer confirmation for another purchase cannot replace it. Use a reliable transport for purchases, and give each transaction an identifier that links retries to one recorded outcome. The transport can help recover lost data, but only the application's transaction record can tell the client whether the purchase completed.","es":"No. Una actualización de posición describe el estado actual, así que otra posterior y completa puede hacer irrelevante la que falta. Una confirmación de compra corresponde a una transacción concreta; una confirmación más reciente de otra compra no la sustituye. Usa un transporte fiable para las compras y asigna a cada transacción un identificador que vincule los reintentos a un único resultado registrado. El transporte ayuda a recuperar datos perdidos, pero solo el registro de transacciones de la aplicación puede indicar al cliente si la compra se completó."},"related":["tcp","quic","dns"],"sources":[{"label":"UDP: RFC 768","url":"https://www.rfc-editor.org/rfc/rfc768"},{"url":"https://www.rfc-editor.org/rfc/rfc1035","label":"rfc-editor.org: rfc1035"}],"level":"foundation","learning":{"definition":{"en":"User Datagram Protocol (UDP) sends separate messages, called datagrams, between applications identified by ports. It suits communication where each message can stand on its own and the application decides how to handle a missing, late or repeated update.","es":"UDP, o protocolo de datagramas de usuario, envía mensajes separados, llamados datagramas, entre aplicaciones identificadas mediante puertos. Encaja en comunicaciones donde cada mensaje puede entenderse por sí solo y la aplicación decide qué hacer con una actualización perdida, tardía o repetida."},"simple":{"en":"The sender gives UDP one datagram and a destination address and port, identifying the host and receiving endpoint. UDP adds a small header and hands the datagram to IP for routing, without first establishing a connection with the receiver. At the other end, UDP keeps that datagram separate from other messages. It does not wait for delivery acknowledgments or resend missing messages; recovery and freshness checks belong to software above UDP.","es":"El emisor entrega a UDP un datagrama y una dirección y puerto de destino, que identifican el equipo y el punto de recepción. UDP añade una pequeña cabecera y pasa el datagrama a IP para encaminarlo, sin establecer antes una conexión con el receptor. Al llegar, UDP mantiene ese datagrama separado de los demás. No espera confirmaciones de entrega ni reenvía mensajes perdidos; la recuperación y la detección de actualizaciones antiguas corresponden al software que utiliza UDP."},"analogy":{"en":"Think of a scoreboard receiving separate handwritten score slips. A newer score can replace a missing update, but UDP does not print timestamps or discard stale slips; the application must provide that logic.","es":"Piensa en un marcador que recibe papeletas con el resultado. Uno más reciente puede sustituir una actualización perdida, pero UDP no fecha ni descarta papeletas antiguas; esa lógica corresponde a la aplicación."},"walkthrough":{"en":["A multiplayer game sends a player's current position every 50 milliseconds. Each UDP datagram includes a position and an application-generated sequence number, letting the receiving game identify the age of that update.","Update 42 disappears, while update 43 arrives on time. Because 43 contains the full current position, the game can use it without waiting for 42, accepting a brief visual jump rather than delayed movement.","Update 41 arrives late. The game ignores it using its sequence number, avoiding a backwards movement. If the same datagram arrives twice, the same check helps avoid applying the old update again."],"es":["Un juego multijugador envía la posición actual de un jugador cada 50 milisegundos. Cada datagrama UDP incluye una posición y un número de secuencia generado por la aplicación, que permite al juego receptor identificar la antigüedad de esa actualización.","La actualización 42 se pierde y la 43 llega a tiempo. Como la 43 contiene la posición actual completa, el juego puede usarla sin esperar a la 42, aceptando un pequeño salto visual en vez de retrasar el movimiento.","La actualización 41 llega con retraso. El juego la descarta por su número de secuencia para evitar un movimiento hacia atrás. Si un datagrama llega dos veces, esa misma comprobación ayuda a no aplicar otra vez la actualización antigua."]},"pitfalls":{"en":["Do not reuse the position-update policy for a purchase request. A payment needs application-level confirmation and duplicate handling; ignoring a missing datagram would leave the business operation unresolved.","UDP's small header and lack of connection setup do not establish which option is quicker. Loss recovery, pacing and the application's deadline can dominate the user's experience."],"es":["No reutilices la política de actualizaciones de posición para una petición de compra. Un pago necesita confirmación de la aplicación y tratamiento de duplicados; ignorar un datagrama perdido dejaría la operación comercial sin resolver.","La cabecera pequeña de UDP y la ausencia de establecimiento de conexión no determinan qué opción es más rápida. La recuperación de pérdidas, el ritmo de envío y el plazo de la aplicación pueden condicionar la experiencia del usuario."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc768","label":"rfc-editor.org: rfc768"},{"url":"https://www.rfc-editor.org/rfc/rfc1035","label":"rfc-editor.org: rfc1035"}]}},{"id":"quic","parent":"osi-4","title":{"en":"QUIC and HTTP/3","es":"QUIC y HTTP/3"},"summary":{"en":"QUIC lets HTTP/3 track each stream separately, although all streams still share network capacity.","es":"QUIC permite a HTTP/3 seguir cada flujo por separado, aunque todos siguen compartiendo capacidad de red."},"details":{"en":["QUIC identifies a connection with connection IDs rather than relying only on an unchanged address and port pair. This can help a supported connection survive a phone moving from Wi-Fi to mobile data. The new path needs validation, and endpoints can restrict migration, so their configuration affects whether the move is usable."],"es":["QUIC distingue una conexión mediante identificadores propios, en lugar de depender únicamente de que sus direcciones y puertos no cambien. Esto puede permitir que una conexión compatible continúe cuando un móvil pasa de wifi a datos móviles. La nueva ruta necesita validación y los participantes pueden limitar la migración; su configuración influye en que el cambio sea viable."]},"aws":{"en":"For a travel site served through Amazon CloudFront, enable HTTP/3 on the distribution to let compatible visitors use QUIC between their browser and CloudFront; the origin connection is configured separately.","es":"En una web de viajes servida mediante Amazon CloudFront, activa HTTP/3 en la distribución para que los visitantes compatibles usen QUIC entre su navegador y CloudFront; la conexión con el origen se configura por separado."},"question":{"en":"We enabled HTTP/3 on our travel site, but a lost packet still delayed the hotel photo and the page felt slow. Is QUIC failing?","es":"Activamos HTTP/3 en nuestra web de viajes, pero un paquete perdido siguió retrasando la foto del hotel y la página parecía lenta. ¿Está fallando QUIC?"},"answer":{"en":"Not necessarily. QUIC still needs the missing bytes before it can finish that photo's stream. Its benefit is that another stream can deliver complete data without waiting for the photo's gap. Look separately at transport progress and page rendering: shared congestion can slow every stream, and a required script can hold up the page even after images arrive. Also confirm that this request actually negotiated HTTP/3, since an enabled server and a supporting browser may still use another HTTP version.","es":"No necesariamente. QUIC sigue necesitando los bytes que faltan para completar el flujo de esa foto. La ventaja es que otro flujo puede entregar sus datos completos sin esperar ese hueco. Separa el avance del transporte de la presentación de la página: la congestión compartida puede ralentizar todos los flujos y un script necesario puede retrasar la página aunque hayan llegado las imágenes. Confirma también que esa petición negoció HTTP/3, porque un servidor habilitado y un navegador compatible aún pueden utilizar otra versión de HTTP."},"related":["udp","tls","http"],"sources":[{"label":"QUIC: RFC 9000","url":"https://www.rfc-editor.org/rfc/rfc9000"},{"url":"https://www.rfc-editor.org/rfc/rfc9114","label":"rfc-editor.org: rfc9114"}],"level":"deep","learning":{"definition":{"en":"QUIC is a transport protocol that runs over UDP and gives applications encrypted connections containing independent byte streams. HTTP/3 is the version of HTTP that uses those QUIC streams to carry web requests and responses, rather than using TCP.","es":"QUIC es un protocolo de transporte que funciona sobre UDP y ofrece a las aplicaciones conexiones cifradas con flujos de bytes independientes. HTTP/3 es la versión de HTTP que utiliza esos flujos QUIC para transportar peticiones y respuestas web, en lugar de emplear TCP."},"simple":{"en":"A browser and server negotiate a QUIC connection and establish encryption through TLS 1.3, the security protocol integrated into its setup. QUIC numbers packets, detects losses and retransmits missing stream data. A stream is an ordered sequence of bytes with its own identity inside the connection. Because ordering is tracked per stream, a gap in one need not prevent another from delivering available bytes. One TCP connection instead orders all its bytes together. QUIC streams still share the connection's congestion control.","es":"Un navegador y un servidor negocian una conexión QUIC y establecen el cifrado mediante TLS 1.3, el protocolo de seguridad integrado en su establecimiento. QUIC numera paquetes, detecta pérdidas y reenvía los datos perdidos. Un flujo es una secuencia ordenada de bytes con identidad propia dentro de la conexión. Al ordenar cada flujo por separado, un hueco no tiene por qué frenar otro flujo. Una conexión TCP ordena conjuntamente todos sus bytes. Los flujos QUIC comparten el control de congestión."},"analogy":{"en":"Picture several numbered folders sharing one courier van. A missing page delays its own folder, not every folder's reading order. QUIC separates those sequences, but traffic slowing the van still affects the shared journey.","es":"Imagina varias carpetas numeradas en una furgoneta de reparto. Una página perdida retrasa su carpeta, no el orden de lectura de las demás. QUIC separa esas secuencias, pero un atasco afecta al trayecto compartido."},"walkthrough":{"en":["Leo opens a travel page over HTTP/3. His browser requests a map image and a hotel photo on separate QUIC streams within one connection, giving each response its own sequence of bytes.","A packet containing only part of the hotel photo is lost. The map's remaining bytes arrive intact, allowing QUIC to deliver them while recovering the missing photo data. The map need not wait for that gap.","The map appears before the photo because its layout instructions are already available. Both transfers still slow if congestion makes QUIC reduce its sending rate; separate streams do not create additional network capacity."],"es":["Leo abre una página de viajes mediante HTTP/3. Su navegador solicita la imagen de un mapa y la foto de un hotel por flujos QUIC separados dentro de una conexión, de modo que cada respuesta tiene su propia secuencia de bytes.","Se pierde un paquete que contiene solo parte de la foto del hotel. Los bytes restantes del mapa llegan intactos, así que QUIC puede entregarlos mientras recupera los datos perdidos de la foto. El mapa no necesita esperar a que se cierre ese hueco.","El mapa aparece antes que la foto porque sus instrucciones de presentación ya están disponibles. Ambas transferencias siguen ralentizándose si la congestión obliga a QUIC a reducir el ritmo de envío; separar flujos no crea más capacidad de red."]},"pitfalls":{"en":["UDP is QUIC's carrier, not its entire behavior. QUIC adds loss recovery and ordering within streams, so a missing packet is not simply forgotten as if every update were disposable.","Independent streams do not make all web resources independent. A script needed to construct the page can delay what the user sees, even when other streams have delivered their content."],"es":["UDP sirve de soporte a QUIC, pero no define todo su comportamiento. QUIC incorpora recuperación de pérdidas y orden dentro de cada flujo, así que no olvida sin más un paquete perdido como si toda actualización fuera prescindible.","Los flujos independientes no hacen independientes todos los recursos web. Un script necesario para construir la página puede retrasar lo que ve el usuario, aunque otros flujos ya hayan entregado su contenido."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9000","label":"rfc-editor.org: rfc9000"},{"url":"https://www.rfc-editor.org/rfc/rfc9114","label":"rfc-editor.org: rfc9114"}]}},{"id":"mtu","parent":"osi-4","title":{"en":"MTU, MSS and throughput","es":"MTU, MSS y rendimiento"},"summary":{"en":"MTU limits packet size, MSS limits TCP data per segment, and throughput also depends on how much data can stay in flight.","es":"La MTU limita el paquete, la MSS limita los datos TCP de cada segmento y la velocidad también depende de cuántos datos pueden seguir en vuelo."},"details":{"en":["A packet capture taken on the sending machine may show packets larger than the link MTU because the operating system hands a large buffer to the network card for later segmentation. These offload features change what the local capture observes, not what every physical link can carry. Before diagnosing oversized traffic, compare captures at the sender and on the actual network path."],"es":["Una captura de paquetes en el equipo emisor puede mostrar paquetes mayores que la MTU del enlace porque el sistema operativo entrega un búfer grande a la tarjeta de red para que lo segmente después. Esa delegación de trabajo cambia lo que ve la captura local, no lo que admite cada enlace físico. Antes de diagnosticar tráfico demasiado grande, compara capturas del emisor con otras tomadas en la ruta real de la red."]},"aws":{"en":"For an EC2 instance sending backups through a VPN, check the tunnel's effective MTU and size-error feedback when small health checks work but large uploads stall.","es":"En una instancia EC2 que envía copias de seguridad por una VPN, revisa la MTU efectiva del túnel y los avisos de tamaño si las comprobaciones de estado pequeñas funcionan pero las subidas grandes se atascan."},"question":{"en":"Our backup route is rated at 1 Gbit/s with 80 ms round trips. Small requests work, large transfers sometimes hang, and someone suggests a larger MTU. What should we check?","es":"Nuestra ruta de copias de seguridad ofrece 1 Gbit/s con 80 ms de ida y vuelta. Las peticiones pequeñas funcionan, las transferencias grandes a veces se atascan y alguien propone subir la MTU. ¿Qué debemos comprobar?"},"answer":{"en":"Check the path's packet-size limit and whether the sender receives oversized-packet feedback. Increasing the local MTU could worsen a stall at a smaller downstream link. Once packets fit, examine how much TCP data can remain unacknowledged. One gigabit per second multiplied by 0.08 seconds is 80 megabits, or about 10 MB in flight. That is a reference for filling this path, subject to congestion and receiver capacity. Also check storage and CPU before attributing the remaining limit to networking.","es":"Comprueba el tamaño de paquete que admite la ruta y si llegan al emisor los avisos de paquetes demasiado grandes. Subir la MTU local podría empeorar el atasco en un enlace más estrecho. Una vez resuelto eso, revisa cuántos datos TCP pueden quedar pendientes de confirmación. Multiplicar 1 Gbit/s por 0,08 segundos da 80 megabits, unos 10 MB en vuelo. Es una referencia para llenar la ruta, condicionada por la congestión y la capacidad del receptor. Revisa también disco y CPU antes de atribuir el límite restante a la red."},"related":["tcp","icmp","direct-connect"],"sources":[{"label":"TCP: RFC 9293","url":"https://www.rfc-editor.org/rfc/rfc9293"},{"label":"IPv6 Path MTU Discovery: RFC 8201","url":"https://www.rfc-editor.org/rfc/rfc8201"}],"level":"deep","learning":{"definition":{"en":"Maximum Transmission Unit (MTU) is the largest IP packet a network link can carry as one unit. TCP's Maximum Segment Size (MSS) limits the TCP data bytes in a segment, excluding IP and TCP headers. Both help explain whether packet size suits a route, but neither states how quickly a file will transfer.","es":"La unidad máxima de transmisión (MTU) es el mayor paquete IP que un enlace puede transportar como una sola unidad. El tamaño máximo de segmento (MSS) de TCP limita los bytes de datos de un segmento, sin contar las cabeceras IP y TCP. Ambos ayudan a explicar si el tamaño de paquete encaja en una ruta, pero no indican cuánto tardará una transferencia."},"simple":{"en":"A route can cross links with different MTUs; the smallest sets the path MTU. Path MTU Discovery lets a sender learn which packet size fits that route. With IPv6, a router drops an oversized packet instead of splitting it, and normally reports the limit using an ICMPv6 Packet Too Big message. ICMPv6 carries network control information. The sender can then reduce packet size. Tunnel encapsulation adds outer headers, leaving less room for the original packet on the underlying link.","es":"Una ruta puede atravesar enlaces con distintas MTU; la menor fija la MTU de la ruta. Path MTU Discovery permite al emisor averiguar qué tamaño cabe. En IPv6, un router descarta un paquete demasiado grande en vez de dividirlo y normalmente comunica el límite mediante un mensaje ICMPv6 Packet Too Big. ICMPv6 transporta información de control de red. El emisor puede entonces reducir el tamaño. La encapsulación de un túnel añade cabeceras externas, dejando menos espacio para el paquete original en el enlace subyacente."},"analogy":{"en":"Think of delivery boxes passing through doorways: the narrowest doorway limits each box, while packing material takes space away from contents. MTU and MSS describe those sizes, not how quickly the delivery line moves.","es":"Imagina cajas de reparto que atraviesan puertas: la más estrecha limita cada caja y el embalaje resta espacio al contenido. MTU y MSS describen esos tamaños, no la velocidad a la que avanza el reparto."},"walkthrough":{"en":["Nora copies a backup over an IPv6 route. Her laptop sends 1,500-byte IP packets, but a later link accepts only 1,280 bytes. The router drops an oversized packet and reports that smaller limit.","After learning the limit, Nora's sender uses packets no larger than 1,280 bytes. With a 40-byte IPv6 header and a 20-byte TCP header, at most 1,220 bytes remain for data; extra options reduce that space.","The backup still underuses a 1 Gbit/s path with an 80 ms round-trip time. Filling that path requires roughly 10 MB of unacknowledged data in flight, so packet sizing alone cannot explain the transfer rate."],"es":["Nora transfiere una copia de seguridad por una ruta IPv6. Su portátil envía paquetes IP de 1.500 bytes, pero un enlace posterior solo admite 1.280 bytes. El router descarta un paquete demasiado grande y comunica ese límite menor.","Tras conocer el límite, el emisor de Nora usa paquetes de hasta 1.280 bytes. Con una cabecera IPv6 de 40 bytes y otra TCP de 20, quedan como máximo 1.220 bytes de datos; las opciones adicionales reducen ese espacio.","La copia sigue sin aprovechar una ruta de 1 Gbit/s con un tiempo de ida y vuelta de 80 ms. Llenarla requiere unos 10 MB de datos en vuelo pendientes de confirmación, así que el tamaño de paquete no basta para explicar la velocidad."]},"pitfalls":{"en":["Blocking size-error feedback can let small requests succeed while larger transfers stall. A successful connection test therefore does not rule out a path MTU problem.","Do not treat an advertised MSS as a measurement of the whole route. The peer's data-size limit and a later link restriction can constrain the same connection differently."],"es":["Bloquear los avisos sobre paquetes demasiado grandes puede permitir que funcionen peticiones pequeñas mientras se atascan transferencias mayores. Una prueba de conexión correcta no descarta un problema de MTU en la ruta.","No interpretes la MSS anunciada como una medición de toda la ruta. El límite de datos del otro extremo y la restricción de un enlace posterior pueden condicionar de forma distinta la misma conexión."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc8201","label":"rfc-editor.org: rfc8201"},{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"}]},"diagrams":[{"id":"encapsulation","kind":"nest","nodes":["ethernet","mtu"],"title":{"en":"From an application message to an Ethernet frame","es":"Del mensaje de aplicación a la trama Ethernet"},"caption":{"en":"This example carries HTTP over TCP, IPv4 and Ethernet. Each protocol adds control information used by its peer. The receiver interprets the outer frame first, then the packet, the segment and the application data. Other protocol stacks use different formats.","es":"Este ejemplo transporta HTTP sobre TCP, IPv4 y Ethernet. Cada protocolo añade información de control para su receptor. Este interpreta primero la trama exterior y después el paquete, el segmento y los datos de aplicación. Otras pilas de protocolos usan formatos distintos."},"alt":{"en":"Four nested containers: an Ethernet frame contains an IPv4 packet, which contains a TCP segment, which carries HTTP bytes. Ethernet supplies local MAC addresses; IP supplies endpoint addresses and a hop limit; TCP supplies ports and byte sequence numbers. A router replaces link framing and decreases the hop limit. TCP segments do not preserve HTTP message boundaries.","es":"Cuatro contenedores anidados: una trama Ethernet contiene un paquete IPv4; este contiene un segmento TCP que transporta bytes HTTP. Ethernet aporta direcciones MAC locales; IP aporta direcciones de los extremos y un límite de saltos; TCP aporta puertos y números de secuencia. Un router sustituye la trama y reduce el límite de saltos. Los segmentos TCP no conservan los límites de los mensajes HTTP."},"layers":[{"tag":{"en":"Layer 2 frame","es":"Trama de capa 2"},"label":{"en":"Ethernet frame","es":"Trama Ethernet"},"header":{"en":"Destination MAC, source MAC, type, and a frame check sequence at the end","es":"MAC de destino, MAC de origen, tipo y una secuencia de verificación al final"},"note":{"en":"A router removes the incoming link frame and creates a new one for the outgoing link. A switch forwards frames within the Ethernet network.","es":"Un router retira la trama del enlace de entrada y crea otra para el enlace de salida. Un switch reenvía las tramas dentro de la red Ethernet."}},{"tag":{"en":"Layer 3 packet","es":"Paquete de capa 3"},"label":{"en":"IPv4 packet","es":"Paquete IPv4"},"header":{"en":"Source and destination IP addresses, TTL, protocol number, header checksum","es":"Direcciones IP de origen y destino, TTL, número de protocolo, suma de comprobación"},"note":{"en":"The destination IP guides routing. Each router reduces TTL, the remaining hop allowance, and updates the IPv4 header checksum. NAT may also rewrite addresses.","es":"La IP de destino guía el encaminamiento. Cada router reduce el TTL, el número de saltos restantes, y actualiza la suma de comprobación de la cabecera IPv4. Un NAT también puede reescribir direcciones."}},{"tag":{"en":"Layer 4 segment","es":"Segmento de capa 4"},"label":{"en":"TCP segment","es":"Segmento TCP"},"header":{"en":"Source and destination ports, sequence and acknowledgement numbers, flags","es":"Puertos de origen y destino, números de secuencia y confirmación, banderas"},"note":{"en":"Ports identify the endpoints; sequence numbers order the bytes. The receiver advertises a maximum payload size, MSS, while the path MTU also limits how large a packet can travel without fragmentation.","es":"Los puertos identifican los extremos; los números de secuencia ordenan los bytes. El receptor anuncia un tamaño máximo de datos, MSS, y la MTU del camino limita además el paquete que puede viajar sin fragmentarse."}},{"tag":{"en":"Application data","es":"Dato de aplicación"},"label":{"en":"HTTP request or response body","es":"Petición HTTP o cuerpo de respuesta"},"header":{"en":"Method, path, headers, body","es":"Método, ruta, cabeceras, cuerpo"},"note":{"en":"TCP can split this message across segments or combine its bytes with other messages. The application must recognise its own message boundaries.","es":"TCP puede repartir este mensaje entre varios segmentos o combinar sus bytes con otros mensajes. La aplicación debe reconocer dónde empieza y termina cada mensaje."}}]}]},{"id":"sessions","parent":"osi-5","title":{"en":"Sessions, reuse and state","es":"Sesiones, reutilización y estado"},"summary":{"en":"A returning user needs recoverable session data, not the same open network connection.","es":"Para reconocer al usuario que vuelve, hace falta recuperar su sesión, no conservar la misma conexión de red."},"details":{"en":["A cookie and its server-side session record can expire independently. An idle timeout ends a session after inactivity; an absolute timeout limits its total lifetime even if the user keeps working. The server must enforce the chosen expiry rules when handling requests. A cookie remaining in the browser therefore does not prove that the session should still be accepted."],"es":["La cookie y el registro de sesión del servidor pueden caducar por separado. Un tiempo máximo de inactividad pone fin a la sesión si no se utiliza; un límite absoluto restringe su duración aunque el usuario siga trabajando. El servidor debe aplicar las reglas de caducidad al atender peticiones. Por eso, que la cookie siga en el navegador no demuestra que la sesión deba aceptarse."]},"aws":{"en":"For a shop, store session records in Amazon DynamoDB and let each EC2 application instance read them using the cookie's identifier. When an Application Load Balancer routes a later request elsewhere, another instance can recover the session without the first instance's memory.","es":"En una tienda, guarda los registros de sesión en Amazon DynamoDB y permite que cada instancia EC2 los consulte mediante el identificador de la cookie. Si un Application Load Balancer dirige otra petición a una instancia distinta, esta puede recuperar la sesión sin depender de la memoria de la primera."},"question":{"en":"Our shop signs users out whenever we replace an application server, although their browser cookies remain. Would keeping connections open longer fix this?","es":"Nuestra tienda cierra las sesiones de los usuarios cuando sustituimos un servidor de aplicación, aunque las cookies siguen en el navegador. ¿Lo arreglaría mantener las conexiones abiertas más tiempo?"},"answer":{"en":"I would first check where the server stores session records. If they live only in the replaced process, the browser still has an identifier but the new server has no matching record. Longer connection reuse cannot recover that lost data. Put the required records in a shared store with suitable persistence, and have each instance validate and retrieve them. Then test a server replacement with a valid session. Also check expiry settings and instance-specific signing keys, since either can make retained cookies unusable.","es":"Primero comprobaría dónde guarda el servidor los registros de sesión. Si solo estaban en el proceso sustituido, el navegador conserva un identificador, pero el servidor nuevo no encuentra su registro. Mantener conexiones abiertas no recupera esos datos. Guarda los registros necesarios en un almacén compartido con persistencia adecuada y haz que cada instancia los valide y consulte. Después, prueba a sustituir un servidor con una sesión vigente. Revisa también la caducidad y las claves de firma propias de cada instancia: ambas pueden inutilizar una cookie conservada."},"related":["tcp","http","data"],"sources":[{"label":"HTTP semantics: RFC 9110","url":"https://www.rfc-editor.org/rfc/rfc9110.html"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x","label":"developer.mozilla.org: Connection management in HTTP 1.x"}],"level":"applied","learning":{"definition":{"en":"A session gives related requests continuity, such as remembering who signed in and what they are doing. Connection reuse saves network setup work between requests, while state is the information the application retains.","es":"Una sesión da continuidad a peticiones relacionadas, por ejemplo, al recordar quién ha iniciado sesión y qué está haciendo. Reutilizar conexiones ahorra trabajo de establecimiento entre peticiones; el estado es la información que conserva la aplicación."},"simple":{"en":"A browser sends a request to an application server. To recognise a returning user, the server can issue a session identifier, a value stored in a browser cookie, and use it to find session records. Separately, HTTP connection reuse carries more requests over an established TCP connection, the transport carrying those messages. This avoids another setup exchange; it does not decide whose account the request belongs to.","es":"El navegador envía una petición al servidor de la aplicación. Para reconocer al usuario, el servidor puede entregar un identificador de sesión, un valor guardado en una cookie, y buscar con él los registros de sesión. Por separado, HTTP permite reutilizar una conexión TCP, el canal que transporta las peticiones. Así se evita abrir otra conexión para cada intercambio, pero mantener abierto ese canal no identifica por sí solo la cuenta del usuario."},"analogy":{"en":"Think of a hotel booking and a phone call to reception: your booking can survive a dropped call. The comparison stops there, because software needs explicit rules for recognising callers and retaining their records.","es":"Piensa en una reserva de hotel y una llamada a recepción: colgar no cancela la reserva. La comparación tiene un límite: el programa necesita reglas explícitas para reconocer al cliente y conservar sus datos."},"walkthrough":{"en":["Clara signs in to a shop and adds a backpack to her basket. Server A saves her login session and basket in shared storage, then returns a cookie containing the session identifier.","She opens the delivery page over the same TCP connection. The server reads the cookie to locate her session. Connection reuse saves setup work, while the stored basket supplies the items.","Her Wi-Fi drops and she reconnects through mobile data. A new connection reaches server B. With the session still valid and shared storage available, B uses the cookie to retrieve her session and basket."],"es":["Clara inicia sesión en una tienda y añade una mochila a la cesta. El servidor A guarda su sesión y la cesta en un almacén compartido; después devuelve una cookie con el identificador de sesión.","Abre la página de entrega por la misma conexión TCP. El servidor lee la cookie para localizar su sesión. Reutilizar la conexión ahorra trabajo de establecimiento, mientras que la cesta guardada aporta los artículos.","Se corta el wifi y Clara vuelve con datos móviles. Una conexión nueva llega al servidor B. Si la sesión sigue vigente y el almacén compartido está disponible, B utiliza la cookie para recuperar la sesión y la cesta."]},"pitfalls":{"en":["Keeping a basket only in one server's memory risks losing it when that server disappears. Sticky sessions, which route users back there, do not make those contents durable.","A stateless service handles requests without relying on that instance's remembered conversation. Account records, baskets and session data still need somewhere to live."],"es":["Guardar la cesta solo en la memoria de un servidor expone sus datos a perderse si este desaparece. La afinidad de sesión, que dirige al usuario de nuevo allí, no hace duraderos esos datos.","Un servicio sin estado atiende peticiones sin depender de lo que esa instancia recuerde de interacciones anteriores. Las cuentas, las cestas y las sesiones siguen necesitando un lugar donde conservarse."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9110.html","label":"rfc-editor.org: rfc9110"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x","label":"developer.mozilla.org: Connection management in HTTP 1.x"}]}},{"id":"serialization","parent":"osi-6","title":{"en":"Encoding and serialization","es":"Codificación y serialización"},"summary":{"en":"Agree on structure, byte encoding and field meaning so the receiver reconstructs the intended data.","es":"Acordad la estructura, la codificación en bytes y el significado de los campos para reconstruir los datos previstos."},"details":{"en":["A valid JSON number can exceed the exact integer range of a consumer. JavaScript Number, for example, cannot represent every integer above 9,007,199,254,740,991 exactly. If a long order identifier is a label rather than a quantity, representing it as a string avoids that numeric conversion and preserves leading zeros. Both ends must agree to treat the field as text."],"es":["Un número JSON válido puede superar el rango de enteros que el consumidor representa exactamente. Por ejemplo, Number de JavaScript no representa con exactitud todos los enteros superiores a 9.007.199.254.740.991. Si un identificador largo de pedido es una etiqueta y no una cantidad, expresarlo como cadena evita esa conversión numérica y conserva los ceros iniciales. Ambos extremos deben acordar que ese campo es texto."]},"aws":{"en":"For an order queue in Amazon SQS, place UTF-8 JSON in each message body with a currency and an explicitly named totalInCents field. A consuming Lambda function validates the agreed schema before passing the amount to billing.","es":"En una cola de pedidos de Amazon SQS, incluye JSON en UTF-8 en cada mensaje, con la moneda y un campo llamado totalInCents que deje clara la unidad. La función Lambda consumidora valida el esquema acordado antes de pasar el importe a facturación."},"question":{"en":"A billing change makes a €12.50 order appear as €1,250, but JSON validation passes. Where would you look before changing the network code?","es":"Tras un cambio en facturación, un pedido de 12,50 euros aparece como 1.250 euros, pero supera la validación JSON. ¿Qué revisarías antes de cambiar el código de red?"},"answer":{"en":"I would compare the producer's amount field with the consumer's unit assumptions. A value of 1250 represents €12.50 when measured in cents, but €1,250 when interpreted as euros. JSON can carry that number correctly without stating which interpretation applies, and a schema checking only its numeric type will accept both. Check the field contract and the recent change, then make the unit explicit and add a test using a known order total. Changing UTF-8 or the network transport would not resolve this unit mismatch.","es":"Compararía el campo de importe del productor con la unidad que espera el consumidor. El valor 1250 representa 12,50 euros si expresa céntimos, pero 1.250 euros si expresa euros. JSON puede transportar correctamente ese número sin precisar su interpretación; un esquema que solo compruebe el tipo numérico aceptará ambos casos. Revisaría el contrato del campo y el cambio reciente, haría explícita la unidad y añadiría una prueba con un total conocido. Cambiar UTF-8 o el transporte de red no resolvería esta discrepancia de unidades."},"related":["http","data","tls"],"sources":[{"label":"JSON: RFC 8259","url":"https://www.rfc-editor.org/rfc/rfc8259"},{"url":"https://www.rfc-editor.org/rfc/rfc3629","label":"rfc-editor.org: rfc3629"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Base64","label":"developer.mozilla.org: Base64"}],"level":"foundation","learning":{"definition":{"en":"Serialization turns structured values into a representation that another program can store or exchange. Encoding supplies rules for expressing that representation as bytes, so the receiver can reconstruct it rather than guess at its meaning.","es":"La serialización transforma valores estructurados en una representación que otro programa puede guardar o intercambiar. La codificación establece cómo expresar esa representación mediante bytes, para que el receptor pueda reconstruirla sin tener que adivinar su significado."},"simple":{"en":"A producer, the program sending data, might serialize an order as JSON, a text format with named fields, lists and values. UTF-8 represents that text as bytes. The consumer reverses those operations and checks the schema, the agreed field names, types and meanings. Decoding recovers the representation, but a number still needs a unit. If the producer means cents and the consumer expects euros, the amount is wrong despite successful parsing.","es":"El productor, el programa que envía datos, puede serializar un pedido en JSON, un formato de texto con campos, listas y valores. UTF-8 representa ese texto mediante bytes. El consumidor invierte esas operaciones y comprueba el esquema, el acuerdo sobre nombres de campos, tipos y significados. Descodificar recupera la representación, pero un número sigue necesitando una unidad. Si el productor expresa céntimos y el consumidor espera euros, el importe será incorrecto aunque el JSON sea válido."},"analogy":{"en":"Serialization resembles filling in a standard delivery form; encoding resembles choosing how its symbols are printed. A readable form can still describe the wrong quantity, so the analogy does not remove the need for validation.","es":"Serializar se parece a rellenar un formulario de entrega; codificar, a elegir cómo se imprimen sus símbolos. Que el formulario se pueda leer no evita cantidades equivocadas: la comparación no elimina la necesidad de validar."},"walkthrough":{"en":["A café orders two boxes of filters for 1,250 euro cents. Its service creates JSON fields for quantity, totalInCents and a customer name containing é, then sends the text as UTF-8 bytes.","The billing service decodes the bytes and parses the JSON. It checks that quantity is an integer and totalInCents is nonnegative, then interprets 1,250 cents as €12.50 rather than €1,250.","Later, the producer adds a deliveryNote field. The receiver was designed to accept unknown fields, so the order still works. Renaming totalInCents or changing its unit would need a coordinated contract change."],"es":["Una cafetería pide dos cajas de filtros por 1.250 céntimos de euro. Su servicio crea campos JSON para quantity, totalInCents y un nombre de cliente con é; después envía el texto como bytes UTF-8.","El servicio de facturación descodifica los bytes y analiza el JSON. Comprueba que quantity sea un entero y totalInCents no sea negativo; interpreta los 1.250 céntimos como 12,50 euros, no como 1.250 euros.","Más adelante, el productor añade el campo deliveryNote. El receptor se diseñó para aceptar campos desconocidos, así que el pedido sigue funcionando. Renombrar totalInCents o cambiar su unidad exigiría coordinar una modificación del contrato de datos."]},"pitfalls":{"en":["Base64 lets binary content travel through text-only fields, but anyone can reverse it. It enlarges the representation and provides no secrecy.","Compression can reduce transferred bytes at the cost of processing time. It cannot repair mismatched fields or units, and small messages may barely benefit."],"es":["Base64 permite incluir contenido binario en campos que solo admiten texto, pero cualquiera puede revertirlo. Aumenta el tamaño de la representación y no aporta confidencialidad.","La compresión puede reducir los bytes enviados a costa de tiempo de procesamiento. No corrige discrepancias entre campos o unidades, y puede aportar poco en mensajes pequeños."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc8259","label":"rfc-editor.org: rfc8259"},{"url":"https://www.rfc-editor.org/rfc/rfc3629","label":"rfc-editor.org: rfc3629"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Base64","label":"developer.mozilla.org: Base64"}]}},{"id":"tls","parent":"osi-6","title":{"en":"TLS, certificates and termination","es":"TLS, certificados y terminación"},"summary":{"en":"Trace TLS between its actual endpoints: a component that terminates it can read the protected messages.","es":"Identifica los extremos reales de TLS: el componente que lo termina puede leer los mensajes protegidos."},"details":{"en":["Encryption covers bytes in transit, not what an endpoint does after decryption. A request body can be protected on the network yet appear in a terminator's debug logs. Apply access controls to load balancers, application processes and log destinations according to the plaintext they can access, and avoid recording credentials or medical results."],"es":["El cifrado cubre los bytes durante el tránsito, no lo que hace un extremo después de descifrarlos. El cuerpo de una petición puede viajar protegido y acabar en registros de depuración. Aplica controles de acceso a los balanceadores, procesos y destinos de registro según los datos en claro a los que acceden, y evita registrar credenciales o resultados médicos."]},"aws":{"en":"For a clinic portal, configure an Application Load Balancer with an HTTPS listener and an HTTPS target group. This encrypts both segments using separate TLS connections. ALB does not validate target certificates, so this configuration does not provide certificate-based verification of backend identity.","es":"Para el portal de una clínica, configura un Application Load Balancer con un listener HTTPS y un grupo de destinos HTTPS. Así cifras ambos tramos mediante conexiones TLS independientes. ALB no valida los certificados de los destinos, por lo que esta configuración no verifica mediante certificados la identidad del servidor de aplicación."},"question":{"en":"The clinic uses HTTPS in the browser, but its load balancer forwards requests over HTTP. Can a capture on that backend network reveal patient data?","es":"La clínica utiliza HTTPS en el navegador, pero su balanceador reenvía las peticiones por HTTP. ¿Una captura de tráfico en esa red interna podría revelar datos de pacientes?"},"answer":{"en":"It can reveal the forwarded HTTP headers and bodies, including patient data if the application sends it there. The browser's HTTPS protects only the connection to the load balancer, which decrypts the request before forwarding it. Use TLS on the backend connection as well, and check how that connection authenticates its peer. This protects the previously unencrypted network segment; access controls and safe logging are still needed because the endpoints handle plaintext.","es":"Sí, podría revelar las cabeceras y los cuerpos HTTP reenviados, incluidos los datos de pacientes que circulen por ahí. El HTTPS del navegador solo protege la conexión hasta el balanceador, que descifra la petición antes de reenviarla. Utiliza TLS también en la conexión al servidor de aplicación y comprueba cómo autentica a su interlocutor. Así proteges el tramo que antes iba sin cifrar; siguen haciendo falta controles de acceso y registros seguros porque los extremos manejan datos en claro."},"related":["tcp","http","encryption","load-balancing"],"sources":[{"label":"TLS 1.3: RFC 8446","url":"https://www.rfc-editor.org/rfc/rfc8446"},{"label":"Application Load Balancer","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html"}],"level":"applied","learning":{"definition":{"en":"TLS protects data exchanged between two endpoints by encrypting it and detecting tampering. In a typical HTTPS connection, it also gives the client a way to check that it is talking to the intended server.","es":"TLS protege los datos intercambiados entre dos extremos mediante cifrado y detección de alteraciones. En una conexión HTTPS habitual, también permite al cliente comprobar que está hablando con el servidor al que quería conectarse."},"simple":{"en":"A browser starts with a TLS handshake, a setup exchange that establishes cryptographic keys. The server presents a certificate linking its name to a public key and proves possession of the corresponding private key. The browser checks the hostname, validity dates and certification path to a trusted authority. Both sides then protect messages with agreed traffic keys. The TLS terminator is the component doing that encryption and decryption, whether an application server or an intermediary.","es":"El navegador inicia una negociación TLS, un intercambio que establece claves criptográficas. El servidor presenta un certificado que vincula su nombre con una clave pública y demuestra que posee la clave privada correspondiente. El navegador verifica el nombre, las fechas de validez y la cadena de certificación hasta una autoridad de confianza. Después, ambos extremos protegen los mensajes con las claves acordadas. El componente que termina TLS realiza ese cifrado y descifrado; puede ser el servidor de aplicación o un intermediario."},"analogy":{"en":"Imagine a courier carrying sealed envelopes to a checked recipient. TLS similarly protects delivery between endpoints. The envelope analogy ends when it is opened: protection for any onward journey must be arranged separately.","es":"Imagina un mensajero que lleva sobres sellados a un destinatario identificado. TLS protege de forma parecida la entrega entre extremos. La comparación termina al abrir el sobre: cualquier trayecto posterior necesita su propia protección."},"walkthrough":{"en":["Lucía opens her clinic's results portal. Her browser connects to a load balancer, checks the portal certificate and completes a TLS handshake. Requests now travel encrypted between her browser and that load balancer.","The load balancer decrypts her request to choose an application server. This is the termination point: it can read the message, and the original TLS connection does not reach the application server.","The clinic configures a separate, certificate-validated TLS connection from the load balancer to the application server. That protects the second segment. The application still checks Lucía's login and access rights before returning her results."],"es":["Lucía abre el portal de resultados de su clínica. Su navegador se conecta a un balanceador de carga, comprueba el certificado y completa la negociación TLS. Las peticiones viajan cifradas entre el navegador y ese balanceador.","El balanceador descifra la petición para elegir un servidor de aplicación. Ahí termina TLS: puede leer el mensaje y la conexión TLS original no llega al servidor de aplicación.","La clínica configura otra conexión TLS entre el balanceador y el servidor de aplicación, con validación del certificado. Así protege el segundo tramo. La aplicación sigue comprobando la sesión de Lucía y sus permisos antes de devolver los resultados."]},"pitfalls":{"en":["A valid certificate identifies the server for the connection; it does not tell the application which patient may read a particular result.","Do not bypass certificate errors to make a connection work. Check the requested hostname, expiry and trust configuration so encryption is tied to the intended peer."],"es":["Un certificado válido identifica al servidor de la conexión; no indica a la aplicación qué paciente tiene permiso para consultar un resultado concreto.","No omitas errores de certificado para conseguir conectarte. Revisa el nombre solicitado, la caducidad y la configuración de confianza para que el cifrado esté vinculado al interlocutor previsto."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc8446","label":"rfc-editor.org: rfc8446"},{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html","label":"docs.aws.amazon.com: introduction"}]}},{"id":"dns","parent":"osi-7","title":{"en":"DNS resolution and caching","es":"Resolución DNS y caché"},"summary":{"en":"DNS supplies a destination; cached answers and open connections can delay a move to a new server.","es":"DNS proporciona un destino; las respuestas guardadas y las conexiones abiertas pueden retrasar el paso a otro servidor."},"details":{"en":["DNS records are selected by name and type. Updating an A record changes the IPv4 answer but leaves a separately published AAAA record alone. If AAAA still points to the old service, IPv6 clients can keep reaching it while IPv4 tests appear correct. Inspect both record types during a move when the service supports both address families."],"es":["Los registros DNS se seleccionan por nombre y tipo. Actualizar un registro A cambia la respuesta IPv4, pero no modifica un registro AAAA publicado por separado. Si AAAA conserva la dirección antigua, los clientes IPv6 pueden seguir llegando a ella aunque las pruebas IPv4 salgan bien. Revisa ambos tipos de registro al migrar un servicio que admita las dos familias de direcciones."]},"aws":{"en":"When moving a service between two fixed public IPv4 addresses, update its Route 53 A record after lowering the TTL in advance and allowing the previous TTL to elapse. Keep the old endpoint available while expected caches expire and existing connections drain.","es":"Al trasladar un servicio entre dos direcciones IPv4 públicas fijas, actualiza su registro A en Route 53 tras reducir el TTL con antelación y dejar transcurrir el TTL anterior. Mantén disponible el destino antiguo mientras caducan las cachés previstas y terminan las conexiones existentes."},"question":{"en":"We moved the shop's A record two minutes ago. One office reaches the new server and another reaches the old one. Is the DNS update broken?","es":"Cambiamos el registro A de la tienda hace dos minutos. Una oficina llega al servidor nuevo y otra al antiguo. ¿Ha fallado la actualización DNS?"},"answer":{"en":"Not necessarily. Each office may use a different resolver and have cached the answer at a different time. An unexpired old answer can still be returned even though the authoritative record has changed. Compare that record with the answers and remaining TTLs seen by each office. Also check application caches and existing connections, which can preserve the old destination independently. If those findings match the planned cache window, the split is expected; keep the old server available during the transition.","es":"No necesariamente. Cada oficina puede usar un resolutor distinto y haber guardado la respuesta en otro momento. Una respuesta antigua aún vigente puede devolverse aunque el registro autoritativo haya cambiado. Compara ese registro con las respuestas y los TTL restantes que ve cada oficina. Revisa también las cachés de las aplicaciones y las conexiones existentes, que pueden conservar el destino antiguo por separado. Si los resultados encajan con el plazo de caché previsto, la diferencia es esperable; mantén disponible el servidor antiguo durante la transición."},"related":["ip","ipv6","hybrid","troubleshooting"],"sources":[{"label":"Amazon Route 53","url":"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/Welcome.html"},{"url":"https://www.rfc-editor.org/rfc/rfc1034","label":"rfc-editor.org: rfc1034"},{"url":"https://www.rfc-editor.org/rfc/rfc1035","label":"rfc-editor.org: rfc1035"},{"url":"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/welcome-dns-service.html","label":"docs.aws.amazon.com: welcome dns service"}],"level":"foundation","learning":{"definition":{"en":"DNS is a distributed naming system that publishes records about domain names, including the addresses used to reach services. It lets a client discover a destination without building a fixed network address into the application.","es":"DNS es un sistema distribuido de nombres que publica registros sobre dominios, incluidas las direcciones para acceder a servicios. Permite al cliente descubrir un destino sin dejar una dirección de red fija incorporada en la aplicación."},"simple":{"en":"A client asks a recursive resolver, a service that looks up DNS records for it. The resolver reuses a cached answer, a saved result, or follows referrals to an authoritative server responsible for the domain's records. An A record gives an IPv4 address; AAAA gives IPv6, while CNAME points to another name. The time to live, or TTL, limits normal cache reuse. The client connects to the returned address itself; the resolver does not carry the application traffic.","es":"El cliente consulta a un resolutor recursivo, un servicio que busca registros DNS. Este reutiliza una respuesta guardada en caché o sigue indicaciones hasta el servidor autoritativo, responsable de los registros del dominio. Un registro A proporciona una dirección IPv4; AAAA, una IPv6; CNAME apunta a otro nombre. El tiempo de vida, o TTL, limita la reutilización normal de la respuesta guardada. Después, el cliente se conecta a la dirección obtenida; el tráfico de la aplicación no pasa por el resolutor."},"analogy":{"en":"DNS resembles an address directory whose entries can be copied into a notebook for a limited time. Updating the directory leaves existing notes untouched, and the directory never transports the visitor to the destination.","es":"DNS se parece a un directorio de direcciones que puedes copiar en una libreta durante un tiempo limitado. Actualizar el directorio no modifica esas notas; además, el directorio no lleva al visitante hasta su destino."},"walkthrough":{"en":["At 10:00, Marta's laptop asks its resolver for a shop's image service. The resolver retrieves an A record for the old server with a 300-second TTL and caches it. Her laptop connects to that address.","At 10:02, the shop changes the authoritative A record. Marta's resolver still has a usable cached answer, so another lookup can return the old address. A resolver without that cached answer may retrieve the new one.","After the answer expires at 10:05, Marta makes a fresh lookup. Here, no other cache holds the old address, so the resolver fetches the new record. Her existing connection to the old server remains separate from this lookup."],"es":["A las 10:00, el portátil de Marta consulta al resolutor por el servicio de imágenes de una tienda. El resolutor obtiene un registro A del servidor antiguo con un TTL de 300 segundos y lo guarda. El portátil se conecta a esa dirección.","A las 10:02, la tienda cambia el registro A autoritativo. El resolutor de Marta aún tiene una respuesta utilizable en caché y puede devolver la dirección antigua. Otro resolutor sin esa respuesta guardada puede obtener la nueva.","Tras caducar la respuesta a las 10:05, Marta hace otra consulta. Aquí, ninguna otra caché conserva la dirección antigua, así que el resolutor obtiene el registro nuevo. Su conexión existente con el servidor antiguo es independiente de esta consulta."]},"pitfalls":{"en":["Reducing TTL when you change an address does not shorten answers already cached under the previous TTL. Plan the lower value be
