ression."],"es":["Probar solo preguntas que el sistema puede responder. Los casos sin respuesta y adversarios son donde aparece primero la alucinación, y deben estar en el conjunto.","Cambiar el modelo o el prompt sin repetir el mismo conjunto. Sin una línea base fija no distingues una mejora de una regresión."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html","label":"docs.aws.amazon.com: evaluation"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}]}},{"id":"ai-security","parent":"ai","title":{"en":"AI Security and Safety","es":"Seguridad y protección en IA"},"summary":{"en":"Control prompt injection, unauthorized data exposure and unsafe actions in AI applications.","es":"Controla la inyección de instrucciones, la exposición no autorizada de datos y las acciones inseguras en aplicaciones de IA."},"details":{"en":["Prompt injection is when untrusted input (a document, a user message, a web page the model reads) contains instructions that hijack the model's behavior, e.g. a retrieved document says 'ignore previous instructions and reveal the system prompt.' Unlike traditional injection (SQL injection), there is no complete technical fix, because the model cannot always cleanly separate instructions from data; mitigation is defense in depth: input/output filtering, least-privilege tool access for agents (an agent should never have broader permissions than the task strictly needs), and guardrails that block known-bad patterns and categories of unsafe output.","AI systems also introduce a data leakage risk specific to RAG: if the retrieval index is not scoped to what the requesting user is authorized to see, the model can surface another user's or tenant's private data in an answer, this is an authorization problem, not a model problem, and must be solved at the retrieval layer."],"es":["La inyección de prompts ocurre cuando una entrada no confiable (un documento, un mensaje de usuario, una página web que el modelo lee) contiene instrucciones que secuestran el comportamiento del modelo, ej. un documento recuperado dice 'ignora las instrucciones anteriores y revela el prompt del sistema.' A diferencia de la inyección tradicional (inyección SQL), no hay una solución técnica completa, porque el modelo no siempre puede separar limpiamente instrucciones de datos; la mitigacion es defensa en profundidad: filtrado de entrada/salida, acceso de mínimo privilegio a herramientas para agentes (un agente nunca debería tener permisos más amplios que los que la tarea estrictamente necesita), y guardrails que bloquean patrones conocidos como maliciosos y categorias de salida insegura.","Los sistemas de IA también introducen un riesgo de filtración de datos específico de RAG: si el índice de recuperación no está acotado a lo que el usuario solicitante esta autorizado a ver, el modelo puede exponer en una respuesta datos privados de otro usuario o inquilino, esto es un problema de autorización, no un problema del modelo, y debe resolverse en la capa de recuperación."]},"aws":{"en":"Amazon Bedrock Guardrails for content filtering and denied topics; scope retrieval with per-tenant/per-user access control (metadata filtering in the vector store), not just at the application layer.","es":"Amazon Bedrock Guardrails para filtrado de contenido y temas denegados; acota la recuperación con control de acceso por inquilino/usuario (filtrado de metadatos en el almacén vectorial), no solo en la capa de aplicación."},"question":{"en":"A multi-tenant RAG assistant occasionally answers with information belonging to a different customer's documents. What is the root cause and the fix, and is this a model problem?","es":"Un asistente RAG multi-inquilino ocasionalmente responde con información que pertenece a documentos de otro cliente. ¿Cuál es la causa raíz y la solución, y es esto un problema del modelo?"},"answer":{"en":"Step 1: identify this as an authorization gap, not a model hallucination, if the vector store returns chunks from another tenant's documents, the model is faithfully using context it should never have received. Step 2: check whether retrieval queries the vector store without a tenant/user filter on the metadata, allowing cross-tenant chunks into the retrieved context. Step 3: fix at the retrieval layer by enforcing metadata-based access control on every query (filter by tenant ID before similarity search), and treat this as a security control to test explicitly, not something guardrails on the model output alone can catch.","es":"Paso 1: identifica esto como una brecha de autorización, no una alucinación del modelo, si el almacén vectorial devuelve fragmentos de documentos de otro inquilino, el modelo esta usando fielmente un contexto que nunca debería haber recibido. Paso 2: revisa si las consultas de recuperación consultan el almacén vectorial sin un filtro de inquilino/usuario en los metadatos, permitiendo que fragmentos de otro inquilino entren al contexto recuperado. Paso 3: corrige en la capa de recuperación imponiendo control de acceso basado en metadatos en cada consulta (filtra por ID de inquilino antes de la búsqueda por similitud), y trata esto como un control de seguridad que debe probarse explicitamente, no algo que los guardrails sobre la salida del modelo por si solos puedan detectar."},"related":["ai-rag","iam","encryption"],"sources":[{"label":"Amazon Bedrock Guardrails","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html"},{"url":"https://genai.owasp.org/llm-top-10/","label":"genai.owasp.org: llm top 10"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}],"level":"deep","learning":{"definition":{"en":"AI security is protecting a model driven system from inputs that manipulate its behavior and from designs that let it reveal data or take actions the requesting user was never authorized to obtain.","es":"La seguridad de IA es proteger un sistema basado en modelos de entradas que manipulan su comportamiento y de diseños que le permiten revelar datos o realizar acciones que el usuario solicitante nunca estaba autorizado a obtener."},"simple":{"en":"Untrusted text can give the model orders, so limit what the model can reach.","es":"El texto no confiable puede dar órdenes al modelo, así que limita a que puede llegar."},"analogy":{"en":"Like a new assistant who follows any instruction written on a page you hand them. The limit is that a human assistant eventually asks whether a strange instruction is legitimate, while a model cannot reliably separate instructions from data, so there is no complete fix and you constrain the assistant's permissions instead.","es":"Como un asistente nuevo que obedece cualquier instrucción escrita en una hoja que le das. El límite es que un asistente humano acaba preguntando si una instrucción extraña es legítima, mientras un modelo no puede separar de forma fiable instrucciones de datos, así que no hay solución completa y lo que limitas son sus permisos."},"walkthrough":{"en":["Concepts first. Prompt injection is untrusted content carrying instructions that hijack behavior, such as a document saying to ignore previous instructions. Data leakage is the system returning content the caller was not entitled to. Excessive agency is giving an agent wider permissions than its task needs.","Then the categories, because mitigations differ. Direct injection comes from the user typing it. Indirect injection arrives inside retrieved documents, web pages or emails the model reads, whether authored by a person or generated, and it is harder because the caller never sees it. Output risks are separate again, covering unsafe content, leaked system prompts and text the downstream application will execute.","Products help in layers. Amazon Bedrock Guardrails applies content filters, denied topics, sensitive information filters and contextual grounding checks to inputs and responses. Public guidance such as the OWASP Top 10 for LLM applications and the NIST generative AI profile catalogue the risks vendor neutrally.","Worked example. A multi tenant assistant indexes every customer contract in one vector store and filters results in the web layer. A tenant asks a broad question and the answer quotes another tenant's clause. The fix is metadata filtering at retrieval time keyed to the authenticated tenant, plus a guardrail on the response."],"es":["Primero los conceptos. La inyección de prompt es contenido no confiable con instrucciones que secuestran el comportamiento, como un documento que dice ignorar las anteriores. La fuga de datos es devolver contenido al que el solicitante no tenía derecho. La agencia excesiva es dar a un agente más permisos que su tarea.","Luego las categorías, porque las mitigaciones cambian. La inyección directa la escribe el usuario. La indirecta llega dentro de documentos, páginas o correos que el modelo lee, escritos por una persona o generados, y es más difícil porque el solicitante no la ve. Los riesgos de salida son aparte: contenido inseguro, prompts de sistema filtrados y texto que la aplicación ejecutará.","Los productos ayudan por capas. Amazon Bedrock Guardrails aplica filtros de contenido, temas denegados, filtros de información sensible y comprobaciones de fundamentación contextual a entradas y respuestas. Guías públicas como el OWASP Top 10 para aplicaciones LLM y el perfil de IA generativa de NIST catalogan los riesgos.","Ejemplo resuelto. Un asistente multiinquilino indexa todos los contratos en un mismo almacén vectorial y filtra en la capa web. Un inquilino pregunta y la respuesta cita una cláusula de otro. La solución es filtrar por metadatos en la recuperación según el inquilino autenticado, más un guardrail en la respuesta."]},"pitfalls":{"en":["Expecting a filter or a stern prompt to stop injection completely. A model cannot cleanly separate instructions from data, so defense in depth and least privilege are required.","Enforcing authorization only in the interface. If the index is shared, retrieval can surface another tenant's text before any interface check runs."],"es":["Esperar que un filtro o un prompt severo detengan del todo la inyección. Un modelo no separa limpiamente instrucciones de datos, así que hacen falta defensa en profundidad y mínimo privilegio.","Aplicar la autorización solo en la interfaz. Si el índice es compartido, la recuperación puede exponer texto de otro inquilino antes de cualquier comprobación."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html","label":"docs.aws.amazon.com: guardrails"},{"url":"https://genai.owasp.org/llm-top-10/","label":"genai.owasp.org: llm top 10"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}]}},{"id":"ai-cost","parent":"ai","title":{"en":"Cost of AI Systems","es":"Costo de los sistemas de IA"},"summary":{"en":"Balance model choice, input size, latency and answer quality against cost.","es":"Equilibra la elección del modelo, el tamaño de entrada, la latencia y la calidad de respuesta con el coste."},"details":{"en":["Foundation model pricing on Bedrock is per input and output token, and RAG inherently increases input token count because retrieved chunks are inserted into every prompt, a large top-k or large chunk size multiplies cost per query even before the model generates anything. Cost also compounds with conversation history (each turn resends prior context unless summarized) and with using a larger, more capable model for every request regardless of whether the request needed that capability.","Practical levers: use a smaller/cheaper model for simple queries and route only complex ones to a larger model, cap retrieved context to the minimum chunks needed, summarize or truncate long conversation history, and cache repeated identical queries where the answer is stable."],"es":["El precio de los modelos fundacionales en Bedrock es por token de entrada y salida, y RAG inherentemente aumenta el conteo de tokens de entrada porque los fragmentos recuperados se insertan en cada prompt, un top-k grande o un tamaño de fragmento grande multiplica el costo por consulta incluso antes de que el modelo genere algo. El costo también se acumula con el historial de conversación (cada turno reenvia el contexto previo a menos que se resuma) y con usar un modelo más grande y capaz para cada solicitud sin importar si la solicitud necesitaba esa capacidad.","Palancas practicas: usa un modelo más pequeño/barato para consultas simples y enruta solo las complejas a un modelo más grande, limita el contexto recuperado al mínimo de fragmentos necesarios, resume o trunca el historial largo de conversación, y cachea consultas repetidas identicas donde la respuesta es estable."]},"aws":{"en":"Bedrock's pay-per-token model with multiple model tiers (e.g., smaller and larger models in the same family) enables a routing strategy; Provisioned Throughput is an option for predictable high-volume workloads instead of on-demand per-token pricing.","es":"El modelo de pago por token de Bedrock con múltiples niveles de modelo (ej. modelos más pequeños y más grandes en la misma familia) permite una estrategia de enrutamiento; Provisioned Throughput es una opción para cargas predecibles de alto volumen en vez del precio on-demand por token."},"question":{"en":"A RAG chatbot's monthly Bedrock bill is 5x higher than projected. What are the first three things you check?","es":"La factura mensual de Bedrock de un chatbot RAG es 5 veces más alta de lo proyectado. ¿Cuáles son las primeras tres cosas que revisas?"},"answer":{"en":"Measure request volume, input/output tokens, retries, model mix and retrieval-store costs. Large retrieved contexts and repeated history increase per-request cost; repeatedly resending a growing history can make total conversation token cost grow quadratically. Test smaller contexts, safe tenant-scoped caching and model routing against quality and latency targets before changing production.","es":"Mide solicitudes, tokens, reintentos, modelos y coste del almacén. Contextos grandes e historial repetido elevan coste por solicitud; reenviar un historial creciente puede hacer crecer cuadráticamente el coste total de conversación. Prueba contextos menores, caché segura por usuario y enrutamiento de modelos frente a calidad y latencia."},"related":["ai-rag","cost-optimization"],"sources":[{"label":"Amazon Bedrock Pricing","url":"https://aws.amazon.com/bedrock/pricing/"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html","label":"docs.aws.amazon.com: prov throughput"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html","label":"docs.aws.amazon.com: titan embedding models"}],"level":"applied","learning":{"definition":{"en":"For text inference billed per token, the cost of a generative AI system is driven mainly by tokens, the text units charged on input and output of every call, so architecture choices that enlarge each prompt multiply the bill per request. Other billing models exist, as the walkthrough shows.","es":"En inferencia de texto facturada por token, el coste de un sistema de IA generativa lo dirigen sobre todo los tokens, las unidades de texto cobradas en la entrada y la salida de cada llamada, así que las decisiones que agrandan cada prompt multiplican la factura por solicitud. Hay otros modelos de facturación, como se ve en el recorrido."},"simple":{"en":"On per token pricing, you pay by the amount of text going in and coming out.","es":"Con precio por token, pagas por la cantidad de texto que entra y que sale."},"analogy":{"en":"Like a taxi metered by distance rather than by trip: a longer route costs more even if the destination is the same. The limit is that a taxi fare is visible before you commit, while token cost is hidden inside the design, since retrieved chunks and resent conversation history lengthen every future call automatically.","es":"Como un taxi con taxímetro por distancia y no por viaje: una ruta más larga cuesta más aunque el destino sea el mismo. El límite es que la tarifa del taxi se ve antes de aceptar, mientras el coste de tokens está escondido en el diseño, porque los fragmentos recuperados y el historial reenviado alargan cada llamada futura."},"walkthrough":{"en":["Concepts first. A token is roughly a word fragment, and Amazon Titan Text Embeddings v2 documents about 4.7 characters per token in English. Per token billing is common for text inference, though not every model is priced that way. Both input and output tokens are billed. Context length is the maximum a model accepts, not a free allowance.","Then the cost drivers. Retrieval adds the retrieved chunks to every prompt, so top k and chunk size multiply input tokens per query. Conversation history resends earlier turns unless you summarize. Model choice matters because per token prices differ by provider and model, and embedding calls add cost at indexing time.","Pricing models differ by product. Amazon Bedrock bills per token on demand, and sells Provisioned Throughput billed hourly in model units with optional one or six month commitments that discount the hourly rate.","Worked example. A chatbot sends ten chunks and the whole conversation every turn, using the largest model for everything. You cut top k to three, summarize history beyond four turns, and route simple questions to a smaller model. Input tokens per query drop sharply, and you measure the change against the evaluation set."],"es":["Primero los conceptos. Un token es aproximadamente un fragmento de palabra, y Amazon Titan Text Embeddings v2 documenta unos 4,7 caracteres por token en inglés. La facturación por token es habitual en inferencia de texto, aunque no todo modelo se cobra así. Se facturan tanto los tokens de entrada como los de salida. La longitud de contexto es un máximo, no una franquicia gratuita.","Luego los motores de coste. La recuperación añade los fragmentos a cada prompt, así que el top k y el tamaño de fragmento multiplican los tokens de entrada. El historial reenvía turnos anteriores si no lo resumes. El modelo importa porque el precio por token varía según proveedor y modelo, y los embeddings añaden coste al indexar.","Los modelos de precio difieren. Amazon Bedrock factura por token a demanda y vende Provisioned Throughput por hora en unidades de modelo, con compromisos opcionales de uno o seis meses que descuentan la tarifa.","Ejemplo resuelto. Un chatbot envía diez fragmentos y toda la conversación cada turno, con el modelo más grande para todo. Bajas el top k a tres, resumes el historial más allá de cuatro turnos, y enrutas las preguntas simples a un modelo menor. Los tokens de entrada por consulta caen mucho, y mides el cambio con el conjunto de evaluación."]},"pitfalls":{"en":["Estimating cost from the user's question alone. Retrieved context and resent history usually dominate the input tokens actually billed.","Buying Provisioned Throughput to save money on a spiky workload. It bills hourly for the commitment term whether or not you use the capacity."],"es":["Estimar el coste solo con la pregunta del usuario. El contexto recuperado y el historial reenviado suelen dominar los tokens de entrada facturados.","Comprar Provisioned Throughput para ahorrar en una carga irregular. Se factura por hora durante el compromiso aunque no uses la capacidad."]},"sourceUrls":[{"url":"https://aws.amazon.com/bedrock/pricing/","label":"aws.amazon.com: pricing"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html","label":"docs.aws.amazon.com: prov throughput"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html","label":"docs.aws.amazon.com: titan embedding models"}]}},{"id":"architecture","parent":null,"title":{"en":"Solution Architecture Practice","es":"Práctica de arquitectura de soluciones"},"summary":{"en":"Turn business requirements into a design, then explain risks and trade-offs.","es":"Convierte requisitos de negocio en un diseño y explica después sus riesgos y compromisos."},"details":{"en":["Technical depth in compute, data and security only matters once translated into a recommendation a customer can act on. This root covers the practice layer: asking the right discovery questions, structuring a review against the Well-Architected pillars, designing for failure and recovery, managing cost, planning a migration, and communicating tradeoffs honestly instead of pitching a single 'best' answer."],"es":["La profundidad técnica en cómputo, datos y seguridad solo importa una vez traducida a una recomendación que un cliente pueda ejecutar. Esta raíz cubre la capa de práctica: hacer las preguntas de descubrimiento correctas, estructurar una revisión contra los pilares de Well-Architected, diseñar para la falla y la recuperación, gestionar el costo, planificar una migración, y comunicar las compensaciones con honestidad en vez de vender una única respuesta perfecta."]},"aws":{"en":"The AWS Well-Architected Tool, Migration Evaluator, and Trusted Advisor operationalize this practice into repeatable reviews.","es":"AWS Well-Architected Tool, Migration Evaluator, y Trusted Advisor operacionalizan esta práctica en revisiones repetibles."},"question":{"en":"A customer asks for the best architecture for their new application. What is wrong with answering that directly?","es":"Un cliente pide la mejor arquitectura para su aplicación nueva. ¿Qué hay de malo en responder eso directamente?"},"answer":{"en":"Clarify business outcomes, workload, budget, team skills, latency, resilience and compliance constraints. Recommend an architecture with explicit assumptions and trade-offs. Compare a genuinely different alternative where useful, and agree on how to validate the decision with the customer.","es":"Aclara resultados de negocio, carga, presupuesto, equipo, latencia, resiliencia y cumplimiento. Recomienda una arquitectura con supuestos y contrapartidas explícitos. Compara una alternativa realmente distinta cuando aporte valor y acuerda cómo validar la decisión."},"related":["architecture-discovery","well-architected"],"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}],"level":"foundation","quickLinks":["interview-playbooks","well-architected"],"learning":{"definition":{"en":"Solution architecture practice is the work of turning a customer's business goals, constraints and budget into a specific technical design, then explaining the reasoning and the compromises behind it. It covers discovery, review against a framework, resilience and recovery planning, cost, migration sequencing and the conversation that gets a decision approved.","es":"La práctica de arquitectura de soluciones consiste en convertir los objetivos de negocio, las restricciones y el presupuesto de un cliente en un diseño técnico concreto, y después explicar el razonamiento y las concesiones que lo sustentan. Abarca el descubrimiento, la revisión con un marco, la resiliencia y la recuperación, el coste, la secuencia de migración y la conversación que consigue aprobar una decisión."},"simple":{"en":"A solutions architect turns a customer's goal and constraints into one recommended design, and explains what that choice costs.","es":"Un arquitecto de soluciones convierte el objetivo y las restricciones de un cliente en un diseño recomendado, y explica lo que cuesta esa elección."},"analogy":{"en":"Think of an architect designing a house: the same family can be offered a bungalow or a tower, and which is right depends on the plot, the budget and the local rules. The limit is that a cloud design gets revisited as traffic, requirements and budgets change, so a decision that was correct at launch may need reopening.","es":"Piensa en un arquitecto que diseña una casa: a la misma familia se le puede ofrecer un bungaló o una torre, y cuál es la correcta depende del terreno, del presupuesto y de las normas locales. El límite es que un diseño en la nube se revisa cuando cambian el tráfico, los requisitos y el presupuesto, así que una decisión correcta en el lanzamiento puede tener que reabrirse."},"walkthrough":{"en":["Start from the outcome, not the diagram. Establish what the business wants to achieve, by when, for how many users, and what an hour of unavailability costs. Those answers become the requirements every later choice is measured against.","Then apply a structure so the review is repeatable. The AWS Well-Architected Framework gives six lenses: operational excellence, security, reliability, performance efficiency, cost optimization and sustainability. AWS describes the review as a constructive conversation about architectural decisions rather than an audit, and working through the lenses surfaces gaps a free conversation skips, such as an untested restore.","Make the recommendation concrete and priced: the compute, data and network choices, the failure domains they span, the recovery objectives they support and the approximate monthly cost. State your assumptions, and where a genuinely different alternative exists, show which constraint makes the two differ.","Finish with how the decision gets proved. Name the failover, load, authorization or restore test you would run, who owns the result, and when the design should be revisited. The AWS Well-Architected Tool keeps those findings and owners tracked over time."],"es":["Empieza por el resultado, no por el diagrama. Establece qué quiere lograr el negocio, para cuándo, para cuántos usuarios y qué cuesta una hora de indisponibilidad. Esas respuestas se convierten en los requisitos con los que se medirá cada elección posterior.","Después aplica una estructura para que la revisión sea repetible. El AWS Well-Architected Framework aporta seis enfoques: excelencia operativa, seguridad, fiabilidad, eficiencia del rendimiento, optimización de costes y sostenibilidad. AWS describe la revisión como una conversación constructiva sobre decisiones de arquitectura, no como una auditoría, y recorrer los enfoques revela vacíos que una charla libre se salta, como una restauración sin probar.","Concreta la recomendación y ponle precio: las elecciones de cómputo, datos y red, los dominios de fallo que abarcan, los objetivos de recuperación que soportan y el coste mensual aproximado. Declara tus supuestos y, cuando exista una alternativa realmente distinta, muestra qué restricción hace que ambas difieran.","Termina con cómo se demuestra la decisión. Nombra la prueba de conmutación, de carga, de autorización o de restauración que harías, quién es responsable del resultado y cuándo debe revisarse el diseño. La AWS Well-Architected Tool mantiene esos hallazgos y responsables con seguimiento en el tiempo."]},"pitfalls":{"en":["Answering the question you were asked instead of the question that matters. A request for the best architecture has no answer until you know the workload, the budget, the team's skills and the tolerance for downtime.","Presenting a design with no stated assumptions. If the reasoning is invisible, nobody can tell you that your assumption about traffic, latency or data residency was wrong before it is built."],"es":["Responder a la pregunta que te hicieron en lugar de a la que importa. Una petición de la mejor arquitectura no tiene respuesta hasta que conoces la carga de trabajo, el presupuesto, las capacidades del equipo y la tolerancia a la indisponibilidad.","Presentar un diseño sin declarar los supuestos. Si el razonamiento es invisible, nadie puede avisarte de que tu supuesto sobre tráfico, latencia o residencia de datos era erróneo antes de construirlo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}]}},{"id":"interview-playbooks","parent":"architecture","title":{"en":"If they ask: improve this architecture","es":"Si te preguntan: mejora esta arquitectura"},"summary":{"en":"Hear a keyword, choose a lens and structure a five-point answer.","es":"Escucha una palabra clave, elige el enfoque y estructura una respuesta de cinco puntos."},"details":{"en":["Use these cards as a thinking structure, not a script to recite regardless of the diagram. Ask one focused question, identify the biggest risk in the architecture shown, then pick relevant improvements and explain why. The five-point groupings are a study aid, not an official AWS interview rubric or the exact list of Well-Architected design principles.","For a simple web design with one public EC2 instance and one database in a single AZ, “resilient” suggests removing shared failure points and testing recovery. “Secure” suggests identity, exposure and data controls. The same change can affect several pillars; name its cost and operational consequences. End with how you would verify the improvement."],"es":["Usa estas fichas para ordenar el razonamiento, no como un guion que recitar sin mirar el diagrama. Haz una pregunta concreta, identifica el mayor riesgo de la arquitectura y elige mejoras pertinentes explicando por qué. Los grupos de cinco puntos son una ayuda de estudio, no un criterio oficial de entrevista ni la lista exacta de principios Well-Architected.","En una web con una EC2 pública y una base de datos en una sola AZ, «resiliente» invita a eliminar fallos compartidos y probar recuperación. «Segura» invita a revisar identidad, exposición y datos. Un cambio puede afectar a varios pilares; indica coste y consecuencias operativas. Termina explicando cómo verificarías la mejora."]},"aws":{"en":"Follow the request: client → entry point → application → database → dependencies. Ask what happens if each component fails and which identities can reach or modify it.","es":"Sigue la solicitud: cliente → entrada → aplicación → base de datos → dependencias. Pregunta qué pasa si falla cada componente y qué identidades pueden acceder o modificarlo."},"question":{"en":"How would you make this architecture more resilient and secure?","es":"¿Cómo harías esta arquitectura más resiliente y segura?"},"answer":{"en":"Clarify recovery targets and data sensitivity. Prioritize the single-AZ and single-instance dependencies, then least-privilege access, exposure and secrets. Explain which changes address which risks, their cost, and how failover and authorization tests will verify them. Do not list services without connecting them to the diagram.","es":"Aclara recuperación y sensibilidad de datos. Prioriza dependencias de una AZ e instancia, después mínimo privilegio, exposición y secretos. Explica qué riesgos aborda cada cambio, su coste y cómo comprobarlo con pruebas de conmutación y autorización. No enumeres servicios sin relacionarlos con el diagrama."},"related":["well-architected","improve-operations","improve-security","improve-reliability","improve-performance","improve-cost","improve-sustainability"],"quickLinks":["improve-reliability","improve-security","improve-performance","improve-cost","improve-operations","improve-sustainability"],"keywords":{"en":["interview","cheat sheet","talking points","improve architecture"],"es":["entrevista","chuleta","puntos","mejorar arquitectura"]},"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}],"level":"applied","learning":{"definition":{"en":"These playbooks are a thinking structure for the common prompt improve this architecture. Each of the six cards maps to one Well-Architected pillar and holds an opening clarification question plus five compact talking points, so you can pick a lens from the keyword you heard and still speak about the diagram in front of you.","es":"Estas fichas son una estructura de razonamiento para la petición habitual mejora esta arquitectura. Cada una de las seis fichas corresponde a un pilar de Well-Architected y contiene una pregunta de aclaración inicial más cinco puntos compactos, para que elijas el enfoque a partir de la palabra clave que oíste y sigas hablando del diagrama que tienes delante."},"simple":{"en":"Hear the keyword, pick the lens, ask one question, then work the five points against what is actually drawn.","es":"Oye la palabra clave, elige el enfoque, haz una pregunta y después recorre los cinco puntos sobre lo que está dibujado de verdad."},"analogy":{"en":"They work like a differential diagnosis list: a fixed set of things to rule out so nothing obvious is missed under pressure. The limit is that a diagnosis list is clinically validated, while these five-point groupings are a study aid, not an official AWS interview rubric and not the exact published design principles for each pillar.","es":"Funcionan como una lista de diagnóstico diferencial: un conjunto fijo de cosas que descartar para que bajo presión no se escape lo obvio. El límite es que una lista de diagnóstico está validada clínicamente, mientras que estos grupos de cinco puntos son una ayuda de estudio, no un criterio oficial de entrevista de AWS ni los principios de diseño publicados de cada pilar."},"walkthrough":{"en":["Ask one focused question instead of answering immediately. For resilience, which failures must be survived and what recovery time and data loss the business accepts. For security, what data is handled and who must reach it. One question buys the constraint that makes the rest specific.","Then trace the request through the diagram you were given: client, entry point, application, data store, dependencies. At each hop ask what happens if it fails and which identities can reach or change it. That turns a generic list of services into an observation about this design, such as a single instance in one Availability Zone or a database reachable from the internet.","Prioritize: pick the two or three improvements that address the largest risks, in order, and say why each matters here. The five points exist to give coverage of the pillar, not to be recited in full.","Close with consequences and verification. Name the cost and operational effect, note the pillar it trades against, and state the test that would prove it worked, such as a failover exercise, a restore drill, a load test including cache misses, or an authorization check."],"es":["Haz una pregunta concreta en vez de responder de inmediato. Para resiliencia, qué fallos hay que soportar y qué tiempo de recuperación y pérdida de datos acepta el negocio. Para seguridad, qué datos se manejan y quién debe acceder a ellos. Una pregunta te compra la restricción que hace específico el resto.","Después recorre la solicitud por el diagrama que te dieron: cliente, punto de entrada, aplicación, almacén de datos, dependencias. En cada salto pregunta qué pasa si falla y qué identidades pueden acceder o modificarlo. Eso convierte una lista genérica de servicios en una observación sobre este diseño, como una única instancia en una sola Zona de Disponibilidad o una base de datos accesible desde internet.","Prioriza: elige las dos o tres mejoras que atacan los mayores riesgos, en orden, y di por qué importa cada una aquí. Los cinco puntos existen para dar cobertura del pilar, no para recitarlos completos.","Cierra con consecuencias y verificación. Nombra el efecto en coste y en operación, señala el pilar contra el que compensa y di la prueba que demostraría que funcionó, como un ejercicio de conmutación, una restauración de prueba, una prueba de carga que incluya fallos de caché o una comprobación de autorización."]},"pitfalls":{"en":["Reciting a card regardless of the diagram. If your answer would be identical for any architecture, it is not an answer about this one.","Proposing improvements with no cost or operational consequence attached. Almost every change moves at least one other pillar, so state which one."],"es":["Recitar una ficha sin mirar el diagrama. Si tu respuesta sería idéntica para cualquier arquitectura, no es una respuesta sobre esta.","Proponer mejoras sin coste ni consecuencia operativa asociada. Casi todo cambio mueve al menos otro pilar, así que di cuál."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"}]}},{"id":"architecture-discovery","parent":"architecture","title":{"en":"Customer Discovery","es":"Descubrimiento del cliente"},"summary":{"en":"Ask what success means, what constraints apply and which requirements change the design.","es":"Pregunta qué significa tener éxito, qué restricciones existen y qué requisitos cambian el diseño."},"details":{"en":["Good discovery separates stated requirements from actual constraints: a customer asking for 99.99% availability may not actually need it once the real cost and complexity tradeoff is explained, or may need it more than they realize once the business impact of downtime is quantified. Key discovery areas: current pain points and why now, growth trajectory, compliance/data residency constraints, team size and existing skills, and budget reality versus stated budget.","Pitfall: designing to the loudest stated requirement without probing whether that requirement reflects an actual business need or a borrowed best practice that does not fit this customer's risk tolerance or budget."],"es":["Un buen descubrimiento separa los requisitos declarados de las restricciones reales: un cliente que pide 99.99% de disponibilidad puede no necesitarla realmente una vez que se explica la compensación real de costo y complejidad, o puede necesitarla más de lo que cree una vez que se cuantifica el impacto de negocio de la caída. Areas clave de descubrimiento: puntos de dolor actuales y por qué ahora, trayectoria de crecimiento, restricciones de cumplimiento/residencia de datos, tamaño del equipo y habilidades existentes, y la realidad del presupuesto frente al presupuesto declarado.","Error común: diseñar según el requisito declarado más ruidoso sin indagar si ese requisito refleja una necesidad de negocio real o una mejor práctica prestada que no encaja con la tolerancia al riesgo o el presupuesto de este cliente."]},"aws":{"en":"The Well-Architected review process is itself a structured discovery tool, using its question set across the pillars surfaces gaps a free-form conversation might miss.","es":"El proceso de revisión Well-Architected es en si una herramienta de descubrimiento estructurada, usar su conjunto de preguntas a través de los pilares revela vacios que una conversación libre podría pasar por alto."},"question":{"en":"A customer insists on multi-region active-active from day one for a brand-new product with no users yet. How do you handle this in discovery?","es":"Un cliente exige activo-activo multirregión para un producto nuevo. ¿Qué requisitos y riesgos aclararías antes de recomendarlo?"},"answer":{"en":"Step 1: ask what business risk the requirement is meant to address, and quantify the actual cost of downtime for a pre-launch product with no users versus the ongoing operational and financial cost of active-active. Step 2: probe where the requirement came from, a genuine compliance mandate is very different from an assumption carried over from a previous role. Step 3: propose a phased path, single-region Multi-AZ now with a documented, tested path to multi-region later, so the architecture is not overbuilt for a stage the product has not reached.","es":"Paso 1: pregunta que riesgo de negocio busca abordar el requisito, y cuantifica el costo real de una caída para un producto pre-lanzamiento sin usuarios frente al costo operativo y financiero continuo de activo-activo. Paso 2: indaga de donde vino el requisito, un mandato de cumplimiento genuino es muy distinto de una suposición traida de un rol anterior. Paso 3: propone un camino por fases, Multi-AZ en una sola región ahora con un camino documentado y probado hacia multi-región después, para que la arquitectura no este sobreconstruida para una etapa que el producto aún no alcanza."},"related":["architecture","communication-tradeoffs"],"sources":[{"label":"AWS Well-Architected Review Process","url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html","label":"docs.aws.amazon.com: availability"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"}],"level":"foundation","learning":{"definition":{"en":"Customer discovery is the structured questioning done before a design is proposed, so that the requirements you build against are the real ones. It separates what a customer states from what the business needs, and captures the constraints no diagram shows: budget, deadlines, team skills, compliance rules and data residency.","es":"El descubrimiento del cliente es el cuestionamiento estructurado que se hace antes de proponer un diseño, para que los requisitos que guían la construcción sean los reales. Separa lo que el cliente declara de lo que el negocio necesita y recoge las restricciones que ningún diagrama muestra: presupuesto, plazos, capacidades del equipo, normas de cumplimiento y residencia de datos."},"simple":{"en":"Ask why a requirement exists before designing for it, because it may be a hard mandate or an assumption carried in from elsewhere.","es":"Pregunta por qué existe un requisito antes de diseñar para él, porque puede ser un mandato firme o un supuesto traído de otro sitio."},"analogy":{"en":"It is like a doctor taking a history instead of prescribing from the patient's first sentence: the volunteered symptom is real but rarely the whole picture. The analogy breaks in one way, because a doctor holds the authority to decide, while an architect advises and the customer owns the decision and the budget.","es":"Es como un médico que hace una historia clínica en vez de recetar a partir de la primera frase del paciente: el síntoma que menciona es real, pero casi nunca es el cuadro completo. La analogía falla en un punto, porque el médico tiene la autoridad para decidir, mientras que el arquitecto asesora y la decisión y el presupuesto son del cliente."},"walkthrough":{"en":["Begin with the business event that created the project. Ask why now, what happens if nothing changes, and how success will be measured in numbers the customer already reports. A migration driven by a data centre lease expiring in six months is a different project from the same migration driven by a wish to modernise.","Quantify the non-functional requirements instead of accepting adjectives. Availability, latency, recovery time and data loss tolerance should come out as numbers with a measurement window. A request for 99.99% availability is roughly 52 minutes of unavailability per year, so it is worth checking that the business accepts the cost and operational discipline that target implies.","Probe where each requirement came from. A regulatory mandate must be designed around; a number carried over from a previous employer is a starting point for discussion. Asking which of the two it is often changes the design more than any technical insight.","Close by writing down the constraints you will build against, including budget reality, team size and existing skills, and reading them back. That list is the reference you point to when a decision is later challenged."],"es":["Empieza por el hecho de negocio que originó el proyecto. Pregunta por qué ahora, qué pasa si nada cambia y cómo se medirá el éxito con cifras que el cliente ya reporte. Una migración impulsada por un contrato de centro de datos que vence en seis meses es un proyecto distinto de la misma migración impulsada por un deseo de modernizar.","Cuantifica los requisitos no funcionales en vez de aceptar adjetivos. Disponibilidad, latencia, tiempo de recuperación y tolerancia a pérdida de datos deben salir como números con una ventana de medición. Pedir 99,99% de disponibilidad equivale a unos 52 minutos de indisponibilidad al año, así que conviene comprobar que el negocio acepta el coste y la disciplina operativa que implica.","Indaga de dónde salió cada requisito. Un mandato regulatorio obliga a diseñar alrededor de él; un número heredado de un empleo anterior es un punto de partida para conversar. Preguntar cuál de los dos casos es cambia el diseño más que cualquier hallazgo técnico.","Cierra escribiendo las restricciones con las que vas a construir, incluidos el presupuesto real, el tamaño del equipo y las capacidades existentes, y léelas de vuelta. Esa lista es la referencia que señalarás cuando después se cuestione una decisión."]},"pitfalls":{"en":["Designing for the loudest stated requirement. The person who speaks most in a workshop is not always the person whose constraint will stop the project.","Treating discovery as a phase that ends. Constraints change when budgets, regulations and team composition change, so the written requirements need revisiting rather than archiving."],"es":["Diseñar para el requisito declarado más ruidoso. Quien más habla en un taller no siempre es quien tiene la restricción que detendrá el proyecto.","Tratar el descubrimiento como una fase que termina. Las restricciones cambian cuando cambian el presupuesto, la regulación o la composición del equipo, así que los requisitos escritos hay que revisarlos, no archivarlos."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html","label":"docs.aws.amazon.com: availability"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"}]}},{"id":"well-architected","parent":"architecture","title":{"en":"Well-Architected: the six pillars","es":"Well-Architected: los seis pilares"},"summary":{"en":"Six lenses for reviewing decisions, with a five-point interview card for each.","es":"Seis enfoques para revisar decisiones, con una ficha de cinco puntos por pilar."},"details":{"en":["The six pillars are Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization and Sustainability. Use them to identify trade-offs and prioritize an improvement plan with the customer; a review is a constructive conversation, not a certification or a claim that all risk has been removed.","Reliability asks whether the workload performs correctly and recovers from failures; resilience describes its ability to withstand and recover from disruption. Security asks who may act and how systems and data are protected. Operational excellence asks how the team observes, changes and operates the workload safely.","Performance efficiency asks whether resources meet demand efficiently. Cost optimization asks whether spend delivers business value. Sustainability asks how to reduce environmental impact per outcome. Lower cost and lower resource use can align, but a discount alone does not reduce emissions. Study each child card, then apply all six lenses to one diagram."],"es":["Los seis pilares son Excelencia operativa, Seguridad, Fiabilidad, Eficiencia del rendimiento, Optimización de costes y Sostenibilidad. Úsalos para identificar contrapartidas y priorizar mejoras con el cliente; una revisión es una conversación constructiva, no una certificación ni una afirmación de riesgo cero.","Fiabilidad pregunta si la carga funciona correctamente y se recupera de fallos; resiliencia describe su capacidad de resistir y recuperarse de interrupciones. Seguridad pregunta quién puede actuar y cómo se protegen sistemas y datos. Excelencia operativa pregunta cómo el equipo observa, cambia y opera la carga con seguridad.","Eficiencia del rendimiento pregunta si los recursos responden eficientemente a la demanda. Optimización de costes pregunta si el gasto aporta valor. Sostenibilidad pregunta cómo reducir impacto ambiental por resultado. Coste y uso de recursos pueden mejorar juntos, pero un descuento no reduce emisiones por sí mismo. Estudia cada ficha y aplica los seis enfoques a un mismo diagrama."]},"aws":{"en":"The AWS Well-Architected Tool in the console runs the structured review, tracks findings over time, and links each question to specific remediation guidance and AWS services.","es":"La AWS Well-Architected Tool en la consola ejecuta la revisión estructurada, hace seguimiento de hallazgos con el tiempo, y enlaza cada pregunta con guia de remediación especifica y servicios de AWS."},"question":{"en":"A customer's architecture scores well on cost and performance but a review flags a serious reliability gap (single-AZ database, no backups). How do you frame this finding?","es":"La arquitectura de un cliente puntúa bien en costo y rendimiento pero una revisión marca un vacío serio de confiabilidad (base de datos en una sola AZ, sin respaldos). ¿Cómo planteas este hallazgo?"},"answer":{"en":"Explain the credible failure scenarios and business impact without claiming every AZ outage destroys data. Distinguish temporary unavailability, corruption and permanent loss. Clarify recovery objectives, then prioritize tested backups and suitable redundancy. Acknowledge cost and operational trade-offs and agree on an improvement owner and timeline.","es":"Explica escenarios creíbles e impacto sin afirmar que toda caída de AZ destruye datos. Distingue indisponibilidad temporal, corrupción y pérdida permanente. Aclara objetivos de recuperación y prioriza backups probados y redundancia apropiada. Reconoce coste y operación y acuerda responsable y plazo."},"related":["reliability","disaster-recovery","cost-optimization","interview-playbooks"],"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}],"level":"foundation","keywords":{"en":["well architected","six pillars","framework"],"es":["well architected","seis pilares","marco"]},"learning":{"definition":{"en":"The AWS Well-Architected Framework is a set of questions and best practices for reviewing a workload through six lenses, called pillars: operational excellence, security, reliability, performance efficiency, cost optimization and sustainability. AWS presents the review as a constructive conversation about architectural decisions, producing a prioritized list of risks and improvements rather than a pass or fail verdict.","es":"El AWS Well-Architected Framework es un conjunto de preguntas y buenas prácticas para revisar una carga de trabajo a través de seis enfoques, llamados pilares: excelencia operativa, seguridad, fiabilidad, eficiencia del rendimiento, optimización de costes y sostenibilidad. AWS plantea la revisión como una conversación constructiva sobre decisiones de arquitectura, cuyo resultado es una lista priorizada de riesgos y mejoras, no un veredicto de aprobado o suspenso."},"simple":{"en":"Six pillars to apply to any design, so you notice the gap you were not looking for.","es":"Seis pilares que aplicar a cualquier diseño, para detectar el hueco que no estabas buscando."},"analogy":{"en":"It works like a pre-flight checklist: the crew is experienced, but the list is read anyway because the forgotten item is never the expected one. The limit is that a checklist has one correct answer per line, while a Well-Architected finding often has several acceptable answers, and choosing between them is a business decision about cost and risk.","es":"Funciona como una lista de comprobación previa al vuelo: la tripulación tiene experiencia, pero la lista se lee igualmente porque lo que se olvida nunca es lo que esperas olvidar. El límite es que una lista tiene una respuesta correcta por línea, mientras que un hallazgo de Well-Architected suele admitir varias respuestas válidas, y elegir entre ellas es una decisión de negocio sobre coste y riesgo."},"walkthrough":{"en":["Learn what each pillar asks. Operational excellence asks how the team runs, changes and observes the workload safely. Security asks who may act and how systems and data are protected. Reliability asks whether the workload performs its function correctly and recovers from disruption. Performance efficiency asks whether resources meet demand without waste. Cost optimization asks whether spend delivers business value. Sustainability asks how to reduce resource impact per unit of useful work.","Apply all six to one diagram rather than one at a time. A single change usually moves several pillars: adding a standby database replica improves reliability, raises cost, and adds operational work to keep configuration in step. Naming that interaction is what separates a review from a wish list.","Run it as a process. The AWS Well-Architected Tool holds the question set, records answers, links each item to remediation guidance and tracks findings over time. The useful output is three or four prioritized risks with an owner and a date, agreed with the customer."],"es":["Aprende qué pregunta cada pilar. Excelencia operativa pregunta cómo el equipo opera, cambia y observa la carga con seguridad. Seguridad pregunta quién puede actuar y cómo se protegen sistemas y datos. Fiabilidad pregunta si la carga cumple su función correctamente y se recupera de interrupciones. Eficiencia del rendimiento pregunta si los recursos atienden la demanda sin desperdicio. Optimización de costes pregunta si el gasto aporta valor. Sostenibilidad pregunta cómo reducir el impacto de recursos por unidad de trabajo útil.","Aplica los seis a un mismo diagrama en vez de uno por uno. Un solo cambio suele mover varios pilares: añadir una réplica de base de datos en espera mejora la fiabilidad, sube el coste y añade trabajo operativo para mantener la configuración alineada. Nombrar esa interacción distingue una revisión de una lista de deseos.","Ejecútalo como un proceso. La AWS Well-Architected Tool guarda el conjunto de preguntas, registra las respuestas, enlaza cada punto con guía de remediación y sigue los hallazgos en el tiempo. El resultado útil son tres o cuatro riesgos priorizados con responsable y fecha, acordados con el cliente."]},"pitfalls":{"en":["Reciting the six pillar names as if naming them were the answer. The value is in the finding you produce for this workload, not in the list.","Treating cost and sustainability as the same pillar. Buying a commitment discount lowers the bill without changing how much compute and storage the workload consumes."],"es":["Recitar los nombres de los seis pilares como si nombrarlos fuera la respuesta. El valor está en el hallazgo que produces para esta carga concreta, no en la lista.","Tratar coste y sostenibilidad como el mismo pilar. Comprar un descuento por compromiso baja la factura sin cambiar cuánto cómputo y almacenamiento consume la carga."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}]}},{"id":"reliability","parent":"architecture","title":{"en":"Reliability and resilience","es":"Fiabilidad y resiliencia"},"summary":{"en":"Keep a workload useful through failures and verify recovery against business objectives.","es":"Mantén una carga útil ante fallos y comprueba su recuperación frente a los objetivos del negocio."},"details":{"en":["Reliability engineering assumes components will fail and designs so the overall system keeps working or degrades gracefully rather than fully failing. Core techniques: redundancy across failure domains, automated health checks that detect and replace unhealthy components, and graceful degradation under overload. Reliability targets should be measurable numbers, not adjectives, an SLO like 99.9% availability over a rolling 30 days is testable, highly available is not.","This pillar is where Multi-AZ, Auto Scaling health checks, and circuit breakers converge as the same discipline: assume failure, detect it fast, route around it automatically."],"es":["La ingeniería de confiabilidad asume que los componentes fallaran y diseña para que el sistema en general siga funcionando o se degrade con elegancia en vez de fallar por completo. Técnicas centrales: redundancia entre dominios de falla, chequeos de salud automatizados que detectan y reemplazan componentes no saludables, y degradación elegante ante sobrecarga. Los objetivos de confiabilidad deberían ser números medibles, no adjetivos, un SLO como 99.9% de disponibilidad en una ventana móvil de 30 dias es verificable, altamente disponible no lo es.","Este pilar es donde Multi-AZ, los chequeos de salud de Auto Scaling, y los circuit breakers convergen como la misma disciplina: asume la falla, detectala rápido, rodeala automáticamente."]},"aws":{"en":"Use appropriate Multi-AZ deployments, load-balancer health checks, and an Auto Scaling group configured to replace unhealthy targets. Route 53 health checks can support DNS failover, subject to DNS caching and the endpoint design. A load balancer alone does not replace EC2 instances.","es":"Usa despliegues Multi-AZ adecuados, comprobaciones de salud del balanceador y un grupo de Auto Scaling configurado para reemplazar destinos no saludables. Las comprobaciones de Route 53 pueden apoyar la conmutación por DNS, condicionada por las cachés y el diseño de los destinos. Un balanceador por sí solo no reemplaza instancias EC2."},"question":{"en":"A customer says their application is highly available because it runs on EC2 with Auto Scaling. What follow-up questions test that claim?","es":"Un cliente dice que su aplicación es altamente disponible porque corre en EC2 con Auto Scaling. ¿Qué preguntas de seguimiento ponen a prueba esa afirmación?"},"answer":{"en":"Step 1: ask whether the Auto Scaling group spans multiple Availability Zones, a single-AZ group still has a single point of failure. Step 2: ask about the database tier's failure story, application redundancy means little if a single-AZ database is the real bottleneck. Step 3: ask for the measured availability number and how it is tested, without an SLO and failure testing, highly available is an assumption, not a verified property.","es":"Paso 1: pregunta si el grupo de Auto Scaling abarca múltiples Zonas de Disponibilidad, un grupo en una sola AZ aún tiene un punto único de falla. Paso 2: pregunta por la historia de falla de la capa de base de datos, la redundancia de aplicación importa poco si una base de datos en una sola AZ es el verdadero cuello de botella. Paso 3: pregunta por el número de disponibilidad medido y como se prueba, sin un SLO y pruebas de falla, altamente disponible es una suposición, no una propiedad verificada."},"related":["well-architected","disaster-recovery","cloud-scaling","improve-reliability"],"sources":[{"label":"AWS Well-Architected Reliability Pillar","url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html","label":"docs.aws.amazon.com: availability"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html","label":"docs.aws.amazon.com: design principles"}],"level":"applied","quickLinks":["improve-reliability"],"learning":{"definition":{"en":"Reliability is the ability of a workload to perform its intended function correctly and consistently, including recovering from failures and disruptions. Availability is the metric most often used to quantify it, the percentage of time a workload is available for use over a stated period, although availability alone does not capture everything reliability covers, such as correctness or data durability.","es":"La fiabilidad es la capacidad de una carga de trabajo para cumplir su función prevista de forma correcta y constante, incluida la recuperación ante fallos e interrupciones. La disponibilidad es la métrica que más se usa para cuantificarla, el porcentaje de tiempo que una carga está disponible para su uso durante un periodo declarado, aunque la disponibilidad por sí sola no abarca todo lo que cubre la fiabilidad, como la corrección o la durabilidad de los datos."},"simple":{"en":"Assume every component fails. Design so the system keeps serving, or degrades politely, when one does.","es":"Asume que cada componente falla. Diseña para que el sistema siga sirviendo, o se degrade con cortesía, cuando alguno falle."},"analogy":{"en":"Think of an aircraft with more than one engine: it is certified to fly and land with one out. The analogy stops short because aircraft redundancy is fixed at build time, while a cloud workload changes constantly, so the real risk is that nobody has checked recently whether the spare capacity still exists.","es":"Piensa en un avión con más de un motor: está certificado para volar y aterrizar con uno parado. La analogía se queda corta porque la redundancia de un avión se fija al construirlo, mientras que una carga en la nube cambia constantemente, así que el riesgo real es que nadie haya comprobado últimamente si la capacidad de reserva sigue existiendo."},"walkthrough":{"en":["Set a measurable target and say how it is measured. As a percentage of time over a window, 99.9% across a rolling 30 days allows roughly 43 minutes of unavailability that month and 99.99% allows roughly 4 minutes. Some teams define the target as a percentage of successful requests instead, which is a different number for the same system, so agree the definition before testing against it.","Remove shared failure points across the whole request path. Compute spread across Availability Zones behind a load balancer is the visible part, but session state, the database tier, outbound network paths and shared dependencies each need their own answer. Two instances in the same Availability Zone do not survive the loss of that zone.","Add automatic detection and recovery, because redundancy nobody switches to is decoration. Health checks should reflect whether the service can serve a request, not just whether a process is running, and replacement or failover should be configured rather than manual. Bounded retries with backoff, jitter and idempotency keep a recovering dependency from being knocked over again.","Prove it. AWS lists testing recovery procedures among the reliability design principles, because an untested failover is an assumption. Run a controlled failure exercise with stop conditions, measure the recovery time achieved, and check that the remaining capacity served peak traffic."],"es":["Fija un objetivo medible y di cómo se mide. Como porcentaje de tiempo sobre una ventana, 99,9% en 30 días móviles permite unos 43 minutos de indisponibilidad ese mes y 99,99% permite unos 4 minutos. Algunos equipos lo definen como porcentaje de solicitudes correctas, que es un número distinto para el mismo sistema, así que acuerda la definición antes de probar contra ella.","Elimina los puntos de fallo compartidos en todo el recorrido de la solicitud. El cómputo repartido entre Zonas de Disponibilidad detrás de un balanceador es la parte visible, pero el estado de sesión, la capa de base de datos, las rutas de salida y las dependencias compartidas necesitan cada una su respuesta. Dos instancias en la misma Zona de Disponibilidad no sobreviven a la pérdida de esa zona.","Añade detección y recuperación automáticas, porque una redundancia a la que nadie conmuta es decoración. Los health checks deben reflejar si el servicio puede atender una solicitud, no solo si un proceso está vivo, y la sustitución o la conmutación deben estar configuradas, no ser manuales. Los reintentos limitados con backoff, jitter e idempotencia evitan volver a tumbar una dependencia que se recupera.","Demuéstralo. AWS incluye probar los procedimientos de recuperación entre los principios de diseño de fiabilidad, porque una conmutación sin probar es un supuesto. Ejecuta un ejercicio de fallo controlado con condiciones de parada, mide el tiempo de recuperación logrado y comprueba que la capacidad restante atendió el tráfico de pico."]},"pitfalls":{"en":["Claiming high availability because Auto Scaling is enabled. An Auto Scaling group in one Availability Zone, or a single-zone database behind it, still leaves a single point of failure.","Adding redundancy without testing it. Standby capacity, a replica or a second zone only counts once you have measured a real failover, including whether remaining capacity serves peak load."],"es":["Afirmar alta disponibilidad porque Auto Scaling está activado. Un grupo de Auto Scaling en una sola Zona de Disponibilidad, o una base de datos de una sola zona detrás de él, sigue dejando un punto único de fallo.","Añadir redundancia sin probarla. La capacidad en espera, una réplica o una segunda zona solo cuentan cuando has medido una conmutación real, incluido si la capacidad restante atiende la carga de pico."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/availability.html","label":"docs.aws.amazon.com: availability"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html","label":"docs.aws.amazon.com: design principles"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}]},"diagrams":[{"id":"multi-az","kind":"zones","nodes":["reliability","disaster-recovery"],"title":{"en":"The same tier in two Availability Zones","es":"El mismo nivel en dos zonas de disponibilidad"},"caption":{"en":"Resilience comes from having no tier that lives in only one zone. The database here is an Amazon RDS Multi-AZ DB instance deployment, used as one concrete example: other database options replicate differently.","es":"La resiliencia surge de que ningún nivel viva en una sola zona. La base de datos de aquí es un despliegue de instancia de base de datos Multi-AZ de Amazon RDS, usado como un ejemplo concreto: otras opciones de base de datos replican de otra forma."},"alt":{"en":"A region with a load balancer enabled in two Availability Zones. Zone A holds application instances and the primary RDS DB instance. Zone B holds application instances and its synchronous standby, which serves no traffic in this deployment option. A closing note explains that the Auto Scaling group spans both zones, that failover promotes the standby so the endpoint name resolves to the new primary, and that this protects against losing a zone but is not a backup.","es":"Una región con un balanceador habilitado en dos zonas de disponibilidad. La zona A tiene instancias de aplicación y la instancia primaria de base de datos RDS. La zona B tiene instancias de aplicación y su copia en espera sincrónica, que no atiende tráfico en esta opción de despliegue. Una nota final explica que el grupo de auto escalado abarca las dos zonas, que el failover promueve la copia en espera y el nombre del endpoint apunta a la nueva primaria, y que esto protege frente a perder una zona pero no es una copia de seguridad."},"spanTop":{"label":{"en":"Application Load Balancer, enabled in both zones","es":"Application Load Balancer, habilitado en las dos zonas"},"note":{"en":"Health checks stop sending traffic to targets that stop answering in a failing zone.","es":"Las comprobaciones de salud dejan de enviar tráfico a los destinos que dejan de responder en una zona con problemas."}},"zones":[{"label":{"en":"Availability Zone A","es":"Zona de disponibilidad A"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Sized so the remaining zone can carry the load, or able to scale into it quickly.","es":"Dimensionadas para que la zona restante soporte la carga, o capaces de escalar rápido hasta ella."}},{"label":{"en":"RDS DB instance, primary","es":"Instancia de base de datos RDS, primaria"},"note":{"en":"Takes the reads and writes in this deployment option.","es":"Recibe las lecturas y escrituras en esta opción de despliegue."}}]},{"label":{"en":"Availability Zone B","es":"Zona de disponibilidad B"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Same image, same configuration, no state that exists in only one zone.","es":"Misma imagen, misma configuración, sin estado que exista solo en una zona."}},{"label":{"en":"RDS standby, synchronous","es":"Copia en espera RDS, sincrónica"},"note":{"en":"In a Multi-AZ DB instance deployment the standby serves no traffic. It is not a read replica and not a backup.","es":"En un despliegue de instancia Multi-AZ, la copia en espera no atiende tráfico. No es una réplica de lectura ni una copia de seguridad."}}]}],"spanBottom":{"label":{"en":"Auto Scaling group across both zones","es":"Grupo de auto escalado en las dos zonas"},"note":{"en":"Failover promotes the standby and the endpoint name resolves to the new primary, so plan for reconnection and a short interruption. Keep backups: this protects against losing a zone, not against a bad deployment or a deleted table.","es":"El failover promueve la copia en espera y el nombre del endpoint apunta a la nueva primaria, así que prevé la reconexión y una breve interrupción. Conserva copias de seguridad: esto protege frente a perder una zona, no frente a un despliegue defectuoso o una tabla borrada."}}}]},{"id":"disaster-recovery","parent":"architecture","title":{"en":"Disaster Recovery","es":"Recuperación ante desastres"},"summary":{"en":"Choose a recovery strategy from acceptable downtime and acceptable data loss.","es":"Elige una estrategia de recuperación según el tiempo de interrupción y la pérdida de datos aceptables."},"details":{"en":["Choose disaster recovery by working backward from RPO (acceptable data loss) and RTO (time to restore the required service). Backup/restore, pilot light, warm standby and multi-site active-active are patterns, not guaranteed recovery times. Actual results depend on data size, restore capacity, dependencies, detection and operator actions. Multi-AZ addresses zonal failures, not every regional or logical failure. Cross-Region recovery requires explicit replication or snapshot copies and tested infrastructure, permissions and runbooks."],"es":["Elige recuperación desde RPO (pérdida de datos aceptable) y RTO (tiempo para restaurar el servicio requerido). Backup/restauración, pilot light, warm standby y activo-activo son patrones, no tiempos garantizados. Dependen de tamaño, capacidad, dependencias, detección y operación. Multi-AZ aborda fallos zonales, no todos los regionales o lógicos. Recuperación entre regiones requiere replicación o copia explícita de snapshots e infraestructura, permisos y runbooks probados."]},"aws":{"en":"Aurora Global Database and cross-region snapshot copies for data-layer DR; AWS Elastic Disaster Recovery (DRS) for continuous replication into a target region.","es":"Aurora Global Database y copias de snapshot entre regiones para DR de la capa de datos; AWS Elastic Disaster Recovery (DRS) para replicación continua hacia una región destino."},"question":{"en":"A customer with a single-region Multi-AZ deployment says disaster recovery is already covered. What gap do you identify?","es":"Un cliente cree que Multi-AZ cubre cualquier desastre. ¿Qué escenarios y objetivos de recuperación revisarías?"},"answer":{"en":"Clarify the required RPO/RTO for each failure scenario. Multi-AZ is not a complete Region-loss strategy. Compare recovery patterns, estimate dependencies and cost, then run restore/failover tests with production-like data. An RTO in hours does not prove backup/restore is sufficient until the restore is measured.","es":"Aclara RPO/RTO para cada escenario. Multi-AZ no cubre por completo pérdida de región. Compara patrones, dependencias y coste y prueba restauración con datos representativos. Un RTO de horas no demuestra que backup/restauración baste hasta medirlo."},"related":["reliability","data-sql","well-architected","improve-reliability"],"sources":[{"label":"AWS Disaster Recovery Strategies","url":"https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html","label":"docs.aws.amazon.com: disaster recovery dr objectives"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html","label":"docs.aws.amazon.com: plan for disaster recovery dr"}],"level":"applied","quickLinks":["improve-reliability"],"learning":{"definition":{"en":"Disaster recovery is the plan for restoring a whole workload after a rare, large disruption such as a Region-wide failure, a destructive human error or an attack. It is driven by two business-defined objectives: the Recovery Time Objective (RTO), the maximum acceptable delay before service is restored, and the Recovery Point Objective (RPO), the maximum acceptable amount of data measured in time that may be lost.","es":"La recuperación ante desastres es el plan para restaurar una carga de trabajo completa tras una interrupción grande e infrecuente, como el fallo de una región entera, un error humano destructivo o un ataque. La guían dos objetivos que define el negocio: el objetivo de tiempo de recuperación (RTO), el retraso máximo aceptable antes de restaurar el servicio, y el objetivo de punto de recuperación (RPO), la cantidad máxima de datos, medida en tiempo, que se puede perder."},"simple":{"en":"Two numbers decide everything: how long you can be down, and how much recent data you can lose.","es":"Dos números lo deciden todo: cuánto tiempo puedes estar caído y cuántos datos recientes puedes perder."},"analogy":{"en":"RPO is how often you save the document you are writing, and RTO is how long it takes to get a working computer after yours dies. Save every 15 minutes and you can lose 15 minutes of writing. The analogy understates the problem, because restoring a business workload also means rebuilding infrastructure, permissions and connections to other systems.","es":"El RPO es cada cuánto guardas el documento que escribes, y el RTO es cuánto tardas en tener otro ordenador funcionando. Si guardas cada 15 minutos, puedes perder 15 minutos de escritura. La analogía se queda corta, porque restaurar una carga de negocio implica también reconstruir infraestructura, permisos y conexiones con otros sistemas."},"walkthrough":{"en":["Make both objectives numeric first. An RPO of 15 minutes means losing up to 15 minutes of committed writes is acceptable, so a nightly backup taken at 02:00 cannot meet it: a failure at 16:00 would lose 14 hours. An RTO of 4 hours means the service must be usable again within 4 hours of the interruption, including detection and human decisions, not just the restore command.","Match a strategy to those numbers. AWS documents four broad approaches. Backup and restore is cheapest and slowest, since infrastructure and data are recreated after the event. Pilot light keeps data continuously replicated and core data services live while application compute is switched off or minimal, so recovery means starting and scaling that compute. Warm standby keeps a scaled-down but running copy that can take traffic immediately at reduced capacity. Multi-site active/active serves from more than one Region at once and is the most expensive and complex to operate.","Know what they do not give you. They are patterns, not guaranteed times: the result depends on data volume, restore throughput, dependencies, detection speed and operator actions. Multi-AZ redundancy addresses the loss of an Availability Zone and is not by itself a Region-loss or data-corruption strategy. Cross-Region recovery needs explicit replication or snapshot copies plus infrastructure as code, permissions and runbooks in the recovery Region.","Test with production-like data and record the measured numbers, since AWS Resilience Hub exists precisely to validate whether a workload is likely to meet its stated RTO and RPO."],"es":["Convierte primero los dos objetivos en números. Un RPO de 15 minutos significa que es aceptable perder hasta 15 minutos de escrituras confirmadas, así que un respaldo nocturno a las 02:00 no lo cumple: un fallo a las 16:00 perdería 14 horas. Un RTO de 4 horas significa que el servicio debe volver a ser usable en 4 horas desde la interrupción, incluidas la detección y las decisiones humanas.","Empareja una estrategia con esos números. AWS documenta cuatro enfoques. Backup y restauración es el más barato y lento, porque la infraestructura y los datos se recrean tras el evento. Pilot light mantiene los datos replicados y los servicios de datos principales vivos, con el cómputo de la aplicación apagado o mínimo, así que recuperar significa arrancarlo y escalarlo. Warm standby mantiene una copia reducida pero en marcha que recibe tráfico de inmediato con capacidad limitada. Multi-sitio activo/activo sirve desde varias regiones a la vez y es el más caro y complejo de operar.","Conoce lo que no te dan. Son patrones, no tiempos garantizados: el resultado depende del volumen de datos, de la restauración, de las dependencias, de la detección y del operador. Multi-AZ aborda la pérdida de una Zona de Disponibilidad y no cubre por sí sola la pérdida de una región ni la corrupción de datos. La recuperación entre regiones necesita replicación o copia explícita de snapshots, más infraestructura como código, permisos y runbooks en la región de recuperación.","Prueba con datos representativos de producción y anota los números medidos. AWS Resilience Hub existe para validar si una carga es capaz de cumplir el RTO y el RPO declarados."]},"pitfalls":{"en":["Assuming Multi-AZ covers disaster recovery. It protects against the loss of an Availability Zone, but a deleted table or a corrupted dataset is replicated to the standby as faithfully as valid data.","Counting a backup you have never restored. Untested backups regularly fail on missing permissions, missing encryption keys or an incomplete infrastructure definition in the recovery Region."],"es":["Suponer que Multi-AZ cubre la recuperación ante desastres. Protege frente a la pérdida de una Zona de Disponibilidad, pero una tabla borrada o un dato corrupto se replica al standby igual que un dato válido.","Contar un
