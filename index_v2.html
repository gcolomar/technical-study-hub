ne la granularidad, lo que representa cada fila, antes de incorporar tablas. Si un producto coincide con varios registros de categoría, cada unidad vendida puede aparecer varias veces e inflar los totales aunque la consulta termine correctamente.","Trasladar los informes no elimina el coste de extracción ni los datos ausentes. Limita la carga sobre el origen, controla hasta dónde ha avanzado la incorporación de datos y contrasta los totales usando el mismo intervalo temporal."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html","label":"docs.aws.amazon.com: c high level system architecture"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"}]}},{"id":"security","parent":null,"title":{"en":"Security and Governance","es":"Seguridad y gobernanza"},"summary":{"en":"Protect each data path according to the harm it could cause, then test both permitted and forbidden actions.","es":"Protege cada recorrido de datos según el daño posible y prueba tanto las acciones permitidas como las prohibidas."},"details":{"en":["The same control can protect one property while harming another. Blocking every request preserves confidentiality but destroys availability. Define expected legitimate flows before tightening a policy, and retain a reviewed recovery procedure so an urgent access fix does not become an uncontrolled bypass."],"es":["Un control puede proteger una propiedad y perjudicar otra. Bloquear toda petición conserva la confidencialidad, pero destruye la disponibilidad. Define los flujos legítimos antes de endurecer una política y conserva un procedimiento de recuperación revisado para que una corrección urgente no se convierta en una excepción sin control."]},"aws":{"en":"For an invoice API on EC2, AWS maintains the underlying infrastructure; the team still patches its guest operating system, configures its role and security group, and checks customer ownership in application code.","es":"En una API de facturas sobre EC2, AWS mantiene la infraestructura subyacente; el equipo sigue aplicando parches al sistema operativo invitado, configurando su rol y grupo de seguridad y comprobando la propiedad de las facturas en código."},"question":{"en":"Our invoice bucket is encrypted and private. Can customer A safely download any invoice identifier the API accepts?","es":"El bucket de facturas está cifrado y es privado. ¿Puede el cliente A descargar con seguridad cualquier identificador que acepte la API?"},"answer":{"en":"I would check authorisation in the API. Its backend may legitimately read the whole bucket while each customer may read only their own invoices. Encryption and private storage do not enforce that customer boundary. Derive the customer identity from the authenticated session, check ownership before reading and test requests for another customer’s identifiers. Keep the backend role narrow enough for its job, and record denied attempts without exposing document content in logs.","es":"Revisaría la autorización de la API. El backend puede necesitar leer todo el bucket, aunque cada cliente solo deba consultar sus facturas. El cifrado y el almacenamiento privado no aplican ese límite. Obtendría la identidad de la sesión autenticada, comprobaría la propiedad antes de leer y probaría identificadores ajenos. Limitaría el rol del backend a su función y registraría los rechazos sin exponer documentos en los registros."},"related":["iam","encryption","security-governance","improve-security"],"sources":[{"label":"AWS Shared Responsibility Model","url":"https://aws.amazon.com/compliance/shared-responsibility-model/"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"},{"url":"https://www.nist.gov/cyberframework","label":"nist.gov: cyberframework"}],"level":"foundation","quickLinks":["improve-security"],"learning":{"definition":{"en":"Security protects the confidentiality, integrity and availability of a system: who can read information, who can change it and whether authorised users can use the service. It starts with deciding what could go wrong and which consequences matter most.","es":"La seguridad protege la confidencialidad, integridad y disponibilidad de un sistema: quién puede leer la información, quién puede modificarla y si los usuarios autorizados pueden utilizar el servicio. Empieza por identificar qué puede salir mal y qué consecuencias importan más."},"simple":{"en":"A threat model connects a valuable asset, such as a customer file, with a possible attacker and a route to misuse. Engineers place controls along that route. Authentication establishes an identity; authorisation decides what that identity may do. Network filters restrict reachable endpoints, while encryption protects data on specified paths or storage. Logging records useful evidence. These controls address different failures, so a valid login must not automatically grant access to every customer record.","es":"Un modelo de amenazas relaciona algo valioso, como un expediente de cliente, con un posible atacante y una vía de abuso. Los ingenieros sitúan controles en esa vía. La autenticación establece una identidad; la autorización decide qué puede hacer. Los filtros de red restringen los destinos accesibles, mientras el cifrado protege datos en determinados tramos o almacenamientos. Los registros conservan pruebas útiles. Cada control aborda fallos distintos: iniciar sesión no debe dar acceso automáticamente a todos los expedientes."},"analogy":{"en":"A clinic checks identity at reception and still restricts which records each employee can open. The limit: software must repeat access checks on requests; a single physical entrance cannot represent every digital path.","es":"Una clínica comprueba la identidad en recepción y limita qué expedientes puede abrir cada empleado. El límite: el software debe comprobar cada petición; una sola entrada física no representa todas las vías digitales."},"walkthrough":{"en":["A document portal lets customer A download invoice A17. The team identifies unauthorised invoice reading as a threat and maps the browser, API and document store involved in that request.","The API verifies the login and checks that A owns A17 before reading the file. Its storage role cannot make documents public. TLS protects the browser connection, without replacing the ownership check.","A test changes the requested identifier to customer B’s invoice. The API rejects it before returning content. The team records the denied request without logging the invoice, then confirms A can still download A17."],"es":["Un portal permite al cliente A descargar la factura A17. El equipo identifica la lectura indebida como amenaza y dibuja el navegador, la API y el almacén documental que intervienen.","La API verifica la sesión y comprueba que A es propietario de A17 antes de leer el archivo. Su rol de almacenamiento no puede publicar documentos. TLS protege la conexión del navegador, sin sustituir esa comprobación.","Una prueba cambia el identificador por una factura del cliente B. La API rechaza la petición antes de devolver contenido. El equipo registra el rechazo sin guardar la factura y confirma que A sigue accediendo a A17."]},"pitfalls":{"en":["A managed service removes some infrastructure tasks, not responsibility for application permissions, data classification or configuration. Identify the exact service boundary before assigning ownership.","A successful happy-path test says little about denied access. Test another user’s identifiers and expired credentials as well as legitimate requests."],"es":["Un servicio gestionado elimina algunas tareas de infraestructura, no la responsabilidad sobre permisos, clasificación de datos o configuración. Identifica el límite concreto del servicio antes de asignar responsables.","Una prueba de acceso correcto dice poco sobre los rechazos. Prueba identificadores de otro usuario y credenciales caducadas, además de peticiones legítimas."]},"sourceUrls":[{"url":"https://aws.amazon.com/compliance/shared-responsibility-model/","label":"aws.amazon.com: shared responsibility model"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"},{"url":"https://www.nist.gov/cyberframework","label":"nist.gov: cyberframework"}]}},{"id":"iam","parent":"security","title":{"en":"IAM: Identity and Access Management","es":"IAM: gestión de identidad y acceso"},"summary":{"en":"A role provides an identity for requests; policies determine the actions that identity may actually perform.","es":"Un rol aporta una identidad a las peticiones; las políticas determinan qué acciones puede realizar realmente."},"details":{"en":["A role trust policy answers who may assume that role, not what the resulting session may do. Cross-account role access therefore needs a valid assumption path as well as permissions for the later resource request. Distinguish a failure to obtain credentials from a failure to use them; they involve different actions and policy checks."],"es":["La política de confianza de un rol determina quién puede asumirlo, no qué puede hacer la sesión resultante. El acceso mediante un rol de otra cuenta necesita una vía válida para asumirlo y permisos para la petición posterior. Distingue el fallo al obtener credenciales del fallo al utilizarlas: implican acciones y comprobaciones distintas."]},"aws":{"en":"Give the EC2 invoice worker an instance-profile role with read access only to the required S3 object prefix. If it lists objects too, review the separate bucket-level s3:ListBucket permission and prefix condition.","es":"Asigna al proceso EC2 un rol mediante un perfil de instancia con lectura solo sobre el prefijo S3 necesario. Si también enumera objetos, revisa por separado el permiso s3:ListBucket sobre el bucket y su condición de prefijo."},"question":{"en":"A role has an S3 read allow, but a request is denied. Would AdministratorAccess prove the application is configured correctly?","es":"Un rol permite leer S3, pero la petición se rechaza. ¿Añadir AdministratorAccess demostraría que la aplicación está bien configurada?"},"answer":{"en":"I would inspect the actual caller identity, action and resource first, including whether the application obtained the intended role session. Then I would inspect applicable resource policies and permission limits for a deny or missing grant. For an SSE-KMS object, I would also check the separate key permissions needed to decrypt it. Broad administrator access can hide a missing permission and still cannot override every applicable deny. Reproduce the exact request and fix the narrow cause instead.","es":"Primero comprobaría la identidad real, la acción y el recurso, incluida la sesión de rol que obtuvo la aplicación. Después revisaría políticas de recurso y límites aplicables para localizar una denegación o un permiso ausente. Si el objeto usa SSE-KMS, comprobaría también los permisos de clave necesarios para descifrarlo. El acceso de administrador puede ocultar un permiso ausente y no anula cualquier denegación aplicable. Reproduciría la petición exacta y corregiría su causa concreta."},"related":["encryption","secrets-management","security-governance"],"sources":[{"label":"IAM JSON Policy Evaluation Logic","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html"},{"label":"IAM Policy Types","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html#access_policy-types"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"}],"level":"deep","learning":{"definition":{"en":"Identity and access management controls which principals may perform which actions on which resources. A principal is an identity making a request, such as a person or an application using a role; a policy describes permissions and conditions.","es":"La gestión de identidad y acceso controla qué identidades pueden realizar qué acciones sobre qué recursos. Un principal es la identidad que hace una petición, por ejemplo una persona o una aplicación que usa un rol; una política describe permisos y condiciones."},"simple":{"en":"An application obtains temporary credentials for a role and signs a request. AWS evaluates the action, resource and request context against applicable policies. An explicit deny in an applicable policy overrides an allow. Otherwise, a valid permission grant must exist and applicable limits must permit it. Identity policies attach to identities; resource policies attach to resources. Boundaries and organisation controls can restrict permissions but do not create grants. The exact combination depends on the principal and account relationship.","es":"Una aplicación obtiene credenciales temporales de un rol y firma una petición. AWS evalúa la acción, el recurso y el contexto frente a las políticas aplicables. Una denegación explícita aplicable prevalece sobre un permiso. En los demás casos debe existir una concesión válida y los límites aplicables deben permitirla. Las políticas de identidad se asocian a identidades; las de recurso, a recursos. Los límites y controles organizativos restringen, pero no conceden. La combinación depende del principal y de la relación entre cuentas."},"analogy":{"en":"A temporary staff badge identifies its holder, while a room access list decides whether a door opens. The limit: AWS evaluates several policy types together; no single badge or list describes every decision.","es":"Una acreditación temporal identifica a su titular, mientras una lista determina si puede entrar en una sala. El límite: AWS evalúa varios tipos de políticas; ninguna acreditación o lista representa por sí sola todas las decisiones."},"walkthrough":{"en":["An EC2 invoice worker needs to read objects under invoices/ in one S3 bucket. The instance uses an assigned role instead of an access key stored in its code.","The role policy allows s3:GetObject on that object prefix. The worker requests invoices/A17.pdf with its temporary credentials; assume no applicable deny or other restriction blocks the allowed read.","The worker then attempts to delete the invoice. In this example no identity or resource policy grants s3:DeleteObject, so the request is denied. Successful reading did not imply permission to delete."],"es":["Un proceso EC2 de facturas necesita leer objetos bajo invoices/ en un bucket S3. La instancia utiliza un rol asignado, no una clave de acceso guardada en el código.","La política del rol permite s3:GetObject en ese prefijo de objetos. El proceso solicita invoices/A17.pdf con credenciales temporales; suponemos que ninguna denegación u otra restricción aplicable bloquea la lectura permitida.","Después intenta borrar la factura. En este ejemplo ninguna política de identidad o recurso concede s3:DeleteObject, por lo que se rechaza la petición. Poder leer no implicaba poder borrar."]},"pitfalls":{"en":["Adding another allow cannot cancel an applicable explicit deny. Find the denying policy and understand its purpose rather than continually widening the role.","Do not reduce all IAM evaluation to a universal union or intersection. Resource grants to a user, role or role session can interact differently with permission limits."],"es":["Añadir otro permiso no anula una denegación explícita aplicable. Localiza la política que deniega y entiende su propósito, en lugar de ampliar continuamente el rol.","No reduzcas toda la evaluación IAM a una unión o intersección universal. Las concesiones a un usuario, rol o sesión pueden interactuar de forma distinta con los límites."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html","label":"docs.aws.amazon.com: reference policies evaluation logic"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html","label":"docs.aws.amazon.com: access policies"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"}]}},{"id":"encryption","parent":"security","title":{"en":"Encryption: At Rest and In Transit","es":"Cifrado: en reposo y en tránsito"},"summary":{"en":"Separate protection of stored bytes, transport connections and access to usable keys.","es":"Distingue la protección de los datos almacenados, las conexiones y el acceso a claves utilizables."},"details":{"en":["Key rotation and data re-encryption are different operations. Rotating KMS key material does not automatically rewrite every existing ciphertext; KMS retains the material needed to decrypt older ciphertext under the key. If a requirement demands replacing already exposed data keys or re-encrypting stored files, design and verify that additional process explicitly."],"es":["Rotar claves y volver a cifrar datos son operaciones distintas. Rotar el material de una clave KMS no reescribe automáticamente todos los datos cifrados: KMS conserva el material necesario para descifrar versiones anteriores bajo esa clave. Si debes sustituir claves de datos expuestas o volver a cifrar archivos, diseña y verifica ese proceso adicional."]},"aws":{"en":"For an S3 claims archive using SSE-KMS, choose a customer-managed KMS key when the team needs its own key policy and lifecycle controls. Authorised S3 reads still return plaintext to the caller, so object permissions remain essential.","es":"En un archivo de reclamaciones S3 con SSE-KMS, elige una clave administrada por el cliente si necesitas controlar su política y ciclo de vida. Una lectura S3 autorizada sigue devolviendo datos legibles, por lo que los permisos de objeto continúan siendo esenciales."},"question":{"en":"We disabled a KMS key, but an application still displays a previously opened document. Does that prove KMS ignored the change?","es":"Hemos deshabilitado una clave KMS, pero una aplicación sigue mostrando un documento abierto anteriormente. ¿Demuestra que KMS ignoró el cambio?"},"answer":{"en":"No. I would determine whether the application is making a new KMS request or displaying plaintext it already obtained. It may also hold a decrypted data key in memory. Disabling the KMS key does not recall either copy. Review application sessions, caches and retention, and test a genuinely new decrypt request under controlled conditions. CloudTrail can show supported KMS API calls, but an application using a cached key does not generate a KMS call for every local read.","es":"No. Averiguaría si la aplicación hace una nueva petición a KMS o muestra datos que ya obtuvo. También puede conservar en memoria una clave de datos descifrada. Deshabilitar la clave KMS no recupera ninguna de esas copias. Revisaría sesiones, cachés y retención, y probaría una operación nueva de descifrado en condiciones controladas. CloudTrail puede mostrar llamadas API compatibles de KMS, pero leer localmente con una clave en caché no genera una llamada KMS por lectura."},"related":["iam","secrets-management"],"sources":[{"label":"AWS KMS Concepts - Envelope Encryption","url":"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#enveloping"},{"url":"https://docs.aws.amazon.com/kms/latest/developerguide/data-keys.html","label":"docs.aws.amazon.com: data keys"}],"level":"applied","learning":{"definition":{"en":"Encryption transforms readable data into ciphertext that requires suitable key material to recover. Encryption at rest protects stored representations; encryption in transit protects data between the endpoints where the encrypted connection begins and ends.","es":"El cifrado transforma datos legibles en texto cifrado que requiere claves adecuadas para recuperarlos. El cifrado en reposo protege su representación almacenada; el cifrado en tránsito los protege entre los extremos donde comienza y termina la conexión cifrada."},"simple":{"en":"In envelope encryption, an application uses a data key to encrypt a file and a separate wrapping key to protect that data key. It stores the encrypted file alongside the encrypted data key, not the plaintext key. To read the file later, an authorised component asks the key service to recover the data key, then decrypts the file. This keeps large-file processing separate from key management. Access policies still decide who may obtain usable keys and plaintext.","es":"En el cifrado de sobre, una aplicación cifra un archivo con una clave de datos y protege esa clave mediante otra clave. Guarda el archivo cifrado junto con la clave de datos cifrada, no con la clave en claro. Para leerlo después, un componente autorizado pide al servicio de claves que recupere la clave de datos y descifra el archivo. Así separa el procesamiento de archivos grandes de la gestión de claves. Las políticas siguen decidiendo quién puede obtener claves utilizables y datos legibles."},"analogy":{"en":"A locked document box and a separately controlled key cabinet illustrate the two layers. The limit: once software receives plaintext or a usable key, cryptography cannot make it forget copies it already holds.","es":"Una caja cerrada y un armario de llaves controlado por separado ilustran las dos capas. El límite: cuando el software recibe datos legibles o una clave utilizable, el cifrado no le hace olvidar sus copias."},"walkthrough":{"en":["A claims service creates a PDF. It requests a data key from AWS KMS, receiving a plaintext data key and an encrypted copy protected by its chosen KMS key.","The service encrypts the PDF locally with the plaintext data key, stores the ciphertext and encrypted key together, and removes the plaintext key from use as soon as practical.","An authorised reader sends the encrypted data key to KMS for decryption, then uses the returned key to read the PDF. The download also uses TLS so the resulting plaintext is protected on that connection."],"es":["Un servicio de reclamaciones crea un PDF. Solicita una clave de datos a AWS KMS y recibe la clave en claro y una copia cifrada protegida por la clave KMS elegida.","El servicio cifra el PDF localmente con la clave de datos en claro, guarda juntos el archivo y la clave cifrados y deja de conservar la clave en claro en cuanto resulta viable.","Un lector autorizado envía la clave de datos cifrada a KMS para descifrarla y usa la clave devuelta para leer el PDF. La descarga utiliza también TLS para proteger los datos legibles durante esa conexión."]},"pitfalls":{"en":["Disabling a key blocks future operations that require that key service; it does not erase plaintext or decrypted data keys already held by an application.","TLS termination at a load balancer ends one encrypted connection. If the backend leg also needs protection, configure that leg explicitly and understand how its peer is authenticated."],"es":["Deshabilitar una clave bloquea operaciones futuras que la necesiten en el servicio; no borra datos legibles ni claves ya descifradas que conserve una aplicación.","La terminación TLS en un balanceador finaliza una conexión cifrada. Si el tramo al backend también necesita protección, configúralo expresamente y comprueba cómo se autentica el otro extremo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html","label":"docs.aws.amazon.com: concepts"},{"url":"https://docs.aws.amazon.com/kms/latest/developerguide/data-keys.html","label":"docs.aws.amazon.com: data keys"}]}},{"id":"secrets-management","parent":"security","title":{"en":"Secrets Management","es":"Gestión de secretos"},"summary":{"en":"Treat rotation as a coordinated change to the target, the stored value and the applications using it.","es":"Trata la rotación como un cambio coordinado del destino, el valor almacenado y las aplicaciones que lo utilizan."},"details":{"en":["Connection pools complicate rotation tests: an already authenticated session may continue working while every new connection fails. Test both existing traffic and fresh connections, including scale-out processes that start after the change. Decide how long consumers may cache a secret and how they distinguish a stale credential from an unrelated authentication or network failure."],"es":["Los grupos de conexiones complican las pruebas: una sesión ya autenticada puede seguir funcionando mientras fallan todas las conexiones nuevas. Prueba el tráfico existente y las conexiones recién creadas, incluidos procesos iniciados al ampliar capacidad. Define cuánto pueden conservar el secreto y cómo distinguen una credencial antigua de otro fallo de autenticación o red."]},"aws":{"en":"Use AWS Secrets Manager with a supported rotation integration or rotation function for the invoice database. Parameter Store can hold KMS-encrypted SecureString parameters, but SecureString is a value type, not a promise of equivalent automated rotation.","es":"Usa AWS Secrets Manager con una integración compatible o una función de rotación para la base de facturas. Parameter Store admite parámetros SecureString cifrados con KMS, pero SecureString es un tipo de valor, no una garantía de rotación automática equivalente."},"question":{"en":"Password rotation succeeded, yet newly scaled workers cannot connect. Existing workers look healthy. What would you test?","es":"La rotación terminó correctamente, pero los procesos recién añadidos no conectan. Los existentes parecen sanos. ¿Qué probarías?"},"answer":{"en":"I would test a new connection using the active secret version, then compare the failing workers’ identity, retrieval permissions and cached configuration. Existing connections may mask a problem because they authenticated before rotation. Check that the target accepts the promoted credential and that startup retrieves the expected version rather than an embedded value. Add bounded refresh and reconnect handling, without logging the password. A successful rotation job alone does not prove every consumer has adopted the change.","es":"Probaría una conexión nueva con la versión activa y compararía la identidad, los permisos de lectura y la configuración almacenada de los procesos que fallan. Las conexiones existentes pueden ocultar el problema porque se autenticaron antes. Comprobaría que el destino acepta la credencial activa y que el arranque obtiene esa versión, no un valor incrustado. Añadiría actualización y reconexión limitadas, sin registrar la contraseña. Que termine la rotación no demuestra que todos los consumidores la hayan adoptado."},"related":["encryption","security-detection"],"sources":[{"label":"AWS Secrets Manager - What Is Secrets Manager","url":"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"},{"url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html","label":"docs.aws.amazon.com: systems manager parameter store"}],"level":"applied","learning":{"definition":{"en":"A secret is a value whose possession can grant access, such as a database password or API token. Secrets management controls how that value is created, stored, delivered, replaced and revoked without scattering copies through code and configuration.","es":"Un secreto es un valor cuya posesión puede dar acceso, como una contraseña de base de datos o un token de API. Su gestión controla cómo se crea, almacena, entrega, sustituye y revoca sin repartir copias por el código y la configuración."},"simple":{"en":"An application authenticates to a secret store using its workload identity. The store checks permission before returning the secret, which the application uses to connect to the target system. Rotation changes the credential accepted by that target and coordinates the stored value with its consumers. Caching reduces retrieval calls but leaves old copies in processes. A working design therefore defines refresh and reconnection behaviour, not just a schedule that writes a new password into a vault.","es":"Una aplicación se autentica ante un almacén de secretos mediante su identidad de ejecución. El almacén comprueba los permisos antes de devolver el secreto, que la aplicación utiliza para conectarse al sistema de destino. La rotación cambia la credencial que acepta ese sistema y coordina el valor guardado con sus consumidores. La caché reduce consultas, pero deja copias antiguas en procesos. Por eso hay que definir actualización y reconexión, no solo programar una contraseña nueva en una caja fuerte."},"analogy":{"en":"Changing a building’s entry code works only if the lock and authorised occupants receive the coordinated update. The limit: software may keep existing authenticated connections after a password changes; rotation does not always terminate them.","es":"Cambiar el código de un edificio exige actualizar coordinadamente la cerradura y a sus usuarios autorizados. El límite: el software puede mantener conexiones autenticadas tras cambiar la contraseña; rotarla no siempre las termina."},"walkthrough":{"en":["An invoice worker reads a database credential from a secret store at startup. Its role may read this credential but cannot enumerate or retrieve unrelated application secrets.","A configured rotation workflow updates the target database credential, tests the replacement and promotes the appropriate secret version. The exact sequence depends on the chosen database and rotation strategy.","The worker’s next new connection fails because it cached the old password. It performs a bounded refresh, retrieves the current version and reconnects; the test also checks that credentials never appear in error logs."],"es":["Un proceso de facturas obtiene una credencial de base de datos al arrancar. Su rol puede leerla, pero no enumerar ni recuperar secretos de otras aplicaciones.","Un proceso de rotación configurado actualiza la credencial en la base de datos, prueba la sustitución y activa la versión correspondiente del secreto. La secuencia concreta depende de la base y la estrategia elegidas.","La siguiente conexión nueva del proceso falla porque conservaba la contraseña anterior. Actualiza la credencial con reintentos limitados, obtiene la versión vigente y se reconecta; la prueba comprueba además que los errores no registren contraseñas."]},"pitfalls":{"en":["Deleting a leaked value from the latest source file does not revoke it or remove repository history. Replace the credential at its issuer and investigate where it was used.","A secret store does not make every returned copy safe. Avoid plaintext logs and excessive process access; use temporary role credentials instead of a stored password when the target supports that model."],"es":["Borrar un valor filtrado del archivo actual no lo revoca ni elimina el historial. Sustituye la credencial en el sistema que la emite e investiga dónde se utilizó.","Un almacén no protege automáticamente todas las copias que entrega. Evita registros en claro y acceso excesivo al proceso; usa credenciales temporales de rol en lugar de contraseñas cuando el destino lo admita."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","label":"docs.aws.amazon.com: best practices"},{"url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html","label":"docs.aws.amazon.com: systems manager parameter store"}]}},{"id":"security-governance","parent":"security","title":{"en":"Account and Organization Governance","es":"Gobernanza de cuentas y organización"},"summary":{"en":"Central account limits constrain local permissions, but a boundary does not itself grant access.","es":"Los límites centrales de las cuentas restringen los permisos locales, pero no conceden acceso por sí mismos."},"details":{"en":["Delegating administration of an AWS service does not give that account general power to edit the organisation's SCPs. Record who owns service settings and who owns organisation policies, because an incident may need both. A recovery role inside a restricted member account remains subject to applicable SCPs; calling it an emergency role does not create an exception. Identify an authorised route for changing the policy itself."],"es":["Delegar la administración de un servicio AWS no concede a esa cuenta capacidad general para editar las SCP de la organización. Deja claro quién controla los ajustes del servicio y quién las políticas organizativas, porque un incidente puede requerir a ambos. Un rol de recuperación dentro de una cuenta miembro restringida sigue sujeto a las SCP aplicables; llamarlo rol de emergencia no crea una excepción. Identifica una vía autorizada para modificar la propia política."]},"aws":{"en":"Use AWS Control Tower to establish the account environment, then apply an AWS Organizations SCP to the analytics OU that denies cloudtrail:DeleteTrail while IAM policies give deployment roles their workload permissions.","es":"Utiliza AWS Control Tower para establecer el entorno de cuentas y aplica una SCP de AWS Organizations a la OU de analítica que deniegue cloudtrail:DeleteTrail; las políticas IAM conceden a los roles de despliegue los permisos para sus aplicaciones."},"question":{"en":"Our deployment role has AdministratorAccess, yet it cannot delete a trail in a member account. Should I attach another IAM policy?","es":"Nuestro rol de despliegue tiene AdministratorAccess, pero no puede borrar un registro de seguimiento en una cuenta miembro. ¿Debo adjuntar otra política IAM?"},"answer":{"en":"Another IAM policy will not overcome an applicable explicit denial. Check the failed action and the policies inherited from the organisation root through the account's OUs, then check other relevant limits, such as a permissions boundary. If the trail-deletion SCP is responsible, decide with its owner whether to maintain the block or approve a narrowly scoped change. Use the established administrative route to make that change. Moving the task to the member account's root user would not bypass the SCP.","es":"Añadir otra política IAM no elimina una denegación explícita aplicable. Comprueba la acción fallida y las políticas heredadas desde la raíz de la organización hasta las OU de la cuenta; revisa también otros límites, como el de permisos del rol. Si la SCP impide borrar el registro de seguimiento, decide con su responsable si corresponde mantener el bloqueo o aprobar un cambio acotado. Tramítalo por la vía administrativa autorizada. Utilizar el usuario raíz de la cuenta miembro tampoco permitiría saltarse la SCP."},"related":["iam","security-detection"],"sources":[{"label":"AWS Organizations - Service Control Policies","url":"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"},{"url":"https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html","label":"docs.aws.amazon.com: what is control tower"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html","label":"docs.aws.amazon.com: access policies"}],"level":"deep","learning":{"definition":{"en":"Account governance sets the boundaries within which teams can operate their cloud accounts. It combines centrally maintained limits with local permission decisions, so each project does not have to invent its own security baseline.","es":"La gobernanza de cuentas establece los límites dentro de los que cada equipo puede operar en la nube. Combina restricciones centrales con decisiones locales de acceso para que cada proyecto no tenga que definir desde cero sus criterios de seguridad."},"simple":{"en":"A central security team groups accounts into organisational units, or OUs, to apply common rules. In AWS, a service control policy (SCP) sets a permissions ceiling for affected identities. A workload team still grants access through identity and resource policies. A request succeeds only if the applicable policies allow it; an explicit denial stops it. Therefore, giving a role broad permissions cannot override an SCP restriction.","es":"El equipo central de seguridad agrupa cuentas en unidades organizativas, llamadas OU, para aplicar reglas comunes. En AWS, una política de control de servicios, o SCP, fija el máximo de permisos de las identidades afectadas. El equipo de la aplicación sigue concediendo acceso mediante políticas de identidad y de recursos. La solicitud solo prospera si las políticas aplicables lo permiten; una denegación explícita la bloquea. Por eso, ampliar los permisos de un rol no permite saltarse una SCP."},"analogy":{"en":"Think of a shared workshop: the owner prohibits welding indoors, while each supervisor decides who may use the tools. A supervisor's key cannot override that rule; cloud policies evaluate requests rather than physical entry.","es":"En un taller compartido, el propietario prohíbe soldar dentro y cada encargado decide quién utiliza las herramientas. Tener la llave no anula la prohibición; las políticas de nube evalúan solicitudes, no entradas físicas."},"walkthrough":{"en":["An analytics team needs to deploy workloads but must not delete its audit trail. Security places its test account in an OU and prepares an SCP denying cloudtrail:DeleteTrail.","The team uses a deployment role with permission to create workloads and delete trails. Workload creation remains allowed where other policies permit it, but the attempted trail deletion is rejected.","After checking normal deployments, security rolls the rule out to the production OU. An authorised central administrator retains the ability to revise the SCP if it blocks an approved change."],"es":["El equipo de analítica necesita desplegar aplicaciones, pero no debe borrar su registro de seguimiento de CloudTrail. Seguridad incluye la cuenta de pruebas en una OU y prepara una SCP que deniega cloudtrail:DeleteTrail.","El equipo utiliza un rol de despliegue con permiso para crear aplicaciones y borrar registros de seguimiento. La creación sigue permitida cuando las demás políticas lo autorizan, pero el intento de borrar el registro de seguimiento se rechaza.","Tras comprobar los despliegues habituales, seguridad extiende la regla a la OU de producción. Un administrador central autorizado conserva la capacidad de modificar la SCP si bloquea un cambio aprobado."]},"pitfalls":{"en":["Do not treat the management account or service-linked roles as covered by SCPs. Member-account root users are covered; central administrators need a separate, authorised way to change the governing policies.","Do not assume an SCP protects a resource from every external caller. Resource policies, and resource control policies where supported, address resource-side restrictions; their scope and permissions still need checking."],"es":["No des por hecho que las SCP cubren la cuenta de administración o los roles vinculados a servicios. Sí afectan al usuario raíz de las cuentas miembro; los administradores centrales necesitan una vía autorizada e independiente para modificar esas políticas.","No supongas que una SCP protege un recurso frente a cualquier solicitante externo. Las políticas de recursos y las políticas de control de recursos compatibles permiten imponer restricciones sobre el recurso; también hay que comprobar su alcance y sus permisos."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html","label":"docs.aws.amazon.com: orgs manage policies scps"},{"url":"https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html","label":"docs.aws.amazon.com: what is control tower"},{"url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html","label":"docs.aws.amazon.com: access policies"}]}},{"id":"security-detection","parent":"security","title":{"en":"Detection and Audit","es":"Detección y auditoría"},"summary":{"en":"A finding starts an investigation; retained evidence determines how much of the incident you can reconstruct.","es":"Un hallazgo inicia la investigación; las pruebas conservadas determinan cuánto puedes reconstruir del incidente."},"details":{"en":["A caller field often identifies an assumed role session rather than a human operator. Preserve relevant sign-in or federation records and session tags when available, so a reviewer can connect identity evidence across systems. Check timestamps before declaring an inconsistency: records from two sources may arrive at different times even when they describe the same event."],"es":["El campo que identifica al solicitante suele mostrar una sesión de rol asumido, no a una persona. Conserva los registros de inicio de sesión o federación y las etiquetas de sesión pertinentes cuando estén disponibles, para poder relacionar las pruebas de identidad entre sistemas. Comprueba las marcas de tiempo antes de declarar una incoherencia: los registros de dos fuentes pueden llegar en momentos distintos aunque describan el mismo suceso."]},"aws":{"en":"For an invoice bucket, configure a CloudTrail trail to capture S3 object-write data events and retain its logs in S3; use GuardDuty findings as investigative leads alongside those records.","es":"Para un bucket de facturas, configura un registro de seguimiento de CloudTrail que capture eventos de datos de escritura de objetos S3 y conserve los registros en S3; investiga los hallazgos de GuardDuty junto con esas pruebas."},"question":{"en":"An invoice disappeared yesterday, but CloudTrail Event history shows no deletion. Can we conclude that nobody deleted it?","es":"Ayer desapareció una factura, pero el historial de eventos de CloudTrail no muestra ningún borrado. ¿Podemos concluir que nadie la borró?"},"answer":{"en":"No. Event history does not contain S3 object data events, so that search cannot answer the question. Check whether a trail or event data store was already collecting the relevant bucket's object-write activity at the time. If it was, examine DeleteObject events and the associated session identity. If it was not, look for other existing evidence, such as application logs, and document the gap. Enabling logging now helps future investigations but does not recreate the missing event.","es":"No. El historial de eventos no incluye los eventos de datos de objetos S3, así que esa búsqueda no resuelve la duda. Comprueba si un registro de seguimiento o un almacén de eventos ya recogía las operaciones de escritura del bucket afectado. Si era así, examina los eventos DeleteObject y la identidad de sesión asociada. Si no, busca otras pruebas existentes, como los registros de la aplicación, y documenta esa carencia. Activar el registro ahora ayuda en futuras investigaciones, pero no reconstruye el evento que falta."},"related":["security-governance","observability"],"sources":[{"label":"AWS CloudTrail - Logging Data and Management Events","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html"},{"label":"Amazon GuardDuty - How It Works","url":"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html"},{"label":"CloudTrail event history and limitations","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html"}],"level":"applied","learning":{"definition":{"en":"Detection looks for signs of suspicious behaviour; audit reconstructs what happened from recorded evidence. Together, they help a team investigate suspected incidents and explain the decisions made during its response.","es":"La detección busca indicios de comportamiento sospechoso; la auditoría reconstruye lo ocurrido a partir de pruebas registradas. Juntas ayudan al equipo a investigar posibles incidentes y a explicar las decisiones tomadas durante la respuesta."},"simple":{"en":"An application role makes a request, and an activity log records supported details such as the caller and action. A detection service examines available signals and produces a finding, meaning a reason to investigate rather than proof of an attack. An analyst connects that finding to retained records and resource configuration. Missing records leave gaps in that reconstruction, so choosing what to collect and how long to keep it directly affects later investigations.","es":"Un rol de aplicación envía una solicitud y un registro de actividad conserva datos compatibles, como quién la hizo y qué acción pidió. Un servicio de detección analiza las señales disponibles y genera un hallazgo: un motivo para investigar, no una prueba de ataque. El analista relaciona ese hallazgo con los registros conservados y la configuración de los recursos. Si faltan registros, quedan huecos; por eso, decidir qué recopilar y durante cuánto tiempo conservarlo condiciona las investigaciones posteriores."},"analogy":{"en":"A shop's alarm draws attention to movement, while its camera footage helps reconstruct events. An alarm alone cannot identify everything that happened, and a camera cannot show areas it never recorded.","es":"La alarma de una tienda avisa de movimiento y las grabaciones ayudan a reconstruirlo. La alarma no explica todo lo ocurrido, y ninguna cámara muestra lo que quedó fuera de su campo de visión."},"walkthrough":{"en":["A finance team enables CloudTrail data events for object writes, including deletions, on its invoice bucket before an incident. It retains the trail logs in a separately controlled S3 bucket.","An invoice later disappears. The analyst finds the DeleteObject event and checks the role session alongside the object key and time; this links the deletion to a recorded request, not automatically to a named person.","A GuardDuty finding also flags suspicious activity involving that role. The analyst checks whether its timing and session match the deletion before containing access, because related-looking events may have different causes."],"es":["Antes de un incidente, finanzas activa los eventos de datos de CloudTrail para las escrituras de objetos, incluidos los borrados, en su bucket de facturas. Conserva los registros en otro bucket S3 con control de acceso separado.","Más tarde desaparece una factura. El analista encuentra el evento DeleteObject y comprueba la sesión del rol junto con la clave del objeto y la hora; así relaciona el borrado con una solicitud registrada, no necesariamente con una persona concreta.","Un hallazgo de GuardDuty también señala actividad sospechosa relacionada con ese rol. El analista comprueba si la hora y la sesión coinciden con el borrado antes de restringir el acceso, porque sucesos aparentemente relacionados pueden tener causas distintas."]},"pitfalls":{"en":["CloudTrail Event history contains 90 days of management activity per Region, without requiring a trail. It excludes data events, so silence there cannot establish that nobody accessed an S3 object. Enable object-level logging explicitly and budget for charges.","Separate configuration evidence from threat signals: AWS Config tracks supported resource settings, while GuardDuty examines supported sources and enabled protection plans. Some runtime coverage requires agents, so deployment requirements depend on the protection selected."],"es":["El historial de eventos de CloudTrail conserva 90 días de actividad de gestión por región sin exigir un registro de seguimiento. Excluye los eventos de datos: que no aparezca un acceso a S3 no demuestra que no ocurriera. Configura expresamente el registro de operaciones sobre objetos y presupuesta su coste.","Distingue las pruebas de configuración de las señales de amenaza: AWS Config recoge ajustes de recursos compatibles, mientras GuardDuty analiza fuentes compatibles y planes de protección activados. Parte de la supervisión en ejecución requiere agentes; el despliegue depende de la protección elegida."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html","label":"docs.aws.amazon.com: cloudtrail concepts"},{"url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html","label":"docs.aws.amazon.com: view cloudtrail events"},{"url":"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html","label":"docs.aws.amazon.com: what is guardduty"}]}},{"id":"ai","parent":null,"title":{"en":"Applied AI and Generative AI","es":"IA aplicada e IA generativa"},"summary":{"en":"Build the workflow around evidence and controlled decisions, not around how fluent the generated answer sounds.","es":"Diseña el flujo en torno a pruebas y decisiones controladas, sin confundir una respuesta fluida con una respuesta fiable."},"details":{"en":["A source change and a model change can alter answers independently. Keep policy versions with test cases so a failed test reveals whether the assistant used stale evidence or misunderstood current evidence. For financial eligibility, let validated application rules or an authorised reviewer make the binding decision; the model can explain it without gaining approval authority. Custom training in Amazon SageMaker AI introduces another model version to evaluate rather than removing that need."],"es":["Un cambio de fuente y uno de modelo pueden alterar las respuestas de forma independiente. Conserva las versiones de la política con los casos de prueba para distinguir si el asistente utilizó pruebas antiguas o interpretó mal las vigentes. Deja las decisiones económicas vinculantes en reglas de aplicación validadas o en manos de un revisor autorizado; el modelo puede explicarlas sin adquirir capacidad de aprobación. Entrenar un modelo propio en Amazon SageMaker AI añade otra versión que evaluar, no elimina esa necesidad."]},"aws":{"en":"Build the hotel-policy assistant with Amazon Bedrock for response generation and a Bedrock Knowledge Base for document retrieval; the application enforces each employee's document entitlements before sending passages to the model.","es":"Construye el asistente de política hotelera con Amazon Bedrock para generar respuestas y una base de conocimiento de Bedrock para recuperar documentos; la aplicación aplica los permisos documentales de cada empleado antes de enviar pasajes al modelo."},"question":{"en":"The hotel-policy assistant answers our demonstration questions well. Is that enough to give it expense-approval access?","es":"El asistente de política hotelera responde bien a las preguntas de la demostración. ¿Basta para darle permiso para aprobar gastos?"},"answer":{"en":"No. A demonstration shows a few successful outputs, not reliable decisions across real policy cases. Test examples with outdated documents, missing details and conflicting evidence, using answers checked by the policy owner. Check that users cannot retrieve someone else's restricted material and that malicious document text cannot trigger tool actions. Measure cost under realistic usage. Keep approval in validated application rules or with an authorised reviewer until the evidence supports the intended level of automation.","es":"No. Una demostración muestra algunos aciertos, no decisiones fiables ante todos los casos reales. Prueba políticas antiguas, información incompleta y pruebas contradictorias, con respuestas revisadas por el responsable de la política. Comprueba que cada usuario solo recupera material autorizado y que las instrucciones maliciosas de los documentos no activan herramientas. Mide el coste con un uso realista. Mantén la aprobación en reglas de aplicación validadas o en manos de un revisor autorizado hasta reunir pruebas que justifiquen el nivel de automatización previsto."},"related":["ai-rag","ai-embeddings","ai-evaluation"],"sources":[{"label":"Amazon Bedrock - What Is Amazon Bedrock","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}],"level":"foundation","learning":{"definition":{"en":"Applied AI uses learned patterns to perform a task, such as classifying a message or predicting demand. Generative AI is the part that creates new content, so a useful system must control what information reaches the model and how its output is used.","es":"La IA aplicada utiliza patrones aprendidos para realizar una tarea, como clasificar un mensaje o prever la demanda. La IA generativa es la parte que crea contenido nuevo; para que resulte útil, el sistema debe controlar qué información recibe el modelo y cómo se utiliza su respuesta."},"simple":{"en":"In a support assistant, the application receives an employee's question and checks which documents that employee may read. A retriever selects relevant passages, which the application supplies with instructions to a model that generates a response. This pattern is retrieval-augmented generation, or RAG: retrieved evidence supplements the request without retraining the model. Because generation follows learned patterns rather than a truth test, the response can still misinterpret the evidence. The application must check it before consequential use.","es":"En un asistente de soporte, la aplicación recibe una pregunta y comprueba qué documentos puede consultar el empleado. Un recuperador selecciona pasajes pertinentes, que la aplicación envía al modelo junto con las instrucciones para redactar una respuesta. Este patrón, llamado generación aumentada por recuperación o RAG, añade pruebas documentales sin reentrenar el modelo. Como la generación sigue patrones aprendidos en lugar de comprobar la verdad, puede interpretar mal esos pasajes. La aplicación debe revisar la respuesta antes de usarla en decisiones importantes."},"analogy":{"en":"Imagine a new colleague drafting a reply from a folder you provide. Relevant pages help, but the colleague may misunderstand them; similarly, retrieved documents give a model context without making its answer authoritative.","es":"Imagina que un compañero recién incorporado redacta una respuesta con la carpeta que le entregas. Puede malinterpretar páginas pertinentes; del mismo modo, recuperar documentos aporta contexto al modelo sin que su respuesta adquiera autoridad."},"walkthrough":{"en":["An employee asks whether a €180 hotel night is reimbursable. The assistant retrieves the current travel policy for that employee's country and grade, excluding documents the employee cannot access.","The model drafts a reply citing the applicable limit and approval conditions. If the policy needs a city or travel date that the employee omitted, the assistant asks rather than inventing eligibility.","Before release, the team tests this question alongside outdated-policy and missing-information cases. It checks supported conclusions and access isolation, then measures response time and cost to decide whether the workflow is usable."],"es":["Un empleado pregunta si le reembolsarán una noche de hotel de 180 €. El asistente recupera la política de viajes vigente para su país y nivel, excluyendo documentos a los que no tiene acceso.","El modelo redacta una respuesta que cita el límite aplicable y las condiciones de aprobación. Si la política requiere una ciudad o fecha que el empleado ha omitido, el asistente pregunta en lugar de inventarse si corresponde el reembolso.","Antes del lanzamiento, el equipo prueba esta pregunta junto con casos de políticas antiguas e información incompleta. Comprueba el respaldo documental de las conclusiones y la separación de accesos; después mide el tiempo de respuesta y el coste para valorar si el flujo resulta utilizable."]},"pitfalls":{"en":["A convincing answer or a citation is not evidence of correctness. Evaluate whether the cited passage supports the conclusion, and route ambiguous reimbursement decisions to a responsible reviewer.","Treat retrieved text as untrusted input: a document may contain malicious instructions. Enforce access outside the model, restrict any tools, and account for generation and retrieval costs."],"es":["Una respuesta convincente o una cita no demuestran que la conclusión sea correcta. Comprueba si el pasaje citado la respalda y deriva las decisiones ambiguas sobre reembolsos a un revisor responsable.","Trata el texto recuperado como una entrada no fiable: puede contener instrucciones maliciosas. Aplica los permisos fuera del modelo, limita las herramientas disponibles y calcula el coste de generar respuestas y recuperar contenido."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html","label":"docs.aws.amazon.com: what is bedrock"},{"url":"https://www.nist.gov/itl/ai-risk-management-framework","label":"nist.gov: ai risk management framework"}]}},{"id":"ai-embeddings","parent":"ai","title":{"en":"Embeddings and Vector Search","es":"Embeddings y búsqueda vectorial"},"summary":{"en":"Compatible embeddings help retrieve related passages; similarity alone does not establish correctness or permission to read.","es":"Los embeddings compatibles ayudan a recuperar pasajes relacionados; la similitud no demuestra exactitud ni permiso de lectura."},"details":{"en":["A vector coordinate is not a labelled property such as 'handle' or 'suitcase'. Meaning is distributed across the representation, so a similarity score compares candidates under one setup rather than expressing the probability that a passage answers the question. Combine vector retrieval with exact-term matching when model numbers or error codes determine relevance, and test the combined behaviour with real support queries."],"es":["Una coordenada del vector no es una propiedad etiquetada como «asa» o «maleta». El significado se distribuye por la representación; por eso, la puntuación de similitud compara candidatos dentro de una configuración, pero no expresa la probabilidad de que un pasaje responda a la pregunta. Combina la recuperación vectorial con coincidencias exactas cuando las referencias de modelo o los códigos de error determinen la pertinencia, y prueba el comportamiento conjunto con consultas reales de soporte."]},"aws":{"en":"Use Amazon Titan Text Embeddings through Amazon Bedrock to encode suitcase-manual passages and their queries, then search a matching-dimension vector index in Amazon OpenSearch Service with document-access filters.","es":"Utiliza Amazon Titan Text Embeddings mediante Amazon Bedrock para representar pasajes de manuales de maletas y sus consultas; después busca en un índice vectorial de Amazon OpenSearch Service con la dimensión correspondiente y filtros de acceso documental."},"question":{"en":"We changed the embedding model for user questions but kept the old manual index. Search still returns results. Is the change safe?","es":"Hemos cambiado el modelo de embeddings de las preguntas, pero conservamos el índice antiguo de manuales. La búsqueda sigue devolviendo resultados. ¿Es seguro el cambio?"},"answer":{"en":"Returning results only shows that the request was accepted. Two models can produce vectors of the same length while arranging meaning differently, so the new query vectors may no longer align with the stored document vectors. Unless compatibility is explicitly established, re-embed the manuals with the new model and build a separate index. Test known questions, including unusual wording and exact model numbers, before switching traffic. Keep the matching old query model and index available for rollback.","es":"Que devuelva resultados solo demuestra que la solicitud se ha aceptado. Dos modelos pueden producir vectores de igual longitud y organizar el significado de forma distinta; las consultas nuevas quizá ya no encajen con los documentos indexados. Salvo que exista compatibilidad explícita, genera de nuevo las representaciones de los manuales y crea otro índice. Prueba preguntas conocidas, incluidas expresiones poco habituales y referencias exactas de producto, antes de cambiar el tráfico. Conserva el modelo de consulta anterior junto con su índice para poder volver atrás."},"related":["ai-rag","data-nosql"],"sources":[{"label":"Amazon OpenSearch Service k-NN","url":"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html","label":"docs.aws.amazon.com: titan embedding models"}],"level":"applied","learning":{"definition":{"en":"An embedding represents content as a list of numbers that a model uses to capture patterns of meaning. Vector search compares those lists to find potentially relevant material, helping an application retrieve useful passages even when the question uses different wording.","es":"Una representación vectorial, o embedding, expresa contenido mediante una lista de números con la que un modelo recoge patrones de significado. La búsqueda vectorial compara esas listas para localizar material potencialmente pertinente, incluso cuando la pregunta utiliza palabras distintas de las del documento."},"simple":{"en":"A search application splits documents into passages and sends each passage to an embedding model. The model returns a vector, a fixed-size sequence of numbers, which an index stores with a link to the passage and its access metadata. When a user asks a question, the application embeds it in the same compatible space and compares vectors using a chosen similarity measure. Nearby vectors suggest related meaning, so the application retrieves those passages for reading or generation.","es":"La aplicación divide los documentos en pasajes y los envía a un modelo de embeddings. Este devuelve un vector, una secuencia numérica de tamaño fijo, que un índice guarda junto con el enlace al pasaje y sus datos de acceso. Cuando llega una pregunta, la aplicación la representa en el mismo espacio compatible y compara vectores con una medida de similitud. La cercanía sugiere significados relacionados; por eso, recupera esos pasajes para consultarlos o utilizarlos al generar una respuesta."},"analogy":{"en":"Think of placing books on a map by subject rather than alphabet. A question points towards a neighbourhood worth exploring, but nearby books may still be outdated or unsuitable for the reader.","es":"Imagina colocar libros en un mapa según su temática, en vez de ordenarlos alfabéticamente. Una pregunta señala una zona que merece explorarse, pero los libros cercanos pueden estar desactualizados o no ser adecuados para ese lector."},"walkthrough":{"en":["A repair agent asks, 'The suitcase handle will not extend; how do I fix it?' The manual describes a 'jammed telescopic grip', so an exact wording match could miss the answer.","The application embeds the question with the model used for the manuals. It searches within documents permitted for that agent and suitcase model, then retrieves a passage about freeing the handle mechanism.","The agent opens the passage and checks the repair procedure before using it. The team adds this wording mismatch to its retrieval tests, so later model or index changes can be checked against it."],"es":["Un técnico pregunta: «El asa de la maleta no se extiende; ¿cómo la arreglo?». El manual describe un «tirador telescópico atascado», así que buscar una coincidencia exacta de palabras podría dejar fuera la respuesta.","La aplicación representa la pregunta con el modelo utilizado para los manuales. Busca entre documentos autorizados para ese técnico y correspondientes al modelo de maleta; después recupera un pasaje sobre cómo liberar el mecanismo del asa.","El técnico abre el pasaje y comprueba el procedimiento antes de aplicarlo. El equipo incorpora esta diferencia de vocabulario a sus pruebas de recuperación para evaluar después los cambios de modelo o de índice."]},"pitfalls":{"en":["Do not mix incompatible document and query embeddings. Matching vector lengths alone does not establish compatibility; a model change may require re-embedding the documents and building a new index.","Similarity does not establish factual accuracy or access rights. Approximate search trades some retrieval completeness for efficiency, so measure missed relevant passages and apply authorisation before content reaches the user or model."],"es":["No mezcles representaciones incompatibles de documentos y consultas. Que los vectores tengan la misma longitud no demuestra compatibilidad; cambiar de modelo puede exigir volver a representar los documentos y construir otro índice.","La similitud no acredita exactitud ni permisos de acceso. La búsqueda aproximada puede omitir pasajes pertinentes a cambio de eficiencia; mide esas omisiones y aplica la autorización antes de que el contenido llegue al usuario o al modelo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html","label":"docs.aws.amazon.com: titan embedding models"},{"url":"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html","label":"docs.aws.amazon.com: knn"}]},"diagrams":[{"id":"rag-sequence","kind":"sequence","nodes":["ai-rag","ai-embeddings"],"title":{"en":"Retrieve relevant evidence before asking for an answer","es":"Recuperar información relevante antes de pedir una respuesta"},"caption":{"en":"This example uses vector search: the application retrieves passages and gives them to the model alongside the question. Those passages help ground the answer but do not guarantee accuracy. Keyword or hybrid search can replace or complement vector search.","es":"Este ejemplo usa búsqueda vectorial: la aplicación recupera fragmentos y los entrega al modelo junto con la pregunta. Los fragmentos ayudan a fundamentar la respuesta, pero no garantizan su exactitud. La búsqueda por palabras clave o híbrida puede sustituir o complementar a la vectorial."},"alt":{"en":"User asks application a question. Application obtains a numerical embedding, searches stored passage vectors and enforces user permissions before giving passages to the language model. Application sends question and authorised passages as context; the model generates an answer; the application returns it with citations to verify. Vector search is one retrieval option. Relevant context and citations do not guarantee factual correctness.","es":"El usuario pregunta a la aplicación. Esta obtiene una representación numérica, busca vectores de fragmentos y aplica los permisos antes de entregar texto al modelo de lenguaje. Envía la pregunta y los fragmentos autorizados como contexto; el modelo genera una respuesta y la aplicación la devuelve con citas que deben comprobarse. La búsqueda vectorial es una opción de recuperación. El contexto relevante y las citas no garantizan exactitud."},"actors":[{"id":"user","label":{"en":"User","es":"Usuario"}},{"id":"app","label":{"en":"Application","es":"Aplicación"}},{"id":"embed","label":{"en":"Embedding model","es":"Modelo de embeddings"}},{"id":"store","label":{"en":"Vector store","es":"Almacén vectorial"}},{"id":"llm","label":{"en":"Language model","es":"Modelo de lenguaje"}}],"steps":[{"from":"user","to":"app","label":{"en":"A question in plain language","es":"Una pregunta en lenguaje natural"}},{"from":"app","to":"embed","label":{"en":"Turn the question into a vector","es":"Convierte la pregunta en un vector"},"note":{"en":"An embedding is a numerical representation used for similarity search. Document passages were encoded earlier with a compatible model; changing the model normally requires rebuilding their vectors.","es":"Un embedding es una representación numérica usada para buscar similitud. Los fragmentos se codificaron antes con un modelo compatible; cambiarlo normalmente exige recalcular sus vectores."}},{"from":"app","to":"store","label":{"en":"Find the nearest passages, filtered by what this user may read","es":"Busca los pasajes más cercanos, filtrados por lo que este usuario puede leer"},"note":{"en":"The application enforces the user permissions before any passage reaches the language model. A prompt asking the model to keep secrets is not access control.","es":"La aplicación comprueba los permisos del usuario antes de que un fragmento llegue al modelo de lenguaje. Pedir al modelo que guarde secretos no es un control de acceso."}},{"from":"app","to":"llm","label":{"en":"Prompt: the question, the retrieved passages, and answer only from them","es":"Prompt: la pregunta, los pasajes recuperados y responde solo a partir de ellos"},"note":{"en":"Include only useful passages and identify their sources. More context increases input size and may add distractions, cost and latency.","es":"Incluye solo fragmentos útiles e identifica sus fuentes. Más contexto aumenta la entrada y puede añadir distracciones, coste y latencia."}},{"from":"llm","to":"app","label":{"en":"The model generates an answer using the supplied context","es":"El modelo genera una respuesta usando el contexto recibido"}},{"from":"app","to":"user","label":{"en":"The answer, with citations to the passages used","es":"La respuesta, con citas a los pasajes usados"},"note":{"en":"Check that each citation supports the associated claim. If evidence is missing, the system should say so rather than turn a fluent guess into an apparent fact.","es":"Comprueba que cada cita respalde su afirmación. Si falta información, el sistema debe indicarlo en lugar de presentar una suposición bien redactada como un hecho."}}]}]},{"id":"ai-rag","parent":"ai","title":{"en":"Retrieval-Augmented Generation","es":"Generación aumentada por recuperación"},"summary":{"en":"RAG supplies reference passages at answer time, so the explanation must follow their actual conditions.","es":"RAG aporta pasajes de consulta al responder; la explicación debe respetar sus condiciones reales."},"details":{"en":["Document splitting can separate a rule from the exception that changes its meaning. Preserve useful headings and linked qualifications when preparing searchable passages, then test questions that depend on those boundaries."],"es":["La división de documentos puede separar una norma de la excepción que cambia su significado. Conserva los encabezados útiles y las condiciones relacionadas al preparar los fragmentos, y prueba preguntas que dependan de esos límites."]},"aws":{"en":"An expense application can use Amazon Bedrock Knowledge Bases to retrieve an S3-hosted travel policy and explain the €42 claim, with requester-specific access filtering before generation.","es":"Una aplicación de gastos puede usar Amazon Bedrock Knowledge Bases para recuperar una política de viajes de S3 y explicar la solicitud de 42 €, filtrando por permisos antes de generar."},"question":{"en":"The assistant cites the policy but approves an excluded first-class ticket. Should we change the model or the search?","es":"El asistente cita la política, pero acepta un billete de primera clase excluido. ¿Hay que cambiar el modelo o la búsqueda?"},"answer":{"en":"The citation identifies the source, without proving that the conclusion follows. Inspect the passage sent to the model: did it include the first-class exclusion, or only the €50 limit? If the exclusion was missing, fix document splitting or retrieval. If it was present, test how the model applies eligibility rules. Keep the ticket class explicit in the question, and withhold an eligibility conclusion when that information is missing. This separates an evidence problem from an interpretation problem.","es":"La cita identifica la fuente, pero no demuestra que la conclusión sea válida. Revisa el pasaje que recibió el modelo: ¿incluía la exclusión de primera clase o solo el límite de 50 €? Si faltaba la exclusión, corrige la división documental o la búsqueda. Si estaba presente, comprueba cómo aplica el modelo las condiciones. Especifica la clase del billete y evita concluir si procede el reembolso cuando falte ese dato. Así distingues un problema de información de otro de interpretación."},"related":["ai-embeddings","ai-evaluation","ai-security"],"sources":[{"label":"Amazon Bedrock Knowledge Bases","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html"},{"url":"https://aws.amazon.com/what-is/retrieval-augmented-generation/","label":"aws.amazon.com: retrieval augmented generation"}],"level":"applied","learning":{"definition":{"en":"Retrieval-augmented generation, or RAG, gives a language model selected reference material when it prepares an answer. Its purpose is to make changing or specialist information available at question time, without retraining the model whenever a document changes.","es":"La generación aumentada por recuperación, o RAG, aporta material de consulta a un modelo de lenguaje cuando prepara una respuesta. Sirve para que disponga de información cambiante o especializada en ese momento, sin volver a entrenarlo cada vez que se modifica un documento."},"simple":{"en":"The user asks a question, but the application searches before asking the model to answer. A search component finds passages by matching words, meaning, or both; meaning-based search often compares vectors, numerical representations of text. The application places those passages beside the question in the model input. This gives the model evidence to work from, but the resulting explanation still needs checking: finding a relevant paragraph and interpreting its conditions are separate jobs.","es":"El usuario plantea una pregunta, pero la aplicación busca información antes de pedir la respuesta al modelo. El buscador localiza pasajes por palabras, por significado o combinando ambos métodos; para comparar significados puede usar vectores, representaciones numéricas del texto. La aplicación incorpora esos pasajes junto a la pregunta en la entrada del modelo. Así le proporciona información de apoyo, aunque la explicación necesita revisión: encontrar un párrafo pertinente y aplicar bien sus condiciones son tareas distintas."},"analogy":{"en":"Think of an adviser opening a handbook before replying to a colleague. The handbook supplies evidence, rather than new professional training. The analogy stops where a model may confidently misread a rule an adviser would question.","es":"Imagina a una asesora que consulta un manual antes de responder. El manual aporta información, sin cambiar su formación. La comparación tiene un límite: el modelo puede interpretar mal una norma y expresarla con mucha seguridad."},"walkthrough":{"en":["Marta asks whether her €42 standard-class train ticket is reimbursable. In this fictional organisation, the application first identifies Marta and searches only the travel-policy material her account is allowed to access.","It retrieves the current rule allowing standard-class fares up to €50 with a receipt, together with the relevant exceptions. These passages enter the model alongside her question; unrelated travel documents stay outside the input.","The assistant explains that the fare meets the stated price and class conditions, provided Marta supplies a receipt. It points to the supporting passage; if receipt requirements were unavailable, it would leave that condition unresolved."],"es":["Marta pregunta si puede pedir el reembolso de un billete de tren de clase estándar de 42 €. En esta organización ficticia, la aplicación identifica primero a Marta y busca únicamente en la documentación de viajes a la que su cuenta tiene acceso.","Recupera la norma vigente, que permite reembolsar billetes de clase estándar de hasta 50 € con justificante, junto con las excepciones pertinentes. Esos pasajes y la pregunta de Marta llegan juntos al modelo; los documentos ajenos a la consulta quedan fuera.","El asistente explica que el billete cumple las condiciones de importe y clase, siempre que Marta presente un justificante. Señala el pasaje que lo respalda; si no encontrase los requisitos del justificante, dejaría esa condición pendiente de confirmar."]},"pitfalls":{"en":["A source link can accompany an unsupported conclusion. Read the cited passage and verify that it supports the claim, including exceptions and dates.","When the authorised documents do not answer the question, the assistant should say what is missing. Repeated guessing can disguise a retrieval gap as useful advice."],"es":["Un enlace a una fuente puede acompañar una conclusión sin fundamento. Lee el pasaje citado y comprueba que respalda lo afirmado, incluidas las excepciones y las fechas.","Si los documentos autorizados no permiten responder, el asistente debe indicar qué información falta. Las conjeturas repetidas pueden hacer que una búsqueda insuficiente parezca una orientación útil."]},"sourceUrls":[{"url":"https://aws.amazon.com/what-is/retrieval-augmented-generation/","label":"aws.amazon.com: retrieval augmented generation"},{"url":"https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html","label":"docs.aws.amazon.com: knowledge base"}]},"diagrams":[{"id":"rag-sequence","kind":"sequence","nodes":["ai-rag","ai-embeddings"],"title":{"en":"Retrieve relevant evidence before asking for an answer","es":"Recuperar información relevante antes de pedir una respuesta"},"caption":{"en":"This example uses vector search: the application retrieves passages and gives them to the model alongside the question. Those passages help ground the answer but do not guarantee accuracy. Keyword or hybrid search can replace or complement vector search.","es":"Este ejemplo usa búsqueda vectorial: la aplicación recupera fragmentos y los entrega al modelo junto con la pregunta. Los fragmentos ayudan a fundamentar la respuesta, pero no garantizan su exactitud. La búsqueda por palabras clave o híbrida puede sustituir o complementar a la vectorial."},"alt":{"en":"User asks application a question. Application obtains a numerical embedding, searches stored passage vectors and enforces user permissions before giving passages to the language model. Application sends question and authorised passages as context; the model generates an answer; the application returns it with citations to verify. Vector search is one retrieval option. Relevant context and citations do not guarantee factual correctness.","es":"El usuario pregunta a la aplicación. Esta obtiene una representación numérica, busca vectores de fragmentos y aplica los permisos antes de entregar texto al modelo de lenguaje. Envía la pregunta y los fragmentos autorizados como contexto; el modelo genera una respuesta y la aplicación la devuelve con citas que deben comprobarse. La búsqueda vectorial es una opción de recuperación. El contexto relevante y las citas no garantizan exactitud."},"actors":[{"id":"user","label":{"en":"User","es":"Usuario"}},{"id":"app","label":{"en":"Application","es":"Aplicación"}},{"id":"embed","label":{"en":"Embedding model","es":"Modelo de embeddings"}},{"id":"store","label":{"en":"Vector store","es":"Almacén vectorial"}},{"id":"llm","label":{"en":"Language model","es":"Modelo de lenguaje"}}],"steps":[{"from":"user","to":"app","label":{"en":"A question in plain language","es":"Una pregunta en lenguaje natural"}},{"from":"app","to":"embed","label":{"en":"Turn the question into a vector","es":"Convierte la pregunta en un vector"},"note":{"en":"An embedding is a numerical representation used for similarity search. Document passages were encoded earlier with a compatible model; changing the model normally requires rebuilding their vectors.","es":"Un embedding es una representación numérica usada para buscar similitud. Los fragmentos se codificaron antes con un modelo compatible; cambiarlo normalmente exige recalcular sus vectores."}},{"from":"app","to":"store","label":{"en":"Find the nearest passages, filtered by what this user may read","es":"Busca los pasajes más cercanos, filtrados por lo que este usuario puede leer"},"note":{"en":"The application enforces the user permissions before any passage reaches the language model. A prompt asking the model to keep secrets is not access control.","es":"La aplicación comprueba los permisos del usuario antes de que un fragmento llegue al mo
