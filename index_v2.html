":"VPC design","es":"Diseño de VPC"},"summary":{"en":"An isolated AWS network where you choose address ranges, subnets, routes and traffic controls.","es":"Una red aislada de AWS en la que defines direcciones, subredes, rutas y controles de tráfico."},"details":{"en":["A VPC is regional; a subnet belongs to one Availability Zone. Route tables select paths while security groups and NACLs filter traffic. Start with required flows and failure domains, then allocate addresses and connectivity. A VPC is not a complete security boundary by itself."],"es":["Una VPC es regional; una subred pertenece a una AZ. Las tablas seleccionan rutas y SG y NACL filtran tráfico. Empieza por flujos y dominios de fallo; después asigna direcciones y conectividad. Una VPC no es por sí sola una frontera de seguridad completa."]},"aws":{"en":"Distribute critical tiers across AZs and account for cross-AZ costs and shared dependencies.","es":"Distribuye componentes críticos entre AZ y considera costes y dependencias compartidas."},"question":{"en":"Do two subnets guarantee high availability?","es":"¿Dos subredes garantizan alta disponibilidad?"},"answer":{"en":"No. They may share an AZ or depend on one database or gateway. Map every dependency to its failure domain.","es":"No. Pueden compartir AZ o depender de una sola base de datos o gateway. Asigna cada dependencia a su dominio de fallo."},"related":["cidr","well-architected"],"sources":[{"label":"Amazon VPC fundamentals","url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html","label":"docs.aws.amazon.com: subnet sizing"}],"level":"foundation","learning":{"definition":{"en":"A Virtual Private Cloud, abbreviated VPC, is a logically isolated virtual network you define inside one AWS Region. You choose its private address ranges, divide them into subnets, and decide which paths in and out exist. A subnet resides in a single Availability Zone.","es":"Una Virtual Private Cloud, abreviada VPC, es una red virtual aislada de forma lógica que defines dentro de una región de AWS. Eliges sus rangos de direcciones privadas, los divides en subredes y decides qué caminos de entrada y salida existen. Una subred reside en una sola zona de disponibilidad."},"simple":{"en":"Your own private network inside AWS. It spans a Region, and each subnet inside it belongs to one Availability Zone.","es":"Tu propia red privada dentro de AWS. Abarca una región, y cada subred que contiene pertenece a una zona de disponibilidad."},"analogy":{"en":"The VPC is an office building you rent and each subnet is a floor, and you choose which floors have a street door. The limitation: a real floor has walls, while a subnet is only addresses plus routing.","es":"La VPC es un edificio que alquilas y cada subred es una planta, y eliges qué plantas tienen puerta a la calle. La limitación: una planta real tiene paredes, mientras que una subred solo es direcciones más enrutamiento."},"walkthrough":{"en":["A network design answers three questions: which addresses exist, which paths connect them, and what each path permits. Plan addressing first, since it is hardest to change later.","The building blocks are a regional VPC holding CIDR blocks, zonal subnets, route tables that select paths, and two filter types: security groups on interfaces and network ACLs on subnets.","In AWS an Availability Zone is one or more discrete data centres. In standard AWS assigned IPv4 subnets five addresses are reserved, so a /24 gives 251 usable. Masks run /28 to /16.","Work an example: for a web application list the flows, browser to load balancer, load balancer to application, application to database. Place each tier in two zones, then verify each subnet's real zone."],"es":["Un diseño de red responde a tres preguntas: qué direcciones existen, qué caminos las conectan y qué permite cada camino. Planifica primero el direccionamiento, porque es lo más difícil de cambiar.","Los bloques son una VPC regional con bloques CIDR, subredes zonales, tablas de rutas que eligen caminos y dos tipos de filtro: grupos de seguridad en interfaces y NACL en subredes.","En AWS una zona de disponibilidad es uno o más centros de datos discretos. En subredes IPv4 estándar de AWS hay cinco direcciones reservadas, así que un /24 da 251 utilizables. Las máscaras van de /28 a /16.","Trabaja un ejemplo: para una aplicación web enumera los flujos, navegador a balanceador, balanceador a aplicación, aplicación a base de datos. Coloca cada capa en dos zonas y verifica la zona real de cada subred."]},"pitfalls":{"en":["A VPC is not a complete security boundary. It isolates addressing and routing, but it does not authenticate users or authorize API calls.","Two subnets do not prove high availability. Check they sit in different zones, and check which dependencies they share and whether those fail over."],"es":["Una VPC no es un límite de seguridad completo. Aísla direccionamiento y enrutamiento, pero no autentica usuarios ni autoriza llamadas de API.","Dos subredes no demuestran alta disponibilidad. Comprueba que están en zonas distintas y qué dependencias comparten, ya que un componente compartido puede no conmutar."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html","label":"docs.aws.amazon.com: what is amazon vpc"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html","label":"docs.aws.amazon.com: subnet sizing"}]},"diagrams":[{"id":"vpc-path","kind":"flow","nodes":["public-private","nat-egress","vpc"],"title":{"en":"Public entry, private workload, controlled exit","es":"Entrada pública, carga privada, salida controlada"},"caption":{"en":"What makes a subnet public is its route table, not its name. Inbound and outbound are separate designs, so they are drawn separately. This example uses a zonal public NAT gateway; a NAT gateway can also be configured as private, and other designs place one per zone or route through a shared one.","es":"Lo que hace pública a una subred es su tabla de rutas, no su nombre. La entrada y la salida son diseños distintos, así que se dibujan por separado. Este ejemplo usa un NAT gateway público zonal; un NAT gateway también puede configurarse como privado, y otros diseños colocan uno por zona o enrutan por uno compartido."},"alt":{"en":"Two flows. Inbound: a user on the internet reaches an internet gateway, then a load balancer in a public subnet, then application instances in a private subnet, then a database. Outbound: a private instance reaches a public NAT gateway in the public subnet, then the internet gateway, then the internet. Notes state that the load balancer security group allows 443 inbound and must also allow egress to the application port, and that the private subnet has no route to the internet gateway.","es":"Dos flujos. Entrada: un usuario de internet llega a un internet gateway, luego a un balanceador en una subred pública, luego a las instancias de aplicación en una subred privada, y luego a una base de datos. Salida: una instancia privada llega a un NAT gateway público en la subred pública, luego al internet gateway y luego a internet. Las notas indican que la security group del balanceador permite 443 de entrada y debe permitir también la salida al puerto de la aplicación, y que la subred privada no tiene ruta al internet gateway."},"flows":[{"label":{"en":"Inbound request","es":"Petición entrante"},"stages":[{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"User","es":"Usuario"},"note":{"en":"Resolves a public name to the load balancer address.","es":"Resuelve un nombre público a la dirección del balanceador."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"One per VPC. Only subnets whose route table points at it are public.","es":"Uno por VPC. Solo son públicas las subredes cuya tabla de rutas apunta a él."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Load balancer","es":"Balanceador de carga"},"note":{"en":"Its security group allows 443 inbound from the internet, and its egress rules must allow the application port towards the targets.","es":"Su security group permite 443 de entrada desde internet, y sus reglas de salida deben permitir el puerto de la aplicación hacia los destinos."}}]},{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Inbound allowed only from the load balancer security group, on the application port.","es":"Entrada permitida solo desde la security group del balanceador, en el puerto de la aplicación."}},{"label":{"en":"Database","es":"Base de datos"},"note":{"en":"Reachable only from the application security group, on one port.","es":"Alcanzable solo desde la security group de la aplicación, en un puerto."}}]}]},{"label":{"en":"Outbound update from a private instance","es":"Salida de una instancia privada"},"stages":[{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instance","es":"Instancia de aplicación"},"note":{"en":"Its default route points at the NAT gateway. There is no route to the internet gateway.","es":"Su ruta por defecto apunta al NAT gateway. No hay ruta al internet gateway."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Public NAT gateway","es":"NAT gateway público"},"note":{"en":"It lives in one Availability Zone, so place one per zone to avoid a cross-zone dependency. It rewrites the source address and allows replies, never new inbound connections.","es":"Vive en una sola zona de disponibilidad, así que coloca uno por zona para evitar una dependencia entre zonas. Reescribe la dirección de origen y permite respuestas, nunca conexiones entrantes nuevas."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"The same gateway, reached through the public subnet route.","es":"El mismo gateway, alcanzado por la ruta de la subred pública."}}]},{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"Package repository or public API","es":"Repositorio de paquetes o API pública"},"note":{"en":"For supported AWS services, a VPC endpoint can keep this traffic off the internet path entirely.","es":"Para los servicios AWS compatibles, un VPC endpoint puede mantener este tráfico totalmente fuera del camino por internet."}}]}]}]}]},{"id":"public-private","parent":"vpc","title":{"en":"Public and private subnets","es":"Subredes públicas y privadas"},"summary":{"en":"A direct route to an internet gateway makes a subnet public, but does not make every resource reachable.","es":"Una ruta directa a un internet gateway hace pública una subred, pero no vuelve accesible cada recurso."},"details":{"en":["A public subnet has a direct route to an Internet Gateway. Ordinary IPv4 EC2 Internet communication through it also needs a public IPv4 address and appropriate controls. A private subnet lacks that direct route but may initiate outbound traffic through NAT. Neither a public IP nor a route automatically permits inbound access."],"es":["Una subred pública tiene ruta directa a un Internet Gateway. La comunicación IPv4 ordinaria de EC2 también necesita IP pública y controles adecuados. Una privada no tiene esa ruta directa, pero puede iniciar salida mediante NAT. Ni IP pública ni ruta autorizan automáticamente acceso entrante."]},"aws":{"en":"A common web pattern places internet-facing ALB nodes in public subnets and targets in private subnets.","es":"Un patrón web común coloca ALB de cara a Internet en subredes públicas y destinos en privadas."},"question":{"en":"A public-IP instance cannot reach the Internet. What do you inspect?","es":"¿Qué inspeccionas si una instancia con IP pública no accede a Internet?"},"answer":{"en":"Check its actual route-table association, IGW route, SG, NACL and host configuration. A public IP alone is insufficient.","es":"Comprueba asociación real de tabla, ruta IGW, SG, NACL y host. La IP pública sola no basta."},"related":["routing","nat-egress","security-groups","load-balancing"],"sources":[{"label":"Internet gateways","url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html","label":"docs.aws.amazon.com: vpc nat gateway"}],"level":"foundation","learning":{"definition":{"en":"Public and private describe routing, not a setting on the subnet. A subnet is public when its associated route table has a route to an internet gateway, and private when it does not. The internet gateway enables VPC communication with the internet.","es":"Público y privado describen el enrutamiento, no un ajuste de la subred. Una subred es pública cuando su tabla de rutas asociada tiene una ruta hacia una pasarela de internet, y privada cuando no la tiene. La pasarela de internet permite la comunicación de la VPC con internet."},"simple":{"en":"A subnet is public only because it has a route to the internet gateway. Remove that route and the same subnet is private.","es":"Una subred es pública solo porque tiene una ruta hacia la pasarela de internet. Quita esa ruta y esa misma subred es privada."},"analogy":{"en":"In a business park a unit is open to the public because it sits on the main road, not because of a sign on the door. The limitation: an open road lets visitors walk in, while a route is still not permission.","es":"En un parque empresarial un local está abierto al público porque está en la carretera principal, no por un cartel en la puerta. La limitación: una carretera abierta deja entrar visitantes, mientras que una ruta sigue sin ser un permiso."},"walkthrough":{"en":["The VPC router reads the route table associated with the source subnet and picks the most specific match. If nothing matches, the packet is dropped silently.","There are three outward paths. Direct uses the internet gateway and needs a public IPv4 or IPv6 address. Translated lets private hosts start outbound connections. Private uses a gateway or endpoint.","A private subnet instance cannot reach the internet directly through an internet gateway even with a public address, but it can egress through NAT. The common VPN form crosses the internet encrypted.","The common pattern: load balancer nodes in public subnets, application targets in private subnets using NAT for patching, databases with no egress. To debug, read the route association, then filters, then the host."],"es":["El enrutador de la VPC lee la tabla de rutas asociada a la subred de origen y elige la coincidencia más específica. Si nada coincide, el paquete se descarta en silencio.","Hay tres caminos hacia fuera. Directo usa la pasarela de internet y necesita IPv4 pública o IPv6. Traducido permite que hosts privados inicien conexiones de salida. Privado usa una pasarela o punto de enlace.","Una instancia en subred privada no llega a internet directamente por una pasarela de internet ni con dirección pública, pero puede salir por NAT. La forma habitual de VPN cruza internet cifrada.","El patrón habitual: nodos del balanceador en subredes públicas, destinos de la aplicación en subredes privadas usando NAT para parcheo, bases de datos sin salida. Para depurar, lee la asociación de rutas, después los filtros y el host."]},"pitfalls":{"en":["Placing a resource in a public subnet is not authorization. A route and a public address only make it reachable, so filters still apply.","A tag is not configuration. A subnet named public-subnet-1 can use a route table with no internet gateway route, so read the real association."],"es":["Colocar un recurso en una subred pública no es una autorización. Una ruta y una dirección pública solo lo hacen alcanzable; los filtros siguen aplicando.","Una etiqueta no es configuración. Una subred llamada public-subnet-1 puede usar una tabla de rutas sin ruta a internet, así que lee la asociación real."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html","label":"docs.aws.amazon.com: VPC Internet Gateway"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html","label":"docs.aws.amazon.com: vpc nat gateway"}]},"diagrams":[{"id":"vpc-path","kind":"flow","nodes":["public-private","nat-egress","vpc"],"title":{"en":"Public entry, private workload, controlled exit","es":"Entrada pública, carga privada, salida controlada"},"caption":{"en":"What makes a subnet public is its route table, not its name. Inbound and outbound are separate designs, so they are drawn separately. This example uses a zonal public NAT gateway; a NAT gateway can also be configured as private, and other designs place one per zone or route through a shared one.","es":"Lo que hace pública a una subred es su tabla de rutas, no su nombre. La entrada y la salida son diseños distintos, así que se dibujan por separado. Este ejemplo usa un NAT gateway público zonal; un NAT gateway también puede configurarse como privado, y otros diseños colocan uno por zona o enrutan por uno compartido."},"alt":{"en":"Two flows. Inbound: a user on the internet reaches an internet gateway, then a load balancer in a public subnet, then application instances in a private subnet, then a database. Outbound: a private instance reaches a public NAT gateway in the public subnet, then the internet gateway, then the internet. Notes state that the load balancer security group allows 443 inbound and must also allow egress to the application port, and that the private subnet has no route to the internet gateway.","es":"Dos flujos. Entrada: un usuario de internet llega a un internet gateway, luego a un balanceador en una subred pública, luego a las instancias de aplicación en una subred privada, y luego a una base de datos. Salida: una instancia privada llega a un NAT gateway público en la subred pública, luego al internet gateway y luego a internet. Las notas indican que la security group del balanceador permite 443 de entrada y debe permitir también la salida al puerto de la aplicación, y que la subred privada no tiene ruta al internet gateway."},"flows":[{"label":{"en":"Inbound request","es":"Petición entrante"},"stages":[{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"User","es":"Usuario"},"note":{"en":"Resolves a public name to the load balancer address.","es":"Resuelve un nombre público a la dirección del balanceador."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"One per VPC. Only subnets whose route table points at it are public.","es":"Uno por VPC. Solo son públicas las subredes cuya tabla de rutas apunta a él."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Load balancer","es":"Balanceador de carga"},"note":{"en":"Its security group allows 443 inbound from the internet, and its egress rules must allow the application port towards the targets.","es":"Su security group permite 443 de entrada desde internet, y sus reglas de salida deben permitir el puerto de la aplicación hacia los destinos."}}]},{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Inbound allowed only from the load balancer security group, on the application port.","es":"Entrada permitida solo desde la security group del balanceador, en el puerto de la aplicación."}},{"label":{"en":"Database","es":"Base de datos"},"note":{"en":"Reachable only from the application security group, on one port.","es":"Alcanzable solo desde la security group de la aplicación, en un puerto."}}]}]},{"label":{"en":"Outbound update from a private instance","es":"Salida de una instancia privada"},"stages":[{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instance","es":"Instancia de aplicación"},"note":{"en":"Its default route points at the NAT gateway. There is no route to the internet gateway.","es":"Su ruta por defecto apunta al NAT gateway. No hay ruta al internet gateway."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Public NAT gateway","es":"NAT gateway público"},"note":{"en":"It lives in one Availability Zone, so place one per zone to avoid a cross-zone dependency. It rewrites the source address and allows replies, never new inbound connections.","es":"Vive en una sola zona de disponibilidad, así que coloca uno por zona para evitar una dependencia entre zonas. Reescribe la dirección de origen y permite respuestas, nunca conexiones entrantes nuevas."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"The same gateway, reached through the public subnet route.","es":"El mismo gateway, alcanzado por la ruta de la subred pública."}}]},{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"Package repository or public API","es":"Repositorio de paquetes o API pública"},"note":{"en":"For supported AWS services, a VPC endpoint can keep this traffic off the internet path entirely.","es":"Para los servicios AWS compatibles, un VPC endpoint puede mantener este tráfico totalmente fuera del camino por internet."}}]}]}]}]},{"id":"security-groups","parent":"vpc","title":{"en":"Security groups","es":"Security groups"},"summary":{"en":"Allow rules on associated network interfaces that automatically permit return traffic for allowed connections.","es":"Reglas de permiso en interfaces de red asociadas que permiten automáticamente la respuesta de conexiones autorizadas."},"details":{"en":["Return traffic for normally tracked allowed flows does not require a mirrored security-group rule. Groups have allow rules, not explicit denies; multiple groups combine allows. References to other groups can express tier relationships where supported. These rules do not create routes or authorize application users."],"es":["El retorno de flujos permitidos rastreados normalmente no necesita regla reflejada. Los grupos permiten, no deniegan explícitamente; varios grupos combinan permisos. Referencias a otros grupos expresan relaciones entre componentes cuando son compatibles. No crean rutas ni autorizan usuarios de aplicación."]},"aws":{"en":"Allow application inbound traffic from the ALB group on the target port, rather than from the whole Internet.","es":"Permite entrada a la aplicación desde el grupo ALB en su puerto, no desde todo Internet."},"question":{"en":"Must you open all inbound ephemeral ports for outbound connection replies?","es":"¿Debes abrir todos los puertos efímeros entrantes para las respuestas?"},"answer":{"en":"Not for normal SG connection tracking. Stateless NACLs still need appropriate return rules.","es":"No con seguimiento normal del SG. Las NACL sin estado sí necesitan reglas de retorno."},"related":["nacl","tcp","security"],"sources":[{"label":"Security groups","url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html","label":"docs.aws.amazon.com: vpc network acls"}],"level":"applied","learning":{"definition":{"en":"A security group is a stateful filter attached to a resource's network interface, controlling which traffic may reach and leave it. Rules are allow rules only, so there is no explicit deny, and when several groups are attached the effective policy is the union of their rules.","es":"Un grupo de seguridad es un filtro con estado asociado a la interfaz de red de un recurso, que controla qué tráfico puede llegar a él y salir. Solo hay reglas de permiso, así que no existe denegación explícita, y con varios grupos asociados la política efectiva es la unión de sus reglas."},"simple":{"en":"A per resource allow list that tracks connections, so the reply to traffic it already permitted returns without a second rule.","es":"Una lista de permitidos por recurso que sigue las conexiones, así que la respuesta al tráfico ya permitido vuelve sin una segunda regla."},"analogy":{"en":"Like a doorman with a guest list and a good memory, who readmits a visitor he let out without rechecking. The limitation: a doorman also governs what the visitor does inside, while a security group only decides whether packets arrive.","es":"Como un portero con lista de invitados y buena memoria, que readmite a un visitante que dejó salir sin volver a comprobar. La limitación: un portero también decide qué hace el visitante dentro, mientras que un grupo de seguridad solo decide si los paquetes llegan."},"walkthrough":{"en":["Stateful means the filter keeps a connection tracking table. AWS states that responses to a request from an instance are allowed in regardless of the inbound rules.","Inbound rules name a source, protocol and port range; outbound rules name a destination. The source can be a CIDR block, a prefix list, or another security group.","A new security group has no inbound rules, so it denies all inbound traffic, and one permissive outbound rule. It also does not filter traffic to some AWS services such as instance metadata.","Work a three tier example: the load balancer group allows inbound 443, the application group allows its port from the load balancer group, and the database group from the application group."],"es":["Con estado significa que el filtro mantiene una tabla de seguimiento de conexiones. AWS indica que las respuestas a una solicitud de la instancia entran sin importar las reglas de entrada.","Las reglas de entrada indican origen, protocolo y rango de puertos; las de salida indican destino. El origen puede ser un bloque CIDR, una lista de prefijos u otro grupo de seguridad.","Un grupo nuevo no tiene reglas de entrada, así que deniega todo lo entrante, y tiene una regla de salida permisiva. Tampoco filtra el tráfico hacia algunos servicios de AWS, como los metadatos de instancia.","Trabaja un ejemplo de tres capas: el grupo del balanceador permite la entrada por 443, el de la aplicación permite su puerto desde el del balanceador, y el de la base de datos desde el de la aplicación."]},"pitfalls":{"en":["Security groups create no routes and grant no permissions. Allowing a port does not make a destination routable, nor authorize an API call.","Because attached groups combine by union, one group allowing 0.0.0.0/0 on a wide port range overrides every tighter rule."],"es":["Los grupos de seguridad no crean rutas ni conceden permisos. Permitir un puerto no hace enrutable un destino ni autoriza una llamada de API.","Como los grupos asociados se combinan por unión, un grupo que permite 0.0.0.0/0 en un rango amplio anula toda regla más estricta."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html","label":"docs.aws.amazon.com: vpc security groups"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html","label":"docs.aws.amazon.com: vpc network acls"}]},"diagrams":[{"id":"stateful-vs-stateless","kind":"flow","nodes":["nacl","security-groups"],"title":{"en":"One exchange, two different checks","es":"Un intercambio, dos comprobaciones distintas"},"caption":{"en":"A security group is stateful, so an allowed request implies its reply. A network ACL is stateless and evaluates each direction on its own, which is why the reply to 198.51.100.10:53000 needs outbound rules that cover that port.","es":"Una security group es con estado, así que una petición permitida implica su respuesta. Una network ACL no tiene estado y evalúa cada dirección por separado, y por eso la respuesta hacia 198.51.100.10:53000 necesita reglas de salida que cubran ese puerto."},"alt":{"en":"Two flows for the same exchange between client 198.51.100.10 port 53000 and a server on port 443. Inbound: the subnet network ACL checks its inbound rules for traffic to port 443, then the instance security group checks its inbound rules, then the server accepts. Outbound reply: the security group allows the reply because it tracks the connection, but the network ACL evaluates its outbound rules again with destination port 53000, so missing rules for the ephemeral port range drop the reply, whether it is the SYN plus ACK or the response data, and the client times out.","es":"Dos flujos para el mismo intercambio entre el cliente 198.51.100.10 puerto 53000 y un servidor en el puerto 443. Entrada: la network ACL de la subred comprueba sus reglas de entrada para el tráfico al puerto 443, después la security group de la instancia comprueba sus reglas de entrada, y el servidor acepta. Respuesta de salida: la security group permite la respuesta porque sigue la conexión, pero la network ACL vuelve a evaluar sus reglas de salida con el puerto de destino 53000, así que la ausencia de reglas para el rango de puertos efímeros descarta la respuesta, sea el SYN más ACK o los datos, y el cliente agota el tiempo de espera."},"flows":[{"label":{"en":"Request: 198.51.100.10:53000 to the server on 443","es":"Petición: 198.51.100.10:53000 al servidor en 443"},"stages":[{"zone":{"en":"Subnet boundary","es":"Límite de la subred"},"items":[{"label":{"en":"Network ACL, inbound rules","es":"Network ACL, reglas de entrada"},"note":{"en":"Rules are numbered and the first match decides, allow or deny. Here the match is destination port 443.","es":"Las reglas están numeradas y decide la primera coincidencia, permitir o denegar. Aquí coincide el puerto de destino 443."}}]},{"zone":{"en":"Instance boundary","es":"Límite de la instancia"},"items":[{"label":{"en":"Security group, inbound rules","es":"Security group, reglas de entrada"},"note":{"en":"Allow rules only, evaluated together. Port 443 from the expected source is enough.","es":"Solo reglas de permiso, evaluadas en conjunto. Basta el puerto 443 desde el origen esperado."}}]},{"zone":{"en":"Workload","es":"Carga de trabajo"},"items":[{"label":{"en":"The server accepts on 443","es":"El servidor acepta en 443"},"note":{"en":"The security group now tracks this connection.","es":"La security group sigue ahora esta conexión."}}]}]},{"label":{"en":"Reply: the server answers 198.51.100.10:53000","es":"Respuesta: el servidor contesta a 198.51.100.10:53000"},"stages":[{"zone":{"en":"Instance boundary","es":"Límite de la instancia"},"items":[{"label":{"en":"Security group, allowed by state","es":"Security group, permitida por el estado"},"note":{"en":"No outbound rule for port 53000 is needed. The reply belongs to a tracked connection.","es":"No hace falta una regla de salida para el puerto 53000. La respuesta pertenece a una conexión ya registrada."}}]},{"zone":{"en":"Subnet boundary","es":"Límite de la subred"},"items":[{"label":{"en":"Network ACL, outbound rules","es":"Network ACL, reglas de salida"},"note":{"en":"Checked again, on its own. The destination port is now 53000, so the outbound rules must cover the ephemeral port range.","es":"Se comprueba de nuevo, por separado. El puerto de destino es ahora 53000, así que las reglas de salida deben cubrir el rango de puertos efímeros."}}]},{"zone":{"en":"Client","es":"Cliente"},"items":[{"label":{"en":"198.51.100.10 receives the reply, or nothing at all","es":"198.51.100.10 recibe la respuesta, o nada en absoluto"},"note":{"en":"This is the classic symptom of a stateless rule gap: the reply, whether the SYN plus ACK or the response data, is dropped on the way out and the client times out instead of being refused.","es":"Este es el síntoma clásico de una regla sin estado incompleta: la respuesta, sea el SYN más ACK o los datos, se descarta al salir y el cliente agota el tiempo de espera en vez de recibir un rechazo."}}]}]}]}]},{"id":"nacl","parent":"vpc","title":{"en":"Network ACLs: subnet traffic rules","es":"NACL: reglas de tráfico de una subred"},"summary":{"en":"A subnet-level traffic filter with allow and deny rules. Requests and replies must each be allowed.","es":"Un filtro de tráfico de subred con reglas para permitir o denegar. La petición y la respuesta necesitan permiso por separado."},"details":{"en":["A Network Access Control List (NACL) checks traffic entering or leaving an associated subnet, using IP ranges, protocols and, for TCP or UDP, destination ports. Each subnet has one NACL at a time; the same NACL can be associated with several subnets. It does not filter traffic between resources within the same subnet.","Inbound and outbound rules are separate. In each direction AWS evaluates the lowest rule number first and stops at the first match. If nothing matches, the final * rule denies the packet. The default NACL initially allows traffic; a newly created custom NACL initially denies it until you add allow rules.","A NACL is stateless: it does not remember that a connection was allowed. A Security Group is stateful and automatically allows response traffic for a permitted connection. Security Groups attach to network interfaces and contain allow rules only; NACLs provide additional subnet-level rules and can explicitly deny traffic."],"es":["Una Network Access Control List (NACL), o lista de control de acceso de red, revisa el tráfico que entra o sale de una subred asociada. Filtra por rangos IP, protocolo y, para TCP o UDP, puertos de destino. Cada subred tiene una NACL a la vez, aunque una misma NACL puede asociarse a varias subredes. No filtra el tráfico entre recursos de la misma subred.","Las reglas de entrada y salida son independientes. En cada sentido, AWS empieza por el número de regla más bajo y aplica la primera coincidencia. Si ninguna regla coincide, la regla final * deniega el paquete. La NACL predeterminada permite inicialmente el tráfico; una NACL personalizada recién creada lo deniega hasta que añades permisos.","Una NACL es stateless, es decir, no recuerda que una conexión haya sido permitida. Un Security Group es stateful y permite automáticamente la respuesta de una conexión autorizada. Los Security Groups se asocian a interfaces de red y solo incluyen permisos; las NACL añaden reglas a nivel de subred y también pueden denegar tráfico expresamente."]},"aws":{"en":"For a direct TCP connection, client 198.51.100.10:53000 contacts a server on port 443. At the server subnet, the request needs an inbound NACL rule for destination port 443; the reply needs an outbound rule to the client IP with destination port 53000. This temporary client port is an ephemeral port. Use the range required by actual clients and intermediaries, not one example port as a production policy.","es":"En una conexión TCP directa, el cliente 198.51.100.10:53000 contacta con un servidor en el puerto 443. En la subred del servidor, la petición necesita una regla de entrada para el puerto de destino 443; la respuesta necesita una regla de salida hacia la IP del cliente y su puerto de destino 53000. Ese puerto temporal del cliente se llama efímero. En producción, usa el rango necesario para los clientes e intermediarios reales, no solo el puerto del ejemplo."},"question":{"en":"The Security Group allows HTTPS and the NACL allows inbound TCP 443, but the connection times out. What would you check?","es":"El Security Group permite HTTPS y la NACL permite TCP 443 de entrada, pero la conexión agota el tiempo de espera. ¿Qué comprobarías?"},"answer":{"en":"Check the actual request and reply path, including both subnet NACLs if applicable. For a direct inbound HTTPS connection, the server reply targets the client ephemeral port, not destination port 443. Verify outbound allow rules, whether a lower-numbered deny wins first, and any NAT or load-balancer hop that changes the flow. A permitted Security Group connection does not override a blocking NACL. Also verify routes and the listening service rather than assuming the NACL must be the cause.","es":"Comprueba el recorrido real de petición y respuesta, incluidas las NACL de ambas subredes cuando corresponda. En una conexión HTTPS entrante directa, la respuesta del servidor va al puerto efímero del cliente, no al puerto de destino 443. Revisa permisos de salida, si una denegación con número menor se aplica antes y si un NAT o balanceador cambia el flujo. El permiso del Security Group no anula un bloqueo de la NACL. Verifica también rutas y servicio de destino, sin dar por hecho que la causa sea la NACL."},"related":["security-groups","tcp","troubleshooting"],"sources":[{"label":"AWS VPC: network ACL behavior and scope","url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html"},{"label":"AWS VPC: custom NACL examples and ephemeral ports","url":"https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html"}],"level":"applied","learning":{"definition":{"en":"A Network Access Control List, abbreviated NACL, filters traffic at the boundary of a subnet, using IP ranges, protocol and, for TCP or UDP, destination port. Unlike a security group it can deny as well as allow, and it is stateless, so it does not remember an allowed connection.","es":"Una Network Access Control List, abreviada NACL, filtra el tráfico en el límite de una subred, usando rangos IP, protocolo y, para TCP o UDP, puerto de destino. A diferencia de un grupo de seguridad puede denegar además de permitir, y es sin estado, así que no recuerda una conexión permitida."},"simple":{"en":"A numbered checklist at the edge of a subnet. It allows or denies each packet in each direction, and remembers nothing afterwards.","es":"Una lista de comprobación numerada en el borde de una subred. Permite o deniega cada paquete, y después no recuerda nada."},"analogy":{"en":"A guard at the neighbourhood gate working from a numbered list, stopping at the first line that applies, with no memory, so going out and coming back each need a line. The limitation: the guard sees only addresses and ports, never intent.","es":"Un guardia en la puerta del barrio con una lista numerada, que se detiene en la primera línea que aplica y no tiene memoria, así que salir y volver necesitan su línea. La limitación: solo ve direcciones y puertos, nunca la intención."},"walkthrough":{"en":["A NACL is associated with subnets, not resources. Each subnet has one at a time, and one NACL can serve several subnets. It does not filter traffic between resources inside the same subnet.","Inbound and outbound are separate lists. In each direction AWS applies the first match from the lowest rule number, so a low numbered deny beats a higher allow. If nothing matches, the asterisk rule denies.","The two baselines differ. The default NACL initially allows all traffic, while a custom NACL you create denies everything until you add allow rules, subject to the documented service exceptions.","Worked example: client 198.51.100.10 port 53000 connects to a server on 443. The server subnet needs an inbound rule for port 443 and an outbound rule to that client's ephemeral port 53000."],"es":["Una NACL se asocia a subredes, no a recursos. Cada subred tiene una a la vez, y una NACL puede servir a varias subredes. No filtra el tráfico entre recursos dentro de la misma subred.","Entrada y salida son listas separadas. En cada sentido AWS aplica la primera coincidencia desde el número más bajo, así que una denegación baja gana a un permiso más alto. Si nada coincide, la regla con asterisco deniega.","Los dos puntos de partida difieren. La NACL predeterminada permite inicialmente todo el tráfico, mientras que una NACL personalizada que creas deniega todo hasta que añades permisos, salvo las excepciones de servicio documentadas.","Ejemplo trabajado: el cliente 198.51.100.10 con puerto 53000 conecta a un servidor en 443. La subred del servidor necesita una regla de entrada para el puerto 443 y una de salida al puerto efímero 53000 del cliente."]},"pitfalls":{"en":["Allowing the server port in one direction only is the classic failure. Without the matching outbound rule the connection hangs and times out.","Use security groups as the primary control and the NACL as a coarse guardrail. AWS documents traffic a NACL cannot block at all."],"es":["Permitir el puerto del servidor en un solo sentido es el fallo clásico. Sin la regla de salida correspondiente, la conexión se cuelga y expira.","Usa los grupos de seguridad como control principal y la NACL como barrera general. AWS documenta tráfico que una NACL no puede bloquear."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html","label":"docs.aws.amazon.com: vpc network acls"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html","label":"docs.aws.amazon.com: custom network acl"}]},"diagrams":[{"id":"stateful-vs-stateless","kind":"flow","nodes":["nacl","security-groups"],"title":{"en":"One exchange, two different checks","es":"Un intercambio, dos comprobaciones distintas"},"caption":{"en":"A security group is stateful, so an allowed request implies its reply. A network ACL is stateless and evaluates each direction on its own, which is why the reply to 198.51.100.10:53000 needs outbound rules that cover that port.","es":"Una security group es con estado, así que una petición permitida implica su respuesta. Una network ACL no tiene estado y evalúa cada dirección por separado, y por eso la respuesta hacia 198.51.100.10:53000 necesita reglas de salida que cubran ese puerto."},"alt":{"en":"Two flows for the same exchange between client 198.51.100.10 port 53000 and a server on port 443. Inbound: the subnet network ACL checks its inbound rules for traffic to port 443, then the instance security group checks its inbound rules, then the server accepts. Outbound reply: the security group allows the reply because it tracks the connection, but the network ACL evaluates its outbound rules again with destination port 53000, so missing rules for the ephemeral port range drop the reply, whether it is the SYN plus ACK or the response data, and the client times out.","es":"Dos flujos para el mismo intercambio entre el cliente 198.51.100.10 puerto 53000 y un servidor en el puerto 443. Entrada: la network ACL de la subred comprueba sus reglas de entrada para el tráfico al puerto 443, después la security group de la instancia comprueba sus reglas de entrada, y el servidor acepta. Respuesta de salida: la security group permite la respuesta porque sigue la conexión, pero la network ACL vuelve a evaluar sus reglas de salida con el puerto de destino 53000, así que la ausencia de reglas para el rango de puertos efímeros descarta la respuesta, sea el SYN más ACK o los datos, y el cliente agota el tiempo de espera."},"flows":[{"label":{"en":"Request: 198.51.100.10:53000 to the server on 443","es":"Petición: 198.51.100.10:53000 al servidor en 443"},"stages":[{"zone":{"en":"Subnet boundary","es":"Límite de la subred"},"items":[{"label":{"en":"Network ACL, inbound rules","es":"Network ACL, reglas de entrada"},"note":{"en":"Rules are numbered and the first match decides, allow or deny. Here the match is destination port 443.","es":"Las reglas están numeradas y decide la primera coincidencia, permitir o denegar. Aquí coincide el puerto de destino 443."}}]},{"zone":{"en":"Instance boundary","es":"Límite de la instancia"},"items":[{"label":{"en":"Security group, inbound rules","es":"Security group, reglas de entrada"},"note":{"en":"Allow rules only, evaluated together. Port 443 from the expected source is enough.","es":"Solo reglas de permiso, evaluadas en conjunto. Basta el puerto 443 desde el origen esperado."}}]},{"zone":{"en":"Workload","es":"Carga de trabajo"},"items":[{"label":{"en":"The server accepts on 443","es":"El servidor acepta en 443"},"note":{"en":"The security group now tracks this connection.","es":"La security group sigue ahora esta conexión."}}]}]},{"label":{"en":"Reply: the server answers 198.51.100.10:53000","es":"Respuesta: el servidor contesta a 198.51.100.10:53000"},"stages":[{"zone":{"en":"Instance boundary","es":"Límite de la instancia"},"items":[{"label":{"en":"Security group, allowed by state","es":"Security group, permitida por el estado"},"note":{"en":"No outbound rule for port 53000 is needed. The reply belongs to a tracked connection.","es":"No hace falta una regla de salida para el puerto 53000. La respuesta pertenece a una conexión ya registrada."}}]},{"zone":{"en":"Subnet boundary","es":"Límite de la subred"},"items":[{"label":{"en":"Network ACL, outbound rules","es":"Network ACL, reglas de salida"},"note":{"en":"Checked again, on its own. The destination port is now 53000, so the outbound rules must cover the ephemeral port range.","es":"Se comprueba de nuevo, por separado. El puerto de destino es ahora 53000, así que las reglas de salida deben cubrir el rango de puertos efímeros."}}]},{"zone":{"en":"Client","es":"Cliente"},"items":[{"label":{"en":"198.51.100.10 receives the reply, or nothing at all","es":"198.51.100.10 recibe la respuesta, o nada en absoluto"},"note":{"en":"This is the classic symptom of a stateless rule gap: the reply, whether the SYN plus ACK or the response data, is dropped on the way out and the client times out instead of being refused.","es":"Este es el síntoma clásico de una regla sin estado incompleta: la respuesta, sea el SYN más ACK o los datos, se descarta al salir y el cliente agota el tiempo de espera en vez de recibir un rechazo."}}]}]}]}]},{"id":"nat-egress","parent":"vpc","title":{"en":"NAT and outbound connectivity","es":"NAT y conectividad saliente"},"summary":{"en":"Translate network addresses for outbound access, then choose a resilient implementation.","es":"Traduce direcciones de red para permitir la salida y elige después una implementación resiliente."},"details":{"en":["NAT translates addresses and ports; it does not replace authorization or malware controls. Zonal public NAT uses a public subnet and often one gateway per AZ for resilience. Regional NAT supports automatic multi-AZ expansion without a hosting public subnet; it currently does not support private NAT. Expansion is not instantaneous."],"es":["NAT traduce direcciones y puertos; no sustituye autorización ni controles de malware. NAT público zonal usa subred pública y suele desplegarse por AZ. NAT regional permite expansión multi-AZ automática sin subred pública de alojamiento; actualmente no admite NAT privado. La expansión no es instantánea."]},"aws":{"en":"Native IPv6 outbound-only access can use an egress-only Internet Gateway, which does not do IPv4-style address translation.","es":"La salida exclusiva IPv6 nativa puede usar egress-only Internet Gateway, sin traducción como IPv4."},"question":{"en":"Is one NAT gateway always a single-AZ dependency?","es":"¿Un NAT gateway siempre depende de una sola AZ?"},"answer":{"en":"No. Distinguish regional and zonal availability modes. Validate support, expansion and pricing; private NAT requires zonal mode.","es":"No. Distingue modos regional y zonal. Valida soporte, expansión y precios; NAT privado requiere modo zonal."},"related":["public-private","ipv6","private-connectivity"],"sources":[{"label":"Regional NAT gateways","url":"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html","label":"docs.aws.amazon.com: vpc nat gateway"}],"level":"applied","learning":{"definition":{"en":"Network address translation, abbreviated NAT, rewrites addresses and ports in packet headers. It can translate the source, the destination, or both. A NAT gateway is the AWS managed service for the outbound case, letting instances in private subnets reach services outside the VPC while connections must always start inside the VPC.","es":"La traducción de direcciones de red, abreviada NAT, reescribe direcciones y puertos en las cabeceras de los paquetes. Puede traducir el origen, el destino o ambos. Una NAT gateway es el servicio gestionado de AWS para el caso de salida, y permite que instancias en subredes privadas alcancen servicios fuera de la VPC, mientras las conexiones siempre deben iniciarse dentro."},"simple":{"en":"The AWS NAT gateway is a one way door for outbound traffic. Private machines reach out, and nothing outside starts a connection inward.","es":"La NAT gateway de AWS es una puerta de un sentido para el tráfico de salida. Las máquinas privadas salen, y nada de fuera inicia una conexión hacia dentro."},"analogy":{"en":"A hotel switchboard: guests dial out, the world sees one number, and the board remembers which room made which call. The limitation: an operator can hear the conversation, while a NAT gateway inspects nothing and is not a firewall.","es":"La centralita de un hotel: los huéspedes llaman fuera, el mundo ve un número y la centralita recuerda qué habitación llamó. La limitación: un operador puede oír la conversación, mientras que una NAT gateway no inspecciona nada y no es un cortafuegos."},"walkthrough":{"en":["In the AWS outbound pattern, source address and port mappings identify each flow so replies can be translated back. Outside hosts cannot initiate new connections through that mapping; this does not replace an egress security policy.","Connectivity type comes first. A zonal public NAT gateway needs an Elastic IP address and a public subnet, routing on to the internet gateway. A private NAT gateway has neither and reaches other VPCs or on premises networks.","Availability mode is a separate choice. A zonal gateway lives in one Availability Zone, so the resilient pattern is one per zone. A regional gateway needs no public subnet, and expands across zones automatically only in automatic mode.","Verify before claiming resilience. AWS states regional expansion into a new zone can take 60 minutes, regional does not support private NAT, and converting from zonal resets connections. An S3 gateway endpoint can remove that traffic."],"es":["En el patrón de salida de AWS, las correspondencias de dirección y puerto de origen identifican cada flujo para traducir las respuestas. Los hosts externos no pueden iniciar conexiones nuevas por esa correspondencia; esto no sustituye una política de seguridad de salida.","El tipo de conectividad va primero. Una NAT gateway pública zonal necesita una Elastic IP y una subred pública, y enruta a la pasarela de internet. Una privada no tiene ninguna y alcanza otras VPC o redes locales.","El modo de disponibilidad es una elección aparte. Una pasarela zonal vive en una zona, así que el patrón resiliente es una por zona. Una regional no necesita subred pública, y se expande entre zonas sola solo en modo automático.","Verifica antes de afirmar resiliencia. AWS indica que la expansión regional a una zona nueva puede tardar 60 minutos, que regional no admite NAT privada, y que convertir desde zonal reinicia conexiones."]},"pitfalls":{"en":["NAT is not authorization and not inspection. It hides the private source address but forwards outbound traffic from a compromised host quite happily.","Do not say a NAT gateway is always a single zone dependency. That holds for zonal mode only, and regional omits private NAT."],"es":["NAT no es autorización ni inspección. Oculta la dirección privada de origen, pero reenvía sin problema el tráfico de salida de un host comprometido.","No digas que una NAT gateway es siempre una dependencia de una zona. Eso vale solo en modo zonal, y regional omite NAT privada."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html","label":"docs.aws.amazon.com: vpc nat gateway"},{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html","label":"docs.aws.amazon.com: nat gateways regional"}]},"diagrams":[{"id":"vpc-path","kind":"flow","nodes":["public-private","nat-egress","vpc"],"title":{"en":"Public entry, private workload, controlled exit","es":"Entrada pública, carga privada, salida controlada"},"caption":{"en":"What makes a subnet public is its route table, not its name. Inbound and outbound are separate designs, so they are drawn separately. This example uses a zonal public NAT gateway; a NAT gateway can also be configured as private, and other designs place one per zone or route through a shared one.","es":"Lo que hace pública a una subred es su tabla de rutas, no su nombre. La entrada y la salida son diseños distintos, así que se dibujan por separado. Este ejemplo usa un NAT gateway público zonal; un NAT gateway también puede configurarse como privado, y otros diseños colocan uno por zona o enrutan por uno compartido."},"alt":{"en":"Two flows. Inbound: a user on the internet reaches an internet gateway, then a load balancer in a public subnet, then application instances in a private subnet, then a database. Outbound: a private instance reaches a public NAT gateway in the public subnet, then the internet gateway, then the internet. Notes state that the load balancer security group allows 443 inbound and must also allow egress to the application port, and that the private subnet has no route to the internet gateway.","es":"Dos flujos. Entrada: un usuario de internet llega a un internet gateway, luego a un balanceador en una subred pública, luego a las instancias de aplicación en una subred privada, y luego a una base de datos. Salida: una instancia privada llega a un NAT gateway público en la subred pública, luego al internet gateway y luego a internet. Las notas indican que la security group del balanceador permite 443 de entrada y debe permitir también la salida al puerto de la aplicación, y que la subred privada no tiene ruta al internet gateway."},"flows":[{"label":{"en":"Inbound request","es":"Petición entrante"},"stages":[{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"User","es":"Usuario"},"note":{"en":"Resolves a public name to the load balancer address.","es":"Resuelve un nombre público a la dirección del balanceador."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"One per VPC. Only subnets whose route table points at it are public.","es":"Uno por VPC. Solo son públicas las subredes cuya tabla de rutas apunta a él."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Load balancer","es":"Balanceador de carga"},"note":{"en":"Its security group allows 443 inbound from the internet, and its egress rules must allow the application port towards the targets.","es":"Su security group permite 443 de entrada desde internet, y sus reglas de salida deben permitir el puerto de la aplicación hacia los destinos."}}]},{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Inbound allowed only from the load balancer security group, on the application port.","es":"Entrada permitida solo desde la security group del balanceador, en el puerto de la aplicación."}},{"label":{"en":"Database","es":"Base de datos"},"note":{"en":"Reachable only from the application security group, on one port.","es":"Alcanzable solo desde la security group de la aplicación, en un puerto."}}]}]},{"label":{"en":"Outbound update from a private instance","es":"Salida de una instancia privada"},"stages":[{"zone":{"en":"Private subnet","es":"Subred privada"},"items":[{"label":{"en":"Application instance","es":"Instancia de aplicación"},"note":{"en":"Its default route points at the NAT gateway. There is no route to the internet gateway.","es":"Su ruta por defecto apunta al NAT gateway. No hay ruta al internet gateway."}}]},{"zone":{"en":"Public subnet","es":"Subred pública"},"items":[{"label":{"en":"Public NAT gateway","es":"NAT gateway público"},"note":{"en":"It lives in one Availability Zone, so place one per zone to avoid a cross-zone dependency. It rewrites the source address and allows replies, never new inbound connections.","es":"Vive en una sola zona de disponibilidad, así que coloca uno por zona para evitar una dependencia entre zonas. Reescribe la dirección de origen y permite respuestas, nunca conexiones entrantes nuevas."}}]},{"zone":{"en":"VPC edge","es":"Borde de la VPC"},"items":[{"label":{"en":"Internet gateway","es":"Internet gateway"},"note":{"en":"The same gateway, reached through the public subnet route.","es":"El mismo gateway, alcanzado por la ruta de la subred pública."}}]},{"zone":{"en":"Internet","es":"Internet"},"items":[{"label":{"en":"Package repository or public API","es":"Repositorio de paquetes o API pública"},"note":{"en":"For supported AWS services, a VPC endpoint can keep this traffic off the internet path entirely.","es":"Para los servicios AWS compatibles, un VPC endpoint puede mantener este tráfico totalmente fuera del camino por internet."}}]}]}]}]},{"id":"load-balancing","parent":"vpc","title":{"en":"ALB versus NLB","es":"ALB frente a NLB"},"summary":{"en":"Distribute connections or requests across targets, choosing protocol behavior before the service.","es":"Reparte conexiones o peticiones entre destinos y elige el comportamiento del protocolo antes del servicio."},"details":{"en":["ALB understands HTTP and supports host/path routing. NLB balances supported transport protocols and offers static addresses per AZ, with Elastic IP options for internet-facing configurations. Both require useful health checks and reachable targets. An open TCP port does not prove a business transaction will succeed. TLS termination and pass-through differ."],"es":["ALB interpreta HTTP y enruta por host/path. NLB balancea protocolos de transporte compatibles y ofrece IP estáticas por AZ, con opciones Elastic IP de cara a Internet. Ambos requieren health checks útiles y destinos accesibles. Un puerto abierto no prueba que funcione una transacción. Terminar TLS y dejarlo pasar difieren."]},"aws":{"en":"Use ALB for typical HTTP path routing; consider NLB for supported non-HTTP protocols or specific static-address requirements.","es":"Usa ALB para rutas HTTP típicas; considera NLB para protocolos no HTTP compatibles o requisitos de IP estática."},"question":{"en":"Should you choose NLB only because someone calls it faster?","es":"¿Debes elegir NLB solo porque alguien lo considera más rápido?"},"answer":{"en":"First identify protocols, routing, client-address and TLS requirements; then benchmark. Missing features are not fixed by low latency.","es":"Identifica protocolos, rutas, IP cliente y TLS; después mide. La baja latencia no compensa funciones ausentes."},"related":["osi-4","osi-7","http","tls","security-groups"],"sources":[{"label":"Application Load Balancer","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html"},{"label":"Network Load Balancer","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html"},{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html","label":"docs.aws.amazon.com: target group health checks"}],"level":"applied","learning":{"definition":{"en":"A load balancer is a single point of contact for clients that spreads incoming traffic across registered targets in one or more Availability Zones and monitors their health. An Application Load Balancer understands HTTP and routes on request content. A Network Load Balancer works at the transport layer without interpreting the application protocol.","es":"Un balanceador de carga es un punto único de contacto que reparte el tráfico entrante entre destinos registrados en una o más zonas de disponibilidad y supervisa su salud. Un Application Load Balancer entiende HTTP y enruta según el contenido de la solicitud. Un Network Load Balancer trabaja en la capa de transporte sin interpretar el protocolo de aplicación."},"simple":{"en":"One front door spreading requests over many servers. One kind reads the request, and the other just forwards the connection.","es":"Una puerta de entrada que reparte solicitudes entre muchos servidores. Un tipo lee la solicitud, el otro reenvía la conexión."},"analogy":{"en":"A receptionist who reads your form and directs you is the Application Load Balancer; a turnstile sending you to the next free counter is the Network Load Balancer. The limitation: a balancer only knows what its health check measures.","es":"Un recepcionista que lee tu formulario y te dirige es el Application Load Balancer; un torno que te manda al siguiente puesto libre es el Network Load Balancer. La limitación: un balanceador solo sabe lo que mide su comprobación de salud."},"walkthrough":{"en":["For AWS Application and Network Load Balancers, distinguish three components: a listener, which is a protocol and port it watches; a target group with its own protocol and port; and a health check per target group.","Describe the types by capability. A layer 7 balancer parses the application protocol, so it routes on host, path or header and can terminate TLS. A layer 4 balancer acts on the connection and stays transparent.","In AWS, Application Load Balancer listener rules evaluate in priority order from the lowest number, with a default rule. Network Load Balancer target groups support TCP, UDP, TCP_UDP, TLS, QUIC and TCP_QUIC.","Decide by protocol first, then measure. Verify with a real request, not a port scan, because an open port only proves something accepted a connection. Read the status, target health and access logs."],"es":["En los Application y Network Load Balancers de AWS, distingue tres componentes: un listener, que es un protocolo y un puerto que vigila; un grupo de destino con su propio protocolo y puerto; y una comprobación de salud por grupo.","Describe los tipos por capacidad. Un balanceador de capa 7 analiza el protocolo de aplicación, así que enruta por host, ruta o cabecera y puede terminar TLS. Un balanceador de capa 4 actúa sobre la conexión y es transparente.","En AWS, las reglas de listener del Application Load Balancer se evalúan por prioridad desde el número más bajo, con una regla predeterminada. Los grupos de destino del Network Load Balancer admiten TCP, UDP, TCP_UDP, TLS, QUIC y TCP_QUIC.","Decide primero por protocolo y después mide. Verifica con una solicitud real, no con un escaneo de puertos, porque un puerto abierto solo prueba que algo aceptó una conexión. Lee el estado, la salud y los registros."]},"pitfalls":{"en":["A healthy target is not a working application. A shallow health check on a static path reports success while a dependency is failing.","Health checks are not an absolute gate. When every target in a group is unhealthy, Elastic Load Balancing fails open to all of them."],"es":["Un destino sano no es una aplicación que funciona. Una comprobación superficial en una ruta estática informa de éxito mientras falla una dependencia.","Las comprobaciones no son una barrera absoluta. Cuando todos los destinos de un grupo están no sanos, Elastic Load Balancing falla en abierto hacia todos."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html","label":"docs.aws.amazon.com: introduction"},{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html","label":"docs.aws.amazon.com: introduction"},{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html","label":"docs.aws.amazon.com: target group health checks"}]}},{"id":"cidr-overlap","parent":"vpc","title":{"en":"Overlapping networks","es":"Redes solapadas"},"summary":{"en":"Why overlapping address ranges complicate connecting two networks.","es":"Por qué los rangos de direcciones solapados complican la conexión de dos redes."},"details":{"en":["Different organizations can use identical private ranges. Connecting them makes destination routing ambiguous. VPC peering rejects overlapping CIDRs, and a transit hub does not magically solve overlap. Ask whether the goal is whole-network connectivity or access to one service."],"es":["Organizaciones distintas pueden usar rangos privados iguales. Conectarlas hace ambiguo el enrutamiento por destino. Peering rechaza CIDR solapados y un hub de tránsito no los resuelve mágicamente. Pregunta si se necesita conectividad completa o un servicio."]},"aws":{"en":"PrivateLink can expose a service without full routability between address spaces. Renumbering is often cleaner for long-term full connectivity.","es":"PrivateLink expone servicios sin enrutamiento completo entre espacios. Renumerar suele ser más limpio a largo plazo para conectividad total."},"question":{"en":"Both sites use 10.0.0.0/16. Is Transit Gateway alone enough?","es":"¿Basta Transit Gateway si ambas sedes usan 10.0.0.0/16?"},"answer":{"en":"No. Clarify flows, then consider renumbering, service endpoints or carefully designed NAT and its operating cost.","es":"No. Aclara flujos y considera renumeración, endpoints de servicio o NAT cuidadosamente diseñado con su coste operativo."},"related":["cidr","private-connectivity","hybrid"],"sources":[{"label":"VPC peering limitations","url":"https://docs.aws.amazon.com/vpc/latest/peering/invalid-peering-configurations.html"},{"label":"AWS PrivateLink concepts","url":"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html","label":"docs.aws.amazon.com: vpc peering basics"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}],"level":"applied","learning":{"definition":{"en":"Overlapping networks means two networks use the same address range, wholly or partly. Private ranges defined by RFC 1918 are reusable by anyone, so duplication is common and not a fault in itself. It becomes a problem when you connect the networks, because one prefix then describes two different destinations.","es":"Redes solapadas significa que dos redes usan el mismo rango de direcciones, total o parcialmente. Los rangos privados de RFC 1918 puede reutilizarlos cualquiera, así que la duplicación es habitual y no es un fallo en sí. Se vuelve problema al conectar las redes, porque un prefijo describe entonces dos destinos distintos."},"simple":{"en":"Two networks using the same addresses cannot be routed unambiguously. You need renumbering, address translation, or a service endpoint instead of routing.","es":"Dos redes que usan las mismas direcciones no pueden enrutarse sin ambigüedad. Necesitas renumerar, traducir direcciones o usar un punto de enlace de servicio en lugar de enrutar."},"analogy":{"en":"Merging two towns that each have a Main Street number 10 makes that address undeliverable. The limitation: a town is renamed with a sign, while renumbering a network also touches firewall rules, certificates, monitoring and hard coded references.","es":"Fusionar dos pueblos que tienen cada uno una calle Mayor número 10 hace esa dirección inentregable. La limitación: un pueblo se renombra con un cartel, mientras que renumerar una red toca además reglas de cortafuegos, certificados, supervisión y referencias fijas."},"walkthrough":{"en":["A router forwards by matching the destination against its route table and choosing the most specific entry. If one prefix is reachable through two next hops into two different networks, the result is ambiguity, which no filter rule can resolve.","The remedies differ in cost. Renumbering one side is the cleanest option for full connectivity. Publishing one service avoids routing between the spaces. Layered translation hides one side and adds a component to operate.","In AWS a peering connection is refused when the accepter VPC overlaps the requester, and peering is not transitive. A transit gateway centralises attachments, and it does not disambiguate duplicate prefixes.","Choose from the requirement. If one team needs one service, use AWS PrivateLink, since the consumer gets a private address in its own VPC. If two estates must interoperate, plan renumbering, and prevent recurrence with Amazon VPC IP Address Manager."],"es":["Un enrutador reenvía comparando el destino con su tabla de rutas y eligiendo la entrada más específica. Si un prefijo es alcanzable por dos saltos hacia dos redes distintas, el resultado es ambigüedad, que ninguna regla de filtro resuelve.","Los remedios difieren en coste. Renumerar un lado es la opción más limpia para conectividad completa. Publicar un servicio evita enrutar entre los espacios. La traducción en capas oculta un lado y añade un componente que operar.","En AWS una conexión de emparejamiento se rechaza cuando la VPC que acepta se solapa con la solicitante, y el emparejamiento no es transitivo. Una pasarela de tránsito centraliza adjuntos, y no desambigua prefijos duplicados.","Elige según el requisito. Si un equipo necesita un servicio, usa AWS PrivateLink, ya que el consumidor obtiene una dirección privada en su VPC. Si dos parques deben interoperar, planifica renumerar."]},"pitfalls":{"en":["Overlap is not all or nothing. Often only one subnet collides, so inventory both address plans and find the exact prefixes before sizing the work.","A transit gateway does not fix overlap. It gives a scalable hub and route segmentation, and two identical prefixes attached to it remain ambiguous."],"es":["El solapamiento no es todo o nada. A menudo solo choca una subred, así que inventaría los dos planes y localiza los prefijos exactos.","Una pasarela de tránsito no arregla el solapamiento. Da un concentrador escalable, y dos prefijos idénticos conectados a ella siguen siendo ambiguos."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html","label":"docs.aws.amazon.com: vpc peering basics"},{"url":"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html","label":"docs.aws.amazon.com: concepts"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}]}},{"id":"hybrid","parent":"networking","title":{"en":"Hybrid and private connectivity","es":"Conectividad híbrida y privada"},"summary":{"en":"Connect on-premises networks and cloud networks with clear routing, security and recovery plans.","es":"Conecta redes locales y de nube con planes claros de rutas, seguridad y recuperación."},"details":{"en":["Separate physical connection, encryption, routing and DNS. Dedicated connectivity is not automatically encrypted. VPC peering is not transitive. Transit architectures require segmentation and route-table choices. Capacity, recovery requirements and ownership determine whether one path is enough."],"es":["Separa conexión física, cifrado, rutas y DNS. Una conexión dedicada no implica cifrado. Peering no es transitivo. Las arquitecturas de tránsito requieren segmentación y tablas. Capacidad, recuperación y responsabilidades determinan si basta una ruta."]},"aws":{"en":"Compare Direct Connect and VPN, then decide if Transit Gateway is needed for scalable routed connectivity.","es":"Compara Direct Connect y VPN y decide si Transit Gateway es necesario para enrutamiento escalable."},"question":{"en":"What do you ask before connecting a data center?","es":"¿Qué preguntas antes de conectar un centro de datos?"},"answer":{"en":"Clarify volume, latency, encryption, overlap, availability, DNS and ownership. Use those requirements to choose and test paths.","es":"Aclara volumen, latencia, cifrado, solapamientos, disponibilidad, DNS y responsables. Elige y prueba rutas con esos requisitos."},"related":["vpc","dns","architecture"],"sources":[{"label":"AWS Direct Connect","url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html"},{"label":"AWS Site-to-Site VPN","url":"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}],"level":"applied","learning":{"definition":{"en":"Hybrid connectivity means joining a network you own, usually a data centre or office, to networks and services in AWS. Private connectivity means reaching a service without exposing it on the public internet. A complete design answers four separate questions: the path, the encryption, the routing, and the name resolution.","es":"La conectividad híbrida consiste en unir una red propia, normalmente un centro de datos u oficina, con redes y servicios de AWS. La conectividad privada consiste en alcanzar un servicio sin exponerlo en internet público. Un diseño completo responde a cuatro preguntas: el camino, el cifrado, el enrutamiento y la resolución de nombres."},"simple":{"en":"Connecting your own network to AWS. Treat the path, the encryption, the routing and the naming as four separate choices.","es":"Conectar tu propia red con AWS. Trata el camino, el cifrado, el enrutamiento y los nombres como cuatro elecciones separadas."},"analogy":{"en":"Shipping between two warehouses: the route, the sealed container, the paperwork and the address book are four decisions. The limitation: a container is sealed or not, while encryption applies per segment.","es":"Enviar entre dos almacenes: la ruta, el contenedor sellado, el papeleo y la guía de direcciones son cuatro decisiones. La limitación: un contenedor está sellado o no, mientras que el cifrado se aplica por segmento."},"walkthrough":{"en":["Keep the four layers apart. Path is which wire or tunnel carries traffic. Encryption is who can read it. Routing is how each side learns the other's prefixes. Naming is what a hostname resolves to.","Site to Site VPN builds IPsec tunnels over the internet and is quick to provision. AWS Direct Connect gives a dedicated link into AWS. AWS PrivateLink publishes one service rather than joining networks.","A transit gateway is not a connection but a hub interconnecting VPCs and on premises networks. It exists because VPC peering is one to one and not transitive, so a mesh grows unmanageably.","Decide from requirements. Predictable capacity points to Direct Connect; speed of delivery and modest bandwidth point to VPN. Then verify under failure: confirm the backup path carries full production load and that names still resolve privately after failover."],"es":["Mantén las cuatro capas separadas. El camino es qué cable o túnel lleva el tráfico. El cifrado es quién puede leerlo. El enrutamiento es cómo cada lado aprende los prefijos del otro. Los nombres son a qué resuelve un host.","Site to Site VPN construye túneles IPsec por internet y se aprovisiona rápido. AWS Direct Connect da un enlace dedicado hacia AWS. AWS PrivateLink publica un servicio en lugar de unir redes.","Una pasarela de tránsito no es una conexión sino un concentrador que interconecta VPC y redes locales. Existe porque el emparejamiento de VPC es uno a uno y no transitivo, así que una malla crece sin control.","Decide según requisitos. La capacidad previsible apunta a Direct Connect; la rapidez y un ancho de banda modesto apuntan a VPN. Después verifica ante fallos que el respaldo soporta la carga completa."]},"pitfalls":{"en":["Dedicated does not mean encrypted. A private circuit changes who carries the packets, not who can read them, so add encryption explicitly when required.","VPC peering is not transitive, so a hub built from peerings does not behave like a hub. Discovering this late forces a redesign."],"es":["Dedicado no significa cifrado. Un circuito privado cambia quién transporta los paquetes, no quién puede leerlos, así que añade cifrado explícito cuando se exija.","El emparejamiento de VPC no es transitivo, así que un concentrador hecho de emparejamientos no se comporta como tal. Descubrirlo tarde fuerza un rediseño."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html","label":"docs.aws.amazon.com: VPC VPN"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}]}},{"id":"direct-connect","parent":"hybrid","title":{"en":"Direct Connect","es":"Direct Connect"},"summary":{"en":"Private connectivity to AWS that still needs redundancy and a separate encryption decision.","es":"Conectividad privada con AWS que sigue necesitando redundancia y una decisión de cifrado."},"details":{"en":["Direct Connect reaches AWS through supported locations and virtual interfaces. It can make network behavior more predictable than Internet paths, but does not alone guarantee latency or encrypt all traffic. Provisioning time and physical diversity matter. A backup path must carry recovery load, not merely establish a tunnel."],"es":["Direct Connect alcanza AWS mediante ubicaciones e interfaces virtuales compatibles. Puede ofrecer comportamiento más predecible que Internet, sin garantizar por sí solo latencia o cifrado. Importan plazos y diversidad física. El respaldo debe soportar la carga, no solo levantar un túnel."]},"aws":{"en":"Evaluate supported MACsec configurations or IPsec overlays when encryption is required. Validate exact support.","es":"Evalúa MACsec compatible o capas IPsec si necesitas cifrado. Valida el soporte exacto."},"question":{"en":"Does a private circuit automatically mean encrypted traffic?","es":"¿Circuito privado significa automáticamente tráfico cifrado?"},"answer":{"en":"No. Path privacy and cryptography are distinct. State where encryption begins and ends and what protects each segment.","es":"No. Privacidad de ruta y criptografía son distintas. Define dónde empieza y acaba el cifrado y qué protege cada segmento."},"related":["physical-links","vpn","bgp","encryption"],"sources":[{"label":"AWS Direct Connect","url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html","label":"docs.aws.amazon.com: MACsec"}],"level":"applied","learning":{"definition":{"en":"AWS Direct Connect links your internal network to a Direct Connect location over a standard Ethernet fibre optic cable, one end on your router and the other on an AWS router. Over it you create virtual interfaces, which are BGP sessions reaching Amazon VPC or public AWS services, bypassing internet service providers.","es":"AWS Direct Connect une tu red interna con una ubicación de Direct Connect mediante un cable estándar de fibra óptica Ethernet, un extremo en tu enrutador y el otro en un enrutador de AWS. Sobre él creas interfaces virtuales, que son sesiones BGP que alcanzan Amazon VPC o servicios públicos de AWS, evitando a los proveedores de internet."},"simple":{"en":"A dedicated link from your network into AWS. It changes the path your traffic takes, and not who can read it.","es":"Un enlace dedicado desde tu red hacia AWS. Cambia el camino que toma tu tráfico, y no quién puede leerlo."},"analogy":{"en":"A private service road from your factory to a distribution hub instead of the public motorway, so traffic becomes predictable. The limitation: anyone beside a private road still sees what the lorries carry, so encryption remains a separate decision.","es":"Una carretera privada de tu fábrica a un centro de distribución en lugar de la autopista pública, así el tráfico es previsible. La limitación: quien esté al lado sigue viendo qué llevan los camiones, así que el cifrado es aparte."},"walkthrough":{"en":["On the public internet your traffic crosses networks you neither own nor observe, so latency varies with congestion elsewhere. A dedicated circuit gives a known path with known capacity, which buys predictability rather than raw speed.","Choose the connection form first. A dedicated connection is a physical port allocated to you at a Direct Connect location. A hosted connection comes through an AWS Partner and suits lower bandwi
