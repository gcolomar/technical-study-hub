ndependent.","Finally map to AWS with the caveats. EBS is block storage with snapshots, EFS is managed file storage speaking the network file system protocol, and S3 is object storage with classes for different access patterns. S3 general purpose buckets present an object interface rather than a POSIX filesystem, and S3 gives strong read after write consistency for object writes and deletes in all Regions."],"es":["Decide por la semántica de acceso. El software que actualiza bytes en sitio y mantiene su propio formato en disco, como un motor de base de datos, necesita bloques. Varias máquinas que deben ver un mismo árbol de directorios con bloqueo de archivos necesitan almacenamiento de archivos. Los elementos completos que se escriben y leen por clave son más simples y baratos en objetos.","Después pesa el uso compartido y la duración. Un volumen de bloques se conecta normalmente a una instancia a la vez, así que no reparte estado en una flota, mientras el de archivos está diseñado para montajes concurrentes. El de objetos lo alcanzan muchos clientes a la vez porque cada petición es independiente.","Por último mapea a AWS con sus matices. EBS es bloques con snapshots, EFS es almacenamiento de archivos administrado que habla el protocolo de sistema de archivos en red, y S3 es de objetos con clases para distintos patrones de acceso. Los buckets de propósito general de S3 presentan una interfaz de objetos y no un sistema POSIX, y S3 da consistencia fuerte de lectura tras escritura para escrituras y borrados de objetos en todas las Regiones."]},"pitfalls":{"en":["Treating an object store as a POSIX filesystem. General purpose S3 has no file locking and no partial in place update, so a database file on it behaves badly, although the S3 Express One Zone class does support appends to an existing object.","Choosing file storage by default for scale out web content. Object storage is usually cheaper and simpler for read mostly assets, and a shared mount adds a coupling and a failure mode you may not need."],"es":["Tratar un almacén de objetos como un sistema POSIX. S3 de propósito general no tiene bloqueo de archivos ni actualización parcial en sitio, así que un archivo de base de datos encima se comporta mal, aunque la clase S3 Express One Zone sí admite añadir datos a un objeto existente.","Elegir almacenamiento de archivos por defecto para contenido web escalado horizontalmente. El de objetos suele ser más barato y simple para activos que se leen mucho, y un montaje compartido añade un acoplamiento y un modo de fallo que quizá no necesitas."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html","label":"docs.aws.amazon.com: whatisefs"},{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html","label":"docs.aws.amazon.com: ebs volume types"}]}},{"id":"systems-storage-types","parent":"systems-storage","title":{"en":"Storage Media and Performance","es":"Medios de almacenamiento y rendimiento"},"summary":{"en":"Compare disks and understand latency, operations per second and data transfer rate.","es":"Compara discos y entiende la latencia, las operaciones por segundo y la velocidad de transferencia."},"details":{"en":["IOPS measures operations per second (latency-sensitive, small random reads/writes, e.g. databases); throughput measures MB/s (large sequential transfers, e.g. big data, logs). SSD-backed volumes (gp3, io2) are tuned for IOPS-sensitive workloads with independently provisionable IOPS and throughput on gp3; HDD-backed volumes (st1/sc1) are cheap per GB but only good for sequential throughput, not random small I/O, and cannot serve as a boot volume."],"es":["IOPS mide operaciones por segundo (sensible a latencia, lecturas/escrituras pequeñas y aleatorias, ej. bases de datos); throughput mide MB/s (transferencias secuenciales grandes, ej. big data, logs). Los volumenes basados en SSD (gp3, io2) están ajustados para cargas sensibles a IOPS con IOPS y throughput aprovisionables por separado en gp3; los volumenes basados en HDD (st1/sc1) son baratos por GB pero solo buenos para throughput secuencial, no E/S pequeña y aleatoria, y no pueden ser volumen de arranque."]},"aws":{"en":"gp3 for general purpose with independently tunable IOPS/throughput; io2 Block Express for high-IOPS databases; st1 for big-data/log throughput; sc1 for cold, infrequent access.","es":"gp3 para uso general con IOPS/throughput ajustables por separado; io2 Block Express para bases de datos de alto IOPS; st1 para throughput de big data/logs; sc1 para acceso frío e infrecuente."},"question":{"en":"A database on gp2 shows latency spikes during nightly batch jobs. What EBS change helps and why?","es":"Una base de datos en gp2 muestra picos de latencia durante trabajos por lotes nocturnos. ¿Qué cambio de EBS ayuda y por qué?"},"answer":{"en":"Step 1: recognize gp2 ties IOPS to volume size via a burst-bucket model, so sustained batch load can exhaust burst credits. Step 2: migrate to gp3, which decouples IOPS and throughput from size and lets you provision both independently without resizing the volume. Step 3: for very high and consistent IOPS needs, consider io2 Block Express instead, and validate with CloudWatch VolumeQueueLength and burst balance metrics before and after.","es":"Paso 1: reconoce que gp2 liga los IOPS al tamaño del volumen mediante un modelo de credito de rafaga, así que la carga sostenida por lotes puede agotar esos creditos. Paso 2: migra a gp3, que desacopla IOPS y throughput del tamaño y permite aprovisionar ambos por separado sin redimensionar el volumen. Paso 3: para necesidades de IOPS muy altas y constantes, considera io2 Block Express, y valida con las métricas de CloudWatch VolumeQueueLength y burst balance antes y después."},"related":["systems-storage","systems-raid-durability"],"sources":[{"label":"Amazon EBS Volume Types","url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}],"level":"applied","learning":{"definition":{"en":"Solid state drives have no moving parts, so random access costs about the same as sequential and they favour operations per second. Hard disk drives must move a head, so they favour large sequential transfers. Performance is described by operations per second, throughput in bytes per second, and latency.","es":"Las unidades de estado sólido no tienen partes móviles, así que el acceso aleatorio cuesta casi lo mismo que el secuencial y favorecen las operaciones por segundo. Los discos duros deben mover un cabezal, así que favorecen las transferencias grandes y secuenciales. El rendimiento se describe con operaciones por segundo, rendimiento en bytes por segundo y latencia."},"simple":{"en":"Solid state drives are good at many small scattered requests. Spinning disks are good at moving large amounts of data in order. Speed is not one number: requests per second, bytes per second and delay are separate.","es":"Las unidades de estado sólido son buenas con muchas peticiones pequeñas y dispersas. Los discos giratorios son buenos moviendo grandes cantidades de datos en orden. La velocidad no es un solo número: peticiones por segundo, bytes por segundo y retardo son cosas distintas."},"analogy":{"en":"A spinning disk is a record player whose arm must travel to each track; a solid state drive is a jukebox that jumps straight to any song. Limit: a jukebox never queues, while a volume has a provisioned ceiling and a request queue, so past that ceiling extra requests do not go faster, they wait and latency climbs.","es":"Un disco giratorio es un tocadiscos cuyo brazo debe viajar a cada surco; una unidad de estado sólido es una máquina de discos que salta directamente a cualquier canción. Límite: una máquina de discos nunca encola, mientras un volumen tiene un techo aprovisionado y una cola de peticiones, así que pasado ese techo las peticiones extra no van más rápido, esperan y la latencia sube."},"walkthrough":{"en":["Characterise the workload before comparing products. A transactional database doing many small random reads is limited by operations per second, while an analytics scan moving large sequential blocks is limited by throughput. The same volume can look fast in one test and slow in another, so a benchmark must match your request size and concurrency.","Then reason about the queue. Latency stays roughly flat while the device keeps up, and rises steeply once requests wait, which is why a system can look healthy at eighty percent of its provisioned limit and fail at ninety five. Track queue length and wait time alongside utilisation.","Finally map to volume types. AWS describes SSD backed volumes as optimised for transactional workloads dominated by operations per second, and HDD backed volumes for large sequential throughput. Both the volume and the instance have limits, so a small instance can cap a large volume, and EBS optimised instances exist to make provisioned performance reachable."],"es":["Caracteriza la carga antes de comparar productos. Una base transaccional con muchas lecturas pequeñas aleatorias se limita por operaciones por segundo, mientras un recorrido analítico de bloques grandes secuenciales se limita por rendimiento. El mismo volumen puede parecer rápido en una prueba y lento en otra, así que la prueba debe imitar tu tamaño de petición y tu concurrencia.","Después razona sobre la cola. La latencia se mantiene casi plana mientras el dispositivo aguanta y sube con fuerza cuando las peticiones esperan, y por eso un sistema parece sano al ochenta por ciento de su límite aprovisionado y falla al noventa y cinco. Sigue la longitud de la cola y el tiempo de espera junto al uso.","Por último mapea a los tipos de volumen. AWS describe los volúmenes respaldados por SSD como optimizados para cargas transaccionales dominadas por operaciones por segundo, y los de HDD para gran rendimiento secuencial. El volumen y la instancia tienen límites, así que una instancia pequeña puede topar un volumen grande, y las instancias optimizadas para EBS existen para alcanzar el rendimiento aprovisionado."]},"pitfalls":{"en":["Comparing volumes by operations per second alone. A volume with a high operations figure can still be throughput bound on large sequential requests, and the attached instance may cap both numbers.","Believing a short synthetic benchmark. Sequential tests flatter a device that a random production pattern will expose, and burst behaviour can make a brief test unrepresentative, so test at production duration and mix."],"es":["Comparar volúmenes solo por operaciones por segundo. Un volumen con una cifra alta de operaciones puede quedar limitado por rendimiento en peticiones grandes secuenciales, y la instancia conectada puede topar ambas cifras.","Creer una prueba sintética corta. Las pruebas secuenciales favorecen a un dispositivo que un patrón real aleatorio dejará en evidencia, y el comportamiento por ráfagas puede hacer poco representativa una prueba breve, así que prueba con la duración y la mezcla de producción."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html","label":"docs.aws.amazon.com: ebs volume types"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}]}},{"id":"systems-raid-durability","parent":"systems-storage","title":{"en":"RAID Concepts and Durability","es":"Conceptos RAID y durabilidad"},"summary":{"en":"Combine disks for performance or disk-failure tolerance, without confusing redundancy with backup.","es":"Combina discos para mejorar rendimiento o tolerar fallos de disco, sin confundir redundancia con backup."},"details":{"en":["RAID 0 (striping) improves throughput by spreading data across disks but reduces durability, since losing one disk loses all data; RAID 1 (mirroring) improves durability by duplicating data at the cost of capacity. AWS does not expose RAID directly for most services, but the same tradeoff shows up: the S3 Standard storage class achieves 11 nines durability by redundantly storing objects across multiple devices in at least three Availability Zones (the cheaper One Zone-IA class deliberately drops that AZ redundancy for lower cost), while a single EBS volume without snapshots has no such redundancy and a lost volume is a lost volume."],"es":["RAID 0 (striping) mejora el throughput distribuyendo datos entre discos pero reduce la durabilidad, ya que perder un disco pierde todos los datos; RAID 1 (mirroring) mejora la durabilidad duplicando datos a costo de capacidad. AWS no expone RAID directamente para la mayoria de servicios, pero la misma compensación aparece: la clase de almacenamiento S3 Standard logra 11 nueves de durabilidad almacenando objetos de forma redundante en múltiples dispositivos y al menos tres Zonas de Disponibilidad (la clase más economica One Zone-IA renuncia deliberadamente a esa redundancia entre AZs para reducir costo), mientras que un único volumen EBS sin snapshots no tiene tal redundancia y un volumen perdido es un volumen perdido."]},"aws":{"en":"EBS volumes are already replicated within one AZ but need snapshots (copied to another region for cross-region durability) for AZ-level and region-level recovery; S3 Standard is durable by design across AZs.","es":"Los volumenes EBS ya están replicados dentro de una AZ pero necesitan snapshots (copiados a otra región para durabilidad entre regiones) para recuperación a nivel de AZ y de región; S3 Standard es durable por diseño entre AZs."},"question":{"en":"A customer assumes EBS alone protects them from an AZ failure. What do you correct?","es":"Un cliente asume que EBS por si solo lo protege de una falla de AZ. ¿Qué corriges?"},"answer":{"en":"Step 1: clarify that an EBS volume lives in a single AZ and replicates only within that AZ for hardware-failure protection, not across AZs. Step 2: recommend automated EBS snapshots stored in S3 (itself multi-AZ durable within a region) for AZ-level recovery, and explicitly copy those snapshots to a second region for region-level recovery, a snapshot alone does not leave its region. Step 3: for databases, pair this with RDS Multi-AZ or application-level replication so a full AZ outage causes reduced downtime rather than none, Multi-AZ failover still takes time and is not an instantaneous guarantee.","es":"Paso 1: aclara que un volumen EBS vive en una sola AZ y se réplica solo dentro de esa AZ para protección ante fallas de hardware, no entre AZs. Paso 2: recomienda snapshots automatizados de EBS almacenados en S3 (durable entre AZs dentro de una región) para recuperación a nivel de AZ, y copia explicitamente esos snapshots a una segunda región para recuperación a nivel de región, un snapshot por si solo no sale de su región. Paso 3: para bases de datos, combina esto con RDS Multi-AZ o replicación a nivel de aplicación para que una falla completa de AZ cause una caída reducida en vez de ninguna, la conmutación Multi-AZ toma tiempo y no es una garantia instantánea."},"related":["systems-storage","disaster-recovery"],"sources":[{"label":"Amazon S3 Durability and Availability","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/DataDurability.html"},{"url":"https://docs.kernel.org/admin-guide/md.html","label":"docs.kernel.org: md"},{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/raid-config.html","label":"docs.aws.amazon.com: raid config"}],"level":"applied","learning":{"definition":{"en":"RAID combines several disks into one logical device. Striping spreads data for speed, mirroring keeps full copies, and parity stores enough redundancy to rebuild one lost member. Durability means the data survives over time; availability means you can reach it right now. RAID addresses device failure, not deletion or corruption.","es":"RAID combina varios discos en un dispositivo lógico. El striping reparte datos para ganar velocidad, el mirroring guarda copias completas y la paridad guarda redundancia suficiente para reconstruir un miembro perdido. La durabilidad es que el dato sobreviva en el tiempo; la disponibilidad es poder alcanzarlo ahora. RAID atiende fallos de dispositivo, no borrados ni corrupción."},"simple":{"en":"RAID groups several disks into one device. With mirroring or parity a member can fail without losing data, while RAID 0 adds no redundancy at all. It is not a backup, because a wrong delete or a corrupt write enters the array immediately.","es":"RAID agrupa varios discos en un dispositivo. Con espejo o paridad un miembro puede fallar sin perder datos, mientras RAID 0 no añade redundancia alguna. No es un respaldo, porque un borrado equivocado o una escritura corrupta entra en el arreglo de inmediato."},"analogy":{"en":"Mirroring is two typists taking the same dictation, so losing one typist loses nothing. Limit: dictate the wrong sentence and both write the wrong sentence, and neither keeps yesterday's draft. A backup is the folder of past drafts, a different job from having a second typist.","es":"El mirroring son dos mecanógrafos tomando el mismo dictado, así que perder a uno no pierde nada. Límite: si dictas la frase equivocada, ambos escriben la frase equivocada, y ninguno guarda el borrador de ayer. Un respaldo es la carpeta de borradores pasados, un trabajo distinto a tener un segundo mecanógrafo."},"walkthrough":{"en":["Read the levels as trade offs. RAID 0 stripes with no redundancy, often giving the highest aggregate throughput, and losing one member loses the array. RAID 1 mirrors, giving redundancy at half the usable capacity. RAID 5 stripes with distributed parity and survives one member loss with a write penalty. RAID 10 mirrors then stripes, giving speed and redundancy at double the capacity cost.","Then separate three protections a design needs. Redundancy covers component failure, backups with retention cover deletion, corruption and ransomware because they hold earlier states, and a copy in another location covers loss of a site. RAID only ever provides the first, so RAID plus no tested restore leaves a real gap.","In the cloud the first layer is often already there. AWS states that EBS volume data is replicated across multiple servers within an Availability Zone, so mirroring for single component failure adds little. RAID 0 across volumes is still used to exceed one volume's performance, accepting that losing one volume loses the array, and snapshots remain the point in time copy."],"es":["Lee los niveles como compromisos. RAID 0 hace striping sin redundancia, suele dar el mayor rendimiento agregado, y perder un miembro pierde el arreglo. RAID 1 hace mirroring y da redundancia a cambio de la mitad de la capacidad útil. RAID 5 hace striping con paridad distribuida y sobrevive a la pérdida de un miembro con una penalización en escritura. RAID 10 combina espejo y striping, con velocidad y redundancia al doble de costo de capacidad.","Después separa las tres protecciones que un diseño necesita. La redundancia cubre el fallo de componentes, los respaldos con retención cubren borrados, corrupción y ransomware porque guardan estados anteriores, y una copia en otra ubicación cubre la pérdida del sitio. RAID solo aporta la primera, así que RAID sin una restauración probada deja un hueco real.","En la nube la primera capa suele estar ya puesta. AWS indica que los datos de un volumen EBS se replican en varios servidores dentro de una zona de disponibilidad, así que hacer espejo para el fallo de un componente aporta poco. RAID 0 sobre varios volúmenes se sigue usando para superar el rendimiento de uno, aceptando que perder un volumen pierde el arreglo, y los snapshots siguen siendo la copia puntual."]},"pitfalls":{"en":["Calling RAID a backup. A write becomes redundant data across members, including a mistaken delete, and no earlier version is kept, so snapshots or backups with retention are still required.","Forgetting that a rebuild is a risk window. While a replacement resynchronises, performance drops and a second failure in that window can lose the array, which is why wide parity sets of very large disks are discouraged."],"es":["Llamar respaldo a RAID. Una escritura se vuelve dato redundante entre los miembros, incluido un borrado equivocado, y no se guarda ninguna versión anterior, así que siguen siendo necesarios snapshots o respaldos con retención.","Olvidar que la reconstrucción es una ventana de riesgo. Mientras un reemplazo se resincroniza el rendimiento baja, y un segundo fallo en esa ventana puede perder el arreglo, por eso se desaconsejan conjuntos de paridad amplios con discos muy grandes."]},"sourceUrls":[{"url":"https://docs.kernel.org/admin-guide/md.html","label":"docs.kernel.org: md"},{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/raid-config.html","label":"docs.aws.amazon.com: raid config"}]}},{"id":"cloud","parent":null,"title":{"en":"Cloud Compute and Distributed Systems","es":"Cómputo en la nube y sistemas distribuidos"},"summary":{"en":"Ways to run applications, adjust capacity and coordinate work across multiple machines.","es":"Formas de ejecutar aplicaciones, ajustar capacidad y coordinar trabajo entre varias máquinas."},"details":{"en":["This root covers how to run code in AWS and how to make many running instances of that code cooperate reliably: choosing the right compute primitive, scaling it automatically, and decoupling components with queues and events so failures in one part do not cascade."],"es":["Esta raíz cubre como ejecutar código en AWS y como hacer que muchas instancias de ese código cooperen de forma confiable: elegir el primitivo de cómputo correcto, escalarlo automáticamente, y desacoplar componentes con colas y eventos para que las fallas en una parte no se propaguen en cascada."]},"aws":{"en":"Core services: EC2, Lambda, ECS/EKS/Fargate, Auto Scaling, SQS, SNS, EventBridge, Step Functions.","es":"Servicios centrales: EC2, Lambda, ECS/EKS/Fargate, Auto Scaling, SQS, SNS, EventBridge, Step Functions."},"question":{"en":"How do you decide between EC2, Lambda and containers for a new workload?","es":"¿Cómo decides entre EC2, Lambda y contenedores para una carga nueva?"},"answer":{"en":"Step 1: check execution duration and statefulness, Lambda caps at 15 minutes and is stateless per invocation. Step 2: check traffic pattern, spiky/unpredictable favors Lambda or Fargate for fast elastic scale, steady high-utilization favors EC2 with Reserved/Savings Plans for cost. Step 3: check operational preference, containers (ECS/EKS/Fargate) suit teams standardizing on Docker across on-prem and cloud, EC2 suits workloads needing OS-level control or licensing constraints.","es":"Paso 1: revisa la duración de ejecución y la estatalidad, Lambda tiene un tope de 15 minutos y es sin estado por invocación. Paso 2: revisa el patrón de tráfico, si es puntiagudo/impredecible favorece Lambda o Fargate para escalado elástico rápido, si es alto y estable favorece EC2 con Reserved/Savings Plans por costo. Paso 3: revisa la preferencia operativa, los contenedores (ECS/EKS/Fargate) convienen a equipos que estandarizan en Docker entre on-prem y la nube, EC2 conviene a cargas que necesitan control a nivel de SO o restricciones de licencia."},"related":["cloud-compute","cloud-distributed-systems"],"sources":[{"label":"AWS Compute Services Overview","url":"https://aws.amazon.com/products/compute/"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"},{"url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/scale-your-group.html","label":"docs.aws.amazon.com: scale your group"}],"level":"foundation","learning":{"definition":{"en":"Cloud computing means renting capacity through an interface for programs instead of buying hardware. A Region is a separate geography, an Availability Zone is one or more isolated data centres within a Region, and a shared responsibility model splits duties: the provider secures the infrastructure, you secure what you run and configure.","es":"La nube significa alquilar capacidad mediante una interfaz para programas en vez de comprar hardware. Una Región es una geografía separada, una zona de disponibilidad es uno o más centros de datos aislados dentro de una Región, y un modelo de responsabilidad compartida divide las tareas: el proveedor protege la infraestructura y tú proteges lo que ejecutas y configuras."},"simple":{"en":"You ask an interface for servers, storage or a database and get them in minutes, paying while you use them. The provider runs the sites; your design and configuration stay yours.","es":"Pides servidores, almacenamiento o una base de datos a una interfaz y los tienes en minutos, pagando mientras los usas. El proveedor opera los sitios; tu diseño y tu configuración siguen siendo tuyos."},"analogy":{"en":"Renting a serviced office rather than owning a building: power, security and cleaning are included and you can take more desks. Limit: a landlord cannot give you fifty desks in ninety seconds, does not bill by the second, and never writes your evacuation plan, which is what service quotas and shared responsibility make explicit.","es":"Alquilar una oficina con servicios en vez de tener un edificio: luz, seguridad y limpieza vienen incluidos y puedes tomar más escritorios. Límite: un arrendador no te da cincuenta escritorios en noventa segundos, no cobra por segundo y nunca escribe tu plan de evacuación, que es lo que hacen explícito las cuotas de servicio y la responsabilidad compartida."},"walkthrough":{"en":["The economics change the design question. Capacity becomes an operating expense you can adjust quickly, so instead of buying hardware for three years you ask how closely capacity can follow demand, which is why measurement and automatic scaling matter more than a single sizing exercise.","Failure boundaries come next. Availability Zones are engineered to fail independently, so spreading instances across zones survives a site event, while a Region wide dependency needs a second Region and a deliberate recovery plan with a stated recovery time and recovery point.","Then take your half of the responsibility seriously. Accounts carry service quotas that are part of the design, and configuration of identity, network rules and restorable backups is yours to get right, so it deserves the same review you would give your own datacentre."],"es":["La economía cambia la pregunta de diseño. La capacidad pasa a ser un gasto operativo que puedes ajustar rápido, así que en vez de comprar hardware para tres años preguntas qué tan de cerca puede seguir la capacidad a la demanda, y por eso la medición y el escalado automático importan más que dimensionar una sola vez.","Después vienen las fronteras de fallo. Las zonas de disponibilidad están diseñadas para fallar de forma independiente, así que repartir instancias entre zonas sobrevive a un evento de sitio, mientras una dependencia de toda la Región exige una segunda Región y un plan de recuperación con tiempo y punto de recuperación declarados.","Luego toma en serio tu mitad de la responsabilidad. Las cuentas tienen cuotas de servicio que forman parte del diseño, y la configuración de identidad, reglas de red y respaldos restaurables te corresponde a ti, así que merece la misma revisión que en tu propio centro de datos."]},"pitfalls":{"en":["Assuming the provider backs up your data. Infrastructure durability is not a restorable copy with retention that you have tested, and deleting a resource can delete its data with it.","Designing in one Availability Zone because a service is managed. Managed does not imply multi zone by default, so check each service's placement and enable the multi zone option explicitly."],"es":["Suponer que el proveedor respalda tus datos. La durabilidad de la infraestructura no es una copia restaurable con retención que ya probaste, y borrar un recurso puede borrar sus datos con él.","Diseñar en una sola zona de disponibilidad porque el servicio es administrado. Administrado no implica multizona por defecto, así que revisa la ubicación de cada servicio y activa la opción multizona de forma explícita."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"},{"url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/scale-your-group.html","label":"docs.aws.amazon.com: scale your group"}]}},{"id":"cloud-compute","parent":"cloud","title":{"en":"Compute Options","es":"Opciones de cómputo"},"summary":{"en":"Compare virtual machines, containers and functions by control, operating effort and workload fit.","es":"Compara máquinas virtuales, contenedores y funciones según control, esfuerzo operativo y tipo de carga."},"details":{"en":["Compute choice drives most other architecture decisions: state handling, deployment model, scaling latency and cost model all differ between EC2, container orchestration, and Lambda. A well-architected review almost always starts by validating this choice against actual traffic and duration patterns rather than defaulting to what a team already knows."],"es":["La eleccion de cómputo impulsa la mayoria de las demás decisiones de arquitectura: el manejo de estado, el modelo de despliegue, la latencia de escalado y el modelo de costo difieren entre EC2, orquestación de contenedores, y Lambda. Una revisión Well-Architected casí siempre empieza validando esta eleccion contra los patrones reales de tráfico y duración en lugar de usar por defecto lo que un equipo ya conoce."]},"aws":{"en":"EC2 for full control, ECS/EKS/Fargate for containers, Lambda for event-driven short-lived functions.","es":"EC2 para control total, ECS/EKS/Fargate para contenedores, Lambda para funciones de corta duración orientadas a eventos."},"question":{"en":"When is Lambda a poor fit despite its operational simplicity?","es":"¿Cuándo es Lambda una mala opción a pesar de su simplicidad operativa?"},"answer":{"en":"Step 1: check for long-running or stateful work, Lambda's 15-minute limit and stateless execution rule out long batch jobs or in-memory session state. Step 2: check for steady very-high-throughput workloads, where per-invocation pricing and cold starts can cost more and add latency versus a right-sized EC2 fleet. Step 3: check for specialized runtime/OS needs (custom kernels, GPU driver versions) that containers or EC2 support more directly.","es":"Paso 1: revisa si el trabajo es de larga duración o con estado, el limite de 15 minutos de Lambda y su ejecución sin estado descartan trabajos por lotes largos o estado de sesión en memoria. Paso 2: revisa cargas de throughput muy alto y estable, donde el precio por invocación y los arranques en frío pueden costar más y añadir latencia frente a una flota EC2 bien dimensionada. Paso 3: revisa necesidades especializadas de runtime/SO (kernels personalizados, versiones de drivers GPU) que los contenedores o EC2 soportan más directamente."},"related":["cloud-ec2","cloud-lambda","cloud-containers"],"sources":[{"label":"AWS Lambda Quotas","url":"https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"},{"url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}],"level":"foundation","learning":{"definition":{"en":"Compute models differ in how much of the stack you operate. A virtual machine hands you an operating system to run. A container packages an application and its dependencies to be placed by a scheduler. A managed function is code the platform runs per event in an environment it creates.","es":"Los modelos de cómputo difieren en cuánta parte de la pila operas. Una máquina virtual te entrega un sistema operativo que administrar. Un contenedor empaqueta una aplicación y sus dependencias para que un planificador la coloque. Una función administrada es código que la plataforma ejecuta por evento en un entorno que ella crea."},"simple":{"en":"There is a ladder of responsibility. At the bottom you run a whole server, in the middle you ship a packaged application, at the top you ship only code.","es":"Hay una escalera de responsabilidad. Abajo operas un servidor completo, en medio entregas una aplicación empaquetada, y arriba entregas solo código."},"analogy":{"en":"Owning a car, renting a car, or taking a taxi. Limit: a taxi has no warm up and no trip ceiling, while a managed function has cold starts, a concurrency quota and a maximum run time, so the cheapest option per trip can become the wrong one at constant heavy load.","es":"Tener coche, alquilarlo o tomar un taxi. Límite: un taxi no tiene calentamiento ni tope de viaje, mientras una función administrada tiene arranques en frío, una cuota de concurrencia y un tiempo máximo, así que la opción más barata por viaje puede ser la equivocada con carga alta constante."},"walkthrough":{"en":["Match the model to the workload shape. Long running processes with particular operating system needs fit virtual machines. Services deployed often and scaled per component fit containers. Event driven work with idle gaps fits functions, because you pay while code runs. These are layers as much as alternatives, since containers commonly run on virtual machines.","Then size from measurement. Establish how much processor and memory one unit of work needs and how many units run concurrently at peak. Over provisioning wastes money quietly, while under provisioning appears as queueing and tail latency, so record both cost per request and concurrency.","Finally count the operational work you accept. Virtual machines bring patching, images and capacity planning. Containers bring image builds, a registry and an orchestrator. Functions bring execution limits and a stronger need for idempotent handlers. For a small team that ongoing burden usually decides the choice."],"es":["Empareja el modelo con la forma de la carga. Los procesos largos con necesidades particulares del sistema operativo encajan en máquinas virtuales. Los servicios que se despliegan seguido y escalan por componente encajan en contenedores. El trabajo por eventos con huecos inactivos encaja en funciones, porque pagas mientras el código corre. Son capas tanto como alternativas, ya que los contenedores suelen correr sobre máquinas virtuales.","Después dimensiona midiendo. Establece cuánto procesador y memoria necesita una unidad de trabajo y cuántas unidades corren a la vez en el pico. Sobredimensionar desperdicia dinero en silencio, mientras quedarse corto aparece como colas y latencia de cola, así que registra el costo por petición y la concurrencia.","Por último cuenta el trabajo operativo que aceptas. Las máquinas virtuales traen parches, imágenes y planificación de capacidad. Los contenedores traen construcción de imágenes, un registro y un orquestador. Las funciones traen límites de ejecución y más necesidad de handlers idempotentes. En un equipo pequeño esa carga continua suele decidir."]},"pitfalls":{"en":["Choosing serverless mainly to cut cost. At sustained high utilisation a right sized or committed use instance is often cheaper, so compare cost per request at your real traffic shape.","Moving an application to containers without changing state handling. If instances hold sessions or local files, scaling and restarts break, so externalise state before changing the compute model."],"es":["Elegir serverless sobre todo para recortar costo. Con uso alto sostenido una instancia bien dimensionada o con compromiso de uso suele ser más barata, así que compara el costo por petición con tu tráfico real.","Mover una aplicación a contenedores sin cambiar el manejo de estado. Si las instancias guardan sesiones o archivos locales, el escalado y los reinicios se rompen, así que externaliza el estado antes de cambiar el modelo de cómputo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"},{"url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}]}},{"id":"cloud-ec2","parent":"cloud-compute","title":{"en":"EC2 and Instance Selection","es":"EC2 y selección de instancias"},"summary":{"en":"Choose virtual-machine resources, purchase options and placement for the workload.","es":"Elige recursos, opciones de compra y ubicación de máquinas virtuales según la carga."},"details":{"en":["EC2 instance families are tuned for different bottlenecks: general purpose (m-series) balance CPU/memory, compute-optimized (c-series) favor CPU, memory-optimized (r/x-series) favor RAM, storage-optimized (i/d-series) favor local disk I/O. Purchasing options trade commitment for discount: On-Demand for unpredictable/short-lived, Reserved Instances or Savings Plans for steady baseline (up to ~72 percent off), Spot for interruptible/fault-tolerant workloads at up to 90 percent off but subject to 2-minute reclaim notice.","Pitfall: putting a stateful, non-fault-tolerant workload on Spot without a fallback strategy causes unplanned outages when capacity is reclaimed."],"es":["Las familias de instancias EC2 están ajustadas para diferentes cuellos de botella: uso general (m-series) balancean CPU/memoria, optimizadas para cómputo (c-series) favorecen CPU, optimizadas para memoria (r/x-series) favorecen RAM, optimizadas para almacenamiento (i/d-series) favorecen E/S de disco local. Las opciones de compra intercambian compromiso por descuento: On-Demand para impredecible/corta duración, Reserved Instances o Savings Plans para línea base estable (hasta ~72 por ciento de descuento), Spot para cargas interrumpibles/tolerantes a fallas con hasta 90 por ciento de descuento pero sujetas a aviso de recuperación de 2 minutos.","Error común: poner una carga con estado y no tolerante a fallas en Spot sin una estrategia de respaldo causa caídas no planeadas cuando se recupera la capacidad."]},"aws":{"en":"Combine Auto Scaling groups with mixed instance policies (On-Demand baseline plus Spot burst) for cost-efficient resilience.","es":"Combina grupos de Auto Scaling con políticas de instancias mixtas (línea base On-Demand más rafaga Spot) para resiliencia eficiente en costo."},"question":{"en":"A customer wants to cut EC2 cost 60 percent for a fault-tolerant batch pipeline without redesigning it. What do you propose?","es":"Un cliente quiere reducir el costo de EC2 en 60 por ciento para un pipeline de lotes tolerante a fallas sin rediseñarlo. ¿Qué propones?"},"answer":{"en":"Step 1: confirm the workload is stateless and can checkpoint or retry, which is the precondition for Spot. Step 2: move the batch fleet to Spot Instances with a diversified instance-type pool across multiple AZs to reduce simultaneous reclaim risk. Step 3: keep a small On-Demand or Savings Plan baseline if any part of the pipeline cannot tolerate interruption, and use Spot interruption notices to checkpoint gracefully.","es":"Paso 1: confirma que la carga es sin estado y puede hacer checkpoint o reintentar, que es la condicion previa para Spot. Paso 2: mueve la flota de lotes a instancias Spot con un pool diversificado de tipos de instancia entre múltiples AZs para reducir el riesgo de recuperación simultanea. Paso 3: mantiene una pequeña línea base On-Demand o Savings Plan si alguna parte del pipeline no tolera interrupción, y usa los avisos de interrupción de Spot para hacer checkpoint de forma ordenada."},"related":["cloud-compute","cloud-scaling","cost-optimization"],"sources":[{"label":"Amazon EC2 Instance Purchasing Options","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"},{"url":"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html","label":"docs.aws.amazon.com: ec2 nitro instances"}],"level":"applied","learning":{"definition":{"en":"Amazon EC2 provides virtual machines called instances. The instance type determines the host hardware profile and the share of processor, memory, storage and network the instance receives. Families group types by the resource they favour, such as general purpose, compute optimised, memory optimised and storage optimised.","es":"Amazon EC2 ofrece máquinas virtuales llamadas instancias. El tipo de instancia determina el perfil de hardware del anfitrión y la porción de procesador, memoria, almacenamiento y red que recibe. Las familias agrupan tipos por el recurso que favorecen, como uso general, optimizadas para cómputo, para memoria o para almacenamiento."},"simple":{"en":"EC2 is a rented server. You pick a size and shape from a menu, and the family name tells you which resource it is generous with.","es":"EC2 es un servidor alquilado. Eliges tamaño y forma de un menú, y el nombre de la familia te dice con qué recurso es generoso."},"analogy":{"en":"Choosing a vehicle: a van for cargo, a sports car for speed, a bus for many passengers. Limit: an engine does not throttle when you exceed an allowance, while AWS shares some host resources such as network and the disk subsystem, and burstable types spend credits, so sustained load can be slower, or cost more, than a short test implied.","es":"Elegir un vehículo: una furgoneta para carga, un deportivo para velocidad, un autobús para muchos pasajeros. Límite: un motor no se frena al pasar un cupo, mientras AWS comparte algunos recursos del anfitrión como la red y el subsistema de disco, y los tipos burstable gastan créditos, así que la carga sostenida puede ser más lenta, o costar más, de lo que sugirió una prueba corta."},"walkthrough":{"en":["Start from the measured bottleneck. If a service is memory bound, a compute optimised family wastes money and still queues; if it is processor bound, extra memory changes nothing. Pick the family that is generous with the constrained resource, then the smallest size that holds peak load with headroom.","Read the sharing rules before trusting a benchmark. AWS dedicates some host resources to an instance and shares others, including network and the disk subsystem, and smaller sizes receive smaller allocations. Burstable types accumulate credits while idle; in standard mode they fall back to a baseline once credits are spent, while in unlimited mode they keep bursting and you are charged for the surplus.","Then design instances to be replaceable. Configuration should be applied at launch from an image or user data, state should live on EBS, a network filesystem or a database, and instances should be spread across Availability Zones so a scaling group can replace an unhealthy one instead of you repairing it."],"es":["Parte del cuello de botella medido. Si un servicio está limitado por memoria, una familia optimizada para cómputo gasta dinero y sigue encolando; si está limitado por procesador, más memoria no cambia nada. Elige la familia generosa en el recurso limitado y luego el tamaño más pequeño que aguante el pico con margen.","Lee las reglas de reparto antes de creer una prueba. AWS dedica algunos recursos del anfitrión a la instancia y comparte otros, incluidos la red y el subsistema de disco, y los tamaños menores reciben asignaciones menores. Los tipos burstable acumulan créditos mientras están inactivos; en modo estándar caen a una base cuando los gastan, y en modo ilimitado siguen acelerando y se cobra el excedente.","Después diseña instancias reemplazables. La configuración debe aplicarse al arrancar desde una imagen o datos de usuario, el estado debe vivir en EBS, en un sistema de archivos en red o en una base de datos, y las instancias deben repartirse entre zonas de disponibilidad para que un grupo de escalado reemplace una dañada en vez de repararla tú."]},"pitfalls":{"en":["Sizing production from a short test on a burstable instance. Credits make a brief test fast, while sustained load either drops to baseline or bills for surplus credits, so run until credits are exhausted or test on a fixed performance type.","Keeping data that matters on the instance. Instance store is lost when the instance stops, and even EBS needs snapshots, so decide where state lives before the first launch."],"es":["Dimensionar producción con una prueba corta en una instancia burstable. Los créditos hacen rápida una prueba breve, mientras la carga sostenida cae a la base o factura el excedente, así que prueba hasta agotarlos o usa un tipo de rendimiento fijo.","Guardar en la instancia datos que importan. El instance store se pierde al detener la instancia, y hasta EBS necesita snapshots, así que decide dónde vive el estado antes del primer arranque."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"},{"url":"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html","label":"docs.aws.amazon.com: ec2 nitro instances"}]}},{"id":"cloud-lambda","parent":"cloud-compute","title":{"en":"Lambda and Serverless Compute","es":"Lambda y cómputo serverless"},"summary":{"en":"Run event-driven functions without managing servers, while accounting for execution and scaling limits.","es":"Ejecuta funciones activadas por eventos sin gestionar servidores, teniendo en cuenta sus límites de ejecución y escalado."},"details":{"en":["Lambda executes functions without customer-managed servers, but concurrency limits, scaling rates, downstream capacity and cost still require planning. An invocation has a maximum duration of 15 minutes; temporary storage and execution environments are not durable state. Reuse can help connection pooling, but persistence is not guaranteed. Initialization can affect latency. Provisioned Concurrency or supported SnapStart configurations may help selected workloads; benchmark and check compatibility. VPC access does not automatically provide Internet connectivity."],"es":["Lambda ejecuta funciones sin servidores gestionados por el cliente, pero límites de concurrencia, escalado, capacidad posterior y costes requieren planificación. Una invocación dura como máximo 15 minutos; almacenamiento temporal y entornos no son estado duradero. Reutilizar ayuda con conexiones, sin garantizar persistencia. La inicialización afecta latencia. Provisioned Concurrency o SnapStart compatible pueden ayudar; mide y verifica compatibilidad. Acceso VPC no implica Internet automático."]},"aws":{"en":"Use Provisioned Concurrency for latency-critical APIs, reserved concurrency to protect downstream systems, and Lambda destinations/DLQs for async failure handling.","es":"Usa Provisioned Concurrency para APIs críticas en latencia, concurrencia reservada para proteger sistemas aguas abajo, y destinos Lambda/DLQ para manejo de fallas asíncronas."},"question":{"en":"A Lambda-backed API has occasional 2-second latency spikes on the first request after idle periods. Why, and what mitigates it?","es":"Una API Lambda tiene picos de latencia tras períodos inactivos. ¿Cómo comprobarías si se deben a la inicialización y qué opciones evaluarías?"},"answer":{"en":"Check initialization duration and traces to test the cold-start hypothesis; also investigate DNS, connection setup and downstream latency. Reduce unnecessary initialization and package weight. If the latency objective still requires it, evaluate Provisioned Concurrency or supported SnapStart with realistic traffic and cost measurements.","es":"Comprueba duración de inicialización y trazas para probar la hipótesis de arranque en frío; investiga también DNS, conexiones y latencia posterior. Reduce inicialización y paquete innecesarios. Si el objetivo lo requiere, evalúa Provisioned Concurrency o SnapStart compatible con tráfico y coste reales."},"related":["cloud-compute","systems-memory","cloud-scaling"],"sources":[{"label":"AWS Lambda Execution Environment","url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"}],"level":"applied","learning":{"definition":{"en":"AWS Lambda runs your code in an execution environment that it creates, may reuse and eventually shuts down. Concurrency is the number of requests in flight, and Lambda provisions a separate execution environment for each concurrent request, so a default function environment handles one invocation at a time.","es":"AWS Lambda ejecuta tu código en un entorno de ejecución que crea, puede reutilizar y al final apaga. La concurrencia es el número de peticiones en vuelo, y Lambda aprovisiona un entorno de ejecución separado por cada petición concurrente, así que un entorno de función estándar atiende una invocación a la vez."},"simple":{"en":"You give AWS a function and it runs a copy when an event arrives. Each copy handles one request at a time, so ten simultaneous requests mean ten copies.","es":"Le das a AWS una función y ejecuta una copia cuando llega un evento. Cada copia atiende una petición a la vez, así que diez peticiones simultáneas significan diez copias."},"analogy":{"en":"Hiring a temporary worker for each customer who walks in, then keeping that worker nearby in case another arrives. Limit: a temp could serve a second customer while the first thinks, while a standard function environment cannot, and the first hire needs briefing, which is the cold start you pay when no warm environment exists.","es":"Contratar un temporal por cada cliente que entra y luego mantenerlo cerca por si llega otro. Límite: un temporal podría atender a un segundo cliente mientras el primero piensa, y un entorno de función estándar no puede, y la primera contratación necesita inducción, que es el arranque en frío que pagas cuando no hay un entorno caliente."},"walkthrough":{"en":["Follow one invocation. On the first request Lambda creates an environment, loads the runtime and runs your initialisation code, then calls the handler. A later request may reuse that environment and skip initialisation, which is why the same function shows two very different latencies in the same minute.","Work with that lifecycle. Create clients and read configuration during initialisation so reused environments benefit, keep the package small so the environment starts quickly, and treat anything in memory or in the temporary directory as possibly present and never as the only copy.","Then plan limits and retries. An account has a regional concurrency quota, and functions can reserve part of it, so an unbounded function can crowd out another or be throttled. Event sources commonly deliver at least once and retry on error, so handlers must be safe to run twice with the same input."],"es":["Sigue una invocación. En la primera petición Lambda crea un entorno, carga el runtime y ejecuta tu código de inicialización, y luego llama al handler. Una petición posterior puede reutilizar ese entorno y saltarse la inicialización, y por eso la misma función muestra dos latencias muy distintas en el mismo minuto.","Trabaja con ese ciclo de vida. Crea los clientes y lee la configuración durante la inicialización para que los entornos reutilizados la aprovechen, mantén el paquete pequeño para que el entorno arranque rápido, y trata lo que esté en memoria o en el directorio temporal como algo que quizá esté, nunca como la única copia.","Después planifica límites y reintentos. Una cuenta tiene una cuota regional de concurrencia, y las funciones pueden reservar parte, así que una función sin límite puede desplazar a otra o ser frenada. Las fuentes de eventos suelen entregar al menos una vez y reintentar ante error, así que los handlers deben ser seguros al ejecutarse dos veces con la misma entrada."]},"pitfalls":{"en":["Using the execution environment as a reliable cache. The platform creates and destroys environments, so state in memory or temporary files can disappear between invocations and must never be the only copy.","Ignoring concurrency when the function calls a database. Each concurrent invocation is a separate environment with its own connection, so a burst can exhaust database connections; use a connection proxy or reserved concurrency."],"es":["Usar el entorno de ejecución como una caché confiable. La plataforma crea y destruye entornos, así que el estado en memoria o en archivos temporales puede desaparecer entre invocaciones y nunca debe ser la única copia.","Ignorar la concurrencia cuando la función llama a una base de datos. Cada invocación concurrente es un entorno aparte con su propia conexión, así que una ráfaga puede agotar las conexiones; usa un proxy de conexiones o concurrencia reservada."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html","label":"docs.aws.amazon.com: lambda runtime environment"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"}]}},{"id":"cloud-containers","parent":"cloud-compute","title":{"en":"Containers: ECS, EKS and Fargate","es":"Contenedores: ECS, EKS y Fargate"},"summary":{"en":"Package an application and its dependencies, then choose how to schedule and operate containers.","es":"Empaqueta una aplicación y sus dependencias; después decide cómo desplegar y operar sus contenedores."},"details":{"en":["ECS is AWS's native orchestrator, simpler to operate and tightly integrated with IAM/CloudWatch; EKS is managed Kubernetes, chosen for portability, existing K8s tooling, or multi-cloud strategy, at the cost of more operational complexity. Both can run on EC2 (you manage node capacity/patching) or Fargate (AWS manages the underlying compute, you just specify vCPU/memory per task/pod). Fargate removes node management but costs more per vCPU-hour than a well-utilized EC2 fleet and has less control over instance type/placement."],"es":["ECS es el orquestador nativo de AWS, más simple de operar e integrado estrechamente con IAM/CloudWatch; EKS es Kubernetes gestionado, elegido por portabilidad, herramientas K8s existentes, o estrategia multi-nube, a costo de mayor complejidad operativa. Ambos pueden correr en EC2 (tu gestionas la capacidad/parches de los nodos) o Fargate (AWS gestiona el cómputo subyacente, tu solo específicas vCPU/memoria por tarea/pod). Fargate elimina la gestión de nodos pero cuesta más por vCPU-hora que una flota EC2 bien utilizada y tiene menos control sobre tipo de instancia/colocacion."]},"aws":{"en":"Choose ECS+Fargate for AWS-native simplicity with no node management; choose EKS when Kubernetes portability or existing K8s investment matters.","es":"Elige ECS+Fargate para simplicidad nativa de AWS sin gestión de nodos; elige EKS cuando importa la portabilidad de Kubernetes o la inversion existente en K8s."},"question":{"en":"A startup with no Kubernetes experience needs containers in production fast, with minimal ops overhead. What do you recommend and why?","es":"Una startup sin experiencia en Kubernetes necesita contenedores en producción rápido, con mínima carga operativa. ¿Qué recomiendas y por qué?"},"answer":{"en":"Step 1: rule out EKS unless there is a strong portability or existing-tooling reason, since it adds control-plane and node-group operational surface the team is not staffed for. Step 2: recommend ECS on Fargate, which removes node patching/capacity planning entirely and integrates natively with IAM task roles and CloudWatch. Step 3: revisit EKS later only if multi-cloud portability or specific K8s ecosystem tools become a hard requirement.","es":"Paso 1: descarta EKS a menos que haya una razon fuerte de portabilidad o herramientas existentes, ya que añade superficie operativa de plano de control y grupos de nodos para la que el equipo no está dotado. Paso 2: recomienda ECS sobre Fargate, que elimina por completo el parchado/planificación de capacidad de nodos y se integra nativamente con roles de tarea IAM y CloudWatch. Paso 3: reconsidera EKS más adelante solo si la portabilidad multi-nube o herramientas específicas del ecosistema K8s se vuelven un requisito duro."},"related":["cloud-compute","systems-processes","cloud-microservices"],"sources":[{"label":"Amazon ECS vs EKS Comparison","url":"https://aws.amazon.com/containers/"},{"url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://man7.org/linux/man-pages/man7/namespaces.7.html","label":"man7.org: namespaces.7"}],"level":"applied","learning":{"definition":{"en":"A container image is a read only stack of filesystem layers plus the metadata needed to start a process. A container is that image running as an isolated process on a shared kernel. An orchestrator places containers on capacity, restarts failed ones and connects them to networking and load balancing.","es":"Una imagen de contenedor es una pila de capas de sistema de archivos de solo lectura más los metadatos necesarios para arrancar un proceso. Un contenedor es esa imagen ejecutándose como proceso aislado sobre un kernel compartido. Un orquestador coloca contenedores en la capacidad, reinicia los que fallan y los conecta a la red y al balanceo."},"simple":{"en":"An image is a frozen, layered copy of an application and its dependencies. A container is one running copy. An orchestrator decides where copies run and replaces them when they fail.","es":"Una imagen es una copia congelada y en capas de una aplicación y sus dependencias. Un contenedor es una copia en ejecución. Un orquestador decide dónde corren las copias y las reemplaza cuando fallan."},"analogy":{"en":"A shipping container standardises cargo so any ship or truck can carry it. Limit: a steel container is identical everywhere, while an image still depends on the processor architecture and on kernel features present on the host, so an image built for one architecture will not run on another.","es":"Un contenedor de carga estandariza la mercancía para que cualquier barco o camión la lleve. Límite: un contenedor de acero es idéntico en todas partes, mientras una imagen depende de la arquitectura del procesador y de las funciones del kernel presentes en el anfitrión, así que una imagen construida para una arquitectura no corre en otra."},"walkthrough":{"en":["Begin with the image, because build order changes deployment time. Layers are cached, so putting rarely changed steps such as dependency installation before your application code makes rebuilds fast. A smaller base image also means less software to patch, which is a security gain as well as a speed one.","Then understand the control loop. You declare a desired state, such as how many copies of a task should run and how each is health checked, and the orchestrator continuously works to match reality to that declaration. Rolling deployments, restarts and placement across zones are consequences of that loop.","Finally place the AWS options. Amazon ECS is an AWS managed orchestrator, Amazon EKS runs Kubernetes, and AWS Fargate is a capacity option for either where AWS operates the underlying infrastructure and its isolation. The choice is mainly about how much control and portability you need against how much you want to operate."],"es":["Empieza por la imagen, porque el orden de construcción cambia el tiempo de despliegue. Las capas se cachean, así que poner los pasos que cambian poco, como instalar dependencias, antes del código de tu aplicación hace rápidas las reconstrucciones. Una imagen base menor también implica menos software que parchear, lo que ayuda en seguridad y en velocidad.","Después entiende el bucle de control. Declaras un estado deseado, por ejemplo cuántas copias de una tarea deben correr y cómo se comprueba la salud de cada una, y el orquestador trabaja de forma continua para que la realidad coincida con esa declaración. Los despliegues progresivos, los reinicios y la colocación entre zonas son consecuencias de ese bucle.","Por último ubica las opciones de AWS. Amazon ECS es un orquestador administrado por AWS, Amazon EKS ejecuta Kubernetes, y AWS Fargate es una opción de capacidad para cualquiera de los dos donde AWS opera la infraestructura subyacente y su aislamiento. La elección es sobre todo cuánto control y portabilidad necesitas frente a cuánto quieres operar."]},"pitfalls":{"en":["Keeping state inside the container filesystem. Containers are replaced on every deployment and on failure, so data written inside one is lost; mount a volume or use an external store.","Running without resource limits or meaningful health checks. Without limits a container can consume the host's capacity, and a health check that only confirms the process is alive keeps traffic flowing to a broken copy."],"es":["Guardar estado dentro del sistema de archivos del contenedor. Los contenedores se reemplazan en cada despliegue y ante fallos, así que lo escrito dentro se pierde; monta un volumen o usa un almacén externo.","Ejecutar sin límites de recursos ni comprobaciones de salud útiles. Sin límites un contenedor puede consumir la capacidad del anfitrión, y una comprobación que solo confirma que el proceso vive mantiene el tráfico hacia una copia rota."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://man7.org/linux/man-pages/man7/namespaces.7.html","label":"man7.org: namespaces.7"}]}},{"id":"cloud-scaling","parent":"cloud","title":{"en":"Elastic Scaling","es":"Escalado elástico"},"summary":{"en":"Add or remove capacity based on demand without moving the bottleneck somewhere else.","es":"Añade o retira capacidad según la demanda sin trasladar el cuello de botella a otro componente."},"details":{"en":["Elastic scaling adjusts capacity as demand changes. EC2 Auto Scaling can add or remove instances using scheduled or metric-based policies; health-based replacement is a separate concern. ECS Service Auto Scaling adjusts service task counts, while Fargate supplies the underlying compute without customer-managed hosts. Lambda manages execution environments, but its per-function scaling rate, account quotas, initialization and downstream capacity still bound how quickly a spike can be served. Measure the full time from a scaling signal to useful capacity.","Pitfall: setting scale-out thresholds too high (e.g., 80 percent CPU) without accounting for the time a new instance takes to become healthy, causing a request pile-up during the scale-up lag."],"es":["El escalado elástico ajusta la capacidad cuando cambia la demanda. EC2 Auto Scaling añade o retira instancias con políticas programadas o basadas en métricas; reemplazar instancias por salud es una función distinta. ECS Service Auto Scaling ajusta el número de tareas y Fargate aporta el cómputo sin hosts gestionados por el cliente. Lambda gestiona entornos de ejecución, pero el ritmo de escalado por función, las cuotas, la inicialización y las dependencias limitan la respuesta a un pico. Mide el tiempo completo desde la señal hasta disponer de capacidad útil.","Error común: fijar umbrales de escalado demasiado altos (ej. 80 por ciento de CPU) sin contar el tiempo que tarda una instancia nueva en volverse saludable, causando una acumulacion de solicitudes durante el retraso del escalado."]},"aws":{"en":"Use target tracking scaling policies with predictive scaling for known traffic patterns, and warm pools to cut launch latency for stateful bootstrapping.","es":"Usa políticas de escalado por seguimiento de objetivo con escalado predictivo para patrones de tráfico conocidos, y warm pools para reducir la latencia de lanzamiento en bootstrapping con estado."},"question":{"en":"An e-commerce site's ASG scales out correctly but users still see errors for the first 3 minutes of a traffic spike. What is the likely cause and fix?","es":"Un sitio de e-commerce escala correctamente su ASG pero los usuarios ven errores durante los primeros 3 minutos de un pico de tráfico. ¿Cuál es la causa probable y la solución?"},"answer":{"en":"Step 1: check the scale-out threshold and instance boot/warm-up time, since new instances take minutes to launch, pass health checks and warm caches/connections. Step 2: consider predictive scaling if the traffic spike is recurring and forecastable (e.g., daily sale time), letting the ASG pre-scale ahead of demand. Step 3: use warm pools or a slightly lower scale-out threshold combined with a request queue or graceful degradation to absorb the gap.","es":"Paso 1: revisa el umbral de escalado y el tiempo de arranque/calentamiento de la instancia, ya que las instancias nuevas tardan minutos en lanzarse, pasar chequeos de salud y calentar caches/conexiones. Paso 2: considera escalado predictivo si el pico de tráfico es recurrente y pronosticable (ej. hora diaria de oferta), permitiendo que el ASG escale antes de la demanda. Paso 3: usa warm pools o un umbral de escalado ligeramente más bajo combinado con una cola de solicitudes o degradación elegante para absorber la brecha."},"related":["cloud-ec2","cloud-lambda","reliability","improve-performance"],"sources":[{"label":"EC2 Auto Scaling - target tracking policies","url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html"},{"label":"Lambda scaling behavior (concurrency scaling rate)","url":"https://docs.aws.amazon.com/lambda/latest/dg/scaling-behavior.html"},{"url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/scale-your-group.html","label":"docs.aws.amazon.com: scale your group"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"}],"level":"applied","quickLinks":["improve-performance"],"learning":{"definition":{"en":"Scaling changes capacity to meet demand. Vertical scaling replaces a unit with a larger one; horizontal scaling adds or removes units. Horizontal scaling of a stateless tier needs interchangeable units, while stateful tiers scale out by sharding data across nodes or replicating it, which requires routing and rebalancing instead.","es":"Escalar es cambiar la capacidad para atender la demanda. El escalado vertical reemplaza una unidad por otra mayor; el horizontal añade o quita unidades. El escalado horizontal de una capa sin estado exige unidades intercambiables, mientras las capas con estado escalan repartiendo los datos en fragmentos entre nodos o replicándolos, lo que exige enrutado y rebalanceo."},"simple":{"en":"You can get a bigger machine or more machines. For a stateless tier any machine can serve any request; for a data tier each node owns a slice or a copy, so requests must be routed to the right one.","es":"Puedes conseguir una máquina más grande o más máquinas. En una capa sin estado cualquier máquina atiende cualquier petición; en una capa de datos cada nodo posee un fragmento o una copia, así que hay que enrutar la petición al correcto."},"analogy":{"en":"Opening more checkout lanes rather than training one cashier to work faster. Limit: a new lane opens the moment staff walk over, while a new instance needs launch, boot, application start and health checks before it takes traffic, so scaling reacts on a delay and a metric spike may be over before capacity arrives.","es":"Abrir más cajas en vez de entrenar a un cajero para ir más rápido. Límite: una caja nueva abre en cuanto llega el personal, mientras una instancia nueva necesita lanzarse, arrancar, iniciar la aplicación y pasar comprobaciones antes de recibir tráfico, así que el escalado reacciona con retraso y un pico puede terminar antes de que llegue la capacidad."},"walkthrough":{"en":["For a web or application tier, make the units interchangeable first. Move sessions to a shared store, uploads to object storage and configuration out of the image. Only then does replacing an unhealthy unit become routine rather than an incident.","Choose the scaling method from the demand pattern. Target tracking keeps a metric such as average utilisation near a set value and suits smooth traffic. Step scaling reacts in stages to larger deviations. Scheduled scaling handles known events such as a campaign start, and predictive scaling anticipates a recurring daily shape.","Then respect the timing. AWS recommends a default instance warmup so a new instance does not report metrics before it is ready, and cooldowns prevent a burst of scaling actions. Scaling also has floors and ceilings: quotas, downstream database connections and licence limits can bind before the group reaches its maximum."],"es":["En una capa web o de aplicación, haz primero que las unidades sean intercambiables. Mueve las sesiones a un almacén compartido, las cargas de archivos a almacenamiento de objetos y la configuración fuera de la imagen. Solo entonces reemplazar una unidad dañada se vuelve rutina y no un incidente.","Elige el método de escalado según el patrón de demanda. El seguimiento de objetivo mantiene una métrica, como el uso promedio, cerca de un valor fijado y encaja con tráfico suave. El escalado por pasos reacciona por tramos ante desviaciones mayores. El escalado programado cubre eventos conocidos, como el inicio de una campaña, y el predictivo anticipa una forma diaria recurrente.","Después respeta los tiempos. AWS recomienda un calentamiento de instancia por defecto para que una instancia nueva no reporte métricas antes de estar lista, y los periodos de enfriamiento evitan una ráfaga de acciones de escalado. El escalado también tiene suelos y techos: cuotas, conexiones a la base de datos y límites de licencia pueden atar antes de que el grupo alcance su máximo."]},"pitfalls":{"en":["Scaling the stateless tier onto a database that cannot take it. Doubling application instances doubles connections and queries, so the bottleneck simply moves; check the data tier's limits before raising the maximum.","Setting aggressive thresholds without warmup. New units report metrics while still starting, which can trigger further scaling and then a matching scale in, producing oscillation instead of stability."],"es":["Escalar la capa sin estado sobre una base de datos que no lo aguanta. Duplicar instancias de aplicación duplica conexiones y consultas, así que el cuello de botella solo se mueve; revisa los límites de la capa de datos antes de subir el máximo.","Fijar umbrales agresivos sin calentamiento. Las unidades nuevas reportan métricas mientras aún arrancan, lo que puede disparar más escalado y luego una reducción equivalente, produciendo oscilación en vez de estabilidad."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/scale-your-group.html","label":"docs.aws.amazon.com: scale your group"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"}]}},{"id":"cloud-distributed-systems","parent":"cloud","title":{"en":"Distributed Applications","es":"Aplicaciones distribuidas"},"summary":{"en":"Coordinate components across a network where delays and partial failures are normal.","es":"Coordina componentes a través de una red en la que los retrasos y los fallos parciales son normales."},"details":{"en":["A distributed application splits work across independently deployable, independently scalable services communicating over a network rather than in-process. This buys resilience and independent scaling but introduces new failure modes: partial failures, network latency/partitions, and the need for idempotency since a message or call can be retried after an ambiguous failure (did it actually apply or not?)."],"es":["Una aplicación distribuida divide el trabajo entre servicios desplegables y escalables de forma independiente que se comunican por red en lugar de en proceso. Esto compra resiliencia y escalado independiente pero introduce nuevos modos de falla: fallas parciales, latencia/particiones de red, y la necesidad de idempotencia ya que un mensaje o llamada puede reintentarse tras una falla ambigua (se aplico realmente o no?)."]},"aws":{"en":"SQS, SNS, EventBridge and Step Functions are the primary AWS building blocks for decoupling and orchestrating distributed workflows.","es":"SQS, SNS, EventBridge y Step Functions son los bloques principales de AWS para desacoplar y orquestar flujos de trabajo distribuidos."},"question":{"en":"Why is idempotency a first-class design concern in distributed systems, not just a nice-to-have?","es":"¿Por qué la idempotencia es una preocupación de diseño de primera clase en sistemas distribuidos, no solo algo deseable?"},"answer":{"en":"Step 1: recognize that network calls can fail after the operation partially succeeded server-side but before the client gets a confirmation, an ambiguous outcome. Step 2: without idempotency, a naive retry (which is often the only sane recovery action) can double-apply the operation, e.g. double-charging a payment. Step 3: design operations with idempotency keys or natural idempotency (e.g., an upsert by ID) so retries are always safe, this is required for at-least-once delivery systems like SQS.","es":"Paso 1: reconoce que las llamadas de red pueden fallar después de que la operación tuvo éxito parcial en el servidor pero antes de que el cliente reciba confirmacion, un resultado ambiguo. Paso 2: sin idempotencia, un reintento simple (que a menudo es la única accion de recuperación sensata) puede aplicar la operación dos veces, ej. cobrar un pago dos veces. Paso 3: diseña las operaciones con claves de idempotencia o idempotencia natural (ej. un upsert por ID) para que los reintentos siempre sean seguros, esto es necesario para sistemas de entrega al menos una vez como SQS."},"related":["cloud-queues-messaging","cloud-microservices","data-consistency"],"sources":[{"label":"Amazon SQS standard queues (at-least-once delivery, possible duplicates)","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html"},{"url":"https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/microservices-on-aws.html","label":"docs.aws.amazon.com: microservices on aws"}],"level":"foundation","learning":{"definition":{"en":"A distributed system is several machines cooperating over a network they cannot fully trust. Its defining property is partial failure: one component can be slow or unreachable while the rest works, and a caller usually cannot tell a lost request from a slow one.","es":"Un sistema distribuido son varias máquinas cooperando sobre una red en la que no pueden confiar del todo. Su propiedad definitoria es el fallo parcial: un componente puede estar lento o inalcanzable mientras el resto funciona, y quien llama no suele poder distinguir una petición perdida de una lenta."},"simple":{"en":"When work spans machines, parts of the system can fail on their own. A caller that gets no answer does not know whether the work happened, so it must be able to ask again safely.","es":"Cuando el trabajo abarca varias máquinas, partes del sistema pueden fallar por su cuenta. Quien llama y no recibe respuesta no sabe si el trabajo ocurrió, así que debe poder preguntar de nuevo sin riesgo."},"analogy":{"en":"Posting a letter with no delivery confirmation: silence could mean lost, delayed, or delivered with the reply lost. Limit: a postal service eventually tells you, while a timeout never distinguishes the cases, which is exactly why idempotency and request identifiers are needed rather than better guessing.","es":"Enviar una carta sin acuse de recibo: el silencio puede significar perdida, retrasada, o entregada con la respuesta perdida. Límite: el correo acaba informándote, mientras un tiempo de espera agotado nunca distingue los casos, y por eso hacen falta idempotencia e identificadores de petición en lugar de suposiciones mejores."},"walkthrough":{"en":["Set a timeout on every remote call, because the alternative is waiting forever and holding a thread. Then decide what a timeout means for your operation: a read with no side effects is usually safe to retry within a retry budget, while a payment must carry a client supplied identifier so the server can recognise a repeat and not charge twice.","Retry carefully. Immediate retries from many clients turn a brief slowdown into an outage, so use exponential backoff with random jitter and a retry budget. A circuit breaker that stops calling a failing dependency for a short period gives it room to recover and fails fast for the caller.","Then design for degradation rather than perfection. Decide in advance which features can return stale or partial data when a dependency is down, and make failures visible with request identifiers propagated across services. Correlating timestamps across components suggests where to look, but it does not by itself establish cause."],"es":["Pon un tiempo de espera en cada llamada remota, porque la alternativa es esperar para siempre ocupando un hilo. Después decide qué significa ese vencimiento para tu operación: una lectura sin efectos secundarios suele ser segura de reintentar dentro de un presupuesto, mientras un pago debe llevar un identificador puesto por el cliente para que el servidor reconozca la repetición y no cobre dos veces.","Reintenta con cuidado. Los reintentos inmediatos de muchos clientes convierten una lentitud breve en una caída, así que usa retroceso exponencial con algo de aleatoriedad y un presupuesto de reintentos. Un interruptor que deja de llamar a una dependencia que falla durante un rato le da espacio para recuperarse y falla rápido para quien llama.","Luego diseña para degradar, no para la perfección. Decide de antemano qué funciones pueden devolver datos viejos o parciales cuando una dependencia está caída, y haz visibles los fallos propagando identificadores de petición entre servicios. Correlacionar horas entre componentes sugiere dónde mirar, pero por sí solo no establece la causa."]},"pitfalls":{"en":["Retrying a non idempotent operation after a timeout. The first attempt may have succeeded, so the retry duplicates the effect; give the operation a client generated identifier and have the server deduplicate.","Using one long timeout for every call. A timeout longer than the caller's own deadline just ties up threads and spreads the failure upstream, so set budgets per hop and fail fast when the budget is gone."],"es":["Reintentar una operación no idempotente tras un tiempo de espera agotado. El primer intento pudo tener éxito, así que el reintento duplica el efecto; dale a la operación un identificador generado por el cliente y que el servidor deduplique.","Usar un solo tiempo de espera largo para todas las llamadas. Un vencimiento mayor que el plazo de quien llama solo ocupa hilos y propaga el fallo hacia arriba, así que fija presupuestos por salto y falla rápido cuando se agotan."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"},{"url":"https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/microservices-on-aws.html","label":"docs.aws.amazon.com: microservices on aws"}]}},{"id":"cloud-queues-messaging","parent":"cloud-distributed-systems","title":{"en":"Queues, Pub/Sub and Event-Driven Messaging","es":"Colas, pub/sub y mensajería orientada a eventos
