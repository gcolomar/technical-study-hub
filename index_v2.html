ccidentales."},"spanTop":{"label":{"en":"Application Load Balancer, enabled in both zones","es":"Application Load Balancer, habilitado en las dos zonas"},"note":{"en":"Health checks identify usable application targets. Configure them to reflect whether a server can actually handle a request, not merely whether its process is running.","es":"Las comprobaciones de salud identifican destinos disponibles. Configúralas para comprobar si el servidor puede atender una petición, no solo si su proceso está arrancado."}},"zones":[{"label":{"en":"Availability Zone A","es":"Zona de disponibilidad A"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Plan enough remaining capacity to handle the failure. Scaling takes time and cannot substitute for capacity that must be available immediately.","es":"Prevé capacidad suficiente para atender tras el fallo. Escalar lleva tiempo y no sustituye a la capacidad que deba estar disponible de inmediato."}},{"label":{"en":"RDS DB instance, primary","es":"Instancia de base de datos RDS, primaria"},"note":{"en":"Takes the reads and writes in this deployment option.","es":"Recibe las lecturas y escrituras en esta opción de despliegue."}}]},{"label":{"en":"Availability Zone B","es":"Zona de disponibilidad B"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Use the same application configuration. Store shared session data outside any single server so another server can continue the work.","es":"Usa la misma configuración de aplicación. Guarda las sesiones compartidas fuera de un servidor concreto para que otro pueda continuar el trabajo."}},{"label":{"en":"RDS standby, synchronous","es":"Copia en espera RDS, sincrónica"},"note":{"en":"In a Multi-AZ DB instance deployment the standby serves no traffic. It is not a read replica and not a backup.","es":"En un despliegue de instancia Multi-AZ, la copia en espera no atiende tráfico. No es una réplica de lectura ni una copia de seguridad."}}]}],"spanBottom":{"label":{"en":"Auto Scaling group across both zones","es":"Grupo de auto escalado en las dos zonas"},"note":{"en":"The Auto Scaling group manages application capacity across both zones. Separately, RDS promotes the standby during failover and updates its endpoint. Applications must reconnect. Backups are still needed to recover an accidentally deleted table.","es":"El grupo de Auto Scaling gestiona la capacidad de aplicación en ambas zonas. Por separado, RDS promueve la copia en espera durante el failover y actualiza su endpoint. Las aplicaciones deben reconectar. Siguen haciendo falta backups para recuperar una tabla borrada por error."}}}]},{"id":"observability","parent":"architecture","title":{"en":"Observability","es":"Observabilidad"},"summary":{"en":"Connect customer symptoms to internal operations by correlating measurements, event records and request paths.","es":"Relaciona los síntomas del cliente con operaciones internas correlacionando mediciones, registros de eventos y recorridos de solicitudes."},"details":{"en":["Keep order IDs in logs and traces rather than using each ID as a metric dimension. A dimension separates a metric into distinct time series; unlimited unique IDs can multiply those series and their cost while making aggregate views harder to use."],"es":["Guarda los identificadores de pedido en logs y trazas en vez de usar cada identificador como dimensión de una métrica. Una dimensión separa la métrica en series temporales distintas; un flujo ilimitado de identificadores únicos puede multiplicar las series y su coste, además de dificultar las vistas agregadas."]},"aws":{"en":"For the shop, configure CloudWatch alarms on checkout errors and latency, collect structured logs there, and export instrumented request traces to X-Ray through OpenTelemetry to inspect slow inventory calls.","es":"Para la tienda, configura alarmas de CloudWatch sobre errores y latencia de compra, recoge allí logs estructurados y exporta trazas instrumentadas a X-Ray mediante OpenTelemetry para investigar las llamadas lentas al inventario."},"question":{"en":"Checkout failures doubled after a deployment, but CPU alarms stayed silent. What evidence would you examine before rolling back?","es":"Los fallos al finalizar la compra se duplicaron tras un despliegue, pero no saltaron las alarmas de CPU. ¿Qué pruebas examinarías antes de volver a la versión anterior?"},"answer":{"en":"Check checkout failure rate and latency around the deployment, separating affected versions or routes where possible. Follow failed-request traces to the operation that failed, then inspect correlated logs. Low CPU does not reveal whether a remote dependency is rejecting requests. Compare the new version with the previous one, recognising that timing alone does not prove causation. If customer impact is severe, use the agreed rollback procedure while preserving evidence for further diagnosis.","es":"Revisa la tasa de compras fallidas y la latencia alrededor del despliegue, separando versiones o rutas si puedes. Sigue trazas de solicitudes fallidas hasta la operación problemática y consulta sus logs relacionados. Una CPU poco ocupada no indica si una dependencia remota rechaza solicitudes. Compara la versión nueva con la anterior: coincidir en el tiempo no demuestra causalidad. Si el impacto es grave, aplica el procedimiento acordado para volver a la versión anterior mientras conservas pruebas para investigar."},"related":["cloud-microservices","reliability","systems-processes","improve-operations"],"sources":[{"label":"Amazon CloudWatch Concepts","url":"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html"},{"label":"AWS X-Ray Developer Guide","url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}],"level":"applied","quickLinks":["improve-operations"],"learning":{"definition":{"en":"Observability is the ability to explain system behaviour from the evidence it emits. Its purpose is to connect a symptom, such as slow checkout, to the internal activity that can account for it.","es":"La observabilidad es la capacidad de explicar el comportamiento de un sistema a partir de las señales que genera. Permite relacionar un síntoma, como una compra lenta, con la actividad interna que puede explicarlo."},"simple":{"en":"Applications emit signals that engineers examine together. A metric measures something over time, such as the share of failed purchases. A log records an event with context, such as an inventory lookup timing out. A trace connects the work done for one request across services. Instrumentation is the code or configuration producing these signals and passing a shared trace identifier between services. Correlating them lets engineers move from a widespread symptom to specific operations instead of guessing from machine health.","es":"Las aplicaciones emiten señales que los ingenieros analizan conjuntamente. Una métrica mide algo en el tiempo, como la proporción de compras fallidas. Un registro, o log, describe un evento con contexto, como una consulta de inventario que agota su tiempo de espera. Una traza enlaza las operaciones de una solicitud entre servicios. La instrumentación es el código o configuración que genera esas señales y transmite un identificador de traza común. Correlacionarlas permite pasar del síntoma a operaciones concretas, sin depender solo del estado de las máquinas."},"analogy":{"en":"Investigating a delayed parcel uses depot totals, individual scan records and its route. Together they explain where time went. Software needs equivalent identifiers; unlike parcels, a request can branch into simultaneous work.","es":"Investigar un paquete retrasado requiere totales del almacén, registros de escaneo y su recorrido. Juntos explican dónde se perdió tiempo. El software necesita identificadores equivalentes, pero una solicitud puede ramificarse en tareas simultáneas."},"walkthrough":{"en":["A shop sees checkout p99 latency rise from one to four seconds. This percentile marks the time within which roughly 99% of measured requests finish. CPU use stays ordinary, so that infrastructure metric alone would miss the problem.","An engineer inspects traces for slow checkouts and finds most elapsed time inside inventory calls. Shared trace identifiers link those calls to logs showing repeated connection attempts after a database endpoint changed.","The team corrects the endpoint configuration and watches checkout latency and errors during rollout. Fresh traces show shorter inventory calls. This comparison supports the explanation; one quick request would not establish recovery for everyone."],"es":["Una tienda observa que la latencia p99 al finalizar la compra pasa de uno a cuatro segundos. Ese percentil indica el tiempo en el que termina aproximadamente el 99 % de las solicitudes medidas. La CPU sigue en niveles habituales, por lo que ese dato aislado no revelaría el problema.","Un ingeniero examina trazas de compras lentas y encuentra que las llamadas al inventario concentran casi todo el tiempo. Los identificadores compartidos enlazan esas llamadas con logs de intentos repetidos de conexión tras cambiar la dirección de la base de datos.","El equipo corrige la dirección configurada y observa la latencia y los errores durante el despliegue. Las nuevas trazas muestran llamadas al inventario más breves. La comparación respalda la explicación; una única solicitud rápida no demostraría la recuperación para todos."]},"pitfalls":{"en":["Signals without consistent timestamps and identifiers leave disconnected clues. Also, never put payment details or passwords into diagnostic records.","An average can hide a slow minority, and sampled traces can miss rare failures. Keep aggregate user-outcome metrics alongside selected request traces."],"es":["Las señales sin marcas de tiempo e identificadores coherentes dejan pistas inconexas. Además, nunca incluyas datos de pago ni contraseñas en registros de diagnóstico.","Una media puede ocultar una minoría lenta, y el muestreo de trazas puede omitir fallos poco frecuentes. Conserva métricas agregadas del resultado para el usuario junto con las trazas seleccionadas."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html","label":"docs.aws.amazon.com: cloudwatch concepts"},{"url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html","label":"docs.aws.amazon.com: aws xray"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}]}},{"id":"cost-optimization","parent":"architecture","title":{"en":"Cost Optimization","es":"Optimización de costes"},"summary":{"en":"Reduce cost per useful result, keeping service requirements visible when judging a saving.","es":"Reduce el coste por resultado útil y ten presentes los requisitos del servicio al valorar un ahorro."},"details":{"en":["Cost per completed report can look better if failed jobs are excluded from the bill. Include retries, orchestration, storage and relevant data transfer in the same accounting boundary, counting only valid delivered reports as output. Keep that boundary unchanged when comparing alternatives."],"es":["El coste por informe completado puede parecer menor si se excluyen los procesos fallidos de la factura. Incluye reintentos, orquestación, almacenamiento y transferencias pertinentes dentro del mismo perímetro de costes, contando como resultado solo los informes válidos entregados. Mantén ese perímetro al comparar alternativas."]},"aws":{"en":"For reporting, run AWS Batch workers on EC2 Spot with configured retries and application checkpoints in S3. Apply S3 Lifecycle transitions to retained reports only after checking retrieval needs and minimum storage charges.","es":"Para los informes, ejecuta tareas de AWS Batch en EC2 Spot con reintentos configurados y puntos de control de la aplicación en S3. Aplica transiciones de S3 Lifecycle a los informes conservados tras revisar las necesidades de recuperación y los cargos mínimos de almacenamiento."},"question":{"en":"Finance wants to remove the idle standby database because it adds cost but produces no reports. Would you include that in the same saving as smaller workers?","es":"Finanzas quiere retirar la base de datos de reserva porque añade coste, pero no produce informes. ¿Incluirías ese cambio en el mismo ahorro que usar servidores más pequeños?"},"answer":{"en":"Treat it separately because the standby provides recovery capacity rather than report throughput. Smaller workers preserved the tested deadline; removing the standby changes the consequences of a database failure. Estimate the longer outage and potential data loss, then compare them with agreed recovery objectives and business impact. If those requirements stay unchanged, an apparently idle replica may still be necessary. Present the recurring saving alongside the changed recovery behaviour so the service owner can make an informed decision.","es":"Trátalo aparte: la réplica aporta capacidad de recuperación, no informes. Los servidores más pequeños cumplieron el plazo en las pruebas; retirar la réplica cambia las consecuencias de una avería. Estima la interrupción y la posible pérdida de datos, y compáralas con los objetivos de recuperación y el impacto empresarial. Si esos requisitos no cambian, la réplica aparentemente ociosa puede seguir siendo necesaria. Presenta el ahorro recurrente junto con las nuevas condiciones de recuperación para que el responsable decida con conocimiento de causa."},"related":["cloud-ec2","well-architected","reliability","improve-cost"],"sources":[{"label":"AWS Well-Architected Cost Optimization Pillar","url":"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}],"level":"applied","quickLinks":["improve-cost"],"learning":{"definition":{"en":"Cost optimization continually aligns spending with the resources needed to deliver a useful outcome. It seeks lower cost while respecting agreed requirements for performance, recovery and data retention.","es":"Optimizar costes consiste en ajustar de forma continua el gasto a los recursos necesarios para obtener un resultado útil. Busca reducir el coste respetando los requisitos acordados de rendimiento, recuperación y conservación de datos."},"simple":{"en":"A team pays for computing time, stored data and network transfers. Some spending supports completed work; some supports idle capacity or unnecessary copies. Right-sizing means matching resource capacity to measured demand, including required peaks. A unit cost, such as cost per completed report, connects spending to output. Engineers change a cost driver and compare unit cost and service results. A cheaper server can increase the total bill if slower processing requires enough extra runtime.","es":"Un equipo paga por tiempo de cómputo, datos almacenados y transferencias de red. Parte del gasto permite completar trabajo; otra parte mantiene capacidad ociosa o copias innecesarias. Dimensionar consiste en ajustar la capacidad a la demanda medida, con sus picos. El coste unitario, como el coste por informe completado, relaciona gasto y resultados. Los ingenieros modifican un factor del coste y comparan coste unitario y servicio. Un servidor más barato puede encarecer la factura si necesita muchas más horas de ejecución."},"analogy":{"en":"A café reduces waste by brewing smaller batches during quiet hours. Removing its backup machine also saves money but may prolong disruption after a breakdown. Unlike café equipment, computing capacity can often be resized automatically.","es":"Una cafetería desperdicia menos si prepara menos café en horas tranquilas. Retirar la máquina de reserva ahorra, pero puede alargar las interrupciones. A diferencia de esas máquinas, la capacidad informática suele poder ajustarse automáticamente."},"walkthrough":{"en":["A team produces 10,000 sales reports nightly for $20, or $0.002 each. Processing takes two hours against a four-hour deadline. Measurements show substantial unused memory, so the team tests smaller workers.","With smaller workers, the same reports cost $15, or $0.0015 each, and finish in three hours. The team checks output correctness and repeats the test with month-end volume before changing the nightly workload.","Reporting runs only a few hours daily, so the team does not treat that burst as an all-day baseline for a usage commitment. It keeps tracking cost per report and missed deadlines as volume changes."],"es":["Un equipo genera 10.000 informes de ventas cada noche por 20 dólares, es decir, 0,002 dólares cada uno. Los procesos terminan en dos horas y el plazo es de cuatro. Las mediciones muestran mucha memoria sin utilizar, así que el equipo prueba servidores más pequeños.","Con esos servidores, los mismos informes cuestan 15 dólares, o 0,0015 dólares cada uno, y terminan en tres horas. El equipo comprueba que los resultados sean correctos y repite la prueba con el volumen de cierre de mes antes de cambiar el proceso nocturno.","Los informes solo consumen unas horas diarias, así que el equipo no toma ese pico como consumo estable durante todo el día para contratar un compromiso de gasto. Sigue midiendo el coste por informe y los incumplimientos del plazo cuando cambia el volumen."]},"pitfalls":{"en":["Savings Plans and Reserved Instances exchange commitments for discounted rates. Charges continue when eligible workloads stop; match their terms to steady demand after removing waste.","Interruptible compute suits restartable work, not every job. Storage transitions can add retrieval charges or waiting time; examine the full access pattern before moving rarely used data."],"es":["Savings Plans y Reserved Instances ofrecen tarifas reducidas a cambio de compromisos. Los cargos continúan aunque se detengan las cargas elegibles; ajusta sus condiciones a la demanda estable después de eliminar el desperdicio.","La capacidad de cómputo interrumpible encaja con trabajo reiniciable, no con cualquier proceso. Cambiar de clase de almacenamiento puede añadir cargos de recuperación o esperas; analiza el patrón de acceso completo antes de mover datos poco consultados."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}]}},{"id":"migration","parent":"architecture","title":{"en":"Migration Strategy","es":"Estrategia de migración"},"summary":{"en":"Choose the change each application needs, then prove its business transactions survive the move.","es":"Decide qué cambio necesita cada aplicación y comprueba que sus operaciones de negocio funcionan tras el traslado."},"details":{"en":["After traffic moves, scheduled jobs can still run in both environments. Assign each job one active owner and verify outbound integrations before decommissioning; changing user traffic does not stop the old system."],"es":["Después de mover el tráfico, los trabajos programados pueden seguir ejecutándose en ambos entornos. Asigna cada trabajo a un único entorno activo y verifica las integraciones de salida antes de retirar el anterior; cambiar el tráfico de usuarios no lo detiene."]},"aws":{"en":"For compatible dispatch servers, AWS Application Migration Service can replicate them to AWS and launch test Amazon EC2 instances. Test warehouse printing and partner connectivity before switching production.","es":"Para servidores de expedición compatibles, AWS Application Migration Service permite replicarlos en AWS y lanzar instancias de prueba de Amazon EC2. Comprueba las impresoras y la conexión con el socio antes de cambiar producción."},"question":{"en":"A distributor has 90 days to leave its data centre, but its dispatch application works. Would you redesign it during the move?","es":"Una distribuidora tiene 90 días para dejar su centro de datos y su aplicación de expediciones funciona. ¿La rediseñarías durante el traslado?"},"answer":{"en":"I would first test whether rehosting can meet the exit date, because the application serves the business and redesign adds work. The decision depends on printer integration, partner connectivity, licensing and the permitted outage. I would rehearse representative orders and agree who can stop the switch. If those checks expose a blocker, I would change the plan. Returning to the old system must also account for orders accepted after the move.","es":"Primero comprobaría si un rehost permite cumplir el plazo, porque la aplicación ya resuelve la necesidad y rediseñarla añade trabajo. La decisión depende de las impresoras, la conexión con el socio, las licencias y la interrupción admisible. Ensayaría pedidos representativos y acordaría quién puede detener el cambio. Si aparece un impedimento, ajustaría el plan. Para volver al sistema anterior habría que incorporar también los pedidos aceptados después del traslado."},"related":["architecture-discovery","cost-optimization","cloud-ec2"],"sources":[{"label":"AWS Prescriptive Guidance - the 7 Rs migration strategies","url":"https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"},{"label":"AWS cloud migration","url":"https://aws.amazon.com/cloud-migration/"}],"level":"applied","learning":{"definition":{"en":"A migration strategy decides what should happen to an application when an organisation changes its hosting environment. Its purpose is to connect the business goal to a feasible amount of technical change, rather than simply move machines.","es":"Una estrategia de migración decide qué debe ocurrir con una aplicación cuando una organización cambia su entorno de alojamiento. Su propósito es relacionar el objetivo de negocio con unos cambios técnicos viables, más allá del traslado de máquinas."},"simple":{"en":"The business owner confirms whether an application is needed; engineers map its dependencies, the systems it relies on. Retire removes it, retain keeps it in place, and repurchase replaces it with a purchased product. Rehost moves servers with little application change; relocate moves their platform environment. Replatform changes selected components, while refactor/re-architect changes the design. Each application gets a choice suited to its constraints, since changes consume time and can disrupt connected systems.","es":"El responsable de negocio confirma si la aplicación hace falta; los ingenieros identifican sus dependencias, los sistemas que necesita. Retire la retira, retain la mantiene y repurchase la sustituye por un producto adquirido. Rehost mueve servidores con pocos cambios en la aplicación; relocate traslada su plataforma. Replatform modifica componentes concretos; refactor/re-architect cambia el diseño. Cada aplicación recibe una propuesta ajustada a sus limitaciones, porque los cambios consumen tiempo y pueden afectar a los sistemas conectados."},"analogy":{"en":"Moving a bakery can mean carrying the ovens to new premises or changing how bread is made. Software presents similar choices, but its live records also need continuity during the move.","es":"Trasladar una panadería puede consistir en mover los hornos o cambiar cómo se hace el pan. El software plantea decisiones parecidas, pero sus registros activos también necesitan continuidad durante el traslado."},"walkthrough":{"en":["A distributor must leave its data centre in 90 days. Its working dispatch application depends on warehouse printers and a partner connection, so those links become part of the migration scope.","The team proposes rehosting, checks licensing and data-location obligations, then rehearses representative orders in the destination environment. The permitted outage and recovery needs determine whether the proposed switch is workable.","Operators pause order entry for a final data sync, validate dispatches, then reopen entry. If they later return to the old system, they must reconcile orders accepted after the switch."],"es":["Una distribuidora debe dejar su centro de datos en 90 días. Su aplicación de expediciones funciona, pero depende de impresoras del almacén y una conexión con un socio; ambos enlaces entran en el alcance de la migración.","El equipo propone rehost, revisa las licencias y las obligaciones de ubicación de datos, y ensaya pedidos representativos en el destino. La interrupción admisible y las necesidades de recuperación determinan si el cambio propuesto es viable.","Los operadores pausan la entrada de pedidos para sincronizar los últimos datos, validan las expediciones y reabren la entrada. Si después vuelven al sistema anterior, deberán reconciliar los pedidos aceptados tras el cambio."]},"pitfalls":{"en":["A redesign can consume the time needed to leave the building. Extra engineering needs a business benefit that justifies its cost and risk.","A server that starts successfully may still fail to print a dispatch label. Validate the business transaction, not just whether the machine runs."],"es":["Un rediseño puede consumir el tiempo necesario para abandonar el edificio. El trabajo adicional necesita un beneficio de negocio que justifique su coste y riesgo.","Un servidor puede arrancar y aun así no imprimir una etiqueta de expedición. Valida la operación de negocio, además de comprobar que la máquina funciona."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html","label":"docs.aws.amazon.com: migration strategies"},{"url":"https://aws.amazon.com/cloud-migration/","label":"aws.amazon.com: cloud migration"}]}},{"id":"system-design-interview","parent":"architecture","title":{"en":"System Design Interview Practice","es":"Práctica de entrevista de diseño de sistemas"},"summary":{"en":"Justify each component by tracing a user request against explicit behaviour and traffic assumptions.","es":"Justifica cada componente siguiendo una petición con hipótesis explícitas sobre comportamiento y tráfico."},"details":{"en":["Storage growth and write contention are different constraints. Ten thousand small bookings may occupy little space, while simultaneous attempts to claim one popular seat still compete for the same record."],"es":["El crecimiento del almacenamiento y la competencia entre escrituras son limitaciones distintas. Diez mil reservas pequeñas pueden ocupar poco, mientras los intentos simultáneos de conseguir una plaza muy solicitada compiten por el mismo registro."]},"aws":{"en":"Amazon RDS for PostgreSQL can store workshop seats. A transaction conditionally claims an unallocated seat and checks the affected row count before confirming the booking.","es":"Amazon RDS for PostgreSQL puede almacenar las plazas de los talleres. Una transacción asigna una plaza solo si sigue libre y comprueba cuántas filas ha modificado antes de confirmar la reserva."},"question":{"en":"The interviewer asks for workshop seat booking but provides no traffic figures. How would you reach a defensible first design?","es":"El entrevistador pide diseñar reservas de plazas en talleres sin aportar cifras de tráfico. ¿Cómo llegarías a un primer diseño que puedas justificar?"},"answer":{"en":"I would clarify booking behaviour, exclusive seat ownership and excluded features. Without traffic figures, I would propose a peak-minute assumption and say it needs confirmation. That gives an approximate request rate for an initial API and transactional database. I would explain how one seat is claimed and the result returned, then examine conflicting attempts and retries. Additional components should follow a requirement or observed bottleneck, with the uncertain assumptions kept visible.","es":"Aclararía cómo se reserva, si cada plaza debe tener un único titular y qué funciones quedan fuera. Sin cifras de tráfico, propondría una hipótesis para el minuto de mayor demanda y pediría confirmarla. Obtendría así una escala aproximada para una API y una base de datos transaccional. Explicaría cómo se asigna una plaza y se devuelve el resultado, y después analizaría solicitudes simultáneas y reintentos. Añadiría componentes cuando un requisito o problema observado los justificase, dejando claras las hipótesis pendientes."},"related":["architecture-discovery","data-caching","cloud-scaling"],"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}],"level":"applied","learning":{"definition":{"en":"System design practice is explaining how a proposed system would meet user needs within practical limits. It makes the reasoning behind each component visible, so another person can challenge assumptions and follow a request through the design.","es":"Practicar diseño de sistemas consiste en explicar cómo una propuesta atendería las necesidades del usuario dentro de unas limitaciones reales. Permite mostrar el razonamiento de cada componente, cuestionar las hipótesis y seguir el recorrido de una petición."},"simple":{"en":"The interviewer supplies a problem; the candidate turns it into observable behaviours and agrees what is outside scope. Describe the access pattern, meaning which data is read or changed and how often, then estimate traffic. Draw the smallest complete request path that meets those needs. These assumptions justify the components: frequent reads and conflicting updates need different handling. Once that path works on paper, examine failures and larger workloads.","es":"El entrevistador plantea un problema; el candidato lo convierte en comportamientos observables y acuerda qué queda fuera. Describe el patrón de acceso, es decir, qué datos se leen o cambian y con qué frecuencia, y estima el tráfico. Dibuja el recorrido completo más sencillo que atienda esas necesidades. Las hipótesis justifican los componentes: las lecturas frecuentes y las actualizaciones incompatibles necesitan tratamientos distintos. Cuando el recorrido funcione sobre el papel, examina fallos y cargas mayores."},"analogy":{"en":"Planning a theatre entrance starts with crowd size and acceptable queues before choosing gates. An interview follows that logic, although software also needs rules for conflicting requests and lost connections.","es":"Planificar la entrada de un teatro empieza por el público previsto y las colas admisibles, antes de elegir puertas. La entrevista sigue esa lógica, aunque el software también necesita reglas ante peticiones incompatibles y conexiones perdidas."},"walkthrough":{"en":["For workshop booking, agree that a seat can have only one owner and payments are outside scope. Assume 6,000 visitors in the busiest minute, each reading availability three times; one in five attempts a booking.","That suggests 300 reads and 20 booking attempts per second, before sharper bursts. Draw a client, an application interface (API) and a transactional database. One database operation checks and claims a free seat together.","Save an email task with the booking transaction and let a background worker send it. Now examine simultaneous claims and lost responses; a unique request identifier helps recognise retries of the same booking."],"es":["Para reservar plazas en talleres, acordad que cada plaza solo tenga un titular y que los pagos queden fuera. Supón 6.000 visitantes en el minuto de mayor demanda, con tres consultas de disponibilidad cada uno; uno de cada cinco intenta reservar.","Eso sugiere 300 lecturas y 20 intentos de reserva por segundo, sin contar ráfagas más intensas. Dibuja un cliente, una interfaz de aplicación (API) y una base de datos transaccional. Una operación comprueba y asigna conjuntamente una plaza libre.","Guarda una tarea de correo en la transacción de reserva y deja que otro proceso la envíe en segundo plano. Después analiza solicitudes simultáneas y respuestas perdidas; un identificador único permite reconocer reintentos de una misma reserva."]},"pitfalls":{"en":["A cached seat count may be old when a booking arrives. The write path must still prevent two people from claiming the same seat.","A daily average hides short arrival spikes. State the origin of each estimate and explore larger bursts before treating it as a capacity requirement."],"es":["Una cifra de plazas guardada en caché puede quedar desactualizada al reservar. La escritura debe seguir impidiendo que dos personas se queden con la misma plaza.","Una media diaria oculta picos breves de llegadas. Explica de dónde sale cada estimación y analiza ráfagas mayores antes de convertirla en un requisito de capacidad."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}]}},{"id":"communication-tradeoffs","parent":"architecture","title":{"en":"Communicating Tradeoffs","es":"Explicar ventajas y contrapartidas"},"summary":{"en":"Recommend an option for a shared goal and make its accepted cost visible.","es":"Recomienda una opción para un objetivo compartido y deja claro qué coste se acepta."},"details":{"en":["Record the condition that would reopen the decision. If report users later need immediate results before approving a payment, the original waiting tolerance no longer applies and the design deserves reassessment."],"es":["Deja por escrito qué condición llevaría a revisar la decisión. Si más adelante el usuario necesita el informe al instante para aprobar un pago, la espera admitida inicialmente deja de servir y conviene reevaluar el diseño."]},"aws":{"en":"Amazon SQS can hold report jobs for a worker that writes files to Amazon S3. Standard-queue messages may repeat, so a stable job identifier should be used to prevent duplicate processing effects.","es":"Amazon SQS puede guardar trabajos de informes para un proceso que escribe archivos en Amazon S3. Los mensajes de una cola estándar pueden repetirse; debe usarse un identificador estable para evitar efectos duplicados."},"question":{"en":"The finance owner asks whether background reports will be faster and cheaper. What would you say?","es":"El responsable financiero pregunta si los informes en segundo plano serán más rápidos y baratos. ¿Qué le dirías?"},"answer":{"en":"I would recommend background generation because the current request expires too early and users can wait two minutes. Acknowledgement should arrive sooner, but the calculation still takes time and queueing may add delay. I would not claim savings without including job tracking and support effort. Before rollout, I would measure completion time at peak demand and check that users can find delayed or failed reports. That tests the promised user benefit rather than only the response speed.","es":"Recomendaría generarlos en segundo plano porque la petición actual caduca demasiado pronto y los usuarios pueden esperar dos minutos. La confirmación debería llegar antes, pero el cálculo sigue tardando y la cola puede añadir espera. No afirmaría que ahorra sin incluir el seguimiento y el soporte. Antes de lanzarlo, mediría el tiempo de finalización con demanda alta y comprobaría que los usuarios encuentran los informes retrasados o fallidos. Así evaluaría el beneficio prometido, además de la velocidad de respuesta."},"related":["architecture-discovery","cost-optimization"],"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}],"level":"foundation","learning":{"definition":{"en":"A tradeoff is a choice in which improving one useful property brings a cost or limitation elsewhere. Communicating tradeoffs means explaining those consequences clearly enough for someone to decide whether the exchange serves their goal.","es":"Un tradeoff es una decisión en la que mejorar una propiedad útil supone asumir un coste o una limitación en otra parte. Comunicar estas contrapartidas permite decidir si ese intercambio ayuda a cumplir el objetivo."},"simple":{"en":"The architect connects an option to a consequence the decision maker cares about. Engineers explain the mechanism; the business owner judges which consequences are acceptable. Compare alternatives using the same workload and budget, separating measured results from assumptions. Recommend one option and say what would change your mind. This gives executives business context and engineers implementation detail without giving them contradictory versions of the decision.","es":"El arquitecto relaciona una opción con una consecuencia relevante para quien decide. Los ingenieros explican el mecanismo; el responsable de negocio valora qué consecuencias acepta. Compara alternativas con la misma carga y presupuesto, separando mediciones de hipótesis. Recomienda una opción y explica qué te haría reconsiderarla. Así, los directivos reciben contexto de negocio y los ingenieros detalles de implementación, sin versiones contradictorias de la decisión."},"analogy":{"en":"A train connection can shorten the scheduled journey but adds the risk of missing the next train. Architecture involves similar exchanges, although its costs vary with workload rather than a fixed timetable.","es":"Un transbordo puede acortar el trayecto previsto, pero añade el riesgo de perder el siguiente tren. La arquitectura plantea intercambios parecidos, aunque sus costes varían con la carga en lugar de un horario fijo."},"walkthrough":{"en":["A finance report takes 45 seconds to generate, but its browser request expires after 30. The finance owner says delivery within two minutes is useful and keeping the page open is unnecessary.","The application stores a job, returns its identifier and lets a separate worker generate the file. This asynchronous approach separates acceptance from completion; users check progress instead of holding the original connection open.","Recommend background generation because it fits the agreed waiting tolerance. Explain that queueing can delay completion. With engineers, examine retries and job tracking; with the finance owner, confirm how users will find delayed reports."],"es":["Un informe financiero tarda 45 segundos en generarse, pero la petición del navegador caduca a los 30. El responsable financiero dice que recibirlo en dos minutos le sirve y que no necesita mantener la página abierta.","La aplicación guarda un trabajo, devuelve su identificador y deja que otro proceso genere el archivo. Este enfoque asíncrono separa la aceptación de la finalización; el usuario consulta el progreso sin mantener abierta la conexión original.","Recomienda la generación en segundo plano porque encaja con la espera acordada. Explica que la cola puede retrasar la finalización. Con los ingenieros, revisa reintentos y seguimiento; con el responsable financiero, confirma cómo encontrará el usuario los informes retrasados."]},"pitfalls":{"en":["A quicker acknowledgement does not accelerate the calculation. Keep acceptance time separate from completion time when explaining the user benefit.","Fewer compute charges may be offset by extra support work. Include job recovery and status tracking before describing the proposal as cheaper."],"es":["Confirmar antes la recepción no acelera el cálculo. Distingue el tiempo de aceptación del tiempo de finalización al explicar qué gana el usuario.","Un menor gasto en cómputo puede quedar compensado por más trabajo de soporte. Incluye la recuperación de trabajos y su seguimiento antes de afirmar que sale más barato."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}]}},{"id":"improve-reliability","parent":"well-architected","title":{"en":"Reliability: make it more resilient","es":"Fiabilidad: hacerla más resiliente"},"summary":{"en":"Tie each recovery measure to a specific failure and measure when users regain useful service.","es":"Relaciona cada medida de recuperación con un fallo concreto y mide cuándo vuelve a funcionar el servicio para el usuario."},"level":"applied","keywords":{"en":["resilient","resilience","reliable","reliability","high availability","fault tolerant"],"es":["resiliente","resiliencia","fiable","fiabilidad","alta disponibilidad","tolerancia a fallos"]},"details":{"en":["A healthy replacement may be ready while existing clients still wait on failed connections. Test connection timeouts and reconnection with long-lived clients; fresh test clients can hide recovery problems affecting users already online."],"es":["Puede haber una instancia de sustitución sana mientras los clientes existentes siguen esperando en conexiones fallidas. Prueba los tiempos de espera y la reconexión con clientes que lleven tiempo conectados; los recién iniciados pueden ocultar problemas de quienes ya usaban el servicio."]},"aws":{"en":"Run dispatch instances in two Availability Zones behind an Application Load Balancer, with an Amazon RDS Multi-AZ DB instance deployment. Test whether surviving capacity handles the agreed demand.","es":"Ejecuta las instancias del portal en dos zonas de disponibilidad detrás de un Application Load Balancer, con un despliegue de instancia de base de datos Amazon RDS Multi-AZ. Comprueba si la capacidad restante soporta la demanda acordada."},"question":{"en":"Our dispatch portal has two application servers. Is that enough for ten-minute recovery after a zone failure?","es":"Nuestro portal de envíos tiene dos servidores de aplicación. ¿Basta para recuperarlo en diez minutos tras perder una zona?"},"answer":{"en":"Two servers are a starting point. I would check whether they share a zone and whether dispatch depends on one database or network path. I would test traffic switching and database failover, then check surviving capacity at peak demand. Notifications could wait in a queue while dispatch recovers. Separately, I would test data restoration against the loss target. The recovery clock should stop when users can dispatch again, with remaining gaps made explicit.","es":"Dos servidores son un punto de partida. Comprobaría si comparten zona y si el servicio depende de una única base de datos o ruta de red. Probaría el cambio de tráfico y de base de datos, y verificaría la capacidad restante con demanda máxima. Las notificaciones podrían esperar en una cola durante la recuperación. Por separado, ensayaría la restauración frente al límite de pérdida acordado. Mediría hasta que el usuario pueda volver a gestionar envíos y dejaría claros los objetivos pendientes."},"related":["interview-playbooks","reliability","disaster-recovery"],"sources":[{"label":"AWS Well-Architected: Reliability","url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html","label":"docs.aws.amazon.com: disaster recovery dr objectives"}],"playbook":{"opener":{"en":"How long can dispatch stop, how much recent work could be lost, and should recovery cover one zone or an entire Region?","es":"¿Cuánto puede detenerse la gestión de envíos, cuánta actividad reciente podría perderse y debemos cubrir una zona o una región entera?"},"points":[{"title":{"en":"Remove single points of failure","es":"Eliminar puntos únicos de fallo"},"body":{"en":"Place instances in separate Availability Zones, distinct infrastructure locations within an AWS Region. An Application Load Balancer routes to healthy targets. Trace login and data access too: a session held only on a lost instance can still interrupt the user.","es":"Sitúa las instancias en zonas de disponibilidad distintas, ubicaciones de infraestructura separadas dentro de una región de AWS. Un Application Load Balancer dirige peticiones a destinos sanos. Revisa también acceso y datos: perder una instancia que conserva la única sesión puede interrumpir al usuario."},"refs":["vpc","load-balancing","data-sql","sessions"]},{"title":{"en":"Detect failures and recover automatically","es":"Detectar fallos y recuperarse automáticamente"},"body":{"en":"Use an Amazon CloudWatch Synthetics canary, a scheduled user-path test, to check whether dispatch jobs load. Configure EC2 Auto Scaling to consume load-balancer health checks for replacement decisions. Recovery must include reconnecting clients, not just starting replacement instances.","es":"Usa un canary de Amazon CloudWatch Synthetics, una prueba programada del recorrido del usuario, para comprobar que cargan los envíos. Configura EC2 Auto Scaling para usar las comprobaciones del balanceador al decidir sustituciones. La recuperación debe incluir la reconexión de clientes, además de arrancar instancias nuevas."},"refs":["cloud-scaling","observability"]},{"title":{"en":"Contain failures and absorb bursts","es":"Contener fallos y absorber picos"},"body":{"en":"Hold notifications in Amazon SQS and cap concurrent workers so a backlog cannot consume every database connection. Use a durable operation identifier to avoid duplicate effects. For temporary faults, limit retries and increase their delay with random variation to spread demand.","es":"Conserva las notificaciones en Amazon SQS y limita los procesos simultáneos para que la acumulación no consuma todas las conexiones de base de datos. Usa un identificador persistente para evitar efectos duplicados. Ante fallos temporales, limita los reintentos y aumenta la espera con variación aleatoria para repartir la demanda."},"refs":["cloud-queues-messaging","cloud-distributed-systems","http"]},{"title":{"en":"Protect data and plan disaster recovery","es":"Proteger datos y planificar recuperación"},"body":{"en":"Configure Amazon RDS automated backup retention and rehearse restoration into a new database. Check available recovery points against the data-loss target before reconnecting the portal. Regional-outage requirements may justify recovery elsewhere, but include its running cost and operational work in the decision.","es":"Configura la retención de copias automáticas de Amazon RDS y ensaya la restauración en una base de datos nueva. Compara los puntos recuperables con el límite de pérdida antes de reconectar el portal. Cubrir una caída regional puede justificar otro destino, incluyendo su coste y trabajo operativo."},"refs":["disaster-recovery"]},{"title":{"en":"Prove the design under failure","es":"Demostrar el diseño ante fallos"},"body":{"en":"Begin a narrowly scoped AWS Fault Injection Service experiment in a test environment with stop alarms configured. Measure completed dispatch operations during the disruption. Rehearse restoration separately and compare recovered records with expected data; finishing an experiment does not establish that objectives were met.","es":"Empieza con un experimento de alcance limitado en AWS Fault Injection Service, en pruebas y con alarmas de parada configuradas. Mide las operaciones de envío completadas durante la interrupción. Ensaya la restauración por separado y compara los registros recuperados con los esperados; terminar el experimento no demuestra que se cumplan los objetivos."},"refs":["reliability","observability"]}],"spoken":{"en":"Two servers are a starting point. I would check whether they share a zone and whether dispatch depends on one database or network path. I would test traffic switching and database failover, then check surviving capacity at peak demand. Notifications could wait in a queue while dispatch recovers. Separately, I would test data restoration against the loss target. The recovery clock should stop when users can dispatch again, with remaining gaps made explicit.","es":"Dos servidores son un punto de partida. Comprobaría si comparten zona y si el servicio depende de una única base de datos o ruta de red. Probaría el cambio de tráfico y de base de datos, y verificaría la capacidad restante con demanda máxima. Las notificaciones podrían esperar en una cola durante la recuperación. Por separado, ensayaría la restauración frente al límite de pérdida acordado. Mediría hasta que el usuario pueda volver a gestionar envíos y dejaría claros los objetivos pendientes."},"caution":{"en":"These cards are study prompts, not the published AWS principle names. Spanning zones can still involve an interruption. Live replicas can inherit bad writes, so retain recoverable history. Expand geographic coverage only for an explicit need, with the extra operational burden understood.","es":"Estas tarjetas sirven de apoyo al estudio; sus títulos no son los principios publicados por AWS. Distribuir entre zonas puede implicar una interrupción. Las réplicas activas pueden recibir escrituras incorrectas, así que conserva un historial recuperable. Amplía la cobertura geográfica por una necesidad explícita, conociendo el trabajo operativo adicional."}},"learning":{"definition":{"en":"Reliability is the ability to deliver the intended service correctly over time. Resilience supports that goal by limiting the effect of failures and restoring useful service within an agreed period, so individual faults need not become prolonged business interruptions.","es":"La fiabilidad es la capacidad de prestar correctamente el servicio previsto a lo largo del tiempo. La resiliencia contribuye a ello limitando el efecto de los fallos y recuperando un servicio útil en un plazo acordado, para evitar que una avería se convierta en una interrupción prolongada."},"simple":{"en":"The business owner sets service expectations. Availability measures successful service over time; the recovery time objective (RTO) sets a target interruption duration, and the recovery point objective (RPO) bounds acceptable data loss, measured in time. Engineers trace dependencies and arrange ways to continue or restore service. Duplicate components help with equipment faults; backups preserve earlier data states. Replacing a broken server cannot undo an accidental deletion.","es":"El responsable de negocio fija las expectativas. La disponibilidad mide el servicio satisfactorio a lo largo del tiempo; el objetivo de tiempo de recuperación (RTO) establece cuánto puede durar una interrupción, y el objetivo de punto de recuperación (RPO) limita la pérdida de datos admisible, medida en tiempo. Los ingenieros revisan dependencias y preparan la continuidad o restauración. Duplicar componentes ayuda ante averías; las copias de seguridad conservan estados anteriores. Sustituir un servidor averiado no deshace un borrado accidental."},"analogy":{"en":"A shop keeps a spare till and copies of its accounts. The spare covers broken equipment; the copies help reconstruct records. Software needs that separation too, although restoration must also reconcile concurrent changes.","es":"Una tienda guarda una caja registradora de repuesto y copias de sus cuentas. La caja cubre averías; las copias permiten reconstruir registros. El software necesita esa separación, aunque restaurar también exige reconciliar cambios simultáneos."},"walkthrough":{"en":["A delivery company sets a ten-minute recovery target for its dispatch portal after a hosting-zone outage. Separately, it accepts losing at most five minutes of records after data corruption; both targets need evidence.","Engineers distribute the application across two zones and configure database switching to a standby. They queue notifications and limit simultaneous workers to protect the database. Backups remain necessary because mistakes can propagate to live replicas.","In a controlled exercise, they remove one zone and time successful dispatches from the user perspective. A separate restore checks the recoverable timestamp. Missed targets require a design change or an explicit revision of the agreement."],"es":["Una empresa de reparto fija diez minutos para recuperar su portal de envíos tras perder una zona de alojamiento. Por separado, acepta perder como máximo cinco minutos de registros ante corrupción de datos; ambos objetivos necesitan pruebas.","Los ingenieros distribuyen la aplicación entre dos zonas y configuran el cambio a una base de datos de reserva. Encolan notificaciones y limitan los procesos simultáneos para protegerla. Conservan copias de seguridad porque los errores pueden propagarse a las réplicas activas.","En un ensayo controlado, retiran una zona y miden cuándo vuelve a funcionar la gestión de envíos para el usuario. Otra prueba de restauración comprueba hasta qué instante recuperan datos. Incumplir un objetivo exige cambiar el diseño o revisar expresamente lo acordado."]},"pitfalls":{"en":["Extra application copies add little if every request still needs one irreplaceable database or network path. Follow the complete transaction, including authentication.","Rapid retries can overload a struggling dependency. Limit attempts and space them out; repeated operations must avoid applying the same change twice."],"es":["Añadir copias de la aplicación aporta poco si cada petición sigue necesitando una única base de datos o ruta de red insustituible. Recorre la operación completa, incluida la autenticación.","Reintentar enseguida puede sobrecargar una dependencia que ya funciona mal. Limita y separa los intentos; repetir una operación debe evitar aplicar dos veces el mismo cambio."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html","label":"docs.aws.amazon.com: design principles"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html","label":"docs.aws.amazon.com: disaster recovery dr objectives"}]}},{"id":"improve-security","parent":"well-architected","title":{"en":"Security: make it more secure","es":"Seguridad: hacerla más segura"},"summary":{"en":"Build security around the harmful actions you need to prevent, then verify that legitimate work remains possible when a safeguard fails or a credential is compromised.","es":"Diseña la seguridad a partir de las acciones dañinas que necesitas impedir y comprueba que el trabajo legítimo puede continuar si falla un control o se compromete una credencial."},"level":"applied","keywords":{"en":["secure","security","more secure","protect","least privilege"],"es":["segura","seguro","seguridad","más segura","proteger","mínimo privilegio"]},"details":{"en":["An AWS Organizations service control policy sets a ceiling on permissions for the identities it governs; it never grants access. Effective AWS permissions and the application's own checks on who may access each record remain necessary."],"es":["Una política de control de servicios de AWS Organizations establece un techo de permisos para las identidades a las que se aplica; nunca concede acceso. Siguen haciendo falta permisos efectivos en AWS y comprobaciones de la aplicación sobre quién puede acceder a cada registro."]},"aws":{"en":"IAM defines AWS permissions; KMS controls cryptographic keys; Secrets Manager stores sensitive values such as database passwords. CloudTrail records supported account activity, while GuardDuty analyses supported signals for possible threats. Configure coverage deliberately: storing audit records and detecting an incident are separate jobs, and neither automatically supplies the application rule that an invoice belongs to its requester.","es":"IAM define permisos de AWS; KMS controla claves criptográficas; Secrets Manager guarda valores sensibles, como contraseñas de bases de datos. CloudTrail registra la actividad que admite y GuardDuty analiza las señales compatibles para detectar posibles amenazas. Configura la cobertura expresamente: conservar registros y detectar un incidente son tareas distintas, y ninguna incorpora por sí sola la regla de aplicación que vincula una factura con su cliente."},"question":{"en":"A customer invoice portal uses encrypted S3 storage, but changing an invoice identifier reveals another customer's document. What would you fix first, and how would you verify the wider security design?","es":"Un portal guarda facturas cifradas en S3, pero cambiar el identificador permite ver el documento de otro cliente. ¿Qué corregirías primero y cómo comprobarías la seguridad del conjunto?"},"answer":{"en":"For the invoice portal, I would first enforce an ownership check on every invoice request and test it with another customer's identifier. The application would receive narrowly scoped, temporary AWS credentials, and invoice storage would have no public access. I would encrypt connections and stored data, restrict key use, and keep passwords outside code. I would patch components we operate, enable the required object-access audit events, and rehearse stopping a bulk download with the incident owner while preserving evidence and legitimate service.","es":"Para el portal de facturas, exigiría comprobar la titularidad en cada petición y probaría el control con el identificador de otro cliente. La aplicación recibiría credenciales temporales de AWS con permisos limitados, y el almacenamiento no tendría acceso público. Cifraría conexiones y datos guardados, restringiría el uso de claves y mantendría las contraseñas fuera del código. Actualizaría los componentes que administramos, activaría el registro de accesos a objetos y ensayaría con el responsable cómo detener una descarga masiva conservando las pruebas y el servicio legítimo."},"related":["interview-playbooks","security","iam","encryption"],"sources":[{"label":"AWS Well-Architected: Security","url":"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}],"playbook":{"opener":{"en":"Which unauthorised action would cause the greatest harm here, and which legitimate actions must remain available?","es":"¿Qué acción no autorizada causaría más daño en este sistema y qué operaciones legítimas deben seguir disponibles?"},"points":[{"title":{"en":"Start with identity and least privilege","es":"Empezar por identidad y mínimo privilegio"},"body":{"en":"Let employees sign in through a trusted identity provider rather than managing separate AWS passwords. Require a second verification factor for people, and let workloads obtain expiring credentials through IAM roles. Grant only the necessary operations on named resources; separate deployment from approval powers and remove permissions that are no longer justified.","es":"Permite que los empleados entren mediante un proveedor de identidad de confianza, sin administrar contraseñas independientes para AWS. Exige un segundo factor de verificación a las personas y proporciona credenciales con caducidad a las aplicaciones mediante roles de IAM. Autoriza solo las operaciones necesarias sobre recursos concretos, separa la capacidad de desplegar de la de aprobar y retira permisos que hayan dejado de estar justificados."},"refs":["iam","security-governance"]},{"title":{"en":"Reduce exposure and layer controls","es":"Reducir exposición y combinar controles"},"body":{"en":"Put the public entry point in front of private application and database tiers. Security groups filter permitted network traffic; AWS WAF screens supported web requests, and Shield addresses distributed denial-of-service attacks that try to overwhelm availability. None of these decides whether one customer is entitled to another customer's invoice.","es":"Sitúa una entrada pública delante de las capas privadas de aplicación y base de datos. Los grupos de seguridad filtran el tráfico de red permitido; AWS WAF examina peticiones web compatibles y Shield protege frente a ataques distribuidos de denegación de servicio, que buscan saturar el sistema. Ninguno decide si un cliente tiene derecho a consultar la factura de otro."},"refs":["public-private","security-groups","private-connectivity"]},{"title":{"en":"Protect data and secrets","es":"Proteger datos y secretos"},"body":{"en":"An encrypted invoice remains protected only if decrypt permissions and key administration are controlled. Use TLS for connections and service encryption for stored copies, including backups. Retrieve passwords from Secrets Manager at runtime rather than embedding them in code or logs; configure supported rotation, test that consumers accept replacements, and verify restores.","es":"Una factura cifrada sigue dependiendo del control sobre quién puede descifrarla y administrar sus claves. Aplica TLS a las conexiones y el cifrado del servicio a las copias guardadas, incluidas las de seguridad. La aplicación debe obtener las contraseñas de Secrets Manager al ejecutarse, sin incrustarlas en código ni registros. Configura su renovación cuando sea compatible, prueba que las aplicaciones aceptan el cambio y comprueba las restauraciones."},"refs":["tls","encryption","secrets-management"]},{"title":{"en":"Harden and verify continuously","es":"Reforzar y verificar continuamente"},"body":{"en":"Turn the intended configuration into versioned templates so changes can be reviewed and tested. Patch the operating systems and software you operate, and inspect dependencies and container images for known vulnerabilities. Before rollout, try both forbidden and required requests: passing a scan does not prove that customer access boundaries work.","es":"Representa la configuración prevista en plantillas con historial de versiones para revisar y probar los cambios. Actualiza los sistemas operativos y programas que administras, y busca vulnerabilidades conocidas en bibliotecas y en las imágenes que empaquetan los contenedores. Antes de desplegar, prueba peticiones prohibidas y necesarias: superar un análisis no demuestra que la separación de acceso entre clientes funcione."},"refs":["security","security-governance","cloud-containers"]},{"title":{"en":"Detect, respond and rehearse","es":"Detectar, responder y ensayar"},"body":{"en":"Distinguish changes to AWS resources from operations on the data inside them. For S3 invoice reads, configure CloudTrail data-event selectors explicitly. Route suspicious activity to someone who can act, and practise isolating the affected component, replacing exposed credentials and keeping trustworthy logs before an incident forces those decisions.","es":"Distingue los cambios en recursos de AWS de las operaciones sobre sus datos. Para registrar lecturas de facturas en S3, configura expresamente los selectores de eventos de datos de CloudTrail. Avisa a alguien con capacidad de actuar y ensaya cómo aislar el componente afectado, sustituir credenciales expuestas y conservar registros fiables antes de tener que decidirlo durante un incidente."},"refs":["security-detection","observability"]}],"spoken":{"en":"For the invoice portal, I would first enforce an ownership check on every invoice request and test it with another customer's identifier. The application would receive narrowly scoped, temporary AWS credentials, and invoice storage would have no public access. I would encrypt connections and stored data, restrict key use, and keep passwords outside code. I would patch components we operate, enable the required object-access audit events, and rehearse stopping a bulk download with the incident owner while preserving evidence and legitimate service.","es":"Para el portal de facturas, exigiría comprobar la titularidad en cada petición y probaría el control con el identificador de otro cliente. La aplicación recibiría credenciales temporales de AWS con permisos limitados, y el almacenamiento no tendría acceso público. Cifraría conexiones y datos guardados, restringiría el uso de claves y mantendría las contraseñas fuera del código. Actualizaría los componentes que administramos, activaría el registro de accesos a objetos y ensayaría con el responsable cómo detener una descarga masiva conservando las pruebas y el servicio legítimo."},"caution":{"en":"Do not treat encryption, network isolation, request filtering or organisation permission limits as proof that a particular user may access a record. Object-level auditing also needs explicit coverage; turning on general account logging is not enough. These five headings are study prompts, not the official AWS design-principle list.","es":"El cifrado, el aislamiento de red, el filtrado de peticiones y los límites de permisos de la organización no demuestran que un usuario pueda acceder a un registro concreto. La auditoría de objetos también exige cobertura explícita; activar registros generales de la cuenta no basta. Estos cinco títulos sirven para estudiar, no reproducen la lista oficial de principios de diseño de AWS."}},"learning":{"definition":{"en":"Improving security means reducing the chance and impact of someone misusing a system or its data. It combines decisions about permitted actions with safeguards that prevent, reveal and contain misuse.","es":"Mejorar la seguridad consiste en reducir la probabilidad y el impacto de que alguien use indebidamente un sistema o sus datos. Combina reglas sobre las acciones permitidas con controles para impedir abusos, descubrirlos y limitar sus consecuencias."},"simple":{"en":"Every request crosses several boundaries: the caller proves who they are, a rule decides what they may do, and the application checks whether that action is valid for the particular record. Network restrictions reduce reachable targets; encryption makes data unreadable without the right key. Monitoring then reveals suspicious activity so someone can intervene. These controls reinforce one another because any single boundary can fail.","es":"Cada petición cruza varios límites: se comprueba quién llama, se decide qué operaciones tiene permitidas y la aplicación verifica si puede actuar sobre ese registro concreto. Restringir la red reduce los puntos alcanzables; el cifrado impide leer datos sin la clave adecuada. La vigilancia permite advertir comportamientos sospechosos y actuar. Los controles se refuerzan entre sí porque ninguno garantiza por separado que todo acceso sea legítimo."},"analogy":{"en":"Think of a hospital: badges control entry, locked cabinets protect records, and alarms summon help. Limit: digital credentials can be copied without stealing the badge.","es":"Piensa en un hospital: acreditaciones para entrar, archivadores cerrados y alarmas para avisar. Límite: las credenciales digitales pueden copiarse sin quitarle la acreditación a nadie."},"walkthrough":{"en":["For a customer invoice portal, identify the protected data and write a rule: each signed-in customer can retrieve only their own invoices. Test that changing an invoice identifier cannot bypass this rule.","Give the application an IAM role, an AWS permission identity that provides temporary credentials, limited to its invoice storage. Keep that storage nonpublic and use TLS, which encrypts connections, between the customer and portal.","Explicitly enable CloudTrail S3 data events for invoice object access, including reads. Simulate an unexpected bulk download, verify that detection alerts the incident owner, and practise containment while preserving the original audit records."],"es":["En un portal de facturas, identifica los datos protegidos y establece una regla: cada cliente que haya iniciado sesión solo puede consultar sus propias facturas. Prueba que cambiar el identificador de una factura no permite saltarse esa regla.","Asigna a la aplicación un rol de IAM, una identidad de permisos de AWS que proporciona credenciales temporales, limitado al almacenamiento de facturas. Impide el acceso público a ese almacenamiento y usa TLS, que cifra las conexiones, entre cliente y portal.","Activa explícitamente los eventos de datos de CloudTrail para los objetos de S3 que contienen facturas, incluidas sus lecturas. Simula una descarga masiva inesperada, comprueba que se avisa al responsable y ensaya la contención conservando los registros originales de auditoría."]},"pitfalls":{"en":["Encryption does not stop a caller who already has permission to decrypt. Check access decisions as carefully as the key configuration.","A security alert without an owner or tested response may change nothing. Restrict access during containment without erasing the evidence needed to understand the incident."],"es":["El cifrado no frena a quien ya tiene permiso para descifrar. Revisa las decisiones de acceso con el mismo cuidado que la configuración de las claves.","Una alerta sin responsable ni respuesta ensayada puede quedarse en nada. Limita el acceso durante la contención sin borrar las pruebas necesarias para entender el incidente."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}]}},{"id":"improve-performance","parent":"well-architected","title":{"en":"Performance: make it faster and scalable","es":"Rendimiento: hacerla más rápida y escalable"},"summary":{"en":"Use measured waiting and execution time to choose a change, then prove that the complete system meets its targets as demand increases.","es":"Elige los cambios midiendo cuánto tiempo se dedica a esperar y a ejecutar trabajo; después demuestra que el sistema completo cumple sus objetivos cuando aumenta la demanda."},"level":"applied","keywords":{"en":["faster","fast","performance","scalable","scale","latency"],"es":["rápida","rápido","rendimiento","escalable","escalar","latencia"]},"details":{"en":["When a shared component is busy almost all the time, small bursts can create disproportionately long queues. Leave spare capacity and limit incoming work where necessary, rather than treating maximum resource utilisation as the performance goal."],"es":["Si un componente compartido está ocupado casi todo el tiempo, pequeños picos pueden generar colas desproporcionadamente largas. Deja capacidad de reserva y limita el trabajo entrante cuando haga falta, en lugar de perseguir el máximo uso de recursos como objetivo de rendimiento."]},"aws":{"en":"Use CloudWatch metrics to see aggregate behaviour and X-Ray traces, linked records of request operations, to locate delays across instrumented components. CloudFront places eligible cached responses near users; ElastiCache serves reusable values without a database read. EC2 Auto Scaling changes the number of application instances, but only testing their shared dependencies establishes whether that extra capacity improves the complete service.","es":"Usa métricas de CloudWatch para observar el comportamiento agregado y trazas de X-Ray, registros enlazados de las operaciones de una petición, para localizar demoras en componentes instrumentados. CloudFront acerca respuestas aptas para caché a los usuarios; ElastiCache entrega valores reutilizables sin consultar la base de datos. EC2 Auto Scaling modifica el número de instancias, pero hay que probar sus dependencias compartidas para saber si esa capacidad adicional mejora el servicio completo."},"question":{"en":"A product catalogue becomes slow during promotions even after doubling application servers. How would you identify the real constraint and demonstrate that your proposed change helps?","es":"Un catálogo se ralentiza durante las promociones incluso después de duplicar los servidores de aplicación. ¿Cómo localizarías el límite real y demostrarías que tu propuesta mejora el resultado?"},"answer":{"en":"For the catalogue, I would agree a p95 target, meaning the response time that 95% of requests must meet, at an expected request rate. I would trace slow requests before buying capacity. If repeated description reads dominate, I would cache them with an agreed expiry and test behaviour when the cache is empty. I would then check database capacity and scaling delays, and repeat steady and burst load tests, comparing errors, freshness and cost per successful request.","es":"Para el catálogo, acordaría un objetivo p95, el tiempo de respuesta que debe cumplir el 95% de las peticiones, con una tasa de tráfico concreta. Seguiría las peticiones lentas antes de ampliar recursos. Si predominan lecturas repetidas de descripciones, las guardaría en caché con una caducidad acordada y probaría también la caché vacía. Comprobaría la capacidad de la base de datos y los retrasos del escalado. Después repetiría pruebas de carga estable y picos, comparando errores, actualización del contenido y coste por petición completada correctamente."},"related":["interview-playbooks","observability","cloud-scaling","data-caching"],"sources":[{"label":"AWS Well-Architected: Performance Efficiency","url":"https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html"},{"url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html","label":"docs.aws.amazon.com: aws xray"}],"playbook":{"opener":{"en":"When customers say the service is slow, which operation misses its target, under how much concurrent demand, and what evidence identifies the wait?","es":"Cuando los clientes dicen que el servicio va lento, ¿qué operación incumple el objetivo, con cuánta demanda simultánea y qué mediciones permiten localizar la espera?"},"points":[{"title":{"en":"Measure the critical path","es":"Medir la ruta crítica"},"body":{"en":"Record p95 and p99, the times within which 95% and 99% of requests finish, alongside completed requests per second. Follow traces through the operations a response must wait for. Correlate slow spans, timed operations within a trace, with processor load, memory pressure, storage waits and database or network delays.","es":"Registra p95 y p99, los tiempos dentro de los cuales termina el 95% y el 99% de las peticiones, junto con las peticiones completadas por segundo. Recorre las trazas siguiendo las operaciones que deben terminar antes de responder. Relaciona sus tramos lentos con carga de procesador, escasez de memoria, esperas de almacenamiento y demoras de base de datos o red."},"refs":["observability","troubleshooting"]},{"title":{"en":"Remove unnecessary work and distance","es":"Evitar trabajo y distancia innecesarios"},"body":{"en":"Reduce rows read by queries and bytes sent over the network before adding capacity. CloudFront can serve suitable cached content closer to users, while ElastiCache can avoid repeated database reads. Decide how long each value may remain unchanged and how updates remove old copies; personalised responses require correctly separated cache keys.","es":"Reduce las filas que leen las consultas y los bytes enviados por la red antes de ampliar capacidad. CloudFront puede servir contenido adecuado desde una caché próxima al usuario; ElastiCache evita lecturas repetidas de la base de datos. Decide cuánto tiempo puede conservarse cada valor y cómo se retiran copias antiguas al actualizarlo. Las respuestas personalizadas necesitan identificadores de caché que separen correctamente a sus destinatarios."},"refs":["data-caching","http"]},{"title":{"en":"Choose compute and data for the access pattern","es":"Elegir cómputo y datos según el acceso"},"body":{"en":"Benchmark representative requests on candidate EC2 instance types rather than assuming extra processor cores help. In a relational database, an index provides a shorter route to matching rows but adds write maintenance. In DynamoDB, choose partition keys, the values used to distribute data, that spread busy requests rather than concentrating them.","es":"Compara peticiones representativas en los tipos de instancia EC2 candidatos, sin dar por hecho que más núcleos de procesador ayuden. En una base relacional, un índice permite localizar filas por una ruta más corta, pero también debe actualizarse al escribir. En DynamoDB, elige claves de partición, los valores que distribuyen los datos, que repartan las peticiones frecuentes en vez de concentrarlas."},"refs":["cloud-compute","data-nosql","data-sql"]},{"title":{"en":"Scale the whole request path","es":"Escalar toda la ruta"},"body":{"en":"Add interchangeable application instances by keeping required session state outside each instance. Send deferrable work through SQS, a message queue, so consumers can process it separately; bound retries and make duplicate processing safe. Check database connection-pool limits, which cap reusable connections, overloaded data partitions and service quotas; adding producers cannot remove a consumer's capacity limit.","es":"Añade instancias intercambiables guardando fuera de cada una el estado de sesión necesario. Envía el trabajo aplazable por SQS, una cola de mensajes, para procesarlo por separado; limita los reintentos y evita efectos duplicados al repetir una operación. Comprueba el máximo de conexiones reutilizables a la base de datos, las particiones sobrecargadas y las cuotas del servicio: añadir productores no elimina el límite de capacidad de quien procesa los mensajes."},"refs":["cloud-scaling","cloud-queues-messaging"]},{"title":{"en":"Prove improvement at realistic cost","es":"Demostrar mejora con coste realista"},"body":{"en":"Run the same request mix against the original and changed system, using comparable data and cache conditions. Compare p95, p99, successful requests per second and failures. Include sudden bursts and recovery, check the age of returned data, and divide the relevant infrastructure cost by successful transactions so extra spending remains visible.","es":"Ejecuta la misma mezcla de peticiones contra el sistema original y el modificado, con datos y condiciones de caché comparables. Contrasta p95, p99, peticiones correctas por segundo y fallos. Incluye picos repentinos y recuperación, comprueba la antigüedad de los datos devueltos y divide el coste de infraestructura pertinente entre las transacciones correctas para hacer visible cualquier gasto adicional."},"refs":["cost-optimization","observability"]}],"spoken":{"en":"For the catalogue, I would agree a p95 target, meaning the response time that 95% of requests must meet, at an expected request rate. I would trace slow requests before buying capacity. If repeated description reads dominate, I would cache them with an agreed expiry and test behaviour when the cache is empty. I would then check database capacity and scaling delays, and repeat steady and burst load tests, comparing errors, freshness and cost per successful request.","es":"Para el catálogo, acordaría un objetivo p95, el tiempo de respuesta que debe cumplir el 95% de las peticiones, con una tasa de tráfico concreta. Seguiría las peticiones lentas antes de ampliar recursos. Si predominan lecturas repetidas de descripciones, las guardaría en caché con una caducidad acordada y probaría también la caché vacía. Comprobaría la capacidad de la base de datos y los retrasos del escalado. Después repetiría pruebas de carga estable y picos, comparando errores, actualización del contenido y coste por petición completada correctamente."},"caution":{"en":"Budget for scaling startup time and account quotas, the service limits on
