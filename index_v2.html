n conceal the real access problem and leave the service unnecessarily powerful."],"es":["Suponer que todas las distribuciones comparten órdenes y valores predeterminados: comprueba la versión instalada antes de aplicar instrucciones sobre paquetes o servicios.","Resolver cualquier fallo dando permisos de administrador: puede ocultar el problema de acceso y dejar al servicio con privilegios que no necesita."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man5/proc_meminfo.5.html","label":"man7.org: proc meminfo.5"},{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"}]}},{"id":"systems-processes","parent":"systems-linux","title":{"en":"Processes and Scheduling","es":"Procesos y planificación"},"summary":{"en":"Count runnable threads and inspect CPU quotas before adding more workers.","es":"Revisa los hilos listos y las cuotas de CPU antes de añadir trabajadores."},"details":{"en":["A priority or weight influences competition; it does not specify a fixed response time. CPU affinity, the set of processors a thread may use, can also restrict parallelism even when other CPUs are idle. Check effective restrictions before interpreting machine-wide utilisation."],"es":["Una prioridad o un peso influye en el reparto entre competidores; no fija un tiempo de respuesta. La afinidad de CPU, el conjunto de procesadores que puede utilizar un hilo, también puede restringir el paralelismo aunque otras CPU estén desocupadas. Comprueba las restricciones efectivas antes de interpretar la utilización global."]},"aws":{"en":"For a Linux Amazon EKS pod limited to one CPU, correlate slow requests with CPU-throttling counters before increasing its worker-thread count.","es":"En un pod Linux de Amazon EKS limitado a una CPU, comprueba si las peticiones lentas coinciden con aumentos de los contadores de throttling antes de añadir hilos de trabajo."},"question":{"en":"An EKS pod with one container and a one-CPU limit has latency spikes, while its node averages 30% CPU use. Why might adding workers make matters worse?","es":"Un pod de EKS con un contenedor y límite de una CPU tiene picos de latencia, aunque el nodo promedia un 30% de CPU. ¿Por qué podría empeorar al añadir trabajadores?"},"answer":{"en":"A one-CPU limit commonly becomes a shared CPU-time quota for the container's threads, not a dedicated processor. A short burst can exhaust that quota while other workloads leave the node partly idle. Compare slow-request timestamps with throttling counters and the effective cgroup configuration. If they align, test a smaller worker pool for latency, or a higher CPU limit when capacity and cost permit. Adding threads alone can consume the same allowance faster.","es":"El límite de una CPU suele traducirse en una cuota de tiempo compartida por los hilos del contenedor, no en un procesador dedicado. Una ráfaga puede agotarla aunque el nodo tenga capacidad ociosa. Compara los momentos de las peticiones lentas con los contadores de throttling y la configuración efectiva del cgroup. Si coinciden, prueba menos trabajadores para evaluar la latencia, o un límite mayor si la capacidad y el coste lo permiten. Añadir hilos puede gastar antes el mismo presupuesto."},"related":["systems-memory","cloud-containers","observability"],"sources":[{"label":"Amazon ECS Task CPU and Memory","url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-cpu-memory-error.html"},{"label":"Linux kernel: EEVDF scheduling and CFS context","url":"https://docs.kernel.org/scheduler/sched-eevdf.html"},{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"}],"level":"applied","learning":{"definition":{"en":"A process holds a running program's resources and execution state, while its threads are individual paths of execution. Scheduling shares processor time among eligible threads so competing programs can make progress.","es":"Un proceso mantiene los recursos y el estado de un programa en ejecución, mientras que sus hilos son secuencias individuales de ejecución. La planificación reparte tiempo de procesador entre los hilos que pueden ejecutarse para que los programas avancen."},"simple":{"en":"Threads in one process normally share its virtual address space, the set of addresses the program can use, but each keeps its own execution position and stack for active function calls. The scheduler is the kernel component choosing which runnable thread gets a CPU next. Runnable means ready to execute; a thread blocked on a disk read is waiting instead. A cgroup, a kernel-managed resource group, can impose a CPU-time budget on several threads together.","es":"Los hilos de un proceso suelen compartir su espacio de direcciones virtuales, las direcciones utilizables por el programa, pero cada uno conserva su posición de ejecución y su pila para las llamadas a funciones activas. El planificador del núcleo decide qué hilo listo para ejecutarse recibe CPU. Un hilo bloqueado esperando una lectura no está listo. Un cgroup, un grupo de recursos gestionado por el núcleo, puede imponer un presupuesto de tiempo de CPU al conjunto de hilos."},"analogy":{"en":"A kitchen team shares ingredients but each cook follows a separate task. A supervisor assigns available workstations; adding cooks cannot create more workstations. Unlike cooks, software threads can be paused and resumed extremely frequently.","es":"En una cocina se comparten ingredientes, pero cada cocinero sigue su tarea. Un encargado asigna los puestos disponibles; contratar más personas no crea más puestos. Los hilos, a diferencia de los cocineros, pueden pausarse con enorme frecuencia."},"walkthrough":{"en":["A thumbnail service has two CPU-bound threads, meaning they mostly calculate rather than wait. Its cgroup allows 100 milliseconds of CPU time per 100-millisecond period, with no extra burst budget.","If both threads run simultaneously on two CPUs, they can spend that combined allowance in about 50 milliseconds. The group may then be throttled, temporarily prevented from running until its budget renews.","During a slow request, check the group's cpu.stat counters for increased throttling. Test lower concurrency with the same image batch, and compare completion time before deciding whether more CPU budget is justified."],"es":["Un servicio de miniaturas tiene dos hilos cuyo trabajo consiste principalmente en calcular, no en esperar. Su cgroup permite 100 milisegundos de CPU por cada periodo de 100 milisegundos, sin presupuesto adicional para ráfagas.","Si ambos hilos se ejecutan a la vez en dos CPU, pueden gastar ese presupuesto conjunto en unos 50 milisegundos. El grupo puede sufrir throttling: se suspende temporalmente su ejecución hasta que se renueva el presupuesto.","Durante una petición lenta, comprueba si aumentan los contadores de throttling en cpu.stat del grupo. Prueba menos concurrencia con el mismo lote de imágenes y compara la duración antes de justificar un presupuesto de CPU mayor."]},"pitfalls":{"en":["Calling a CPU limit a reservation: a maximum budget alone does not promise dedicated cores or protect the application from competing work.","Adding threads to fix every slowdown: CPU contention, shared-data coordination and per-thread memory can outweigh gains when useful parallel work is limited."],"es":["Confundir un límite de CPU con una reserva: un presupuesto máximo, por sí solo, no promete núcleos dedicados ni protege frente a otras cargas.","Añadir hilos ante cualquier lentitud: competir por CPU, coordinar datos compartidos y mantener memoria por hilo puede costar más de lo que aporta el paralelismo disponible."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"}]}},{"id":"systems-memory","parent":"systems-linux","title":{"en":"Memory Management","es":"Gestión de memoria"},"summary":{"en":"Compare virtual size, resident usage and available host RAM without mixing their scopes.","es":"Compara tamaño virtual, consumo residente y RAM disponible del anfitrión sin mezclar sus ámbitos."},"details":{"en":["Adding RSS across processes can count shared pages more than once; proportional accounting divides their cost among the processes sharing them. Exit status 137 commonly indicates termination by SIGKILL, a signal that forcibly stops a process, but does not establish that memory exhaustion caused it. Check recorded OOM events."],"es":["Sumar el RSS de varios procesos puede contar páginas compartidas más de una vez; la contabilización proporcional reparte su coste entre quienes las comparten. El estado de salida 137 suele indicar una terminación mediante SIGKILL, una señal que detiene un proceso de forma forzosa, pero no demuestra falta de memoria. Comprueba los eventos OOM registrados."]},"aws":{"en":"For an Amazon ECS task on EC2, a container's 1 GiB hard limit can trigger an OOM event even if the instance still has several GiB available; inspect container-level events and usage.","es":"En una tarea de Amazon ECS sobre EC2, el límite estricto de 1 GiB de un contenedor puede provocar un evento OOM aunque la instancia tenga varios GiB disponibles; revisa eventos y consumo del contenedor."},"question":{"en":"An ECS container with a 1 GiB limit exits mid-batch. Shortly beforehand, its process showed 4 GiB virtual memory and 600 MiB RSS, while the host had 3 GiB available. What do you check first?","es":"Un contenedor de ECS limitado a 1 GiB termina a mitad de un lote. Poco antes, su proceso mostraba 4 GiB virtuales y 600 MiB de RSS, con 3 GiB disponibles en el anfitrión. ¿Qué compruebas primero?"},"answer":{"en":"Check the container's OOM events, effective memory limit and usage near the failure. Four GiB of virtual memory does not mean four GiB of occupied RAM, and the earlier RSS sample may miss a later peak or other memory charged to the container. Host MemAvailable does not override a container limit. If events confirm a limit-triggered OOM, reduce batch size or bound in-memory buffers, then retest. Raise the limit only after checking expected peak demand and host capacity.","es":"Revisa los eventos OOM, el límite efectivo del contenedor y su consumo alrededor del fallo. Cuatro GiB virtuales no equivalen a cuatro GiB ocupados en RAM; la muestra anterior de RSS puede omitir un pico posterior u otra memoria contabilizada al contenedor. MemAvailable del anfitrión no anula ese límite. Si los eventos confirman un OOM por límite, reduce el lote o acota los búferes en memoria y repite. Aumenta el límite solo tras comprobar los picos previstos y la capacidad del anfitrión."},"related":["systems-processes","cloud-lambda"],"sources":[{"label":"AWS Lambda Function Configuration - Memory","url":"https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html"},{"url":"https://man7.org/linux/man-pages/man5/proc_meminfo.5.html","label":"man7.org: proc meminfo.5"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"}],"level":"applied","learning":{"definition":{"en":"Memory management gives programs usable address spaces while coordinating the RAM that holds active data. It helps applications share a machine and provides ways to handle demand that exceeds available memory or configured limits.","es":"La gestión de memoria proporciona espacios de direcciones a los programas y organiza la RAM que contiene los datos activos. Permite compartir una máquina y gestionar situaciones en las que la demanda supera la memoria disponible o los límites configurados."},"simple":{"en":"Virtual memory is a process's address space; its reported size can include reserved regions and file mappings. Resident memory, commonly reported as RSS, counts the process's pages currently in RAM, including shared pages. A page is a fixed-size block managed by the kernel. MemAvailable estimates how much RAM the whole system could offer new work without swapping, including cache space the kernel expects to recover. Swap is configured backing storage for some evicted memory pages; its capacity is separate from RAM.","es":"La memoria virtual es el espacio de direcciones de un proceso; su tamaño puede incluir reservas y archivos mapeados. La memoria residente, o RSS, cuenta sus páginas presentes en RAM, incluidas las compartidas. Una página es un bloque de tamaño fijo gestionado por el núcleo. MemAvailable estima cuánta RAM podría usar trabajo nuevo sin recurrir a swap, contando caché recuperable. Swap es almacenamiento configurado para alojar ciertas páginas retiradas de RAM; su capacidad se contabiliza aparte."},"analogy":{"en":"Virtual memory is like a library catalogue, resident memory the books currently on a reader's desk, and available RAM the desk space staff could free. Unlike books, memory pages can be shared between readers.","es":"La memoria virtual recuerda al catálogo de una biblioteca; la residente, a los libros sobre una mesa; la disponible, al espacio que podría liberarse. La comparación falla porque varias aplicaciones pueden compartir una misma página."},"walkthrough":{"en":["A Linux container reserves 4 GiB of virtual address space, reports 600 MiB resident, and has a 1 GiB memory limit. Its host reports 3 GiB available; these figures describe different scopes.","As a batch grows, check the container's total memory usage, not just the process's RSS. Cached files and other charged memory can push the group towards its limit despite spare host RAM.","If recovering memory cannot make enough room, an allocation may fail or an out-of-memory (OOM) action may terminate a process. Confirm events, then reduce the batch size and rerun before changing the limit."],"es":["Un contenedor Linux reserva 4 GiB de espacio virtual, muestra 600 MiB residentes y tiene un límite de memoria de 1 GiB. Su máquina anfitriona muestra 3 GiB disponibles; cada cifra describe un ámbito distinto.","Al crecer un lote, comprueba el consumo total del contenedor, además del RSS del proceso. Los archivos en caché y otra memoria contabilizada pueden acercar el grupo a su límite aunque sobre RAM en la máquina.","Si recuperar memoria no deja espacio suficiente, una asignación puede fallar o una actuación por falta de memoria, OOM, puede terminar un proceso. Confirma los eventos, reduce el lote y repite antes de modificar el límite."]},"pitfalls":{"en":["Reading a large virtual size as RAM consumption: compare resident usage and its trend before declaring a leak or increasing capacity.","Treating low free RAM as an emergency, or available RAM as a guarantee: reclaimable cache can help, but a container's own limit still applies."],"es":["Interpretar un tamaño virtual elevado como consumo de RAM: compara la memoria residente y su evolución antes de diagnosticar una fuga o ampliar capacidad.","Considerar urgente cualquier caída de RAM libre, o tomar la disponible como garantía: recuperar caché puede ayudar, pero sigue aplicándose el límite propio del contenedor."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man5/proc_meminfo.5.html","label":"man7.org: proc meminfo.5"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"}]}},{"id":"systems-filesystems","parent":"systems-linux","title":{"en":"Filesystems and Permissions","es":"Sistemas de archivos y permisos"},"summary":{"en":"To read a file, a process needs permission to traverse its path as well as permission to read the file itself.","es":"Para leer un archivo, el proceso necesita permiso para recorrer su ruta y permiso de lectura sobre el propio archivo."},"details":{"en":["Deleting or renaming a directory entry normally requires write and execute permission on its parent directory, rather than write permission on the file. A sticky bit, a directory setting restricting who can remove entries, or an access control list can add further constraints. A report may therefore be read-only to Marta while she can still delete its directory entry. Permissions alone also do not encrypt stored data."],"es":["Borrar o renombrar una entrada suele requerir permisos de escritura y ejecución en el directorio que la contiene, no permiso de escritura sobre el archivo. El sticky bit, un ajuste del directorio que restringe quién puede eliminar entradas, o una lista de control de acceso pueden añadir restricciones. Por tanto, Marta podría tener un informe de solo lectura y aun así poder eliminar su entrada del directorio. Los permisos tampoco cifran por sí solos los datos almacenados."]},"aws":{"en":"An EC2 reporting service can place /srv/reports on EFS so several instances use the same file tree. Its numeric user and group identities must match the intended access rules, and concurrent publishers still need coordinated writes.","es":"Un servicio de informes en EC2 puede situar /srv/reports en EFS para que varias instancias utilicen el mismo árbol de archivos. Sus identificadores numéricos de usuario y grupo deben encajar con las reglas de acceso, y las publicaciones simultáneas siguen necesitando escrituras coordinadas."},"question":{"en":"Marta cannot open a report even though analysts has read access. A colleague suggests giving everyone full permissions. What would you check, and why?","es":"Marta no puede abrir un informe aunque analysts tiene permiso de lectura. Un compañero propone dar permisos completos a todo el mundo. ¿Qué comprobarías y por qué?"},"answer":{"en":"I would check Marta's effective group membership and execute permission on every directory in the path before changing the report. File read permission is useless if the process cannot reach the file. If a parent directory blocks analysts, I would grant only the traversal access they need, then test using Marta's identity. Making the path writable by everyone would broaden access without explaining the failure. If these checks pass, I would inspect access control lists and other security controls.","es":"Comprobaría los grupos efectivos de Marta y el permiso de ejecución en cada directorio de la ruta antes de modificar el informe. Poder leer el archivo no sirve si el proceso no puede llegar hasta él. Si un directorio bloquea al grupo analysts, concedería solo el acceso necesario para atravesarlo y probaría con la identidad de Marta. Dar escritura a todo el mundo ampliaría el acceso sin explicar el fallo. Si estas comprobaciones no lo resuelven, revisaría las listas de control de acceso y los demás controles de seguridad."},"related":["systems-storage","data-consistency"],"sources":[{"label":"Amazon EFS - How it Works","url":"https://docs.aws.amazon.com/efs/latest/ug/how-it-works.html"},{"url":"https://man7.org/linux/man-pages/man7/inode.7.html","label":"man7.org: inode.7"},{"url":"https://docs.kernel.org/admin-guide/ext4.html","label":"docs.kernel.org: ext4"}],"level":"applied","learning":{"definition":{"en":"A filesystem gives stored data names and paths so programs can locate, read and change files. Its permission checks decide which processes may perform particular operations, helping separate work between users and services.","es":"Un sistema de archivos asigna nombres y rutas a los datos almacenados para que los programas puedan localizarlos, leerlos y modificarlos. Sus comprobaciones de permisos determinan qué operaciones puede realizar cada proceso y ayudan a separar el trabajo de usuarios y servicios."},"simple":{"en":"On Linux, when a program opens a path, the operating system resolves each directory name and finds the file's inode, a record holding metadata and references to its data. It checks the program's user and group identities against permission rules. For directories, execute means permission to traverse; for files, it means permission to run. Reading a file therefore requires permission both to reach it through its directories and to read the file itself.","es":"En Linux, al abrir una ruta, el sistema operativo recorre sus directorios y localiza el inodo del archivo, un registro con metadatos y referencias a sus datos. Contrasta la identidad de usuario y los grupos del proceso con las reglas de acceso. En un directorio, el permiso de ejecución permite atravesarlo; en un archivo, permite ejecutarlo. Por eso, leer un archivo exige tanto poder llegar hasta él por sus directorios como tener permiso de lectura sobre el propio archivo."},"analogy":{"en":"Think of directories as corridors and a file as a document inside a room. You need permission to cross the corridors and read the document. Unlike physical doors, these checks evaluate a process's identity.","es":"Imagina los directorios como pasillos y el archivo como un documento en una habitación. Necesitas poder recorrer los pasillos y leer el documento. A diferencia de una puerta física, estas comprobaciones evalúan la identidad del proceso."},"walkthrough":{"en":["A reporting service running as reportbot creates /srv/reports/sales.csv. The file belongs to the analysts group and allows group members to read it. Marta belongs to that group, so the file's rule appears sufficient.","Marta receives Permission denied because the permissions on /srv/reports let reportbot traverse it but not analysts. The operating system stops at that directory before applying the file's read rule; changing sales.csv's permissions cannot fix this obstacle.","The administrator gives analysts traversal permission on /srv/reports and checks that /srv is also traversable. Marta can now open the known filename, while sales.csv remains read-only for her; directory listing would additionally require directory read permission."],"es":["Un servicio de informes que se ejecuta como reportbot crea /srv/reports/sales.csv. El archivo pertenece al grupo analysts y permite que sus miembros lo lean. Marta pertenece a ese grupo, así que la regla del archivo parece suficiente.","Marta recibe un error de permiso denegado porque /srv/reports permite el paso a reportbot, pero no a analysts. El sistema operativo se detiene en ese directorio antes de comprobar la lectura del archivo; cambiar los permisos de sales.csv no resuelve ese obstáculo.","El administrador permite a analysts atravesar /srv/reports y comprueba que también puede atravesar /srv. Marta ya puede abrir el nombre de archivo conocido, pero sigue sin poder modificar sales.csv; listar el directorio exigiría además permiso de lectura sobre ese directorio."]},"pitfalls":{"en":["Giving everyone write access can hide the configuration error while exposing unrelated data. Adjust the specific user, group or access control list, an additional set of permission rules.","Shared access does not coordinate edits: filesystem locks often require cooperating applications. Network filesystems also introduce client caching, so simultaneous writers need an explicit coordination strategy."],"es":["Permitir que cualquiera escriba puede ocultar el fallo de configuración y dejar otros datos expuestos. Ajusta el usuario, el grupo o la lista de control de acceso, que añade reglas de permisos.","Compartir acceso no coordina las modificaciones: muchos bloqueos requieren que las aplicaciones colaboren. Los sistemas de archivos en red también usan cachés de cliente, por lo que las escrituras simultáneas necesitan coordinación explícita."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man7/inode.7.html","label":"man7.org: inode.7"},{"url":"https://docs.kernel.org/admin-guide/ext4.html","label":"docs.kernel.org: ext4"}]}},{"id":"systems-virtualization","parent":"systems","title":{"en":"Virtualization and Isolation","es":"Virtualización y aislamiento"},"summary":{"en":"Decide what must remain separate: a container isolates process views and resources, while a virtual machine also has its own guest kernel.","es":"Decide qué debe quedar separado: un contenedor aísla vistas y recursos de procesos; una máquina virtual también tiene su propio núcleo invitado."},"details":{"en":["Containers and virtual machines can be combined: several containers may run inside one VM. A container memory cap controls a workload within that guest, while the VM allocation limits the guest as a whole. These nested limits can slow a process or cause it to be stopped even when another VM on the physical host has spare capacity. Check the isolation boundary separately from the capacity available at each layer."],"es":["Los contenedores y las máquinas virtuales pueden combinarse: varios contenedores pueden ejecutarse dentro de una misma máquina virtual. El límite de memoria de un contenedor controla una carga dentro del invitado, mientras que la asignación de la máquina virtual limita al invitado completo. Estos límites anidados pueden ralentizar o detener un proceso aunque otra máquina virtual del anfitrión físico tenga capacidad libre. Comprueba por separado la barrera de aislamiento y la capacidad disponible en cada capa."]},"aws":{"en":"Use a separate Nitro-based EC2 virtual instance for the image converter. Nitro combines dedicated network and storage hardware with a lightweight hypervisor on virtual instances, while you still configure the guest and network permissions.","es":"Utiliza una instancia virtual de EC2 basada en Nitro separada para el conversor de imágenes. Nitro combina hardware dedicado a red y almacenamiento con un hipervisor ligero en las instancias virtuales; tú sigues configurando el invitado y los permisos de red."},"question":{"en":"The converter has a container memory limit. Does that give the customer API the same isolation as placing conversion in another virtual machine?","es":"El conversor tiene un límite de memoria en su contenedor. ¿Ofrece eso a la API para clientes el mismo aislamiento que ejecutar la conversión en otra máquina virtual?"},"answer":{"en":"No. The limit governs resource consumption, not ownership of the kernel. Both containers still depend on the host kernel, so a flaw that crosses that boundary could affect the API. For this untrusted-input workload, I would put conversion in a separate VM and narrow its network permissions, while retaining resource limits inside it. That adds a guest-kernel boundary, but the hypervisor, configuration and software updates still matter. I would test performance rather than assume the extra boundary has a fixed cost.","es":"No. Ese límite regula el consumo de recursos, pero no separa los núcleos. Ambos contenedores dependen del núcleo anfitrión; una vulnerabilidad que atraviese esa barrera podría afectar a la API. Para procesar archivos no fiables, usaría otra máquina virtual, restringiría su acceso de red y mantendría límites de recursos dentro. Así añado una separación entre núcleos invitados, aunque siguen importando el hipervisor, la configuración y las actualizaciones. Mediría el rendimiento, en lugar de atribuir un coste fijo a esa separación adicional."},"related":["systems","cloud-ec2"],"sources":[{"label":"The Security Design of the AWS Nitro System","url":"https://docs.aws.amazon.com/whitepapers/latest/security-design-of-aws-nitro-system/security-design-of-aws-nitro-system.html"},{"url":"https://man7.org/linux/man-pages/man7/namespaces.7.html","label":"man7.org: namespaces.7"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"},{"url":"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html","label":"docs.aws.amazon.com: ec2 nitro instances"}],"level":"deep","learning":{"definition":{"en":"Virtualization divides physical computing resources into environments that behave like separate machines. Isolation restricts what one environment can access or disrupt, allowing workloads to share hardware while limiting how faults and permissions spread.","es":"La virtualización divide los recursos físicos de cómputo en entornos que se comportan como máquinas independientes. El aislamiento restringe aquello a lo que un entorno puede acceder o afectar, permitiendo compartir hardware y limitando el alcance de los fallos y los permisos."},"simple":{"en":"In a virtual machine, a hypervisor, the layer controlling access to hardware, presents virtual processors, memory and devices to a guest operating system. Each guest runs its own kernel, the core that manages processes and hardware access. A container instead runs isolated processes using the host's kernel. Namespaces give those processes separate views of resources, while control groups account for and limit resource use. The shared kernel remains a common security dependency.","es":"En una máquina virtual, el hipervisor, la capa que controla el acceso al hardware, presenta procesadores, memoria y dispositivos virtuales a un sistema operativo invitado. Cada invitado utiliza su propio núcleo, que gestiona los procesos y el acceso al hardware. Un contenedor ejecuta procesos aislados sobre el núcleo del anfitrión. Los espacios de nombres les ofrecen vistas separadas de los recursos, mientras los grupos de control contabilizan y limitan su consumo. El núcleo compartido sigue siendo una dependencia de seguridad común."},"analogy":{"en":"Containers resemble rooms sharing a building's utilities; virtual machines resemble buildings with separate internal services on one managed site. The comparison stops at the boundary: neither arrangement explains every possible software vulnerability.","es":"Los contenedores recuerdan a habitaciones que comparten las instalaciones de un edificio; las máquinas virtuales, a edificios con servicios internos separados dentro de un recinto gestionado. La comparación no explica todas las posibles vulnerabilidades del software."},"walkthrough":{"en":["A team runs a customer API and an image converter on one server. The converter processes files uploaded by strangers. Packaging each service in a container separates its visible processes and files, but both still call the same host kernel.","A malformed image makes the converter consume excessive memory. A configured memory limit, enforced through a control group, can contain that resource demand, although it does not remove the risk of a kernel vulnerability.","The team moves conversion into a separate virtual machine with its own guest kernel and a capped resource allocation. It also restricts network access to the API, because a machine boundary alone does not stop an allowed network request."],"es":["Un equipo ejecuta una API para clientes y un conversor de imágenes en un servidor. El conversor procesa archivos subidos por desconocidos. Encapsular cada servicio en un contenedor separa sus procesos y archivos visibles, pero ambos siguen utilizando el mismo núcleo anfitrión.","Una imagen malformada dispara el consumo de memoria del conversor. Un límite de memoria configurado mediante un grupo de control puede contener esa demanda, aunque no elimina el riesgo de una vulnerabilidad en el núcleo.","El equipo traslada la conversión a otra máquina virtual, con su propio núcleo invitado y una asignación de recursos limitada. También restringe el acceso de red a la API: separar las máquinas no impide por sí solo una petición de red permitida."]},"pitfalls":{"en":["Packaging software in a container does not create a separate kernel. Restrict privileges, remove unnecessary host access and maintain the host as part of the security boundary.","Two environments with four virtual processors can perform differently because processor design, sharing and device paths vary. Measure the actual workload rather than comparing processor counts alone."],"es":["Empaquetar software en un contenedor no crea un núcleo independiente. Restringe los privilegios, elimina accesos innecesarios al anfitrión y mantén ese anfitrión como parte de la barrera de seguridad.","Dos entornos con cuatro procesadores virtuales pueden rendir de forma distinta por el diseño del procesador, los recursos compartidos y las rutas de acceso a dispositivos. Mide la carga real, sin limitarte a contar procesadores."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man7/namespaces.7.html","label":"man7.org: namespaces.7"},{"url":"https://man7.org/linux/man-pages/man7/cgroups.7.html","label":"man7.org: cgroups.7"},{"url":"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html","label":"docs.aws.amazon.com: ec2 nitro instances"}]}},{"id":"systems-storage","parent":"systems","title":{"en":"Storage Fundamentals","es":"Fundamentos de almacenamiento"},"summary":{"en":"Choose storage by the operations the application needs, then size it for capacity and performance.","es":"Elige el almacenamiento según las operaciones que necesita la aplicación y después dimensiona su capacidad y rendimiento."},"details":{"en":["An object key can include slashes without representing a real directory. Some object stores implement a rename by copying data to a new key and deleting the old key in a separate request. Consumers may then observe an intermediate state. A release manifest, a small object listing the objects belonging to one completed release, gives readers an explicit publication point instead of relying on an atomic directory rename."],"es":["Una clave de objeto puede incluir barras sin representar un directorio real. Algunos almacenes de objetos resuelven un renombrado copiando los datos a otra clave y borrando la anterior en una petición separada. Los lectores pueden observar un estado intermedio. Un manifiesto de publicación, un objeto pequeño que enumera los objetos de una entrega ya completada, ofrece un punto de publicación explícito sin depender de que el renombrado de un directorio ocurra de forma indivisible."]},"aws":{"en":"For the photo agency, put the single-server catalogue on EBS, the Linux editors' shared project directory on EFS, and published images in S3, after verifying the editor's file-locking requirements.","es":"Para la agencia, sitúa el catálogo de un solo servidor en EBS, el directorio de proyectos compartido por los editores Linux en EFS y las imágenes publicadas en S3, tras comprobar los requisitos de bloqueo del programa de edición."},"question":{"en":"The agency already stores finished photos in S3. Can it move the editing application's shared folder there unchanged by adding a bucket mount?","es":"La agencia ya guarda las fotos terminadas en S3. ¿Puede trasladar allí la carpeta compartida del programa de edición sin modificarlo, simplemente montando el bucket?"},"answer":{"en":"I would check the editor's file operations before proposing that move. If it relies on coordinated locks, partial updates or atomic renames, a bucket mount may translate those operations differently or not support them. The existing object store remains suitable for publishing completed photos through API requests, but that does not establish compatibility with the editing workflow. I would retain shared file storage for the editors unless a tested translation layer or an application redesign provides the behaviour they actually need.","es":"Comprobaría las operaciones del editor antes de proponer el traslado. Si depende de bloqueos coordinados, modificaciones parciales o renombrados indivisibles, el montaje puede traducir esas operaciones de otra forma o no admitirlas. El almacén de objetos sigue siendo adecuado para publicar fotografías terminadas mediante peticiones de API, pero eso no demuestra compatibilidad con la edición. Mantendría el almacenamiento de archivos compartido salvo que una capa de traducción probada o un rediseño de la aplicación aporte el comportamiento que realmente necesita."},"related":["systems-storage-types","systems-raid-durability","systems-filesystems"],"sources":[{"label":"Amazon S3 - What is Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"url":"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html","label":"docs.aws.amazon.com: whatisefs"},{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html","label":"docs.aws.amazon.com: ebs volume types"}],"level":"foundation","learning":{"definition":{"en":"Storage interfaces define how an application addresses and changes persistent data, data intended to outlive a running process. Block, file and object storage offer different contracts for those operations, so the interface must fit how the application works.","es":"Las interfaces de almacenamiento definen cómo una aplicación localiza y modifica datos persistentes, pensados para conservarse más allá de la ejecución de un proceso. Los bloques, los archivos y los objetos ofrecen distintas reglas para esas operaciones, por lo que la interfaz debe encajar con la aplicación."},"simple":{"en":"With block storage, the operating system reads and writes numbered chunks; it commonly adds a filesystem to turn them into files. With file storage, a service manages directories and files that clients access using a file protocol. With object storage, an application sends requests using a key, the object's identifier, and receives data plus descriptive metadata. These interfaces expose different operations, so moving identical bytes between them can require changing the program that uses them.","es":"Con almacenamiento por bloques, el sistema operativo lee y escribe fragmentos numerados; suele añadir un sistema de archivos para organizarlos como archivos. En el almacenamiento de archivos, un servicio gestiona directorios y archivos que los clientes usan mediante un protocolo de archivos. Con objetos, la aplicación envía peticiones con una clave, el identificador del objeto, y recibe datos junto con metadatos descriptivos. Cada interfaz ofrece operaciones distintas, por lo que trasladar los mismos bytes puede exigir cambios en el programa."},"analogy":{"en":"Block storage resembles loose pages you organise, file storage a shared filing cabinet, and object storage labelled parcels. These images describe how data is addressed, not its physical medium or resistance to failure.","es":"Los bloques recuerdan a hojas sueltas que tú organizas; los archivos, a un archivador compartido; los objetos, a paquetes con etiquetas. La comparación describe cómo se localizan los datos, no su soporte físico ni su resistencia a fallos."},"walkthrough":{"en":["A photo agency keeps a catalogue database on one server. The database updates small regions of its files and expects filesystem behaviour, so the team uses a filesystem on block storage for that server’s database.","Two editing servers need the same project directory and use cooperating file locks to avoid overwriting each other's work. The team chooses a shared file service and tests the protocol's locking and concurrent-access behaviour with the editing software.","Finished photographs are published under object keys such as releases/portrait-42.jpg. A web service retrieves them through an API. Publishing a corrected photograph writes a replacement object; it does not modify a mounted database file byte by byte."],"es":["Una agencia de fotografía mantiene la base de datos de su catálogo en un servidor. La base de datos modifica pequeñas zonas de sus archivos y necesita las operaciones de un sistema de archivos, así que el equipo lo instala sobre almacenamiento por bloques.","Dos servidores de edición necesitan el mismo directorio de proyectos y respetan bloqueos para no sobrescribir el trabajo del otro. El equipo elige un servicio de archivos compartido y prueba cómo gestiona su protocolo los bloqueos y el acceso simultáneo con ese programa de edición.","Las fotografías terminadas se publican con claves de objeto como releases/portrait-42.jpg. Un servicio web las recupera mediante una API. Publicar una fotografía corregida supone escribir un objeto de sustitución, no modificar byte a byte un archivo de base de datos montado."]},"pitfalls":{"en":["A bucket mounted as a directory can still lack operations the application expects. Check rename, locking and partial-write behaviour rather than treating a familiar path as proof of compatibility.","Shared access is not safe concurrent access. Attaching block storage to multiple machines requires supported coordination, such as a cluster-aware filesystem, rather than two independent filesystems editing the same blocks."],"es":["Montar un contenedor de objetos como directorio no aporta necesariamente las operaciones que espera la aplicación. Comprueba los renombrados, los bloqueos y las escrituras parciales; una ruta conocida no demuestra compatibilidad.","Compartir acceso no basta para escribir simultáneamente sin conflictos. Conectar almacenamiento por bloques a varias máquinas exige coordinación compatible, como un sistema de archivos para clústeres, no dos sistemas de archivos independientes modificando los mismos bloques."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html","label":"docs.aws.amazon.com: whatisefs"},{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html","label":"docs.aws.amazon.com: ebs volume types"}]}},{"id":"systems-storage-types","parent":"systems-storage","title":{"en":"Storage Media and Performance","es":"Medios de almacenamiento y rendimiento"},"summary":{"en":"Measure request size, operations per second and waiting time together; the storage medium alone does not describe application performance.","es":"Mide conjuntamente el tamaño de petición, las operaciones por segundo y la espera; el soporte físico no explica por sí solo el rendimiento de la aplicación."},"details":{"en":["Queue depth is the number of requests still outstanding. Roughly, completed operations per second multiplied by average latency in seconds gives the average number of outstanding operations in a stable workload. For example, 2,000 IOPS at 0.005 seconds implies about ten outstanding requests. More concurrency can keep a device occupied, but once a bottleneck is saturated it can mainly lengthen the queue and increase latency."],"es":["La profundidad de cola es el número de peticiones pendientes de completar. En una carga estable, multiplicar las operaciones completadas por segundo por la latencia media en segundos aproxima el número medio de operaciones pendientes. Por ejemplo, 2.000 IOPS con 0,005 segundos implican unas diez peticiones pendientes. Aumentar la concurrencia puede mantener ocupado el dispositivo, pero, una vez saturado un cuello de botella, puede sobre todo alargar la cola y aumentar la latencia."]},"aws":{"en":"For the subscription database on EC2, use a gp3 EBS volume and configure IOPS and throughput separately within service and instance limits. The HDD alternatives st1 and sc1 target sequential data workloads and cannot hold the boot volume.","es":"Para la base de datos de suscripciones en EC2, utiliza un volumen EBS gp3 y configura por separado las IOPS y la tasa de transferencia dentro de los límites del servicio y la instancia. Las alternativas HDD st1 y sc1 se orientan a datos secuenciales y no pueden ser el volumen de arranque."},"question":{"en":"The database transfers less than 30 MiB/s during normal traffic but lookup latency is high. Would increasing its provisioned throughput solve the problem?","es":"La base de datos transfiere menos de 30 MiB/s con tráfico normal, pero las consultas tienen mucha latencia. ¿Se resolvería aumentando la tasa de transferencia aprovisionada?"},"answer":{"en":"Not from those numbers alone. Small random reads can hit an operations limit or wait behind other requests while transferring little data. I would check read latency, request size, queue depth and whether the volume or instance is reaching its IOPS limit. If the export triggers the slowdown, I would test throttling or separating it. Increasing throughput helps when transferred bytes are the constraint; it does not directly fix slow individual operations, exhausted IOPS or a busy database process.","es":"Esas cifras no bastan para concluirlo. Las lecturas pequeñas y aleatorias pueden alcanzar un límite de operaciones o esperar detrás de otras peticiones aunque muevan pocos datos. Revisaría la latencia de lectura, el tamaño de petición, la cola y si el volumen o la instancia alcanza su límite de IOPS. Si la exportación provoca la ralentización, probaría a limitarla o separarla. Aumentar la tasa ayuda cuando el límite está en los bytes transferidos; no corrige directamente operaciones lentas, IOPS agotadas ni un proceso de base de datos ocupado."},"related":["systems-storage","systems-raid-durability"],"sources":[{"label":"Amazon EBS Volume Types","url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}],"level":"applied","learning":{"definition":{"en":"Storage performance describes how quickly a system completes reads and writes under a particular workload. Understanding the storage medium and the access pattern helps identify which limit causes an application to wait.","es":"El rendimiento del almacenamiento describe con qué rapidez un sistema completa lecturas y escrituras bajo una carga concreta. Entender el soporte físico y el patrón de acceso ayuda a identificar qué límite hace esperar a la aplicación."},"simple":{"en":"An SSD stores data electronically, while an HDD moves mechanical parts to reach locations on spinning disks. Scattered requests make an HDD repeatedly reposition, increasing waiting time. IOPS counts completed input/output operations per second; throughput measures the amount of data transferred per second. Latency measures how long an individual operation takes. A workload can transfer many megabytes with relatively few large requests, so high throughput does not by itself show that small requests finish quickly.","es":"Una unidad SSD almacena datos electrónicamente; un disco HDD mueve piezas mecánicas para acceder a discos giratorios. Las peticiones dispersas obligan al HDD a reposicionarse y aumentan la espera. Las IOPS cuentan operaciones de entrada y salida completadas por segundo; la tasa de transferencia mide datos transferidos por segundo. La latencia mide cuánto tarda una operación. Una carga puede mover muchos megabytes con pocas peticiones grandes: una tasa elevada no demuestra que las peticiones pequeñas se resuelvan rápido."},"analogy":{"en":"A courier handling many small envelopes resembles high IOPS; a lorry carrying bulky crates resembles high throughput. Neither comparison tells you how long one urgent envelope waits when the depot becomes busy.","es":"Un mensajero que tramita muchos sobres pequeños recuerda a unas IOPS elevadas; un camión con cajas voluminosas, a una tasa de transferencia alta. Ninguna comparación indica cuánto espera un sobre urgente cuando se acumula trabajo."},"walkthrough":{"en":["A subscription service's database must read one 8 KiB page for each lookup. At 3,000 uncached lookups per second, those reads alone require about 23.4 MiB/s, modest data volume despite thousands of separate operations.","Its nightly export instead reads 1 MiB chunks sequentially. At 120 reads per second it transfers 120 MiB/s, moving more data with fewer operations. The team measures lookup latency separately rather than judging both jobs by transferred bytes.","On the shared volume, lookups slow when the export starts. The team compares request queues, volume limits and the server's storage bandwidth. It throttles the export and tests again before buying capacity that might leave the real bottleneck unchanged."],"es":["La base de datos de un servicio de suscripciones necesita leer una página de 8 KiB por consulta. Con 3.000 consultas por segundo sin caché, esas lecturas requieren unos 23,4 MiB/s: pocos datos para miles de operaciones independientes.","La exportación nocturna lee fragmentos de 1 MiB de forma secuencial. Con 120 lecturas por segundo transfiere 120 MiB/s, más datos con menos operaciones. El equipo mide aparte la latencia de las consultas, en vez de valorar ambos trabajos solo por los bytes transferidos.","Las consultas se ralentizan cuando empieza la exportación en el volumen compartido. El equipo compara las colas de peticiones, los límites del volumen y el ancho de banda del servidor hacia el almacenamiento. Limita la exportación y repite la prueba antes de comprar capacidad que quizá no resuelva el cuello de botella."]},"pitfalls":{"en":["An IOPS figure without request size and latency targets is incomplete. Large requests may also be split by the storage service, changing how operations are counted.","Adding storage capacity need not remove a server-side bandwidth limit. Check the whole request path, and include burst behaviour and sustained demand when interpreting a short test."],"es":["Una cifra de IOPS sin tamaño de petición ni objetivo de latencia está incompleta. El servicio de almacenamiento también puede dividir peticiones grandes, lo que cambia cómo se cuentan las operaciones.","Añadir capacidad de almacenamiento no elimina necesariamente un límite de ancho de banda del servidor. Revisa todo el recorrido de la petición y considera las ráfagas y la demanda sostenida al interpretar una prueba corta."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html","label":"docs.aws.amazon.com: ebs volume types"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}]}},{"id":"systems-raid-durability","parent":"systems-storage","title":{"en":"RAID Concepts and Durability","es":"Conceptos RAID y durabilidad"},"summary":{"en":"Use RAID to tolerate specific disk failures, and separate backups to recover earlier data.","es":"Usa RAID para tolerar determinados fallos de disco y copias independientes para recuperar datos anteriores."},"details":{"en":["RAID operates on blocks, not on the meaning of an application's records. A database may have updated some blocks but not others when a crash happens, so readable mirrored disks can still require transaction-log recovery. Likewise, a snapshot taken during active writes is not automatically an application-consistent backup; use the application's supported checkpoint or backup process when a coordinated recovery point is required."],"es":["RAID trabaja con bloques, sin interpretar los registros de una aplicación. Una base de datos puede haber actualizado unos bloques y otros no al producirse una caída, por lo que unos discos en espejo legibles aún pueden necesitar recuperación mediante el registro de transacciones. Del mismo modo, una instantánea tomada durante escrituras activas no es automáticamente coherente para la aplicación; utiliza su mecanismo de punto de control o copia de seguridad cuando necesites un punto de recuperación coordinado."]},"aws":{"en":"For an EC2 file server, take regular EBS snapshots and test restoring them to a new volume. EBS replicates within one Availability Zone; adding a same-zone mirror does not create protection against losing the whole zone.","es":"Para un servidor de archivos en EC2, crea instantáneas periódicas de EBS y prueba su restauración en un volumen nuevo. EBS replica dentro de una zona de disponibilidad; añadir un espejo en esa zona no protege frente a su pérdida completa."},"question":{"en":"We mirrored two disks, but a folder we accidentally deleted yesterday is gone from both. Has RAID failed, and how should we recover?","es":"Tenemos dos discos en espejo, pero la carpeta que borramos ayer por error falta en ambos. ¿Ha fallado RAID y cómo la recuperamos?"},"answer":{"en":"The mirror has probably done what it was configured to do: apply the same writes, including deletion, to both disks. RAID 1 helps when one member fails; it does not retain earlier file versions. Look for a backup or snapshot created before the deletion and restore it to a separate location for verification. Rebuilding the mirror would only copy the current contents. Afterwards, set a backup retention period that covers how long mistakes may take to notice, and test a restore.","es":"El espejo probablemente ha hecho lo previsto: aplicar las mismas escrituras, incluido el borrado, en ambos discos. RAID 1 ayuda ante el fallo de un disco, pero no conserva versiones anteriores. Busca una copia de seguridad o una instantánea previa al borrado y restáurala en otra ubicación para verificarla. Reconstruir el espejo solo copiaría el contenido actual. Después, fija una retención de copias que cubra el tiempo que podéis tardar en detectar un error y prueba una restauración."},"related":["systems-storage","disaster-recovery"],"sources":[{"label":"Amazon S3 Durability and Availability","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/DataDurability.html"},{"url":"https://docs.kernel.org/admin-guide/md.html","label":"docs.kernel.org: md"},{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/raid-config.html","label":"docs.aws.amazon.com: raid config"}],"level":"applied","learning":{"definition":{"en":"RAID combines several disks into one logical storage device, the device an operating system sees as a disk. It lets an operator trade usable capacity against performance and tolerance of disk failures; durability concerns whether the data remains intact over time.","es":"RAID agrupa varios discos en un único dispositivo lógico, que el sistema operativo ve como un disco. Permite elegir un equilibrio entre capacidad útil, rendimiento y tolerancia a fallos de discos; la durabilidad expresa si los datos se conservan intactos con el paso del tiempo."},"simple":{"en":"In RAID 0, a controller splits each stream of data into pieces and places successive pieces on different disks. This striping lets disks work in parallel, but a failed member leaves missing pieces. RAID 1 instead writes each change to mirrored members, which hold copies of the same data. With two equally sized disks, the mirror offers roughly one disk's usable capacity. It can continue from the remaining member after a single-disk failure, provided that member is healthy.","es":"En RAID 0, un controlador divide los datos en fragmentos y los reparte entre discos. Esta distribución permite trabajar en paralelo, pero un disco averiado deja fragmentos inaccesibles. RAID 1 escribe cada cambio en discos en espejo, que conservan copias del mismo contenido. Con dos discos iguales, el espejo ofrece aproximadamente la capacidad útil de uno. Puede seguir funcionando tras fallar un disco si el otro está sano."},"analogy":{"en":"Mirroring resembles keeping two identical working notebooks: either can replace a damaged copy. The comparison stops at human judgement, because a storage mirror also repeats an accidental deletion rather than deciding to preserve the old page.","es":"Un espejo se parece a mantener dos cuadernos idénticos: cualquiera sustituye al que se estropee. La comparación tiene un límite: el almacenamiento también replica un borrado accidental, sin decidir conservar la página anterior."},"walkthrough":{"en":["A small design studio needs about one terabyte for its project files and has two one-terabyte disks. It chooses RAID 1, accepting roughly one terabyte of usable space so each saved file is written to both members.","One disk fails while the team is editing a drawing. The healthy member still contains the saved data. After replacing the failed disk, the operator rebuilds the mirror by copying existing data onto the replacement; redundancy is reduced until this finishes.","Later, a designer deletes the wrong project folder. That deletion reaches both mirrored disks, so replacing hardware would not bring the folder back. The studio restores it from a separately retained backup taken before the mistake."],"es":["Un pequeño estudio de diseño necesita aproximadamente un terabyte para sus proyectos y dispone de dos discos de un terabyte. Elige RAID 1 y acepta cerca de un terabyte útil para que cada archivo guardado se escriba en ambos discos.","Un disco falla mientras el equipo edita un plano. El disco sano conserva los datos guardados. Tras sustituir el averiado, el administrador reconstruye el espejo copiando el contenido al recambio; hasta terminar, el conjunto tiene menos redundancia.","Más adelante, una diseñadora borra por error una carpeta de proyectos. El borrado llega a ambos discos, así que cambiar el hardware no recuperaría la carpeta. El estudio la restaura desde una copia de seguridad independiente, anterior al error."]},"pitfalls":{"en":["A mirror does not cover every failure: shared power, software bugs or damage to the whole machine can affect both copies. Keep recoverable backups outside that shared failure scope.","Rebuilding is additional disk work while protection is reduced. A second member failure in a two-disk mirror can leave no usable copy; test restoration before relying on a backup."],"es":["El espejo no cubre cualquier fallo: un problema eléctrico compartido, un error de software o daños en todo el equipo pueden afectar a ambas copias. Conserva copias recuperables fuera de ese mismo ámbito de fallo.","La reconstrucción añade trabajo a los discos mientras la protección está reducida. Si falla el otro disco del espejo, puede no quedar ninguna copia utilizable; comprueba que puedes restaurar tus copias de seguridad."]},"sourceUrls":[{"url":"https://docs.kernel.org/admin-guide/md.html","label":"docs.kernel.org: md"},{"url":"https://docs.aws.amazon.com/ebs/latest/userguide/raid-config.html","label":"docs.aws.amazon.com: raid config"}]}},{"id":"cloud","parent":null,"title":{"en":"Cloud Compute and Distributed Systems","es":"Cómputo en la nube y sistemas distribuidos"},"summary":{"en":"Separate work so one slow component can be retried or scaled without holding up the whole request.","es":"Separa el trabajo para poder reintentar o ampliar un componente lento sin bloquear toda la petición."},"details":{"en":["Saving an order and publishing its job are two separate writes. If only the first succeeds, no worker may ever receive the job. One approach is an outbox: save a pending-event row in the same database transaction as the order, then let a separate publisher send it to the queue. Publication can still happen more than once, so the consumer must handle duplicates."],"es":["Guardar un pedido y publicar su tarea son dos escrituras separadas. Si solo se completa la primera, puede que ningún trabajador llegue a recibir la tarea. Una opción es una bandeja de salida transaccional: guarda una fila de evento pendiente en la misma transacción de base de datos que el pedido y deja que otro proceso la publique en la cola. La publicación aún puede repetirse, por lo que el consumidor debe tratar los duplicados."]},"aws":{"en":"Scale an EC2 Auto Scaling group from the SQS receipt backlog per worker, with worker rate limits that keep total sends within the email provider's quota.","es":"Escala un grupo de EC2 Auto Scaling según los recibos pendientes en SQS por trabajador y limita el ritmo de cada trabajador para mantener el envío total dentro de la cuota del proveedor de correo."},"question":{"en":"Sale orders still complete quickly, but receipt emails arrive twenty minutes late. Should we double the checkout servers?","es":"Durante las rebajas, las compras se completan rápido, pero los recibos por correo llegan veinte minutos tarde. ¿Duplicamos los servidores de compra?"},"answer":{"en":"Checkout is already responding quickly, so I would investigate receipt delivery first. Check the oldest waiting job's age, worker processing time and the provider's throttling responses. If workers are busy and the provider has spare capacity, add receipt workers. If the provider is limiting sends, more workers can create extra failures; pace requests and let the queue absorb the burst. Preserve the receipt identifier on retries so a duplicate-aware provider can recognize the repeated request.","es":"La compra ya responde rápido, así que investigaría primero el envío de recibos. Revisa la antigüedad de la tarea más antigua, el tiempo de procesamiento y las respuestas de limitación del proveedor. Si los trabajadores están ocupados y el proveedor admite más tráfico, añade trabajadores. Si limita los envíos, añadirlos puede provocar más fallos; regula el ritmo y deja que la cola absorba el pico. Mantén el identificador del recibo al reintentar para que un proveedor con detección de duplicados reconozca la misma petición."},"related":["cloud-compute","cloud-distributed-systems"],"sources":[{"label":"AWS Compute Services Overview","url":"https://aws.amazon.com/products/compute/"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"},{"url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/scale-your-group.html","label":"docs.aws.amazon.com: scale your group"}],"level":"foundation","learning":{"definition":{"en":"Cloud compute lets a team obtain processing capacity without owning the physical servers. A distributed system uses separate, network-connected processes to deliver one application, with coordination needed because those processes can slow down or fail independently.","es":"La computación en la nube permite obtener capacidad de procesamiento sin tener servidores físicos en propiedad. Un sistema distribuido utiliza procesos separados, conectados por red, para ofrecer una aplicación; necesita coordinación porque esos procesos pueden ralentizarse o fallar de forma independiente."},"simple":{"en":"A client sends a request to one service, a program responsible for part of the application. Other services may run on different machines, so they communicate across a network rather than sharing one uninterrupted execution. A queue holds jobs until a worker process can handle them. Adding workers increases processing capacity only while dependencies have spare capacity. Because a missing reply can mean either failure or a lost response, retry logic must avoid repeating business effects.","es":"Un cliente envía una petición a un servicio, un programa encargado de una parte de la aplicación. Otros servicios pueden ejecutarse en máquinas distintas y se comunican por la red, sin compartir una ejecución continua. Una cola guarda tareas hasta que un proceso trabajador puede atenderlas. Añadir trabajadores aumenta la capacidad solo si las dependencias tienen margen. Como la ausencia de respuesta puede indicar un fallo o una respuesta perdida, los reintentos deben evitar repetir efectos como un cobro."},"analogy":{"en":"A restaurant's order tickets let the kitchen work separately from the counter while a rush builds a waiting line. The analogy has limits: digital tickets can be delivered twice, so workers need explicit duplicate handling.","es":"Los pedidos escritos de un restaurante permiten que la cocina trabaje aparte del mostrador mientras crece la espera. La comparación es limitada: los mensajes digitales pueden llegar duplicados y requieren un tratamiento explícito."},"walkthrough":{"en":["A shop's checkout service records a paid order and creates a durable receipt job, a stored request to send its email. Checkout can reply before the email is sent, because receipt delivery is handled separately.","During a sale, jobs arrive faster than two email workers can handle them. A controller adds workers as the backlog per worker grows, but caps their number to respect the email provider's sending limit.","One worker sends a request but loses the response. It retries with the same receipt identifier, allowing an email provider that supports duplicate detection to recognize the retry instead of accepting it as a new send."],"es":["El servicio de compra de una tienda registra un pedido pagado y crea una tarea persistente para enviar el recibo por correo. Puede responder al cliente antes de enviar el mensaje, porque la entrega del recibo se gestiona por separado.","Durante las rebajas, llegan más tareas de las que pueden atender dos trabajadores de correo. Un controlador añade trabajadores cuando crece el trabajo pendiente por trabajador, pero limita su número para respetar la capacidad de envío del proveedor.","Un trabajador envía una petición, pero pierde la respuesta. La reintenta con el mismo identificador de recibo, lo que permite a un proveedor con detección de duplicados reconocer el reintento en vez de aceptarlo como un envío nuevo."]},"pitfalls":{"en":["A queue buys time, not unlimited capacity. If work arrives faster than the permitted processing rate for long enough, customers still experience increasing delays.","Repeated requests can repeat charges or messages unless the receiving operation handles duplicates. Retries also need backoff, increasing the delay between attempts, to avoid overwhelming a struggling dependency."],"es":["Una cola da tiempo, no capacidad ilimitada. Si las tareas llegan más rápido de lo que permite procesarlas el sistema durante suficiente tiempo, los clientes seguirán sufriendo retrasos crecientes.","Las peticiones repetidas pueden duplicar cobros o mensajes si la operación receptora no trata los duplicados. Los reintentos también necesitan una espera progresiva entre intentos para no saturar una dependencia que ya tiene dificultades."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"},{"url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/scale-your-group.html","label":"docs.aws.amazon.com: scale your group"}]}},{"id":"cloud-compute","parent":"cloud","title":{"en":"Compute Options","es":"Opciones de cómputo"},"summary":{"en":"Match the execution model to the job's duration and the infrastructure your team can operate.","es":"Ajusta el modelo de ejecución a la duración del trabajo y a la infraestructura que tu equipo puede gestionar."},"details":{"en":["Concurrency is the number of executions active at once, not the arrival rate. If jobs arrive at two per second and each takes thirty seconds, roughly sixty concurrent executions are needed to keep pace during steady conditions. Any downstream database must tolerate that activity; changing from containers to functions does not remove its connection limit."],"es":["La concurrencia es el número de ejecuciones activas a la vez, no el ritmo de llegada. Si llegan dos tareas por segundo y cada una tarda treinta segundos, hacen falta unas sesenta ejecuciones simultáneas para mantener el ritmo en condiciones estables. Una base de datos utilizada por esas tareas debe soportar esa actividad; cambiar contenedores por funciones no elimina su límite de conexiones."]},"aws":{"en":"Use Amazon ECS with AWS Fargate for twenty-five-minute PDF recognition workers, keeping input and output in S3 so replacing a task does not erase completed work.","es":"Utiliza Amazon ECS con AWS Fargate para trabajadores que reconocen PDF durante veinticinco minutos y guarda entradas y resultados en S3, de modo que sustituir una tarea no borre el trabajo terminado."},"question":{"en":"Each PDF needs twenty-five minutes of processing, and our team does not want to patch servers. Do we need to rewrite the job for Lambda?","es":"Cada PDF necesita veinticinco minutos de procesamiento y el equipo no quiere mantener los servidores actualizados. ¿Tenemos que reescribir el trabajo para Lambda?"},"answer":{"en":"I would run the existing worker as an ECS task on Fargate. Its twenty-five-minute execution exceeds Lambda's fifteen-minute limit, while Fargate lets the team run containers without administering the underlying servers. Put PDFs and results in shared durable storage, and make retries recognize an already completed document. The team still owns application dependencies and access permissions. Splitting the work into shorter functions could be a later redesign, but it is not required just to avoid server patching.","es":"Ejecutaría el trabajador actual como una tarea de ECS en Fargate. Sus veinticinco minutos superan el límite de quince minutos de Lambda, mientras que Fargate permite ejecutar contenedores sin administrar los servidores subyacentes. Guarda los PDF y los resultados en almacenamiento compartido duradero y haz que los reintentos reconozcan documentos ya completados. El equipo sigue siendo responsable de las dependencias y los permisos de acceso. Dividir el trabajo en funciones más cortas podría ser un rediseño posterior, pero no es necesario solo para evitar actualizar servidores."},"related":["cloud-ec2","cloud-lambda","cloud-containers"],"sources":[{"label":"AWS Lambda Quotas","url":"https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"},{"url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}],"level":"foundation","learning":{"definition":{"en":"Compute is the processing capacity that executes a program. Choosing a compute model sets the boundary between the environment your team operates and the environment a provider operates, so the code can run within its technical and operational needs.","es":"La capacidad de procesamiento permite ejecutar un programa. Elegir un modelo de ejecución establece qué parte del entorno gestiona tu equipo y cuál gestiona el proveedor, para que el código pueda funcionar dentro de sus requisitos técnicos y operativos."},"simple":{"en":"A virtual machine gives your team an operating system to configure and maintain. A container packages an application with its dependencies while sharing its host's kernel, the core of the operating system. A managed function runs a handler, the code called for an event, inside an environment the provider manages. These boundaries determine who patches which layers and how work starts. Long-running tasks need an environment that permits their duration; sudden arrivals also make startup time and scaling limits important.","es":"Una máquina virtual te permite configurar y mantener un sistema operativo. Un contenedor empaqueta la aplicación y sus dependencias, pero comparte el núcleo, la parte central del sistema operativo, del equipo anfitrión. Una función gestionada ejecuta el código que responde a un evento en un entorno mantenido por el proveedor. Estos límites determinan quién actualiza cada capa y cómo arranca el trabajo. Las tareas largas necesitan un entorno que admita su duración; ante picos, también importan el arranque y los límites de escalado."},"analogy":{"en":"A container image resembles a packed tool case: it brings the tools a worker needs without bringing the whole workshop. The comparison stops at execution, because containers still depend on a compatible host kernel.","es":"Una imagen de contenedor se parece a una caja de herramientas preparada: lleva lo necesario sin trasladar todo el taller. El límite está en la ejecución, porque sigue necesitando un núcleo anfitrión compatible."},"walkthrough":{"en":["An archive receives scanned PDFs throughout the day. A developer measures one document's text-recognition job at twenty-five minutes, keeps each PDF in shared storage and records pending work in a queue, a waiting list for jobs.","An indivisible twenty-five-minute job exceeds Lambda's fifteen-minute invocation limit. The team packages the recognition software in a container and uses a service that schedules these containers; requiring containers alone would not justify managing virtual machines directly.","A worker reads a PDF, writes the searchable text to shared storage and records completion under the document's identifier. If its container is replaced, another worker can inspect that record rather than relying on files left inside the previous container."],"es":["Un archivo documental recibe PDF escaneados durante el día. Un desarrollador mide veinticinco minutos para reconocer el texto de un documento, guarda cada PDF en almacenamiento compartido y registra el trabajo pendiente en una cola, una lista de tareas en espera.","Una tarea indivisible de veinticinco minutos supera el límite de quince minutos por invocación de Lambda. El equipo empaqueta el reconocimiento en un contenedor y utiliza un servicio que programa su ejecución; necesitar contenedores no obliga a gestionar directamente máquinas virtuales.","Un trabajador lee un PDF, escribe el texto que permitirá hacer búsquedas en almacenamiento compartido y registra la finalización con el identificador del documento. Si se sustituye su contenedor, otro trabajador puede consultar ese registro sin depender de los archivos locales del anterior."]},"pitfalls":{"en":["Container packaging does not remove host maintenance. Someone still patches the host; the responsibility depends on whether your team runs the machines or uses managed container capacity.","Temporary local files and a warm function environment are not dependable storage. Keep recoverable progress externally, and check runtime limits before choosing an execution model."],"es":["Empaquetar en contenedores no elimina el mantenimiento del anfitrión. Alguien debe actualizarlo; la responsabilidad depende de si tu equipo administra las máquinas o utiliza capacidad gestionada para contenedores.","Los archivos locales temporales y un entorno de función aún activo no son almacenamiento fiable. Guarda fuera el progreso recuperable y comprueba los límites de ejecución antes de elegir un modelo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"},{"url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}]}},{"id":"cloud-ec2","parent":"cloud-compute","title":{"en":"EC2 and Instance Selection","es":"EC2 y selección de instancias"},"summary":{"en":"Choose EC2 resources from the measured bottleneck, then decide how to pay for the capacity.","es":"Elige los recursos de EC2 según el cuello de botella medido y después decide cómo pagar esa capacidad."},"details":{"en":["Standard EC2 monitoring exposes CPU utilization but not guest operating-system memory use. Collect memory and swap measurements with an agent, and inspect the job's busy interval rather than only daily averages. A compatible processor architecture also matters: moving an existing x86 binary to an Arm instance requires a compatible build, even if the advertised resource sizes look suitable."],"es":["La monitorización estándar de EC2 muestra el uso de CPU, pero no el consumo de memoria del sistema operativo invitado. Recoge métricas de memoria e intercambio con un agente y revisa el intervalo de actividad del trabajo, no solo medias diarias. También importa la arquitectura del procesador: trasladar un binario x86 a una instancia Arm requiere una compilación compatible, aunque los recursos anunciados parezcan adecuados."]},"aws":{"en":"Run the CloudWatch agent on a report-processing EC2 instance to collect memory and swap metrics, then compare a compatible R-family size with its current M-family size using the same input.","es":"Instala el agente de CloudWatch en la instancia EC2 que procesa informes para recoger métricas de memoria e intercambio y compara un tamaño compatible de la familia R con el actual de la familia M usando la misma entrada."},"question":{"en":"Our nightly report is slow on an M-family instance, yet CPU averages 25%. Should we move to C-family instances because they are described as compute-optimized?","es":"El informe nocturno tarda mucho en una instancia M, aunque la CPU promedia un 25 %. ¿Deberíamos pasar a la familia C porque está optimizada para procesamiento?"},"answer":{"en":"I would check memory pressure and disk activity before changing families. A 25% CPU average can hide short peaks, but sustained swapping would suggest the job lacks working memory. Compare the same report on a compatible memory-focused instance and measure completion time alongside total run cost. If there is little swapping, investigate other constraints, such as storage throughput, before adding RAM. Choose a purchasing commitment only after establishing suitable capacity and predictable usage; a discount does not make an undersized machine finish sooner.","es":"Comprobaría la presión de memoria y la actividad de disco antes de cambiar de familia. Una CPU media del 25 % puede ocultar picos, pero el intercambio continuo sugeriría falta de memoria de trabajo. Compara el mismo informe en una instancia compatible orientada a memoria y mide duración y coste total. Si apenas hay intercambio, investiga otros límites, como el rendimiento del almacenamiento, antes de añadir RAM. Asume un compromiso de compra cuando conozcas la capacidad adecuada y el uso previsible; un descuento no acelera una máquina insuficiente."},"related":["cloud-compute","cloud-scaling","cost-optimization"],"sources":[{"label":"Amazon EC2 Instance Purchasing Options","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"},{"url":"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html","label":"docs.aws.amazon.com: ec2 nitro instances"}],"level":"applied","learning":{"definition":{"en":"EC2 provides configurable servers in AWS, called instances, for running software under your control. Selecting an instance means matching its processor, memory and input/output capacity to the workload, while choosing separately how its capacity is purchased.","es":"EC2 ofrece servidores configurables en AWS, llamados instancias, para ejecutar software bajo tu control. Seleccionar una instancia consiste en ajustar su capacidad de procesamiento, memoria y entrada/salida a la carga de trabajo, y decidir por separado cómo contratar esa capacidad."},"simple":{"en":"The operating system schedules an application's work on processors and keeps active data in RAM, its working memory. A shortage of RAM can force repeated disk access, so extra processors may sit idle rather than speed things up. Instance families offer different resource proportions: M balances resources, C emphasizes processing, R and X emphasize memory, and I or D target local storage. A size selects capacity within that family; measuring the bottleneck tells you which resource needs changing.","es":"El sistema operativo reparte el trabajo entre procesadores y mantiene los datos activos en RAM, la memoria de trabajo. Si falta RAM, puede recurrir repetidamente al disco y dejar procesadores ociosos. Las familias ofrecen distintas proporciones de recursos: M los equilibra, C prioriza procesamiento, R y X priorizan memoria, e I o D se orientan al almacenamiento local. El tamaño determina la capacidad dentro de esa familia; medir el cuello de botella indica qué recurso necesita cambiar."},"analogy":{"en":"Choosing an instance resembles sizing a workbench: a larger surface helps when materials do not fit, while a faster worker may still lack room. Unlike a workbench, compute capacity also has measurable network and storage limits.","es":"Elegir una instancia se parece a dimensionar una mesa de trabajo: ampliarla ayuda cuando no caben los materiales, aunque trabajar más rápido no cree espacio. La comparación no incluye los límites medibles de red y almacenamiento."},"walkthrough":{"en":["A nightly sales report runs on an instance with 8 GiB of RAM. The operating system repeatedly moves working data into configured swap space, disk space used to extend
