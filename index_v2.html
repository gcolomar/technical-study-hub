"},"summary":{"en":"Compare queues, publish/subscribe and event routing, including retries and duplicate delivery.","es":"Compara colas, publicación/suscripción y enrutamiento de eventos, incluidos reintentos y entregas duplicadas."},"details":{"en":["SQS Standard provides at-least-once delivery and best-effort ordering. FIFO preserves order within a message group and deduplicates eligible producer retries within a five-minute deduplication interval; this does not prevent consumer redelivery after a visibility timeout or failure before deletion. End-to-end business effects need idempotency. SNS provides fan-out, while EventBridge routes matching events between supported sources and targets. Select using ordering, retention, replay, throughput and subscriber requirements."],"es":["SQS Standard ofrece entrega al menos una vez y orden de mejor esfuerzo. FIFO preserva orden por grupo y elimina reintentos duplicados elegibles del productor en un intervalo de cinco minutos; no impide reentrega al consumidor tras timeout de visibilidad o fallo antes de borrar. Los efectos de negocio necesitan idempotencia. SNS distribuye a suscriptores y EventBridge enruta eventos entre fuentes y destinos compatibles. Elige según orden, retención, reproducción, capacidad y suscriptores."]},"aws":{"en":"SQS for point-to-point work queues, SNS for fan-out notifications, EventBridge for cross-service event routing with filtering.","es":"SQS para colas de trabajo punto a punto, SNS para notificaciones de difusion, EventBridge para enrutamiento de eventos entre servicios con filtrado."},"question":{"en":"A team built a payment processor on SQS FIFO and assumes duplicate charges are impossible. Why is that assumption wrong?","es":"Un equipo construyó un procesador de pagos sobre SQS FIFO y asume que los cobros duplicados son imposibles. ¿Por qué esa suposición es incorrecta?"},"answer":{"en":"Step 1: clarify that FIFO exactly-once applies to the queue's message deduplication of producer sends, not to the consumer's execution. Step 2: identify the real risk window: if the consumer charges the card and then fails before deleting the message, the message becomes visible again once its visibility timeout expires, another receive picks it up, and the charge can happen twice. Step 3: fix by making the charge idempotent at the payment gateway (an idempotency key per order), independent of any queue-level guarantee.","es":"Paso 1: aclara que el exactamente-una-vez de FIFO aplica a la deduplicación de los envíos del productor en la cola, no a la ejecución del consumidor. Paso 2: identifica la ventana de riesgo real: si el consumidor cobra la tarjeta y luego falla antes de borrar el mensaje, el mensaje vuelve a ser visible cuando expira su tiempo de visibilidad, otra recepción lo toma y el cobro puede repetirse. Paso 3: corrige haciendo idempotente el cobro en el gateway de pagos (una clave de idempotencia por pedido), con independencia de las garantías de la cola."},"related":["cloud-distributed-systems","data-consistency"],"sources":[{"label":"Amazon SQS FIFO queues","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html"},{"label":"Amazon SQS visibility timeout","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html"},{"label":"Amazon EventBridge - What is EventBridge","url":"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html","label":"docs.aws.amazon.com: FIFO queues understanding logic"}],"level":"applied","learning":{"definition":{"en":"A queue holds messages so a producer and a consumer do not have to run at the same speed. In a point to point queue competing consumers each take different messages, so a message is intended for one consumer, which is a design intent rather than a guarantee against redelivery; a topic fans a message out to many subscribers; a log style stream keeps messages so consumers can re read them.","es":"Una cola guarda mensajes para que productor y consumidor no tengan que ir a la misma velocidad. En una cola punto a punto los consumidores compiten y cada uno toma mensajes distintos, así que un mensaje va destinado a un consumidor, lo cual es una intención de diseño y no una garantía contra la reentrega; un tema lo reparte a muchos suscriptores; un flujo tipo registro conserva los mensajes para que los consumidores puedan releerlos."},"simple":{"en":"A queue is a buffer between two parts of a system. The sender drops work in and carries on, and the receiver takes work at its own pace.","es":"Una cola es un amortiguador entre dos partes de un sistema. Quien envía deja el trabajo y sigue, y quien recibe lo toma a su propio ritmo."},"analogy":{"en":"A restaurant ticket rail between waiters and the kitchen. Limit: a paper ticket is visibly taken and cannot be cooked twice, while a queue message becomes invisible for a visibility timeout and reappears if it is not deleted in time, so the same order can legitimately be cooked twice and the kitchen must notice.","es":"El riel de tickets de un restaurante entre camareros y cocina. Límite: un ticket de papel se ve cuando alguien lo toma y no se puede cocinar dos veces, mientras un mensaje de cola se vuelve invisible durante un tiempo de visibilidad y reaparece si no se borra a tiempo, así que el mismo pedido puede cocinarse dos veces y la cocina debe darse cuenta."},"walkthrough":{"en":["Use a queue to decouple and to absorb bursts. The producer writes a message and returns quickly, and the consumer fleet drains the backlog at whatever rate it can sustain, so a traffic spike becomes a longer queue instead of failed requests. Queue depth and message age then become your primary health signals.","Understand delivery semantics precisely. Amazon SQS standard queues provide at least once delivery and best effort ordering, so a consumer can receive a message more than once and out of order. Processing is made effectively once by your handler, which should record the message identifier or use a conditional write, not by the queue.","Then handle the failure paths. A visibility timeout hides a received message while it is processed and must exceed your real processing time, or another consumer will pick it up while the first is still working. A dead letter queue captures messages that fail repeatedly so a poison message cannot block progress, and FIFO queues offer ordering within a message group with deduplication."],"es":["Usa una cola para desacoplar y absorber ráfagas. El productor escribe un mensaje y regresa rápido, y la flota de consumidores drena el atraso al ritmo que puede sostener, así que un pico de tráfico se convierte en una cola más larga en vez de peticiones fallidas. La profundidad de la cola y la edad de los mensajes pasan a ser tus señales de salud principales.","Entiende con precisión la semántica de entrega. Las colas estándar de Amazon SQS ofrecen entrega al menos una vez y orden de mejor esfuerzo, así que un consumidor puede recibir un mensaje más de una vez y fuera de orden. El procesamiento se vuelve efectivamente único gracias a tu handler, que debe registrar el identificador del mensaje o usar una escritura condicional, no gracias a la cola.","Después maneja las rutas de fallo. Un tiempo de visibilidad oculta el mensaje recibido mientras se procesa y debe superar tu tiempo real de proceso, o otro consumidor lo tomará mientras el primero sigue trabajando. Una cola de mensajes fallidos recoge los que fallan repetidamente para que un mensaje envenenado no bloquee el avance, y las colas FIFO ofrecen orden dentro de un grupo de mensajes con deduplicación."]},"pitfalls":{"en":["Believing a queue gives exactly once processing. Standard SQS delivers at least once, and even with deduplication a consumer can crash after acting and before deleting, so the handler itself must be idempotent.","Setting a visibility timeout shorter than processing time. The message reappears and a second consumer starts the same work, producing duplicates that look like a queue bug but are the configured behaviour."],"es":["Creer que una cola da procesamiento exactamente una vez. SQS estándar entrega al menos una vez, y aun con deduplicación un consumidor puede caerse después de actuar y antes de borrar, así que el handler debe ser idempotente.","Fijar un tiempo de visibilidad menor que el tiempo de proceso. El mensaje reaparece y un segundo consumidor empieza el mismo trabajo, produciendo duplicados que parecen un error de la cola pero son el comportamiento configurado."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html","label":"docs.aws.amazon.com: sqs visibility timeout"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html","label":"docs.aws.amazon.com: FIFO queues understanding logic"}]},"diagrams":[{"id":"queue-flow","kind":"flow","nodes":["cloud-queues-messaging"],"title":{"en":"Producer, queue, consumer","es":"Productor, cola, consumidor"},"caption":{"en":"The queue turns a synchronous dependency into a buffer, so the producer stops waiting. It does not remove capacity planning: it changes the question to how long the backlog may take to clear.","es":"La cola convierte una dependencia sincrónica en un amortiguador, así que el productor deja de esperar. No elimina la planificación de capacidad: cambia la pregunta a cuánto puede tardar en vaciarse el atasco."},"alt":{"en":"Three stages. Producers, an order service and a web application, write messages and answer immediately. A main queue holds the backlog, with a dead-letter queue that receives a message once it has been received more times than the configured limit. Consumers, a worker fleet that scales on queue depth or message age, process and then delete messages. Notes explain that delivery is at least once so handlers must be idempotent, that consumer capacity follows from how fast the backlog must clear, and that a repeatedly failing message can hold up the messages ordered behind it until it is moved aside.","es":"Tres etapas. Los productores, un servicio de pedidos y una aplicación web, escriben mensajes y responden de inmediato. Una cola principal retiene el atasco, con una cola de mensajes fallidos que recibe un mensaje cuando se ha recibido más veces que el límite configurado. Los consumidores, una flota de trabajadores que escala según la profundidad de la cola o la edad del mensaje, procesan y luego borran los mensajes. Las notas explican que la entrega es al menos una vez, así que los manejadores deben ser idempotentes, que la capacidad de consumo se deduce de lo rápido que deba vaciarse el atasco, y que un mensaje que falla repetidamente puede frenar a los mensajes ordenados detrás de él hasta que se aparta."},"flows":[{"label":{"en":"One message, end to end","es":"Un mensaje, de principio a fin"},"stages":[{"zone":{"en":"Producers","es":"Productores"},"items":[{"label":{"en":"Order service","es":"Servicio de pedidos"},"note":{"en":"Writes the message and answers the customer without waiting for the work.","es":"Escribe el mensaje y responde al cliente sin esperar al trabajo."}},{"label":{"en":"Web application","es":"Aplicación web"},"note":{"en":"Does not know which worker will process it, or when.","es":"No sabe qué trabajador lo procesará, ni cuándo."}}]},{"zone":{"en":"Queue","es":"Cola"},"items":[{"label":{"en":"Main queue","es":"Cola principal"},"note":{"en":"Holds the backlog. A read hides the message for the visibility timeout instead of deleting it.","es":"Retiene el atasco. Una lectura oculta el mensaje durante el tiempo de visibilidad en lugar de borrarlo."}},{"label":{"en":"Dead-letter queue","es":"Cola de mensajes fallidos"},"note":{"en":"Receives a message once it has been received more times than the configured limit, which is not the same as proving the work failed. Until it is moved aside, a poison message can hold up the messages ordered behind it.","es":"Recibe un mensaje cuando se ha recibido más veces que el límite configurado, lo que no demuestra que el trabajo fallara. Hasta que se aparta, un mensaje defectuoso puede frenar a los mensajes ordenados detrás de él."}}]},{"zone":{"en":"Consumers","es":"Consumidores"},"items":[{"label":{"en":"Worker fleet","es":"Flota de trabajadores"},"note":{"en":"Scales on queue depth or the age of the oldest message. Capacity still follows from a decision: how long the backlog may take to clear.","es":"Escala según la profundidad de la cola o la edad del mensaje más antiguo. La capacidad sigue saliendo de una decisión: cuánto puede tardar en vaciarse el atasco."}},{"label":{"en":"Idempotent handler","es":"Manejador idempotente"},"note":{"en":"Delivery is at least once, so the same message can arrive twice. Deduplicate on a business key and delete only after success.","es":"La entrega es al menos una vez, así que el mismo mensaje puede llegar dos veces. Deduplica con una clave de negocio y borra solo tras el éxito."}}]}]}]}]},{"id":"cloud-microservices","parent":"cloud-distributed-systems","title":{"en":"Microservices and Service Boundaries","es":"Microservicios y límites de servicio"},"summary":{"en":"Separate business capabilities into services and weigh independent changes against operational complexity.","es":"Separa capacidades de negocio en servicios y sopesa la independencia de cambios frente a la complejidad operativa."},"details":{"en":["Microservices split a system into independently deployable services, usually bounded by business capability (orders, inventory, payments) rather than technical layer. This enables independent scaling, deployment and team ownership, but adds distributed-systems complexity: network calls replace in-process function calls, requiring service discovery, retries with backoff, circuit breakers, and distributed tracing to debug a request across services. A monolith is often the right starting point; splitting too early adds this cost before the team has enough scale or organizational reasons to need it."],"es":["Los microservicios dividen un sistema en servicios desplegables de forma independiente, usualmente delimitados por capacidad de negocio (ordenes, inventario, pagos) en lugar de capa técnica. Esto permite escalado, despliegue y propiedad de equipo independientes, pero añade complejidad de sistemas distribuidos: las llamadas de red reemplazan llamadas de función en proceso, requiriendo descubrimiento de servicios, reintentos con backoff, circuit breakers, y trazabilidad distribuida para depurar una solicitud entre servicios. Un monolito suele ser el punto de partida correcto; dividir muy pronto añade este costo antes de que el equipo tenga suficiente escala o razones organizacionales para necesitarlo."]},"aws":{"en":"API Gateway/App Mesh/ECS Service Connect for service-to-service communication; X-Ray for distributed tracing across microservices.","es":"API Gateway/App Mesh/ECS Service Connect para comunicación entre servicios; X-Ray para trazabilidad distribuida entre microservicios."},"question":{"en":"A 5-person startup asks whether they should start with microservices to be ready to scale. What do you advise?","es":"Una startup de 5 personas pregunta si debería empezar con microservicios para estar lista para escalar. ¿Qué aconsejas?"},"answer":{"en":"Step 1: point out that microservices solve organizational and independent-scaling problems that a 5-person team building one product does not yet have. Step 2: recommend starting with a well-structured monolith (clear internal module boundaries) that can be deployed as a unit, which is faster to build, test and debug end to end. Step 3: plan the internal module boundaries along the same business-capability lines you would eventually split on, so extraction into services later is a refactor, not a rewrite, when team size or scale actually demands it.","es":"Paso 1: señala que los microservicios resuelven problemas organizacionales y de escalado independiente que un equipo de 5 personas construyendo un producto aún no tiene. Paso 2: recomienda empezar con un monolito bien estructurado (límites internos de módulo claros) que se pueda desplegar como unidad, lo cual es más rápido de construir, probar y depurar de extremo a extremo. Paso 3: planifica los límites internos de módulo según las mismas líneas de capacidad de negocio en las que eventualmente dividirias, para que extraerlos a servicios más adelante sea un refactor, no una reescritura, cuando el tamaño del equipo o la escala realmente lo exijan."},"related":["cloud-distributed-systems","cloud-containers","architecture-discovery"],"sources":[{"label":"AWS X-Ray Developer Guide","url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html"},{"url":"https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/microservices-on-aws.html","label":"docs.aws.amazon.com: microservices on aws"},{"url":"https://aws.amazon.com/microservices/","label":"aws.amazon.com: microservices"}],"level":"deep","learning":{"definition":{"en":"Microservices split an application into small services owned by autonomous teams, each deployable on its own and communicating through well defined interfaces. The organising principle is a business capability per service with its own data, so teams can change and release independently.","es":"Los microservicios dividen una aplicación en servicios pequeños, cada uno a cargo de un equipo autónomo, desplegable por separado y comunicado mediante interfaces bien definidas. El principio organizador es una capacidad de negocio por servicio con sus propios datos, para que los equipos puedan cambiar y publicar de forma independiente."},"simple":{"en":"Instead of one large application, you build several small ones that talk to each other. Each team can release its own part without waiting for the rest.","es":"En vez de una aplicación grande, construyes varias pequeñas que se hablan entre sí. Cada equipo puede publicar su parte sin esperar a las demás."},"analogy":{"en":"A kitchen with separate stations for grill, salads and desserts, each with its own staff and supplies. Limit: stations in one kitchen share a floor and can shout across it, while services communicate over a network that can drop or delay messages, so what was a function call becomes a call that can fail on its own.","es":"Una cocina con estaciones separadas para parrilla, ensaladas y postres, cada una con su personal y sus insumos. Límite: las estaciones comparten un mismo local y pueden gritarse, mientras los servicios se comunican por una red que puede perder o retrasar mensajes, así que lo que era una llamada de función pasa a ser una llamada que puede fallar sola."},"walkthrough":{"en":["Draw the boundaries around business capabilities, not technical layers. Ordering, payment and shipping each change for their own reasons, so a service per capability lets one team release without a coordinated deployment. A service defined as a technical layer instead usually has to be changed with every feature.","Give each service its own data. Shared tables recreate the coupling you were trying to remove, because a schema change then affects several teams at once. The cost is that a business operation spanning services is normally not run as one distributed transaction, because coordinating a two phase commit across services is possible but usually avoided, so it becomes a sequence of steps with compensating actions.","Then pay for the network. Every call needs a timeout, a retry policy and a fallback, and debugging needs distributed tracing with an identifier that follows a request across services. Because that operational load is real, a well structured single application is often the right starting point, split later where the pain is measurable."],"es":["Traza las fronteras alrededor de capacidades de negocio, no de capas técnicas. Pedidos, pagos y envíos cambian por razones propias, así que un servicio por capacidad permite que un equipo publique sin un despliegue coordinado. Un servicio definido como capa técnica, en cambio, suele tener que cambiar con cada función nueva.","Dale a cada servicio sus propios datos. Las tablas compartidas recrean el acoplamiento que querías quitar, porque un cambio de esquema afecta a varios equipos a la vez. El costo es que una operación de negocio que abarca servicios normalmente no se ejecuta como una transacción distribuida, porque coordinar una confirmación en dos fases entre servicios es posible pero suele evitarse, así que se vuelve una secuencia de pasos con acciones compensatorias.","Después paga el precio de la red. Cada llamada necesita un tiempo de espera, una política de reintentos y un plan alternativo, y depurar requiere trazado distribuido con un identificador que siga la petición entre servicios. Como esa carga operativa es real, una sola aplicación bien estructurada suele ser el punto de partida correcto, y se divide después donde el dolor sea medible."]},"pitfalls":{"en":["Splitting services while keeping one shared database. Teams still block each other on schema changes and a slow query still affects everyone, so you pay the network cost without gaining independence.","Expecting an ordinary transaction to span services. A distributed commit is possible but normally avoided for cost and coupling, so multi step operations need explicit compensation and a way to report a partially completed state."],"es":["Dividir servicios y mantener una sola base de datos compartida. Los equipos siguen bloqueándose en los cambios de esquema y una consulta lenta sigue afectando a todos, así que pagas el costo de la red sin ganar independencia.","Esperar que una transacción ordinaria abarque varios servicios. Una confirmación distribuida es posible pero normalmente se evita por costo y acoplamiento, así que las operaciones de varios pasos necesitan compensación explícita y una forma de reportar un estado parcialmente completado."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/microservices-on-aws.html","label":"docs.aws.amazon.com: microservices on aws"},{"url":"https://aws.amazon.com/microservices/","label":"aws.amazon.com: microservices"}]}},{"id":"data","parent":null,"title":{"en":"Data Storage and Processing","es":"Almacenamiento y procesamiento de datos"},"summary":{"en":"Choose how to store, query and process data from the application's requirements.","es":"Elige cómo almacenar, consultar y procesar datos según los requisitos de la aplicación."},"details":{"en":["This root covers how to choose and combine data stores: when a relational model with transactions fits, when a NoSQL model trades flexibility for scale, how caching reduces load at the cost of staleness, and how streaming handles continuous data instead of discrete queries."],"es":["Esta raíz cubre cómo elegir y combinar almacenes de datos: cuándo encaja un modelo relacional con transacciones, cuándo un modelo NoSQL cambia flexibilidad por escala, cómo el caché reduce la carga a costa de datos desactualizados, y cómo el streaming maneja datos continuos en vez de consultas discretas."]},"aws":{"en":"Core services: RDS/Aurora, DynamoDB, ElastiCache, Kinesis/MSK, Redshift.","es":"Servicios centrales: RDS/Aurora, DynamoDB, ElastiCache, Kinesis/MSK, Redshift."},"question":{"en":"How do you choose between a relational database and DynamoDB for a new service?","es":"¿Cómo eliges entre una base de datos relacional y DynamoDB para un servicio nuevo?"},"answer":{"en":"Step 1: identify whether data access is predictable by key (known reads/writes by ID ahead of time), which favors DynamoDB. Step 2: identify whether you need complex multi-table transactions, ad hoc joins or flexible analytical queries, which favors a relational database like Aurora. Step 3: compare scale and latency honestly. DynamoDB can hold low single-digit millisecond read/write latency as a table grows, but that depends on a partition key that spreads traffic evenly, enough provisioned or on-demand capacity, and item sizes and consistency settings that fit the request cost; strongly consistent reads and large items consume more capacity. A relational database instead needs instance sizing, connection management and read replica planning as it grows.","es":"Paso 1: identifica si el acceso a los datos es predecible por clave (lecturas y escrituras por ID conocidas de antemano), lo que favorece a DynamoDB. Paso 2: identifica si necesitas transacciones multitabla complejas, joins ad hoc o consultas analíticas flexibles, lo que favorece a una base relacional como Aurora. Paso 3: compara escala y latencia con honestidad. DynamoDB puede mantener latencias de lectura y escritura de pocos milisegundos mientras la tabla crece, pero eso depende de una clave de partición que reparta el tráfico, de capacidad suficiente (provisionada u on-demand) y de tamaños de ítem y modos de consistencia acordes al coste de la petición; las lecturas fuertemente consistentes y los ítems grandes consumen más capacidad. Una base relacional, en cambio, exige dimensionar la instancia, gestionar conexiones y planificar réplicas de lectura al crecer."},"related":["data-sql","data-nosql"],"sources":[{"label":"Choosing an AWS database service","url":"https://aws.amazon.com/products/databases/"},{"label":"DynamoDB partitions and data distribution","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.Partitions.html"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"},{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}],"level":"foundation","learning":{"definition":{"en":"Data stores are chosen by access pattern. Transactional work reads and writes small records with strict correctness. Analytical work scans large volumes to aggregate. Caches serve repeated reads fast. Streams carry events in order for a period. One engine rarely serves all four well.","es":"Los almacenes de datos se eligen por patrón de acceso. El trabajo transaccional lee y escribe registros pequeños con corrección estricta. El analítico recorre grandes volúmenes para agregar. Las cachés sirven rápido lecturas repetidas. Los flujos transportan eventos en orden durante un periodo. Un solo motor rara vez sirve bien a los cuatro."},"simple":{"en":"Start from how the data will be read and written, not from a product name. Small precise updates, large scans, repeated reads and continuous events each suit a different kind of store.","es":"Parte de cómo se leerán y escribirán los datos, no del nombre de un producto. Las actualizaciones pequeñas y precisas, los recorridos grandes, las lecturas repetidas y los eventos continuos encajan en tipos de almacén distintos."},"analogy":{"en":"A hardware shop keeps a till for individual sales, a stock report for monthly analysis and a front display for the most requested items. Limit: a shop can move stock between these by hand, while moving data between stores means pipelines, delay and a copy that can disagree with the original.","es":"Una ferretería tiene una caja para ventas individuales, un informe de inventario para el análisis mensual y un mostrador con los artículos más pedidos. Límite: una tienda mueve mercancía entre ellos a mano, mientras mover datos entre almacenes implica canalizaciones, retraso y una copia que puede discrepar del original."},"walkthrough":{"en":["Write down the access patterns before choosing anything: the shape of each query, how often it runs, how much data it touches, and how fresh the answer must be. A pattern of reading one order by its identifier and a pattern of summing a year of orders point to different engines even for the same data.","Then decide what correctness the business needs. Money movement needs transactions with clear isolation, while a dashboard can accept a few minutes of staleness. Naming the tolerance in seconds is more useful than describing a system as strongly or eventually consistent, because it tells you what replication lag you can afford.","Expect more than one store, and design the joins between them deliberately. A transactional database, a cache, a stream and a warehouse each hold a view of the same facts, and every copy introduces lag and a chance of divergence, so define which store is authoritative for each fact."],"es":["Escribe los patrones de acceso antes de elegir nada: la forma de cada consulta, con qué frecuencia corre, cuántos datos toca y qué tan fresca debe ser la respuesta. Leer un pedido por su identificador y sumar un año de pedidos apuntan a motores distintos aunque sean los mismos datos.","Después decide qué corrección necesita el negocio. El movimiento de dinero necesita transacciones con aislamiento claro, mientras un panel puede aceptar unos minutos de retraso. Nombrar esa tolerancia en segundos es más útil que describir un sistema como fuertemente o eventualmente consistente, porque te dice cuánto retraso de replicación puedes permitirte.","Espera tener más de un almacén y diseña a propósito las uniones entre ellos. Una base de datos transaccional, una caché, un flujo y un almacén analítico guardan cada uno una vista de los mismos hechos, y cada copia introduce retraso y posibilidad de divergencia, así que define qué almacén es la autoridad para cada hecho."]},"pitfalls":{"en":["Choosing an engine before knowing the queries. A store that fits the first feature can make the second one expensive, and access patterns are far harder to change later than capacity.","Treating a copy as equivalent to the source. A replica, a cache or a warehouse table may lag the original, so a report that must tie to the source needs a stated cut off and a reconciliation count."],"es":["Elegir un motor antes de conocer las consultas. Un almacén que encaja con la primera función puede hacer caro lo segundo, y los patrones de acceso son mucho más difíciles de cambiar después que la capacidad.","Tratar una copia como equivalente al origen. Una réplica, una caché o una tabla analítica pueden ir con retraso respecto al original, así que un informe que deba cuadrar con el origen necesita un corte declarado y un conteo de reconciliación."]},"sourceUrls":[{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"},{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}]}},{"id":"data-sql","parent":"data","title":{"en":"Relational Databases (SQL)","es":"Bases de datos relacionales (SQL)"},"summary":{"en":"Related tables, constraints and transactions, followed by deployment and recovery choices.","es":"Tablas relacionadas, restricciones y transacciones, seguidas de decisiones de despliegue y recuperación."},"details":{"en":["Relational databases organize records into related tables. A schema defines columns and data types; constraints enforce rules such as unique identifiers and valid references. Transactions can group several changes into one consistent operation. SQL expresses queries, including joins that combine related rows. PostgreSQL and MySQL are examples of engines; Amazon RDS manages supported engines, while Aurora is an AWS-built MySQL/PostgreSQL-compatible option. Performance and scaling depend on the workload and deployment, not simply on whether the database is relational.","Common confusion, and the names matter: a Multi-AZ DB instance deployment has ONE standby in another AZ that provides failover support but does not serve read traffic. A Multi-AZ DB cluster deployment is a different RDS option with TWO standby DB instances that provide failover support and can also serve read traffic. Read replicas are asynchronous copies that do serve reads and scale read capacity; for RDS read replicas, promotion to primary is a manual action and the replica can lag, so recent writes can be lost. Aurora behaves differently again: if the writer fails, Aurora automatically promotes one of the cluster's reader instances, typically in less than 60 seconds and often less than 30, so on Aurora the readers ARE the failover targets and should sit in different AZs."],"es":["Las bases de datos relacionales organizan registros en tablas relacionadas. Un esquema define columnas y tipos; las restricciones aplican reglas como identificadores únicos y referencias válidas. Las transacciones agrupan varios cambios en una operación consistente. SQL expresa consultas, incluidos joins que combinan filas relacionadas. PostgreSQL y MySQL son ejemplos de motores; Amazon RDS gestiona motores compatibles, mientras Aurora es una opción de AWS compatible con MySQL/PostgreSQL. El rendimiento y el escalado dependen de la carga y del despliegue, no solo de que la base sea relacional.","Confusión común, y los nombres importan: un despliegue Multi-AZ DB instance tiene UN standby en otra AZ que da conmutación por error pero no sirve tráfico de lectura. Un despliegue Multi-AZ DB cluster es otra opción de RDS, con DOS instancias standby que dan conmutación por error y además pueden servir lecturas. Las réplicas de lectura son copias asíncronas que sí sirven lecturas y escalan capacidad de lectura; en RDS, promover una réplica a primaria es una acción manual y la réplica puede ir rezagada, así que se pueden perder escrituras recientes. Aurora funciona distinto: si falla el writer, Aurora promueve automáticamente una de las instancias reader del clúster, normalmente en menos de 60 segundos y a menudo en menos de 30, por lo que en Aurora los readers SON los destinos de conmutación y conviene repartirlos entre AZ."]},"aws":{"en":"Multi-AZ DB instance for automatic failover with a standby that is not readable; Multi-AZ DB cluster when you also want the standbys to serve reads; read replicas (including cross-Region) for read scaling; Aurora Global Database for cross-Region DR, where replication latency is typically under a second and the switchover or failover is an operation you initiate.","es":"Multi-AZ DB instance para conmutación automática con un standby no legible; Multi-AZ DB cluster cuando además quieras que los standby sirvan lecturas; réplicas de lectura (incluso entre regiones) para escalar lectura; Aurora Global Database para DR entre regiones, donde la latencia de replicación suele ser inferior a un segundo y el switchover o failover es una operación que tú inicias."},"question":{"en":"A team enables 3 read replicas and assumes their database is now highly available. What is wrong with that assumption?","es":"Un equipo habilita tres réplicas de lectura y asume que ya tiene alta disponibilidad. ¿Qué comprobarías sobre replicación y failover?"},"answer":{"en":"Step 1: ask which engine, because the answer differs. On RDS, a read replica is not promoted automatically when the primary fails; promotion is a manual action and asynchronous replication means the replica can lag, so recent writes can be lost. On Aurora, the cluster's reader instances are the failover targets and Aurora promotes one automatically, typically in under 60 seconds. Step 2: on RDS, add a Multi-AZ deployment for automatic failover and choose the right kind: a Multi-AZ DB instance gives one standby that is not readable, while a Multi-AZ DB cluster gives two standbys that also serve reads. Read replicas and Multi-AZ are complementary, not substitutes. Step 3: for the loss of a Region, evaluate Aurora Global Database: replication latency to a secondary Region is typically under a second, but recovery is a switchover (planned, no data loss) or a failover that you initiate, so plan and rehearse an RTO in minutes rather than assuming seconds.","es":"Paso 1: pregunta qué motor, porque la respuesta cambia. En RDS, una réplica de lectura no se promueve automáticamente si falla la primaria; la promoción es manual y la replicación asíncrona puede ir rezagada, así que se pueden perder escrituras recientes. En Aurora, las instancias reader del clúster son los destinos de conmutación y Aurora promueve una automáticamente, normalmente en menos de 60 segundos. Paso 2: en RDS, añade un despliegue Multi-AZ para conmutación automática y elige el tipo correcto: Multi-AZ DB instance da un standby no legible, mientras que Multi-AZ DB cluster da dos standby que además sirven lecturas. Réplicas de lectura y Multi-AZ son complementarios, no sustitutos. Paso 3: para la pérdida de una región, evalúa Aurora Global Database: la latencia de replicación a una región secundaria suele ser inferior a un segundo, pero la recuperación es un switchover (planificado, sin pérdida de datos) o un failover que tú inicias, así que planifica y ensaya un RTO en minutos en vez de suponer segundos."},"related":["data-consistency","disaster-recovery","reliability"],"sources":[{"label":"Amazon RDS Multi-AZ deployments","url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html"},{"label":"High availability for Amazon Aurora","url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html"},{"label":"Amazon Aurora Global Database","url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html","label":"docs.aws.amazon.com: Concepts.MultiAZSingleStandby"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html","label":"docs.aws.amazon.com: Aurora.Replication"}],"level":"applied","learning":{"definition":{"en":"A relational database stores rows in tables with a declared schema, and SQL expresses what you want rather than how to fetch it. Transactions group statements so they commit or roll back together, and an isolation level defines which effects of concurrent transactions a statement may observe.","es":"Una base de datos relacional guarda filas en tablas con un esquema declarado, y SQL expresa qué quieres en vez de cómo obtenerlo. Las transacciones agrupan sentencias para que se confirmen o se deshagan juntas, y un nivel de aislamiento define qué efectos de transacciones concurrentes puede observar una sentencia."},"simple":{"en":"Data lives in tables with defined columns, and you ask questions in SQL. A transaction lets several changes succeed or fail as one unit, which is what protects a transfer between accounts.","es":"Los datos viven en tablas con columnas definidas y preguntas con SQL. Una transacción permite que varios cambios triunfen o fallen como una sola unidad, y eso es lo que protege una transferencia entre cuentas."},"analogy":{"en":"A well kept accounting ledger: entries follow a fixed format and a posting is either complete or not made at all. Limit: a ledger has one clerk, while a database serves thousands of concurrent writers, which is why isolation levels exist and why two correct transactions can still conflict and one be rolled back.","es":"Un libro de contabilidad bien llevado: los asientos siguen un formato fijo y un apunte está completo o no se hace. Límite: un libro tiene un solo tenedor de libros, mientras una base de datos atiende miles de escritores concurrentes, y por eso existen los niveles de aislamiento y dos transacciones correctas pueden aun así entrar en conflicto y una deshacerse."},"walkthrough":{"en":["Model first. Give each fact one home, use keys and constraints so the database enforces invariants your application would otherwise forget, then add indexes for the queries you actually run. An index speeds reads and costs write time and space, so index from the query plan.","Then be explicit about isolation. The SQL standard defines four levels in terms of phenomena that must not occur, such as dirty reads, non repeatable reads and phantoms, and PostgreSQL documents which phenomena each level permits. Choosing read committed versus serializable is a correctness decision, not a tuning knob.","Only then reach for managed engines, and read the deployment shapes carefully. In Amazon RDS a Multi AZ DB instance deployment keeps a synchronous standby in another Availability Zone for failover, and that standby does not serve reads. A Multi AZ DB cluster is a different deployment, with a writer and two readable readers that are also failover targets. In Aurora, reader instances serve reads and one is promoted to writer automatically if the writer becomes unavailable."],"es":["Modela primero. Dale a cada hecho un único lugar, usa claves y restricciones para que la base de datos imponga invariantes que tu aplicación olvidaría, y añade índices para las consultas que de verdad ejecutas. Un índice acelera lecturas y cuesta escritura y espacio, así que indexa a partir del plan de consulta.","Después sé explícito con el aislamiento. El estándar SQL define cuatro niveles en términos de fenómenos que no deben ocurrir, como lecturas sucias, lecturas no repetibles y fantasmas, y PostgreSQL documenta qué fenómenos permite cada nivel. Elegir read committed frente a serializable es una decisión de corrección, no una perilla de ajuste.","Solo entonces pasa a los motores administrados, y lee con cuidado las formas de despliegue. En Amazon RDS un despliegue Multi AZ de instancia mantiene un standby síncrono en otra zona de disponibilidad para la conmutación, y ese standby no sirve lecturas. Un clúster Multi AZ es otro despliegue, con un escritor y dos lectoras legibles que además son destinos de conmutación. En Aurora las lectoras sirven lecturas y una es promovida a escritora de forma automática si el escritor deja de estar disponible."]},"pitfalls":{"en":["Generalising one Multi AZ behaviour to all of them. An RDS Multi AZ DB instance standby is not readable, while an RDS Multi AZ DB cluster has two readable readers, so check the deployment type before promising read capacity.","Treating read replicas and automatic failover as the same feature. Asynchronous replicas add read capacity and can lag, and in RDS promoting one is a deliberate action, whereas Aurora promotes a reader to writer automatically within a cluster."],"es":["Generalizar el comportamiento de un Multi AZ a todos. El standby de una instancia Multi AZ de RDS no es legible, mientras un clúster Multi AZ de RDS tiene dos lectoras legibles, así que comprueba el tipo de despliegue antes de prometer capacidad de lectura.","Tratar las réplicas de lectura y la conmutación automática como la misma función. Las réplicas asíncronas añaden capacidad de lectura y pueden ir con retraso, y en RDS promover una es una acción deliberada, mientras Aurora promueve una lectora a escritora de forma automática dentro del clúster."]},"sourceUrls":[{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html","label":"docs.aws.amazon.com: Concepts.MultiAZSingleStandby"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html","label":"docs.aws.amazon.com: Aurora.Replication"}]}},{"id":"data-nosql","parent":"data","title":{"en":"NoSQL Databases","es":"Bases de datos NoSQL"},"summary":{"en":"Non-relational data models (key-value, document, wide-column, graph) and how to choose one from your access patterns.","es":"Modelos de datos no relacionales (clave-valor, documento, columna ancha, grafo) y cómo elegir uno a partir de tus patrones de acceso."},"details":{"en":["NoSQL is a family of non-relational databases, each built around a data model tuned to particular access patterns and, usually, horizontal scale. AWS groups the family into four main models: key-value, document, wide-column and graph. The label says nothing precise about guarantees: features vary by engine and version, and several offer schema validation, secondary indexes and ACID transactions.","Choose from access patterns, not reputation. Write each read and write as X given Y with volume, latency and consistency needs, then pick the model that answers the highest-value ones directly. Engines overlap on purpose, so a product can cover more than one model. Pitfall: treating NoSQL as a faster relational database when the real fix is an index or a query change."],"es":["NoSQL es una familia de bases de datos no relacionales, cada una construida alrededor de un modelo de datos ajustado a patrones de acceso concretos y, normalmente, a escala horizontal. AWS agrupa la familia en cuatro modelos principales: clave-valor, documento, columna ancha y grafo. La etiqueta no dice nada preciso sobre garantías: las funciones varían según el motor y la versión, y varios ofrecen validación de esquema, índices secundarios y transacciones ACID.","Elige a partir de los patrones de acceso, no de la reputación. Escribe cada lectura y escritura como X dado Y con volumen, latencia y consistencia necesarias, y luego elige el modelo que responde directamente a las de mayor valor. Los motores se solapan a propósito, así que un producto puede cubrir más de un modelo. Error común: tratar NoSQL como una base relacional más rápida cuando el arreglo real es un índice o un cambio de consulta."]},"aws":{"en":"Purpose-built engines per model: DynamoDB (key-value and document), DocumentDB (document, MongoDB-compatible), Keyspaces (wide-column), Neptune (graph), ElastiCache and MemoryDB (in-memory key-value), OpenSearch Service (search).","es":"Motores dedicados por modelo: DynamoDB (clave-valor y documento), DocumentDB (documento, compatible con MongoDB), Keyspaces (columna ancha), Neptune (grafo), ElastiCache y MemoryDB (clave-valor en memoria), OpenSearch Service (búsqueda)."},"question":{"en":"A team says the relational database does not scale and asks which NoSQL database to move to. How do you turn that into a decision?","es":"Un equipo dice que la base relacional no escala y pregunta a qué base NoSQL migrar. ¿Cómo lo convertís en una decisión?"},"answer":{"en":"Start with access patterns and evidence of the bottleneck. Missing indexes, N+1 queries or a saturated writer are possibilities to investigate, not proof that relational storage is the wrong model. Compare keyed lookups with key-value, nested aggregates with document stores, partitioned histories with Cassandra-style wide-column stores, and relationship queries with graphs. Several engines can serve the same pattern. Include the existing relational option, consistency requirements and operating effort before recommending a migration.","es":"Empieza por los patrones de acceso y la evidencia del cuello de botella. Un índice ausente, consultas N+1 o un writer saturado son posibilidades que investigar, no pruebas de que el modelo relacional sea inadecuado. Compara búsquedas por clave con clave-valor, objetos anidados con documentos, históricos particionados con columna ancha de estilo Cassandra y consultas de relaciones con grafos. Varios motores pueden servir el mismo patrón. Incluye la opción relacional existente, la consistencia requerida y el esfuerzo operativo antes de recomendar una migración."},"related":["data-consistency","data-caching"],"sources":[{"label":"AWS: What is NoSQL?","url":"https://aws.amazon.com/nosql/"},{"label":"What is Amazon DynamoDB?","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html"},{"url":"https://www.mongodb.com/docs/manual/core/schema-validation/","label":"mongodb.com: schema validation"}],"level":"foundation","learning":{"definition":{"en":"NoSQL is an umbrella term for non-relational databases. Each engine implements one or more data models, key-value, document, wide-column or graph, chosen to answer specific access patterns. Guarantees vary by engine and version.","es":"NoSQL es un término genérico para bases no relacionales. Cada motor implementa uno o más modelos de datos, clave-valor, documento, columna ancha o grafo, elegidos para responder patrones de acceso concretos. Las garantías varían según el motor y la versión."},"simple":{"en":"Relational tables are designed for general-purpose querying. A NoSQL model is designed around a data shape: some, such as document and graph, still query flexibly, while others give you only the paths you provisioned.","es":"Las tablas relacionales se diseñan para consultar de forma general. Un modelo NoSQL se diseña alrededor de una forma de datos: algunos, como documento y grafo, consultan con flexibilidad, mientras otros solo ofrecen las vías que aprovisionaste."},"analogy":{"en":"Pre-packed boxes, one per order, versus a shelved warehouse with a catalogue. The limit of the analogy: it suggests NoSQL means no rules, which is false. MongoDB validates documents server-side and DynamoDB offers ACID transactions.","es":"Cajas preempaquetadas, una por pedido, frente a un almacén con estanterías y catálogo. El límite de la analogía: sugiere que NoSQL significa sin reglas, y es falso. MongoDB valida documentos en el servidor y DynamoDB ofrece transacciones ACID."},"walkthrough":{"en":["Concept. Every database trades query flexibility against the cost of one operation. Relational engines normalise and recombine at read time, so a new question usually needs no remodelling, though the answer still costs work. Non-relational engines store data closer to a known read, which can make an unplanned read need a new index.","Then the kinds. Key-value: access by key, often with indexes or server-side structures on top. Document: nested records whose fields the engine can index and query. Wide-column: rows partitioned by a partition key and ordered by clustering columns. Graph: relationships stored as records, so traversals are expressed directly.","Products last, and expect overlap. DynamoDB covers key-value and document, Redis and Valkey key-value with native structures, Cassandra and Keyspaces wide-column, Neo4j and Neptune graph. MongoDB and Amazon DocumentDB are both document stores, but DocumentDB is MongoDB-compatible rather than MongoDB.","Method: write each access pattern as read or write X given Y with volume, latency and consistency needs, map each to the model that serves it directly, and weigh the engines you already operate before adding one."],"es":["Concepto. Toda base de datos intercambia flexibilidad de consulta por el coste de una operación. Los motores relacionales normalizan y recombinan al leer, así que una pregunta nueva normalmente no exige remodelar, aunque la respuesta sigue costando trabajo. Los no relacionales guardan los datos más cerca de una lectura conocida, lo que puede hacer que una lectura no prevista necesite un índice nuevo.","Luego los tipos. Clave-valor: acceso por clave, a menudo con índices o estructuras del lado del servidor encima. Documento: registros anidados cuyos campos el motor puede indexar y consultar. Columna ancha: filas particionadas por una clave de partición y ordenadas por columnas de agrupamiento. Grafo: relaciones guardadas como registros, así que los recorridos se expresan directamente.","Los productos al final, y espera solapamiento. DynamoDB cubre clave-valor y documento, Redis y Valkey clave-valor con estructuras nativas, Cassandra y Keyspaces columna ancha, Neo4j y Neptune grafo. MongoDB y Amazon DocumentDB son almacenes de documentos, pero DocumentDB es compatible con MongoDB y no es MongoDB.","Método: escribe cada patrón de acceso como leer o escribir X dado Y con volumen, latencia y consistencia, asigna cada uno al modelo que lo atiende directamente, y pesa los motores que ya operas antes de agregar otro."]},"pitfalls":{"en":["Migrating because relational does not scale, without profiling. Check for a missing index, an N+1 query or a single writer first.","Believing the category implies no schema, no transactions and no joins. Those are per-engine tradeoffs."],"es":["Migrar porque lo relacional no escala, sin perfilar. Revisa primero un índice que falte, una consulta N+1 o un único escritor.","Creer que la categoría implica sin esquema, sin transacciones y sin joins. Son compensaciones de cada motor."]},"sourceUrls":[{"url":"https://aws.amazon.com/nosql/","label":"aws.amazon.com: nosql"},{"url":"https://www.mongodb.com/docs/manual/core/schema-validation/","label":"mongodb.com: schema validation"},{"url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html","label":"docs.aws.amazon.com: Introduction"}]},"diagrams":[{"id":"nosql-types","kind":"stack","interactive":false,"nodes":["data-nosql"],"title":{"en":"Four data shapes, then the products","es":"Cuatro formas de dato, y después los productos"},"caption":{"en":"NoSQL is not one database. The shape of the data and the access patterns you need guide the tradeoffs, so decide the model before arguing about a product. The examples name common products, not recommendations.","es":"NoSQL no es una sola base de datos. La forma del dato y los patrones de acceso que necesitas guían las contrapartidas, así que decide el modelo antes de discutir el producto. Los ejemplos citan productos habituales, no recomendaciones."},"alt":{"en":"Four rows, each with a miniature of the data shape. Key-value: a key such as user#42 pointing to a value, built around access by a known key. Document: a JSON document with nested fields, queried inside the document. Wide-column: rows grouped by a partition key and ordered by a clustering key. Graph: a node joined to another node by a named relationship, traversed along those edges. The examples named are DynamoDB, MongoDB or DocumentDB, Cassandra or Keyspaces, and Neptune. A closing note says the four differ in what they make cheap, so the useful question is which access patterns must be fast.","es":"Cuatro filas, cada una con una miniatura de la forma del dato. Clave-valor: una clave como user#42 que apunta a un valor, construida alrededor del acceso por una clave conocida. Documento: un documento JSON con campos anidados, consultado dentro del documento. Columna ancha: filas agrupadas por una clave de partición y ordenadas por una clave de agrupamiento. Grafo: un nodo unido a otro por una relación con nombre, recorrida a lo largo de esas aristas. Los ejemplos citados son DynamoDB, MongoDB o DocumentDB, Cassandra o Keyspaces, y Neptune. Una nota final indica que los cuatro se diferencian en lo que hacen barato, así que la pregunta útil es qué patrones de acceso deben ser rápidos."},"items":[{"number":"1","sample":"user#42  →  { name, tier }","label":{"en":"Key-value","es":"Clave-valor"},"detail":{"en":"Read and write one item by a key you already know. The model is built around that access, and it helps least when you do not know the key. Example: DynamoDB.","es":"Leer y escribir un elemento por una clave que ya conoces. El modelo se construye alrededor de ese acceso, y es el que menos ayuda cuando no conoces la clave. Ejemplo: DynamoDB."}},{"number":"2","sample":"{ id, name, address: { city } }","label":{"en":"Document","es":"Documento"},"detail":{"en":"Store a nested document and query fields inside it, including queries you did not plan for, at a cost that depends on the indexes you keep. Example: MongoDB, or DocumentDB on AWS.","es":"Guardar un documento anidado y consultar campos dentro de él, incluidas consultas que no planificaste, a un coste que depende de los índices que mantengas. Ejemplo: MongoDB, o DocumentDB en AWS."}},{"number":"3","sample":"sensor#7 | 09:00 | 09:01 | 09:02","label":{"en":"Wide-column","es":"Columna ancha"},"detail":{"en":"Rows grouped by a partition key and ordered by a clustering key, which suits heavy writes and reading a range inside one partition. Example: Cassandra, or Keyspaces on AWS.","es":"Filas agrupadas por una clave de partición y ordenadas por una clave de agrupamiento, lo que encaja con escrituras intensas y con leer un rango dentro de una partición. Ejemplo: Cassandra, o Keyspaces en AWS."}},{"number":"4","sample":"user#42  →[ordered]→  order#88","label":{"en":"Graph","es":"Grafo"},"detail":{"en":"Nodes joined by named relationships, traversed along the edges. It suits questions about how things connect, and the cost still depends on the query and the data. Example: Neptune.","es":"Nodos unidos por relaciones con nombre, que se recorren por las aristas. Encaja con preguntas sobre cómo se conectan las cosas, y el coste sigue dependiendo de la consulta y del dato. Ejemplo: Neptune."}}],"note":{"en":"DynamoDB covers the key-value and document shapes. The four models differ in what they make cheap, so the useful question is which access patterns must be fast, and what you are willing to give up for them.","es":"DynamoDB cubre las formas clave-valor y documento. Los cuatro modelos se diferencian en lo que hacen barato, así que la pregunta útil es qué patrones de acceso deben ser rápidos y a qué estás dispuesto a renunciar por ellos."}}]},{"id":"data-nosql-key-value","parent":"data-nosql","title":{"en":"Key-Value Stores","es":"Almacenes clave-valor"},"summary":{"en":"Access by key as the primary path, and what Redis, Valkey and DynamoDB add beyond a plain opaque value.","es":"Acceso por clave como vía principal, y lo que Redis, Valkey y DynamoDB agregan más allá de un valor opaco simple."},"details":{"en":["In a key-value model the primary access path is the key: you supply it and get the value back. Many engines distribute keys across nodes by hashing, which is why the model scales out well, though the exact placement scheme differs per engine. Values are not always opaque: Redis and Valkey provide native types such as hashes, sets, sorted sets and streams with server-side commands, and DynamoDB supports secondary indexes on attributes.","So the real constraint is that only the access paths you provisioned exist. If a read has no key and no index behind it, you get a scan, an index you maintain in your own write path, or a migration. Pitfall: treating Redis as cache-only. With persistence configured, or with MemoryDB on AWS, the same model can be a primary store."],"es":["En un modelo clave-valor la vía de acceso principal es la clave: la entregas y recibes el valor. Muchos motores distribuyen las claves entre nodos mediante hash, y por eso el modelo escala bien de forma horizontal, aunque el esquema exacto de colocación difiere según el motor. Los valores no siempre son opacos: Redis y Valkey ofrecen tipos nativos como hashes, conjuntos, conjuntos ordenados y streams con comandos del lado del servidor, y DynamoDB admite índices secundarios sobre atributos.","La restricción real es entonces que solo existen las vías de acceso que aprovisionaste. Si una lectura no tiene clave ni índice detrás, te queda un escaneo, un índice que mantienes en tu propia ruta de escritura, o una migración. Error común: tratar Redis solo como caché. Con persistencia configurada, o con MemoryDB en AWS, el mismo modelo puede ser almacén primario."]},"aws":{"en":"ElastiCache runs Redis OSS, Valkey and Memcached; MemoryDB is the durable Multi-AZ variant intended as a primary store; DynamoDB covers the same keyed pattern as a managed table.","es":"ElastiCache ejecuta Redis OSS, Valkey y Memcached; MemoryDB es la variante durable Multi-AZ pensada como almacén primario; DynamoDB cubre el mismo patrón por clave como tabla administrada."},"question":{"en":"A team stores user profiles as JSON strings in Redis and now needs to list every user in a given city. What are the options?","es":"Un equipo guarda perfiles de usuario como cadenas JSON en Redis y ahora necesita listar todos los usuarios de una ciudad. ¿Qué opciones hay?"},"answer":{"en":"Step 1: name the cause. The profile was stored as one string, so no index covers city and the key is the only path; iterating the keyspace with KEYS blocks the server, and SCAN is still a full pass. Step 2: if the pattern is permanent, provision an access path for it: keep a set per city updated in the same write path as the profile, which turns the query into keyed lookups, or store the profiles as Redis hashes or JSON with the Redis Query Engine so fields can be indexed. Step 3: if such questions keep arriving, move the entity to a document store or a table with secondary indexes and keep Redis for the hot keyed reads.","es":"Paso 1: nombra la causa. El perfil se guardó como una sola cadena, así que ningún índice cubre la ciudad y la clave es la única vía; iterar el espacio de claves con KEYS bloquea el servidor, y SCAN sigue siendo un recorrido completo. Paso 2: si el patrón es permanente, aprovisiona una vía de acceso para él: mantén un conjunto por ciudad actualizado en la misma ruta de escritura que el perfil, lo que convierte la consulta en búsquedas por clave, o guarda los perfiles como hashes o JSON de Redis con el Redis Query Engine para poder indexar campos. Paso 3: si esas preguntas siguen llegando, mueve la entidad a un almacén de documentos o a una tabla con índices secundarios y reserva Redis para las lecturas calientes por clave."},"related":["data-caching","data-nosql-document"],"sources":[{"label":"Redis data types overview","url":"https://redis.io/docs/latest/develop/data-types/"},{"label":"AWS: What is NoSQL?","url":"https://aws.amazon.com/nosql/"}],"level":"foundation","learning":{"definition":{"en":"A key-value model makes the key the primary access path: supply the key, get the value. Many engines distribute keys by hashing, though placement and extra capabilities differ per engine.","es":"Un modelo clave-valor convierte la clave en la vía de acceso principal: entregas la clave y obtienes el valor. Muchos motores distribuyen las claves mediante hash, aunque la colocación y las capacidades extra difieren según el motor."},"simple":{"en":"It behaves like a dictionary shared by a whole cluster. You need the key to reach the data; any other way in must be provisioned.","es":"Se comporta como un diccionario compartido por un cluster. Necesitas la clave para llegar al dato; cualquier otra vía hay que aprovisionarla."},"analogy":{"en":"A coat check: hand over a ticket number, get the coat back at once. The limit: a coat check never looks in the pockets, while Redis and Valkey operate on stored structures and DynamoDB can index attributes.","es":"Un guardarropa: entregas un número de ticket y recibes el abrigo de inmediato. El límite: un guardarropa nunca mira en los bolsillos, mientras Redis y Valkey operan sobre estructuras guardadas y DynamoDB puede indexar atributos."},"walkthrough":{"en":["Concept. The design question is which identifier every read already holds: a session ID, a user ID, a device ID, or a composite such as tenant plus order. If the caller must search for the key, this model fits that read only once you add an index.","Kinds. A pure cache such as Memcached keeps opaque values with an eviction policy. A data structure server keeps typed values the engine can manipulate server-side. A durable key-value database adds replication and persistence, so the data can be the system of record.","Products. Redis and its open-source fork Valkey are often called caches, but Redis documents itself as a data structure server: strings, hashes, lists, sets, sorted sets and streams are native, which suits counters, leaderboards, rate limiters and sessions. With persistence configured, or MemoryDB on AWS, the model can be primary storage. DynamoDB serves the same keyed pattern.","Practical steps: fix a key format, separator and version prefix included, because renaming keys later means a dual-write migration. Set a TTL policy per key family. With in-memory engines such as Redis, Valkey or Memcached, size the working set, since it is held in memory. If a non-keyed read appears, provision a path for it rather than scanning."],"es":["Concepto. La pregunta de diseño es qué identificador tiene ya cada lectura: un ID de sesión, de usuario, de dispositivo, o uno compuesto como inquilino más pedido. Si quien llama debe buscar la clave, este modelo encaja para esa lectura solo si agregas un índice.","Tipos. Una caché pura como Memcached guarda valores opacos con una política de desalojo. Un servidor de estructuras de datos guarda valores tipados que el motor puede manipular en el servidor. Una base clave-valor durable agrega replicación y persistencia, así el dato puede ser sistema de registro.","Productos. Redis y su bifurcación de código abierto Valkey se llaman a menudo cachés, pero Redis se documenta como servidor de estructuras de datos: cadenas, hashes, listas, conjuntos, conjuntos ordenados y streams son nativos, lo que sirve para contadores, clasificaciones, limitadores de tasa y sesiones. Con persistencia configurada, o MemoryDB en AWS, el modelo puede ser almacenamiento primario. DynamoDB cubre el mismo patrón por clave.","Pasos prácticos: fija un formato de clave, con separador y prefijo de versión, porque renombrar claves después implica una migración con escritura doble. Define una política de TTL por familia de claves. Con motores en memoria como Redis, Valkey o Memcached, dimensiona el conjunto activo, ya que se mantiene en memoria. Si aparece una lectura que no va por clave, aprovisiona una vía en vez de escanear."]},"pitfalls":{"en":["Storing an opaque blob and expecting to query its fields later. Without an index there is no path except a full pass or a migration.","Running Redis or Valkey KEYS in production: it blocks the server. Use SCAN, and better, design so iteration is never needed."],"es":["Guardar un blob opaco y esperar consultar sus campos después. Sin índice no hay vía salvo un recorrido completo o una migración.","Ejecutar KEYS de Redis o Valkey en producción: bloquea el servidor. Usa SCAN y, mejor, diseña para no iterar."]},"sourceUrls":[{"url":"https://redis.io/docs/latest/develop/data-types/","label":"redis.io: data types"},{"url":"https://aws.amazon.com/nosql/","label":"aws.amazon.com: nosql"}]}},{"id":"data-nosql-document","parent":"data-nosql","title":{"en":"Document Stores","es":"Almacenes de documentos"},"summary":{"en":"Nested self-describing records the engine can index and query inside, and the MongoDB versus DocumentDB compatibility caveat.","es":"Registros anidados autodescriptivos que el motor puede indexar y consultar por dentro, y la advertencia de compatibilidad entre MongoDB y DocumentDB."},"details":{"en":["A document store keeps each record as a nested self-describing structure, JSON or MongoDB's binary BSON, and the engine can index and query fields inside it, for example with dot notation such as name.last. Documents in a collection need not share a shape, but shape is not unchecked: MongoDB supports server-side schema validation rules per collection, so validation can live in the database, the application, or both.","The fit is an aggregate usually read and written as a unit, an order with its lines, since embedding avoids a join. Limits are engine-specific rather than universal: a MongoDB BSON document maxes out at 16 mebibytes, so unbounded embedded arrays eventually fail writes, and other document engines set their own ceilings. Check the limit for the engine and version you run."],"es":["Un almacén de documentos guarda cada registro como una estructura anidada autodescriptiva, JSON o el BSON binario de MongoDB, y el motor puede indexar y consultar campos dentro de ella, por ejemplo con notación de punto como name.last. Los documentos de una colección no necesitan compartir forma, pero la forma no queda sin control: MongoDB admite reglas de validación de esquema del lado del servidor por colección, así que la validación puede vivir en la base de datos, en la aplicación, o en ambas.","El encaje es un agregado que normalmente se lee y escribe como unidad, un pedido con sus líneas, ya que incrustar evita un join. Los límites son propios de cada motor y no universales: un documento BSON de MongoDB llega como máximo a 16 mebibytes, así que los arreglos incrustados sin cota terminan fallando en las escrituras, y otros motores fijan sus propios techos. Consulta el límite del motor y la versión que ejecutas."]},"aws":{"en":"Amazon DocumentDB is MongoDB-compatible, not MongoDB: it implements the API on its own engine and AWS publishes a functional differences list per version, so verify the operators, stages and drivers you use.","es":"Amazon DocumentDB es compatible con MongoDB, no es MongoDB: implementa la API sobre su propio motor y AWS publica una lista de diferencias funcionales por versión, así que verifica los operadores, etapas y controladores que usas."},"question":{"en":"A migration from self-managed MongoDB to Amazon DocumentDB passes basic CRUD tests but an aggregation pipeline fails in staging. How do you approach it?","es":"Una migración de MongoDB autogestionado a Amazon DocumentDB pasa las pruebas CRUD básicas pero una tubería de agregación falla en staging. ¿Cómo lo abordas?"},"answer":{"en":"Step 1: start from the compatibility caveat rather than the code. DocumentDB implements the MongoDB API on its own engine, so the reference is the AWS functional differences page for the DocumentDB version in use. Step 2: run the pipeline one stage at a time to find the unsupported operator, and confirm the engine version, because coverage differs across DocumentDB versions. Step 3: decide per case: rewrite with supported operators, move the analytical query out of the request path, or stay on MongoDB if the workload depends on features DocumentDB does not implement. Add the check to the migration test suite.","es":"Paso 1: parte de la advertencia de compatibilidad, no del código. DocumentDB implementa la API de MongoDB sobre su propio motor, así que la referencia es la página de diferencias funcionales de AWS para la versión de DocumentDB en uso. Paso 2: ejecuta la tubería de a una etapa para encontrar el operador no soportado, y confirma la versión del motor, porque la cobertura difiere entre versiones de DocumentDB. Paso 3: decide caso por caso: reescribe con operadores soportados, saca la consulta analítica de la ruta de la petición, o quédate en MongoDB si la carga depende de funciones que DocumentDB no implementa. Agrega la verificación a la batería de pruebas de migración."},"related":["data-nosql-key-value","data-dynamodb"],"sources":[{"label":"MongoDB Manual: Documents","url":"https://www.mongodb.com/docs/manual/core/document/"},{"label":"MongoDB Manual: Schema validation","url":"https://www.mongodb.com/docs/manual/core/schema-validation/"},{"label":"Functional differences: Amazon DocumentDB and MongoDB","url":"https://docs.aws.amazon.com/documentdb/latest/developerguide/functional-differences.html"}],"level":"foundation","learning":{"definition":{"en":"A document store keeps each record as a nested self-describing structure, JSON or MongoDB's binary BSON, and the engine can index and query fields inside it.","es":"Un almacén de documentos guarda cada registro como una estructura anidada autodescriptiva, JSON o el BSON binario de MongoDB, y el motor puede indexar y consultar campos dentro de ella."},"simple":{"en":"One record holds the whole object, including its nested parts, and you can query those parts directly.","es":"Un registro contiene el objeto completo, con sus partes anidadas, y puedes consultar esas partes directamente."},"analogy":{"en":"A folder per customer: everything in one place, no cross-referencing to reassemble. The limit: folders hold anything, whereas MongoDB can enforce validation per collection, and each engine caps document size.","es":"Una carpeta por cliente: todo sobre él en un lugar, sin referencias cruzadas para reensamblar. El límite: en las carpetas cabe cualquier cosa, mientras MongoDB puede imponer validación por colección, y cada motor limita el tamaño del documento."},"walkthrough":{"en":["Concept. The model suits an aggregate normally read and written as a unit, an order with its lines or a product with its attributes, because embedding removes a read-time join. Data referenced from many places is usually better in its own collection, referenced by id.","Schema. Documents in a collection need not share a shape, but validation is not only the application's job: MongoDB supports server-side schema validation rules per collection, including allowed types and value ranges, so you can enforce an established shape in the database.","Products. MongoDB is the reference implementation, with BSON, dot-notation queries and an aggregation pipeline. Amazon DocumentDB is MongoDB-compatible rather than MongoDB: it implements the API on its own engine, and AWS publishes functional differences per version, so operator and stage coverage must be verified. DynamoDB also supports a document model through nested maps and lists inside an item.","Limits. Do not generalise one engine's ceiling to the category. A MongoDB BSON document maxes out at 16 mebibytes, which is what eventually breaks an unbounded embedded array; other document engines set their own limits. Check the figure for your engine and version, then bound your arrays."],"es":["Concepto. El modelo sirve para un agregado que se lee y escribe como unidad, un pedido con sus líneas o un producto con sus atributos, porque incrustar elimina un join al leer. Los datos referenciados desde muchos lugares suelen quedar mejor en su propia colección, referenciados por id.","Esquema. Los documentos de una colección no necesitan compartir forma, pero la validación no es solo tarea de la aplicación: MongoDB admite reglas de validación de esquema por colección en el servidor, con tipos permitidos y rangos, así que puedes imponer una forma establecida en la base de datos.","Productos. MongoDB es la implementación de referencia, con BSON, consultas con notación de punto y una tubería de agregación. Amazon DocumentDB es compatible con MongoDB y no es MongoDB: implementa la API sobre su propio motor, y AWS publica diferencias funcionales por versión, así que hay que verificar la cobertura de operadores y etapas. DynamoDB también admite un modelo de documento con mapas y listas anidados dentro de un elemento.","Límites. No generalices el techo de un motor a la categoría. Un documento BSON de MongoDB llega como máximo a 16 mebibytes, y eso es lo que acaba rompiendo un arreglo incrustado sin cota; otros motores fijan sus propios límites. Consulta la cifra de tu motor y versión, y acota tus arreglos."]},"pitfalls":{"en":["Embedding an array that grows without bound, until writes hit the document size limit and the fix is a schema change under load.","Treating MongoDB compatibility as identity. Verify the operators, aggregation stages and drivers you use against the target engine's documented differences."],"es":["Incrustar un arreglo que crece sin cota, hasta que las escrituras chocan con el límite de tamaño y el arreglo es un cambio de esquema bajo carga.","Tratar la compatibilidad con MongoDB como identidad. Verifica los operadores, etapas de agregación y controladores que usas contra las diferencias documentadas del motor destino."]},"sourceUrls":[{"url":"https://www.mongodb.com/docs/manual/core/document/","label":"mongodb.com: document"},{"url":"https://www.mongodb.com/docs/manual/core/schema-validation/","label":"mongodb.com: schema validation"},{"url":"https://docs.aws.amazon.com/documentdb/latest/developerguide/functional-differences.html","label":"docs.aws.amazon.com: functional differences"}]}},{"id":"data-nosql-wide-column","parent":"data-nosql","title":{"en":"Wide-Column Stores","es":"Almacenes de columna ancha"},"summary":{"en":"Rows partitioned by a partition key and ordered by clustering columns for efficient range reads, distinct from columnar analytics.","es":"Filas particionadas por una clave de partición y ordenadas por columnas de agrupamiento para lecturas por rango eficientes, distinto de la analítica columnar."},"details":{"en":["Apache Cassandra partitions rows by a partition key and, inside a partition, orders them by clustering columns, so reading a contiguous range such as the latest events for one device is efficient. The table schema is declared in CQL with CREATE TABLE, so this is not a free-form column bag per row; what is flexible is sparse storage and adding columns by altering the schema. Consistency is tunable per query.","Pitfall: reading wide-column as the columnar storage used by analytics engines such as Redshift, Parquet or ClickHouse. Those scan one column across many rows to aggregate, while Cassandra serves keyed operational reads and writes. A cross-partition aggregate has no key to target and fans out across nodes. Second pitfall: too few distinct partition key values, which lets partitions grow until compaction and reads suffer."],"es":["Apache Cassandra particiona las filas por una clave de partición y, dentro de una partición, las ordena por columnas de agrupamiento, así que leer un rango contiguo como los últimos eventos de un dispositivo es eficiente. El esquema de la tabla se declara en CQL con CREATE TABLE, así que esto no es una bolsa libre de columnas por fila; lo flexible es el almacenamiento disperso y agregar columnas alterando el esquema. La consistencia se ajusta por consulta.","Error común: leer columna ancha como el almacenamiento columnar de motores analíticos como Redshift, Parquet o ClickHouse. Esos escanean una columna a lo largo de muchas filas para agregar, mientras Cassandra atiende lecturas y escrituras operativas por clave. Un agregado entre particiones no tiene clave a la que apuntar y se reparte entre nodos. Segundo error: muy pocos valores distintos de clave de partición, lo que deja crecer las particiones hasta que la compactación y las lecturas sufren."]},"aws":{"en":"Amazon Keyspaces is the managed Cassandra-compatible option; Redshift or Athena over Parquet in S3 is where columnar analytical scans belong.","es":"Amazon Keyspaces es la opción administrada compatible con Cassandra; Redshift o Athena sobre Parquet en S3 es donde corresponden los escaneos analíticos columnares."},"question":{"en":"An analyst asks for a monthly revenue-by-country report straight from the Cassandra cluster that serves the checkout path. What do you tell them?","es":"Un analista pide un informe mensual de ingresos por país directamente del cluster de Cassandra que atiende el pago. ¿Qué le respondes?"},"answer":{"en":"Step 1: explain the mismatch rather than tuning the query. The cluster is modelled for keyed reads inside a partition; an aggregate over all countries for a month has no partition key to target, so it becomes a cross-partition scan. Step 2: state the blast radius before anyone tries it, since ALLOW FILTERING or a multi-partition scan on the cluster that takes payments competes with checkout latency. Step 3: serve it from the right place: export orders to S3 and query with Athena or Redshift, or maintain a counter table keyed by country and month if the application itself needs the figure.","es":"Paso 1: explica el desajuste en lugar de afinar la consulta. El cluster está modelado para lecturas por clave dentro de una partición; un agregado de todos los países en un mes no tiene clave de partición a la que apuntar, así que se convierte en un escaneo entre particiones. Paso 2: enuncia el radio de impacto antes de que alguien lo intente, ya que ALLOW FILTERING o un escaneo multipartición en el cluster que cobra compite con la latencia del pago. Paso 3: sírvelo desde el lugar correcto: exporta los pedidos a S3 y consulta con Athena o Redshift, o mantén una tab
