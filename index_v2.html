 TLS session at the balancer.","es":"Para un servicio de pagos cuyos servidores deban verificar los certificados de cliente, utiliza un listener TCP de NLB en el puerto 443 con destinos TCP que terminen TLS y realicen autenticación mutua; un listener TLS de NLB terminaría la sesión TLS del cliente en el balanceador."},"question":{"en":"A shop needs /orders/* and /catalog/* to reach different services behind one HTTPS address. Would enabling TLS on an NLB provide the required routing?","es":"Una tienda necesita enviar /orders/* y /catalog/* a servicios distintos detrás de una sola dirección HTTPS. ¿Activar TLS en un NLB proporcionaría ese enrutamiento?"},"answer":{"en":"Use an ALB with an HTTPS listener and path rules pointing to separate target groups. TLS termination makes the HTTP request available, but terminating encryption alone does not create HTTP routing capabilities: an NLB TLS listener still does not choose targets by URL path. Configure each group with its actual backend protocol and port and an appropriate health check. If both network segments require encryption, use HTTPS to the targets too; encrypting the client connection does not automatically encrypt the backend connection.","es":"Usa un ALB con un listener HTTPS y reglas de ruta hacia grupos de destinos distintos. Terminar TLS deja visible la petición HTTP, pero descifrar no añade capacidad de enrutamiento HTTP: un listener TLS de NLB sigue sin elegir destinos por la ruta de la URL. Configura cada grupo con el protocolo y puerto reales del servidor y una comprobación de estado adecuada. Si ambos tramos necesitan cifrado, utiliza también HTTPS hacia los destinos; cifrar la conexión del cliente no cifra automáticamente la conexión posterior."},"related":["osi-4","osi-7","http","tls","security-groups"],"sources":[{"label":"Application Load Balancer","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html"},{"label":"Network Load Balancer","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html"},{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html","label":"docs.aws.amazon.com: target group health checks"}],"level":"applied","learning":{"definition":{"en":"Load balancing separates the address clients contact from the servers that do the work. In AWS, an Application Load Balancer (ALB) makes routing decisions for individual HTTP requests, while a Network Load Balancer (NLB) distributes transport flows without choosing servers by HTTP paths.","es":"El balanceo de carga separa la dirección que utilizan los clientes de los servidores que realizan el trabajo. En AWS, un Application Load Balancer (ALB) decide el destino de cada petición HTTP, mientras un Network Load Balancer (NLB) distribuye flujos de transporte sin seleccionar servidores por rutas HTTP."},"simple":{"en":"A listener accepts client traffic on a configured protocol and port. A target is a registered backend, such as an application server; a target group collects backends and defines how the balancer contacts and checks them. ALB reads each HTTP request and applies rules to choose a group, then a target. NLB assigns a transport flow to a target; for TCP, that connection stays with the chosen server. Health checks normally remove failing targets from selection.","es":"Un listener recibe tráfico con un protocolo y puerto configurados. Un destino es un servidor registrado; un grupo de destinos reúne servidores y define cómo contactarlos y comprobar su estado. ALB lee cada petición HTTP y aplica reglas para elegir un grupo y después un destino. NLB asigna un flujo de transporte a un destino; en TCP, la conexión permanece con el servidor elegido. Las comprobaciones de estado normalmente excluyen de la selección a los destinos que fallan."},"walkthrough":{"en":["A shopper submits /orders/42 over HTTPS to an ALB listener on port 443. The listener uses its certificate to terminate TLS, making the HTTP path available for routing.","The /orders/* rule selects the orders target group rather than the catalog group. ALB forwards this request to a registered orders server on HTTP port 8080, a separate backend connection.","During checkout, that server fails repeated /ready checks. With another healthy orders server available, ALB sends subsequent matching requests there; it does not repair the failed server or recover the interrupted purchase automatically."],"es":["Un comprador envía /orders/42 mediante HTTPS a un listener de ALB en el puerto 443. El listener utiliza su certificado para terminar TLS y deja visible la ruta HTTP para decidir el destino.","La regla /orders/* selecciona el grupo de pedidos en lugar del catálogo. ALB reenvía esta petición a un servidor de pedidos registrado, mediante una conexión independiente al puerto HTTP 8080.","Durante la compra, ese servidor falla repetidamente en /ready. Como queda otro servidor de pedidos sano, ALB le envía las siguientes peticiones coincidentes; no repara el servidor averiado ni recupera automáticamente la compra interrumpida."]},"analogy":{"en":"A mail sorter uses the department written on each letter, like ALB reading requests; a courier assigns whole sacks, like NLB assigning flows. The limit: network routing follows configured rules, not physical capacity.","es":"Un clasificador lee el departamento de cada carta, como ALB lee peticiones; un transportista asigna sacos completos, como NLB asigna flujos. El límite: las redes siguen reglas configuradas, no el espacio físico disponible."},"pitfalls":{"en":["\"Transport\" guarantees encrypted pass-through: an NLB TLS listener decrypts client traffic; a TCP listener can instead carry TLS intact to the targets.","\"Unhealthy\" always stops requests: ALB fails open when every registered target in the selected group is unhealthy across enabled zones, allowing traffic to those targets. This condition is not a universal rule for all balancers."],"es":["«Transporte» garantiza que el cifrado atraviesa intacto: un listener TLS de NLB descifra el tráfico del cliente; un listener TCP sí puede transportar TLS intacto hasta los destinos.","«No sano» siempre impide recibir peticiones: ALB permite enviarlas a esos destinos cuando todos los registrados en el grupo seleccionado fallan en todas las zonas habilitadas. Este comportamiento no es una regla universal para cualquier balanceador."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html","label":"docs.aws.amazon.com: introduction"},{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html","label":"docs.aws.amazon.com: introduction"},{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html","label":"docs.aws.amazon.com: target group health checks"}]}},{"id":"cidr-overlap","parent":"vpc","title":{"en":"When two machines share a private address","es":"Cuando dos máquinas comparten una dirección privada"},"summary":{"en":"Duplicate private addresses require distinct addresses for general network access, or a service endpoint that gives clients an unambiguous local destination.","es":"Las direcciones privadas duplicadas requieren direcciones distintas para conectar las redes en general, o un punto de enlace que ofrezca un destino local inequívoco para un servicio."},"details":{"en":["Adding a second, non-overlapping CIDR does not make VPC peering valid while any existing ranges still overlap. Moving an application into new subnets changes its addresses but leaves the old VPC range allocated. Full peering therefore requires eliminating every conflicting range, potentially by moving the workload to a replacement VPC."],"es":["Añadir un segundo CIDR sin solapamientos no permite el peering de VPC mientras siga existiendo algún rango coincidente. Mover una aplicación a subredes nuevas cambia sus direcciones, pero deja asignado el rango antiguo de la VPC. Para habilitar el peering hay que eliminar todos los rangos conflictivos, lo que puede exigir trasladar la carga a otra VPC."]},"aws":{"en":"Publish Supplier's inventory API as an NLB-backed PrivateLink endpoint service and authorize Retail's account; Retail connects through interface endpoints in its own subnets, so it never needs a route to Supplier's overlapping 10.0.0.0/16.","es":"Publica la API de inventario de Supplier como un servicio de punto de enlace PrivateLink respaldado por NLB y autoriza la cuenta de Retail; Retail conecta mediante puntos de enlace de interfaz en sus propias subredes, sin necesitar una ruta al 10.0.0.0/16 solapado de Supplier."},"question":{"en":"After a merger, two VPCs using 10.0.0.0/16 need many direct connections in both directions. Would publishing one API through PrivateLink complete the network integration?","es":"Tras una fusión, dos VPC que usan 10.0.0.0/16 necesitan muchas conexiones directas en ambos sentidos. ¿Publicar una API mediante PrivateLink completaría la integración de redes?"},"answer":{"en":"Plan a migration to a non-overlapping address range for one estate. A PrivateLink endpoint would satisfy access to the published API, but would not make arbitrary hosts across both networks independently addressable. Inventory dependencies before moving workloads, update DNS and address-based controls, then establish routes in both directions once the conflicting ranges are removed. VPC peering rejects overlapping blocks, and adding Transit Gateway would not distinguish the duplicate destinations. Test actual application exchanges after migration, including replies.","es":"Planifica migrar una de las redes a un rango sin solapamientos. Un punto de enlace PrivateLink permitiría acceder a la API publicada, pero no distinguiría por dirección a todos los equipos de ambas redes. Identifica dependencias antes de mover cargas, actualiza DNS y controles basados en direcciones, y establece rutas en ambos sentidos cuando hayas eliminado los rangos conflictivos. El peering de VPC rechaza bloques solapados y añadir Transit Gateway no distinguiría los destinos duplicados. Prueba intercambios reales de las aplicaciones tras la migración, incluidas sus respuestas."},"related":["cidr","private-connectivity","hybrid"],"sources":[{"label":"VPC peering limitations","url":"https://docs.aws.amazon.com/vpc/latest/peering/invalid-peering-configurations.html"},{"label":"AWS PrivateLink concepts","url":"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html","label":"docs.aws.amazon.com: vpc peering basics"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}],"level":"applied","learning":{"definition":{"en":"Address overlap occurs when separate networks allocate some of the same IP addresses to different machines. Two servers can both legitimately be 10.0.4.9 while isolated, but connecting their networks does not give that address a way to identify which server you mean.","es":"Hay solapamiento cuando redes separadas asignan algunas de las mismas direcciones IP a máquinas distintas. Dos servidores pueden utilizar legítimamente 10.0.4.9 mientras estén aislados, pero conectar sus redes no añade a esa dirección información para distinguir a cuál quieres llegar."},"simple":{"en":"A packet carries a destination IP, not a company or VPC name. A router matches that address against its routes and selects the most specific matching prefix. If both estates contain 10.0.4.9, selecting a route can direct traffic toward one estate, but cannot make the same destination identify both servers. A local route may keep the packet inside the originating network. Security rules cannot supply the missing destination identity.","es":"Un paquete lleva una IP de destino, no el nombre de una empresa o VPC. El router compara esa dirección con sus rutas y elige el prefijo coincidente más específico. Si ambas redes contienen 10.0.4.9, una ruta puede dirigir el tráfico hacia una de ellas, pero no permite identificar a ambos servidores con el mismo destino. Una ruta local puede retener el paquete en la red de origen. Las reglas de seguridad no aportan la identidad que falta."},"walkthrough":{"en":["Retail and Supplier each use 10.0.0.0/16. A Retail worker and Supplier's inventory API both occupy 10.0.4.9. Retail only needs to query inventory, so directly addressing Supplier's duplicate IP will not meet the requirement.","Supplier places its inventory API behind an NLB and publishes an AWS PrivateLink endpoint service, permitting Retail's account. This exposes the inventory listener rather than offering routes to Supplier's entire network.","Retail creates an interface endpoint at an unused local address, 10.0.8.20, and configures inventory DNS to resolve there. Its worker connects to that address; PrivateLink carries the connection to Supplier's service without routing to the duplicate server address."],"es":["Retail y Supplier utilizan 10.0.0.0/16. Un proceso de Retail y la API de inventario de Supplier ocupan ambos 10.0.4.9. Retail solo necesita consultar inventario, así que dirigirse a la IP duplicada de Supplier no resuelve la necesidad.","Supplier coloca su API de inventario detrás de un NLB y publica un servicio de punto de enlace con AWS PrivateLink, autorizando la cuenta de Retail. Expone el listener de inventario, no rutas hacia toda su red.","Retail crea un punto de enlace de interfaz en una dirección local libre, 10.0.8.20, y configura el DNS de inventario para resolverla. Su proceso conecta con esa dirección; PrivateLink lleva la conexión al servicio de Supplier sin enrutar hacia la dirección duplicada."]},"analogy":{"en":"Two spreadsheets can each contain customer 42. A connector can expose one spreadsheet's lookup without combining those identifiers. The limit: routers see packet addresses, rather than a spreadsheet name identifying the intended context.","es":"Dos hojas de cálculo pueden tener un cliente 42. Un conector permite consultar una sin mezclar sus identificadores. El límite: los routers ven direcciones en paquetes, no el nombre de la hoja que distingue el contexto."},"pitfalls":{"en":["\"A more specific route fixes identical host addresses\": it only chooses one next hop. For general connectivity, migrate one estate to a disjoint address plan.","\"Transit Gateway removes collisions\": it cannot give duplicate IPs separate identities. PrivateLink solves this inventory API access, not unrestricted communication between every host in both VPCs."],"es":["«Una ruta más específica arregla direcciones idénticas»: solo elige un siguiente salto. Para una conexión general entre redes, migra una de ellas a un plan de direcciones sin solapamientos.","«Transit Gateway elimina las colisiones»: no puede dar identidades separadas a IP duplicadas. PrivateLink resuelve el acceso a esta API de inventario, no la comunicación libre entre todos los equipos de ambas VPC."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html","label":"docs.aws.amazon.com: vpc peering basics"},{"url":"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html","label":"docs.aws.amazon.com: concepts"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}]}},{"id":"hybrid","parent":"networking","title":{"en":"Following an API call from the office to AWS","es":"El recorrido de una llamada a una API desde la sede hasta AWS"},"summary":{"en":"Trace a private AWS API call from corporate DNS through the network path and back, then repeat it after the primary link fails.","es":"Sigue una llamada privada a una API de AWS desde el DNS corporativo hasta el servicio y de vuelta, y repítela después de interrumpir el enlace principal."},"details":{"en":["A private DNS setting on an AWS interface endpoint does not automatically change corporate DNS answers. On-premises resolvers need conditional forwarding to Resolver inbound endpoint addresses in the appropriate VPC. Forwarding directly to the VPC base address plus two is unsupported; a working IP route to AWS does not make that DNS shortcut valid."],"es":["Activar DNS privado en un punto de enlace de interfaz de AWS no cambia automáticamente las respuestas del DNS corporativo. Los servidores DNS locales necesitan reenvío condicional hacia las direcciones de Resolver entrante en la VPC correspondiente. Reenviar directamente a la dirección base de la VPC más dos no está admitido; tener una ruta IP funcional hacia AWS no valida ese atajo DNS."]},"aws":{"en":"For the payroll GetSecretValue call, allow corporate DNS servers to reach Resolver inbound endpoints on TCP and UDP 53, and payroll clients to reach the Secrets Manager interface endpoint on TCP 443; restrict IAM and endpoint policies to the required secret.","es":"Para la llamada GetSecretValue de nóminas, permite que los DNS corporativos alcancen los puntos de enlace de Resolver entrante mediante TCP y UDP 53, y que los clientes de nóminas alcancen el punto de enlace de interfaz de Secrets Manager mediante TCP 443; limita las políticas IAM y del punto de enlace al secreto necesario."},"question":{"en":"After Direct Connect fails, VPN carries packets to the Secrets Manager endpoint, but payroll requests time out while resolving its hostname. What should the team investigate first?","es":"Tras fallar Direct Connect, la VPN lleva paquetes al punto de enlace de Secrets Manager, pero las peticiones de nóminas agotan el tiempo al resolver su nombre. ¿Qué debería investigar primero el equipo?"},"answer":{"en":"Investigate the DNS path before changing the API endpoint. Reaching the service IP proves neither that corporate DNS can reach Resolver nor that its reply returns over VPN. Check conditional forwarding, VPN routes to both Resolver inbound addresses, return routes and TCP/UDP port 53 permissions. Then repeat an uncached lookup and the HTTPS API call over the backup. Hard-coding an endpoint IP would hide the DNS fault and create maintenance risk. Also measure recovery time and confirm the backup can carry payroll demand.","es":"Investiga primero el camino DNS, antes de cambiar el punto de enlace de la API. Alcanzar la IP del servicio no prueba que el DNS corporativo llegue a Resolver ni que la respuesta vuelva por VPN. Revisa el reenvío condicional, las rutas VPN a ambas direcciones de Resolver entrante, las rutas de retorno y los permisos TCP/UDP 53. Repite después una consulta sin caché y la llamada HTTPS por el respaldo. Fijar una IP ocultaría el fallo DNS y complicaría el mantenimiento. Mide también la recuperación y la capacidad para nóminas."},"related":["vpc","dns","architecture"],"sources":[{"label":"AWS Direct Connect","url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html"},{"label":"AWS Site-to-Site VPN","url":"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}],"level":"applied","learning":{"definition":{"en":"A hybrid network lets software in a company site communicate with AWS resources across an explicitly chosen connection. Successful private access to an AWS API also depends on resolving its private endpoint address and carrying both the request and reply securely.","es":"Una red híbrida permite que las aplicaciones de una sede se comuniquen con recursos de AWS mediante una conexión elegida expresamente. Acceder a una API de AWS de forma privada también exige resolver la dirección de su punto de enlace privado y transportar con seguridad la petición y la respuesta."},"simple":{"en":"The on-premises application asks corporate DNS for the API hostname. Conditional forwarding sends that query to a Route 53 Resolver inbound endpoint, which returns private addresses from the VPC's DNS configuration. The site router needs a route to those addresses, and AWS needs a return route to the site. The application then establishes TLS with the service through its interface endpoint. Network permissions admit the connection; IAM permissions separately decide whether the API operation is authorized.","es":"La aplicación local consulta al DNS corporativo el nombre de la API. El reenvío condicional lleva esa consulta a un punto de enlace entrante de Route 53 Resolver, que devuelve direcciones privadas según el DNS de la VPC. El router local necesita una ruta hacia ellas y AWS necesita la ruta de vuelta. La aplicación establece TLS con el servicio mediante su punto de enlace de interfaz. Los permisos de red admiten la conexión; los permisos IAM autorizan por separado la operación solicitada."},"walkthrough":{"en":["Connect payroll site 10.60.0.0/16 to VPC 10.80.0.0/16 using a Direct Connect private virtual interface and virtual private gateway. Configure BGP route exchange and VPC return routes; provision both Site-to-Site VPN tunnels as backup to that gateway.","A payroll server calls GetSecretValue to retrieve its database password. Corporate DNS forwards the Secrets Manager regional name to two Resolver inbound IPs across zones; with private DNS enabled, the Secrets Manager interface endpoint resolves to private addresses in 10.80.0.0/16.","The server sends HTTPS over Direct Connect; TLS encrypts the API exchange. Disconnect that circuit: BGP must select the IPsec VPN backup in both directions, with private DNS still reachable and retries completing GetSecretValue."],"es":["Conecta la sede de nóminas 10.60.0.0/16 con la VPC 10.80.0.0/16 mediante una interfaz virtual privada de Direct Connect y una pasarela privada virtual. Configura el intercambio de rutas BGP y las rutas de retorno de la VPC; prepara ambos túneles Site-to-Site VPN como respaldo hacia esa pasarela.","Un servidor de nóminas llama a GetSecretValue para recuperar su contraseña de base de datos. El DNS corporativo reenvía el nombre regional de Secrets Manager a dos IP de Resolver entrante en zonas distintas; con DNS privado activado, el punto de enlace de interfaz de Secrets Manager resuelve a direcciones privadas en 10.80.0.0/16.","El servidor envía HTTPS por Direct Connect; TLS cifra el intercambio con la API. Desconecta ese circuito: BGP debe seleccionar el respaldo VPN IPsec en ambos sentidos, mantener accesible el DNS privado y permitir que los reintentos completen GetSecretValue."]},"analogy":{"en":"A branch library requests a book using a shared catalog and a delivery route, with sealed packaging protecting its contents. The limit: a network also needs functioning return paths and recovery after interruptions.","es":"Una biblioteca solicita un libro mediante un catálogo compartido y una ruta de reparto, con un embalaje sellado que protege su contenido. El límite: la red también necesita caminos de vuelta y recuperación tras interrupciones."},"pitfalls":{"en":["\"The VPN backup also encrypts the Direct Connect path\": VPN encryption covers packets using its tunnels, not a separate circuit. The payroll HTTPS session supplies TLS protection on either path.","\"Two VPN tunnels eliminate every failure point\": both can still depend on one site router or ISP, so those shared dependencies need separate protection."],"es":["«El respaldo VPN también cifra el camino de Direct Connect»: la VPN cifra los paquetes que utilizan sus túneles, no un circuito separado. La sesión HTTPS de nóminas aporta protección TLS en ambos caminos.","«Dos túneles VPN eliminan cualquier punto de fallo»: ambos pueden depender del mismo router local o proveedor de internet; esas dependencias comunes necesitan protección adicional."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html","label":"docs.aws.amazon.com: VPC VPN"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}]}},{"id":"direct-connect","parent":"hybrid","title":{"en":"Direct Connect","es":"Direct Connect"},"summary":{"en":"Plan the complete path to AWS: the physical handoff, usable routes and encryption have separate jobs.","es":"Diseña el recorrido completo hasta AWS: la interconexión física, las rutas y el cifrado cumplen funciones distintas."},"details":{"en":["Physical diversity must extend beyond AWS ports. Two connections can share a customer router, a carrier duct or the same facility, so one incident may remove both. Ask the carrier to identify shared segments and test failure with real inventory transfers. The surviving path needs enough capacity to meet the transfer deadline; merely keeping a route available does not meet that requirement."],"es":["La independencia física debe ir más allá de los puertos de AWS. Dos conexiones pueden compartir un router local, una canalización del operador o un edificio, de modo que una sola incidencia interrumpa ambas. Pide al operador que identifique los tramos compartidos y prueba el fallo con transferencias reales de inventario. El camino restante necesita capacidad para cumplir el plazo; conservar una ruta disponible no basta."]},"aws":{"en":"For the Madrid inventory system, configure the VPC subnet's return route to the data centre through its virtual private gateway, and allow the application's port in the server's security group. Direct Connect supplies the path, while these VPC controls make the intended exchange possible.","es":"Para el inventario de Madrid, configura en la subred de la VPC la ruta de retorno al centro de datos mediante su virtual private gateway y permite el puerto de la aplicación en el grupo de seguridad del servidor. Direct Connect aporta el camino; estos controles de la VPC hacen posible el intercambio previsto."},"question":{"en":"A retailer orders two Direct Connect connections through one carrier and calls its inventory transfer encrypted and resilient. What would you verify before accepting that design?","es":"Una empresa contrata dos conexiones de Direct Connect con el mismo operador y considera que su transferencia de inventario ya está cifrada y tolera fallos. ¿Qué comprobarías antes de aceptar el diseño?"},"answer":{"en":"I would trace both connections from the data centre to their AWS handoffs, because separate orders can still share a carrier duct, router or facility. I would require a failure test that demonstrates route switching and completes the inventory transfer within its deadline. I would also identify the encryption endpoints: Direct Connect alone does not encrypt the transfer. Application TLS can protect client-to-server data; supported MACsec protects its Ethernet link, not every segment before and after it.","es":"Seguiría ambas conexiones desde el centro de datos hasta AWS: dos contratos pueden compartir una canalización, un router o un edificio. Exigiría una prueba de fallo que demostrase el cambio de ruta y completase la transferencia de inventario dentro del plazo. También identificaría los extremos del cifrado, porque Direct Connect por sí solo no cifra la transferencia. TLS en la aplicación puede proteger los datos entre cliente y servidor; MACsec, cuando es compatible, protege su enlace Ethernet, pero no todos los tramos anteriores y posteriores."},"related":["physical-links","vpn","bgp","encryption"],"sources":[{"label":"AWS Direct Connect","url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html","label":"docs.aws.amazon.com: MACsec"}],"level":"applied","learning":{"definition":{"en":"AWS Direct Connect connects your organisation's network to AWS through an agreed physical handoff at a Direct Connect location. It carries traffic outside the public internet, giving you a separately provisioned path for workloads such as sustained transfers between a data centre and AWS.","es":"AWS Direct Connect conecta la red de tu organización con AWS mediante una interconexión física en una ubicación de Direct Connect. El tráfico circula fuera de internet público, por una conexión que contratas para cargas como las transferencias continuas entre tu centro de datos y AWS."},"simple":{"en":"Your network must first reach that location, through your own equipment or a carrier. A cross-connect, the physical link inside the facility, joins your equipment or the carrier's equipment to an AWS port; AWS's network then carries traffic towards the destination. A virtual interface (VIF) creates a logical channel on the connection. BGP, the protocol that exchanges reachable address ranges, supplies routes over that channel. Without compatible routes and network configuration at both ends, packets cannot reach their destination.","es":"Tu red debe llegar a esa ubicación, con medios propios o mediante un operador. Allí, una interconexión física une tu equipo o el del operador con un puerto de AWS; desde ese punto, la red de AWS lleva el tráfico al destino. Una interfaz virtual (VIF) crea un canal lógico sobre la conexión. BGP, el protocolo que intercambia los rangos de direcciones alcanzables, aporta las rutas de ese canal. Sin rutas y configuración de red compatibles en ambos extremos, los paquetes no llegan."},"analogy":{"en":"A reserved rail connection has a defined interchange, but the cargo still needs a complete route to its destination. The comparison stops at physical transport: reserving the connection says nothing about how network data is encrypted.","es":"Una conexión ferroviaria reservada tiene un punto de enlace concreto, pero la mercancía sigue necesitando un recorrido completo hasta su destino. La comparación se limita al transporte: reservar la conexión no explica cómo se cifran los datos."},"walkthrough":{"en":["A Madrid retailer must copy inventory data from 10.20.0.0/16 to servers in its VPC, an isolated AWS network using 10.60.0.0/16. Its carrier connects the data centre to a Direct Connect location and completes the physical handoff.","The team creates a private VIF to a virtual private gateway, AWS's routing entry point for this VPC. The routers exchange the two address ranges through BGP, and the VPC subnet route table sends replies for 10.20.0.0/16 through that gateway.","The inventory client opens a TLS connection, which encrypts data between the applications. During a test, the team cuts the carrier path; an independently connected VPN restores transfers only after backup routes take effect and sufficient capacity is available."],"es":["Una empresa de distribución de Madrid necesita copiar datos de inventario desde 10.20.0.0/16 a servidores de su VPC, una red aislada de AWS con el rango 10.60.0.0/16. Su operador conecta el centro de datos con una ubicación de Direct Connect y completa la interconexión física.","El equipo crea una VIF privada hacia una virtual private gateway, la pasarela de entrada a esta VPC. Los routers intercambian ambos rangos mediante BGP, y la tabla de rutas de la subred envía las respuestas destinadas a 10.20.0.0/16 por esa pasarela.","El cliente de inventario abre una conexión TLS, que cifra los datos entre las aplicaciones. En una prueba, el equipo corta el enlace del operador; una VPN con conectividad independiente permite reanudar las transferencias cuando entran en vigor las rutas alternativas, siempre que tenga capacidad suficiente."]},"pitfalls":{"en":["Assuming traffic is encrypted because its path is private leaves a security gap. Choose encryption with endpoints that actually cover the data's required protection scope.","Treating a VIF as a BGP session confuses the logical channel with its routing protocol. A configured interface still needs working BGP peering and usable routes."],"es":["Dar por cifrado el tráfico porque sigue una ruta privada deja un hueco de seguridad. Elige un mecanismo cuyos extremos cubran realmente el tramo que debes proteger.","Equiparar una VIF con una sesión BGP confunde el canal lógico con su protocolo de enrutamiento. Tener la interfaz configurada no demuestra que BGP funcione ni que existan rutas utilizables."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html","label":"docs.aws.amazon.com: MACsec"}]}},{"id":"vpn","parent":"hybrid","title":{"en":"Site-to-Site VPN","es":"VPN Site-to-Site"},"summary":{"en":"IPsec protects the inner packet; the outer packet still needs a working transport path between gateways.","es":"IPsec protege el paquete interior; el exterior sigue necesitando un camino operativo entre las pasarelas."},"details":{"en":["Encapsulation adds headers and integrity data, leaving less room for the original packet within the path's maximum transmission unit (MTU), its largest supported packet size. This can explain why small inventory requests succeed while large uploads stall. Check the tunnel's supported MTU and, for TCP, the maximum segment size that controls data per segment. Validate changes with representative transfers rather than treating every stall as an encryption failure."],"es":["La encapsulación añade cabeceras y datos de integridad, dejando menos espacio para el paquete original dentro de la unidad máxima de transmisión (MTU), el mayor tamaño de paquete que admite el camino. Eso puede explicar que funcionen peticiones pequeñas de inventario mientras se bloquean cargas grandes. Revisa la MTU admitida por el túnel y, para TCP, el tamaño máximo de segmento, que limita los datos de cada segmento. Valida los ajustes con transferencias representativas, sin atribuir cualquier bloqueo al cifrado."]},"aws":{"en":"For the retailer's temporary connection, attach a virtual private gateway to the inventory VPC and apply both AWS tunnel configurations to the on-premises VPN router. Configure the remote-network routes on each side before testing an inventory request and its response.","es":"Para la conexión provisional de la empresa, asocia una virtual private gateway a la VPC de inventario y aplica las configuraciones de ambos túneles de AWS al router VPN local. Configura las rutas hacia la red remota en cada extremo antes de probar una petición de inventario y su respuesta."},"question":{"en":"The inventory VPN passes small API requests, but large uploads stall. A colleague proposes replacing the IPsec keys. What would you investigate first?","es":"La VPN de inventario permite peticiones pequeñas a la API, pero las cargas grandes se bloquean. Un compañero propone cambiar las claves IPsec. ¿Qué investigarías primero?"},"answer":{"en":"Successful small requests show that a protected path works for at least that traffic, so I would investigate packet size before replacing keys. IPsec encapsulation increases packet size, and an oversized packet can be dropped or require fragmentation along the path. I would compare successful and failed transfers, inspect packet captures and tunnel counters, and check the configured MTU and TCP segment size. After a targeted adjustment, I would repeat a full inventory upload through each tunnel to confirm the cause.","es":"Las peticiones pequeñas demuestran que el camino protegido funciona para ese tráfico, así que investigaría el tamaño de los paquetes antes de cambiar claves. La encapsulación IPsec aumenta su tamaño y un paquete demasiado grande puede descartarse o necesitar fragmentación. Compararía transferencias correctas y fallidas, revisaría capturas y contadores del túnel y comprobaría la MTU y el tamaño de segmento TCP configurados. Tras un ajuste basado en esas pruebas, repetiría una carga completa de inventario por cada túnel para confirmar la causa."},"related":["direct-connect","bgp","mtu"],"sources":[{"label":"AWS Site-to-Site VPN","url":"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}],"level":"applied","learning":{"definition":{"en":"A site-to-site VPN lets devices in separate networks communicate through an encrypted tunnel between network gateways. AWS Site-to-Site VPN uses IPsec, a set of mechanisms that authenticates the gateways and protects packets, so applications can use private addresses across an underlying transport network.","es":"Una VPN entre sedes permite que equipos de redes distintas se comuniquen mediante un túnel cifrado entre sus pasarelas de red. AWS Site-to-Site VPN utiliza IPsec, un conjunto de mecanismos que autentica las pasarelas y protege los paquetes, para que las aplicaciones usen direcciones privadas sobre una red de transporte."},"simple":{"en":"The sending gateway takes the application's original IP packet, including its private source and destination addresses, and encrypts it inside a new packet. The outer IP header addresses the tunnel endpoints, so intermediate routers can deliver it without reading the inner packet. The receiving gateway checks integrity, decrypts the payload and routes the recovered packet to the server. Routes on both sides decide which traffic enters the tunnel; encryption alone neither creates those routes nor permits access to the application.","es":"La pasarela de origen cifra el paquete IP original de la aplicación, incluidas sus direcciones privadas, y lo introduce en un paquete nuevo. La cabecera IP exterior indica los extremos del túnel: los routers intermedios la leen para transportarlo sin acceder al paquete interior. La pasarela receptora comprueba su integridad, lo descifra y encamina el paquete recuperado al servidor. Las rutas de ambos lados deciden qué tráfico entra en el túnel; el cifrado no crea esas rutas ni concede acceso a la aplicación."},"analogy":{"en":"A sealed envelope can carry an internally addressed letter under a second delivery address. The outer address gets it to the right gateway; unlike an ordinary envelope, IPsec provides cryptographic confidentiality and integrity.","es":"Un sobre cerrado puede llevar una carta con una dirección interna y mostrar otra dirección para su transporte. La dirección exterior permite llegar a la pasarela; a diferencia de un sobre corriente, IPsec aporta confidencialidad e integridad criptográficas."},"walkthrough":{"en":["The Madrid retailer connects its inventory client, 10.20.1.10, to an AWS server, 10.60.2.20, before Direct Connect is ready. It configures its VPN router and both AWS tunnels with matching authentication and encryption settings, allowing the gateways to establish protected channels.","The data-centre route for 10.60.0.0/16 sends the request into a tunnel. Internet routers in this deployment forward it using the outer addresses; AWS decrypts it and delivers the original packet to 10.60.2.20, whose security group allows the application's port.","The VPC return route covers 10.20.0.0/16, so the response can reach the client. The team disables one tunnel in a test. BGP exchanges routing information; after detecting the lost path, the routers select the surviving tunnel and inventory requests resume."],"es":["La empresa de distribución de Madrid conecta su cliente de inventario, 10.20.1.10, con un servidor de AWS, 10.60.2.20, mientras espera Direct Connect. Configura su router VPN y los dos túneles de AWS con parámetros de autenticación y cifrado compatibles, de modo que las pasarelas puedan establecer canales protegidos.","La ruta del centro de datos para 10.60.0.0/16 envía la petición al túnel. En este despliegue, los routers de internet la transportan leyendo las direcciones exteriores; AWS la descifra y entrega el paquete original a 10.60.2.20, cuyo grupo de seguridad permite el puerto de la aplicación.","La ruta de retorno de la VPC incluye 10.20.0.0/16, por lo que la respuesta puede llegar al cliente. El equipo desactiva un túnel durante una prueba. BGP intercambia información de rutas; tras detectar el fallo, los routers seleccionan el túnel restante y se reanudan las peticiones de inventario."]},"pitfalls":{"en":["Calling every VPN an internet connection hides the transport choice: this example uses the internet, but AWS also supports private IP VPN over Direct Connect.","Configuring both AWS tunnels does not protect a shared customer router. Its failure removes both paths unless the wider design has independent equipment."],"es":["Identificar cualquier VPN con una conexión por internet oculta la elección del transporte: este ejemplo usa internet, pero AWS también admite VPN con IP privadas sobre Direct Connect.","Configurar los dos túneles de AWS no protege un router local compartido. Si ese router falla, se pierden ambos caminos, salvo que el diseño incluya equipos independientes."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html","label":"docs.aws.amazon.com: VPC VPN"},{"url":"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html","label":"docs.aws.amazon.com: what is transit gateway"}]}},{"id":"bgp","parent":"hybrid","title":{"en":"BGP and route preference","es":"BGP y preferencia de rutas"},"summary":{"en":"An advertised prefix offers a possible path; each receiving network decides whether to accept and use it.","es":"Un prefijo anunciado ofrece un camino posible; cada red receptora decide si lo acepta y lo utiliza."},"details":{"en":["BGP preference compares alternatives for the same prefix. Packet forwarding then uses the most specific matching prefix among installed routes. If 10.60.0.0/16 uses Direct Connect but 10.60.2.0/24 uses the VPN, packets for 10.60.2.20 take the VPN: /24 describes a narrower range and wins the forwarding lookup. Raising local preference on the /16 does not change that lookup. Inspect the actual destination's matching routes before adjusting BGP attributes."],"es":["La preferencia de BGP compara alternativas para un mismo prefijo. Después, al reenviar un paquete, el router usa el prefijo más específico que coincida entre las rutas instaladas. Si 10.60.0.0/16 usa Direct Connect, pero 10.60.2.0/24 usa la VPN, los paquetes para 10.60.2.20 van por la VPN: /24 describe un rango más pequeño y gana esa búsqueda. Subir la preferencia local del /16 no cambia el resultado. Revisa las rutas que coinciden con el destino concreto antes de ajustar atributos BGP."]},"aws":{"en":"On the retailer's customer router, accept only expected VPC prefixes from Direct Connect and the VPN, and set a higher local preference for Direct Connect. On AWS, verify that the attached gateway and VPC routes can return traffic to the advertised data-centre prefix.","es":"En el router de la empresa, acepta únicamente los prefijos previstos de la VPC desde Direct Connect y la VPN, y asigna mayor preferencia local a Direct Connect. En AWS, comprueba que la pasarela conectada y las rutas de la VPC permiten devolver el tráfico al prefijo anunciado del centro de datos."},"question":{"en":"Some inventory servers still receive traffic through the VPN even though Direct Connect has higher local preference. How could the customer's route table explain this?","es":"Algunos servidores de inventario siguen recibiendo tráfico por la VPN, aunque Direct Connect tiene mayor preferencia local. ¿Cómo podría explicar esto la tabla de rutas del cliente?"},"answer":{"en":"I would look up an affected server's destination address in the forwarding table rather than compare preference values alone. A VPN route for 10.60.2.0/24 beats a Direct Connect route for 10.60.0.0/16 when forwarding to 10.60.2.20, because the /24 is more specific. Local preference chooses between eligible BGP paths for the same prefix; it does not make a broader prefix override a narrower one. I would correct unintended advertisements or filtering, then verify the selected path and AWS's return route.","es":"Buscaría la dirección de un servidor afectado en la tabla de reenvío, en vez de comparar solo las preferencias. Una ruta VPN para 10.60.2.0/24 prevalece sobre otra de Direct Connect para 10.60.0.0/16 al enviar paquetes a 10.60.2.20, porque /24 es más específico. La preferencia local elige entre caminos BGP válidos para el mismo prefijo; no hace que un rango amplio sustituya a otro más concreto. Corregiría los anuncios o filtros no deseados y comprobaría tanto la salida seleccionada como el retorno desde AWS."},"related":["routing","direct-connect","vpn"],"sources":[{"label":"BGP: RFC 4271","url":"https://www.rfc-editor.org/rfc/rfc4271"},{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/routing-and-bgp.html","label":"docs.aws.amazon.com: routing and bgp"}],"level":"deep","learning":{"definition":{"en":"BGP is a routing protocol that lets routers advertise which IP address ranges they can reach and learn alternatives from other routers. Each network applies its own policy to those advertisements, allowing administrators to control where traffic leaves while the other network independently chooses its return path.","es":"BGP es un protocolo de enrutamiento con el que los routers anuncian los rangos de direcciones IP que pueden alcanzar y aprenden rutas alternativas de otros routers. Cada red aplica sus propias reglas a esos anuncios para decidir por dónde sale su tráfico; la otra red decide el camino de vuelta de forma independiente."},"simple":{"en":"A router advertises a prefix, an address range such as 10.60.0.0/16, together with route attributes. These describe the next router to use and the AS path, the sequence of independently administered networks the advertisement has crossed. A receiving router filters unwanted routes, then ranks accepted alternatives for the same prefix using its own policy. A selected, reachable route can enter the forwarding table that directs packets. When a route is withdrawn or its session fails, the router recalculates its choice.","es":"Un router anuncia un prefijo, un rango como 10.60.0.0/16, junto con atributos de la ruta. Estos indican el siguiente router que se debe usar y el AS path: la secuencia de redes administradas independientemente que ha recorrido el anuncio. El receptor descarta rutas según sus filtros y ordena las alternativas aceptadas para ese prefijo conforme a su política local. La ruta elegida, si es utilizable, puede incorporarse a la tabla que dirige los paquetes. Si se retira el anuncio o falla la sesión, recalcula la elección."},"analogy":{"en":"Choosing between delivery contracts can favour an approved supplier rather than the shortest itinerary. BGP similarly follows policy, but it compares advertised network routes, not live measurements of a delivery service's speed or reliability.","es":"Al elegir un contrato de reparto, puedes dar prioridad a un proveedor homologado frente al itinerario más corto. BGP también aplica reglas de selección, pero compara rutas anunciadas, no mediciones en tiempo real de velocidad o fiabilidad."},"walkthrough":{"en":["The Madrid retailer's router learns the AWS inventory prefix, 10.60.0.0/16, through both Direct Connect and a VPN. It advertises its own 10.20.0.0/16 prefix on both connections, giving AWS possible return paths to the data centre.","The retailer assigns local preference 200 to the Direct Connect route and 100 to the VPN route. Higher values win this comparison, so with both routes eligible, inventory traffic leaves through Direct Connect. These values do not dictate AWS's return choice.","The team disconnects Direct Connect during a test. After the router detects the failed BGP session, it removes that path and selects the remaining VPN route. Inventory requests resume once routing settles, provided AWS also has a working return route."],"es":["El router de la empresa de distribución de Madrid aprende el prefijo de inventario de AWS, 10.60.0.0/16, tanto por Direct Connect como por una VPN. Anuncia su propio prefijo 10.20.0.0/16 por ambas conexiones, de modo que AWS dispone de posibles caminos de retorno al centro de datos.","La empresa asigna una preferencia local de 200 a la ruta de Direct Connect y de 100 a la de VPN. En esta comparación gana el valor mayor: si ambas rutas son válidas, el tráfico de inventario sale por Direct Connect. Estos valores no imponen el retorno elegido por AWS.","El equipo desconecta Direct Connect durante una prueba. Cuando el router detecta que la sesión BGP ha fallado, elimina ese camino y selecciona la ruta VPN restante. Las peticiones de inventario se reanudan cuando se estabilizan las rutas, siempre que AWS también tenga un camino de retorno válido."]},"pitfalls":{"en":["Using session status as proof of application connectivity overlooks route acceptance. The routers can exchange BGP messages while an inventory prefix is filtered or its next hop is unreachable.","Raising local preference changes your own exit choice, not AWS's return path. AS-path prepending, repeating your network number in the advertised path, only influences the other network's selection policy."],"es":["Tomar el estado de la sesión como prueba de conectividad de la aplicación ignora la aceptación de rutas. Los routers pueden intercambiar mensajes BGP aunque un filtro descarte el prefijo de inventario o el siguiente salto sea inaccesible.","Subir la preferencia local cambia tu salida, no el retorno desde AWS. El AS-path prepending consiste en repetir el número de tu red en el camino anunciado; solo influye en la selección que hace la otra red."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/directconnect/latest/UserGuide/routing-and-bgp.html","label":"docs.aws.amazon.com: routing and bgp"},{"url":"https://www.rfc-editor.org/rfc/rfc4271","label":"rfc-editor.org: rfc4271"}]}},{"id":"private-connectivity","parent":"hybrid","title":{"en":"PrivateLink and VPC endpoints","es":"PrivateLink y endpoints VPC"},"summary":{"en":"An interface endpoint gives a service private entry addresses without granting permission to call its API.","es":"Un endpoint de interfaz da al servicio direcciones privadas de entrada, sin conceder permisos para llamar a su API."},"details":{"en":["For S3 or DynamoDB access from a VPC, a gateway endpoint routes traffic using a service prefix list, AWS's maintained set of destination ranges. It does not create interface-endpoint private addresses and does not use PrivateLink. That distinction matters for hybrid access: an on-premises client cannot use the VPC's gateway endpoint through a VPN or Direct Connect as if it were an interface endpoint."],"es":["Para acceder a S3 o DynamoDB desde una VPC, un endpoint de tipo gateway dirige el tráfico mediante una lista de prefijos del servicio, el conjunto de rangos de destino que mantiene AWS. No crea las direcciones privadas de un endpoint de interfaz ni utiliza PrivateLink. La diferencia importa en una red híbrida: un cliente del centro de datos no puede usar ese endpoint gateway a través de una VPN o Direct Connect como si fuera uno de interfaz."]},"aws":{"en":"Give the inventory worker's IAM role sqs:SendMessage only on its queue, and use an SQS interface endpoint with an endpoint policy limited to the intended caller and queue. Allow HTTPS from the worker's security group so both the network path and the permission scope match the job.","es":"Concede al rol IAM del proceso de inventario sqs:SendMessage solo sobre su cola y usa un endpoint de interfaz de SQS cuya política limite el acceso a ese proceso y esa cola. Permite HTTPS desde el grupo de seguridad del proceso para ajustar tanto la conectividad como los permisos al trabajo previsto."},"question":{"en":"An inventory worker resolves SQS to private addresses and connects on port 443, but receives AccessDenied. The team proposes adding VPC peering. How would you respond?","es":"Un proceso de inventario resuelve SQS a direcciones privadas y se conecta al puerto 443, pero recibe AccessDenied. El equipo propone añadir VPC peering. ¿Qué responderías?"},"answer":{"en":"A successful connection followed by AccessDenied points me towards authorisation rather than a missing route. I would verify which IAM role the worker actually uses and whether it can send messages to that specific queue. I would then check whether endpoint, queue or applicable account policies restrict the request, because adding an allow cannot override an explicit deny. VPC peering would not supply those permissions, and an interface endpoint already provides the intended service path. I would retest using the worker's actual credentials.","es":"Una conexión correcta seguida de AccessDenied me orienta hacia la autorización, no hacia una ruta ausente. Comprobaría qué rol IAM usa realmente el proceso y si puede enviar mensajes a esa cola concreta. Después revisaría si las políticas del endpoint, de la cola o de la cuenta restringen la petición: añadir un permiso no anula una denegación explícita. VPC peering no aportaría esos permisos y el endpoint de interfaz ya proporciona el camino previsto al servicio. Repetiría la prueba con las credenciales reales del proceso."},"related":["iam","cidr-overlap","nat-egress","dns"],"sources":[{"label":"AWS PrivateLink concepts","url":"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html"},{"url":"https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html","label":"docs.aws.amazon.com: gateway endpoints"}],"level":"applied","learning":{"definition":{"en":"AWS PrivateLink lets an application reach a selected service through private entry points inside its VPC, an isolated AWS network. For this service-access model, an interface VPC endpoint provides the connection without establishing general routing between the consumer's network and the provider's network.","es":"AWS PrivateLink permite que una aplicación llegue a un servicio concreto mediante puntos de entrada privados dentro de su VPC, una red aislada de AWS. En este modelo de acceso a servicios, un endpoint de interfaz proporciona la conexión sin establecer un enrutamiento general entre las redes del consumidor y del proveedor."},"simple":{"en":"When you create an interface endpoint, AWS places network interfaces with private addresses in your chosen subnets. With private DNS configured, the service's usual hostname resolves to those addresses for your clients, so requests enter through the endpoint instead of its public address. PrivateLink carries them to that service within AWS's network. Security groups, the network filters attached to those interfaces, govern permitted connections. The service then checks the caller's permissions; reaching a private address does not authorise an API operation.","es":"Al crear un endpoint de interfaz, AWS coloca interfaces de red con direcciones privadas en las subredes elegidas. Con DNS privado configurado, el nombre habitual del servicio devuelve esas direcciones a tus aplicaciones; así, sus peticiones entran por el endpoint. PrivateLink las lleva al servicio por la red de AWS. Los grupos de seguridad filtran qué conexiones admite la interfaz. Después, el servicio comprueba los permisos de quien llama: tener una dirección accesible no autoriza a ejecutar operaciones."},"analogy":{"en":"A departmental phone extension connects you to a specific desk without opening every room in the building. The limit is that reaching the extension does not establish whether you are authorised to request a particular operation.","es":"Una extensión telefónica conecta con un departamento concreto sin abrir todas las habitaciones del edificio. El límite de la comparación es que llegar a esa extensión no demuestra que tengas autorización para solicitar una operación determinada."},"walkthrough":{"en":["The retailer's inventory worker runs on EC2 in a subnet with no internet route and must send updates to an Amazon SQS queue. The team creates an SQS interface endpoint in the VPC and enables private DNS.","The worker resolves the regional SQS hostname to the endpoint's private addresses and opens HTTPS on port 443. The endpoint security group permits that connection from the worker's security group, so the request reaches SQS without an internet gateway.","SQS returns AccessDenied: in AWS's permission system, IAM, the worker's role has no sqs:SendMessage grant for this queue. The team adds that permission and checks that the endpoint and queue policies allow it; the next request succeeds."],"es":["El proceso que actualiza el inventario de la empresa se ejecuta en EC2, en una subred sin ruta a internet, y necesita enviar mensajes a una cola de Amazon SQS. El equipo crea un endpoint de interfaz para SQS en la VPC y activa DNS privado.","El proceso resuelve el nombre regional de SQS y obtiene las direcciones privadas del endpoint, al que se conecta por HTTPS en el puerto 443. El grupo de seguridad del endpoint permite esa conexión desde el grupo del proceso, por lo que la petición llega a SQS sin una pasarela de internet.","SQS devuelve AccessDenied: en IAM, el sistema de permisos de AWS, el rol del proceso no tiene concedida la acción sqs:SendMessage sobre esta cola. El equipo añade ese permiso y comprueba que las políticas del endpoint y de la cola lo permiten; la siguiente petición funciona."]},"pitfalls":{"en":["Expecting an interface endpoint to connect arbitrary hosts fails because it targets its configured service. Use a routed network design when applications need broader address-to-address connectivity.","Setting an endpoint policy to allow all only removes that policy's restriction. It does not override IAM denials or replace the service's authorisation checks."],"es":["Esperar que un endpoint de interfaz conecte cualquier equipo falla porque está asociado a un servicio concreto. Si las aplicaciones necesitan comunicarse entre direcciones de ambas redes, diseña esa conectividad mediante rutas.","Configurar una política de endpoint que permita todo solo elimina la restricción de esa política. No anula las denegaciones de IAM ni sustituye las comprobaciones de autorización del servicio."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html","label":"docs.aws.amazon.com: concepts"},{"url":"https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html","label":"docs.aws.amazon.com: gateway endpoints"}]}},{"id":"troubleshooting","parent":"networking","title":{"en":"Troubleshooting a request","es":"Diagnosticar una solicitud"},"summary":{"en":"Use evidence from a specific request to locate the failure before changing settings.","es":"Usa pruebas de una petición concreta para localizar el fallo antes de cambiar ajustes."},"details":{"en":["Correlate timestamps and request identifiers across client, load balancer and application logs. Cached DNS, different credentials or a different destination can make an apparently comparable test misleading. Capture packet contents only with suitable authorisation because they may contain sensitive data."],"es":["Relaciona horas e identificadores de petición entre los registros del cliente, el balanceador y la aplicación. Una caché DNS, credenciales distintas u otro destino pueden invalidar una comparación aparentemente equivalente. Captura contenido de paquetes solo con la autorización adecuada, porque puede incluir datos sensibles."]},"aws":{"en":"Use VPC Flow Logs to inspect recorded accepted or rejected traffic and Reachability Analyzer to inspect supported route and filtering configuration. Then use actual service requests and application logs to verify that the intended operation succeeds.","es":"Usa VPC Flow Logs para revisar el tráfico aceptado o rechazado registrado y Reachability Analyzer para inspeccionar la configuración compatible de rutas y filtros. Después comprueba con peticiones reales y registros de aplicación que la operación prevista se completa."},"question":{"en":"A VPC Flow Log shows ACCEPT, but the client reports a timeout. What can you conclude and what would you test next?","es":"Un VPC Flow Log muestra ACCEPT, pero el cliente agota el tiempo de espera. ¿Qué puedes concluir y qué comprobarías después?"},"answer":{"en":"I can conclude that the recorded traffic was accepted at that observation point, not that the request succeeded end to end. I would match the client address, ports and time window, then check the return traffic and any other network boundaries. If the TCP connection completes, I would inspect TLS negotiation and application logs next. I would also compare a known-working request. The next test should separate two plausible causes, rather than opening more ports simply because the client saw a timeout.","es":"Puedo concluir que el tráfico registrado se aceptó en ese punto, no que la petición funcionara de extremo a extremo. Comprobaría dirección del cliente, puertos y ventana temporal; después revisaría el retorno y los demás límites de red. Si TCP se establece, investigaría la negociación TLS y los registros de aplicación. También compararía una petición equivalente que funcione. La siguiente prueba debe distinguir entre dos causas plausibles, no abrir más puertos simplemente porque el cliente agotó el tiempo de espera."},"related":["osi","icmp","dns","tls","observability"],"sources":[{"label":"VPC Flow Logs","url":"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"},{"label":"VPC Reachability Analyzer","url":"https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html"}],"level":"applied","learning":{"definition":{"en":"Network troubleshooting identifies which part of a request path prevents the expected result. The goal is to turn a symptom, such as a timeout, into a specific, testable cause before changing configuration. A successful network connection is only one part of a successful application request.","es":"El diagnóstico de red identifica qué parte del recorrido de una petición impide obtener el resultado esperado. Consiste en convertir un síntoma, como un tiempo de espera agotado, en una causa concreta y comprobable antes de cambiar la configuración. Establecer la conexión es solo una parte de completar correctamente una petición."},"simple":{"en":"Follow the dependencies of the failing request: name resolution finds an address; routing and filters provide a path; the transport establishes communication; TLS protects it; the application handles the operation. Evidence lets you skip steps: an HTTP response means this attempt got further than a failed TCP connection. Compare a failing attempt with a genuinely similar working one. A difference is a lead to investigate, not proof of the root cause, and one successful hop does not prove the whole path.","es":"Sigue las dependencias de la petición que falla: DNS obtiene una dirección; las rutas y los filtros dan un camino; el transporte establece comunicación; TLS la protege; la aplicación ejecuta la operación. Las pruebas permiten saltarse pasos: recibir una respuesta HTTP demuestra que ese intento llegó más lejos que una conexión TCP fallida. Compara un intento fallido con otro realmente equivalente que funcione. Una diferencia es una pista, no la causa demostrada, y superar un salto no prueba el recorrido completo."},"analogy":{"en":"Checking a delivery route at successive checkpoints helps locate a missing parcel. The limit is that network requests have a return path too: the request may arrive while its reply is blocked elsewhere.","es":"Revisar los puntos de control de una entrega ayuda a localizar dónde falta un paquete. La comparación tiene un límite: una petición de red necesita también camino de vuelta; puede llegar mientras su respuesta queda bloqueada en otro punto."},"walkthrough":{"en":["After a subnet rule change, a client cannot open an HTTPS service. DNS still returns the expected address, but the TCP connection times out. Compare the affected subnet with a working one before inspecting HTTP code.","For this connection, the client uses temporary port 53000 and the server listens on 443. Network evidence shows the request reaches the server but the subnet NACL rejects the outbound reply to destination port 53000.","Restore the intended outbound rule for the required client port range, not an unrestricted rule by default. Repeat the same connection and application request, then check that other required and forbidden flows still behave as intended."],"es":["Tras cambiar una regla de subred, un cliente no puede abrir un servicio HTTPS. DNS sigue devolviendo la dirección esperada, pero la conexión TCP agota el tiempo de espera. Compara la subred afectada con otra que funcione antes de investigar el código HTTP.","En esta conexión, el cliente usa el puerto temporal 53000 y el servidor escucha en 443. Las pruebas de red muestran que la petición llega al servidor, pero la NACL de la subred rechaza la respuesta de salida hacia el puerto de destino 53000.","Restaura la regla de salida prevista para el rango que necesitan los clientes, sin abrir todo por defecto. Repite la conexión y la petición de aplicación y comprueba que los demás flujos permitidos y prohibidos mantienen el comportamiento esperado."]},"pitfalls":{"en":["ACCEPT in a VPC Flow Log covers the recorded traffic at that observation point. Another hop, the return path or the application can still fail.","Reachability Analyzer models supported network configuration. It does not send a live request or prove that an application is listening and healthy."],"es":["ACCEPT en un VPC Flow Log corresponde al tráfico registrado en ese punto. Todavía pueden fallar otro salto, el retorno o la aplicación.","Reachability Analyzer modela la configuración de red compatible. No envía una petición real ni demuestra que una aplicación esté escuchando y funcione bien."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html","label":"docs.aws.amazon.com: flow logs"},{"url":"https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html","label":"docs.aws.amazon.com: what is reachability analyzer"}]}},{"id":"systems","parent":null,"title":{"en":"Systems Fundamentals","es":"Fundamentos de sistemas"},"summary":{"en":"Follow a request through CPU, memory and storage before deciding what to scale.","es":"Sigue una petición por CPU, memoria y almacenamiento antes de decidir qué recurso ampliar."},"details":{"en":["Utilisation measures how busy a resource is; saturation means work is queuing for it. They are related but not interchangeable. A benchmark can also change after its first run because the operating system retains file data in RAM, so compare equivalent cache conditions."],"es":["La utilización mide cuánto se ocupa un recurso; la saturación implica que hay trabajo esperando para utilizarlo. Son conceptos relacionados, pero distintos. Una prueba también puede cambiar tras la primera ejecución porque el sistema conserva datos de archivos en RAM; compara condiciones de caché equivalentes."]},"aws":{"en":"For the report generator on Amazon EC2, compare measured disk throughput with both the attached Amazon EBS volume's limit and the instance's storage bandwidth before resizing.","es":"Para el generador de informes en Amazon EC2, compara la tasa de lectura medida con el límite del volumen Amazon EBS conectado y el ancho de banda de almacenamiento de la instancia antes de ampliarla."},"question":{"en":"Your EC2 report job takes twice as long after the input doubles, but average CPU remains at 20%. Would you move to a compute-optimised instance first?","es":"Un informe en EC2 tarda el doble al duplicarse los datos de entrada, pero la CPU media sigue al 20%. ¿Cambiarías primero a una instancia optimizada para cómputo?"},"answer":{"en":"No. Twenty per cent average CPU does not identify what delays the job, and doubling input can increase reading or waiting as well as computation. Inspect per-thread CPU activity and storage latency during a representative run, then check whether the job is queued behind a volume or instance storage limit. If reads dominate, first reduce repeated reads or address the measured storage constraint. Test the same input again and compare elapsed time and cost before choosing a different instance family.","es":"No. Una CPU media del 20% no identifica la causa; duplicar datos puede aumentar tanto las lecturas y esperas como el cálculo. Revisa la CPU por hilo y la latencia de almacenamiento durante una ejecución representativa, y comprueba si el trabajo espera por un límite del volumen o la instancia. Si predominan las lecturas, elimina repeticiones o corrige la limitación de almacenamiento medida. Repite con los mismos datos y compara duración y coste antes de cambiar de familia de instancias."},"related":["cloud-ec2","systems-virtualization"],"sources":[{"label":"AWS EC2 Instance Types","url":"https://aws.amazon.com/ec2/instance-types/"},{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}],"level":"foundation","learning":{"definition":{"en":"Systems fundamentals explain how an operating system turns computing hardware into resources that applications can use. This knowledge helps you locate a performance constraint before choosing more capacity or changing software.","es":"Los fundamentos de sistemas explican cómo un sistema operativo convierte el hardware en recursos que pueden utilizar las aplicaciones. Este conocimiento permite localizar qué limita el rendimiento antes de ampliar la capacidad o modificar el software."},"simple":{"en":"An application runs as a process, a program with its own execution state. The kernel, the operating system's privileged core, manages access to processors, memory and devices. Its scheduler selects runnable threads, the execution paths inside processes, for CPU time. System calls are controlled requests through which applications ask the kernel to perform operations such as reading a file. If data is not ready, a thread may wait while another runs.","es":"La aplicación se ejecuta como un proceso, un programa con su propio estado de ejecución. El núcleo, o kernel, es la parte privilegiada del sistema operativo que gestiona procesadores, memoria y dispositivos. Su planificador selecciona hilos listos para ejecutarse, las secuencias de trabajo de los procesos, y les asigna tiempo de CPU. Las llamadas al sistema son peticiones controladas al núcleo, por ejemplo para leer un archivo. Si faltan datos, un hilo puede esperar mientras otro avanza."},"analogy":{"en":"Think of a restaurant: cooks need worktops, ingredients and oven time to complete orders. Adding cooks helps only when the scarce resource is labour; the analogy cannot describe actual kernel scheduling rules.","es":"Piensa en un restaurante: los cocineros necesitan encimeras, ingredientes y tiempo de horno. Contratar más ayuda si falta mano de obra; la comparación no representa las reglas concretas del planificador del núcleo."},"walkthrough":{"en":["A report generator reads a 500 MB sales file, calculates totals and saves a report. Record its elapsed time, CPU activity and storage-read latency during the same run to establish a baseline.","Suppose CPU activity stays low while file reads take most of the time. The program is waiting for data, so extra processor capacity alone may offer little improvement.","Repeat the identical job after reducing unnecessary file reads. Keep the input and worker count unchanged; a shorter runtime alongside less read waiting supports storage access as the original constraint."],"es":["Un generador de informes lee un archivo de ventas de 500 MB, calcula totales y guarda el resultado. Registra la duración, la actividad de CPU y la latencia de lectura durante esa ejecución como referencia.","Supón que la actividad de CPU es baja y las lecturas ocupan casi todo el tiempo. El programa espera datos, por lo que añadir capacidad de procesamiento podría aportar poco.","Repite el mismo trabajo tras eliminar lecturas innecesarias. Mantén los datos de entrada y el número de trabajadores; una ejecución más corta con menos espera de lectura respalda que el acceso al almacenamiento era la limitación."]},"pitfalls":{"en":["Treating low average CPU use as proof of spare capacity: one busy thread or brief bursts can be hidden by the instance-wide average.","Buying a larger server before identifying the queue: a delay in a remote database may persist even when local resources increase."],"es":["Interpretar una media baja de CPU como prueba de capacidad sobrante: la media de la instancia puede ocultar un hilo saturado o picos breves.","Ampliar el servidor sin localizar dónde se acumula el trabajo: la espera de una base de datos remota puede mantenerse aunque aumenten los recursos locales."]},"sourceUrls":[{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"},{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"}]}},{"id":"systems-linux","parent":"systems","title":{"en":"Linux Fundamentals","es":"Fundamentos de Linux"},"summary":{"en":"Separate the kernel, distribution and service identity when diagnosing a Linux failure.","es":"Distingue núcleo, distribución e identidad del servicio al diagnosticar un fallo en Linux."},"details":{"en":["A container image supplies application files and user-space tools, but a typical Linux container shares its host's kernel. Different distribution names inside and outside the container therefore do not imply different running kernels; system-call availability still depends on the host and runtime restrictions."],"es":["Una imagen de contenedor aporta archivos y herramientas que se ejecutan fuera del núcleo, pero un contenedor Linux habitual comparte el núcleo de su máquina anfitriona. Que dentro y fuera aparezcan distribuciones distintas no implica que se ejecuten núcleos diferentes; las llamadas al sistema disponibles dependen del anfitrión y de las restricciones del entorno."]},"aws":{"en":"On a Linux EC2 instance, inspect the reporting service's operating-system account and /etc/report.conf permissions before changing its AWS IAM role; IAM permissions do not grant local file access.","es":"En una instancia EC2 Linux, revisa la cuenta del sistema operativo usada por el servicio y los permisos de /etc/report.conf antes de cambiar su rol de AWS IAM; IAM no concede acceso a archivos locales."},"question":{"en":"A report starts from your administrator shell on EC2 but fails with a local file permission error as a service. Should you give the instance a broader IAM role?","es":"Un informe arranca desde tu consola de administrador en EC2, pero como servicio falla por permisos de un archivo local. ¿Conviene ampliar el rol de IAM de la instancia?"},"answer":{"en":"No. An IAM role authorises AWS API actions; it does not replace Linux file permissions. Your administrator shell and the service can run under different operating-system identities, explaining why only one can read the file. Check the service account, file ownership and access along the full directory path. Grant narrowly scoped access through the intended service group, then retest as that account. If basic permissions look correct, investigate additional security policies or service isolation rather than making the service an administrator.","es":"No. Un rol de IAM autoriza acciones de las API de AWS; no sustituye los permisos de archivos de Linux. Tu consola administrativa y el servicio pueden usar identidades distintas, lo que explica la diferencia. Comprueba la cuenta del servicio, la propiedad del archivo y el acceso en toda la ruta. Concede acceso limitado mediante el grupo previsto y repite con esa cuenta. Si los permisos básicos son correctos, investiga políticas de seguridad adicionales o el aislamiento del servicio, sin convertirlo en administrador."},"related":["systems-processes","systems-memory","systems-filesystems"],"sources":[{"label":"AWS Systems Manager Session Manager","url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html"},{"url":"https://man7.org/linux/man-pages/man5/proc_meminfo.5.html","label":"man7.org: proc meminfo.5"},{"url":"https://man7.org/linux/man-pages/man7/sched.7.html","label":"man7.org: sched.7"}],"level":"foundation","learning":{"definition":{"en":"Linux is the kernel that controls hardware access and provides core services to programs. A Linux distribution packages that kernel with libraries and administration tools so people can install and maintain a usable operating system.","es":"Linux es el núcleo que controla el acceso al hardware y ofrece servicios básicos a los programas. Una distribución Linux reúne ese núcleo con bibliotecas y herramientas de administración para poder instalar y mantener un sistema operativo utilizable."},"simple":{"en":"A shell is a command interpreter that launches programs; it is separate from the kernel. Programs usually use libraries, reusable software routines, to issue system calls requesting kernel services. When a program opens a file, the kernel checks its access rights and resolves the path before returning a result. A distribution supplies the shell, libraries and package manager, the tool that installs software, while choosing its own release and update policies.","es":"La shell es un intérprete de órdenes que inicia programas y está separado del núcleo. Los programas suelen usar bibliotecas, rutinas de software reutilizables, para realizar llamadas al sistema y solicitar servicios al núcleo. Al abrir un archivo, el núcleo comprueba los permisos y resuelve la ruta antes de devolver un resultado. La distribución proporciona el intérprete, las bibliotecas y el gestor de paquetes, la herramienta que instala software, y establece sus políticas de versiones y actualizaciones."},"analogy":{"en":"The kernel resembles a building's access and facilities control, while a distribution is the complete fitted building with its maintenance plan. The comparison does not capture how software libraries or updates interact.","es":"El núcleo se parece al control de accesos e instalaciones de un edificio; la distribución es el edificio equipado con su plan de mantenimiento. La comparación no explica las dependencias entre bibliotecas y actualizaciones."},"walkthrough":{"en":["A reporting service cannot read /etc/report.conf after a deployment. Its log says 'Permission denied'; confirm which account runs the service rather than assuming it uses your interactive login.","Inspect the file and parent-directory permissions. Here, the service runs as report, but root owns the file with mode 0600: basic permissions allow only its owner to read or write.","Use a dedicated service group to grant read access while preserving restricted write access. Retry the same file read as the service account and verify that the report starts without broader privileges."],"es":["Tras un despliegue, un servicio de informes no puede leer /etc/report.conf. El registro indica 'Permiso denegado'; confirma con qué cuenta se ejecuta el servicio, sin suponer que utiliza la de tu sesión interactiva.","Inspecciona los permisos del archivo y de sus directorios superiores. En este caso, el servicio usa la cuenta report, pero root posee el archivo con modo 0600: los permisos básicos solo permiten leer y escribir al propietario.","Concede lectura mediante un grupo dedicado al servicio y mantén restringida la escritura. Repite la lectura con la cuenta del servicio y comprueba que el informe se inicia sin necesitar privilegios más amplios."]},"pitfalls":{"en":["Assuming every Linux distribution has the same commands and defaults: check the installed release before applying package-management or service instructions.","Using administrator privileges to bypass every failure: it ca
