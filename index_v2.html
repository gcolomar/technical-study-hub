 memory, while processor use stays modest.","The engineer reruns the same input on a memory-focused instance with 16 GiB and the same processor architecture. Swap activity falls and the report finishes sooner, evidence that additional memory helps this particular job.","The report initially uses On-Demand capacity while usage is measured. Because it checkpoints completed partitions to durable storage, the team can also test Spot, interruptible capacity, by resuming from saved progress after the instance disappears."],"es":["Un informe nocturno de ventas se ejecuta en una instancia con 8 GiB de RAM. El sistema operativo mueve repetidamente datos de trabajo al espacio de intercambio configurado, una zona de disco que amplía la memoria, mientras el procesador tiene poca actividad.","El ingeniero repite la misma entrada en una instancia orientada a memoria, con 16 GiB y la misma arquitectura de procesador. Disminuye el intercambio y el informe termina antes, evidencia de que la memoria adicional ayuda a este trabajo concreto.","El informe utiliza inicialmente capacidad On-Demand mientras se mide el uso. Como guarda las particiones completadas en almacenamiento duradero, el equipo también puede probar Spot, capacidad interrumpible, retomando el progreso guardado cuando desaparece la instancia."]},"pitfalls":{"en":["Do not treat a lower hourly price as a lower job cost: slower execution can erase the saving. Savings Plans and Reserved Instances involve commitments, not free flexibility.","Spot capacity can disappear; a two-minute warning is not assured. Persist progress outside the instance, and remember that local instance-store data does not survive instance termination."],"es":["Un precio por hora inferior no implica un trabajo más barato: una ejecución más lenta puede anular el ahorro. Savings Plans y Reserved Instances conllevan compromisos, no flexibilidad gratuita.","La capacidad Spot puede retirarse sin asegurar dos minutos de preaviso. Guarda el progreso fuera de la instancia y recuerda que los datos de su almacenamiento local efímero se pierden al terminarla."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html","label":"docs.aws.amazon.com: instance types"},{"url":"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html","label":"docs.aws.amazon.com: ec2 nitro instances"}]}},{"id":"cloud-lambda","parent":"cloud-compute","title":{"en":"Lambda and Serverless Compute","es":"Lambda y cómputo serverless"},"summary":{"en":"Lambda runs event-driven functions on managed capacity; your design still owns durable results and workload limits.","es":"Lambda ejecuta funciones activadas por eventos en recursos gestionados; tu diseño sigue siendo responsable de conservar los resultados y limitar la carga."},"details":{"en":["Delivery behavior depends on the trigger. A synchronous caller receives failures directly; a queue holds work and retries according to its configuration. Include a job identifier in logs and output metadata so a timeout can be traced to its possible result, rather than treated as proof that nothing happened."],"es":["El comportamiento de entrega depende del origen de la invocación. Un cliente síncrono recibe directamente los fallos; una cola conserva el trabajo y reintenta según su configuración. Incluye un identificador de tarea en los registros y metadatos de salida para relacionar un tiempo de espera agotado con su posible resultado, en vez de interpretarlo como prueba de que no ocurrió nada."]},"aws":{"en":"S3 upload notifications from a source bucket can send object keys to SQS. A consuming Lambda function stores thumbnails in a separate output bucket and uses reserved concurrency to cap simultaneous invocations. Keeping output outside the notification source prevents a thumbnail from recursively triggering another run.","es":"Las notificaciones de subida de un bucket de origen S3 pueden enviar claves a SQS. Una función Lambda consumidora guarda las miniaturas en otro bucket y usa concurrencia reservada para limitar invocaciones simultáneas. Separar la salida del origen de notificaciones evita que una miniatura vuelva a activar el proceso."},"question":{"en":"A thumbnail API is slow after quiet periods, and a function moved into a VPC cannot reach an external image service. Would adding memory solve both?","es":"Una API de miniaturas tarda más tras periodos sin tráfico, y una función trasladada a una VPC no llega a un servicio externo de imágenes. ¿Añadir memoria resolvería ambos problemas?"},"answer":{"en":"Not necessarily. Separate environment preparation time from image processing time; extra memory helps only if the measured bottleneck responds to it. For startup delay, test Provisioned Concurrency or a compatible SnapStart configuration and compare latency and cost. The VPC failure needs a networking check: an outbound route, such as a NAT gateway for IPv4 internet access from private subnets, plus suitable security rules. Increasing memory does not create that network path.","es":"No necesariamente. Separa el tiempo de preparación del entorno del procesamiento de imágenes; añadir memoria solo ayuda si el cuello de botella medido responde a ella. Para reducir el arranque, prueba Provisioned Concurrency o una configuración compatible con SnapStart y compara latencia y coste. El fallo en la VPC exige revisar la red: una ruta de salida, como un NAT Gateway para acceder a Internet por IPv4 desde subredes privadas, y reglas de seguridad adecuadas. Más memoria no crea esa ruta."},"related":["cloud-compute","systems-memory","cloud-scaling"],"sources":[{"label":"AWS Lambda Execution Environment","url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"}],"level":"applied","learning":{"definition":{"en":"Serverless compute runs application code on capacity managed by a provider, letting teams focus on what happens when work arrives. AWS Lambda implements this model with functions, programs invoked in response to requests or events.","es":"La computación serverless ejecuta código en recursos administrados por un proveedor, para que los equipos se centren en qué hacer cuando llega trabajo. AWS Lambda aplica este modelo mediante funciones, programas que se invocan al recibir peticiones o eventos."},"simple":{"en":"An event source, such as a queue, supplies a work item. Lambda invokes your function in an execution environment, the isolated place holding its runtime and code. AWS prepares these environments; you choose memory, permissions and timeout. Overlapping invocations create concurrency: several executions happening at once. Reusing an environment can avoid some startup effort. When demand outruns available concurrency, work can wait or be rejected, depending on how it arrives.","es":"Una fuente de eventos, como una cola, proporciona una tarea. Lambda invoca tu función en un entorno de ejecución, un espacio aislado que contiene el código y su motor de ejecución. AWS prepara esos entornos; tú eliges memoria, permisos y tiempo máximo. Las invocaciones que se solapan crean concurrencia: varias ejecuciones simultáneas. Reutilizar un entorno puede ahorrar parte del arranque. Cuando falta concurrencia disponible, las tareas esperan o se rechazan, según cómo lleguen."},"analogy":{"en":"Think of a staffed photo lab: you submit a job rather than maintain the equipment. Its benches represent concurrent work, but the comparison stops there: Lambda provides neither permanent file storage nor unlimited benches.","es":"Piensa en un laboratorio fotográfico: entregas un encargo sin mantener las máquinas. Sus puestos representan trabajos simultáneos, pero la comparación tiene límites: Lambda no proporciona almacenamiento permanente de archivos ni puestos ilimitados."},"walkthrough":{"en":["A seller uploads product photo p17 to a durable source object bucket. Only this source bucket emits notifications to a queue, a buffer that holds pending tasks. A configured queue integration invokes the resizing function.","The function reads p17, creates a thumbnail and stores it as p17/thumb in a separate output bucket, which does not trigger this workflow. Another photo can use a different environment while p17 runs, within available concurrency.","After a successful invocation, the queue integration removes the message. If delivery repeats, the function writes to the same output key. The thumbnail remains in object storage even when the execution environment disappears."],"es":["Un vendedor sube la foto de producto p17 a un bucket de origen duradero. Solo ese bucket envía notificaciones a una cola, un búfer que conserva tareas pendientes. Una integración configurada con la cola invoca la función que cambia el tamaño.","La función lee p17, crea una miniatura y la guarda como p17/thumb en otro bucket de salida, que no activa este proceso. Otra foto puede utilizar un entorno distinto mientras se procesa p17, dentro de la concurrencia disponible.","Tras una invocación correcta, la integración con la cola elimina el mensaje. Si se repite la entrega, la función escribe en la misma clave de salida. La miniatura permanece en el almacenamiento de objetos aunque desaparezca el entorno de ejecución."]},"pitfalls":{"en":["Keeping the only result in memory or temporary disk risks losing it when an environment disappears. Save durable results elsewhere, and keep each invocation within the 15-minute execution limit.","Growing concurrency can overload dependencies and increase cost; quotas and the function scaling rate also constrain bursts. Set a concurrency cap and measure throughput rather than assuming immediate capacity."],"es":["Si el único resultado está en memoria o en disco temporal, puede perderse cuando desaparece el entorno. Guarda los resultados duraderos fuera y limita cada invocación al máximo de 15 minutos.","Aumentar la concurrencia puede sobrecargar dependencias y elevar el coste; las cuotas y el ritmo de escalado de la función también limitan los picos. Fija un máximo de concurrencia y mide el rendimiento sin dar por hecho que la capacidad llega inmediatamente."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html","label":"docs.aws.amazon.com: lambda runtime environment"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"}]}},{"id":"cloud-containers","parent":"cloud-compute","title":{"en":"Containers: ECS, EKS and Fargate","es":"Contenedores: ECS, EKS y Fargate"},"summary":{"en":"Containers package dependencies; orchestration and compute are separate choices about how those packages run.","es":"Los contenedores empaquetan dependencias; la orquestación y los recursos de ejecución son decisiones distintas sobre cómo ejecutar esos paquetes."},"details":{"en":["The same image can behave differently when deployment settings change. Environment variables, mounted secrets, resource limits and network permissions are supplied at startup rather than necessarily embedded in the image. Record these settings alongside the image version so a repeatable package does not become an unrepeatable deployment."],"es":["La misma imagen puede comportarse de otra forma si cambian los ajustes del despliegue. Las variables de entorno, los secretos montados, los límites de recursos y los permisos de red se proporcionan al arrancar, sin que tengan que estar incluidos en la imagen. Registra estos ajustes junto con la versión de la imagen para que un paquete reproducible no acabe en un despliegue imposible de repetir."]},"aws":{"en":"Run the returns-label API as an ECS service on Fargate, with an Application Load Balancer directing requests to healthy copies and DynamoDB storing label records.","es":"Ejecuta la API de etiquetas de devolución como un servicio ECS sobre Fargate, con un Application Load Balancer que dirija peticiones a copias sanas y DynamoDB para conservar los registros de etiquetas."},"question":{"en":"Our label API has no Kubernetes dependencies, and nobody wants to patch servers. Should we choose ECS, EKS or Fargate?","es":"Nuestra API de etiquetas no depende de Kubernetes y nadie quiere aplicar parches a servidores. ¿Debemos elegir ECS, EKS o Fargate?"},"answer":{"en":"Choose ECS with Fargate here. ECS coordinates containers, while Fargate supplies compute without your team maintaining host machines. EKS is the managed Kubernetes option; consider it if Kubernetes tooling or APIs are an actual requirement. ECS and EKS both support EC2-backed capacity and Fargate, subject to workload compatibility. EC2 provides more hardware and host-level control. Compare costs using expected utilization: a well-used EC2 fleet can be cheaper, but server maintenance and operational effort also belong in that comparison.","es":"Aquí elegiría ECS con Fargate. ECS coordina contenedores y Fargate aporta recursos sin que el equipo mantenga las máquinas anfitrionas. EKS ofrece Kubernetes gestionado; considéralo si necesitas sus herramientas o interfaces. Tanto ECS como EKS admiten recursos EC2 y Fargate, según la compatibilidad de la carga. EC2 permite más control del hardware y del sistema anfitrión. Compara costes con la utilización prevista: una flota EC2 bien aprovechada puede resultar más barata, pero su mantenimiento y el esfuerzo operativo también cuentan."},"related":["cloud-compute","systems-processes","cloud-microservices"],"sources":[{"label":"Amazon ECS vs EKS Comparison","url":"https://aws.amazon.com/containers/"},{"url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://man7.org/linux/man-pages/man7/namespaces.7.html","label":"man7.org: namespaces.7"}],"level":"applied","learning":{"definition":{"en":"A container runs an application as an isolated process using an image that packages its code and required libraries. This makes deployments repeatable across compatible machines without packaging a separate operating system kernel for each application.","es":"Un contenedor ejecuta una aplicación como un proceso aislado mediante una imagen que empaqueta su código y las bibliotecas necesarias. Esto permite repetir despliegues entre máquinas compatibles sin incluir un núcleo de sistema operativo independiente para cada aplicación."},"simple":{"en":"A developer builds an image, a read-only package. A container runtime starts processes from it. For Linux containers, features of the kernel, the operating system core, restrict what each process sees and how many resources it consumes; the host kernel remains shared. An orchestrator is the controller that places containers on available compute and maintains the requested number of copies. The image describes what to run; the orchestrator coordinates it; the compute supplies CPU and memory.","es":"El desarrollador crea una imagen, un paquete de solo lectura. Un motor de contenedores inicia procesos a partir de ella. En Linux, funciones del núcleo, la parte central del sistema operativo, restringen qué ve cada proceso y cuánto consume; el núcleo de la máquina sigue compartido. Un orquestador es el controlador que coloca contenedores en recursos disponibles y mantiene el número solicitado de copias. La imagen describe qué ejecutar; el orquestador lo coordina; las máquinas aportan CPU y memoria."},"analogy":{"en":"A container image resembles a packed food stall kit: the same tools travel to each venue, while the venue supplies utilities. The boundary matters: shared utilities do not become a private building.","es":"Una imagen se parece al equipo embalado de un puesto de comida: las herramientas viajan entre recintos, que aportan los suministros. El límite importa: compartir esos suministros no equivale a disponer de un edificio propio."},"walkthrough":{"en":["A team packages its returns-label API and a particular PDF library into image version 12. Testing that image catches missing dependencies before the team deploys the same artifact to production.","The team requests three copies. The orchestrator starts them on resources with enough memory. In normal operation, a load balancer distributes incoming requests to copies that pass its configured health checks.","During a rollout of version 13, new copies fail their health checks. The rollout configuration retains healthy old copies until replacements are ready, so version 12 continues serving while the team investigates."],"es":["Un equipo empaqueta su API de etiquetas de devolución y una biblioteca PDF concreta en la versión 12 de una imagen. Las pruebas detectan dependencias ausentes antes de desplegar ese mismo paquete en producción.","El equipo solicita tres copias. El orquestador las inicia en recursos con memoria suficiente. En funcionamiento normal, un balanceador reparte las peticiones entre copias que superan sus comprobaciones de estado configuradas.","Durante el despliegue de la versión 13, las nuevas copias no superan las comprobaciones. La configuración conserva las copias antiguas sanas hasta disponer de sustitutas listas, así que la versión 12 sigue atendiendo peticiones mientras el equipo investiga."]},"pitfalls":{"en":["Treating container storage as a permanent record makes replacement risky. Keep label history in external durable storage, and ensure replacement copies can reconstruct any local working files they need.","Packaging does not remove security work. Rebuild images with patched dependencies, limit privileges and verify CPU architecture and operating system compatibility before moving the workload to different compute."],"es":["Tratar el almacenamiento del contenedor como un registro permanente complica su sustitución. Conserva el historial de etiquetas en almacenamiento duradero externo y prepara las copias nuevas para reconstruir los archivos locales de trabajo que necesiten.","Empaquetar no elimina el trabajo de seguridad. Reconstruye las imágenes con dependencias actualizadas, limita privilegios y comprueba la compatibilidad de arquitectura de CPU y sistema operativo antes de trasladar la carga a otras máquinas."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"},{"url":"https://man7.org/linux/man-pages/man7/namespaces.7.html","label":"man7.org: namespaces.7"}]}},{"id":"cloud-scaling","parent":"cloud","title":{"en":"Elastic Scaling","es":"Escalado elástico"},"summary":{"en":"Scale on a signal that reflects waiting work, allowing for the delay before extra capacity becomes productive.","es":"Escala con una señal que refleje el trabajo pendiente, contando con el retraso hasta que la capacidad adicional empiece a producir."},"details":{"en":["Queue length alone does not express waiting time. A queue of 100 short invoices and one of 100 large invoices can need very different capacity. Track the age of the oldest pending document alongside processing rate, and test whether deadlines are met during scale-out rather than judging success by worker count."],"es":["La longitud de la cola por sí sola no expresa el tiempo de espera. Una cola de 100 facturas cortas y otra de 100 facturas extensas pueden necesitar capacidades muy distintas. Sigue la antigüedad del documento pendiente más antiguo junto con el ritmo de procesamiento y comprueba si se cumplen los plazos mientras aumenta la capacidad, en lugar de valorar el resultado por el número de trabajadores."]},"aws":{"en":"Use an EC2 Auto Scaling group for invoice workers, publishing an SQS backlog-per-instance metric to CloudWatch. Configure termination lifecycle hooks to give busy workers a bounded period to finish before shutdown.","es":"Utiliza un grupo de EC2 Auto Scaling para los trabajadores de facturación y publica en CloudWatch una métrica de tareas pendientes en SQS por instancia. Configura puntos de espera del ciclo de terminación para dar a los trabajadores ocupados un plazo limitado para acabar antes del apagado."},"question":{"en":"Our queue is growing, but Auto Scaling says it added workers. Why are invoices still late?","es":"La cola crece, pero Auto Scaling indica que ha añadido trabajadores. ¿Por qué siguen llegando tarde las facturas?"},"answer":{"en":"Check ready, productive workers rather than the requested count. New machines may still be booting, fetching the application or waiting for connections. Then compare arrival rate with actual completion rate: capacity that only matches arrivals stops further growth but cannot clear an existing backlog. If adding workers does not raise completions, investigate shared storage or database limits. For a promotion with a known start time, schedule extra capacity early and confirm the full path can handle the planned rate.","es":"Comprueba cuántos trabajadores están listos y procesando, no solo cuántos se han solicitado. Las máquinas nuevas pueden seguir arrancando, descargando la aplicación o esperando conexiones. Después compara el ritmo de llegada con el de finalización: igualarlos frena el crecimiento de la cola, pero no elimina lo ya acumulado. Si añadir trabajadores no aumenta las finalizaciones, revisa los límites del almacenamiento o la base de datos. Para una promoción con horario conocido, programa capacidad adicional con antelación y comprueba todo el recorrido."},"related":["cloud-ec2","cloud-lambda","reliability","improve-performance"],"sources":[{"label":"EC2 Auto Scaling - target tracking policies","url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html"},{"label":"Lambda scaling behavior (concurrency scaling rate)","url":"https://docs.aws.amazon.com/lambda/latest/dg/scaling-behavior.html"},{"url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/scale-your-group.html","label":"docs.aws.amazon.com: scale your group"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"}],"level":"applied","quickLinks":["improve-performance"],"learning":{"definition":{"en":"Elastic scaling changes the computing capacity assigned to a workload as demand rises or falls. Its purpose is to keep enough resources to serve work without paying indefinitely for capacity that is no longer needed.","es":"El escalado elástico modifica la capacidad de cómputo asignada a una carga cuando sube o baja la demanda. Su finalidad es mantener recursos suficientes para atender el trabajo sin seguir pagando indefinidamente por los que ya no hacen falta."},"simple":{"en":"A scaling controller watches a signal, such as queued jobs per worker, then changes desired capacity within configured limits. Workers are processes that handle those jobs. Adding workers spreads work across more copies: horizontal scaling. Giving one worker a larger machine is vertical scaling. Decisions and startup both take time, so capacity arrives after the signal changes. Removing workers too aggressively can recreate a backlog, the work waiting to be processed.","es":"Un controlador observa una señal, como los trabajos en cola por trabajador, y cambia la capacidad solicitada dentro de unos límites. Los trabajadores son procesos que resuelven esos trabajos. Añadir trabajadores reparte la carga entre más copias: es escalado horizontal. Dar una máquina mayor a un trabajador es escalado vertical. Tanto decidir como arrancar lleva tiempo, así que la capacidad llega después de cambiar la señal. Retirar trabajadores demasiado deprisa puede volver a acumular tareas pendientes."},"analogy":{"en":"Opening extra supermarket checkouts shares a growing queue, but calling cashiers takes time. The comparison has a limit: a new computing worker must also initialize software and connect to shared services before helping.","es":"Abrir más cajas de supermercado reparte una cola creciente, pero conseguir cajeros lleva tiempo. La comparación tiene un límite: un proceso trabajador nuevo también debe inicializar programas y conectarse a servicios compartidos antes de ayudar."},"walkthrough":{"en":["Four invoice workers each finish five documents per minute. A promotion raises arrivals from 20 to 60 per minute, so the queue starts growing even though every worker remains healthy.","A policy reacts to queued documents per worker and requests more workers. Each new worker needs two minutes to become ready; during that delay, the original four cannot keep up with incoming documents.","At the measured processing rate, sixteen ready workers finish 80 documents per minute. With arrivals still at 60, the backlog shrinks by 20 per minute. After demand falls, the policy removes workers gradually."],"es":["Cuatro trabajadores de facturación terminan cinco documentos por minuto cada uno. Una promoción eleva las entradas de 20 a 60 por minuto, así que la cola crece aunque todos los trabajadores sigan funcionando correctamente.","Una política reacciona a los documentos en cola por trabajador y solicita más trabajadores. Cada uno tarda dos minutos en estar listo; durante esa espera, los cuatro originales no pueden seguir el ritmo de entrada.","Al ritmo de procesamiento medido, dieciséis trabajadores listos terminan 80 documentos por minuto. Si siguen llegando 60, la cola disminuye en 20 por minuto. Cuando baja la demanda, la política retira trabajadores de forma gradual."]},"pitfalls":{"en":["Healthy workers can still be overloaded. Replacing failed workers restores lost capacity but does not address rising demand. Measure the complete signal-to-readiness delay before choosing when to add workers.","Scaling the wrong component only adds cost. More invoice workers help only while storage and database dependencies can support them. Configure a capacity ceiling and watch end-to-end completion time."],"es":["Un trabajador sano también puede estar sobrecargado. Sustituir los que fallan recupera capacidad perdida, pero no responde al aumento de demanda. Mide todo el tiempo desde la señal hasta estar listo antes de decidir cuándo añadir trabajadores.","Escalar el componente equivocado solo añade coste. Más trabajadores de facturación ayudan mientras el almacenamiento y la base de datos puedan soportarlos. Configura un máximo de capacidad y vigila el tiempo total hasta completar cada trabajo."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/scale-your-group.html","label":"docs.aws.amazon.com: scale your group"},{"url":"https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html","label":"docs.aws.amazon.com: lambda concurrency"}]}},{"id":"cloud-distributed-systems","parent":"cloud","title":{"en":"Distributed Applications","es":"Aplicaciones distribuidas"},"summary":{"en":"A network failure can hide a completed action, so safe retries need a stable operation identity.","es":"Un fallo de red puede ocultar una acción completada, así que los reintentos seguros necesitan identificar siempre la misma operación."},"details":{"en":["Distribution and microservices are different design choices. One application can run as coordinated networked processes without independently deployable business services. Splitting deployment units helps when teams need separate ownership or release cycles, but adds interface contracts and operational work. Choose those boundaries around real needs rather than the number of servers."],"es":["Distribución y microservicios son decisiones de diseño distintas. Una aplicación puede funcionar como procesos coordinados por red sin tener servicios de negocio desplegables por separado. Dividir las unidades de despliegue ayuda cuando los equipos necesitan responsabilidades o ciclos de publicación independientes, pero añade contratos entre interfaces y trabajo operativo. Define esos límites según necesidades reales, no según el número de servidores."]},"aws":{"en":"Connect checkout and inventory through an SQS standard queue. Use a DynamoDB transaction to record R42 while conditionally reducing stock, accounting for duplicate delivery and messages arriving out of order.","es":"Conecta compra e inventario mediante una cola estándar de SQS. Utiliza una transacción de DynamoDB para registrar R42 y reducir el stock de forma condicional, contemplando entregas duplicadas y mensajes que llegan fuera de orden."},"question":{"en":"Inventory reserved an item, but checkout timed out and shows the order as pending. Should checkout send a new reservation ID?","es":"Inventario ha reservado una unidad, pero el servicio de compra ha agotado la espera y muestra el pedido como pendiente. ¿Debe enviar un identificador de reserva nuevo?"},"answer":{"en":"No. Reuse the original reservation ID: the timeout tells checkout only that it missed a response, not that inventory did nothing. Query the saved outcome or retry with the same ID so inventory can recognize the completed operation. Keep the order pending while the result is unknown instead of promising success or declaring failure. If the customer cancels later, release the reservation through a separate, tracked operation; repeating the original request should not silently become a different business action.","es":"No. Reutiliza el identificador original: agotar la espera solo indica que compra no recibió respuesta, no que inventario no hiciera nada. Consulta el resultado guardado o reintenta con el mismo identificador para que inventario reconozca la operación completada. Mantén el pedido pendiente mientras desconozcas el resultado, sin prometer éxito ni declarar un fallo. Si el cliente cancela después, libera la reserva mediante otra operación con seguimiento propio; repetir la petición original no debería convertirse silenciosamente en una acción de negocio diferente."},"related":["cloud-queues-messaging","cloud-microservices","data-consistency"],"sources":[{"label":"Amazon SQS standard queues (at-least-once delivery, possible duplicates)","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html"},{"url":"https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/microservices-on-aws.html","label":"docs.aws.amazon.com: microservices on aws"}],"level":"foundation","learning":{"definition":{"en":"A distributed application performs a task through multiple processes exchanging information over a network, often across different machines. Splitting work can let components scale separately or keep some functions available during a failure, but introduces coordination problems.","es":"Una aplicación distribuida realiza una tarea mediante varios procesos que intercambian información por una red, a menudo entre máquinas distintas. Repartir el trabajo puede permitir que los componentes escalen por separado o mantengan algunas funciones disponibles durante un fallo, pero introduce problemas de coordinación."},"simple":{"en":"One component sends a request or publishes a message, a stored description of work. Another receives it and changes its state, meaning the information it keeps. Because the network and receiver can fail separately, silence does not reveal whether the work happened. A retry may repeat an already completed action. Idempotency means repeated attempts have the same intended effect as one attempt, usually by linking them to a stable operation identifier and remembering the outcome.","es":"Un componente envía una petición o publica un mensaje, una descripción de trabajo que queda almacenada. Otro lo recibe y modifica su estado, es decir, la información que conserva. Como la red y el receptor pueden fallar por separado, el silencio no revela si el trabajo se hizo. Reintentar puede repetir una acción completada. La idempotencia hace que varios intentos tengan el mismo efecto previsto que uno, normalmente mediante un identificador estable de operación y un registro del resultado."},"analogy":{"en":"Imagine two warehouses coordinating by courier. A missing receipt does not prove a parcel never arrived, so a second delivery needs the original parcel number. The limit: software must explicitly implement this duplicate handling.","es":"Imagina dos almacenes coordinados por mensajeros. Perder un recibo no demuestra que el paquete no llegara, por lo que una segunda entrega necesita su número original. El límite: el software debe implementar expresamente la detección de duplicados."},"walkthrough":{"en":["Checkout accepts order O42 and sends a stock-reservation message carrying reservation ID R42. The inventory service reads the message and prepares to reduce the available quantity by one for the ordered item.","Inventory records R42 and reduces stock in one database transaction, conditional on R42 not already existing. A transaction applies both changes or neither. Inventory then crashes before acknowledging successful processing to the queue.","The queue delivers R42 again. Its saved result identifies the reservation as complete, so inventory reports that outcome without subtracting stock again. Checkout can observe the reservation later instead of assuming immediate completion."],"es":["El servicio de compra acepta el pedido O42 y envía un mensaje de reserva de stock con el identificador R42. El servicio de inventario lee el mensaje y se prepara para reducir en una unidad la cantidad disponible del artículo pedido.","Inventario registra R42 y reduce el stock en una transacción de base de datos, con la condición de que R42 no exista todavía. Una transacción aplica ambos cambios o ninguno. Después, inventario falla antes de confirmar a la cola que ha procesado el mensaje.","La cola vuelve a entregar R42. El resultado guardado identifica la reserva como completada, así que inventario comunica ese resultado sin descontar otra unidad. El servicio de compra puede consultar la reserva más tarde, en vez de darla por completada inmediatamente."]},"pitfalls":{"en":["Retrying every timeout immediately can amplify an outage. Use bounded retries with backoff, increasing the delay between attempts, and a recovery path for work that still fails.","Saving the duplicate marker separately from the stock change leaves a crash window between them. Retain identifiers long enough for the actual retry and replay period, including delayed recovery."],"es":["Reintentar inmediatamente cada petición que agota su tiempo de espera puede agravar una caída. Limita los reintentos, aumenta la espera entre ellos y prepara una vía de recuperación para el trabajo que siga fallando.","Guardar la marca de duplicado por separado del cambio de stock deja un intervalo vulnerable a fallos entre ambos. Conserva los identificadores durante todo el periodo real de reintentos y reprocesamiento, incluida la recuperación tardía."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"},{"url":"https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/microservices-on-aws.html","label":"docs.aws.amazon.com: microservices on aws"}]}},{"id":"cloud-queues-messaging","parent":"cloud-distributed-systems","title":{"en":"Queues, Pub/Sub and Event-Driven Messaging","es":"Colas, pub/sub y mensajería orientada a eventos"},"summary":{"en":"Use queues for pending work and separate subscriptions when different functions must react to the same event.","es":"Usa colas para el trabajo pendiente y suscripciones separadas cuando distintas funciones deban reaccionar al mismo evento."},"details":{"en":["An order can be saved even if publishing its event fails. A transactional outbox avoids that gap by saving the order and a pending-event record in one database transaction. A separate relay publishes pending records, but may publish twice after a failure, so consumers still need duplicate-safe handling. EventBridge can route events to matching destinations; routing cannot repair a missing publication."],"es":["Un pedido puede guardarse aunque falle la publicación de su evento. Un buzón transaccional, o transactional outbox, evita ese hueco guardando el pedido y un registro de evento pendiente en una transacción. Otro proceso publica los registros pendientes, pero puede publicarlos dos veces tras un fallo; los consumidores deben seguir tolerando duplicados. EventBridge puede dirigir eventos a destinos que cumplan condiciones; el enrutamiento no repara una publicación ausente."]},"aws":{"en":"For the bookshop, publish OrderPlaced to Amazon SNS and subscribe two SQS Standard queues, one for inventory and one for email. SNS supplies separate delivery paths; SQS buffers each workload. Standard delivery is at least once, with only best-effort ordering, so consumers must handle duplicates and unexpected arrival order.","es":"En la librería, publica OrderPlaced en Amazon SNS y suscribe dos colas SQS Standard, una para inventario y otra para correo. SNS proporciona vías independientes y SQS acumula el trabajo. Standard entrega al menos una vez y solo intenta respetar el orden; los consumidores deben tolerar duplicados y cambios en el orden de llegada."},"question":{"en":"Our worker crashes after reserving stock, then the same order reserves stock again. Would switching its queue to FIFO fix this?","es":"Nuestro consumidor falla tras reservar existencias y el mismo pedido vuelve a reservarlas. ¿Lo resolvería cambiar su cola a FIFO?"},"answer":{"en":"FIFO would not close that crash window. SQS FIFO orders messages within a message group and suppresses eligible producer duplicates for five minutes. A consumer can still receive a message again after its visibility timeout, the period it stays hidden, or a failure before deletion. I would record the order ID with the stock change in one transaction, rejecting an already recorded reservation. Only then would I delete the message. A repeated delivery would find the existing reservation instead of subtracting stock again.","es":"FIFO no cerraría ese intervalo de fallo. SQS FIFO mantiene el orden dentro de cada grupo de mensajes y descarta duplicados elegibles del productor durante cinco minutos. El consumidor puede recibir de nuevo el mensaje al vencer su tiempo de visibilidad, el periodo durante el que permanece oculto, o si falla antes de borrarlo. Guardaría el identificador del pedido junto con el descuento de existencias en una transacción, rechazando reservas ya registradas. Solo después borraría el mensaje. Una entrega repetida encontraría la reserva existente sin volver a descontar existencias."},"related":["cloud-distributed-systems","data-consistency"],"sources":[{"label":"Amazon SQS FIFO queues","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html"},{"label":"Amazon SQS visibility timeout","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html"},{"label":"Amazon EventBridge - What is EventBridge","url":"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html","label":"docs.aws.amazon.com: FIFO queues understanding logic"}],"level":"applied","learning":{"definition":{"en":"Messaging lets one application component hand work or news to another without waiting for it to finish. A queue holds work for consumers, while publish/subscribe sends a publication to independent subscriptions so several components can react.","es":"La mensajería permite que una parte de una aplicación entregue trabajo o novedades a otra sin esperar a que termine. Una cola conserva trabajo para los consumidores; publicación/suscripción envía una publicación a suscripciones independientes para que varias partes puedan reaccionar."},"simple":{"en":"A producer sends a message describing a task or an event, something that has already happened. A consumer reads it and does the work. Several consumers can share a queue, taking work as capacity becomes available. Acknowledgement tells the queue that processing finished. If acknowledgement is missing, the message may return. This separates accepting work from completing it, but means the application must distinguish a repeated delivery from a genuinely new request.","es":"Un productor envía un mensaje con una tarea o un evento, algo que ya ha ocurrido. Un consumidor lo lee y realiza el trabajo. Varios consumidores pueden compartir una cola y recoger trabajo cuando tienen capacidad. La confirmación indica a la cola que el procesamiento ha terminado. Si falta, el mensaje puede reaparecer. Así se separa la aceptación del trabajo de su ejecución, pero la aplicación debe distinguir una entrega repetida de una petición realmente nueva."},"analogy":{"en":"A queue resembles a tray of repair tickets: available technicians take work. Publish/subscribe resembles sending copies to separate departments. Unlike paper tickets, digital messages can reappear after a failed acknowledgement.","es":"Una cola se parece a una bandeja de avisos de reparación: cada técnico disponible recoge trabajo. Publicación/suscripción reparte copias entre departamentos. A diferencia del papel, los mensajes digitales pueden reaparecer si falta la confirmación."},"walkthrough":{"en":["A bookshop accepts order 417 and publishes an OrderPlaced event. A distributor sends one copy to an inventory queue and another to an email queue, giving each subscriber its own pending work.","An inventory consumer records a reservation for order 417 and reduces stock in one database transaction. It crashes before acknowledging the message. The reservation survives, but the queue still considers the work unfinished.","When the message reappears, another consumer finds the reservation and acknowledges without subtracting stock again. This is idempotency: repeating the request leaves the intended business result unchanged. The email queue progresses independently."],"es":["Una librería acepta el pedido 417 y publica un evento OrderPlaced, que significa pedido realizado. Un distribuidor envía una copia a la cola de inventario y otra a la de correo; cada suscriptor tiene su propio trabajo pendiente.","Un consumidor de inventario registra una reserva para el pedido 417 y descuenta existencias en una transacción de base de datos. Falla antes de confirmar el mensaje. La reserva queda guardada, pero la cola considera el trabajo pendiente.","Cuando el mensaje reaparece, otro consumidor encuentra la reserva y confirma sin volver a descontar existencias. Eso es idempotencia: repetir la petición no altera el resultado de negocio previsto. La cola de correo avanza por separado."]},"pitfalls":{"en":["A shared queue divides work; it does not broadcast an independent copy to every worker. Separate subscribers need separate delivery paths.","Buffering absorbs a temporary burst, not unlimited load. Monitor message age and isolate repeatedly failing messages so they do not keep consuming processing capacity."],"es":["Una cola compartida reparte trabajo; no envía una copia independiente a cada consumidor. Los suscriptores independientes necesitan vías de entrega separadas.","Acumular mensajes absorbe un pico temporal, no una carga ilimitada. Vigila su antigüedad y aparta los que fallan repetidamente para que no sigan consumiendo capacidad."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues.html","label":"docs.aws.amazon.com: standard queues"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html","label":"docs.aws.amazon.com: sqs visibility timeout"},{"url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-understanding-logic.html","label":"docs.aws.amazon.com: FIFO queues understanding logic"}]},"diagrams":[{"id":"queue-flow","kind":"flow","nodes":["cloud-queues-messaging"],"title":{"en":"Accept work now and process it independently","es":"Aceptar trabajo ahora y procesarlo por separado"},"caption":{"en":"A producer stores a message in the queue and can acknowledge acceptance without waiting for processing. Consumers take messages at their own pace. The queue absorbs a temporary burst, but sustained arrival above processing capacity still creates a growing backlog.","es":"El productor guarda un mensaje en la cola y puede confirmar su aceptación sin esperar al procesamiento. Los consumidores retiran mensajes a su ritmo. La cola absorbe un pico temporal, pero si llega más trabajo del que se procesa de forma sostenida, la acumulación sigue creciendo."},"alt":{"en":"Left to right: producers store messages in a queue; consumers receive, process and delete them after success. Receiving temporarily hides a message; expiry without deletion makes it visible again. A configured receive-count threshold sends repeatedly received messages to a dead-letter queue. Duplicates require processing that does not repeat the business effect. If arrivals exceed processing continuously, waiting work grows. Acceptance is not completion.","es":"De izquierda a derecha: los productores guardan mensajes; los consumidores los reciben, procesan y borran tras el éxito. Recibir oculta temporalmente un mensaje; si vence el plazo sin borrarlo, reaparece. Un umbral configurado envía mensajes recibidos repetidamente a una cola de mensajes fallidos. El procesamiento de duplicados no debe repetir el efecto de negocio. Si llega continuamente más trabajo del que se procesa, la espera crece. Aceptar no equivale a completar."},"flows":[{"label":{"en":"One message, end to end","es":"Un mensaje, de principio a fin"},"stages":[{"zone":{"en":"Producers","es":"Productores"},"items":[{"label":{"en":"Order service","es":"Servicio de pedidos"},"note":{"en":"Confirms acceptance only after the message is stored successfully. Accepted does not mean the order has finished processing.","es":"Confirma la aceptación solo después de guardar correctamente el mensaje. Aceptado no significa que el pedido haya terminado de procesarse."}},{"label":{"en":"Web application","es":"Aplicación web"},"note":{"en":"Does not know which worker will process it, or when.","es":"No sabe qué trabajador lo procesará, ni cuándo."}}]},{"zone":{"en":"Queue","es":"Cola"},"items":[{"label":{"en":"Main queue","es":"Cola principal"},"note":{"en":"Receiving a message temporarily hides it from other consumers. After successful processing the consumer deletes it; otherwise it becomes visible again when the timeout expires.","es":"Al recibir un mensaje se oculta temporalmente a otros consumidores. Tras procesarlo correctamente, el consumidor lo borra; si no, vuelve a ser visible al vencer ese plazo."}},{"label":{"en":"Dead-letter queue","es":"Cola de mensajes fallidos"},"note":{"en":"Receives messages after the configured receive-count threshold is exceeded. Investigate and replay them safely; a receive count is not proof of a business failure.","es":"Recibe mensajes al superar el umbral configurado de recepciones. Investígalos y reprocesa con seguridad; ese contador no demuestra por sí solo un fallo de negocio."}}]},{"zone":{"en":"Consumers","es":"Consumidores"},"items":[{"label":{"en":"Worker fleet","es":"Flota de trabajadores"},"note":{"en":"Choose consumer capacity from arrival rate, processing time and the longest acceptable wait. Monitor message age as well as queue length.","es":"Dimensiona los consumidores según las llegadas, el tiempo de procesamiento y la espera máxima aceptable. Mide la edad de los mensajes además de la longitud de la cola."}},{"label":{"en":"Idempotent handler","es":"Manejador idempotente"},"note":{"en":"For at-least-once delivery, repeat messages are possible. Use a business identifier so processing the same work again does not repeat its effect, then delete after success.","es":"Con entrega al menos una vez puede haber mensajes repetidos. Usa un identificador de negocio para que repetir el procesamiento no repita su efecto y borra el mensaje tras el éxito."}}]}]}]}]},{"id":"cloud-microservices","parent":"cloud-distributed-systems","title":{"en":"Microservices and Service Boundaries","es":"Microservicios y límites de servicio"},"summary":{"en":"Draw boundaries around decisions a team can own and release without coordinating every change across the application.","es":"Delimita servicios alrededor de decisiones que un equipo pueda controlar y desplegar sin coordinar cada cambio con toda la aplicación."},"details":{"en":["Independent releases depend on compatibility over time. Making a new request field mandatory immediately can force every caller to change together. An optional field with a sensible default lets old and new callers coexist during rollout. Contract tests check that requests and responses still satisfy the agreed interface. Service discovery finds the current network address of a service, but cannot make an incompatible request valid."],"es":["Los despliegues independientes exigen compatibilidad a lo largo del tiempo. Hacer obligatorio un campo nuevo de inmediato puede forzar a todos los clientes a cambiar juntos. Un campo opcional con un valor predeterminado razonable permite que convivan clientes antiguos y nuevos. Las pruebas de contrato comprueban que peticiones y respuestas respetan la interfaz acordada. El descubrimiento de servicios localiza la dirección de red actual de un servicio, pero no convierte una petición incompatible en válida."]},"aws":{"en":"Run checkout and inventory as separate Amazon ECS services on AWS Fargate, which runs application containers without the team managing their underlying servers. During a stock-heavy sale, increase the running copies of inventory without redeploying checkout. Limit database connections so those extra copies do not overwhelm the inventory database.","es":"Ejecuta compra e inventario como servicios separados de Amazon ECS sobre AWS Fargate, que ejecuta aplicaciones empaquetadas en contenedores sin que el equipo gestione los servidores subyacentes. En una campaña con muchas consultas de existencias, aumenta las copias de inventario sin redesplegar compra. Limita las conexiones para no saturar su base de datos."},"question":{"en":"We have four developers, one weekly release and no identified scaling bottleneck. Should we split our shop into twelve services now?","es":"Somos cuatro desarrolladores, desplegamos una vez por semana y no hemos identificado problemas de capacidad. ¿Dividimos ya la tienda en doce servicios?"},"answer":{"en":"I would keep one deployment and separate the code into modules with clear responsibilities. With four people and no identified bottleneck, twelve services would add deployments and network failures without a demonstrated need. Agree which module may change each piece of data so a later split remains practical. Then measure where releases or capacity become constrained. If inventory eventually needs independent resources or releases, extract that responsibility behind a stable interface rather than splitting every technical layer at once.","es":"Yo mantendría un único despliegue y separaría el código en módulos con responsabilidades claras. Con cuatro personas y ningún cuello de botella identificado, doce servicios añadirían despliegues y fallos de red sin una necesidad demostrada. Acordaría qué módulo puede modificar cada dato para facilitar una separación posterior. Después mediría dónde se atascan las entregas o la capacidad. Si inventario acaba necesitando recursos o despliegues de forma independiente, extraería esa responsabilidad con una interfaz estable, en lugar de trocear todas las capas a la vez."},"related":["cloud-distributed-systems","cloud-containers","architecture-discovery"],"sources":[{"label":"AWS X-Ray Developer Guide","url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html"},{"url":"https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/microservices-on-aws.html","label":"docs.aws.amazon.com: microservices on aws"},{"url":"https://aws.amazon.com/microservices/","label":"aws.amazon.com: microservices"}],"level":"deep","learning":{"definition":{"en":"Microservices divide an application into responsibilities that can be owned and released separately, such as taking orders or managing stock. The purpose is to change or add capacity to one part without releasing the whole application.","es":"Los microservicios dividen una aplicación en responsabilidades con gestión y despliegues independientes, como tramitar pedidos o gestionar existencias. Su propósito es cambiar una parte o añadirle capacidad sin desplegar toda la aplicación."},"simple":{"en":"Checkout asks inventory whether two books can be reserved. Each service owns its decision and exposes a contract, the agreed format and meaning of requests and replies. Running separately lets inventory gain capacity without changing checkout. But a network timeout leaves checkout unsure whether its request succeeded. It needs deadlines, safe retries with increasing delays, and a circuit breaker, which temporarily stops calls to a failing dependency rather than letting waiting requests accumulate.","es":"El servicio de compra pregunta a inventario si puede reservar dos libros. Cada servicio controla su decisión y ofrece un contrato: el formato y significado acordados para peticiones y respuestas. Al ejecutarse por separado, inventario puede ganar capacidad sin cambiar compra. Pero una espera agotada deja a compra sin saber si la petición funcionó. Necesita plazos, reintentos seguros cada vez más espaciados y un interruptor de circuito, que detiene temporalmente las llamadas a una dependencia que falla para evitar que se acumulen peticiones esperando."},"analogy":{"en":"Market stalls can restock independently without closing the building, but customers must move between them. Microservices have similar boundaries; unlike stalls, they need explicit agreements about requests, failures and shared information.","es":"Los puestos de un mercado pueden reponer sin cerrar el edificio, pero los clientes deben desplazarse entre ellos. Los microservicios tienen límites parecidos; a diferencia de los puestos, necesitan acuerdos explícitos sobre peticiones, fallos e información compartida."},"walkthrough":{"en":["A bookshop changes stock-allocation rules weekly while checkout stays stable. The team gives inventory ownership of reservations and exposes a reserve operation taking an order ID, book ID and quantity. Checkout owns the order.","For order 417, checkout requests two books. Inventory saves the reservation, but its reply is lost. Checkout retries with the same order ID, and inventory returns the existing reservation instead of reserving more books.","The team releases a new allocation rule only to inventory, keeping the request format compatible. A trace identifier follows order 417 across both services, letting an engineer connect the checkout timeout to the successful reservation."],"es":["Una librería cambia sus reglas de asignación de existencias cada semana, mientras compra permanece estable. El equipo asigna las reservas a inventario, que ofrece una operación con identificador de pedido, libro y cantidad. Compra se encarga del pedido.","Para el pedido 417, compra solicita dos libros. Inventario guarda la reserva, pero la respuesta se pierde. Compra reintenta con el mismo identificador de pedido e inventario devuelve la reserva existente, sin reservar más libros.","El equipo despliega una nueva regla de asignación solo en inventario, manteniendo compatible el formato de petición. Un identificador de traza acompaña al pedido 417 por ambos servicios y permite relacionar la espera agotada de compra con la reserva realizada."]},"pitfalls":{"en":["Splitting web, logic and database layers into separate services can leave every feature needing coordinated releases. Each boundary should contain a coherent responsibility.","A modular monolith, one deployment with clear internal boundaries, may suit a small team until independent releases or capacity solve a measured problem."],"es":["Separar las capas web, lógica y de base de datos en servicios puede exigir despliegues coordinados para cualquier funcionalidad. Cada límite debería abarcar una responsabilidad coherente.","Un monolito modular, un único despliegue con límites internos claros, puede encajar en un equipo pequeño hasta que la independencia resuelva un problema medido de despliegues o capacidad."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/microservices-on-aws.html","label":"docs.aws.amazon.com: microservices on aws"},{"url":"https://aws.amazon.com/microservices/","label":"aws.amazon.com: microservices"}]}},{"id":"data","parent":null,"title":{"en":"Data Storage and Processing","es":"Almacenamiento y procesamiento de datos"},"summary":{"en":"Choose where each fact is authoritative, then build copies and processing around the questions the application must answer.","es":"Decide dónde está el dato de referencia y elige las copias y el procesamiento según las preguntas que deba responder la aplicación."},"details":{"en":["An order placed at 23:59 but received by a processor at 00:02 has an event time different from its processing time. Grouping sales by arrival can assign revenue to the wrong day. Save both timestamps and the order identifier, then define how late arrivals revise a published total. Include the business timezone in that rule: midnight is not the same boundary for every market."],"es":["Un pedido realizado a las 23:59 que llega al procesador a las 00:02 tiene una hora del evento distinta de su hora de procesamiento. Agrupar ventas por llegada puede atribuir ingresos al día equivocado. Guarda ambas marcas de tiempo y el identificador de pedido, y define cómo las llegadas tardías corrigen un total publicado. Incluye la zona horaria del negocio: la medianoche no marca el mismo límite en todos los mercados."]},"aws":{"en":"Save nightly order exports in Amazon S3 as files grouped by order date, then query them with Amazon Athena for daily sales reports. These are analytical copies; the checkout database still decides whether an order can be accepted. Querying an export does not make it current.","es":"Guarda las exportaciones nocturnas de pedidos en Amazon S3, en archivos agrupados por fecha de pedido, y consúltalos con Amazon Athena para elaborar informes diarios de ventas. Son copias para análisis; la base de datos de compra sigue decidiendo si se acepta un pedido. Consultar una exportación no la actualiza."},"question":{"en":"Checkout needs current stock, but our sales dashboard refreshes once a minute. Should every request hit the same store?","es":"Compra necesita existencias actuales, pero nuestro panel de ventas se actualiza cada minuto. ¿Debe ir toda consulta al mismo almacén?"},"answer":{"en":"I would let checkout make stock decisions against the authoritative transactional database. The dashboard can query it too while reporting does not interfere with purchases. If reporting creates contention, build a separate view from committed orders and refresh it continuously or on a schedule. Make its one-minute freshness target visible and monitor actual delay. Keep order identifiers so retries do not inflate totals, and reconcile the view with saved orders rather than treating a fast display as proof of correctness.","es":"Dejaría que compra decidiera las existencias en la base de datos transaccional de referencia. El panel puede consultarla mientras los informes no entorpezcan las compras. Si compiten por recursos, crearía una vista separada desde pedidos confirmados, actualizada continuamente o a intervalos. Mostraría su objetivo de un minuto de desfase y mediría el retraso real. Conservaría los identificadores de pedido para que los reintentos no inflasen los totales y contrastaría la vista con los pedidos guardados, sin dar por correcto un resultado solo porque aparece rápido."},"related":["data-sql","data-nosql"],"sources":[{"label":"Choosing an AWS database service","url":"https://aws.amazon.com/products/databases/"},{"label":"DynamoDB partitions and data distribution","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.Partitions.html"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"},{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}],"level":"foundation","learning":{"definition":{"en":"Data storage preserves facts so an application can retrieve or change them later. Data processing applies rules to those facts to produce something useful, such as an accepted order or a daily sales total.","es":"El almacenamiento de datos conserva hechos para que una aplicación pueda consultarlos o modificarlos después. El procesamiento aplica reglas a esos hechos para obtener algo útil, como un pedido aceptado o un total de ventas diario."},"simple":{"en":"An application writes facts to an authoritative store, the place trusted when copies disagree. Relational databases organise linked records and support transactions, groups of changes that commit together or not at all. A key-value store, one NoSQL model, retrieves an item by its identifier; other NoSQL models suit different access patterns. Object storage keeps named files or blobs. Processing turns these facts into results, either in batches of accumulated input or continuously as events arrive.","es":"Una aplicación escribe los hechos en un almacén de referencia, que prevalece cuando las copias discrepan. Las bases relacionales organizan registros vinculados y permiten transacciones: cambios que se confirman juntos o se descartan. Un almacén clave-valor, un modelo NoSQL, recupera un elemento por su identificador; otros modelos NoSQL encajan con otras formas de acceso. El almacenamiento de objetos guarda archivos o bloques de contenido con nombre. El procesamiento obtiene resultados por lotes de entradas acumuladas o de forma continua conforme llegan eventos."},"analogy":{"en":"A restaurant keeps signed orders, a kitchen display and a daily sales sheet for different jobs. Data systems also separate records from working views, but their copies need explicit refresh rules rather than staff noticing discrepancies.","es":"Un restaurante usa comandas firmadas, una pantalla de cocina y una hoja de ventas para tareas distintas. Los sistemas también separan registros y vistas de trabajo, pero necesitan reglas de actualización, no personas que detecten discrepancias."},"walkthrough":{"en":["A bookshop saves order 417 and its line items in one database transaction. The cover image remains in object storage; the order holds its identifier rather than copying image bytes into every sale.","The catalogue reads a cache, a temporary copy that avoids repeated database work. Its ten-minute-old stock figure may be stale, so checkout checks the authoritative inventory record before accepting order 417.","After order 417 is committed, a purchase event updates a live sales counter through stream processing. A nightly batch recomputes totals from saved orders, allowing delayed or repeated events to be detected and corrected."],"es":["Una librería guarda el pedido 417 y sus líneas en una transacción de base de datos. La imagen de portada permanece en almacenamiento de objetos; el pedido conserva su identificador en vez de copiar sus bytes en cada venta.","El catálogo consulta una caché, una copia temporal que evita trabajo repetido en la base de datos. Sus existencias de hace diez minutos pueden estar desactualizadas, así que compra comprueba el inventario de referencia antes de aceptar el pedido 417.","Tras confirmar el pedido 417, un evento de compra actualiza un contador de ventas mediante procesamiento continuo de eventos. Un proceso nocturno por lotes recalcula los totales desde los pedidos guardados, permitiendo detectar y corregir el efecto de eventos tardíos o repetidos."]},"pitfalls":{"en":["A cache hit means a copy was found, not that it is current. Decide which decisions can tolerate stale data before using that copy.","NoSQL includes several models with different query and transaction capabilities. Check the actual engine against required access patterns and consistency, rather than choosing from data size alone."],"es":["Un acierto de caché indica que se encontró una copia, no que esté actualizada. Decide qué decisiones toleran datos antiguos antes de utilizarla.","NoSQL abarca modelos con distintas capacidades de consulta y transacción. Contrasta el motor concreto con los accesos y la consistencia necesarios, en lugar de elegir solo por volumen de datos."]},"sourceUrls":[{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"},{"url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","label":"docs.aws.amazon.com: Welcome"}]}},{"id":"data-sql","parent":"data","title":{"en":"Relational Databases (SQL)","es":"Bases de datos relacionales (SQL)"},"summary":{"en":"Express relationships with keys and constraints, and design transactions around conflicts that simultaneous buyers can create.","es":"Expresa las relaciones con claves y restricciones, y diseña las transacciones para los conflictos que pueden crear compradores simultáneos."},"details":{"en":["A timeout during commit can leave a client unsure whether its order was saved; looking up its unique request ID is safer than blindly inserting again. Database recovery also requires clients to reconnect. Aurora can automatically promote an existing reader, so spread readers across Availability Zones. Promotion commonly takes under 60 seconds and often under 30, but application recovery includes detection and reconnection and can take longer."],"es":["Una espera agotada durante la confirmación puede dejar al cliente sin saber si se guardó el pedido; consultar su identificador único de petición es más seguro que insertarlo otra vez a ciegas. Recuperar la base también exige que los clientes se reconecten. Aurora puede promover automáticamente un lector existente, por lo que conviene repartir lectores entre zonas de disponibilidad. La promoción suele tardar menos de 60 segundos y a menudo menos de 30, pero la recuperación de la aplicación incluye detección y reconexión y puede tardar más."]},"aws":{"en":"Host checkout on RDS for PostgreSQL with a Multi-AZ DB instance deployment. Its single standby occupies another Availability Zone, an isolated location within the Region, and supports failover but not application reads. PostgreSQL is the database engine; RDS operates it. Aurora is a separate AWS-built option compatible with PostgreSQL or MySQL.","es":"Aloja compra en RDS for PostgreSQL con un despliegue de instancia Multi-AZ. Su única réplica de reserva está en otra zona de disponibilidad, una ubicación aislada dentro de la región, y permite conmutación por error, pero no lecturas de la aplicación. PostgreSQL es el motor; RDS lo gestiona. Aurora es otra opción, creada por AWS y compatible con PostgreSQL o MySQL."},"question":{"en":"Will enabling Multi-AZ also speed up our reporting queries, or do we need something else?","es":"¿Activar Multi-AZ también acelerará nuestras consultas de informes o necesitamos algo más?"},"answer":{"en":"Check the deployment type before routing reports anywhere. An RDS Multi-AZ DB instance has one non-readable standby, so it adds no reporting capacity. An RDS Multi-AZ DB cluster has two readable standbys that also support failover. Separate RDS read replicas can offload reports, but replication is asynchronous: stale reads are possible, and manual promotion can omit recent writes. Aurora instead uses its readers as automatic failover candidates. Keep reads that must see a just-committed order on the writer; let reports use copies only when their freshness requirements allow it.","es":"Comprueba el tipo de despliegue antes de desviar los informes. Una instancia RDS Multi-AZ tiene una réplica de reserva sin lecturas; un clúster RDS Multi-AZ tiene dos que admiten lecturas y conmutación por error. Las réplicas de lectura independientes de RDS descargan consultas, pero se actualizan asíncronamente: pueden mostrar datos antiguos y perder escrituras recientes al promoverlas manualmente. Aurora utiliza sus lectores para la promoción automática. Las consultas que deben ver un pedido recién confirmado deben ir al escritor; envía informes a copias solo si toleran su desfase."},"related":["data-consistency","disaster-recovery","reliability"],"sources":[{"label":"Amazon RDS Multi-AZ deployments","url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html"},{"label":"High availability for Amazon Aurora","url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html"},{"label":"Amazon Aurora Global Database","url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html"},{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html","label":"docs.aws.amazon.com: Concepts.MultiAZSingleStandby"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html","label":"docs.aws.amazon.com: Aurora.Replication"}],"level":"applied","learning":{"definition":{"en":"A relational database keeps structured records in tables whose links are expressed through keys. It helps applications query connected facts and enforce declared rules while several users change those facts.","es":"Una base de datos relacional conserva registros estructurados en tablas cuyos vínculos se expresan mediante claves. Permite consultar hechos relacionados y aplicar reglas declaradas mientras varios usuarios modifican esos datos."},"simple":{"en":"A shop stores customers and orders in separate tables. A primary key identifies each customer; a foreign key on an order references a valid customer. A schema specifies columns and types, while constraints reject values that break declared rules. SQL, the language for requesting or changing records, can join tables to show who placed each order. A transaction commits related changes together or discards them all. Concurrent transactions also need suitable isolation, which controls how their work can interact.","es":"Una tienda guarda clientes y pedidos en tablas separadas. Una clave primaria identifica a cada cliente; una clave ajena del pedido apunta a un cliente válido. El esquema establece columnas y tipos; las restricciones rechazan valores que incumplen reglas declaradas. SQL, el lenguaje para consultar o modificar registros, permite unir tablas y ver quién hizo cada pedido. Una transacción confirma cambios relacionados juntos o los descarta todos. Las transacciones simultáneas también necesitan un aislamiento adecuado, que controla cómo pueden interactuar."},"analogy":{"en":"Imagine a filing office where each customer has a unique number and orders refer to that number. A relational database checks those links automatically; the analogy does not explain how simultaneous edits are coordinated.","es":"Imagina un archivo donde cada cliente tiene un número único y los pedidos remiten a él. Una base relacional comprueba esos vínculos automáticamente; la comparación no explica cómo se coordinan las modificaciones simultáneas."},"walkthrough":{"en":["A bookshop uses PostgreSQL with Read Committed isolation and has one copy left. Alicia and Bruno both try to buy it. Each checkout starts a transaction and decreases stock only if it is still above zero, instead of trusting an earlier screen value.","Alice's update takes effect first. Her checkout inserts the order in that transaction and commits both changes. Bob's competing update waits, then changes no row because stock is zero; checkout records no completed sale for him.","An order-history query joins Alice's order to her customer record using the customer key. Bob sees sold out. An index, a maintained lookup structure, can speed up finding Alice's orders without changing which orders are stored."],"es":["Una librería usa PostgreSQL con aislamiento Read Committed y tiene un ejemplar. Alicia y Bruno intentan comprarlo. Cada proceso inicia una transacción y descuenta existencias solo si siguen por encima de cero, sin fiarse de lo que mostraba antes la pantalla.","La actualización de Alicia se ejecuta primero. Su proceso inserta el pedido en esa transacción y confirma ambos cambios. La actualización de Bruno espera y después no modifica ninguna fila porque quedan cero existencias; no se registra una venta completada para él.","Una consulta del historial une el pedido de Alicia con su ficha mediante la clave de cliente. Bruno ve agotado. Un índice, una estructura de búsqueda que se mantiene actualizada, puede agilizar la consulta de pedidos de Alicia sin cambiar qué pedidos se almacenan."]},"pitfalls":{"en":["An all-or-nothing transaction does not make every concurrent workflow safe. Check the conditional update: changing no row cannot count as a successful reservation.","Indexes consume storage and add work to relevant writes. Choose them for real queries, and inspect execution plans, which describe how the engine runs a query."],"es":["Una transacción de todo o nada no hace seguro cualquier proceso concurrente. Comprueba la actualización condicional: si no modifica ninguna fila, no equivale a una reserva realizada.","Los índices ocupan espacio y añaden trabajo a las escrituras afectadas. Elígelos para consultas reales y revisa los planes de ejecución, donde el motor describe cómo resuelve una consulta."]},"sourceUrls":[{"url":"https://www.postgresql.org/docs/current/transaction-iso.html","label":"postgresql.org: transaction iso"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html","label":"docs.aws.amazon.com: Concepts.MultiAZSingleStandby"},{"url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html","label":"docs.aws.amazon.com: Aurora.Replication"}]}},{"id":"data-nosql","parent":"data","title":{"en":"NoSQL Databases","es":"Bases de datos NoSQL"},"summary":{"en":"NoSQL matches data organisation to a known workload, with capabilities that depend on the engine.","es":"NoSQL adapta la organización de los datos a una carga de trabajo conocida, con funciones que dependen del motor."},"details":{"en":["A successful database write does not prove that the rider saw the reply. If a timeout causes the app to retry the rental request, the service needs a stable request identifier so it can recognise an already processed operation. This is separate from the data model: choosing documents or key-value records does not by itself prevent a retry from creating a second rental."],"es":["Que la base de datos haya guardado el alquiler no demuestra que el ciclista haya recibido la respuesta. Si se agota el tiempo de espera y la aplicación repite la petición, el servicio necesita un identificador estable de solicitud para reconocer una operación ya procesada. Esta necesidad es independiente del modelo de datos: elegir documentos o registros clave-valor no evita por sí solo que un reintento cree un segundo alquiler."]},"aws":{"en":"For the bike hire app, Amazon DynamoDB can hold rental records by rental ID and expose a global secondary index on station ID for the operations screen. That screen must allow for index updates to arrive after the original write.","es":"En la aplicación de bicicletas, Amazon DynamoDB puede guardar los alquileres por su identificador y ofrecer un índice secundario global sobre el identificador de estación para la pantalla de operaciones. Esa pantalla debe admitir que el índice se actualice después de la escritura original."},"question":{"en":"A bike hire team's relational database is slow, and someone proposes moving every table to NoSQL. What would you investigate before approving the move?","es":"La base de datos relacional de un servicio de bicicletas va lenta y alguien propone trasladar todas las tablas a NoSQL. ¿Qué investigarías antes de aprobarlo?"},"answer":{"en":"I would start with the slow rental screen: what identifier it supplies, which fields it needs and where the time goes. An absent index may explain the delay without any database change. If loading one rental still requires costly assembly at the expected traffic, a document-shaped record could be worth testing. I would also test station reporting and simultaneous rental updates, because improving the main screen is not enough if another required operation becomes awkward or loses needed transaction behaviour.","es":"Empezaría por la pantalla lenta: qué identificador envía, qué campos necesita y dónde se consume el tiempo. La falta de un índice podría explicar el retraso sin cambiar de base de datos. Si reunir los datos de un alquiler sigue siendo costoso con el tráfico previsto, probaría un registro en forma de documento. También comprobaría los informes por estación y las actualizaciones simultáneas: mejorar la pantalla principal no basta si otra operación necesaria se complica o pierde el comportamiento transaccional que requiere."},"related":["data-consistency","data-caching"],"sources":[{"label":"AWS: What is NoSQL?","url":"https://aws.amazon.com/nosql/"},{"label":"What is Amazon DynamoDB?","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html"},{"url":"https://www.mongodb.com/docs/manual/core/schema-validation/","label":"mongodb.com: schema validation"}],"level":"foundation","learning":{"definition":{"en":"NoSQL names a group of databases that organise information around structures other than related tables. The aim is to match how an application uses data, whether it retrieves one value, opens a complete record or follows connections. Many implementations can also spread storage and work across machines as demand grows.","es":"NoSQL engloba bases de datos que organizan la información mediante estructuras distintas de las tablas relacionadas. Su propósito es adaptarse al uso que hace la aplicación de los datos, ya sea recuperar un valor, abrir un registro completo o recorrer conexiones. Muchas implementaciones también permiten repartir el almacenamiento y el trabajo entre máquinas cuando aumenta la demanda."},"simple":{"en":"An application sends reads and writes to a database engine, the software that stores and retrieves information. The model determines what the engine can locate directly: key-value finds a value by its label; document exposes fields in a nested record; wide-column groups rows under a shared key; graph represents connections. When a request fits that organisation, the engine can avoid assembling or inspecting data unrelated to the request.","es":"La aplicación envía lecturas y escrituras al motor de base de datos, el programa que guarda y recupera información. El modelo determina qué puede localizar directamente: clave-valor busca mediante una etiqueta; documento permite consultar campos de un registro anidado; columna ancha agrupa filas bajo una clave común; grafo representa conexiones. Cuando una petición encaja con esa organización, el motor puede evitar reunir o examinar datos ajenos a ella."},"analogy":{"en":"Choosing a NoSQL model resembles arranging a workshop: frequently used tools go where the job needs them. The limit is that databases also need explicit rules for concurrent changes and failures.","es":"Elegir un modelo NoSQL se parece a organizar un taller: las herramientas habituales se colocan donde exige el trabajo. La comparaci
