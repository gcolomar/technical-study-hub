 silencioso sea explicable."]},"pitfalls":{"en":["Blocking the whole protocol breaks path size discovery and IPv6 neighbour functions, producing intermittent failures that look like application bugs.","No reply is not evidence of a down host. These messages can be filtered, rate limited or simply not generated."],"es":["Bloquear todo el protocolo rompe el descubrimiento de tamaño del camino y las funciones de vecindad de IPv6, produciendo fallos intermitentes que parecen errores de aplicación.","La falta de respuesta no es prueba de un host caído. Estos mensajes se pueden filtrar, limitar en tasa o simplemente no generar."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc792","label":"rfc-editor.org: rfc792"},{"url":"https://www.rfc-editor.org/rfc/rfc8201","label":"rfc-editor.org: rfc8201"}]}},{"id":"tcp","parent":"osi-4","title":{"en":"TCP: reliability and connections","es":"TCP: fiabilidad y conexiones"},"summary":{"en":"An ordered, reliable byte stream that manages transmission rate and congestion.","es":"Un flujo de bytes ordenado y fiable que gestiona el ritmo de envío y la congestión."},"details":{"en":["TCP connects using SYN, SYN-ACK and ACK. Sequence numbers, acknowledgments and retransmissions support reliable ordered delivery. Flow control protects the receiver; congestion control responds to the network. TCP preserves bytes, not application message boundaries. A timeout can leave the caller unsure whether the server acted."],"es":["TCP conecta mediante SYN, SYN-ACK y ACK. Secuencias, confirmaciones y retransmisiones permiten entrega fiable y ordenada. El control de flujo protege al receptor; el de congestión responde a la red. TCP preserva bytes, no límites de mensajes. Un timeout puede dejar incierto si el servidor actuó."]},"aws":{"en":"Reuse connections to avoid repeated handshakes. Watch listener ports, connection limits and load-balancer idle timeouts.","es":"Reutiliza conexiones para evitar handshakes. Vigila puertos, límites y timeouts de inactividad del balanceador."},"question":{"en":"How does connection refused differ from a timeout?","es":"¿Cómo se diferencia conexión rechazada de timeout?"},"answer":{"en":"Refused often means an active reset or rejection. Timeout means no timely response and has several possible causes. Inspect the handshake instead of assuming both are firewall errors.","es":"Rechazada suele indicar reset o rechazo activo. Timeout indica falta de respuesta oportuna y tiene varias causas. Inspecciona el handshake sin asumir que ambos son firewall."},"related":["udp","tls","load-balancing","sessions"],"sources":[{"label":"TCP: RFC 9293","url":"https://www.rfc-editor.org/rfc/rfc9293"}],"level":"foundation","learning":{"definition":{"en":"The Transmission Control Protocol gives two programs a connection that behaves like a continuous stream of bytes delivered in order. It numbers the bytes it sends, expects acknowledgements, and retransmits anything that is not acknowledged in time. Flow control lets the receiver advertise how much it can accept, and congestion control slows the sender when the network shows signs of saturation. It preserves the order of bytes, not the boundaries of application messages.","es":"El Protocolo de Control de Transmisión da a dos programas una conexión que se comporta como un flujo continuo de bytes entregado en orden. Numera los bytes que envia, espera confirmaciones y retransmite lo que no se confirma a tiempo. El control de flujo permite al receptor anunciar cuánto puede aceptar, y el control de congestión frena al emisor cuando la red muestra señales de saturación. Preserva el orden de los bytes, no los límites de los mensajes de aplicación."},"simple":{"en":"It turns an unreliable network into an ordered stream of bytes, at the cost of a setup exchange and of waiting for lost pieces to be resent.","es":"Convierte una red no fiable en un flujo ordenado de bytes, a cambio de un intercambio inicial y de esperar a que se reenvíen las piezas pérdidas."},"analogy":{"en":"It is like a numbered conveyor belt where the receiver confirms each crate and missing crates are sent again. The limitation is that the belt guarantees arrival of crates, not that the warehouse acted on them. If the confirmation for the last crate is lost, the sender does not know whether the work happened, which is why business actions need their own safeguard.","es":"Es como una cinta transportadora numerada donde el receptor confirma cada caja y las cajas que faltan se reenvían. La limitación es que la cinta garantiza la llegada de las cajas, no que el almacén actuara sobre ellas. Si se pierde la confirmación de la última caja, el emisor no sabe si el trabajo ocurrió, y por eso las acciones de negocio necesitan su propia salvaguarda."},"walkthrough":{"en":["Start with connection setup. The client sends a synchronise segment, the server answers with synchronise and acknowledge, and the client acknowledges. Both sides exchange initial sequence numbers and options here. In the ordinary case this costs one round trip before data flows, although an extension allows data in the first flight, which is why reusing connections matters on a long path.","Follow reliability in steady state. Each segment carries a sequence number, the receiver acknowledges what it has received contiguously, and the sender keeps unacknowledged data buffered so it can retransmit. Loss is inferred from duplicate acknowledgements or from a timer, and the retransmission timer is derived from measured round trip times.","Remember that the stream has no message boundaries. Two writes by the sender can arrive as one read, or one write can arrive as several. Every protocol above it must define its own framing, by a length prefix, a delimiter or headers, and a parser that assumes one read equals one message will fail under load.","Read connection errors precisely. A refusal usually means something actively answered and rejected, such as a closed port or a reset. A timeout means no answer arrived in time, which can be a filtering rule, a missing return route, or an overloaded target. They point at different causes and should not be grouped together as firewall problems."],"es":["Empieza por el establecimiento de la conexión. El cliente envía un segmento de sincronización, el servidor responde con sincronización y confirmación, y el cliente confirma. Ambos lados intercambian aquí números de secuencia iniciales y opciones. En el caso ordinario esto cuesta una ida y vuelta antes de que fluyan datos, aunque una extensión permite datos en el primer envío, y por eso reutilizar conexiones importa en un camino largo.","Sigue la fiabilidad en régimen estable. Cada segmento lleva un número de secuencia, el receptor confirma lo que ha recibido de forma contigua y el emisor mantiene en memoria los datos sin confirmar para poder retransmitir. La pérdida se deduce de confirmaciones duplicadas o de un temporizador, y ese temporizador se calcula con los tiempos de ida y vuelta medidos.","Recuerda que el flujo no tiene límites de mensaje. Dos escrituras del emisor pueden llegar como una lectura, o una escritura puede llegar en varias. Todo protocolo superior debe definir su propio encuadre, con un prefijo de longitud, un delimitador o cabeceras, y un analizador que asuma que una lectura equivale a un mensaje fallará con carga.","Lee con precisión los errores de conexión. Un rechazo suele significar que algo respondió activamente y denegó, como un puerto cerrado o un reinicio. Un tiempo de espera agotado significa que no llego respuesta a tiempo, que puede ser una regla de filtrado, una ruta de vuelta ausente o un destino sobrecargado. Apuntan a causas distintas y no deberían agruparse como problemas de firewall."]},"pitfalls":{"en":["Reliable bytes are not an executed business action. After a lost response a retry can repeat a payment or an order, so use an idempotency key at the application level.","An idle connection can be closed by a middlebox or a load balancer without either endpoint noticing until the next write. Configure keep alive and timeouts consistently across the path."],"es":["Bytes fiables no son una acción de negocio ejecutada. Tras perder una respuesta, un reintento puede repetir un pago o un pedido, así que usa una clave de idempotencia en la aplicación.","Una conexión ociosa puede cerrarla un equipo intermedio o un balanceador sin que ningún extremo lo note hasta la siguiente escritura. Configura el mantenimiento y los tiempos de espera de forma coherente en todo el camino."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"}]},"diagrams":[{"id":"tcp-handshake","kind":"sequence","nodes":["tcp"],"title":{"en":"The ordinary three-way handshake, then data","es":"El saludo de tres pasos habitual y luego los datos"},"caption":{"en":"This is the ordinary case. One round trip is spent before the exchange is established, which is why connection reuse matters. Extensions such as TCP Fast Open, and TLS session resumption above it, exist to shorten that cost.","es":"Este es el caso habitual. Se gasta un viaje de ida y vuelta antes de establecer el intercambio, y por eso importa reutilizar conexiones. Extensiones como TCP Fast Open, y la reanudación de sesión TLS por encima, existen para acortar ese coste."},"alt":{"en":"A sequence of four steps between a client and a server. The client sends SYN with its initial sequence number. The server replies SYN plus ACK. The client sends ACK, which may already carry the first application bytes. The server returns data, acknowledged as it arrives. Notes explain that a dropped SYN looks like a hang while a reachable host with no listener normally answers RST, and that either side closes with FIN or aborts with RST.","es":"Una secuencia de cuatro pasos entre un cliente y un servidor. El cliente envía SYN con su número de secuencia inicial. El servidor responde SYN más ACK. El cliente envía ACK, que ya puede llevar los primeros bytes de aplicación. El servidor devuelve datos, confirmados a medida que llegan. Las notas explican que un SYN descartado parece un cuelgue mientras que un host alcanzable sin proceso a la escucha responde normalmente RST, y que cualquiera de los dos extremos cierra con FIN o aborta con RST."},"actors":[{"id":"client","label":{"en":"Client","es":"Cliente"}},{"id":"server","label":{"en":"Server","es":"Servidor"}}],"steps":[{"from":"client","to":"server","label":{"en":"SYN, my sequence number starts here","es":"SYN, mi número de secuencia empieza aquí"},"note":{"en":"If a security group or a missing route drops this packet, the client waits and retries. Nothing is refused, so it looks like a hang.","es":"Si una security group o una ruta ausente descarta este paquete, el cliente espera y reintenta. Nadie rechaza nada, así que parece un cuelgue."}},{"from":"server","to":"client","label":{"en":"SYN plus ACK, and my sequence number starts here","es":"SYN más ACK, y mi número de secuencia empieza aquí"},"note":{"en":"Something must be listening on that port. A reachable host with no listener normally answers RST, which the client reports as connection refused.","es":"Algo debe estar escuchando en ese puerto. Un host alcanzable sin proceso a la escucha responde normalmente RST, y el cliente lo reporta como conexión rechazada."}},{"from":"client","to":"server","label":{"en":"ACK, the exchange is established, and this packet may already carry the first application bytes","es":"ACK, el intercambio queda establecido, y este paquete ya puede llevar los primeros bytes de aplicación"},"note":{"en":"One round trip has been spent. With TLS on top there is still a handshake before the request, and its cost depends on the TLS version and on whether the session is resumed, with no application data sent early unless 0-RTT applies.","es":"Se ha gastado un viaje de ida y vuelta. Con TLS encima sigue habiendo un saludo antes de la petición, y su coste depende de la versión de TLS y de si se reanuda la sesión, sin enviar datos de aplicación por adelantado salvo que se aplique 0-RTT."}},{"from":"server","to":"client","label":{"en":"Response data, acknowledged as it arrives","es":"Datos de respuesta, confirmados a medida que llegan"},"note":{"en":"Either side closes with FIN, or aborts with RST. Idle timeouts on a load balancer or a NAT gateway can cut the connection first.","es":"Cualquiera de los dos extremos cierra con FIN o aborta con RST. Los tiempos de inactividad de un balanceador o de un NAT gateway pueden cortar antes la conexión."}}]}]},{"id":"udp","parent":"osi-4","title":{"en":"UDP and datagrams","es":"UDP y datagramas"},"summary":{"en":"Send independent messages without built-in delivery or ordering guarantees.","es":"Envía mensajes independientes sin garantías incorporadas de entrega ni orden."},"details":{"en":["UDP preserves datagram boundaries but does not guarantee delivery, ordering or duplicate suppression. Applications decide whether to tolerate loss or add recovery. DNS commonly uses UDP but also TCP. Saying UDP is always faster ignores loss and application requirements."],"es":["UDP preserva límites de datagramas, pero no garantiza entrega, orden ni eliminación de duplicados. La aplicación decide si tolera pérdidas o añade recuperación. DNS suele usar UDP, pero también TCP. Decir que UDP siempre es más rápido ignora pérdidas y requisitos."]},"aws":{"en":"An appropriate NLB listener can balance UDP; ALB does not provide arbitrary UDP balancing.","es":"Un listener NLB apropiado puede balancear UDP; ALB no ofrece balanceo UDP arbitrario."},"question":{"en":"Why might voice traffic prefer losing an old packet to retransmitting it?","es":"¿Por qué voz puede preferir perder un paquete antiguo a retransmitirlo?"},"answer":{"en":"A late sample may no longer be useful for live playback. Limited loss can be preferable to extra delay; control messages may still need reliability.","es":"Una muestra tardía puede no servir para reproducción en directo. Una pérdida limitada puede ser preferible al retraso; los mensajes de control pueden necesitar fiabilidad."},"related":["tcp","quic","dns"],"sources":[{"label":"UDP: RFC 768","url":"https://www.rfc-editor.org/rfc/rfc768"},{"url":"https://www.rfc-editor.org/rfc/rfc1035","label":"rfc-editor.org: rfc1035"}],"level":"foundation","learning":{"definition":{"en":"The User Datagram Protocol sends independent messages with the minimum of machinery. Its header holds only source port, destination port, length and a checksum. Each datagram is delivered as a unit with its boundaries intact, but there is no connection setup, no acknowledgement, no ordering, no retransmission and no protection against duplicates. Anything the application needs beyond that must be built by the application itself.","es":"El Protocolo de Datagramas de Usuario envia mensajes independientes con la mínima maquinaria. Su cabecera solo lleva puerto de origen, puerto de destino, longitud y una suma de verificación. Cada datagrama se entrega como una unidad con sus límites intactos, pero no hay establecimiento de conexión, ni confirmación, ni orden, ni retransmisión, ni protección contra duplicados. Todo lo que necesite la aplicación más allá de eso lo debe construir ella misma."},"simple":{"en":"Send a message and hope. Nothing is tracked, so protocol overhead and state are very low, which suits cases where losing a message is acceptable or the application handles loss itself.","es":"Envía un mensaje y confía. Nada se controla, así que la sobrecarga de protocolo y el estado son muy bajos, lo que encaja cuando perder un mensaje es aceptable o la aplicación gestiona la pérdida."},"analogy":{"en":"It is like dropping postcards in a box: each is complete on its own and no one confirms arrival. The limitation is that postcards at least stay whole and eventually arrive, while here a datagram can be dropped by any congested device, can arrive after a later one, or can arrive twice. The application has to be written to expect all three.","es":"Es como echar postales en un buzon: cada una es completa por sí misma y nadie confirma la llegada. La limitación es que las postales al menos siguen enteras y acaban llegando, mientras aqui un datagrama puede descartarlo cualquier equipo congestionado, puede llegar después de otro posterior o puede llegar dos veces. La aplicación debe escribirse esperando las tres cosas."},"walkthrough":{"en":["Read the header and notice what is absent. Four fields, no sequence numbers and no window. That is the whole contract, and it is why the protocol adds almost no delay and almost no state on either side, which matters for a server handling very large numbers of short exchanges.","Choose it when late data is worthless. Live voice and video prefer a small gap to a correct but late sample, so loss is usually concealed, and many such applications add forward error correction or limited retransmission inside their latency budget. Telemetry often accepts occasional loss, and name lookups fit one exchange.","Know that the application then owns reliability. If you need retries, add a request identifier so duplicates can be discarded, a timeout, a bounded number of attempts and a backoff. Without an identifier your retry becomes a second business action rather than a repeat of the first.","Design for size limits, not for streams. A very large datagram will be fragmented at the network layer and one lost fragment loses the whole message, so keep messages small. Name resolution shows the standard pattern: use the lightweight protocol first and fall back to a connection oriented one when the answer will not fit."],"es":["Lee la cabecera y fíjate en lo que falta. Cuatro campos, sin números de secuencia y sin ventana. Ese es todo el contrato, y por eso el protocolo añade casi nada de demora y casi nada de estado en ambos lados, lo que importa en un servidor que atiende cantidades enormes de intercambios cortos.","Escógelo cuando los datos tardíos no valen nada. La voz y el vídeo en directo prefieren un hueco pequeño a una muestra correcta pero tardía, así que la pérdida suele disimularse, y muchas de esas aplicaciones añaden corrección de errores o retransmisión limitada dentro de su presupuesto de latencia. La telemetría acepta pérdidas ocasionales y las consultas de nombres caben en un intercambio.","Ten en cuenta que entonces la fiabilidad es de la aplicación. Si necesitas reintentos, añade un identificador de petición para descartar duplicados, un tiempo de espera, un número limitado de intentos y una espera creciente. Sin identificador tu reintento se convierte en una segunda acción de negocio y no en una repetición de la primera.","Diseña pensando en límites de tamaño y no en flujos. Un datagrama muy grande se fragmentará en la capa de red y un fragmento perdido pierde el mensaje entero, así que mantenlos pequeños. La resolución de nombres muestra el patrón estándar: usar primero el protocolo ligero y recurrir a uno orientado a conexión cuando la respuesta no cabe."]},"pitfalls":{"en":["Faster on paper is not faster in practice. Once you add your own retries and duplicate handling you may have rebuilt a slower version of a reliable protocol.","Datagram flows are easy to filter asymmetrically. Because there is no connection to observe, a one way rule produces silent loss instead of an error."],"es":["Más rápido en papel no es más rápido en la práctica. Cuando añades tus propios reintentos y gestión de duplicados puedes haber reconstruido una versión más lenta de un protocolo fiable.","Los flujos de datagramas son fáciles de filtrar de forma asimétrica. Como no hay conexión que observar, una regla en un solo sentido produce pérdida silenciosa en vez de un error."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc768","label":"rfc-editor.org: rfc768"},{"url":"https://www.rfc-editor.org/rfc/rfc1035","label":"rfc-editor.org: rfc1035"}]}},{"id":"quic","parent":"osi-4","title":{"en":"QUIC and HTTP/3","es":"QUIC y HTTP/3"},"summary":{"en":"Encrypted transport over UDP, with independent reliable streams used by HTTP/3.","es":"Transporte cifrado sobre UDP, con flujos fiables independientes que utiliza HTTP/3."},"details":{"en":["QUIC provides transport functions over UDP, integrates TLS 1.3 and supports multiple streams. HTTP/3 maps HTTP onto QUIC. Loss in one stream need not block delivery in another as it can with TCP’s ordered byte stream. This does not eliminate congestion or application dependencies."],"es":["QUIC aporta transporte sobre UDP, integra TLS 1.3 y permite múltiples flujos. HTTP/3 lleva HTTP sobre QUIC. Una pérdida en un flujo no tiene por qué bloquear otro como ocurre con los bytes ordenados de TCP. No elimina congestión ni dependencias de aplicación."]},"aws":{"en":"CloudFront viewer protocols and origin protocols are separate choices. Verify support before assuming end-to-end QUIC.","es":"Los protocolos de cliente y origen CloudFront son decisiones separadas. Verifica soporte antes de asumir QUIC extremo a extremo."},"question":{"en":"Does HTTP/3 use TCP 443?","es":"¿HTTP/3 usa TCP 443?"},"answer":{"en":"QUIC normally uses UDP 443. TCP HTTPS may remain a fallback, so check firewall behavior for both.","es":"QUIC normalmente usa UDP 443. HTTPS TCP puede servir de alternativa; comprueba ambos en el firewall."},"related":["udp","tls","http"],"sources":[{"label":"QUIC: RFC 9000","url":"https://www.rfc-editor.org/rfc/rfc9000"},{"url":"https://www.rfc-editor.org/rfc/rfc9114","label":"rfc-editor.org: rfc9114"}],"level":"deep","learning":{"definition":{"en":"QUIC is a transport protocol that provides reliable, flow controlled streams and always encrypted communication, built on top of the User Datagram Protocol. It carries several independent streams inside one connection, establishes itself in fewer round trips by integrating the TLS 1.3 handshake, and identifies connections with an identifier so they can survive a change of network path. HTTP/3 is HTTP semantics carried over QUIC rather than over TCP.","es":"QUIC es un protocolo de transporte que ofrece flujos fiables y con control de flujo y comunicación siempre cifrada, construido sobre el Protocolo de Datagramas de Usuario. Lleva varios flujos independientes dentro de una conexión, se establece en menos idas y vueltas al integrar el saludo de TLS 1.3 e identifica las conexiones con un identificador para que sobrevivan a un cambio de camino de red. HTTP/3 es la semántica de HTTP transportada sobre QUIC en vez de sobre TCP."},"simple":{"en":"It rebuilds reliable, encrypted transport on top of datagrams, with many parallel streams in one connection so one lost packet does not stall everything.","es":"Reconstruye un transporte fiable y cifrado sobre datagramas, con muchos flujos paralelos en una conexión para que un paquete perdido no atasque todo."},"analogy":{"en":"Compared with a single conveyor belt, it is several belts running side by side under one contract, so a jam on one does not stop the others. The limitation is that the belts share one motor. They compete for the same bandwidth and the same congestion window, so parallel streams remove head of line blocking without creating extra capacity.","es":"Frente a una sola cinta transportadora, son varias cintas en paralelo bajo un mismo contrato, así que un atasco en una no detiene las demás. La limitación es que las cintas comparten un motor. Compiten por el mismo ancho de banda y la misma ventana de congestión, así que los flujos paralelos eliminan el bloqueo en cabeza sin crear capacidad extra."},"walkthrough":{"en":["See why it exists on top of datagrams. Deploying a brand new transport directly on IP is blocked in practice by existing network equipment, so QUIC runs inside datagrams and implements sequencing, loss recovery, flow control and congestion control itself, in user space where it can be updated with the application.","Follow the handshake saving. Encryption is not a layer added after connecting; the cryptographic handshake is part of connection establishment, so a first connection typically completes in one round trip and a resumed one can send data immediately. On a high latency path this is the most visible gain.","Understand stream independence precisely. Within one connection each stream is delivered in order, but a lost packet only delays the streams whose data it carried. With a single ordered byte stream, one loss delays everything behind it, which is the head of line blocking that hurt earlier multiplexed protocols.","Then place HTTP/3 on top. It keeps the same methods, headers and status codes as earlier versions, so application code and diagnostics remain recognisable, and only the transport below changes. Deployments usually offer HTTP/2 over TCP as well, because some networks block or degrade the datagram port."],"es":["Observa por qué existe sobre datagramas. Desplegar un transporte totalmente nuevo directamente sobre IP está bloqueado en la práctica por el equipamiento de red existente, así que QUIC corre dentro de datagramas e implementa el orden, la recuperación de pérdidas, el control de flujo y el de congestión por sí mismo, en espacio de usuario donde se actualiza con la aplicación.","Sigue el ahorro del saludo. El cifrado no es una capa añadida después de conectar; el saludo criptográfico forma parte del establecimiento de la conexión, así que una primera conexión suele completarse en una ida y vuelta y una reanudada puede enviar datos de inmediato. En un camino de alta latencia esa es la ganancia más visible.","Entiende con precisión la independencia de los flujos. Dentro de una conexión cada flujo se entrega en orden, pero un paquete perdido solo retrasa los flujos cuyos datos llevaba. Con un único flujo de bytes ordenado, una pérdida retrasa todo lo que va detras, que es el bloqueo en cabeza que perjudicaba a protocolos multiplexados anteriores.","Coloca después HTTP/3 encima. Mantiene los mismos métodos, cabeceras y códigos de estado que las versiones anteriores, así que el código de aplicación y el diagnóstico siguen siendo reconocibles, y solo cambia el transporte de debajo. Los despliegues suelen ofrecer también HTTP/2 sobre TCP, porque algunas redes bloquean o degradan el puerto de datagramas."]},"pitfalls":{"en":["HTTP/3 does not run over TCP. Any tooling, filtering rule or load balancer listener that assumes a TCP connection will simply not see this traffic.","Removing head of line blocking does not remove congestion. All streams share one congestion controller, so an overloaded path is still an overloaded path."],"es":["HTTP/3 no funciona sobre TCP. Cualquier herramienta, regla de filtrado o listener de balanceador que asuma una conexión TCP simplemente no verá este tráfico.","Eliminar el bloqueo en cabeza no elimina la congestión. Todos los flujos comparten un controlador de congestión, así que un camino sobrecargado sigue estando sobrecargado."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9000","label":"rfc-editor.org: rfc9000"},{"url":"https://www.rfc-editor.org/rfc/rfc9114","label":"rfc-editor.org: rfc9114"}]}},{"id":"mtu","parent":"osi-4","title":{"en":"MTU, MSS and throughput","es":"MTU, MSS y rendimiento"},"summary":{"en":"Understand packet-size limits and why they can break or slow a connection.","es":"Entiende los límites de tamaño de paquete y por qué pueden bloquear o ralentizar una conexión."},"details":{"en":["MTU is a link packet-size limit near layers 2 and 3, grouped here for its impact on transport. TCP MSS is segment payload excluding headers. Path MTU Discovery learns a usable size. Also consider bandwidth-delay product: 1 Gbit/s at 80 ms RTT needs about 10 MB in flight to fill the path."],"es":["MTU es un límite de tamaño de paquete del enlace, cerca de L2 y L3, agrupado aquí por su efecto en transporte. MSS es carga de segmento TCP sin cabeceras. Path MTU Discovery descubre un tamaño utilizable. Considera ancho de banda por latencia: 1 Gbit/s con RTT 80 ms necesita unos 10 MB en vuelo."]},"aws":{"en":"Jumbo frames on EC2 do not guarantee the same MTU across a VPN or Internet path.","es":"Tramas jumbo en EC2 no garantizan igual MTU por VPN o Internet."},"question":{"en":"Why can a high-bandwidth long-distance connection perform poorly?","es":"¿Por qué puede rendir poco una conexión rápida y de larga distancia?"},"answer":{"en":"Check RTT, TCP window, loss, MTU and endpoint limits. Bandwidth is just one upper bound.","es":"Comprueba RTT, ventana TCP, pérdidas, MTU y límites de extremos. El ancho de banda es solo un límite."},"related":["tcp","icmp","direct-connect"],"sources":[{"label":"TCP: RFC 9293","url":"https://www.rfc-editor.org/rfc/rfc9293"},{"label":"IPv6 Path MTU Discovery: RFC 8201","url":"https://www.rfc-editor.org/rfc/rfc8201"}],"level":"deep","learning":{"definition":{"en":"The maximum transmission unit is the largest packet a link will carry, and the path value is the smallest of those limits along the route. The maximum segment size is the payload limit a TCP receiver advertises for a segment, which the path limit can constrain further. Separately, the bandwidth delay product, capacity multiplied by round trip time, is the amount of data that must be in flight to fill the path; how much is actually permitted is the smaller of the receive window and the congestion window.","es":"La unidad máxima de transmisión es el paquete mayor que acepta un enlace, y el valor del camino es el menor de esos límites en la ruta. El tamaño máximo de segmento es el límite de carga útil que anuncia un receptor TCP para un segmento, y el límite del camino puede restringirlo más. Aparte, el producto ancho de banda por retardo, la capacidad multiplicada por el tiempo de ida y vuelta, es la cantidad de datos que debe estar en tránsito para llenar el camino; cuánto se permite de verdad es el menor de la ventana de recepción y la de congestión."},"simple":{"en":"Two limits decide throughput: how big each packet may be, and how much may be in flight before waiting for a confirmation.","es":"Dos límites deciden el rendimiento: cuán grande puede ser cada paquete y cuánto puede estar en tránsito antes de esperar una confirmación."},"analogy":{"en":"It is like a delivery route with a low bridge and a limit on how many trucks may be out at once: the bridge caps the load per truck and the fleet size caps the flow. The limitation is that a driver sees the bridge sign, while a sender only learns the limit from a returned error message. If that message is blocked, the sender keeps sending packets that quietly disappear.","es":"Es como una ruta de reparto con un puente bajo y un límite de cuántos camiones pueden circular a la vez: el puente limita la carga por camión y la flota limita el caudal. La limitación es que un conductor ve la señal, mientras un emisor solo conoce el límite por un mensaje de error devuelto. Si ese mensaje se bloquea, el emisor sigue enviando paquetes que desaparecen en silencio."},"walkthrough":{"en":["Locate the limit before changing settings. The path value is set by the smallest link, which is often a tunnel, because encapsulation adds its own headers to every packet and reduces the space left for your data. Encrypted tunnels and overlay networks are the usual reason a path allows less than a plain Ethernet link.","See how discovery is supposed to work. A sender emits a full sized packet, a device that cannot forward it replies with a message stating that the packet is too big and often the size it can accept, and the sender lowers its estimate. In IPv6 routers never fragment in transit, so this feedback is the only mechanism available.","Recognise the failure signature when that feedback is filtered. Small exchanges succeed, so name resolution and a handshake work, then the first large response hangs and eventually times out. A file upload that stops at a fixed point, or a page that loads except for one large asset, is the same symptom.","Compute the in flight requirement separately. A one gigabit per second path with an eighty millisecond round trip needs roughly ten megabytes in flight to stay busy. If the advertised receive window, the congestion window or the socket buffers are smaller, throughput is capped by waiting rather than by capacity, and adding bandwidth changes nothing."],"es":["Localiza el límite antes de cambiar ajustes. El valor del camino lo fija el enlace menor, que a menudo es un túnel, porque la encapsulación añade sus propias cabeceras a cada paquete y reduce el espacio para tus datos. Los túneles cifrados y las redes superpuestas son la razón habitual de que un camino permita menos que un enlace Ethernet simple.","Observa cómo debería funcionar el descubrimiento. Un emisor envía un paquete de tamaño completo, un equipo que no puede reenviarlo responde con un mensaje que dice que el paquete es demasiado grande y a menudo el tamaño que acepta, y el emisor reduce su estimación. En IPv6 los routers nunca fragmentan en tránsito, así que ese aviso es el único mecanismo disponible.","Reconoce la firma del fallo cuando ese aviso se filtra. Los intercambios pequeños funcionan, así que la resolución de nombres y el saludo van bien, y después la primera respuesta grande se cuelga y acaba en tiempo de espera agotado. Una subida que se detiene en un punto fijo, o una página que carga salvo un recurso grande, es el mismo síntoma.","Calcula aparte el requisito de datos en tránsito. Un camino de un gigabit por segundo con ochenta milisegundos de ida y vuelta necesita unos diez megabytes en tránsito para seguir ocupado. Si la ventana de recepción anunciada, la de congestión o los buffers del socket son menores, el rendimiento lo limita la espera y no la capacidad, y añadir ancho de banda no ayuda."]},"pitfalls":{"en":["Raising the frame size on one interface while the path still has a smaller limit makes things worse, not better. The limit belongs to the path.","A throughput problem caused by waiting for acknowledgements will not respond to a bandwidth upgrade. Measure the round trip time first."],"es":["Subir el tamaño de trama en una interfaz mientras el camino sigue teniendo un límite menor empeora las cosas, no las mejora. El límite pertenece al camino.","Un problema de rendimiento causado por esperar confirmaciones no responderá a una mejora de ancho de banda. Mide primero el tiempo de ida y vuelta."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc8201","label":"rfc-editor.org: rfc8201"},{"url":"https://www.rfc-editor.org/rfc/rfc9293","label":"rfc-editor.org: rfc9293"}]},"diagrams":[{"id":"encapsulation","kind":"nest","nodes":["ethernet","mtu"],"title":{"en":"How application data is wrapped for the wire","es":"Cómo se envuelve el dato de aplicación para el cable"},"caption":{"en":"Each layer adds a header around what it received, and the receiver removes them in the opposite order. Only the layers that really appear as headers on an Ethernet link are drawn: layers 5 and 6 normally do not.","es":"Cada capa añade una cabecera alrededor de lo que recibió, y el receptor las retira en orden inverso. Solo se dibujan las capas que aparecen de verdad como cabeceras en un enlace Ethernet: las capas 5 y 6 normalmente no lo hacen."},"alt":{"en":"Four nested boxes. The outermost is an Ethernet frame with MAC addresses and a frame check sequence, replaced at each router hop. Inside it is an IPv4 packet whose addresses usually stay the same end to end while TTL and header checksum change at each router. Inside that is a TCP segment: the MSS each side advertises bounds the payload it will receive, and what a sender actually places in a segment is also constrained by the path MTU. The innermost box is application data, which may need several segments.","es":"Cuatro cajas anidadas. La exterior es una trama Ethernet con direcciones MAC y secuencia de verificación, que se reemplaza en cada salto de router. Dentro hay un paquete IPv4 cuyas direcciones suelen mantenerse de extremo a extremo, mientras que el TTL y la suma de comprobación cambian en cada router. Dentro está un segmento TCP: el MSS que anuncia cada extremo acota la carga que recibirá, y lo que un emisor pone de verdad en un segmento lo limita además el MTU del camino. La caja interior es el dato de aplicación, que puede necesitar varios segmentos."},"layers":[{"tag":{"en":"Layer 2 frame","es":"Trama de capa 2"},"label":{"en":"Ethernet frame","es":"Trama Ethernet"},"header":{"en":"Destination MAC, source MAC, type, and a frame check sequence at the end","es":"MAC de destino, MAC de origen, tipo y una secuencia de verificación al final"},"note":{"en":"Valid for one link only. A router replaces it at each hop; a switch forwards it within the same link.","es":"Válida para un solo enlace. Un router la reemplaza en cada salto; un conmutador la reenvía dentro del mismo enlace."}},{"tag":{"en":"Layer 3 packet","es":"Paquete de capa 3"},"label":{"en":"IPv4 packet","es":"Paquete IPv4"},"header":{"en":"Source and destination IP addresses, TTL, protocol number, header checksum","es":"Direcciones IP de origen y destino, TTL, número de protocolo, suma de comprobación"},"note":{"en":"The addresses usually travel unchanged end to end, unless NAT rewrites them. TTL and the header checksum change at every router.","es":"Las direcciones suelen viajar sin cambios de extremo a extremo, salvo que un NAT las reescriba. El TTL y la suma de comprobación cambian en cada router."}},{"tag":{"en":"Layer 4 segment","es":"Segmento de capa 4"},"label":{"en":"TCP segment","es":"Segmento TCP"},"header":{"en":"Source and destination ports, sequence and acknowledgement numbers, flags","es":"Puertos de origen y destino, números de secuencia y confirmación, banderas"},"note":{"en":"The MSS each side advertises is the payload it is willing to receive; what a sender actually puts in a segment is also limited by the path MTU. Large data is split across many segments.","es":"El MSS que anuncia cada extremo es la carga que está dispuesto a recibir; lo que un emisor pone de verdad en un segmento lo limita además el MTU del camino. Un dato grande se reparte en muchos segmentos."}},{"tag":{"en":"Application data","es":"Dato de aplicación"},"label":{"en":"HTTP request or response body","es":"Petición HTTP o cuerpo de respuesta"},"header":{"en":"Method, path, headers, body","es":"Método, ruta, cabeceras, cuerpo"},"note":{"en":"One request is not one segment. A large body spans several, and a small one can share a segment with the data around it.","es":"Una petición no equivale a un segmento. Un cuerpo grande ocupa varios, y uno pequeño puede compartir segmento con los datos que lo rodean."}}]}]},{"id":"sessions","parent":"osi-5","title":{"en":"Sessions, reuse and state","es":"Sesiones, reutilización y estado"},"summary":{"en":"Distinguish a network connection from the application state that remembers a user.","es":"Distingue una conexión de red del estado con el que una aplicación recuerda al usuario."},"details":{"en":["A login session may outlive many TCP connections. HTTP keep-alive reuses connections, not authentication. Stateless services make instances replaceable, but required state must live somewhere. Sticky sessions improve locality but do not replace durable state or a failure-recovery design."],"es":["Una sesión de usuario puede sobrevivir a varias conexiones TCP. HTTP keep-alive reutiliza conexiones, no autenticación. Los servicios sin estado permiten sustituir instancias, pero el estado necesario debe residir en algún sitio. La afinidad mejora localidad, no sustituye persistencia ni recuperación."]},"aws":{"en":"DynamoDB or ElastiCache can hold external session state with explicit expiry, durability and access controls.","es":"DynamoDB o ElastiCache pueden guardar sesiones externas con caducidad, durabilidad y controles explícitos."},"question":{"en":"Do sticky sessions alone survive instance failure?","es":"¿La afinidad de sesión basta ante la caída de una instancia?"},"answer":{"en":"No. Local state may disappear. Decide what must survive, store it appropriately and test reassignment.","es":"No. Puede perderse el estado local. Decide qué debe sobrevivir, almacénalo correctamente y prueba reasignación."},"related":["tcp","http","data"],"sources":[{"label":"HTTP semantics: RFC 9110","url":"https://www.rfc-editor.org/rfc/rfc9110.html"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x","label":"developer.mozilla.org: Connection management in HTTP 1.x"}],"level":"applied","learning":{"definition":{"en":"A session is a conversation that spans more than one message and therefore needs state kept somewhere. Three different things share the name and have different lifetimes: a transport connection between two sockets, a negotiated security session that can be resumed, and an application session recording that a user is authenticated. Connection reuse is a performance technique, not a memory of who the caller is.","es":"Una sesión es una conversación que abarca más de un mensaje y por eso necesita estado guardado en algun sitio. Tres cosas distintas comparten el nombre y tienen duraciones distintas: una conexión de transporte entre dos sockets, una sesión de seguridad negociada que se puede reanudar y una sesión de aplicación que registra que un usuario está autenticado. Reutilizar conexiones es una técnica de rendimiento, no una memoria de quién es el llamante."},"simple":{"en":"Ask two questions of any session: what state does it hold, and where does that state live when the machine holding it disappears.","es":"Hazle dos preguntas a cualquier sesión: qué estado guarda y dónde vive ese estado cuando desaparece la máquina que lo tenía."},"analogy":{"en":"It is like a tab kept open at a counter: you are recognised and each order adds to the same tab. The limitation is that a physical tab sits with one member of staff, while your requests can be served by any instance. A tab held in one instance memory is lost when that instance is replaced during a deployment.","es":"Es como una cuenta abierta en un mostrador: te reconocen y cada pedido se suma a la misma cuenta. La limitación es que una cuenta física está con una persona concreta, mientras tus peticiones puede atenderlas cualquier instancia. Una cuenta guardada en la memoria de una instancia se pierde cuando esa instancia se sustituye en un despliegue."},"walkthrough":{"en":["Separate the lifetimes first. One logged in user may use dozens of connections in an hour, and a reused connection may serve requests from before and after a logout. Write down which object owns each fact: identity, permissions, cart contents and the socket itself.","Choose where required state lives, with the trade off stated. Process memory is fastest and does not survive replacement. A shared cache or database survives but adds a network call to every request. A signed token held by the client removes the lookup and moves the problem to expiry and revocation.","Design expiry and revocation before launch. Decide the idle timeout, the absolute lifetime, what happens when a password changes or a role is removed, and how a stolen token is invalidated early. A token that cannot be revoked is a decision, so make it consciously.","Then read stickiness for what it is. A load balancer can return a client to the same target using a cookie or a hash, which helps local caches and hides in memory state. It unbalances load and does not survive the loss of that target, so treat it as an optimisation rather than the state design."],"es":["Separa primero las duraciones. Un usuario autenticado puede usar docenas de conexiones en una hora, y una conexión reutilizada puede servir peticiones de antes y después de cerrar sesión. Anota qué objeto es dueño de cada hecho: identidad, permisos, contenido del carrito y el propio socket.","Elige dónde vive el estado necesario, enunciando el compromiso. La memoria del proceso es lo más rápido y no sobrevive a una sustitucion. Una caché compartida o una base de datos sobrevive pero añade una llamada de red a cada petición. Un token firmado en poder del cliente elimina la consulta y traslada el problema a la caducidad y la revocación.","Diseña la caducidad y la revocación antes de lanzar. Decide el tiempo de inactividad, la duración absoluta, qué ocurre al cambiar una contraseña o retirar un rol y cómo se invalida pronto un token robado. Un token que no se puede revocar es una decisión, así que tomala a conciencia.","Interpreta después la afinidad por lo que es. Un balanceador puede devolver a un cliente al mismo destino con una cookie o un cálculo, lo que ayuda a las cachés locales y esconde el estado en memoria. Desequilibra la carga y no sobrevive a la pérdida de ese destino, así que tratala como optimización y no como el diseño del estado."]},"pitfalls":{"en":["Session and connection are not synonyms. Conflating them produces logins that vanish on deployment and code that assumes a reused connection is already authorised.","Sticky routing is not durable state. When the target is replaced, anything held only in its memory is gone."],"es":["Sesión y conexión no son sinónimos. Confundirlas produce inicios de sesión que desaparecen al desplegar y código que asume que una conexión reutilizada ya está autorizada.","El enrutamiento con afinidad no es estado duradero. Cuando se sustituye el destino, lo que solo estaba en su memoria desaparece."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9110.html","label":"rfc-editor.org: rfc9110"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Connection_management_in_HTTP_1.x","label":"developer.mozilla.org: Connection management in HTTP 1.x"}]}},{"id":"serialization","parent":"osi-6","title":{"en":"Encoding and serialization","es":"Codificación y serialización"},"summary":{"en":"Turn structured data into bytes that another system can interpret correctly.","es":"Convierte datos estructurados en bytes que otro sistema pueda interpretar correctamente."},"details":{"en":["UTF-8 encodes characters; JSON serializes structured values; Base64 represents binary as text and is not encryption. Producers and consumers must agree on types, units and schema evolution. A timestamp changing from seconds to milliseconds can break a valid-looking payload. Compression saves bandwidth but uses CPU."],"es":["UTF-8 codifica caracteres; JSON serializa valores; Base64 representa binarios como texto y no cifra. Productores y consumidores deben acordar tipos, unidades y evolución de esquema. Cambiar segundos por milisegundos puede romper un payload aparentemente válido. Comprimir ahorra ancho de banda pero usa CPU."]},"aws":{"en":"API Gateway and Lambda integrations still require explicit contracts and business validation.","es":"Las integraciones API Gateway y Lambda requieren contratos y validaciones de negocio."},"question":{"en":"Can an HTTP 200 response still corrupt downstream data?","es":"¿Una respuesta HTTP 200 puede corromper datos posteriores?"},"answer":{"en":"Yes. Successful transport does not validate meaning. Validate schema, units and invariants; evolve contracts compatibly.","es":"Sí. El transporte exitoso no valida significado. Comprueba esquema, unidades e invariantes y evoluciona contratos con compatibilidad."},"related":["http","data","tls"],"sources":[{"label":"JSON: RFC 8259","url":"https://www.rfc-editor.org/rfc/rfc8259"},{"url":"https://www.rfc-editor.org/rfc/rfc3629","label":"rfc-editor.org: rfc3629"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Base64","label":"developer.mozilla.org: Base64"}],"level":"foundation","learning":{"definition":{"en":"Serialisation is turning values in memory into bytes another program can read back, and encoding is the agreement about how characters or binary data are represented in those bytes. UTF-8 is the usual character encoding because it covers the universal character set while leaving plain ASCII unchanged. JSON is a small, text based, language independent format for structured values. A schema is the written agreement about fields, types and units.","es":"Serializar es convertir valores en memoria en bytes que otro programa pueda leer, y codificar es el acuerdo sobre cómo se representan los caracteres o los datos binarios en esos bytes. UTF-8 es la codificación habitual porque cubre el conjunto universal de caracteres dejando intacto el ASCII simple. JSON es un formato pequeño, textual e independiente del lenguaje para valores estructurados. Un esquema es el acuerdo escrito sobre campos, tipos y unidades."},"simple":{"en":"Producer and consumer must agree on the bytes, the shape and the meaning. Disagreements about meaning are harder to spot than syntax errors, because the payload still parses.","es":"Productor y consumidor deben acordar los bytes, la forma y el significado. Los desacuerdos sobre el significado son más difíciles de ver que los errores de sintaxis, porque la carga sigue analizándose bien."},"analogy":{"en":"It is like a standard form with labelled boxes: anyone who knows the form can read the answers. The limitation is that a form is read by a person who notices when a date looks wrong, while a parser does not. A field that quietly changes from seconds to milliseconds still parses perfectly and produces confident, wrong numbers.","es":"Es como un formulario estándar con casillas etiquetadas: cualquiera que conozca el formulario puede leer las respuestas. La limitación es que un formulario lo lee una persona que nota cuando una fecha parece rara, y un analizador no. Un campo que pasa en silencio de segundos a milisegundos se analiza perfectamente y produce números erróneos y seguros."},"walkthrough":{"en":["Fix the character encoding explicitly at every boundary: the content type, the database column and the file. A mismatch shows up as corrupted names and symbols rather than as an exception, which is immediately visible in data holding Arabic text or accented Spanish names.","Pick the structural format for the situation. A text format is readable and easy to log, usually worth more than saved bytes on an internal interface. A compact binary format with a declared schema earns its place when volume is high or strict typing across languages matters more than readability.","Keep three transformations distinct. Encoding for transport, such as writing binary as text, makes the payload about a third larger. Compression trades processor time for size. Encryption needs a key and is the only one of the three that protects anything.","Version the agreement, not just the code. Add fields rather than repurposing them, keep consumers tolerant of unknown fields, never change the meaning or unit of an existing field, and state units in the name. Then test with stored example payloads and, in a financial pipeline, compare totals after every change."],"es":["Fija la codificación de caracteres de forma explícita en cada frontera: el tipo de contenido, la columna de la base de datos y el fichero. Una discrepancia aparece como nombres y símbolos corruptos y no como una excepción, lo cual se ve al instante en datos con texto árabe o nombres españoles acentuados.","Elige el formato estructural según la situación. Un formato textual es legible y fácil de registrar, y suele valer más que los bytes ahorrados en una interfaz interna. Un formato binario compacto con esquema declarado se gana su sitio cuando el volumen es alto o el tipado estricto entre lenguajes importa más que la legibilidad.","Mantén distintas tres transformaciones. Codificar para transporte, por ejemplo escribir binario como texto, aumenta la carga alrededor de un tercio. Comprimir cambia tiempo de procesador por tamaño. Cifrar necesita una clave y es la única de las tres que protege algo.","Versiona el acuerdo y no solo el código. Añade campos en vez de reutilizarlos, mantén a los consumidores tolerantes ante campos desconocidos, nunca cambies el significado ni la unidad de un campo existente e indica las unidades en el nombre. Después prueba con cargas de ejemplo guardadas y, en un flujo financiero, compara totales tras cada cambio."]},"pitfalls":{"en":["Base64 is a representation, not a protection. It is reversible without a key, so a secret inside it is a secret in plain sight.","A payload that validates can still be semantically wrong. Schema checks do not catch a changed unit, a changed time zone or a reused field."],"es":["Base64 es una representación, no una protección. Es reversible sin clave, así que un secreto dentro es un secreto a la vista.","Una carga que valida puede ser semánticamente incorrecta. Las comprobaciones de esquema no detectan una unidad cambiada, una zona horaria cambiada ni un campo reutilizado."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc8259","label":"rfc-editor.org: rfc8259"},{"url":"https://www.rfc-editor.org/rfc/rfc3629","label":"rfc-editor.org: rfc3629"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Base64","label":"developer.mozilla.org: Base64"}]}},{"id":"tls","parent":"osi-6","title":{"en":"TLS, certificates and termination","es":"TLS, certificados y terminación"},"summary":{"en":"Protect data in transit and verify the identity presented by the other endpoint.","es":"Protege los datos en tránsito y verifica la identidad que presenta el otro extremo."},"details":{"en":["TLS protects confidentiality and integrity and usually authenticates the server through certificates. Clients check trust chains, dates and hostname. Application authorization is separate. Termination means the encrypted connection ends at that component; encrypting to the backend creates a new connection rather than extending the original session."],"es":["TLS protege confidencialidad e integridad y suele autenticar al servidor con certificados. El cliente comprueba confianza, fechas y nombre. La autorización de aplicación es distinta. Terminar significa que la conexión cifrada acaba en ese componente; cifrar al backend crea otra conexión, no prolonga la original."]},"aws":{"en":"ALB can terminate HTTPS using ACM and use HTTPS toward targets. Its target-certificate validation behavior differs from a normal browser, so check the documentation.","es":"ALB puede terminar HTTPS con ACM y usar HTTPS hacia destinos. Su validación de certificados destino difiere de un navegador; consulta documentación."},"question":{"en":"A certificate has valid dates but causes hostname mismatch. What do you check?","es":"¿Qué compruebas si las fechas son válidas pero falla el nombre?"},"answer":{"en":"Compare requested hostname, certificate alternative names, DNS destination and SNI-selected certificate. Valid dates alone are insufficient.","es":"Compara nombre solicitado, nombres alternativos, destino DNS y certificado seleccionado por SNI. Las fechas no bastan."},"related":["tcp","http","encryption","load-balancing"],"sources":[{"label":"TLS 1.3: RFC 8446","url":"https://www.rfc-editor.org/rfc/rfc8446"},{"label":"Application Load Balancer","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html"}],"level":"applied","learning":{"definition":{"en":"Transport Layer Security protects a connection so a third party cannot read it, alter it undetected or impersonate the server. In a handshake the two sides agree on algorithms, derive shared keys, and the client checks the certificate the server presents. It runs above transport and below the application protocol, so HTTP carried over it is unchanged in meaning.","es":"La Seguridad de la Capa de Transporte protege una conexión para que un tercero no pueda leerla, alterarla sin ser detectado ni suplantar al servidor. En un saludo ambos lados acuerdan algoritmos, derivan claves compartidas y el cliente comprueba el certificado que presenta el servidor. Funciona sobre el transporte y bajo el protocolo de aplicación, así que HTTP transportado sobre ella no cambia de significado."},"simple":{"en":"It answers two questions: is this really the server I asked for, and can anyone in between read or change what we say. It does not answer what I am allowed to do.","es":"Responde a dos preguntas: es este realmente el servidor que pedí, y puede alguien intermedio leer o cambiar lo que decimos. No responde a qué me está permitido hacer."},"analogy":{"en":"A certificate is like a passport checked at a border: issued by a trusted authority, valid for a period and naming its holder. The limitation is that a passport proves identity and grants nothing. A valid certificate says the server is who it claims and says nothing about which resources a caller may use.","es":"Un certificado es como un pasaporte revisado en una frontera: emitido por una autoridad de confianza, válido un periodo y con el nombre de su titular. La limitación es que un pasaporte prueba identidad y no concede nada. Un certificado válido dice que el servidor es quien afirma y no dice qué recursos puede usar un llamante."},"walkthrough":{"en":["Follow the handshake. The client offers versions, algorithms and key material, the server chooses, sends its certificate chain and proves it holds the matching private key, and both derive the same keys. In the current version this completes in one round trip, and a resumed session can be faster.","List what the client validates, because each item is its own outage cause: the chain must reach a trusted root, every certificate must be within its dates, and the requested name must match a name in the certificate. A missing intermediate certificate often works in a browser and fails in a command line client.","Keep authentication and authorisation apart. A completed handshake proves server identity and gives a private channel. Whether the caller may read a record is decided afterwards by the application or a gateway. Mutual authentication strengthens identity and still grants no permissions.","Decide where encryption terminates. If a load balancer terminates it, it can read and route on HTTP content, and the hop to your servers is whatever you configure. Encrypting that hop creates a new connection rather than extending the original. Then automate renewal, because expiry is a common self inflicted outage."],"es":["Sigue el saludo. El cliente ofrece versiones, algoritmos y material de clave, el servidor elige, envía su cadena de certificados y prueba que posee la clave privada correspondiente, y ambos derivan las mismas claves. En la versión actual esto se completa en una ida y vuelta, y una sesión reanudada puede ser más rápida.","Enumera qué valida el cliente, porque cada punto es una causa de caída distinta: la cadena debe llegar a una raíz de confianza, cada certificado debe estar dentro de sus fechas y el nombre solicitado debe coincidir con un nombre del certificado. Un certificado intermedio ausente suele funcionar en un navegador y fallar en un cliente de línea de comandos.","Mantén separadas autenticación y autorización. Un saludo completado prueba la identidad del servidor y da un canal privado. Si el llamante puede leer un registro lo decide después la aplicación o una pasarela. La autenticación mutua refuerza la identidad y sigue sin conceder permisos.","Decide dónde termina el cifrado. Si lo termina un balanceador, puede leer y enrutar por contenido HTTP, y el salto hasta tus servidores es lo que configures. Cifrar ese salto crea una conexión nueva en vez de extender la original. Después automatiza la renovación, porque la caducidad es una caída autoinfligida habitual."]},"pitfalls":{"en":["Encryption is not authorisation. A valid certificate and a private channel tell you nothing about what the caller is allowed to do.","Terminating at an edge component and calling the whole path encrypted is inaccurate. Each hop is a separate connection and is configured on its own."],"es":["El cifrado no es autorización. Un certificado válido y un canal privado no dicen nada sobre qué le está permitido hacer al llamante.","Terminar en un componente de borde y llamar cifrado a todo el camino es inexacto. Cada salto es una conexión aparte y se configura por sí misma."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc8446","label":"rfc-editor.org: rfc8446"},{"url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html","label":"docs.aws.amazon.com: introduction"}]}},{"id":"dns","parent":"osi-7","title":{"en":"DNS resolution and caching","es":"Resolución DNS y caché"},"summary":{"en":"Resolve names into records and understand where cached answers come from.","es":"Resuelve nombres en registros y entiende de dónde salen las respuestas guardadas en caché."},"details":{"en":["Recursive resolvers query or cache authoritative answers. A and AAAA return IPv4 and IPv6; CNAME points to a name. TTL controls caching, but applications can cache too. DNS is not a traffic proxy. Changing a record does not immediately move existing connections or clients with cached answers."],"es":["Los resolvers recursivos consultan o almacenan respuestas autoritativas. A y AAAA devuelven IPv4 e IPv6; CNAME apunta a un nombre. TTL controla caché, pero las aplicaciones también cachean. DNS no hace proxy. Cambiar un registro no mueve inmediatamente conexiones o clientes con respuestas cacheadas."]},"aws":{"en":"Route 53 public/private hosted zones differ in visibility. Hybrid DNS may require Resolver endpoints and forwarding rules.","es":"Las zonas públicas y privadas Route 53 difieren en visibilidad. DNS híbrido puede requerir endpoints Resolver y reglas."},"question":{"en":"Why does a name work on a laptop but not inside a VPC?","es":"¿Por qué un nombre funciona en un portátil y no dentro de una VPC?"},"answer":{"en":"Compare resolvers, private-zone associations, forwarding and caches. Query the relevant path instead of repeatedly editing the record.","es":"Compara resolvers, asociaciones privadas, reenvío y cachés. Consulta la ruta pertinente en vez de editar repetidamente el registro."},"related":["ip","ipv6","hybrid","troubleshooting"],"sources":[{"label":"Amazon Route 53","url":"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/Welcome.html"},{"url":"https://www.rfc-editor.org/rfc/rfc1034","label":"rfc-editor.org: rfc1034"},{"url":"https://www.rfc-editor.org/rfc/rfc1035","label":"rfc-editor.org: rfc1035"},{"url":"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/welcome-dns-service.html","label":"docs.aws.amazon.com: welcome dns service"}],"level":"foundation","learning":{"definition":{"en":"The Domain Name System is a distributed database that turns names into records. The namespace is a tree delegated in zones, so each organisation is authoritative for its own part. A client asks a recursive resolver, which follows the delegation chain from the root downward and caches each answer for the time to live the owner published.","es":"El Sistema de Nombres de Dominio es una base de datos distribuida que convierte nombres en registros. El espacio de nombres es un árbol delegado en zonas, así que cada organización es autoritativa de su propia parte. Un cliente pregunta a un resolutor recursivo, que sigue la cadena de delegación desde la raíz hacia abajo y guarda en caché cada respuesta durante el tiempo de vida que publicó el dueño."},"simple":{"en":"It is the lookup step before any connection. One resolver does the walking and then remembers the answer for a stated period.","es":"Es el paso de consulta previo a cualquier conexión. Un resolutor hace el recorrido y luego recuerda la respuesta durante un periodo indicado."},"analogy":{"en":"It is like a directory enquiry service with local copies of the phone book. The limitation is that a person who gets a number then dials it directly, exactly as here: the name service hands over an address and steps out of the path. It is not a proxy, so it cannot move a conversation already in progress.","es":"Es como un servicio de información telefónica con copias locales del listín. La limitación es que quien recibe un número lo marca directamente, igual que aquí: el servicio de nombres entrega una dirección y sale del camino. No es un proxy, así que no puede mover una conversación ya en curso."},"walkthrough":{"en":["Follow one resolution. The client asks its resolver for a name and a record type. With no cached answer the resolver asks a root server, is referred to the servers for the top level domain, is referred again to the servers authoritative for the zone, and finally gets the record it returns.","Read caching as the reason changes are not instant. Every answer carries a time to live, and resolvers, operating systems, libraries and applications may each keep a copy. A long lived process that resolved a name at start up can hold an old address, so planned changes need that value lowered in advance.","Know the record types that cause confusion. Separate types return IPv4 and IPv6 addresses, so a dual stack name has both and each path must actually work. An alias record points a name at another name and is restricted at the top of a zone, which is why providers offer their own alias style records.","Use resolution as the first diagnostic step: query the name directly and against a public resolver, compare answers, and check the time to live and whether the answer is authoritative. Weighted or health checked answers can steer traffic, but because clients cache, this shifts traffic gradually and is weak as a sole failover mechanism."],"es":["Sigue una resolución. El cliente pide a su resolutor un nombre y un tipo de registro. Sin respuesta en caché, el resolutor pregunta a un servidor raíz, es remitido a los servidores del dominio de nivel superior, es remitido de nuevo a los servidores autoritativos de la zona y por fin obtiene el registro que devuelve.","Lee la caché como la razón de que los cambios no sean instantáneos. Cada respuesta lleva un tiempo de vida, y resolutores, sistemas operativos, bibliotecas y aplicaciones pueden guardar cada uno una copia. Un proceso de larga vida que resolvió un nombre al arrancar puede retener una dirección antigua, así que los cambios planificados necesitan bajar ese valor con antelación.","Conoce los tipos de registro que causan confusión. Tipos distintos devuelven direcciones IPv4 e IPv6, así que un nombre de doble pila tiene ambos y cada camino debe funcionar de verdad. Un registro de alias apunta un nombre a otro nombre y está restringido en la raíz de una zona, por lo que los proveedores ofrecen sus propios registros de tipo alias.","Usa la resolución como primer paso de diagnóstico: consulta el nombre directamente y contra un resolutor público, compara respuestas y revisa el tiempo de vida y si la respuesta es autoritativa. Las respuestas por peso o con comprobación de salud pueden dirigir tráfico, pero como los clientes usan caché, esto lo mueve de forma gradual y es débil como único mecanismo de conmutación."]},"pitfalls":{"en":["Changing a record does not move connections that already exist, and it does not reach clients or libraries still holding a cached answer.","A name that resolves is not a healthy service. Resolution only proves a record exists, not that anything is listening behind it."],"es":["Cambiar un registro no mueve las conexiones que ya existen, y no llega a los clientes ni las bibliotecas que aún guardan una respuesta en caché.","Un nombre que resuelve no es un servicio sano. La resolución solo prueba que existe un registro, no que algo escuche detrás."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc1034","label":"rfc-editor.org: rfc1034"},{"url":"https://www.rfc-editor.org/rfc/rfc1035","label":"rfc-editor.org: rfc1035"},{"url":"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/welcome-dns-service.html","label":"docs.aws.amazon.com: welcome dns service"}]},"diagrams":[{"id":"dns-flow","kind":"sequence","nodes":["dns"],"title":{"en":"One name resolved on a cache miss","es":"Un nombre resuelto cuando falla la caché"},"caption":{"en":"This long path runs only when nothing useful is cached. In practice the root and top level delegations are often already known, so the resolver may start further down.","es":"Este camino largo solo se recorre cuando no hay nada útil en caché. En la práctica, las delegaciones de la raíz y del primer nivel suelen conocerse ya, así que el resolutor puede empezar más abajo."},"alt":{"en":"Six steps. The application asks the operating system resolver, which asks a recursive resolver. On a cache miss the recursive resolver asks a root server, then a top level domain server, then the authoritative name server, and returns the answer with a TTL. Notes explain that cached delegations often skip the first steps, that caches along the path may keep the answer, and that a changed record can stay hidden while those caches still hold the old one.","es":"Seis pasos. La aplicación pregunta al resolutor del sistema operativo, que pregunta a un resolutor recursivo. Si falla la caché, el resolutor recursivo pregunta a un servidor raíz, luego a un servidor del dominio de primer nivel, luego al servidor autoritativo, y devuelve la respuesta con un TTL. Las notas explican que las delegaciones en caché suelen ahorrar los primeros pasos, que las cachés del camino pueden guardar la respuesta, y que un registro cambiado puede seguir oculto mientras esas cachés conserven el anterior."},"actors":[{"id":"app","label":{"en":"Application","es":"Aplicación"}},{"id":"stub","label":{"en":"Operating system resolver","es":"Resolutor del sistema operativo"}},{"id":"recursive","label":{"en":"Recursive resolver","es":"Resolutor recursivo"}},{"id":"root","label":{"en":"Root server","es":"Servidor raíz"}},{"id":"tld","label":{"en":"Top level domain server","es":"Servidor del dominio de primer nivel"}},{"id":"auth","label":{"en":"Authoritative name server","es":"Servidor autoritativo"}}],"steps":[{"from":"app","to":"stub","label":{"en":"Where is api.example.com","es":"Dónde está api.example.com"},"note":{"en":"A local cache, a hosts file or the application's own cache can answer here and end the story.","es":"Una caché local, un fichero hosts o la caché de la propia aplicación puede responder aquí y acabar la historia."}},{"from":"stub","to":"recursive","label":{"en":"The same question, sent to the configured resolver","es":"La misma pregunta, enviada al resolutor configurado"},"note":{"en":"Inside a VPC this is usually the Route 53 Resolver, reachable at the base of the VPC primary IPv4 range plus two.","es":"Dentro de una VPC suele ser el Route 53 Resolver, accesible en la base del rango IPv4 primario de la VPC más dos."}},{"from":"recursive","to":"root","label":{"en":"Which servers handle .com","es":"Qué servidores gestionan .com"},"note":{"en":"Often skipped: this delegation is long lived and is typically already cached.","es":"A menudo se omite: esta delegación tiene una vida larga y suele estar ya en caché."}},{"from":"recursive","to":"tld","label":{"en":"Which servers are authoritative for example.com","es":"Qué servidores son autoritativos para example.com"},"note":{"en":"Often cached too. Delegations change rarely.","es":"También suele estar en caché. Las delegaciones cambian poco."}},{"from":"recursive","to":"auth","label":{"en":"Give me the A record for api.example.com","es":"Dame el registro A de api.example.com"},"note":{"en":"This is where the record originates. Caches can answer for it, which is why the origin and the answer a client sees can disagree for a while.","es":"Aquí se origina el registro. Las cachés pueden responder en su lugar, y por eso el origen y la respuesta que ve un cliente pueden discrepar durante un tiempo."}},{"from":"recursive","to":"app","label":{"en":"Address plus TTL, and caches along the way may keep it","es":"Dirección más TTL, y las cachés del camino pueden guardarla"},"note":{"en":"The TTL is an instruction that resolvers usually but not always honour, and not every layer caches. Lower it before a planned cutover, then verify from more than one network.","es":"El TTL es una indicación que los resolutores suelen respetar, aunque no siempre, y no todas las capas guardan caché. Bájalo antes de un cambio planificado y verifica desde más de una red."}}]}]},{"id":"http","parent":"osi-7","title":{"en":"HTTP methods, status and retries","es":"HTTP: métodos, estados y reintentos"},"summary":{"en":"Requests, responses and the rules that determine whether retrying an operation is safe.","es":"Peticiones, respuestas y reglas que determinan si es seguro reintentar una operación."},"details":{"en":["HTTP defines methods, headers and status codes. GET is safe by semantics; PUT and DELETE are idempotent by intended effect, but POST is not inherently idempotent. A 5xx may come from a proxy rather than the application. A timed-out POST might already have executed. Use idempotency keys and bounded retries with backoff and jitter."],"es":["HTTP define métodos, cabeceras y estados. GET es seguro por semántica; PUT y DELETE son idempotentes por efecto previsto, pero POST no lo es por naturaleza. Un 5xx puede venir de un proxy. Un POST con timeout puede haberse ejecutado. Usa claves de idempotencia y reintentos limitados con backoff y jitter."]},"aws":{"en":"Distinguish ALB-generated errors from target-generated errors in logs and metrics.","es":"Distingue errores de ALB y de destinos mediante logs y métricas."},"question":{"en":"Would you retry every failed payment POST automatically?","es":"¿Reintentarías automáticamente todo POST de pago fallido?"},"answer":{"en":"Only with a suitable idempotency contract. Persist the request key and result, and cap retries so failure does not multiply load.","es":"Solo con un contrato de idempotencia adecuado. Persiste clave y resultado y limita reintentos para no multiplicar carga."},"related":["tls","dns","cloud","quic"],"sources":[{"label":"HTTP semantics: RFC 9110","url":"https://www.rfc-editor.org/rfc/rfc9110.html"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Idempotent","label":"developer.mozilla.org: Idempotent"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status","label":"developer.mozilla.org: Status"}],"level":"applied","learning":{"definition":{"en":"The Hypertext Transfer Protocol is a stateless request and response protocol for acting on resources. A request names a method, a target and headers, and a response returns a status code, headers and usually a body. A safe method is not intended to change anything, and an idempotent method is one where several identical requests are intended to have the same effect as one. The same semantics apply over HTTP/1.1, HTTP/2 and HTTP/3.","es":"El Protocolo de Transferencia de Hipertexto es un protocolo de petición y respuesta sin estado para actuar sobre recursos. Una petición nombra un método, un destino y cabeceras, y una respuesta devuelve un código de estado, cabeceras y normalmente un cuerpo. Un método seguro no pretende cambiar nada, y un método idempotente es aquel en que varias peticiones idénticas pretenden tener el mismo efecto que una. La misma semántica aplica sobre HTTP/1.1, HTTP/2 y HTTP/3."},"simple":{"en":"The method declares the intent and the status code declares the outcome. Together they tell you whether retrying is safe.","es":"El método declara la intención y el código de estado declara el resultado. Juntos dicen si reintentar es seguro."},"analogy":{"en":"It is like a service counter: you submit a numbered form and get a stamped decision back. The limitation is that a counter has one clerk who remembers your visit, while this protocol is stateless by design. Each request must carry what it needs, and the stamp may come from a cache or a gateway rather than the office you meant to reach.","es":"Es como un mostrador de atención: entregas un formulario numerado y recibes una decisión sellada. La limitación es que un mostrador tiene un empleado que recuerda tu visita, mientras este protocolo es sin estado por diseño. Cada petición debe llevar lo que necesita, y el sello puede venir de una caché o una pasarela y no de la oficina a la que querías llegar."},"walkthrough":{"en":["Read methods by intent. Retrieval is safe and cacheable. Replacing a resource and deleting it are intended to be idempotent, so repeating them should not compound the effect. Creating by posting is not idempotent, because a second identical post is normally understood as a second creation.","Learn the status classes: two hundred is success, three hundred means the resource is elsewhere, four hundred means the request as sent is unacceptable, and five hundred means the responder failed. A refusal for permissions and a not found often overlap in practice, because a service may hide existence deliberately.","Design retries from the semantics. Retry on connection failures, on timeouts for idempotent methods, and on responses that invite a retry. Use bounded attempts, exponential backoff and random jitter so a recovering service is not hit by every client at the same instant.","Make unsafe operations retryable on purpose: have the client send an idempotency key, store it with the result of the first successful execution, and return that stored result when the key arrives again. Then identify who answered, because a failure code can come from a cache, a load balancer, a gateway or your own code."],"es":["Lee los métodos por intención. La recuperación es segura y se puede almacenar en caché. Sustituir un recurso y borrarlo pretenden ser idempotentes, así que repetirlos no debería acumular el efecto. Crear mediante un envío no es idempotente, porque un segundo envío idéntico se entiende normalmente como una segunda creación.","Aprende las clases de estado: doscientos es éxito, trescientos significa que el recurso está en otro sitio, cuatrocientos que la petición enviada no es aceptable y quinientos que falló quien respondió. Un rechazo por permisos y un no encontrado se solapan a menudo en la práctica, porque un servicio puede ocultar la existencia a propósito.","Diseña los reintentos desde la semántica. Reintenta ante fallos de conexión, ante tiempos de espera agotados en métodos idempotentes y ante respuestas que invitan a reintentar. Usa intentos limitados, espera exponencial y variación aleatoria para que un servicio que se recupera no reciba a todos los clientes en el mismo instante.","Haz reintentables a propósito las operaciones no seguras: que el cliente envíe una clave de idempotencia, guárdala con el resultado de la primera ejecución correcta y devuelve ese resultado cuando la clave llegue de nuevo. Después identifica quién respondió, porque un código de fallo puede venir de una caché, un balanceador, una pasarela o tu propio código."]},"pitfalls":{"en":["Idempotency describes the intended effect, so the method alone does not guarantee a safe retry. A server can expose a non idempotent endpoint under an idempotent method, so read the interface rather than assuming.","A successful status code is not proof the business outcome is correct, and a timed out request may already have been executed. Retrying without an idempotency key can duplicate an order or a payment."],"es":["La idempotencia describe el efecto pretendido, así que el método por sí solo no garantiza un reintento seguro. Un servidor puede exponer un endpoint no idempotente bajo un método idempotente, así que lee la interfaz en vez de asumir.","Un código de estado correcto no prueba que el resultado de negocio sea correcto, y una petición con tiempo de espera agotado puede haberse ejecutado ya. Reintentar sin clave de idempotencia puede duplicar un pedido o un pago."]},"sourceUrls":[{"url":"https://www.rfc-editor.org/rfc/rfc9110.html","label":"rfc-editor.org: rfc9110"},{"url":"https://developer.mozilla.org/en-US/docs/Glossary/Idempotent","label":"developer.mozilla.org: Idempotent"},{"url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status","label":"developer.mozilla.org: Status"}]}},{"id":"vpc","parent":"networking","title":{"en
