respaldo que nunca has restaurado. Los respaldos sin probar fallan a menudo por permisos, claves de cifrado ausentes o una definición de infraestructura incompleta en la región de recuperación."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html","label":"docs.aws.amazon.com: disaster recovery dr objectives"},{"url":"https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html","label":"docs.aws.amazon.com: disaster recovery options in the cloud"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html","label":"docs.aws.amazon.com: plan for disaster recovery dr"}]},"diagrams":[{"id":"multi-az","kind":"zones","nodes":["reliability","disaster-recovery"],"title":{"en":"The same tier in two Availability Zones","es":"El mismo nivel en dos zonas de disponibilidad"},"caption":{"en":"Resilience comes from having no tier that lives in only one zone. The database here is an Amazon RDS Multi-AZ DB instance deployment, used as one concrete example: other database options replicate differently.","es":"La resiliencia surge de que ningún nivel viva en una sola zona. La base de datos de aquí es un despliegue de instancia de base de datos Multi-AZ de Amazon RDS, usado como un ejemplo concreto: otras opciones de base de datos replican de otra forma."},"alt":{"en":"A region with a load balancer enabled in two Availability Zones. Zone A holds application instances and the primary RDS DB instance. Zone B holds application instances and its synchronous standby, which serves no traffic in this deployment option. A closing note explains that the Auto Scaling group spans both zones, that failover promotes the standby so the endpoint name resolves to the new primary, and that this protects against losing a zone but is not a backup.","es":"Una región con un balanceador habilitado en dos zonas de disponibilidad. La zona A tiene instancias de aplicación y la instancia primaria de base de datos RDS. La zona B tiene instancias de aplicación y su copia en espera sincrónica, que no atiende tráfico en esta opción de despliegue. Una nota final explica que el grupo de auto escalado abarca las dos zonas, que el failover promueve la copia en espera y el nombre del endpoint apunta a la nueva primaria, y que esto protege frente a perder una zona pero no es una copia de seguridad."},"spanTop":{"label":{"en":"Application Load Balancer, enabled in both zones","es":"Application Load Balancer, habilitado en las dos zonas"},"note":{"en":"Health checks stop sending traffic to targets that stop answering in a failing zone.","es":"Las comprobaciones de salud dejan de enviar tráfico a los destinos que dejan de responder en una zona con problemas."}},"zones":[{"label":{"en":"Availability Zone A","es":"Zona de disponibilidad A"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Sized so the remaining zone can carry the load, or able to scale into it quickly.","es":"Dimensionadas para que la zona restante soporte la carga, o capaces de escalar rápido hasta ella."}},{"label":{"en":"RDS DB instance, primary","es":"Instancia de base de datos RDS, primaria"},"note":{"en":"Takes the reads and writes in this deployment option.","es":"Recibe las lecturas y escrituras en esta opción de despliegue."}}]},{"label":{"en":"Availability Zone B","es":"Zona de disponibilidad B"},"items":[{"label":{"en":"Application instances","es":"Instancias de aplicación"},"note":{"en":"Same image, same configuration, no state that exists in only one zone.","es":"Misma imagen, misma configuración, sin estado que exista solo en una zona."}},{"label":{"en":"RDS standby, synchronous","es":"Copia en espera RDS, sincrónica"},"note":{"en":"In a Multi-AZ DB instance deployment the standby serves no traffic. It is not a read replica and not a backup.","es":"En un despliegue de instancia Multi-AZ, la copia en espera no atiende tráfico. No es una réplica de lectura ni una copia de seguridad."}}]}],"spanBottom":{"label":{"en":"Auto Scaling group across both zones","es":"Grupo de auto escalado en las dos zonas"},"note":{"en":"Failover promotes the standby and the endpoint name resolves to the new primary, so plan for reconnection and a short interruption. Keep backups: this protects against losing a zone, not against a bad deployment or a deleted table.","es":"El failover promueve la copia en espera y el nombre del endpoint apunta a la nueva primaria, así que prevé la reconexión y una breve interrupción. Conserva copias de seguridad: esto protege frente a perder una zona, no frente a un despliegue defectuoso o una tabla borrada."}}}]},{"id":"observability","parent":"architecture","title":{"en":"Observability","es":"Observabilidad"},"summary":{"en":"Use metrics, logs and traces to explain what a system is doing and why it is failing.","es":"Usa métricas, registros y trazas para explicar qué hace un sistema y por qué falla."},"details":{"en":["Observability rests on three signal types: metrics, logs, and traces (the path of a single request across services, essential once a system is distributed). CloudWatch handles metrics/logs/alarms; X-Ray provides distributed tracing by propagating a trace ID across service calls.","Pitfall: alerting only on infrastructure metrics while ignoring user-facing signals like error rate and p99 latency; a service can look healthy on CPU while every user request fails."],"es":["La observabilidad se apoya en tres tipos de señal: métricas, logs, y trazas (el camino de una sola solicitud entre servicios, esencial en un sistema distribuido). CloudWatch maneja métricas/logs/alarmas; X-Ray provee trazabilidad distribuida propagando un ID de traza entre llamadas de servicio.","Error común: alertar solo sobre métricas de infraestructura ignorando señales de cara al usuario como la tasa de error y la latencia p99; un servicio puede verse saludable en CPU mientras cada solicitud de usuario falla."]},"aws":{"en":"CloudWatch Logs Insights for querying logs, CloudWatch Alarms on customer-facing SLIs, X-Ray for tracing across Lambda/ECS/API Gateway.","es":"CloudWatch Logs Insights para consultar logs, CloudWatch Alarms sobre SLIs de cara al cliente, X-Ray para trazabilidad entre Lambda/ECS/API Gateway."},"question":{"en":"A microservices checkout flow is slow, but every service's CPU/memory dashboards look healthy. How do you find the bottleneck?","es":"Un flujo de checkout de microservicios es lento, pero los tableros de CPU/memoria de cada servicio se ven saludables. ¿Cómo encuentras el cuello de botella?"},"answer":{"en":"Correlate user-facing latency and errors with metrics, logs and traces. Trace a slow request across services, inspect the critical path and check retries, queues and dependencies. Sampling and missing instrumentation can hide failures, so compare several requests and add actionable SLO-based alerts.","es":"Correlaciona latencia y errores del usuario con métricas, logs y trazas. Sigue solicitudes lentas entre servicios, inspecciona ruta crítica, reintentos, colas y dependencias. Muestreo o instrumentación incompleta pueden ocultar fallos; compara solicitudes y añade alertas basadas en SLO."},"related":["cloud-microservices","reliability","systems-processes","improve-operations"],"sources":[{"label":"Amazon CloudWatch Concepts","url":"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html"},{"label":"AWS X-Ray Developer Guide","url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}],"level":"applied","quickLinks":["improve-operations"],"learning":{"definition":{"en":"Observability is the ability to understand what a running system is doing from the signals it emits, without attaching a debugger or guessing. It rests on three kinds of signal: metrics, which are numbers over time; logs, which are discrete event records; and traces, which follow one request across the services it touches.","es":"La observabilidad es la capacidad de entender qué está haciendo un sistema en marcha a partir de las señales que emite, sin conectar un depurador ni adivinar. Se apoya en tres tipos de señal: las métricas, que son números a lo largo del tiempo; los logs, que son registros de eventos concretos; y las trazas, que siguen una sola solicitud por los servicios que atraviesa."},"simple":{"en":"Instrument the system so a failure tells you where it is, instead of forcing you to look everywhere.","es":"Instrumenta el sistema para que un fallo te diga dónde está, en vez de obligarte a mirar en todas partes."},"analogy":{"en":"Metrics are a car's dashboard gauges, logs are the maintenance record, and a trace is dashcam footage of one specific journey. The limit: a car makes one trip at a time, while a distributed system runs thousands at once, so traces are usually sampled and the request you most want may not have been recorded.","es":"Las métricas son los indicadores del salpicadero de un coche, los logs son el historial de mantenimiento y una traza es la grabación de la cámara de a bordo de un viaje concreto. El límite: un coche hace un viaje a la vez, mientras que un sistema distribuido ejecuta miles a la vez, así que las trazas suelen muestrearse y puede que la solicitud que más te interesa no se haya registrado."},"walkthrough":{"en":["Start from what the user experiences. The signals that matter most are request error rate and latency at a high percentile such as p99, because an average hides the slow tail customers complain about. A service can show healthy processor and memory use while every request fails, so infrastructure metrics alone are not a health check.","Use each signal for what it is good at. In Amazon CloudWatch, metrics are the cheap aggregated numbers you alarm on and logs hold the detail you query when an alarm fires. AWS X-Ray collects trace data for requests and shows the downstream calls each one made, which is what tells you whether a slow checkout waits on a database query, a third-party call or a queue.","Alarm on objectives rather than raw resource numbers, and keep every alarm actionable, since a threshold nobody can act on trains the team to ignore it. When investigating, compare a slow request with a fast one on the same path, and remember that sampling and missing instrumentation can hide a failure, so check whether the gap is in the system or in your tracing."],"es":["Empieza por lo que experimenta el usuario. Las señales que más importan son la tasa de error de las solicitudes y la latencia en un percentil alto como p99, porque una media esconde la cola lenta de la que se quejan los clientes. Un servicio puede mostrar un uso saludable de procesador y memoria mientras todas las solicitudes fallan, así que las métricas de infraestructura por sí solas no son un chequeo de salud.","Usa cada señal para lo que sirve. En Amazon CloudWatch, las métricas son los números agregados y baratos sobre los que alarmas, y los logs guardan el detalle que consultas cuando salta una alarma. AWS X-Ray recoge datos de traza de las solicitudes y muestra las llamadas descendentes de cada una, que es lo que te dice si un checkout lento espera a una consulta de base de datos, a una llamada externa o a una cola.","Alarma sobre objetivos en vez de sobre cifras brutas de recursos, y mantén cada alarma accionable, ya que un umbral sobre el que nadie puede actuar entrena al equipo para ignorarlo. Al investigar, compara una solicitud lenta con una rápida del mismo recorrido, y recuerda que el muestreo y la instrumentación incompleta pueden ocultar un fallo, así que comprueba si el hueco está en el sistema o en tu trazado."]},"pitfalls":{"en":["Alarming only on infrastructure metrics. Processor, memory and disk can all look normal while the customer-facing error rate is at 100 percent.","Logging everything at full detail and calling it observability. Unstructured, unsampled logs at scale are expensive and still slow to search when you need an answer in minutes."],"es":["Alarmar solo sobre métricas de infraestructura. Procesador, memoria y disco pueden parecer normales mientras la tasa de error de cara al cliente está al 100 por cien.","Registrar todo con el máximo detalle y llamarlo observabilidad. A escala, los logs sin estructura ni muestreo son caros y siguen siendo lentos de buscar cuando necesitas una respuesta en minutos."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch_concepts.html","label":"docs.aws.amazon.com: cloudwatch concepts"},{"url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html","label":"docs.aws.amazon.com: aws xray"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/operational-excellence-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}]}},{"id":"cost-optimization","parent":"architecture","title":{"en":"Cost Optimization","es":"Optimización de costos"},"summary":{"en":"Reduce waste while preserving the performance, reliability and value the business needs.","es":"Reduce desperdicio manteniendo el rendimiento, la fiabilidad y el valor que necesita el negocio."},"details":{"en":["Cost optimization starts with right-sizing and eliminating waste, then purchasing models capture further savings: Savings Plans/Reserved Instances for steady usage, Spot for interruptible workloads, S3 lifecycle policies for cold data.","Pitfall: optimizing cost isolated from reliability, e.g. removing a standby replica without acknowledging the availability tradeoff; cost decisions should be presented with the risk they introduce."],"es":["La optimización de costos comienza con el ajuste de tamaño y la eliminación de desperdicio, luego los modelos de compra capturan más ahorro: Savings Plans/Reserved Instances para uso estable, Spot para cargas interrumpibles, políticas de ciclo de vida de S3 para datos fríos.","Error común: optimizar el costo aislado de la confiabilidad, ej. eliminar una réplica standby sin reconocer la compensación de disponibilidad; las decisiones de costo deben presentarse junto con el riesgo que introducen."]},"aws":{"en":"Cost Explorer and Compute Optimizer for right-sizing, Savings Plans for flexible discounts, S3 Intelligent-Tiering for automatic tier movement.","es":"Cost Explorer y Compute Optimizer para ajuste de tamaño, Savings Plans para descuentos flexibles, S3 Intelligent-Tiering para movimiento automático de nivel."},"question":{"en":"A customer wants to cut their AWS bill 30 percent this quarter. What sequence of actions do you recommend?","es":"Un cliente quiere reducir su factura de AWS 30 por ciento este trimestre. ¿Qué secuencia de acciones recomiendas?"},"answer":{"en":"Step 1: start with waste elimination and right-sizing via Cost Explorer/Compute Optimizer, low risk since it targets idle or over-provisioned resources. Step 2: apply Savings Plans/Reserved Instances to the now-accurate steady-state baseline. Step 3: only then evaluate architectural changes (Spot, storage tiering, serverless) since these carry more design tradeoffs.","es":"Paso 1: empieza con la eliminación de desperdicio y el ajuste de tamaño vía Cost Explorer/Compute Optimizer, bajo riesgo ya que apunta a recursos inactivos o sobreaprovisionados. Paso 2: aplica Savings Plans/Reserved Instances a la línea base ahora bien dimensionada. Paso 3: solo después evalua cambios arquitectonicos (Spot, tiering de almacenamiento, serverless) ya que conllevan más compensaciones de diseño."},"related":["cloud-ec2","well-architected","reliability","improve-cost"],"sources":[{"label":"AWS Well-Architected Cost Optimization Pillar","url":"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}],"level":"applied","quickLinks":["improve-cost"],"learning":{"definition":{"en":"Cost optimization is the discipline of getting the business outcome you need at the lowest justified price. AWS describes a cost-optimized workload as one that fully uses the resources it pays for, meets its functional requirements and achieves its outcome at the lowest possible price point, which makes it a question about value rather than simply about a smaller invoice.","es":"La optimización de costes es la disciplina de conseguir el resultado de negocio que necesitas al precio más bajo justificable. AWS describe una carga optimizada en coste como la que utiliza plenamente los recursos que paga, cumple sus requisitos funcionales y logra su resultado al menor precio posible, lo que la convierte en una cuestión de valor y no simplemente de una factura más pequeña."},"simple":{"en":"Delete waste first, then buy discounts for what is left, and only then redesign.","es":"Elimina primero el desperdicio, después compra descuentos para lo que quede y solo entonces rediseña."},"analogy":{"en":"It is like reducing a household electricity bill: you switch off the rooms nobody uses before negotiating a cheaper tariff, because a discount on wasted consumption is still waste. The analogy is imperfect because cloud spend can also fall by changing the appliance itself, moving to a managed or serverless option, which has no real household equivalent.","es":"Es como reducir la factura eléctrica de una casa: apagas las habitaciones que nadie usa antes de negociar una tarifa más barata, porque un descuento sobre consumo desperdiciado sigue siendo desperdicio. La analogía es imperfecta porque el gasto en la nube también baja cambiando el propio electrodoméstico, pasando a una opción gestionada o serverless, algo sin equivalente real en una casa."},"walkthrough":{"en":["Measure before acting. Find out which accounts, services and tags drive the bill, because spend often concentrates somewhere nobody expects, such as data transfer or network address translation, rather than in the compute everyone discusses. Cost Explorer and Compute Optimizer are the usual starting points.","Then work in order of risk. Switching off unused resources and non-production environments outside working hours, and right-sizing over-provisioned ones, is usually the safest start, but verify each resource's owner and purpose first, because scheduled jobs, standby capacity and disaster recovery resources can look idle while doing exactly what they were built for. Only once the baseline is accurate should you commit to Savings Plans or Reserved Instances, since a commitment sized against waste locks it in for one to three years.","Architectural changes come last because they carry design consequences: Spot capacity for interruptible work, storage lifecycle policies for rarely read data, or a serverless option for spiky traffic. Present every saving with the risk it introduces, and never remove a standby replica or a backup copy without stating the availability or recovery consequence."],"es":["Mide antes de actuar. Averigua qué cuentas, servicios y etiquetas mueven la factura, porque el gasto suele concentrarse donde nadie lo espera, como la transferencia de datos o la traducción de direcciones de red, más que en el cómputo del que todos hablan. Cost Explorer y Compute Optimizer son los puntos de partida habituales.","Después trabaja en orden de riesgo. Apagar recursos sin usar y entornos que no son de producción fuera del horario laboral, y ajustar el tamaño de los sobreaprovisionados, suele ser el inicio más seguro, pero verifica antes el responsable y la finalidad de cada recurso, porque los trabajos programados, la capacidad en espera y los recursos de recuperación ante desastres pueden parecer inactivos mientras hacen aquello para lo que se crearon. Solo cuando la línea base sea correcta conviene comprometerse con Savings Plans o Reserved Instances, ya que un compromiso dimensionado sobre desperdicio lo fija durante uno a tres años.","Los cambios de arquitectura van al final porque tienen consecuencias de diseño: capacidad Spot para trabajo interrumpible, políticas de ciclo de vida para datos que casi no se leen, o una opción serverless para tráfico irregular. Presenta cada ahorro con el riesgo que introduce, y nunca retires una réplica en espera o una copia de respaldo sin decir la consecuencia en disponibilidad o en recuperación."]},"pitfalls":{"en":["Buying a commitment before right-sizing. A one or three year Savings Plan sized against over-provisioned capacity converts temporary waste into a contractual obligation.","Presenting a saving without its risk. Removing a replica, a backup copy or a second Availability Zone changes the availability and recovery story, and that belongs in the same sentence as the number."],"es":["Comprar un compromiso antes de ajustar el tamaño. Un Savings Plan de uno o tres años dimensionado sobre capacidad sobreaprovisionada convierte un desperdicio temporal en una obligación contractual.","Presentar un ahorro sin su riesgo. Retirar una réplica, una copia de respaldo o una segunda Zona de Disponibilidad cambia la historia de disponibilidad y recuperación, y eso va en la misma frase que la cifra."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}]}},{"id":"migration","parent":"architecture","title":{"en":"Migration Strategy","es":"Estrategia de migración"},"summary":{"en":"Compare migration strategies, then plan dependencies, validation and rollback.","es":"Compara estrategias de migración y planifica dependencias, validación y vuelta atrás."},"details":{"en":["The seven migration strategies describe how much to change: retire an application that is no longer needed; retain it where it is for now; rehost it with minimal application changes; relocate its platform; repurchase a replacement product; replatform with targeted changes; or refactor/re-architect its design. These are choices per workload, not a maturity ranking. Refactoring can unlock useful capabilities, but its cost and risk need a business case.","Before choosing, identify dependencies, licensing, data residency, acceptable downtime and recovery requirements. Plan a validation and rollback path, including how to reconcile new writes after cutover. Some portfolios move quickly with rehosting and modernize later; others need changes before they can move safely. Do not prescribe one sequence to every customer."],"es":["Las siete estrategias describen cuánto cambiar: retire da de baja una aplicación innecesaria; retain la conserva donde está por ahora; rehost la traslada con pocos cambios en la aplicación; relocate mueve su plataforma; repurchase la sustituye por otro producto; replatform introduce cambios concretos; y refactor/re-architect rediseña su arquitectura. Son opciones por carga, no una clasificación de madurez. Rediseñar puede aportar capacidades útiles, pero su coste y riesgo necesitan una justificación de negocio.","Antes de elegir, identifica dependencias, licencias, residencia de datos, interrupción aceptable y requisitos de recuperación. Planifica la validación y la vuelta atrás, incluido cómo reconciliar nuevas escrituras tras el cambio. Algunas carteras migran primero y modernizan después; otras necesitan cambios antes de poder trasladarse con seguridad. No impongas la misma secuencia a todos los clientes."]},"aws":{"en":"Migration Hub and Migration Evaluator for portfolio assessment; Application Migration Service (MGN) for rehost; Database Migration Service (DMS) for database replatforming.","es":"Migration Hub y Migration Evaluator para evaluación de portafolio; Application Migration Service (MGN) para rehost; Database Migration Service (DMS) para replatforming de bases de datos."},"question":{"en":"A company has 200 applications and a hard deadline to exit their data center in 6 months. What strategy mix do you recommend?","es":"Una empresa tiene 200 aplicaciones y un plazo fijo para salir de su centro de datos en 6 meses. ¿Qué combinación de estrategia recomiendas?"},"answer":{"en":"Step 1: prioritize rehost via MGN for the bulk of applications, the fastest path to exit on time. Step 2: identify a small subset for replatforming (e.g. a costly database via DMS) that fits the timeline. Step 3: flag retain candidates to exclude from the rush, and schedule refactor work for high-value apps as a later phase.","es":"Paso 1: prioriza el rehost vía MGN para la mayoria de aplicaciones, el camino más rápido para salir a tiempo. Paso 2: identifica un pequeño subconjunto para replatforming (ej. una base de datos costosa vía DMS) que encaje en el plazo. Paso 3: señala candidatos a retain para excluirlos de la prisa, y programa el trabajo de refactor de apps de alto valor como una fase posterior."},"related":["architecture-discovery","cost-optimization","cloud-ec2"],"sources":[{"label":"AWS Prescriptive Guidance - the 7 Rs migration strategies","url":"https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"},{"label":"AWS cloud migration","url":"https://aws.amazon.com/cloud-migration/"}],"level":"applied","learning":{"definition":{"en":"A migration strategy is the approach chosen for moving each existing workload to the cloud, matched to how much change that workload needs. AWS Prescriptive Guidance documents seven strategies, known as the 7 Rs: retire, retain, rehost, relocate, repurchase, replatform, and refactor or re-architect.","es":"Una estrategia de migración es el enfoque elegido para llevar cada carga de trabajo existente a la nube, ajustado a cuánto cambio necesita esa carga. La guía prescriptiva de AWS documenta siete estrategias, conocidas como las 7 R: retire, retain, rehost, relocate, repurchase, replatform y refactor o rearquitectura."},"simple":{"en":"Decide per application how much you will change it, and let the deadline decide how many you can afford to change.","es":"Decide por aplicación cuánto la vas a cambiar, y deja que el plazo decida cuántas puedes permitirte cambiar."},"analogy":{"en":"Moving a workload is like moving house with a fixed removal date: most boxes are carried across unopened, a few items are replaced because they will not fit, and some are thrown away. The analogy breaks down because a migrated application keeps serving customers during and after the move, so sequencing, cutover and rollback matter as much as the destination.","es":"Mover una carga de trabajo es como cambiar de casa con una fecha de mudanza fija: la mayoría de las cajas se llevan sin abrir, unos pocos objetos se reemplazan porque no encajan y otros se tiran. La analogía falla porque una aplicación migrada sigue atendiendo clientes durante la mudanza y después, así que la secuencia, el cambio de tráfico y la reversión importan tanto como el destino."},"walkthrough":{"en":["Begin with a portfolio assessment rather than a favourite pattern. You need an inventory of applications with dependencies, licences, data volumes and business criticality, because each strategy is a consequence of those facts. Migration Hub and Migration Evaluator build and track that view.","Assign a strategy per application. Retire decommissions applications with no remaining business value. Retain leaves behind what cannot or should not move yet. Rehost, often with AWS Application Migration Service, moves servers largely as they are. Relocate moves a workload such as a VMware environment to AWS without changing the servers or the application. Repurchase swaps a licensed product for a software as a service equivalent. Replatform changes a component, such as a self-managed database moving to a managed engine with Database Migration Service. Refactor or re-architect rebuilds the application.","Sequence against the real constraint. AWS Prescriptive Guidance does not recommend refactor for large migrations, because modernising during the move is the most complex option and hard to manage across many applications; the recommended pattern is to rehost, relocate or replatform first and modernise afterwards. With a hard data centre exit date, that ordering is what makes the deadline achievable."],"es":["Empieza con una evaluación del portafolio en vez de con un patrón favorito. Necesitas un inventario de aplicaciones con dependencias, licencias, volúmenes de datos y criticidad de negocio, porque cada estrategia es consecuencia de esos datos. Migration Hub y Migration Evaluator construyen y siguen esa visión.","Asigna una estrategia por aplicación. Retire da de baja las aplicaciones sin valor de negocio restante. Retain deja atrás lo que no puede o no debe moverse todavía. Rehost, a menudo con AWS Application Migration Service, mueve los servidores prácticamente tal cual. Relocate traslada una carga como un entorno VMware a AWS sin cambiar los servidores ni la aplicación. Repurchase sustituye un producto con licencia por un equivalente de software como servicio. Replatform cambia un componente, como una base de datos autogestionada que pasa a un motor gestionado con Database Migration Service. Refactor o rearquitectura reconstruye la aplicación.","Secuencia según la restricción real. La guía prescriptiva de AWS no recomienda refactor para migraciones grandes, porque modernizar durante el movimiento es la opción más compleja y difícil de gestionar en muchas aplicaciones; el patrón recomendado es hacer rehost, relocate o replatform primero y modernizar después. Con una fecha fija de salida del centro de datos, ese orden es lo que hace alcanzable el plazo."]},"pitfalls":{"en":["Defaulting every application to refactor because it sounds like best practice. AWS advises against refactor as the strategy for a large migration precisely because it is the hardest to manage at scale.","Forgetting retire and retain. Applications nobody uses, and applications that must stay put for now, distort the plan and the budget if they are carried along with everything else."],"es":["Llevar por defecto cada aplicación a refactor porque suena a buena práctica. AWS aconseja no usar refactor como estrategia de una migración grande precisamente porque es la más difícil de gestionar a escala.","Olvidar retire y retain. Las aplicaciones que nadie usa, y las que deben quedarse donde están por ahora, distorsionan el plan y el presupuesto si se arrastran junto con todo lo demás."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html","label":"docs.aws.amazon.com: migration strategies"},{"url":"https://aws.amazon.com/cloud-migration/","label":"aws.amazon.com: cloud migration"}]}},{"id":"system-design-interview","parent":"architecture","title":{"en":"System Design Interview Practice","es":"Práctica de entrevista de diseño de sistemas"},"summary":{"en":"Clarify requirements, draw a workable design and explain how it handles load and failure.","es":"Aclara requisitos, dibuja un diseño viable y explica cómo gestiona la carga y los fallos."},"details":{"en":["Clarify requirements and non-goals first, then estimate rough capacity, since these numbers should drive every subsequent choice. Only after a working design exists, discuss failure modes and further scale.","Pitfall: naming specific AWS services before establishing the access pattern and scale that would justify that choice."],"es":["Aclara primero los requisitos y los no-objetivos, luego estima la capacidad aproximada, ya que estos números deben guiar cada eleccion posterior. Solo después de que exista un diseño funcional, discute los modos de falla y más escala.","Error común: nombrar servicios específicos de AWS antes de establecer el patrón de acceso y la escala que justificarian esa eleccion."]},"aws":{"en":"Practice mapping estimated scale to concrete AWS choices explicitly, justified by the numbers, rather than naming services first.","es":"Práctica mapear la escala estimada a elecciones concretas de AWS explicitamente, justificadas por los números, en vez de nombrar servicios primero."},"question":{"en":"An interviewer asks you to design a URL shortener. What is the first thing to do before drawing any boxes?","es":"Un entrevistador te pide diseñar un acortador de URLs. ¿Qué es lo primero que debes hacer antes de dibujar cajas?"},"answer":{"en":"Step 1: clarify scale and read/write ratio, custom aliases, expiry, analytics needs. Step 2: estimate capacity from those numbers, e.g. reads likely outnumber writes heavily, favoring caching. Step 3: sketch components justified by step 2's numbers, discuss scaling and failure last.","es":"Paso 1: aclara la escala y la proporción lectura/escritura, alias personalizados, expiracion, necesidades de analítica. Paso 2: estima la capacidad a partir de esos números, ej. las lecturas probablemente superan por mucho a las escrituras, favoreciendo el caché. Paso 3: esboza componentes justificados por los números del paso 2, discute el escalado y la falla al final."},"related":["architecture-discovery","data-caching","cloud-scaling"],"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}],"level":"applied","learning":{"definition":{"en":"A system design interview asks you to design a system out loud, with the interviewer following how you reason rather than checking an answer key. What you want to show is requirement clarification, rough capacity estimation, a design justified by those numbers, and an honest discussion of failure modes and scaling limits.","es":"Una entrevista de diseño de sistemas te pide diseñar un sistema en voz alta, y el entrevistador sigue cómo razonas en lugar de comprobar una respuesta modelo. Lo que conviene mostrar es la aclaración de requisitos, la estimación aproximada de capacidad, un diseño justificado por esos números y una discusión honesta de los modos de fallo y los límites de escalado."},"simple":{"en":"Clarify, estimate, design, then break it on purpose. In that order, out loud.","es":"Aclara, estima, diseña y después rómpelo a propósito. En ese orden y en voz alta."},"analogy":{"en":"It resembles an oral examination where the working matters more than the final number, so saying why you rejected an option counts. The analogy is limited because an exam question has one intended solution, while a design prompt is deliberately underspecified and the questions you ask are part of the exercise.","es":"Se parece a un examen oral donde el desarrollo importa más que el resultado final, así que decir por qué descartaste una opción cuenta. La analogía es limitada porque una pregunta de examen tiene una solución prevista, mientras que un enunciado de diseño está deliberadamente incompleto y las preguntas que haces forman parte del ejercicio."},"walkthrough":{"en":["Spend the first minutes on requirements and non-goals. Ask what the system must do, what it explicitly does not need to do, how many users and requests are expected, the read to write ratio, and which consistency and latency expectations apply. Write the answers where both of you can see them and confirm them before drawing anything.","Turn those answers into rough numbers, then let the numbers narrow the components. A high read to write ratio makes a cache or read replicas worth considering, but only once you know the acceptable staleness and the likely hit rate, since a cache with a poor hit rate adds a component without removing load. A write heavy, simple key lookup pattern is worth testing against a key value store, though write volume alone does not settle it.","Sketch the design, then attack it yourself. Walk one request end to end, name what happens when each component fails, and state the first bottleneck you would hit at ten times the traffic. Finish with what you would measure to validate the design and which parts you would revisit first."],"es":["Dedica los primeros minutos a los requisitos y a los no objetivos. Pregunta qué debe hacer el sistema, qué explícitamente no necesita hacer, cuántos usuarios y solicitudes se esperan, la proporción entre lecturas y escrituras, y qué expectativas de consistencia y latencia aplican. Escribe las respuestas donde ambos las veáis y confírmalas antes de dibujar nada.","Convierte esas respuestas en números aproximados y deja que los números acoten los componentes. Una proporción alta de lecturas frente a escrituras hace que valga considerar una caché o réplicas de lectura, pero solo cuando conoces la desactualización aceptable y la tasa de acierto probable, ya que una caché con mala tasa de acierto añade un componente sin quitar carga. Un patrón de muchas escrituras con búsqueda simple por clave merece probarse contra un almacén de clave y valor, aunque el volumen de escritura por sí solo no lo resuelve.","Esboza el diseño y después atácalo tú mismo. Recorre una solicitud de principio a fin, nombra qué ocurre cuando falla cada componente y di cuál sería el primer cuello de botella con diez veces el tráfico. Termina con qué medirías para validar el diseño y qué partes revisarías primero."]},"pitfalls":{"en":["Naming AWS services before establishing the access pattern and scale. A service name is only an answer once the numbers make it the right answer.","Designing for a scale nobody asked for. Multi-Region traffic for a product with a thousand users needs a stated reason such as a data residency rule or a recovery objective, not an assumption that bigger is better."],"es":["Nombrar servicios de AWS antes de establecer el patrón de acceso y la escala. El nombre de un servicio solo es una respuesta cuando los números lo convierten en la respuesta correcta.","Diseñar para una escala que nadie pidió. El tráfico multirregión para un producto con mil usuarios necesita un motivo declarado, como una norma de residencia de datos o un objetivo de recuperación, no el supuesto de que más grande es mejor."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"}]}},{"id":"communication-tradeoffs","parent":"architecture","title":{"en":"Communicating Tradeoffs","es":"Comunicar compensaciones"},"summary":{"en":"Explain a recommendation, its alternatives and the consequences that matter to the audience.","es":"Explica una recomendación, sus alternativas y las consecuencias relevantes para la audiencia."},"details":{"en":["An SA's recommendations are a choice among options with tradeoffs, not one objectively correct answer. Communicating well means presenting real tradeoffs explicitly and adjusting depth to the audience.","Pitfall: giving the same pitch to engineers and executives, overwhelming one with irrelevant detail or under-informing the other."],"es":["Las recomendaciones de un SA son una eleccion entre opciones con compensaciones, no una única respuesta correcta. Comunicar bien significa presentar las compensaciones reales explicitamente y ajustar la profundidad a la audiencia.","Error común: dar el mismo discurso a ingenieros y ejecutivos, abrumando a uno con detalle irrelevante o subinformando al otro."]},"aws":{"en":"The Well-Architected review output (a prioritized risk and remediation list) is itself a template for honest, tradeoff-explicit communication.","es":"El resultado de la revisión Well-Architected (una lista priorizada de riesgo y remediación) es en si una plantilla para comunicación honesta y explícita en compensaciones."},"question":{"en":"You must present the same migration decision to engineering and to the CFO in the same week. How does each conversation differ?","es":"Debes presentar una migración a ingeniería y al CFO. ¿Cómo adaptarías la explicación sin cambiar los hechos?"},"answer":{"en":"Step 1: for engineering, lead with technical tradeoffs, architecture, sequencing and rollback plan. Step 2: for the CFO, lead with cost, risk and timeline, translating technical decisions into business consequence. Step 3: keep the underlying decision and numbers consistent across both, only framing and depth change.","es":"Paso 1: para ingeniería, lidera con las compensaciones técnicas, la arquitectura, la secuencia y el plan de reversion. Paso 2: para el CFO, lidera con el costo, el riesgo y el cronograma, traduciendo las decisiones técnicas a su consecuencia de negocio. Paso 3: manten la decisión y los números consistentes en ambas, solo cambian el enfoque y la profundidad."},"related":["architecture-discovery","cost-optimization"],"sources":[{"label":"AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}],"level":"foundation","learning":{"definition":{"en":"Communicating tradeoffs means presenting an architectural decision as a choice between options with stated consequences, instead of as the single correct answer. It includes naming what each option costs in money, risk, complexity and time, and adjusting the depth of the explanation to the audience without changing the underlying facts.","es":"Comunicar compensaciones significa presentar una decisión de arquitectura como una elección entre opciones con consecuencias declaradas, en lugar de como la única respuesta correcta. Incluye nombrar lo que cuesta cada opción en dinero, riesgo, complejidad y tiempo, y ajustar la profundidad de la explicación a la audiencia sin cambiar los hechos de fondo."},"simple":{"en":"Say what you would choose, why, and what you are giving up by choosing it.","es":"Di qué elegirías, por qué y a qué renuncias al elegirlo."},"analogy":{"en":"It works like a surveyor's report on a house: it gives a recommendation but also lists the defects and their likely cost, so the buyer decides with open eyes. The analogy is incomplete because a surveyor reports once, while an architect returns to the same customer repeatedly, so an overstated claim today damages the next conversations.","es":"Funciona como el informe de un tasador sobre una casa: da una recomendación pero también enumera los defectos y su coste probable, para que el comprador decida con los ojos abiertos. La analogía es incompleta porque un tasador informa una vez, mientras que un arquitecto vuelve al mismo cliente muchas veces, así que una afirmación exagerada hoy daña las conversaciones siguientes."},"walkthrough":{"en":["Frame the decision as options with consequences. Two or three genuinely different options, each with its cost, risk and operational burden, lets the customer see which constraint produces which difference. AWS itself frames the Well-Architected Framework as a way to understand the pros and cons of the decisions you make, which is the same posture.","Then adapt depth, not content. An engineering audience wants the architecture, the sequencing and the rollback plan. A finance audience wants cost, risk and timeline, with technical decisions translated into business consequence. The numbers and the recommendation must stay identical across both conversations, because the moment they differ, one of the two rooms will find out.","Be explicit about what you do not know. Stating an assumption, or saying that a figure needs validation with a test, reads as competence rather than weakness, and it protects the recommendation when a number turns out to be wrong. Close by agreeing who owns the decision, what will be measured, and when it will be reviewed."],"es":["Plantea la decisión como opciones con consecuencias. Dos o tres opciones realmente distintas, cada una con su coste, su riesgo y su carga operativa, permiten al cliente ver qué restricción produce cada diferencia. AWS mismo presenta el Well-Architected Framework como una forma de entender los pros y los contras de las decisiones que tomas, que es la misma postura.","Después adapta la profundidad, no el contenido. Una audiencia de ingeniería quiere la arquitectura, la secuencia y el plan de reversión. Una audiencia financiera quiere coste, riesgo y plazos, con las decisiones técnicas traducidas a consecuencia de negocio. Los números y la recomendación deben ser idénticos en ambas conversaciones, porque en el momento en que difieran, una de las dos salas se va a enterar.","Sé explícito con lo que no sabes. Declarar un supuesto, o decir que una cifra necesita validarse con una prueba, se lee como competencia y no como debilidad, y protege la recomendación cuando un número resulta equivocado. Cierra acordando quién es el dueño de la decisión, qué se va a medir y cuándo se revisará."]},"pitfalls":{"en":["Offering a false choice. Two options that differ only in name are worse than one honest recommendation, because they hide the real tradeoff.","Overclaiming certainty. Saying a design is secure, or that it cannot go down, invites exactly the question you cannot answer and costs you the credibility you needed later."],"es":["Ofrecer una elección falsa. Dos opciones que solo difieren en el nombre son peores que una recomendación honesta, porque esconden la compensación real.","Exagerar la certeza. Decir que un diseño es seguro, o que no puede caerse, invita justo a la pregunta que no puedes responder y te cuesta la credibilidad que necesitabas después."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/userguide/intro.html","label":"docs.aws.amazon.com: intro"}]}},{"id":"improve-reliability","parent":"well-architected","title":{"en":"Reliability: make it more resilient","es":"Fiabilidad: hacerla más resiliente"},"summary":{"en":"Five talking points for failures, recovery and availability.","es":"Cinco puntos para hablar de fallos, recuperación y disponibilidad."},"level":"applied","keywords":{"en":["resilient","resilience","reliable","reliability","high availability","fault tolerant"],"es":["resiliente","resiliencia","fiable","fiabilidad","alta disponibilidad","tolerancia a fallos"]},"details":{"en":["The five headings above are memory cues. Expand each point to connect a recommendation to an AWS concept, then adapt the spoken answer to the architecture and its constraints. They group practical ideas for study, not the exact official AWS design-principle list."],"es":["Los cinco títulos son pistas de memoria. Despliega cada punto para relacionar una recomendación con un concepto AWS y adapta la respuesta oral a la arquitectura y sus restricciones. Agrupan ideas prácticas de estudio, no la lista exacta de principios oficiales AWS."]},"aws":{"en":"Example: an ALB routes to stateless EC2 instances in an ASG across two AZs; a suitable RDS Multi-AZ deployment protects the database tier. SQS buffers asynchronous jobs. Configure health-based replacement, backups and a restore drill. Validate remaining capacity during AZ loss.","es":"Ejemplo: ALB enruta a EC2 sin estado en un ASG de dos AZ; un despliegue RDS Multi-AZ adecuado protege la base de datos. SQS amortigua trabajo asíncrono. Configurar sustitución según salud, backups y una prueba de restauración. Validar capacidad al perder una AZ."},"question":{"en":"Reliability: make it more resilient","es":"Fiabilidad: hacerla más resiliente"},"answer":{"en":"First I would clarify the failure scenarios and recovery objectives. I would remove single points of failure across the application and data tiers, configure automatic recovery, and isolate dependencies with queues and bounded, idempotent retries. I would protect the data with tested backups and add regional recovery only if required. Finally, I would simulate a failure and verify the recovery targets and cost.","es":"Primero aclararía los escenarios de fallo y los objetivos de recuperación. Eliminaría puntos únicos de fallo en aplicación y datos, configuraría recuperación automática y aislaría dependencias con colas y reintentos limitados e idempotentes. Protegería los datos con backups probados y añadiría recuperación regional solo si se necesita. Finalmente simularía un fallo y comprobaría los objetivos y el coste."},"related":["interview-playbooks","reliability","disaster-recovery"],"sources":[{"label":"AWS Well-Architected: Reliability","url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html","label":"docs.aws.amazon.com: disaster recovery dr objectives"}],"playbook":{"opener":{"en":"Which failures must we survive, and what availability, recovery time (RTO) and acceptable data loss (RPO) does the business require?","es":"¿Qué fallos debemos soportar y qué disponibilidad, tiempo de recuperación (RTO) y pérdida de datos aceptable (RPO) necesita el negocio?"},"points":[{"title":{"en":"Remove single points of failure","es":"Eliminar puntos únicos de fallo"},"body":{"en":"Spread compute across AZs behind a load balancer; check database, session state, egress and shared dependencies too. Two instances in the same AZ do not cover an AZ failure.","es":"Distribuir cómputo entre AZ detrás de un balanceador; revisar también base de datos, sesiones, salida y dependencias. Dos instancias en la misma AZ no cubren su caída."},"refs":["vpc","load-balancing","data-sql","sessions"]},{"title":{"en":"Detect failures and recover automatically","es":"Detectar fallos y recuperarse automáticamente"},"body":{"en":"Use meaningful health checks and configured replacement/failover. Define timeouts and safe rollback for bad deployments; measure service recovery, not just instance health.","es":"Usar health checks útiles y sustitución o conmutación configuradas. Definir timeouts y rollback seguro de despliegues; medir recuperación del servicio, no solo salud de instancias."},"refs":["cloud-scaling","observability"]},{"title":{"en":"Contain failures and absorb bursts","es":"Contener fallos y absorber picos"},"body":{"en":"Decouple suitable work with queues, isolate dependencies, and use bounded retries with backoff, jitter and idempotency. Scale within quotas and protect the database from overload.","es":"Desacoplar trabajo adecuado con colas, aislar dependencias y usar reintentos limitados con backoff, jitter e idempotencia. Escalar dentro de cuotas y proteger la base de datos de sobrecarga."},"refs":["cloud-queues-messaging","cloud-distributed-systems","http"]},{"title":{"en":"Protect data and plan disaster recovery","es":"Proteger datos y planificar recuperación"},"body":{"en":"Use versioning/backups and point-in-time recovery where supported; test restores. Add cross-Region recovery only when the required failure coverage and RPO/RTO justify the complexity.","es":"Usar versionado, backups y recuperación a un instante cuando se admitan; probar restauraciones. Añadir recuperación entre regiones cuando escenarios y RPO/RTO justifiquen la complejidad."},"refs":["disaster-recovery"]},{"title":{"en":"Prove the design under failure","es":"Demostrar el diseño ante fallos"},"body":{"en":"Run controlled failover and restore exercises with stop conditions. Measure availability, RTO/RPO and capacity after losing an AZ; document remaining risks and extra cost.","es":"Realizar pruebas controladas de conmutación y restauración con condiciones de parada. Medir disponibilidad, RTO/RPO y capacidad tras perder una AZ; documentar riesgos y coste adicional."},"refs":["reliability","observability"]}],"spoken":{"en":"First I would clarify the failure scenarios and recovery objectives. I would remove single points of failure across the application and data tiers, configure automatic recovery, and isolate dependencies with queues and bounded, idempotent retries. I would protect the data with tested backups and add regional recovery only if required. Finally, I would simulate a failure and verify the recovery targets and cost.","es":"Primero aclararía los escenarios de fallo y los objetivos de recuperación. Eliminaría puntos únicos de fallo en aplicación y datos, configuraría recuperación automática y aislaría dependencias con colas y reintentos limitados e idempotentes. Protegería los datos con backups probados y añadiría recuperación regional solo si se necesita. Finalmente simularía un fallo y comprobaría los objetivos y el coste."},"caution":{"en":"Do not say “Multi-AZ guarantees zero downtime” or prescribe multi-Region before asking about requirements. Replication is not a substitute for backups against logical corruption.","es":"No digas «Multi-AZ garantiza cero downtime» ni propongas multirregión sin requisitos. La replicación no sustituye backups ante corrupción lógica."}},"learning":{"definition":{"en":"The reliability lens on an existing design: whether the workload keeps performing its function and recovers when a component, a zone or a dependency fails. It is anchored on two business numbers, the Recovery Time Objective (RTO) for how long restoration may take and the Recovery Point Objective (RPO) for how much recent data may be lost.","es":"El enfoque de fiabilidad sobre un diseño existente: si la carga sigue cumpliendo su función y se recupera cuando falla un componente, una zona o una dependencia. Se ancla en dos números de negocio, el objetivo de tiempo de recuperación (RTO), cuánto puede tardar la restauración, y el objetivo de punto de recuperación (RPO), cuántos datos recientes se pueden perder."},"simple":{"en":"Find what is single, make it plural, make the switch automatic, then test the switch.","es":"Encuentra lo que está en singular, ponlo en plural, haz que el cambio sea automático y después prueba el cambio."},"analogy":{"en":"It is a fire drill rather than a fire extinguisher: owning the equipment proves nothing, walking the route proves something. The limit is that a building's exits do not change weekly, while a cloud workload does, so a drill result expires.","es":"Es un simulacro de incendio más que un extintor: tener el equipo no demuestra nada, recorrer la ruta sí. El límite es que las salidas de un edificio no cambian cada semana y una carga en la nube sí, así que el resultado de un simulacro caduca."},"walkthrough":{"en":["Open with the recovery question, because acceptable downtime and data loss decide how much redundancy is justified. An RPO of five minutes rules out a nightly backup. A one hour RTO does not automatically rule out rebuilding infrastructure, but that only holds if the rebuild is defined as infrastructure as code and has been timed end to end, so recommend the automation and the measurement together.","Then work the five points against the diagram: remove single points of failure across compute, data, session state and shared dependencies; detect failures and recover automatically with meaningful health checks; contain failures with queues, isolation and bounded retries using backoff and jitter; protect data with backups and point in time recovery where supported; and prove the design with a controlled failure exercise.","Name the tradeoff as you go. A second Availability Zone or a standby replica raises cost and adds operational work, and cross-Region recovery adds real complexity, so recommend it when the required failure coverage and recovery objectives justify it rather than by default."],"es":["Abre con la pregunta de recuperación, porque la indisponibilidad y la pérdida de datos aceptables deciden cuánta redundancia se justifica. Un RPO de cinco minutos descarta un respaldo nocturno. Un RTO de una hora no descarta automáticamente reconstruir la infraestructura, pero eso solo se sostiene si la reconstrucción está definida como infraestructura como código y se ha cronometrado de principio a fin, así que recomienda la automatización y la medición juntas.","Después recorre los cinco puntos sobre el diagrama: elimina los puntos únicos de fallo en cómputo, datos, estado de sesión y dependencias compartidas; detecta fallos y recupérate automáticamente con health checks significativos; contén los fallos con colas, aislamiento y reintentos limitados con backoff y jitter; protege los datos con respaldos y recuperación a un instante donde se admita; y demuestra el diseño con un ejercicio de fallo controlado.","Nombra la compensación mientras avanzas. Una segunda Zona de Disponibilidad o una réplica en espera suben el coste y añaden trabajo operativo, y la recuperación entre regiones añade complejidad real, así que recomiéndala cuando la cobertura de fallos necesaria y los objetivos de recuperación la justifiquen, no por defecto."]},"pitfalls":{"en":["Recommending multiple Regions as a default improvement. It is a large increase in cost and operational complexity, and it only belongs in the answer when the stated recovery objectives require it.","Counting redundancy that has never failed over. Until a drill has measured the recovery time and the remaining capacity, the availability claim is an assumption."],"es":["Recomendar varias regiones como mejora por defecto. Supone un gran aumento de coste y de complejidad operativa, y solo cabe en la respuesta cuando los objetivos de recuperación declarados lo exigen.","Contar una redundancia que nunca ha conmutado. Hasta que un simulacro haya medido el tiempo de recuperación y la capacidad restante, la afirmación de disponibilidad es un supuesto."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html","label":"docs.aws.amazon.com: design principles"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html","label":"docs.aws.amazon.com: disaster recovery dr objectives"}]}},{"id":"improve-security","parent":"well-architected","title":{"en":"Security: make it more secure","es":"Seguridad: hacerla más segura"},"summary":{"en":"Five talking points from identity to incident response.","es":"Cinco puntos desde identidad hasta respuesta a incidentes."},"level":"applied","keywords":{"en":["secure","security","more secure","protect","least privilege"],"es":["segura","seguro","seguridad","más segura","proteger","mínimo privilegio"]},"details":{"en":["The five headings above are memory cues. Expand each point to connect a recommendation to an AWS concept, then adapt the spoken answer to the architecture and its constraints. They group practical ideas for study, not the exact official AWS design-principle list."],"es":["Los cinco títulos son pistas de memoria. Despliega cada punto para relacionar una recomendación con un concepto AWS y adapta la respuesta oral a la arquitectura y sus restricciones. Agrupan ideas prácticas de estudio, no la lista exacta de principios oficiales AWS."]},"aws":{"en":"Example: expose an HTTPS ALB, keep application and database tiers private, allow only required SG-to-SG flows, use task/instance roles and managed secrets, and configure logging plus an incident runbook. Add WAF rules for relevant web threats and test false positives.","es":"Ejemplo: exponer ALB HTTPS, mantener aplicación y base de datos privadas, permitir solo flujos SG a SG necesarios, usar roles y secretos administrados y configurar logs y runbook. Añadir reglas WAF para amenazas pertinentes y probar falsos positivos."},"question":{"en":"Security: make it more secure","es":"Seguridad: hacerla más segura"},"answer":{"en":"I would start with data sensitivity and the threat model. I would reduce permissions using roles and temporary credentials, minimize public exposure, and protect data and secrets with suitable encryption and access policies. I would harden and scan the components we operate, then configure audit logs and detection with a rehearsed response plan. I would test that unauthorized requests fail while legitimate traffic still works.","es":"Empezaría por la sensibilidad de los datos y el modelo de amenazas. Reduciría permisos con roles y credenciales temporales, minimizaría exposición pública y protegería datos y secretos mediante cifrado y políticas adecuados. Reforzaría y analizaría los componentes que operamos y configuraría auditoría y detección con una respuesta ensayada. Probaría que se rechazan accesos no autorizados sin bloquear tráfico legítimo."},"related":["interview-playbooks","security","iam","encryption"],"sources":[{"label":"AWS Well-Architected: Security","url":"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}],"playbook":{"opener":{"en":"What data are we protecting, who needs access, and which threats and compliance requirements matter?","es":"¿Qué datos protegemos, quién necesita acceso y qué amenazas y requisitos de cumplimiento importan?"},"points":[{"title":{"en":"Start with identity and least privilege","es":"Empezar por identidad y mínimo privilegio"},"body":{"en":"Use federated access, MFA for people, workload roles and temporary credentials. Scope permissions to actions and resources; separate production duties and review unused access.","es":"Usar federación, MFA para personas, roles de carga y credenciales temporales. Acotar acciones y recursos, separar funciones de producción y revisar acceso sin uso."},"refs":["iam","security-governance"]},{"title":{"en":"Reduce exposure and layer controls","es":"Reducir exposición y combinar controles"},"body":{"en":"Expose only necessary entry points; keep internal tiers private and scope security groups. For web threats, consider WAF and DDoS controls. Private networking is not authorization.","es":"Exponer solo entradas necesarias; mantener componentes internos privados y acotar SG. Para amenazas web, considerar WAF y protección DDoS. Red privada no equivale a autorización."},"refs":["public-private","security-groups","private-connectivity"]},{"title":{"en":"Protect data and secrets","es":"Proteger datos y secretos"},"body":{"en":"Use TLS in transit and appropriate encryption at rest. Control keys and secret access, configure rotation and backups, and avoid secrets in code or logs.","es":"Usar TLS en tránsito y cifrado adecuado en reposo. Controlar claves y secretos, configurar rotación y backups y evitar secretos en código o logs."},"refs":["tls","encryption","secrets-management"]},{"title":{"en":"Harden and verify continuously","es":"Reforzar y verificar continuamente"},"body":{"en":"Patch components under your responsibility, scan dependencies and images, validate configuration as code, and test authorization boundaries. Apply safeguards without breaking required flows.","es":"Parchear componentes bajo tu responsabilidad, analizar dependencias e imágenes, validar configuración como código y probar límites de autorización. Aplicar controles sin romper flujos necesarios."},"refs":["security","security-governance","cloud-containers"]},{"title":{"en":"Detect, respond and rehearse","es":"Detectar, responder y ensayar"},"body":{"en":"Configure audit coverage, relevant data events and actionable detection. Assign incident ownership, rehearse containment and credential rotation, and preserve evidence.","es":"Configurar auditoría, eventos de datos pertinentes y detección accionable. Asignar responsable, ensayar contención y rotación y conservar evidencia."},"refs":["security-detection","observability"]}],"spoken":{"en":"I would start with data sensitivity and the threat model. I would reduce permissions using roles and temporary credentials, minimize public exposure, and protect data and secrets with suitable encryption and access policies. I would harden and scan the components we operate, then configure audit logs and detection with a rehearsed response plan. I would test that unauthorized requests fail while legitimate traffic still works.","es":"Empezaría por la sensibilidad de los datos y el modelo de amenazas. Reduciría permisos con roles y credenciales temporales, minimizaría exposición pública y protegería datos y secretos mediante cifrado y políticas adecuados. Reforzaría y analizaría los componentes que operamos y configuraría auditoría y detección con una respuesta ensayada. Probaría que se rechazan accesos no autorizados sin bloquear tráfico legítimo."},"caution":{"en":"Encryption alone does not make a system secure. A private subnet, WAF or an SCP does not replace application authorization. CloudTrail data events must be configured where required.","es":"El cifrado por sí solo no vuelve seguro un sistema. Subred privada, WAF o SCP no sustituyen autorización de aplicación. Configura eventos de datos CloudTrail cuando se necesiten."}},"learning":{"definition":{"en":"The security lens on an existing design: who is allowed to act, what is exposed to the network, how data and secrets are protected, and what happens when something goes wrong. The AWS security pillar frames this as meeting business and regulatory requirements by following current AWS recommendations.","es":"El enfoque de seguridad sobre un diseño existente: quién puede actuar, qué está expuesto a la red, cómo se protegen los datos y los secretos, y qué ocurre cuando algo va mal. El pilar de seguridad de AWS lo plantea como cumplir los requisitos de negocio y regulatorios siguiendo las recomendaciones actuales de AWS."},"simple":{"en":"Identity first, exposure second, data third, and assume you will have to investigate an incident later.","es":"Primero identidad, después exposición, después datos, y asume que más adelante tendrás que investigar un incidente."},"analogy":{"en":"Think of a building with door badges, internal doors and a visitor log, rather than one lock at the entrance. The limit: a cloud permission can be granted in one API call and reach thousands of resources, so the badge system itself needs monitoring.","es":"Piensa en un edificio con tarjetas de acceso, puertas internas y un registro de visitas, en vez de un solo cerrojo en la entrada. El límite: un permiso en la nube se concede con una sola llamada de interfaz y puede alcanzar miles de recursos, así que el propio sistema de tarjetas necesita vigilancia."},"walkthrough":{"en":["Ask first what data the workload handles and which regulations apply, because a system holding payment or health data is judged differently from one holding public catalogue text.","Then work the card's five points against the diagram: start with identity and least privilege, using federated access and workload roles with temporary credentials instead of long lived keys; reduce exposure and layer controls, keeping internal tiers private and scoping security groups, remembering that private networking is not authorization; protect data and secrets with encryption in transit and at rest, controlled keys and rotation; harden and verify continuously by patching what you own, scanning dependencies and images and testing authorization boundaries; and detect, respond and rehearse, with audit coverage, actionable detection, named incident ownership and a practised containment drill.","Name the cost of each control. A web application firewall rule set needs tuning against false positives, tighter permissions can break a deployment pipeline, and extra logging has a bill attached. That is stronger than describing a design as secure, a claim no architecture can support."],"es":["Pregunta primero qué datos maneja la carga y qué regulación aplica, porque un sistema con datos de pago o de salud se juzga de forma distinta de uno con texto de catálogo público.","Después recorre los cinco puntos de la ficha sobre el diagrama: empieza por identidad y mínimo privilegio, con acceso federado y roles de carga con credenciales temporales en vez de claves de larga duración; reduce la exposición y superpón controles, manteniendo privadas las capas internas y acotando los grupos de seguridad, recordando que una red privada no es autorización; protege datos y secretos con cifrado en tránsito y en reposo, claves controladas y rotación; endurece y verifica de forma continua parcheando lo que es tu responsabilidad, escaneando dependencias e imágenes y probando los límites de autorización; y detecta, responde y ensaya, con cobertura de auditoría, detección accionable, responsabilidad de incidentes asignada y un simulacro de contención practicado.","Nombra el coste de cada control. Un conjunto de reglas de firewall de aplicaciones web necesita ajuste frente a falsos positivos, unos permisos más estrictos pueden romper una canalización de despliegue y más registro lleva factura. Eso es más fuerte que describir un diseño como seguro, una afirmación que ninguna arquitectura puede sostener."]},"pitfalls":{"en":["Calling a design secure. Security is a set of controls against specific threats, and an absolute claim invites the one question you cannot answer.","Listing security services without connecting them to the diagram. A firewall or a key service only counts once you say which exposure or which data it protects here."],"es":["Llamar seguro a un diseño. La seguridad es un conjunto de controles frente a amenazas concretas, y una afirmación absoluta invita justo a la pregunta que no puedes responder.","Enumerar servicios de seguridad sin conectarlos al diagrama. Un firewall o un servicio de claves solo cuenta cuando dices qué exposición o qué datos protege aquí."]},"sourceUrls":[{"url":"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html","label":"docs.aws.amazon.com: welcome"},{"url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","label":"docs.aws.amazon.com: the pillars of the framework"}]}},{"id":"improve-performance","parent":"well-architected","title":{"en":"Performance: make it faster and scalable","es":"Rendimiento: hacerla más rápida y escalable"},"summary":{"en":"Five points for latency, capacity and measured bottlenecks.","es":"Cinco puntos para latencia, capacidad y cuellos de botella medidos."},"level":"applied","keywords":{"en":["faster","fast","performance","scalable","scale","latency"],"es":["rápida","rápido","rendimiento","escalable","escalar","latencia"]},"details":{"en":["The five headings above are memory cues. Expand each point to connect a recommendation to an AWS concept, then adapt the spoken answer to the architecture and its constraints. They group practical ideas for study, not the exact official AWS design-principle list."],"es":["Los cinco títulos son pistas de memoria. Despliega cada punto para relacionar una recomendación con un concepto AWS y adapta la respuesta oral a la arquitectura y sus restricciones. Agrupan ideas prácticas de estudio, no la lista exacta de principios oficiales AWS."]},"aws":{"en":"Example: trace a slow product page, optimize its database query, cache appropriate catalogue reads and static content, then load-test the ALB/application/database path including cache misses.","es":"Ejemplo: trazar una página lenta, optimizar su consulta, cachear lecturas de catálogo y estáticos adecuados y probar ALB/aplicación/base de datos incluyendo fallos de caché."},"question":{"en":"Performance: make it faster and scalable","es":"Rendimiento: hacerla más rápida y escalable"},"answer":{"en":"I would define the latency and throughput objectives, then trace the slow path. I would optimize unnecessary work, introduce caching only with clear freshness rules, and select compute and storage for the access pattern. I would scale stateless components while checking database and quota limits. Finally, I would load-test the complete system and compare tail latency, errors and unit cost.","es":"Definiría objetivos de latencia y capacidad y seguiría la ruta lenta. Optimizaría trabajo innecesario, añadiría caché con reglas claras de frescura y elegiría cómputo y almacenamiento según el acceso. Escalaría componentes sin estado comprobando base de datos y cuotas. Finalmente probaría el sistema completo y compararía latencia en percentiles altos, errores y coste unitario."},"related":["interview-playbooks","observability","cloud-scaling","data-caching"],"sources":[{"label":"AWS Well-Architected: Performance Efficiency","url":"https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html"},{"url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html","label":"docs.aws.amazon.com: aws xray"}],"playbook":{"opener":{"en":"What are the target p95/p99 latency, throughput and peak traffic, and where is time spent today?","es":"¿Qué latencia p95/p99, capacidad y picos se requieren y dónde se consume el tiempo hoy?"},"points":[{"title":{"en":"Measure the critical path","es":"Medir la ruta crítica"},"body":{"en":"Use traces and realistic load tests; distinguish CPU, memory, storage, database and network bottlenecks.","es":"Usar trazas y carga realista; distinguir límites de CPU, memoria, almacenamiento, base de datos y red."},"refs":["observability","troubleshooting"]},{"title":{"en":"Remove unnecessary work and distance","es":"Evitar trabajo y distancia innecesarios"},"body":{"en":"Optimize queries and payloads; cache suitable content near users with an explicit freshness and invalidation policy.","es":"Optimizar consultas y payloads; cachear contenido adecuado cerca del usuario con frescura e invalidación explícitas."},"refs":["data-caching","http"]},{"title":{"en":"Choose compute and data for the access pattern","es":"Elegir cómputo y datos según el acceso"},"body":{"en":"Benchmark instance families and memory settings; design indexes and partition keys. More vCPUs do not fix every bottleneck.","es":"Comparar familias y memoria; diseñar índices y claves de partición. Más vCPU no arregla todo cuello de botella."},"refs":["cloud-compute","data-nosql","data-sql"]},{"title":{"en":"Scale the whole request path","es":"Escalar toda la ruta"},"body":{"en":"Use stateless horizontal scaling and queues for asynchronous work. Check downstream capacity, connection pools, hot keys and service quotas.","es":"Usar escalado horizontal sin estado y colas para trabajo asíncrono. Comprobar capacidad posterior, conexiones, claves calientes y cuotas."},"refs":["cloud-scaling","cloud-queues-messaging"]},{"title":{"en":"Prove improvement at realistic cost","es":"Demostrar mejora con coste realista"},"body":{"en":"Compare p95/p99, throughput and errors before/after under representative load. Include burst behavior, freshness and cost per transaction.","es":"Comparar p95/p99, capacidad y errores antes/después con carga representativa. Incluir picos, frescura y coste por transacción."},"refs":["cost-optimization","observability"]}],"spoken":{"en":"I would define the latency and throughput objectives, then trace the slow path. I would optimize unnecessary work, introduce caching only with clear freshness rules, and select compute and storage for the access pattern. I would scale stateless components while checking database and quota limits. Finally, I would load-test the complete system and compare tail latency, errors and unit cost.","es":"Definiría objetivos de latencia y capacidad y seguiría la ruta lenta. Optimizaría trabajo innecesario, añadiría caché con reglas claras de frescura y elegiría cómputo y almacenamiento según el acceso. Escalaría componentes sin estado comprobando base de datos y cuotas. Finalmente probaría el sistema completo y compararía latencia en percentiles altos, errores y coste unitario."},"caution":{"en":"Caching can return stale data, and read replicas do not solve write bottlenecks. Auto Scaling is not instantaneous or unlimited.","es":"La caché puede devolver datos antiguos y las réplicas de lectura no resuelven límites de escritura. Auto Scaling no es instantáneo ni ilimitado."}},"learning":{"definition":{"en":"The performance efficiency lens on an existing design: whether resources meet demand efficiently and whether latency and throughput are measured rather than assumed. The AWS performance efficiency pillar is about delivering sustained performance as demand and technology change.","es":"El enfoque de eficiencia del rendimiento sobre un diseño existente: si los recursos atienden la demanda con eficiencia y si la latencia y el rendimiento se miden en lugar de suponerse. El pilar de eficiencia del rendimiento de AWS trata de entregar un rendimiento sostenido a medida que cambian la demanda y la tecnología."},"simple":{"en":"Measure where the time goes before changing anything, then remove the one bottleneck that is actually slow.","es":"Mide a dónde se va el tiempo antes de cambiar nada y después elimina el único cuello de botella que de verdad es lento."},"analogy":{"en":"It is like widening the narrowest point of a road rather than every junction, because traffic only improves where the queue forms. The limit: removing one bottleneck usually reveals the next, so performance work is iterative.","es":"Es como ensanchar el punto más estrecho de una carretera en vez de todos los cruces, porque el tráfico solo mejora donde se forma la cola. El límite: eliminar un cuello de botella suele revelar el siguiente, así que el trabajo de rendimiento es iterativo."},"walkthrough":{"en":["Ask which operation is slow, for which users, and what the target is. Latency at a high percentile such as p99 is the useful number, because an average hides the slow tail that generates complaints.","Then work the five points against the diagram: measure and trace to locate the real bottleneck; look at the data access path, since an unindexed or chatty query is a frequent cause and worth checking before resizing servers; cache data that is reused, deciding its acceptable staleness and how it is invalidated, noting that personalised responses can be cached privately when scoped to the right user; scale horizontally where the component is stateless; and load test the whole path including cache misses and cold starts.","Avoid blanket claims. A cache pays off mainly for data that is reused, so a low hit rate adds a component and a staleness risk without removing load. A content delivery network is not only for static files: it also shortens the network path and terminates connections closer to the user, which helps dynamic responses too. Say which part of the traffic each change affects."],"es":["Pregunta qué operación es lenta, para qué usuarios y cuál es el objetivo. La latencia en un percentil alto como p99 es el número útil, porque una media esconde la cola lenta que genera las quejas.","Después recorre los cinco puntos sobre el diagrama: mide y traza para localizar el cuello de botella real; revisa la ruta de acceso a datos, ya que una consulta sin índice o demasiado charlatana es una causa frecuente y conviene comprobarla antes de agrandar servidores; cachea los datos que se reutilizan, decidiendo su desactualización aceptable y cómo se invalidan, teniendo en cuenta que las respuestas personalizadas se pueden cachear de forma privada cuando se acotan al usuario correcto; escala horizontalmente donde el componente no tenga estado; y prueba la carga de todo el recorrido incluyendo fallos de caché y arranques en frío.","Evita las afirmaciones absolutas. Una caché rinde sobre todo con datos que se reutilizan, así que una tasa de acierto baja añade un componente y un riesgo de desactualización sin quitar carga. Una red de distribución de contenido no sir
